# ci — гейт КОДА этого репозитория: сборка, пробы, линт, безопасность, миграции.
#
# Он больше НЕ единственный, и это надо было сказать здесь же: сквозной набор и
# автономный подъём службы судит `e2e-newman.yml`. Фраза «единственный гейт»
# верна была ровно до его заведения, а прочитать её после можно только как
# «остального не проверяют» — то есть шире, чем есть.
#
# Служба вынесена из монорепо `PRO-Robotech/kacho` отдельным публикуемым
# репозиторием. Всё, чем «сборка вне дерева» доказывалась до сих пор,
# исполнялось В МОНОРЕПО: по опубликованному артефакту не прогонялось НИЧЕГО —
# `.github/` здесь не было ни одним файлом, и это не следствие исключения в
# `.gitignore` (`git check-ignore .github/workflows/ci.yml` не находит правила,
# `git status --ignored` не показывает скрытых файлов). Отсутствие конвейера
# означало, что вердикт об артефакте выносился по ДРУГОМУ дереву.
#
# Перечень проверок выведен из приставных шагов монорепо для этой службы, а не
# выписан по памяти. Там она проверяется ОТДЕЛЬНЫМИ прогонами, потому что несёт
# свой `go.mod`: корневой `./...` в неё не спускается, и без второго прогона
# задание осталось бы зелёным, перестав проверять службу вовсе. Здесь модуль
# службы и ЕСТЬ корень, поэтому «второй прогон» становится единственным.
#
# ВЕРСИИ ИНСТРУМЕНТОВ ВЗЯТЫ ИЗ ОБЪЯВЛЕНИЙ МОНОРЕПО, а не из того, что стоит в
# системе: golangci-lint v2.12.2 и gosec v2.28.0. Расхождение версии даёт
# вердикт о другом — новый релиз добавляет правило, и ствол краснеет на коммите,
# который ничего не трогал, а воспроизвести это локально нельзя вовсе.
#
# КЭША ЗДЕСЬ НЕ ЗАВОДИТСЯ РУКАМИ — НАМЕРЕННО. Рукописный кэш обязан нести в
# условии сохранения функцию состояния (`always()`, `!cancelled()`), иначе
# прогон, упавший на шаге, чью предпосылку он кэширует, наполнить кэш не может
# ПО ПОСТРОЕНИЮ: кэш наполнит только тот прогон, которому он не был нужен.
# Класс закрыт тем, что предмета у него нет: кэш модулей ведёт `actions/setup-go`
# своим шагом, а своего мы не добавляем.
name: ci

on:
  # Сужено по ветке НАМЕРЕННО. Несуженный `on:` покрывает все ветки сразу, и
  # тогда каждое вливание в накопительную линию оплачивается полным прогоном —
  # то есть режим, заводимый ради экономии ранеров, экономии не даёт.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# СТАТУС НЕ ТЕРЯЕТСЯ В ТРУБЕ. Умолчание для `run:` — `bash -e {0}`, то есть БЕЗ
# pipefail: `<проверка> | tee` отдаёт шагу код ПРАВОЙ команды и зеленеет при
# любом провале левой. `shell: bash` включает `-eo pipefail`.
#
# `-e` при этом остаётся, и это связывает КАЖДЫЙ шаг ниже: ненулевой код
# обрывает шаг МОЛЧА, до любой развилки. Поэтому код возврата берётся как
# ДАННЫЕ (`cmd || rc=$?`), а вся логика, у которой есть развилка, вынесена в
# скрипты `.github/scripts/` — ветку внутри шага нечем доказать инъекцией.
defaults:
  run:
    shell: bash

jobs:
  # ── СБОРКА · VET · ФОРМАТ ────────────────────────────────────────────────────
  build:
    name: сборка · vet · gofmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Полная история: часть проб дерева судит принадлежность ревизий этой
          # истории, и на мелком клоне они меряли бы не то. Репозиторий невелик,
          # цена — секунды.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod download
        run: go mod download

      - name: сборка
        run: go build ./...

      - name: vet
        run: go vet ./...

      # Пробы под тегом `integration` в обычную сборку НЕ ПОПАДАЮТ: быстрый
      # прогон идёт с `-short`, контейнерный — отдельным заданием. Без этой
      # строки файл под `//go:build integration` не проверялся бы на
      # собираемость НИ В ОДНОМ шаге и мог бы годами не компилироваться молча.
      - name: vet под тегом integration (иначе тегированное не проверяется нигде)
        run: go vet -tags=integration ./...

      - name: gofmt
        run: |
          # Обход идёт по ИНДЕКСУ git, а не по диску: иначе в перепись попадут
          # игнорируемые каталоги и кэши сборки.
          #
          # ИСКЛЮЧЕНИЯ ДЛЯ СГЕНЕРЁННЫХ СТАБОВ ЗДЕСЬ НЕТ, И ЭТО ЗАМЕР, А НЕ
          # НЕДОСМОТР — но замер СМЕНИЛСЯ, и прежняя редакция этого абзаца
          # держалась на числе, которого больше нет.
          #
          # Она говорила: стабов в дереве НОЛЬ, потому что они приезжают
          # зависимостью платформы. Решением владельца 2026-09-13 контракты
          # службы уехали в этот репозиторий (kacho#2616), и предикат
          # `git ls-files '*.go' | grep -cE '\.pb\.go$'` даёт теперь 87 при
          # 2372 файлах Go.
          #
          # Исключение при этом по-прежнему НЕ ЗАВОДИТСЯ, и основание у отказа
          # другое: стабы форматирует сам генератор, поэтому предмета у
          # послабления нет. Проверено прогоном над полным индексом — 0
          # неотформатированных при 87 стабах. Заведи исключение — и первый
          # рукописный файл, положенный рядом со стабами, перестанет
          # проверяться молча.
          files=$(git ls-files '*.go')
          if [ -z "$files" ]; then
            echo "ОТКАЗ: обход пуст — ни одного файла Go не прочитано." >&2
            echo "«Ноль неотформатированных» здесь означало бы «ноль прочитанного»." >&2
            exit 1
          fi
          echo "прочитано файлов Go: $(printf '%s\n' "$files" | wc -l)"
          unformatted=$(gofmt -l $files || true)
          if [ -n "$unformatted" ]; then
            echo "требуется gofmt:"; echo "$unformatted"; exit 1
          fi
          echo "ЗЕЛЁНЫЙ: неотформатированных нет."

  # ── ЮНИТЫ ───────────────────────────────────────────────────────────────────
  unit:
    name: пробы -race -short (числовой вердикт)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download

      # ПРОГОНЩИК ВЫНОСИТ ЧАСТЬ ВЕРДИКТА, значит его способность УПАСТЬ обязана
      # быть доказана ДО того, как его вердикту поверят: иначе он сам стал бы
      # формой без содержания — тем самым классом, ради которого заведён.
      # Инъекция идёт по каждой оси в ОБЕ стороны, включая законных близнецов.
      - name: прогонщик вердикта способен упасть (самопроба инъекцией)
        run: python3 .github/scripts/go-test-verdict.py --self-test

      # `-short` ОБЯЗАТЕЛЕН: без него сюда затягиваются контейнерные пробы,
      # поднимающие Postgres на каждом пакете, и задание упирается в предел
      # времени. Контейнерные гоняет отдельное задание ниже.
      #
      # Код `go test` берётся ДАННЫМИ: под `-e` ненулевой оборвал бы шаг до
      # прогонщика, и вердикта — числа исполненного, отказов и пропущенного —
      # не было бы вовсе. Роняет шаг ПРОГОНЩИК, а не `go test`.
      - name: пробы (-race -short)
        run: |
          rc=0
          go test ./... -race -short -count=1 -timeout 25m -json > test.json 2>&1 || rc=$?
          echo "go test завершился с кодом $rc (вердикт выносит прогонщик ниже)"
          python3 .github/scripts/go-test-verdict.py < test.json

  # ── ЛИНТ ────────────────────────────────────────────────────────────────────
  lint:
    name: golangci-lint (пин v2.12.2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true

      # `go install`, а НЕ готовый бинарь действия: предсобранный собран чужим
      # toolchain'ом, и если он старше нашего `go.mod`, линтер отказывается
      # работать. Сборка нашим же toolchain'ом делает этот рассинхрон
      # невозможным. Версия запинена — с `@latest` новые правила прилетают сами
      # и роняют ствол без единой правки кода.
      - name: установка golangci-lint нашим toolchain'ом
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: golangci-lint
        env:
          # Кэш линтера — В РАБОЧЕЙ КОПИИ этого задания. Умолчание общее на
          # машину, а запись в нём ключуется содержимым пакета, не деревом: где
          # рабочих копий одного модуля больше одной, прогон возвращает разбор
          # ЧУЖИХ файлов — с чужими путями, мимо якорных исключений конфига.
          GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.cache/golangci-lint
        run: golangci-lint run --timeout=10m --config=.github/golangci.yml

  # ── КОНТРАКТЫ ────────────────────────────────────────────────────────────────
  #
  # Задание заведено вместе с предметом: до решения владельца 2026-09-13
  # (kacho#2616) контрактов в этом дереве не было, заглушки приезжали
  # зависимостью платформы, и проверять было нечего.
  #
  # ЧТО ОНО УТВЕРЖДАЕТ. Контракты службы компилируются в ЕЁ репозитории — то
  # есть посторонний, клонировавший один этот репозиторий, соберёт их у себя.
  # Гейт дерева `internal/contracthome` судит то же свойство РАЗБОРОМ графа
  # импортов и идёт в каждом прогоне проб; здесь добавляется вердикт самого
  # компилятора, которого разбор дать не может.
  #
  # ОГОВОРКА «`buf breaking` ЗДЕСЬ НЕТ» ИСТЕКЛА ВМЕСТЕ СО СВОИМ ПРЕДМЕТОМ.
  # Она стояла по верной причине: база сравнения — ствол, а каталога `proto/` в
  # стволе ещё не было, и шаг отвечал бы «подкаталога не существует» КАЖДЫЙ
  # прогон — красным по построению, а не по предмету. Каталог влит, и адъюдикация
  # заведена ниже (kaname#35).
  proto:
    name: контракты — buf lint · стабы в синхроне
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          # cache: false — ОСОЗНАННО. `go.mod` несёт директиву toolchain, поэтому
          # setup-go скачивает тулчейн, а восстановление кэша распаковывает его
          # же поверх — tar падает на существующих файлах, и джоба мигает так,
          # будто «CI флакает». Терять тут нечего: вся сборка Go в этой джобе —
          # три плагина генерации, которые объявление зовёт через `go run`.
          cache: false

      # Пин buf влияет И на правила линта, И на состав дескрипторов, то есть на
      # содержимое `pkg/api`. Версия та же, что у платформы, из чьего объявления
      # набор правил перенесён дословно: разъезд версий давал бы находки,
      # неотличимые от находок переезда.
      #
      # github_token ОБЯЗАТЕЛЕН: без него действие берёт релиз buf
      # неаутентифицированно, а квота такого запроса общая на IP ранера. При
      # нескольких параллельных прогонах она исчерпывается, действие падает, и
      # шаги ниже получают статус skipped — джоба красная по причине, к предмету
      # проверок отношения не имеющей. Это третья категория исхода, поданная как
      # вердикт.
      - uses: bufbuild/buf-setup-action@3e33fea8596569a62fcaa33eb3880b6ac7098941  # v1.9.0
        with:
          version: 1.72.0
          github_token: ${{ github.token }}

      - name: buf lint
        working-directory: proto
        run: buf lint

      # АДЪЮДИКАЦИЯ, А НЕ ГОЛЫЙ `buf breaking`.
      #
      # Голый верен ровно до первого ОСОЗНАННОГО разрыва: тогда шаг красен по
      # построению, и остаются два плохих хода — снять шаг (потерять защиту от
      # случайных разрывов на всём дереве ради одного объявленного) либо внести
      # файл в `breaking.ignore` (послабление без предмета и без срока,
      # ослепляющее проверку на целом файле НАВСЕГДА).
      #
      # Разрыв проходит только через `proto/declared-breaks.yaml`, и запись живёт
      # ровно пока у неё есть предмет: находка вне перечня — красное, запись без
      # находки — ТОЖЕ красное.
      #
      # КОД ВОЗВРАТА `buf` РАЗБИРАЕТСЯ, А НЕ ПРОГЛАТЫВАЕТСЯ: 100 — «есть находки»
      # (штатный вход адъюдикатора), 0 — «разрывов нет», ЛЮБОЙ ДРУГОЙ — гейт не
      # сделал своей работы, и это отдельный исход. Иначе сетевой отказ читался бы
      # как «разрывов нет».
      #
      # ШАГ НЕ СУЖЕН СОБЫТИЕМ, И ЭТО НЕСУЩЕЕ СВОЙСТВО. Предмет записи перечня
      # истекает не тогда, когда правят контракт, а тогда, когда ветка ВЛИВАЕТСЯ:
      # база сравнения поднимается, и разрыв становится историей. Сузи шаг до
      # `pull_request` — и проверка не смотрела бы ровно туда, где её предмет и
      # истекает: ствол был бы зелен не оттого, что перечень чист, а оттого, что
      # там его никто не спрашивает. У платформы этот класс повторился четыре
      # раза именно так. На стволе содержательное утверждение ровно одно:
      # ПЕРЕЧЕНЬ ПУСТ — и это его нормальное состояние.
      #
      # Свойство «шаг не сужен событием» держит проба
      # `tools/declaredbreak` TestGateRunsWhereItsSubjectExpires, а не этот
      # комментарий.
      - name: adjudicate breaking (vs main)
        run: |
          set -uo pipefail
          go build -o "$RUNNER_TEMP/adjudicate" ./tools/declaredbreak/cmd/adjudicate-declared-breaks
          cd proto
          set +e
          buf breaking \
            --against "https://github.com/${{ github.repository }}.git#branch=main,subdir=proto" \
            --error-format=json > "$RUNNER_TEMP/buf-breaking.jsonl" 2>"$RUNNER_TEMP/buf-breaking.err"
          rc=$?
          set -e
          case "$rc" in
            0|100) ;;
            *)
              echo "::error title=ГЕЙТ НЕ СДЕЛАЛ СВОЕЙ РАБОТЫ::buf breaking вышел кодом $rc — это НЕ «разрывов нет»"
              cat "$RUNNER_TEMP/buf-breaking.err" >&2 || true
              exit 2
              ;;
          esac
          cd ..
          "$RUNNER_TEMP/adjudicate" proto/declared-breaks.yaml < "$RUNNER_TEMP/buf-breaking.jsonl"

      # Стабы закоммичены → они ОБЯЗАНЫ совпадать с .proto. Иначе кто-то правил
      # порождённое руками (что вдобавок бьёт rawDesc) либо забыл
      # перегенерировать после правки контракта.
      #
      # ПЛАГИНЫ ЗДЕСЬ НЕ СТАВЯТСЯ, И ЭТО НЕ УПУЩЕНИЕ: объявление генерации зовёт
      # каждый через `go run <пакет>`, то есть берёт версию из go.mod в момент
      # вызова (`tools/generators.go` держит их в графе модуля). Предустановка в
      # PATH ничего не добавила бы — её копия не будет исполнена.
      - name: generate-diff (стабы в синхроне с .proto)
        run: make proto-gen-diff

  # ── ПОСАДКА У АРЕНДАТОРА ────────────────────────────────────────────────────
  #
  # ПОЧЕМУ ОТДЕЛЬНОЕ ЗАДАНИЕ, А НЕ ШАГ В `unit`. Проба собирает клон из состава
  # коммита и зовёт в нём каждую непомеченную цель рецепта, поэтому пропускается
  # под `-short` — а `unit` гоняет пробы ИМЕННО с `-short` (без него туда
  # затягиваются контейнерные). То есть проба, судящая цель `test-standalone`,
  # была исключена из единственного прогона, который её гонял: её красное не
  # наблюдалось никем, и «ноль находок» у конвейера было неотличимо от «не
  # исполнялось». Красное на стволе простояло без владельца (#43).
  #
  # УСЛОВИЕ СОЗДАЁТ САМО ЗАДАНИЕ, и это не удобство. Цели `proto-*` зовут
  # `require_buf`, а тот при отсутствии buf выходит кодом 2 со словами «условие
  # не создано». До гейта этот код НЕ ДОЕЗЖАЕТ различимым: `make` схлопывает
  # любой отказ рецепта в свою собственную двойку, поэтому «цель отказала» и
  # «инструмента нет» приходят одним числом. Разделить их числом нечем — значит
  # предпосылку обязана создать job, иначе гейт назовёт находкой о продукте
  # отсутствие инструмента на ранере.
  #
  # helm здесь НЕ ставится, и это тоже решение: `deploy/render-guard.sh` без
  # ручки полосы считает отсутствие helm третьим исходом и выходит нулём —
  # то есть предпосылку он назначает сам, и подменять её установкой не надо.
  standalone:
    name: цели рецепта работают в самостоятельном клоне
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true

      # Пин тот же, что у задания контрактов: разъезд версий дал бы находки,
      # неотличимые от находок посадки. github_token — по той же причине, что
      # там: неаутентифицированная квота общая на IP ранера.
      - uses: bufbuild/buf-setup-action@3e33fea8596569a62fcaa33eb3880b6ac7098941  # v1.9.0
        with:
          version: 1.72.0
          github_token: ${{ github.token }}

      - run: go mod download

      # `-short` НЕ ПЕРЕДАЁТСЯ намеренно: под ним проба пропускает себя, и
      # задание стало бы зелёным, ничего не спросив.
      - name: цели рецепта в самостоятельном клоне (без -short)
        run: go test ./tools/standalonetargets/ -count=1 -v -timeout 25m

  # ── СТАТИЧЕСКИЙ АНАЛИЗ БЕЗОПАСНОСТИ ──────────────────────────────────────────
  gosec:
    name: gosec (пин v2.28.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: установка gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0

      - name: гейт gosec способен упасть (самопроба инъекцией)
        run: .github/scripts/gosec-gate.sh --self-test

      # `-stdout -verbose text` — НЕ косметика: SARIF не несёт ПЕРЕПИСИ
      # осмотренного, а без переписи «ноль находок» неотличимо от «ноль
      # прочитанного». Сканер, не сумевший собрать дерево, пишет отчёт
      # ПОБАЙТОВО такой же, как у чистого дерева. Текстовая сводка отвечает на
      # оба вопроса, на которые SARIF не отвечает: `Golang errors in file:`
      # (дерево не загрузилось) и `Files : N` (сколько прочитано).
      #
      # Флага `-tests` нет — как и в монорепо: тесты не поставляются, а харнесс
      # по своей природе делает ровно то, на что правила срабатывают. Включать
      # его молча нельзя: это мгновенно красный гейт, «починка» которого свелась
      # бы к массовым подавлениям.
      #
      # `-exclude-dir=pkg/api` ВЕРНУЛСЯ ВМЕСТЕ СО СВОИМ ПРЕДМЕТОМ.
      #
      # Здесь стояло: «монорепо здесь НЕ повторяется: сгенерённые стабы приезжают
      # зависимостью платформы и в этом дереве не лежат». Утверждение пережило свой
      # предмет 2026-09-13 — решением владельца контракты службы уехали сюда
      # (kacho#2616), и стабов в дереве стало 87.
      #
      # ЧТО ИМЕННО ИСКЛЮЧАЕТСЯ, И ПОЧЕМУ ЭТО НЕ ПОСЛАБЛЕНИЕ. Правило G101
      # (CWE-798, «potential hardcoded credentials») срабатывает на константах
      # `*_FullMethodName`, порождённых транспортом: их значение — ПУТЬ RPC вида
      # `/kaname.cloud.iam.v1.UserTokenService/Revoke`, а находкой он становится
      # из-за подстроки `Token`/`Credential` в ИМЕНИ константы. Секрета в этих
      # строках нет ни одного, подавить их в источнике нельзя (файл порождается,
      # `#nosec` уехал бы при следующей генерации), а переименовать RPC ради
      # эвристики линтера значит сломать контракт.
      # ЗАМЕР ТЕМ ЖЕ ПИНОМ (v2.28.0), одно дерево, различие только во флаге:
      #
      #   без флага   файлов 784 · строк 196523 · находок 164
      #               (G101 level=error 6 · G103 level=warning 158)
      #   с флагом    файлов 697 · строк 148932 · находок   0 — гейт ЗЕЛЁНЫЙ
      #
      # Порог гейта — level=error, то есть его ронял ровно шестикратный G101 на
      # порождённых константах. Цена исключения названа числом: из сканирования
      # уходят 87 файлов и 47 591 строка, и ни одной рукописной среди них.
      #
      # ГРАНИЦА НАЗВАНА: исключается РОВНО каталог порождённого, и рукописного кода
      # в нём нет — это держит гейт дерева `internal/contracthome`
      # TestGenerationProducesOnlyThisServicesOwnContracts (под `pkg/api`
      # порождается только собственный корень контрактов) вместе с
      # `make proto-gen-diff` (всё содержимое каталога воспроизводится генерацией).
      # Положи туда рукописный файл — и он выпадет из сканирования молча; поэтому
      # оба гейта и стоят.
      #
      # Формулировка флага перенесена из монорепо дословно (`scripts/gosec-scan-
      # modules.sh`), включая довод: флаг называет СВОЙСТВО каталога, а не адрес.
      - name: прогон gosec
        run: |
          rc=0
          gosec -exclude-dir=pkg/api -stdout -verbose text -fmt sarif -out gosec.sarif ./... \
            | tee gosec-summary.txt || rc=$?
          # Код возврата gosec вердиктом НЕ является: он ненулевой и при
          # находках ниже порога, то есть отвечает на другой вопрос. Вердикт
          # выносит гейт следующим шагом — по SARIF и по переписи.
          echo "gosec завершился с кодом $rc (вердикт выносит гейт ниже)"

      - name: гейт (level=error, с отличением несостоявшегося сканирования)
        run: .github/scripts/gosec-gate.sh gosec.sarif gosec-summary.txt

      # Отчёт сохраняется ВСЕГДА: на красном он и нужен. SARIF в раздел
      # безопасности НЕ выгружается намеренно — приём кода-сканирования зависит
      # от плана репозитория, и его отсутствие приходило бы отказом задания,
      # неотличимым от находки. Это «условие не создано», и подавать его красным
      # значило бы посылать читателя чинить то, что не сломано.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: gosec-report
          path: |
            gosec.sarif
            gosec-summary.txt
          if-no-files-found: warn

  # ── КОНТЕЙНЕРНЫЕ ПРОБЫ ──────────────────────────────────────────────────────
  integration:
    name: интеграция (Postgres в контейнерах)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download

      - name: классификатор исхода способен упасть (самопроба инъекцией)
        run: .github/scripts/classify-integration-outcome.sh --self-test

      - name: контейнерные пробы
        env:
          # Уборщик контейнеров на ЭФЕМЕРНОМ исполнителе не нужен: машина
          # исчезает целиком вместе со всем, что на ней поднято. Зато его
          # собственный подъём — сетевой шаг, и его неудача роняет пробы, у
          # которых вердикта не было вовсе.
          TESTCONTAINERS_RYUK_DISABLED: "true"
          INTEGRATION_TIMEOUT: 30m
        run: |
          # ИСХОДОВ ТРИ, и шаг их различает. Код 75 — «условие не создано»:
          # Postgres не поднялся, вердикта нет НИ У ОДНОЙ пробы, включая
          # успевшие пройти. Красным это подавать нельзя — читатель идёт искать
          # дефект в коде, которого нет; зелёным тем более нельзя — не
          # исполнено ничего. Отсюда свой текст и НЕНУЛЕВОЙ исход.
          rc=0
          .github/scripts/run-integration.sh || rc=$?
          if [ "$rc" -eq 75 ]; then
            echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::Postgres для контейнерных проб не поднялся — прогон недействителен, это не дефект кода. Повторить после устранения причины."
            exit 1
          fi
          exit "$rc"

  # ── СУЖЕНИЕ СПИСОЧНОЙ ПОВЕРХНОСТИ ───────────────────────────────────────────
  #
  # Приставной шаг монорепо для этой службы (`make -C services/iam
  # audit-list-filter` в цикле по семи сервисам) — блокирующий там и
  # блокирующий здесь.
  #
  # ЗОВЁТСЯ СКРИПТ, А НЕ ЦЕЛЬ `make`, И ДОВОД ЗДЕСЬ ПЕРЕМЕРЕН, А НЕ УНАСЛЕДОВАН.
  #
  # Прежний довод — «`make` отказывает ПЕРВОЙ СТРОКОЙ: include несуществующего
  # пути» — ПЕРЕЖИЛ СВОЙ ПРЕДМЕТ: рецепт чинен, `include provenance.mk`
  # резолвится в этом дереве, и `make -n audit-list-filter` отвечает кодом 0
  # единственной строкой `./tools/audit-list-filter.sh`. Оставить его значило бы
  # объяснять действующее решение условием, которого нет.
  #
  # Действующий довод ОДИН и от посадки не зависит: цель однострочна и делегирует
  # ровно в `./tools/audit-list-filter.sh`. Значит конвейер зовёт ТОТ ЖЕ
  # исполняемый файл, что и разработчик, и второго источника истины о команде не
  # заводится. Пометка `[монорепо]` с цели снята вместе с `require_tree`: её
  # операнд — каталог контрактов — живёт теперь в этом дереве, поэтому цель
  # исполнима и у арендатора, и это замерено прогоном в клоне из состава коммита.
  listfilter:
    name: listauthz — списочные методы сужены по объекту
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true
      # Модуль платформы тянется ЯВНО: `go list -m` его не скачивает, и без этого
      # шага проверка выходит кодом 2 («не исполнялась»), а не вердиктом о дереве.
      # Соседние джобы этого конвейера тянут модули тем же шагом.
      - run: go mod download
      - name: audit-list-filter
        run: ./tools/audit-list-filter.sh

  # ── СУДЬИ, У КОТОРЫХ БЫЛО ПО НУЛЮ ВЫЗЫВАЮЩИХ ───────────────────────────────
  #
  # Обе цели ниже поднимают ЕДИНСТВЕННОГО судью своей оси, и до задачи #17 их не
  # звал никто: ось, которую судит только такая цель, не встречала ни одной
  # автоматической проверки, а молчание было неотличимо от исправной работы.
  # Что провязка не исчезнет снова незаметно, держат гейты дерева
  # internal/check/module_manifest_check_wiring_test.go и
  # internal/check/model_canon_check_wiring_test.go: они выводят из дерева и «кто
  # объявляет цель», и «кто её зовёт», сверяют в обе стороны и читают РАЗОБРАННЫЙ
  # YAML — иначе зеленели бы на этом самом комментарии, который цели называет.
  authzartifacts:
    name: манифесты модулей · канон модели доступов
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download

      # ИСХОДОВ ЧЕТЫРЕ, И ШАГ ИХ РАЗЛИЧАЕТ. Схлопни VOID в успех — пустое дерево
      # отчитывалось бы зелёным так же уверенно, как проверенное, и первый
      # манифест, положенный мимо ожидаемого имени, остался бы невидимым
      # навсегда. Схлопни в отказ — красным стал бы ствол, а не продукт.
      #
      # Код читается ДАННЫМИ, а не условием продолжения: блок `run:` исполняется
      # под `bash -e`, и ненулевой код оборвал бы шаг молча — до присваивания,
      # до развилки, до всякой аннотации.
      - name: манифесты модулей — форму судит один загрузчик
        run: |
          rc=0
          make module-manifest-check || rc=$?
          case "$rc" in
            0) echo "форма манифестов: годно" ;;
            2) echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::манифестов не найдено ни одного — ПРОВЕРЯТЬ НЕЧЕГО. Это третий исход, а не «форма в порядке»"; exit 0 ;;
            3) echo "::error title=НЕ ИСПОЛНЯЛАСЬ::разбор вызова не удался — вердикта о форме манифестов нет"; exit 1 ;;
            *) echo "::error title=Форма манифеста негодна::названы файл, поле и строка (вывод выше)"; exit 1 ;;
          esac

      # ВТОРОЙ ОПЕРАНД СОЗДАЁТСЯ ВЫБОРКОЙ. Блоки модели доступов сверяются с
      # манифестами ОСТАЛЬНЫХ модулей платформы, а те живут в её репозитории:
      # держать их копию здесь запрещено (ban #20, `polyrepo.md` §«Копия между
      # репозиториями ЗАПРЕЩЕНА»), поэтому условие создаётся на прогоне.
      #
      # Выборка кладётся ПОД корень дерева намеренно: обход сверки идёт от корня
      # и за него не выходит by construction. Каталог вне корня рецепт назовёт
      # «условие создано неверно» — молчаливых пяти находок о чужих модулях не
      # будет.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        id: platform-tree
        continue-on-error: true
        with:
          repository: PRO-Robotech/kacho
          path: upstream-kacho
          fetch-depth: 1
          # Выборка РАЗРЕЖЁННАЯ и НЕ конусная: нужны ровно манифесты модулей, а
          # конусный режим тянет каталог служб целиком — плата за операнд стала
          # бы больше самого операнда.
          sparse-checkout: services/*/manifest.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Аннотация о несозданном условии — ОТДЕЛЬНЫМ шагом без падающего пути:
      # замолчать чужой отказ ему нечем. Код 2 цели ниже доедет сам.
      #
      # `success()` обязателен: свой `if:` снимает умолчание `if: success()`, и
      # без него шаг печатал бы аннотацию и тогда, когда задание упало раньше.
      - name: выборка дерева платформы не удалась — это третий исход
        if: success() && steps.platform-tree.outcome != 'success'
        run: |
          echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::выборка дерева платформы дала «${{ steps.platform-tree.outcome }}». Сверка ниже выйдет кодом 2 — вердикта о совпадении блоков НЕТ."

      - name: канон модели доступов — блоки сверяются с манифестами побайтово
        run: |
          rc=0
          make model-canon-check PLATFORM_TREE="$GITHUB_WORKSPACE/upstream-kacho" || rc=$?
          case "$rc" in
            0) echo "блоки модели: сверено" ;;
            2) echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::сверять нечего либо второе дерево недостижимо — вердикта о совпадении блоков нет (текст выше называет, чего не хватило)"; exit 0 ;;
            # Код 3 несёт ДВА состояния, и оба означают «вердикта нет»: вызов не
            # разобран ЛИБО дома манифестов соседей (`services/`) в обходе нет.
            # Второе здесь означает, что условие создано НЕВЕРНО: PLATFORM_TREE
            # задан и проверен рецептом, но выборка пуста — то есть отказ
            # шага-выборки выше. Шаг роняется намеренно: пустой операнд, поданный
            # как созданное условие, отличим только здесь.
            3) echo "::error title=НЕ ИСПОЛНЯЛАСЬ::вызов не разобран либо выборка платформы пуста — дома манифестов соседних модулей в обходе нет. Вердикта о совпадении блоков НЕТ ни зелёного, ни красного"; exit 1 ;;
            *) echo "::error title=Блоки модели разошлись с манифестами::лишняя строка в модели есть лишнее право, недостающая — отказ там, где доступ выдан"; exit 1 ;;
          esac

  # ── ИЗВЕСТНЫЕ УЯЗВИМОСТИ ────────────────────────────────────────────────────
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true
      # `@latest` — так объявлено в монорепо, и здесь повторено осознанно, а не
      # по невнимательности: предмет этой проверки — база уязвимостей, которая
      # обновляется НЕЗАВИСИМО от версии инструмента, поэтому пин версии её
      # свежести всё равно не даёт. Цена названа: вердикт может измениться без
      # правки дерева — но изменится он от появления уязвимости, то есть ровно
      # от того, ради чего проверка и стоит.
      - name: установка govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...

  # ── КОПИЯ КАТАЛОГА ПРАВ СВЕРЯЕТСЯ С КОПИЕЙ КРАЯ ─────────────────────────────
  #
  # Цель сверки была объявлена в рецепте и не звана НИ ОТКУДА — ни здесь, ни у
  # платформы (замер kaname#15: тел `run:` 55, вызовов 0 в обоих деревьях).
  # Проверка, которую никто не зовёт, ничего не производит.
  #
  # ЗОВЁТСЯ ФОРМА-ПРОВЕРКА, А НЕ ФОРМА-СИНХРОНИЗАЦИЯ. `sync-permission-catalog`
  # ПИШЕТ файл: задание, правящее дерево, вердикта о дереве не даёт — «копии
  # совпали» после собственного `cp` истинно всегда. Держит это гейт
  # `internal/check/catalog_check_wiring_test.go`: он краснеет и на снятом вызове
  # формы-проверки, и на появившемся вызове пишущей формы.
  catalogparity:
    name: каталог прав — копия сходится с копией края
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true
      # ВТОРОЕ ДЕРЕВО СОЗДАЁТСЯ ВЫБОРКОЙ, А НЕ СКАЧИВАНИЕМ МОДУЛЯ. Прежде здесь
      # стоял `go mod download`: копия края приезжала модулем-пином платформы, и
      # это было последнее место, которым служба держала ребро `kaname → kacho`
      # вне узлов импорта. Ступень S0a (kacho#2617, исход C) ребро сняла, и
      # `go list -m` отвечает «not a known dependency» — то есть операнд стал
      # неразрешим BY CONSTRUCTION.
      #
      # `PRO-Robotech/kacho` ПУБЛИЧЕН, поэтому условие создаётся одним шагом
      # выборки, и берётся ГОЛОВА: ревизию называть неоткуда (пина больше нет), а
      # второе её объявление в дереве службы было бы вторым домом одного
      # предмета. Выборка РАЗРЕЖЁННАЯ — из дерева платформы нужен один каталог.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        id: edge-tree
        continue-on-error: true
        with:
          repository: PRO-Robotech/kacho
          path: upstream-kacho
          fetch-depth: 1
          sparse-checkout: gateway/internal/middleware/embed
          persist-credentials: false

      # Аннотация о несозданном условии — ОТДЕЛЬНЫМ шагом без падающего пути:
      # замолчать чужой отказ ему нечем. Код 2 цели ниже доедет сам, и шаг
      # сверки назовёт его «УСЛОВИЕ НЕ СОЗДАНО», а не «копии разошлись».
      #
      # `success()` обязателен: свой `if:` снимает умолчание `if: success()`, и без
      # него шаг печатал бы аннотацию про выборку и тогда, когда задание упало
      # раньше по другому предмету.
      - name: выборка дерева платформы не удалась — это третий исход
        if: success() && steps.edge-tree.outcome != 'success'
        run: |
          echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::выборка дерева платформы дала «${{ steps.edge-tree.outcome }}». Сверка ниже выйдет кодом 2 — вердикта о совпадении копий НЕТ. Это третий исход, а не расхождение копий."
      # КОД ЦЕЛИ ЧИТАЕТСЯ, и оговорка названа прямо: `make` схлопывает код
      # рецепта в свой собственный (двойку), поэтому «копии разошлись» (1) и
      # «сверка не исполнялась» (2) различаются ТЕКСТОМ, который печатает цель, а
      # не числом, которое доезжает до оболочки. Разбор идёт по строке-маркеру,
      # которую цель печатает сама; разойдётся маркер с рецептом — шаг останется
      # КРАСНЫМ и потеряет только заголовок, то есть в зелёное это не вырождается.
      - name: сверка копии каталога прав с копией края
        run: |
          rc=0
          log="$RUNNER_TEMP/catalog-parity.log"
          # Вызов стоит ПЕРВЫМ СЛОВОМ строки намеренно: провязку судит гейт дерева
          # по разобранным телам `run:`, и он требует именно формы `make <цель>`.
          # Подстановка (`out="$(make …)"`) вызовом для него не является — детектор
          # оставлен строгим, чтобы зелёное не заводилось похожестью.
          make check-permission-catalog EDGE_TREE="$GITHUB_WORKSPACE/upstream-kacho" > "$log" 2>&1 || rc=$?
          cat "$log"
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if grep -q 'УСЛОВИЕ НЕ СОЗДАНО' "$log"; then
            echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::сверка каталога прав НЕ ИСПОЛНЯЛАСЬ — вердикта о совпадении копий нет (текст выше называет, чего не хватило)"
          else
            echo "::error title=Копии каталога прав разошлись::копия службы не совпала с копией края побайтово — синхронизацию зовёт человек в полном чекауте монорепо (make sync-permission-catalog)"
          fi
          exit 1
