# e2e-newman — сквозной набор службы и её АВТОНОМНЫЙ подъём.
#
# ─────────────────────────────────────────────────────────────────────────────
# ЧТО ЗДЕСЬ БЫЛО ДО ЭТОГО ПРОЦЕССА: НИЧЕГО, И ЭТО ИЗМЕРЕНО
#
# Набор из 41 коллекции, 2146 запросов и 743 кейсов не судил НИ ОДИН конвейер.
# Платформа сняла свой шард вместе с уехавшим каталогом набора; у службы сквозного
# процесса не было вовсе (`grep -c -i newman .github/workflows/*.yml` → 0). При
# этом набор ПРАВИЛИ — то есть состояние «правим и не гоняем» не выдавало себя
# ничем: конвейер службы зелен, конвейер платформы зелен, и оба правы о своём.
#
# Сверх того, сам набор в этом репозитории был НЕРАБОТОСПОСОБЕН: прогонщик,
# генератор и сверщик кейсов отказывали первой строкой, не найдя общего слоя.
# Это починено отдельным изменением (вендоринг с держателем расхождения); здесь —
# провязка, и порядок был именно такой: провязывать к прогонщику, который не
# стартует, значит завести задание, чья краснота ничего не значит.
#
# ─────────────────────────────────────────────────────────────────────────────
# ЧЕСТНОСТЬ ОБЪЁМА — ГЛАВНОЕ СВОЙСТВО ЭТОГО ПРОЦЕССА
#
# Сквозной набор адресуется в большинстве модулей кейсов к КРАЮ ПЛАТФОРМЫ, которого
# здесь нет и быть не должно (сколько именно — печатает шаг долга ниже; число здесь
# не выписано, потому что каждая переадресованная коллекция его сдвигает, а у
# выписанного держателя нет). Край — не транспорт: он ПРОИЗВОДИТ проверяемые
# свойства (разбор доступа с извлечением области, скрытие существования побайтово
# равное промаху, отображение кода gRPC в HTTP-статус). Навести переменные края на
# собственный фронт службы ЗАПРЕЩЕНО гейтом набора, и запрет верен дословно: те же
# кейсы, тот же зелёный отчёт, ПРОВЕРЕНО РАЗНОЕ — по отчёту это неотличимо.
#
# Поэтому процесс делает то, что исполнимо, и НАЗЫВАЕТ ЧИСЛОМ то, что нет:
# отдельный шаг печатает по каждой коллекции её поверхность и её препятствия.
# Зелёная суита, ничего не проверяющая, хуже отсутствующей.
#
# ─────────────────────────────────────────────────────────────────────────────
# ТРИ ИСХОДА, И ОНИ РАЗЛИЧАЮТСЯ КОДОМ, А НЕ СЛОВАМИ
#
# Код 75 у скриптов стенда — «условие не создано» (нет docker, образ не скачался,
# база не поднялась): вердикта о дереве нет ни одного, и подавать это красным
# значит посылать читателя чинить то, чего не ломали. Шаг переводит его в
# аннотацию и НЕНУЛЕВОЙ исход — не зелёный, но и не «дефект кода».
#
# Код возврата берётся ДАННЫМИ (`cmd || rc=$?`): умолчание `run:` — `bash -e`,
# и ненулевой код обрывает шаг МОЛЧА, до любой развилки. Вся логика с развилкой
# живёт в скриптах `.github/scripts/`, потому что ветку внутри шага нечем доказать
# инъекцией — у каждого скрипта здесь есть `--self-test`, и он зовётся ДО того, как
# вердикту скрипта поверят.

name: e2e-newman

on:
  # Сужено по ветке ТАК ЖЕ, как у `ci.yml`, и по той же причине (довод и
  # перепись веток — там): `push` — только ствол, `pull_request` — ствол и ветки
  # линии, названные номером задачи. Накопительной линией служит ветка эпика, и
  # прогон запроса в неё — предмет правила 2026-09-22, а не лишняя трата: у
  # запроса волны без него нет ни одного контекста набора и стенда.
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - '[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-newman-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ── НАБОР БЕЗ СТЕНДА: его собственная оснастка и её вердикт ─────────────────
  #
  # Это задание не поднимает ничего и потому дёшево. Оно судит то, что можно
  # судить по дереву: воспроизводится ли набор генератором ПОБАЙТОВО, сходится ли
  # каталог кейсов, исполняются ли пробы самого набора, измеряется ли покрытие
  # RPC и не правили ли вендоренный слой молча.
  suite:
    name: набор — оснастка, пробы, покрытие, долг
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Полная история: часть проб набора судит принадлежность ревизий, и на
          # мелком клоне они меряли бы не то.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true

      # Модули тянутся заранее: дальше в задании собираются пробные двоичные и
      # оснастка Go, и без этого шага их сборка ушла бы в сеть посреди прогона.
      #
      # Контракты этим шагом больше НЕ приезжают: ступень S0a (kacho#2617, исход C)
      # перенесла их дом в это дерево (`proto/kaname/` — 41 контракт), и гейт
      # покрытия читает их оттуда. Прежде они приезжали модулем платформы, и
      # обоснование этого шага было именно таким.
      - run: go mod download

      # ИНСТРУМЕНТЫ ПРОВЕРЯЮТСЯ ЗАРАНЕЕ, И ИХ ОТСУТСТВИЕ — ТРЕТИЙ ИСХОД.
      #
      # Пробы набора написаны под pytest; порождаемый JavaScript разбирается
      # НАСТОЯЩИМ движком (node), а вердиктный гейт суиты читает отчёты `jq`.
      # Без `jq` он падает кодом 127 — «команда не найдена», — и проба доложит
      # это находкой, посылая читателя искать дефект в гейте. Поэтому наличие
      # инструмента спрашивается ЗДЕСЬ и отдельно от его вердикта.
      - name: инструменты проб (их отсутствие — НЕ находка о дереве)
        run: |
          # pyyaml — КОНТРОЛЬ, а не зависимость. Провязку сверки судит РАЗОБРАННОЕ
          # описание процесса (поиск подстрокой зеленел бы на комментарии, где флаг
          # `--require-upstream` объясняют, — то есть на собственном объяснении), и
          # разбор у пробы СВОЙ: общий прогонщик проб третьего исхода для гейта не
          # знает, и обязательная зависимость давала бы КРАСНОЕ О ДЕРЕВЕ на машине,
          # где её не поставили. Есть pyyaml — проба сверяет свой разбор с ним и
          # печатает это в переписи; нет — вердикт остаётся, а несверенность названа.
          # git здесь тоже спрашивается: три оси самопробы провязки судят перепись по
          # ИНДЕКСУ, и без git они дают третий исход, а не проход.
          #
          # НО ЭТОТ ШАГ СУДИТ НЕ НАЛИЧИЕ МОДУЛЯ У ПРОБЫ, А УСПЕХ УСТАНОВКИ ВЫШЕ.
          # `pip install` строкой выше ставит pyyaml сам, и его молчаливый неуспех —
          # третья категория этого шага, а не свойство дерева: пробы ниже исполнятся
          # без сверки и доложат об этом честно, но перепись долга объявление процесса
          # не прочитает вовсе. Поэтому спрашивается здесь, заголовком «УСЛОВИЕ НЕ
          # СОЗДАНО», и доводу выше не противоречит — у них разные предметы.
          python3 -m pip install --quiet pytest pyyaml
          missing=""
          for tool in node jq git; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::инструментов нет:$missing — пробы НЕ исполнялись, вердикта о дереве нет"
            exit 1
          fi
          python3 -c "import yaml" || { echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::нет разборщика YAML — перепись долга не прочитает объявление конвейера"; exit 1; }
          # PIP СТАВИТ ДВА МОДУЛЯ, А СПРОШЕН БЫЛ ОДИН. pytest приезжает той же
          # установкой, что pyyaml, и его молчаливый неуспех — то же условие, не
          # созданное: пробы набора не исполнятся вовсе. Спрашивается здесь, рядом.
          python3 -m pytest --version >/dev/null 2>&1 || { echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::pytest не установился — пробы набора не исполнятся, вердикта о дереве нет"; exit 1; }
          # ПЕЧАТЬ ВЕЛИЧИНЫ НЕ ЕСТЬ ПРОВЕРКА, и это измерено, а не предположено:
          # `echo "$(…)"` возвращает код `echo`, то есть НОЛЬ, — отказ подстановки
          # исчезает вместе с величиной, и шаг выходит зелёным, напечатав «pyyaml »
          # с пустым местом. Поэтому величины берутся ПРИСВАИВАНИЕМ: его код — код
          # подстановки, и errexit его видит.
          #
          # Оговорка названа прямо: у `v_pytest` в присваивании стоит конвейер, а код
          # конвейера — код ПОСЛЕДНЕЙ команды (`head`), то есть ноль и там. Именно
          # поэтому pytest спрошен отдельной строкой выше, а не печатью.
          v_python=$(python3 -V | cut -d' ' -f2)
          v_node=$(node --version)
          v_jq=$(jq --version)
          v_pytest=$(python3 -m pytest --version 2>&1 | head -1)
          v_yaml=$(python3 -c 'import yaml; print(yaml.__version__)')
          echo "инструменты на месте: python3 $v_python, node $v_node, jq $v_jq, pytest $v_pytest, pyyaml $v_yaml"

      # ПРОГОНЩИК ВЫНОСИТ ВЕРДИКТ, значит его способность УПАСТЬ доказывается ДО
      # того, как вердикту поверят. Инъекция идёт по каждой оси в обе стороны,
      # включая законных близнецов и третий исход.
      - name: прогонщик проб способен упасть (самопроба инъекцией)
        run: python3 .github/scripts/run-python-probes.py --self-test

      # ── ВЕНДОРЕННЫЙ СЛОЙ, ПОЛОВИНА ПЕРВАЯ: КОПИЯ СХОДИТСЯ С ЗАПИСЬЮ ─────────
      #
      # Стоит ДО проб, потому что пробы этим слоем и судят — если он подменён, их
      # зелёное ничего не значит. Сверка с САМИМ ОРИГИНАЛОМ — половина вторая, и она
      # стоит в КОНЦЕ задания: от неё пробы не зависят, а её третий исход не должен
      # стоить задания (замер: прогон 34688614530, пин наведён на несуществующую
      # ревизию — аннотация верная, и 9 шагов пропущено).
      #
      # ── ПОЧЕМУ ВТОРАЯ ПОЛОВИНА ВООБЩЕ ПОЯВИЛАСЬ ───────────────────────────────
      #
      # ДО 2026-09-12 ОСЬ «ОРИГИНАЛ УШЁЛ ВПЕРЁД» НЕ ИЗМЕРЯЛАСЬ НИ ОДНИМ ПРОГОНОМ.
      # Держатель печатал «сверено с оригиналом 0» — то есть говорил правду, — и
      # выходил кодом **0**. Конвейер читает КОД, а не прозу: неизмеренная ось
      # выглядела РОВНО как измеренная. При 14 вендоренных файлах и 31 объявленной
      # подстановке это значило, что копия вправе расходиться с оригиналом молча.
      #
      # «Дерева платформы рядом нет» было фактом РАСПИСАНИЯ, а не свойством мира:
      # `PRO-Robotech/kacho` ПУБЛИЧЕН, и условие создаётся одним шагом выборки.
      #
      # РЕВИЗИЯ ОБЪЯВЛЕНА ОДИН РАЗ — в `tests/newman/vendor-provenance.json`, и
      # читается ОТТУДА. Литерал здесь был бы вторым домом пина: копия сверялась бы
      # с ревизией, из которой её не брали, и оба места были бы правы о своём.
      # Держит это `tests/newman/scripts/vendor_upstream_wiring_test.py` — по
      # РАЗОБРАННОМУ описанию процесса, потому что флаг встречается и в этих
      # комментариях, и проверка подстрокой зеленела бы на них.
      - name: вендоренный слой сходится с записью
        run: python3 tests/newman/scripts/vendor_provenance_test.py
      - name: держатель вендоринга способен упасть (самопроба инъекцией)
        run: python3 tests/newman/scripts/vendor_provenance_injection_test.py

      # Вердикт этой пробы выносит общий прогонщик ниже (образец
      # `tests/newman/scripts/*_test.py` находит её сам). Здесь — только
      # доказательство её способности упасть: прогонщик зовёт файл без аргументов,
      # и верить вердикту прежде доказательства нельзя.
      - name: проба провязки сверки способна упасть (самопроба инъекцией)
        run: python3 tests/newman/scripts/vendor_upstream_wiring_test.py --self-test

      # ГЕНЕРАЦИЯ ВОСПРОИЗВОДИТ ДЕРЕВО ПОБАЙТОВО. Расхождение здесь означает, что
      # коллекции в дереве НЕ МОГЛИ быть порождены этим генератором: их правили
      # руками либо генератор разошёлся с ними. И то и другое тихо.
      - name: коллекции воспроизводятся генератором побайтово
        run: |
          rc=0
          python3 tests/newman/scripts/gen.py || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Генератор отказал::код $rc"
            exit 1
          fi
          if ! git diff --quiet -- tests/newman/collections; then
            echo "::error title=Дерево и генератор разошлись::перегенерация изменила коллекции"
            git diff --stat -- tests/newman/collections
            git diff -- tests/newman/collections | head -60
            exit 1
          fi
          echo "ЗЕЛЁНЫЙ: перегенерация не изменила ни одного байта коллекций."

      - name: каталог кейсов сходится с деревом
        run: python3 tests/newman/scripts/validate-cases.py

      # Пробы набора: генератор, лексер, форма захвата тела, вердиктный слой и его
      # три исхода. Прогонщик печатает ВСЕ ТРИ числа (исполнено, провалено, НЕ
      # ВЫПОЛНИЛОСЬ) — третье не вычитается из вердикта и не идёт в зачёт прохода.
      - name: пробы набора (числовой вердикт, три исхода)
        run: python3 .github/scripts/run-python-probes.py

      # Покрытие RPC→кейс. Контракты берутся ИЗ СВОЕГО ДЕРЕВА, и это не
      # упрощение, а следствие ступени S0a (kacho#2617, исход C): контракты
      # службы живут в её репозитории — `proto/kaname/cloud/iam/v1/` несёт 41
      # файл, — а ребро к модулю платформы снято, поэтому `go list -m` по нему
      # отвечает «not a known dependency».
      #
      # ЧТО ЭТО МЕНЯЕТ В ПОКРЫТИИ — НИЧЕГО, И ЭТО ЗАМЕРЕНО: набор файлов тот же
      # (41 против 41), а единственное различие содержимого по всем сорока одному
      # — строка `option go_package`. Имя пакета `kaname.cloud.iam.v1`, полные
      # имена сообщений и номера полей не тронуты (исход C, провод неизменен),
      # значит перечень RPC, по которому считается покрытие, тождествен.
      - name: покрытие RPC измерено (контракты — из своего дерева)
        run: |
          rc=0
          proto="proto/kaname/cloud/iam/v1/*.proto"
          echo "proto-glob: $proto"
          python3 tests/newman/scripts/coverage.py \
            --proto-glob "$proto" \
            --collections-glob 'tests/newman/collections/*.postman_collection.json' \
            --min "${COVERAGE_MIN:-0}" || rc=$?
          # Код 2 — «покрытие НЕ ИЗМЕРЕНО» (контрактов не нашлось): это не «ноль
          # находок», а отсутствие вердикта, и молчать об этом нельзя.
          if [ "$rc" -eq 2 ]; then
            echo "::error title=Покрытие не измерено::контрактов iam не найдено — вердикта о покрытии НЕТ"
            exit 1
          fi
          exit "$rc"

      # ЗАПРЕТЫ ФОРМЫ ШАГА — половина, у которой предмет ЕСТЬ без прогона.
      #
      # Гейт исполненности судит ДВА разных вопроса, и у них разные предметы:
      # статические запреты (`setNextRequest(null)`, немой пропуск стража) читают
      # ОТСЛЕЖИВАЕМУЮ коллекцию и потому проверяемы здесь; исполненность запросов
      # читает ОТЧЁТ прогона, которого в ЭТОМ задании нет и быть не может: оно
      # ничего не поднимает. Отчёты производит задание автономного стенда ниже —
      # сколько коллекций и каким шагом, печатает шаг долга ЧИСЛОМ.
      #
      # Отсюда три исхода, и они читаются КОДОМ: 1 — статический запрет нарушен,
      # это находка о дереве; 3 — запреты чисты, а исполненность НЕ СУДИЛАСЬ, и
      # это третий исход: он не красный и не зачитывается в проход. Выдать 3 за
      # красное значило бы посылать читателя чинить прогон, которого здесь нет;
      # выдать за зелёное — объявить исполненность измеренной.
      - name: запреты формы шага (исполненность здесь не судится — третий исход)
        run: |
          rc=0
          python3 tests/newman/scripts/exec-coverage.py \
            --collections-glob 'tests/newman/collections/*.postman_collection.json' || rc=$?
          case "$rc" in
            0) echo "ЗЕЛЁНЫЙ: запреты чисты И исполненность измерена" ;;
            3) echo "::notice title=Исполненность НЕ судилась::статические запреты чисты; отчётов прогона в ЭТОМ задании нет — оно ничего не поднимает. Коллекции гоняет задание автономного стенда, и КАКИЕ ИМЕННО, печатает шаг долга числом. Это третий исход, а не проход." ;;
            *) echo "::error title=Статический запрет нарушен::код $rc"; exit "$rc" ;;
          esac

      # ДОЛГ — ОТДЕЛЬНЫМ ШАГОМ И ЧИСЛОМ. Он печатается ВСЕГДА, в том числе на
      # зелёном: «гоняется N» без «не гоняется M» скрывает ровно тот случай, ради
      # которого перепись и делается.
      - name: печать долга способна упасть (самопроба инъекцией)
        run: python3 .github/scripts/newman-suite-debt.py --self-test

      # Перепись читает ОБЪЯВЛЕНИЕ КОНВЕЙЕРА разобранным YAML, значит у неё есть
      # третий исход: без разборщика либо без объявлений величина «гоняется» НЕ
      # ИЗМЕРЕНА, и печатать ноль значило бы выдать несозданное условие за вердикт.
      # Умолчание `run:` — `bash -e`, поэтому код 75 оборвал бы шаг МОЛЧА.
      - name: ДОЛГ сквозного набора — числом и по каждой позиции
        if: always()
        run: |
          rc=0
          python3 .github/scripts/newman-suite-debt.py || rc=$?
          case "$rc" in
            0) : ;;
            75)
              echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::перепись не прочитала объявление конвейера (нет разборщика YAML либо нет файлов) — величина «гоняется» НЕ ИЗМЕРЕНА"
              exit 1 ;;
            *) exit "$rc" ;;
          esac

      # ── ВЕНДОРЕННЫЙ СЛОЙ, ПОЛОВИНА ВТОРАЯ: КОПИЯ СХОДИТСЯ С ОРИГИНАЛОМ ─────
      #
      # ПОСЛЕДНИМ ШАГОМ ЗАДАНИЯ, И ЭТО РЕШЕНИЕ, А НЕ РАСКЛАДКА. Недостижимый
      # оригинал есть ТРЕТИЙ исход — «условие не создано», — и он обязан быть
      # ненулевым, иначе вернётся ровно тот молчаливый проход, ради которого шаг и
      # заводится. Но цена третьего исхода не должна быть «остальные вердикты
      # задания не вынесены вовсе»: стоя седьмым шагом, он пропускал девять
      # следующих (замер на ранере — прогон 34688614530). Пробы от этой оси не
      # зависят, поэтому она идёт последней.
      - name: ревизия оригинала — из записи вендоринга, а не литералом
        id: vendor-pin
        run: |
          rec=tests/newman/vendor-provenance.json
          rev="$(jq -r '.upstream.revision' "$rec")"
          repo="$(jq -r '.upstream.repo' "$rec")"
          # Пин — ПОЛНЫЙ хэш: тег переставляют, короткий хэш коллизует. Форма
          # проверяется здесь, потому что дальше ею адресуют чужое дерево.
          case "$rev" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "::error title=Пин не в форме полного хэша::«$rev» в $rec"; exit 1 ;;
          esac
          # Разрежённая выборка: из 6675 файлов дерева платформы (135 МБ) запись
          # касается четырёх каталогов (~1,5 МБ). Состав каталогов ВЫВЕДЕН из самой
          # записи — перечислять их здесь значило бы завести третье место.
          dirs="$(jq -r '[.files[].path | split("/")[:-1] | join("/")] | map(select(length > 0)) | unique | .[]' "$rec")"
          {
            echo "revision=$rev"
            echo "repo=$repo"
            echo "dirs<<KACHO_PIN_EOF"
            printf '%s\n' "$dirs"
            echo "KACHO_PIN_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "пин из записи: $repo @ ${rev:0:12}; каталогов выборки: $(printf '%s\n' "$dirs" | wc -l)"

      # ПОСЛАБЛЕНИЕ, И ОНО УДЕРЖАНО, А НЕ ОБЪЯСНЕНО ОДНОЙ СТРОКОЙ.
      #
      # Зачем оно: недостижимый оригинал есть ТРЕТИЙ исход, и назвать его обязан
      # держатель своим кодом 3 («вердикта о сверке нет»), а не красный шаг выборки
      # с текстом про сеть — диагноз ставится по тексту отказа, и текст обязан быть
      # о предмете.
      #
      # Чем держится: отказ ловит шаг сверки НИЖЕ, и он выходит кодом держателя BY
      # CONSTRUCTION — одна команда под `bash -e`, без перехвата и без развилки.
      # Держит эту пару `vendor_upstream_wiring_test.py`, ось 7-8: послабление без
      # ловящего ниже — находка; перехват кода в шаге сверки — находка; послабление
      # на самом шаге сверки — находка.
      #
      # ПРЕЖДЕ ЗДЕСЬ БЫЛА МАСКА. Вся безобидность послабления держалась ОДНОЙ
      # строкой `exit 1` в развилке шага сверки, и не держало её НИЧТО: снятие
      # строки оставляло 18 утверждений из 18 зелёными и возвращало молчаливый
      # проход, ради закрытия которого весь этот блок и заведён.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        id: vendor-upstream
        continue-on-error: true
        with:
          repository: ${{ steps.vendor-pin.outputs.repo }}
          ref: ${{ steps.vendor-pin.outputs.revision }}
          path: upstream-kacho
          fetch-depth: 1
          sparse-checkout: ${{ steps.vendor-pin.outputs.dirs }}
          persist-credentials: false

      # Аннотация о несозданном условии — ОТДЕЛЬНЫМ шагом, у которого НЕТ падающего
      # пути. Он только печатает, поэтому замолчать чужой отказ ему нечем; развилка
      # же внутри шага сверки могла замолчать его одной снятой строкой.
      #
      # `success()` здесь ОБЯЗАТЕЛЕН и не украшение: свой `if:` СНИМАЕТ умолчание
      # `if: success()`, и без него шаг печатал бы аннотацию про выборку и тогда,
      # когда задание уже упало раньше по другому предмету — выборка была бы
      # пропущена, а её исход «skipped» отличался бы от `success`. То есть чужой
      # отказ получал бы ложный диагноз.
      - name: выборка оригинала не удалась — это третий исход, а не дефект копии
        if: success() && steps.vendor-upstream.outcome != 'success'
        run: |
          echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::выборка дерева платформы по пину дала «${{ steps.vendor-upstream.outcome }}». Сверка ниже выйдет кодом 3 — вердикта о том, ушёл ли оригинал вперёд, НЕТ. Это третий исход, а не дефект копии."

      # РОВНО ОДНА КОМАНДА. Умолчание `run:` — `bash -e`, поэтому код держателя
      # доезжает до вердикта шага сам: и находка (1), и третий исход (3) роняют
      # задание, а диагноз читается по ТЕКСТУ, который держатель печатает сам
      # («ОРИГИНАЛ УШЁЛ ВПЕРЁД …» против «СВЕРКА НЕ ВЫПОЛНЕНА, а её требовали …»).
      # Развилки здесь нет намеренно: её нечем доказать инъекцией, а аннотацию,
      # купленную неудерживаемой веткой, корпус называет маской.
      - name: вендоренный слой сходится с записью И С ОРИГИНАЛОМ
        env:
          KANAME_VENDOR_UPSTREAM: ${{ github.workspace }}/upstream-kacho
        run: python3 tests/newman/scripts/vendor_provenance_test.py --require-upstream


  # ── АВТОНОМНЫЙ СТЕНД: служба поднимается САМА ──────────────────────────────
  #
  # Своя база и свой внутренний УЦ — и больше ничего: ни края платформы, ни её
  # сервисов. Посадка — `own`, единственная у службы (kaname#424): внешнего
  # поставщика удостоверений нет вовсе. Предмет задания — свойства, чей
  # производитель САМА служба.
  stand:
    name: автономный стенд — служба без платформы
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download

      # Утверждения о стенде выносят вердикт, значит их способность упасть
      # доказывается ДО подъёма: на подставном фронте, отвечающем 200 на всё,
      # каждое обязано покраснеть, а «нет слушателя» обязано отличаться КОДОМ.
      - name: утверждения о стенде способны упасть (самопроба инъекцией)
        timeout-minutes: 5
        run: python3 .github/scripts/stand-assert.py --self-test

      # РАЗЛИЧЕНИЕ ДВУХ ИСХОДОВ ПОДЪЁМА — тоже вердикт, и оно доказывается ДО того,
      # как шагу ниже поверят. Самопроверка НЕ требует docker и ничего не поднимает:
      # её предмет — различение, а не подъём, поэтому она исполнима и там, где
      # движка нет, то есть не превращается сама в «не выполнилось».
      #
      # Путаница двусторонняя, и обе стороны наблюдаемы: 75 на отказе стража посадки
      # ПРЯЧЕТ дефект (служба не поднялась, а прогон никого не роняет), 1 на чужой
      # сети объявляет дефектом дерева расписание. Поэтому каждая проба утверждает
      # код И текст: у 75 в выводе не должно быть «НАХОДКА», у 1 — «УСЛОВИЕ НЕ СОЗДАНО».
      - name: различение исходов подъёма способно упасть (самопроба инъекцией)
        timeout-minutes: 5
        run: .github/scripts/stand-own.sh --self-test

      - name: подъём стенда (своя база + свой УЦ, без платформы)
        timeout-minutes: 15
        run: |
          rc=0
          .github/scripts/stand-own.sh up || rc=$?
          case "$rc" in
            0) echo "стенд поднят" ;;
            75)
              echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::стенд не поднялся по причине, не относящейся к дереву (нет docker, образ не скачался, порт занят, база не отвечает). Прогон недействителен, это НЕ дефект кода."
              exit 1 ;;
            *)
              echo "::error title=Служба не поднялась::страж посадки отказал — это вердикт о дереве"
              exit "$rc" ;;
          esac

      - name: свойства, которые производит САМА служба
        timeout-minutes: 10
        run: |
          rc=0
          python3 .github/scripts/stand-assert.py || rc=$?
          case "$rc" in
            0) echo "все названные свойства сошлись" ;;
            75)
              echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::слушателей стенда нет — утверждения не исполнялись, вердикта нет"
              exit 1 ;;
            *) exit "$rc" ;;
          esac

      # ── СКВОЗНЫЕ КОЛЛЕКЦИИ СОБСТВЕННОЙ ПОВЕРХНОСТИ ──────────────────────────
      #
      # До этих четырёх шагов на автономном стенде не гонялась НИ ОДНА коллекция
      # из 41, включая `kaname-own-rest-front`, чья поверхность и есть САМА служба:
      # её шаги читают из окружения четырёх предъявителей и два адреса, и писать
      # их было нечем. Шаг долга печатал это честно — «гоняется здесь: 0» — и
      # оставался третьим исходом, а не проходом.
      #
      # ИНСТРУМЕНТЫ СПРАШИВАЮТСЯ ОТДЕЛЬНО ОТ ВЕРДИКТА, И ИХ ОТСУТСТВИЕ — ТРЕТИЙ
      # ИСХОД. Прогонщик коллекций — newman; чеканку бутстрап-удостоверения
      # зовут `grpcurl`, потому что REST-маршрута у неё не существует НИГДЕ
      # (это инвариант безопасности, а не недоделка). Версии прибиты: «последняя»
      # делает вердикт функцией дня прогона.
      - name: инструменты прогона (их отсутствие — НЕ находка о дереве)
        timeout-minutes: 10
        run: |
          rc=0
          npm install -g newman@6.2.2 >/dev/null 2>&1 || rc=$?
          go install github.com/fullstorydev/grpcurl/cmd/grpcurl@v1.9.3 || rc=$?
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$PATH:$(go env GOPATH)/bin"
          python3 -m pip install --quiet pyyaml || rc=$?
          missing=""
          for tool in newman grpcurl jq; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          python3 -c "import yaml" 2>/dev/null || missing="$missing pyyaml"
          if [ -n "$missing" ] || [ "$rc" -ne 0 ]; then
            echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::инструментов нет:$missing (установка rc=$rc) — коллекция НЕ гонялась, вердикта о дереве нет"
            exit 1
          fi
          echo "инструменты на месте: newman $(newman --version), grpcurl $(grpcurl --version 2>&1 | head -1), jq $(jq --version), pyyaml $(python3 -c 'import yaml; print(yaml.__version__)')"

      # ПОСЕВ ВЫНОСИТ ВЕРДИКТ (его отказ обвиняет продукт), значит его способность
      # УПАСТЬ доказывается ДО того, как вердикту поверят. Самопроверка стенда не
      # требует и ничего не поднимает: её предмет — различение исходов и
      # сходимость объявления записываемых ключей с самой записью.
      - name: посев способен упасть (самопроба инъекцией)
        timeout-minutes: 5
        run: python3 tests/authz-fixtures/seed_own_stand.py --self-test

      # СТОИТ ЗДЕСЬ, А НЕ РЯДОМ С ВЫКЛАДЫВАНИЕМ, И ЭТО НЕ ПОРЯДОК ЧТЕНИЯ. Шаг
      # чистки идёт под `always()`, то есть работает и на упавшем прогоне; его
      # самопроба под `always()` не стоит — значит, стоя ниже, она пропускалась бы
      # ровно в тех прогонах, где чистка и работает, и вердикту НЕПРОВЕРЕННОЙ
      # чистки верили бы именно на красном.
      - name: чистка отчёта способна упасть (самопроба по каждой форме)
        timeout-minutes: 5
        run: python3 .github/scripts/redact-newman-report.py --self-test

      # ПРЕДПОЛЁТ ДОКАЗАН ДО ТОГО, КАК ЕГО ВЕРДИКТУ ВЕРЯТ. Он отвечает третьим
      # исходом («условие не создано») и тем самым СНИМАЕТ прогон целиком —
      # значит непроверенный предполёт мог бы снимать его молча и не по делу.
      - name: предполёт посева способен упасть (самопроба инъекцией)
        timeout-minutes: 5
        run: python3 tests/newman/scripts/seed_preflight.py --self-test

      # ПОСЕВ. Всё выдаётся глаголами продукта: чеканка бутстрап-удостоверения
      # (gRPC :9091, круг вызывающих по имени сертификата), регистрация человека
      # полосой входа (:9100, листом края стенда), выпуск ключа служебной учётки
      # и обмен подписанного утверждения у НАШЕГО издателя (:9096). Ни записи в
      # базу, ни подписи чужим ключом, ни обхода рубежа.
      - name: посев удостоверений на автономном стенде
        id: seed-own
        timeout-minutes: 10
        run: |
          rc=0
          python3 tests/authz-fixtures/seed_own_stand.py || rc=$?
          case "$rc" in
            0) echo "посеяно" ;;
            75)
              echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::посев не состоялся по причине, не относящейся к дереву (нет слушателя, нет инструмента). Вердикта о продукте нет."
              exit 1 ;;
            *)
              echo "::error title=Посев отвергнут продуктом::посев предъявил всё, чего требует контракт, и получил отказ — это вердикт о дереве"
              exit "$rc" ;;
          esac

      # ВЕРДИКТ — ЧИСЛОВОЙ И ЕГО ДАЁТ ПРОГОНЩИК НАБОРА, а не второй слой рядом:
      # он один считает исполненные запросы, НЕОТВЕЧЕННЫЕ запросы и упавшие
      # утверждения и краснеет на немом отчёте («0 утверждений» — не проход).
      # Сводка печатает СТРОКУ НА КОЛЛЕКЦИЮ и итог «N/M коллекций отчиталось»,
      # поэтому красная коллекция названа поимённо, а не растворена в общем коде.
      #
      # КОЛЛЕКЦИИ ИДУТ ОДНИМ ВЫЗОВОМ, А НЕ ШАГОМ НА КОЛЛЕКЦИЮ. Прогонщик начинает с
      # чистого `out/`: второй вызов стёр бы отчёт первого до шага чистки ниже, и
      # в артефакт уехала бы только последняя коллекция — при двух зелёных шагах.
      #
      # `iam-permission-catalog` — витрина каталога прав (kacho#1814, `IAM-SUC-10`,
      # кейс `CONF-G-03-catalog-retired-successor`): её утверждения производит сама
      # служба, и её шаги адресуются к собственному фронту той же переменной
      # `ownRestBaseUrl`. Прежде её не гонял ни один конвейер службы — кейс был
      # объявлен и не исполнялся нигде.
      #
      # Коллекции категории A разреза #24 (производитель — служба) переводятся на
      # собственный фронт по одной: каждая переадресована помощником генератора
      # `address_own_front`, её ключи пишет посев выше, а утверждения, чей
      # производитель край, в переведённую не входят (шапка каждого модуля
      # называет производителя по каждому). Перечень гоняемого — строки
      # `--service` ниже; сколько осталось, печатает шаг долга.
      #
      # Взаимный TLS собственных фронтов передаётся прогонщику флагами: без
      # клиентского листа КАЖДЫЙ запрос умер бы на рукопожатии, то есть «без
      # ответа», а не вердиктом о предмете.
      - name: коллекции собственного REST-фронта гоняются (числовой вердикт)
        timeout-minutes: 15
        run: |
          cd tests/newman
          ./scripts/run.sh --service kaname-own-rest-front \
            --service iam-permission-catalog \
            --service iam-system-grant-visibility \
            --service iam-rbac-rules-labels \
            --service iam-role-redesign \
            --service iam-role \
            --service iam-group \
            --service label-revoke-iam \
            --service iam-project \
            --service iam-access-binding-redesign \
            --service iam-rbac-subjects \
            --service iam-rbac-scope-grant \
            --service iam-invite-grant-fga \
            --service iam-invite-resend \
            --service iam-subject-privileges-read \
            --service iam-list-visibility \
            --service iam-flat-authz-vbc \
            --service docker-lane-credential-kind \
            --service iam-membership-create \
            --service iam-token-facade-conformance \
            --ssl-client-cert ../../.stand/pki/srv.crt \
            --ssl-client-key ../../.stand/pki/srv.key \
            --ssl-extra-ca-certs ../../.stand/pki/ca.crt

      # ── ВОЛНА СВЁРТКИ БАЗЫ: отказ без вердикта, а не пустая страница ──────
      #
      # Коллекции `authz-failclosed` нужно условие, несовместимое с остальным
      # прогоном: база стенда недостижима, служба жива (kaname#415). Поэтому волна
      # идёт ПОСЛЕ коллекций собственного фронта и в перечень шага выше не входит,
      # а базу возвращает следующий шаг при любом исходе этого.
      #
      # ПЕРЕД СВЁРТКОЙ волна СОЗДАЁТ условие коллекции, а не предполагает его
      # (kaname#558): рубеж предъявителя под свёрткой отвечает единым 401, как
      # только ему нужна база, то есть при устаревшем снимке набора ключей либо
      # вердикте об отзыве, а окна обоих кешей НЕ скользящие — предъявление
      # внутри окна его не продлевает. Поэтому `stand-own.sh failclosed-prepare`
      # выдерживает тишину длиной в больший из сроков (значения — из посадки
      # стенда, а не литералом), предъявляет оба удостоверения — промах обоих
      # кешей и контроль 200 при живой базе, — и сворачивает базу; затем
      # коллекция, затем `failclosed-judge` судит её код по окну. Окно истекло
      # до вызовов либо красное получено за окном — УСЛОВИЕ НЕ СОЗДАНО (75), а не
      # вердикт о дереве. Предъявитель уходит клиенту через стандартный ввод, а не
      # доводом командной строки.
      - name: волна свёртки базы — отказ без вердикта, а не пустая страница (числовой вердикт)
        id: failclosed-wave
        if: ${{ !cancelled() && steps.seed-own.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          rc=0
          .github/scripts/stand-own.sh failclosed-prepare tests/newman/environments/local.postman_environment.json || rc=$?
          case "$rc" in
            0) : ;;
            75)
              echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::волна свёртки базы не создала своего условия (причина выше) — коллекция authz-failclosed НЕ гонялась, вердикта о дереве нет"
              exit 1 ;;
            *) exit "$rc" ;;
          esac
          cd tests/newman
          crc=0
          ./scripts/run.sh --service authz-failclosed \
            --ssl-client-cert ../../.stand/pki/srv.crt \
            --ssl-client-key ../../.stand/pki/srv.key \
            --ssl-extra-ca-certs ../../.stand/pki/ca.crt || crc=$?
          cd ../..
          rc=0
          .github/scripts/stand-own.sh failclosed-judge "$crc" || rc=$?
          case "$rc" in
            0) : ;;
            75)
              echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::условие волны свёртки базы не выдержано до конца коллекции (причина выше) — её исход (код $crc) не вердикт о дереве"
              exit 1 ;;
            *) exit "$rc" ;;
          esac

      - name: база стенда возвращена после волны свёртки
        if: ${{ always() && steps.failclosed-wave.outcome != 'skipped' }}
        timeout-minutes: 5
        run: |
          rc=0
          .github/scripts/stand-own.sh db-unfold || rc=$?
          case "$rc" in
            0) : ;;
            75)
              echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::базу стенда вернуть после волны не удалось — вердикт волны выше от этого не меняется, а журнал стенда ниже пишет служба без базы"
              exit 1 ;;
            *) exit "$rc" ;;
          esac

      # ── АРТЕФАКТ ПУБЛИЧНОГО РЕПОЗИТОРИЯ ВЫКЛАДЫВАЕТСЯ ТОЛЬКО ПОСЛЕ ЧИСТКИ ──
      #
      # Артефакт скачивается кем угодно по ссылке и живёт до истечения срока
      # хранения, а машинный отчёт newman несёт ОКРУЖЕНИЕ ПРОГОНА ЦЕЛИКОМ — то
      # есть КАЖДОГО предъявителя, которого посев в него записал. ЕДИНИЦА СЧЁТА
      # НАЗВАНА, потому что их две и они дают разные числа: предъявители
      # (годные плюс один законно-отозванный; перепись посева печатает их строкой
      # «предъявителей N») и ключи окружения (`python3
      # tests/authz-fixtures/seed_own_stand.py --minted-keys | wc -l`). Числом здесь
      # не выписана ни одна: обе меняются вместе с посевом, и выписанное уже
      # отставало от него. В артефакт уезжают ВСЕ ключи, а опасны из них
      # предъявители. Это уже
      # случилось: `own-front-newman-report` (53 104 байта) нёс 51 вхождение строк
      # вида JWT и был удалён руками, но производил его КОД.
      #
      # ГРАНИЦА НАЗВАНА ЧЕСТНО: удостоверения эфемерного стенда живут минуты, и
      # стенд сносится тем же прогоном. Правило публичных артефактов не про срок
      # годности секрета, а про то, что выложенное ОПУБЛИКОВАНО.
      #
      # Выкладывается КАТАЛОГ ЧИСТКИ, а не `out/`. Чистка сама пере-обходит свой
      # выход ОТДЕЛЬНЫМ обходом тем же критерием, каким режет, и краснеет на
      # остатке, поэтому сломанная чистка означает НЕВЫЛОЖЕННЫЙ артефакт, а не
      # тихую публикацию.
      # ТРИ ИСХОДА И ЗДЕСЬ. «Прогона не было» (стенд не поднялся — каталога `out/`
      # нет) и «чистка не сошлась» ведут читателя в разные места, поэтому шаг
      # различает их САМ. В первом случае артефакт несёт записку о причине: пустой
      # артефакт неотличим от вычищенного до пустоты.
      - name: отчёт прогона вычищен от удостоверений
        if: always()
        timeout-minutes: 5
        run: |
          mkdir -p tests/newman/out-public
          if [ ! -d tests/newman/out ]; then
            echo "::notice title=Отчёта нет::каталог tests/newman/out не создан — прогон коллекции не состоялся, выкладывать нечего"
            {
              echo 'ОТЧЁТА ПРОГОНА НЕТ: каталог tests/newman/out не создан.'
              echo 'Прогон коллекции не состоялся — смотрите шаги подъёма стенда'
              echo 'и посева выше. Это НЕ «вычищено до пустоты».'
            } > tests/newman/out-public/no-report.txt
            exit 0
          fi
          rc=0
          python3 .github/scripts/redact-newman-report.py --in tests/newman/out --out tests/newman/out-public || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Артефакт НЕ выложен::чистка отчёта не сошлась (код $rc) — выкладывать отчёт с удостоверениями в ПУБЛИЧНЫЙ репозиторий нельзя"
            rm -rf tests/newman/out-public
            mkdir -p tests/newman/out-public
            echo 'ЧИСТКА НЕ СОШЛАСЬ: отчёт НЕ выложен. Смотрите шаг чистки выше — он' \
              > tests/newman/out-public/redaction-failed.txt
            echo 'печатает ПУТИ, где удостоверение осталось, но не сами значения.' \
              >> tests/newman/out-public/redaction-failed.txt
            exit 1
          fi

      - name: отчёт прогона коллекции (вычищенный)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: own-front-newman-report
          path: tests/newman/out-public
          # `error`, а не `warn`: артефакта нет ровно тогда, когда чистка не
          # сошлась, и молчать об этом значит скрыть, почему разбора падения нет.
          if-no-files-found: error

      # ЧТО ЭТОТ СТЕНД НЕ ПРОВЕРЯЕТ — печатается тем же шагом, что и в задании
      # набора, и печатается ВСЕГДА: объём, названный только в одном месте,
      # читается шире сделанного.
      - name: "ДОЛГ — чего автономный стенд не проверяет"
        if: always()
        run: |
          rc=0
          python3 .github/scripts/newman-suite-debt.py || rc=$?
          case "$rc" in
            0) : ;;
            75)
              echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::перепись не прочитала объявление конвейера — величина «гоняется» НЕ ИЗМЕРЕНА"
              exit 1 ;;
            *) exit "$rc" ;;
          esac

      # ЖУРНАЛ ПРОХОДИТ ТУ ЖЕ ЧИСТКУ, И ЭТО ЗАКРЫТИЕ КЛАССА, А НЕ СЛУЧАЯ.
      #
      # Замер на этом артефакте дал ноль удостоверений, и это верно СЕГОДНЯ: ни один
      # рубеж службы не пишет в журнал ни ожидаемый секрет, ни предъявленную
      # строку (рубеж хуков поставщика, от которого замер снят, ушёл вместе с
      # поставщиком, kaname#363). Но выкладывается не
      # замер, а КОД, и первый обработчик, залогировавший предъявителя, уехал бы в
      # публичный артефакт молча. Чистка стоит здесь затем, чтобы этого не случилось
      # без правки конвейера.
      #
      # КОПИРУЕТСЯ ОДИН ФАЙЛ, А НЕ КАТАЛОГ, И ЭТО НЕСУЩЕЕ. Рядом с журналом в
      # `.stand/run/` лежат `wrapping.key`, `bootstrap-sa.key` и
      # `second-factor.key` — КЛЮЧЕВОЙ МАТЕРИАЛ
      # стенда. Навести чистку на каталог значило бы затащить их в каталог
      # выкладывания, и «вычищено» не отменило бы того, что они там оказались.
      - name: журнал стенда вычищен от удостоверений
        if: always()
        timeout-minutes: 5
        run: |
          mkdir -p .stand/log-src .stand/log-public
          if [ ! -f .stand/run/kaname.log ]; then
            echo "::notice title=Журнала нет::.stand/run/kaname.log не создан — служба не запускалась"
            echo 'ЖУРНАЛА НЕТ: .stand/run/kaname.log не создан — служба не запускалась.' \
              > .stand/log-public/no-log.txt
            exit 0
          fi
          cp .stand/run/kaname.log .stand/log-src/kaname.log
          rc=0
          python3 .github/scripts/redact-newman-report.py --in .stand/log-src --out .stand/log-public || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Журнал НЕ выложен::чистка журнала не сошлась (код $rc) — выкладывать его в ПУБЛИЧНЫЙ репозиторий нельзя"
            rm -rf .stand/log-public
            mkdir -p .stand/log-public
            echo 'ЧИСТКА НЕ СОШЛАСЬ: журнал НЕ выложен. Смотрите шаг чистки выше — он' \
              > .stand/log-public/redaction-failed.txt
            echo 'печатает ПУТИ, где удостоверение осталось, но не сами значения.' \
              >> .stand/log-public/redaction-failed.txt
            exit 1
          fi

      # Журнал сохраняется ВСЕГДА: на красном он и нужен.
      - name: журнал стенда
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: stand-logs
          path: .stand/log-public
          if-no-files-found: error

      # Снос под `always()`: обрыв по пределу времени иначе оставил бы контейнер
      # базы поднятым.
      - name: снос стенда
        if: always()
        run: .github/scripts/stand-own.sh down

  # ── ВТОРОЙ ШАРД АВТОНОМНОГО СТЕНДА: ВОЛНА ЦЕРЕМОНИИ (kaname#398) ────────────
  #
  # Коллекции, которым нужен ЧЕЛОВЕЧЕСКИЙ предъявитель, — перечень выводит
  # объявление волны (`tests/authz-fixtures/ceremony_credentials.py --stems`) — и
  # коллекции машинного распорядителя, переехавшие вместе с ними на собственный
  # фронт. Стенд тот же, что у задания `stand` (своя база, свой УЦ, посадка `own`),
  # и посев машинный тот же; сверх него посев церемонии (`seed_ceremony.py
  # --wave`) заводит людей глаголами продукта — регистрация полосой, подтверждение
  # адреса кодом письма, вход — и куёт их предъявителей СВОЕЙ церемонией службы
  # (код авторизации → обмен), а повышенный уровень — вторым фактором. Уровень
  # каждого токена утверждается по его составу.
  #
  # ПОЧЕМУ ОТДЕЛЬНОЕ ЗАДАНИЕ, А НЕ ШАГ В `stand`. Прогонщик начинает с чистого
  # `out/`, и второй вызов в том же задании стёр бы отчёт первого до выкладывания;
  # а сложенные в один вызов, два перечня не уложились бы в срок предъявителей
  # посева. Срок токена стенда — 25 минут (`stand-own.sh`,
  # `KANAME_AUTHN__CLIENT_TOKEN__TOKEN_TTL`), и он обязан пережить остаток обоих
  # посевов и прогон: 5 + 5 + 15 = 25 (`timeout-minutes` трёх шагов ниже). Замер на
  # автономном стенде 2026-09-30: машинный посев 64 с, посев церемонии 14 с, прогон
  # четырнадцати коллекций — 8 мин 50 с.
  stand-ceremony:
    name: автономный стенд — волна церемонии и распорядители аккаунта (второй шард)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download

      - name: различение исходов подъёма способно упасть (самопроба инъекцией)
        timeout-minutes: 5
        run: .github/scripts/stand-own.sh --self-test

      - name: подъём стенда (своя база + свой УЦ, без платформы)
        timeout-minutes: 15
        run: |
          rc=0
          .github/scripts/stand-own.sh up || rc=$?
          case "$rc" in
            0) echo "стенд поднят" ;;
            75)
              echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::стенд не поднялся по причине, не относящейся к дереву (нет docker, образ не скачался, порт занят, база не отвечает). Прогон недействителен, это НЕ дефект кода."
              exit 1 ;;
            *)
              echo "::error title=Служба не поднялась::страж посадки отказал — это вердикт о дереве"
              exit "$rc" ;;
          esac

      - name: инструменты прогона (их отсутствие — НЕ находка о дереве)
        timeout-minutes: 10
        run: |
          rc=0
          npm install -g newman@6.2.2 >/dev/null 2>&1 || rc=$?
          go install github.com/fullstorydev/grpcurl/cmd/grpcurl@v1.9.3 || rc=$?
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$PATH:$(go env GOPATH)/bin"
          python3 -m pip install --quiet pyyaml || rc=$?
          missing=""
          for tool in newman grpcurl jq; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          python3 -c "import yaml" 2>/dev/null || missing="$missing pyyaml"
          if [ -n "$missing" ] || [ "$rc" -ne 0 ]; then
            echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::инструментов нет:$missing (установка rc=$rc) — коллекции НЕ гонялись, вердикта о дереве нет"
            exit 1
          fi
          echo "инструменты на месте: newman $(newman --version), grpcurl $(grpcurl --version 2>&1 | head -1), jq $(jq --version), pyyaml $(python3 -c 'import yaml; print(yaml.__version__)')"

      # Каждый посев выносит вердикт (его отказ обвиняет продукт), значит его
      # способность упасть доказывается ДО того, как вердикту поверят, — и каждый
      # своим шагом: код возврата каждой самопроверки читается отдельно.
      - name: машинный посев способен упасть (самопроба инъекцией)
        timeout-minutes: 5
        run: python3 tests/authz-fixtures/seed_own_stand.py --self-test

      - name: посев церемонии способен упасть (самопроба инъекцией)
        timeout-minutes: 5
        run: python3 tests/authz-fixtures/seed_ceremony.py --self-test

      - name: чистка отчёта способна упасть (самопроба по каждой форме)
        timeout-minutes: 5
        run: python3 .github/scripts/redact-newman-report.py --self-test

      - name: предполёт посева способен упасть (самопроба инъекцией)
        timeout-minutes: 5
        run: python3 tests/newman/scripts/seed_preflight.py --self-test

      - name: машинный посев удостоверений на автономном стенде
        timeout-minutes: 5
        run: |
          rc=0
          python3 tests/authz-fixtures/seed_own_stand.py || rc=$?
          case "$rc" in
            0) echo "посеяно" ;;
            75)
              echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::посев не состоялся по причине, не относящейся к дереву (нет слушателя, нет инструмента). Вердикта о продукте нет."
              exit 1 ;;
            *)
              echo "::error title=Посев отвергнут продуктом::посев предъявил всё, чего требует контракт, и получил отказ — это вердикт о дереве"
              exit "$rc" ;;
          esac

      # УСЛОВИЕ ВОЛНЫ — ОТДЕЛЬНЫМ ШАГОМ: отказ церемонии не должен читаться отказом
      # машинного посева и не должен читаться вердиктом о наборе.
      - name: условие создано — люди и их предъявители своей церемонией службы
        timeout-minutes: 5
        run: |
          rc=0
          python3 tests/authz-fixtures/seed_ceremony.py --wave \
            --lane-url https://localhost:9100 --issuance-url https://localhost:9096 \
            --own-url https://localhost:9098 --grpc-addr localhost:9091 \
            --pki .stand/pki --mailbox-url http://127.0.0.1:18025 || rc=$?
          case "$rc" in
            0) echo "условие создано: люди заведены, предъявители уровней «1» и «2» выкованы церемонией и приняты фронтом" ;;
            75)
              echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::поверхность стенда недостижима, лист не выписан либо приёмник писем молчит — вердикта о продукте нет"
              exit 1 ;;
            *)
              echo "::error title=Посев церемонии отвергнут продуктом::посев предъявил всё, чего требует контракт церемонии, и получил отказ — это вердикт о дереве"
              exit "$rc" ;;
          esac

      # ЧИСЛОВОЙ ВЕРДИКТ даёт прогонщик набора — строка на коллекцию и итог
      # «N/M коллекций отчиталось». Коллекции ОДНИМ вызовом, по той же причине,
      # что у задания `stand`. Коллекции волны прогонщик делегирует своей волне и
      # в общем прогоне не гоняет; здесь они названы явно, и условие их волны
      # создано шагом выше. Перечень здесь рукописный, и он обязан быть не уже
      # перечня волны: коллекцию, которую не гоняет ни один шаг, перепись долга
      # назовёт по имени и потребует у неё держателя.
      - name: коллекции волны церемонии гоняются (числовой вердикт)
        timeout-minutes: 15
        run: |
          cd tests/newman
          ./scripts/run.sh --service authz-deny \
            --service iam-account \
            --service iam-account-redesign \
            --service iam-membership-mine \
            --service iam-membership-read \
            --service iam-read-authz-vget \
            --service iam-user \
            --service iam-whoami \
            --service rbac-subject-channel-equivalence \
            --service rbac-visibility-set \
            --service iam-access-binding-account-scope \
            --service iam-access-binding-include-revoked \
            --service iam-authz-grant-check-propagation \
            --service iam-service-account \
            --ssl-client-cert ../../.stand/pki/srv.crt \
            --ssl-client-key ../../.stand/pki/srv.key \
            --ssl-extra-ca-certs ../../.stand/pki/ca.crt

      # Артефакт публичного репозитория — только после чистки: окружение прогона
      # несёт предъявителей людей и машин. Три исхода, как у задания `stand`.
      - name: отчёт прогона вычищен от удостоверений
        if: always()
        timeout-minutes: 5
        run: |
          mkdir -p tests/newman/out-public
          if [ ! -d tests/newman/out ]; then
            echo "::notice title=Отчёта нет::каталог tests/newman/out не создан — прогон коллекций не состоялся, выкладывать нечего"
            echo 'ОТЧЁТА ПРОГОНА НЕТ: прогон коллекций не состоялся — смотрите шаги подъёма и посева выше. Это НЕ «вычищено до пустоты».' \
              > tests/newman/out-public/no-report.txt
            exit 0
          fi
          rc=0
          python3 .github/scripts/redact-newman-report.py --in tests/newman/out --out tests/newman/out-public || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Артефакт НЕ выложен::чистка отчёта не сошлась (код $rc) — выкладывать отчёт с удостоверениями в ПУБЛИЧНЫЙ репозиторий нельзя"
            rm -rf tests/newman/out-public
            mkdir -p tests/newman/out-public
            echo 'ЧИСТКА НЕ СОШЛАСЬ: отчёт НЕ выложен. Шаг чистки выше печатает ПУТИ, где удостоверение осталось, но не сами значения.' \
              > tests/newman/out-public/redaction-failed.txt
            exit 1
          fi

      - name: отчёт прогона волны церемонии (вычищенный)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ceremony-wave-newman-report
          path: tests/newman/out-public
          if-no-files-found: error

      # Журнал — той же чисткой и одним файлом: рядом с ним в `.stand/run/` лежит
      # ключевой материал стенда (разбор — у задания `stand`).
      - name: журнал стенда вычищен от удостоверений
        if: always()
        timeout-minutes: 5
        run: |
          mkdir -p .stand/log-src .stand/log-public
          if [ ! -f .stand/run/kaname.log ]; then
            echo "::notice title=Журнала нет::.stand/run/kaname.log не создан — служба не запускалась"
            echo 'ЖУРНАЛА НЕТ: .stand/run/kaname.log не создан — служба не запускалась.' \
              > .stand/log-public/no-log.txt
            exit 0
          fi
          cp .stand/run/kaname.log .stand/log-src/kaname.log
          rc=0
          python3 .github/scripts/redact-newman-report.py --in .stand/log-src --out .stand/log-public || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Журнал НЕ выложен::чистка журнала не сошлась (код $rc) — выкладывать его в ПУБЛИЧНЫЙ репозиторий нельзя"
            rm -rf .stand/log-public
            mkdir -p .stand/log-public
            echo 'ЧИСТКА НЕ СОШЛАСЬ: журнал НЕ выложен. Шаг чистки выше печатает ПУТИ, где удостоверение осталось, но не сами значения.' \
              > .stand/log-public/redaction-failed.txt
            exit 1
          fi

      - name: журнал стенда
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: stand-ceremony-logs
          path: .stand/log-public
          if-no-files-found: error

      - name: снос стенда
        if: always()
        run: .github/scripts/stand-own.sh down

  # ── САМОПРОВЕРКИ ПРОТИВ ПОДСТАВНОГО КРАЯ: СТЕНДА НЕ НУЖНО ───────────────────
  #
  # В дереве три самопроверки, гоняющие НАСТОЯЩИЙ newman по НАСТОЯЩЕЙ порождённой
  # коллекции, где ответы даёт подставной край. Каждая доказывает, что утверждения
  # кейса РАЗЛИЧАЮТ здоровый ответ и внесённый дефект, — то есть ловит ровно тот
  # класс, из-за которого зелёная суита может ничего не значить.
  #
  # НЕ ЗВАЛ ИХ НИКТО, И ЭТО ИЗМЕРЕНО (kaname#15): осмотрено 3 описания процесса,
  # тел `run:` 55, вызовов каждой из трёх — 0, причём и в сыром тексте тоже, то
  # есть даже в комментариях их не упоминали. Общий прогонщик проб набора
  # (`run-python-probes.py`) их не подхватывает by construction: он собирает
  # состав по образцу `*_test.py`, а у самопроверки свой `main`.
  #
  # ЗАДАНИЕ ОТДЕЛЬНОЕ, А НЕ ШАГ В `suite`. Ему нужен newman (то есть установка
  # на ~полминуты), а `suite` его не ставит и не должен: там предмет — оснастка
  # набора, судимая по дереву. Разведя, получаем ещё и параллельность: три
  # самопроверки идут вместе с остальными заданиями, а не после них.
  #
  # КАЖДАЯ САМОПРОВЕРКА — СВОЙ ШАГ, и это несущее свойство: код возврата каждой
  # читается ОТДЕЛЬНО. Одна строка с тремя вызовами через `&&` схлопнула бы три
  # вердикта в один и остановилась бы на первой находке.
  edgeselftests:
    name: самопроверки против подставного края (стенда не нужно)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true

      # Чеканка удостоверения идёт КОДОМ ПРОДУКТА (`go run …/credsecretmint`), и
      # его зависимости — модули: без этого шага самопроверка формы выходит
      # «предпосылкой не выполненной», а не вердиктом.
      - run: go mod download

      # ИНСТРУМЕНТ ПРОВЕРЯЕТСЯ ЗАРАНЕЕ, И ЕГО ОТСУТСТВИЕ — ТРЕТИЙ ИСХОД.
      #
      # Без newman каждая самопроверка выходит кодом 2 — «проверено НИЧЕГО», и
      # подавать это вердиктом о дереве нельзя. Версия пинована той же, что у
      # задания автономного стенда: два места об одном инструменте разошлись бы
      # молча, и «зелено там, красно тут» искали бы в коллекциях.
      - name: инструменты прогона (их отсутствие — НЕ находка о дереве)
        run: |
          rc=0
          npm install -g newman@6.2.2 >/dev/null 2>&1 || rc=$?
          if ! command -v newman >/dev/null 2>&1 || [ "$rc" -ne 0 ]; then
            echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::newman не установился (rc=$rc) — самопроверки НЕ исполнялись, вердикта о дереве нет"
            exit 1
          fi
          echo "инструменты на месте: newman $(newman --version), node $(node --version)"

      # ТРИ ИСХОДА РАЗЛИЧАЮТСЯ КОДОМ: 0 — свойство держится, 1 — находки,
      # 2 — предпосылка не выполнена (нет newman, нет коллекции, не исполнилась ни
      # одна ось). Двойка не зелёная и не «дефект кода»: она означает, что
      # проверено НИЧЕГО, и сказать это обязан сам шаг.
      - name: форма базового удостоверения — утверждения различают дефект
        run: |
          rc=0
          python3 tests/newman/scripts/selftest_basic_access_token.py || rc=$?
          case "$rc" in
            0) echo "ЗЕЛЁНЫЙ: утверждения о форме удостоверения различают дефект" ;;
            2) echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::самопроверка формы удостоверения не исполнилась — вердикта НЕТ"; exit 1 ;;
            *) echo "::error title=Утверждения кейса не различают дефект::код $rc"; exit "$rc" ;;
          esac

      - name: полосы отказа доступа — утверждения различают дефект
        run: |
          rc=0
          python3 tests/newman/scripts/selftest_authz_allow_lanes.py || rc=$?
          case "$rc" in
            0) echo "ЗЕЛЁНЫЙ: полосы отказа доступа различают здоровый ответ и дефект" ;;
            2) echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::самопроверка полос отказа не исполнилась — вердикта НЕТ"; exit 1 ;;
            *) echo "::error title=Полосы отказа не различают дефект::код $rc"; exit "$rc" ;;
          esac

      - name: формы фасада токенов — утверждения различают дефект
        run: |
          rc=0
          python3 tests/newman/scripts/selftest_token_facade_forms.py || rc=$?
          case "$rc" in
            0) echo "ЗЕЛЁНЫЙ: формы фасада токенов различают здоровый ответ и дефект" ;;
            2) echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::самопроверка форм фасада не исполнилась — вердикта НЕТ"; exit 1 ;;
            *) echo "::error title=Формы фасада не различают дефект::код $rc"; exit "$rc" ;;
          esac

  # ── ЧАРТ ПОДНИМАЕТСЯ В БОЕВОЙ ПОСАДКЕ, И НА НЁМ ИДЁТ ПОЛОСА ВХОДА ПАРОЛЕМ ─────
  #
  # `security.md` §«Production-mode», п. 3: `values.prod` ОБЯЗАН подниматься, а
  # не только рендериться. Держателем у этой половины было задание монорепо; оно
  # снято вместе с выносом службы, и полтора месяца рендер держал страж, а подъём
  # — НИКТО. Регресс, ломающий установку при исправном рендере, доезжал бы до
  # арендатора незамеченным, потому что «helm template» его не производит.
  #
  # СТЕНД ЧАРТА ОДИН, потому что посадка у службы одна (kaname#363). Он ставит
  # поставляемый профиль как есть с накладками координат и оператора `own`
  # (`stand-chart.sh`, раздел «ПОСАДКА `own`») и создаёт условия наборов полосы
  # входа кодом дерева, а не руками. Прежде рядом стояло задание `chart` — тот же
  # подъём без этих условий по ручке стенда; ручка снята вместе с ключом посадки,
  # и второй подъём того же чарта нового вердикта не давал бы.
  #
  # Слушатель формы человека допускает РОВНО край — по SAN клиентского листа.
  # Задание `stand` поднимает ПРОЦЕСС без края по своему предмету и этой двери не
  # открывает: наборы полосы формы (`kaname-login-lane`, `kaname-recovery-lane`)
  # там уходят в «условие не создано» каждым шагом. Здесь стенд создаёт их
  # условия сам: клиентский лист с именем края и человека со способом входа
  # паролем. Условие — отдельным шагом со своим исходом: несозданное условие не
  # подаётся ни вердиктом о продукте, ни зелёным.
  #
  # Сверх полосы входа стенд создаёт условие СВОЕЙ ЦЕРЕМОНИИ (kaname#398):
  # предъявитель человека выковывается входом → кодом → обменом, а
  # конфиденциальные клиенты церемонии заводятся глаголом `Create` (kaname#405).
  # Им гоняется набор `kaname-authorization-code` (LINE-A-1, kaname#423).
  chart-own:
    name: стенд посадки own (kind) — полоса входа паролем и своя церемония
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # Вид PrometheusRule на голом kind не заводится ничем, поэтому правила
    # тревоги выключены ручкой: их предмет — объект мониторинга, а не подъём.
    env:
      KANAME_STAND_ALERT_RULES: "off"
      KANAME_STAND_CLUSTER: kaname-chart-own-ci
      KANAME_STAND_IMAGE: kaname:stand-own-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true

      # Координаты стенда — ВНЕ рабочего дерева и одни на все шаги: каталог
      # стенда несёт ключи листов, и в дереве им не место.
      - name: координаты стенда
        run: |
          echo "KANAME_STAND_WORKDIR=$RUNNER_TEMP/kaname-stand-own" >> "$GITHUB_ENV"
          echo "KUBECONFIG=$RUNNER_TEMP/kaname-stand-own.kubeconfig" >> "$GITHUB_ENV"

      # Инструменты — предпосылка, и их отсутствие — третий исход. Версии те же,
      # что у соседних заданий: одно средство в двух версиях разошлось бы молча.
      - name: инструменты стенда и прогона (их отсутствие — НЕ находка о дереве)
        timeout-minutes: 10
        run: |
          rc=0
          go install sigs.k8s.io/kind@v0.33.0 || rc=$?
          go install github.com/fullstorydev/grpcurl/cmd/grpcurl@v1.9.3 || rc=$?
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$PATH:$(go env GOPATH)/bin"
          npm install -g newman@6.2.2 >/dev/null 2>&1 || rc=$?
          missing=""
          for tool in kind helm kubectl docker openssl newman jq python3 grpcurl; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ] || [ "$rc" -ne 0 ]; then
            echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::инструментов нет:$missing (установка rc=$rc) — стенд НЕ поднимался, вердикта о дереве нет"
            exit 1
          fi
          echo "инструменты на месте: kind $(kind --version), helm $(helm version --short), newman $(newman --version), grpcurl $(grpcurl --version 2>&1 | head -1)"

      # Каждое различение исходов доказывается ДО того, как его вердикту поверят,
      # и каждое — своим шагом: код возврата каждой самопроверки читается отдельно.
      - name: различение исходов подъёма способно упасть (самопроба инъекцией)
        timeout-minutes: 5
        run: .github/scripts/stand-chart.sh --self-test

      - name: посев человека способен упасть (самопроба инъекцией)
        timeout-minutes: 5
        run: python3 tests/authz-fixtures/seed_login_lane.py --self-test

      # Приёмник писем стенда судит, дошло ли письмо подтверждения адреса: его
      # приём поверх TLS и чтение по адресату доказываются до подъёма.
      - name: приёмник писем стенда способен упасть (самопроба инъекцией)
        timeout-minutes: 5
        run: python3 .github/scripts/stand-mailbox.py --self-test

      - name: посев церемонии способен упасть (самопроба инъекцией)
        timeout-minutes: 5
        run: python3 tests/authz-fixtures/seed_ceremony.py --self-test

      - name: чистка отчёта способна упасть (самопроба по каждой форме)
        timeout-minutes: 5
        run: python3 .github/scripts/redact-newman-report.py --self-test

      - name: подъём стенда посадки own (values.prod.yaml + накладка own, kind)
        timeout-minutes: 25
        run: |
          rc=0
          .github/scripts/stand-chart.sh up || rc=$?
          case "$rc" in
            0) echo "чарт поставлен в посадке own, выкат дошёл до готовности" ;;
            75)
              echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::стенд не поднялся по причине, не относящейся к дереву (кластер, база, образ). Прогон недействителен, это НЕ дефект кода."
              exit 1 ;;
            *)
              echo "::error title=Чарт не поднялся в посадке own::установка либо готовность выката отказали — это вердикт о дереве"
              exit "$rc" ;;
          esac

      # Провенанс и посадка — по процессу и по базе, а не по «под Ready»: к
      # шести осям боевой посадки добавлена седьмая, `identity_provider=own`.
      - name: провенанс и посадка сходятся (процесс, база)
        timeout-minutes: 5
        run: |
          rc=0
          .github/scripts/stand-chart.sh assert || rc=$?
          case "$rc" in
            0) echo "ревизия и посадка сошлись" ;;
            75)
              echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::стенд не опрошен либо исполняет не ту ревизию — вердикта о посадке нет"
              exit 1 ;;
            *)
              echo "::error title=Посадка разошлась с объявленной::вывод выше называет ось"
              exit "$rc" ;;
          esac

      # УСЛОВИЕ ПРОГОНА — ОТДЕЛЬНЫМ ШАГОМ. Посев заводит человека глаголом
      # продукта на полосе и утверждает способность («входит паролем»), а не
      # наличие строки; три переменные набора он пишет сам.
      - name: условие создано — человек входит паролем через полосу
        timeout-minutes: 5
        run: |
          rc=0
          .github/scripts/stand-chart.sh seed-login-lane || rc=$?
          case "$rc" in
            0) echo "условие создано: loginLaneBaseUrl, loginLaneEmail, loginLanePassword записаны" ;;
            75)
              echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::полоса недостижима либо лист края не вынесен — вердикта о продукте нет"
              exit 1 ;;
            *)
              echo "::error title=Посев отвергнут продуктом::посев предъявил всё, чего требует контракт полосы, и получил отказ — это вердикт о дереве"
              exit "$rc" ;;
          esac

      # ВТОРОЕ УСЛОВИЕ — ПРЕДЪЯВИТЕЛЬ ЧЕЛОВЕКА СВОЕЙ ЦЕРЕМОНИЕЙ (kaname#398), и
      # тоже отдельным шагом: отказ церемонии не должен читаться отказом входа.
      # Посев заводит двух конфиденциальных клиентов глаголом `Create` (kaname#405)
      # и проводит человека стенда через вход → код → обмен → приём фронтом;
      # утверждается приём токена, а не его выдача. Ключи набора церемонии
      # `authorization_code` и предъявителя человека уровня «1» он пишет сам;
      # людей всей волны церемонии куёт режим `--wave` задания `stand-ceremony`.
      - name: условие создано — предъявитель человека своей церемонией
        timeout-minutes: 5
        run: |
          rc=0
          .github/scripts/stand-chart.sh seed-ceremony || rc=$?
          case "$rc" in
            0) echo "условие создано: клиенты заведены глаголом, предъявитель человека выкован церемонией и принят фронтом" ;;
            75)
              echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::поверхность стенда недостижима, лист не вынесен либо человека нет — вердикта о продукте нет"
              exit 1 ;;
            *)
              echo "::error title=Посев церемонии отвергнут продуктом::посев предъявил всё, чего требует контракт церемонии, и получил отказ — это вердикт о дереве"
              exit "$rc" ;;
          esac

      # ЧИСЛОВОЙ ВЕРДИКТ даёт прогонщик набора: исполненные и неотвеченные
      # запросы, упавшие утверждения, строка на коллекцию. Лист края и УЦ стенда
      # — те, что посев вынес из Secret стенда и по которым доказал способность.
      #
      # ШЕСТЬ КОЛЛЕКЦИЙ ОДНОЙ ДВЕРИ — ОДНИМ ВЫЗОВОМ. Восстановление доступа
      # (`kaname-recovery-lane`, Ф5) и второй фактор (`kaname-second-factor`, Ф12)
      # стоят на том же слушателе формы, читают те же `loginLaneBaseUrl`,
      # `loginLaneEmail` (второй фактор — и `loginLanePassword`) и ждут того же
      # условия стенда, что вход; церемония `authorization_code` (LINE-A-1,
      # kaname#423) ждёт обоих посевов выше. Второй вызов прогонщика стёр бы
      # `out/` первого до выкладывания. Порядок несущий: вход первым —
      # восстановление способа входа не меняет, а его отказ читается раньше;
      # церемония после входа — её отказ читается после отказа входа; второй
      # фактор последним из наборов человека посева — он заводит фактор тому же
      # человеку и снимает его своим
      # последним кейсом, и набор, прогнанный после незавершённого снятия, мерил
      # бы уже другого человека. Регистрация (`kaname-registration`, Ф4) и
      # подтверждение адреса (`kaname-address-verification`, kaname#456) — после
      # всех: людей они заводят сами, своих на прогон, и человека посева не
      # трогают; подтверждение читает код письма у приёмника стенда
      # (`standMailboxUrl`), как восстановление и кейсы второго фактора со своим
      # человеком.
      # Выход второго фактора готов к публикации (kaname#417): срез ниже знает виды
      # его удостоверений, а утверждения набора значений не печатают.
      #
      # ПРЕДЕЛ ШАГА НАЗВАН ЧИСЛОМ, А НЕ ВЗЯТ С ЗАПАСОМ. Шесть наборов шли 10 мин
      # (прогон 36605611188 на `357` @ 734f69fb4). Кейс окна профиля набора
      # второго фактора (kaname#480) ждёт самого позднего из сроков своих ветвей —
      # окна профиля `addressWindow` и `selfServiceFreshness`, по 15 мин
      # (`deploy/values.prod.yaml`), — плюс заведение четырёх своих людей до
      # ожидания, около 2 мин. Отсюда 10 + 15 + 2 = 27, и предел 35: зависание
      # по-прежнему снимается шагом, а не заданием, а окно, выросшее в профиле,
      # видно здесь, потому что число выведено из него.
      - name: наборы посадки own гоняются — вход, восстановление, церемония, второй фактор, регистрация, подтверждение адреса (числовой вердикт)
        timeout-minutes: 35
        run: |
          cd tests/newman
          rc=0
          ./scripts/run.sh --service kaname-login-lane \
            --service kaname-recovery-lane \
            --service kaname-authorization-code \
            --service kaname-second-factor \
            --service kaname-registration \
            --service kaname-address-verification \
            --ssl-client-cert "$KANAME_STAND_WORKDIR/edge/edge.crt" \
            --ssl-client-key "$KANAME_STAND_WORKDIR/edge/edge.key" \
            --ssl-extra-ca-certs "$KANAME_STAND_WORKDIR/edge/ca.crt" || rc=$?
          case "$rc" in
            0) echo "наборы посадки own зелены: вход паролем, восстановление, церемония authorization_code, второй фактор, регистрация, подтверждение адреса" ;;
            75)
              echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::предполёт снял этот прогон до первого запроса — вердикта о наборе нет"
              exit 1 ;;
            *) exit "$rc" ;;
          esac

      # Артефакт публичного репозитория — только после чистки: окружение
      # прогона несёт пароль человека и печенья сессии.
      - name: отчёт прогона вычищен от удостоверений
        if: always()
        timeout-minutes: 5
        run: |
          mkdir -p tests/newman/out-public
          if [ ! -d tests/newman/out ]; then
            echo "::notice title=Отчёта нет::каталог tests/newman/out не создан — прогон коллекции не состоялся, выкладывать нечего"
            echo 'ОТЧЁТА ПРОГОНА НЕТ: прогон коллекции не состоялся — смотрите шаги подъёма и посева выше. Это НЕ «вычищено до пустоты».' \
              > tests/newman/out-public/no-report.txt
            exit 0
          fi
          rc=0
          python3 .github/scripts/redact-newman-report.py --in tests/newman/out --out tests/newman/out-public || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Артефакт НЕ выложен::чистка отчёта не сошлась (код $rc) — выкладывать отчёт с удостоверениями в ПУБЛИЧНЫЙ репозиторий нельзя"
            rm -rf tests/newman/out-public
            mkdir -p tests/newman/out-public
            echo 'ЧИСТКА НЕ СОШЛАСЬ: отчёт НЕ выложен. Шаг чистки выше печатает ПУТИ, где удостоверение осталось, но не сами значения.' \
              > tests/newman/out-public/redaction-failed.txt
            exit 1
          fi

      - name: отчёт прогона полосы формы (вычищенный)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: own-landing-newman-report
          path: tests/newman/out-public
          if-no-files-found: error

      - name: журнал стенда
        if: always()
        run: |
          kubectl --context "kind-$KANAME_STAND_CLUSTER" -n kaname get pods -o wide || true
          kubectl --context "kind-$KANAME_STAND_CLUSTER" -n kaname logs -l app.kubernetes.io/name=kaname --tail=200 --all-containers || true

      - name: снос стенда
        if: always()
        run: .github/scripts/stand-chart.sh down || true

  # ── ВЕРДИКТ СТВОЛА ──────────────────────────────────────────────────────────
  #
  # Держатель живёт в КАЖДОМ процессе, идущем на ствол, а не в одном из них.
  # Прежде он стоял только в `ci`, и это закрывало треть предмета: единица счёта
  # задачи #62 — прогон ПРОЦЕССА на ревизии ствола, а процессов три. Красное
  # сквозного набора не производило события вовсе — ровно то состояние, из которого уходят.
  #
  # Держатель ОДИН НА РЕВИЗИЮ, а не один на процесс: заголовок задачи ключуется
  # ревизией, поэтому второй покрасневший процесс той же ревизии ДОПОЛНЯЕТ уже
  # заведённого, а не заводит второго. Две задачи об одном предмете расходятся
  # молча, и расходится та, которую не читают.
  trunkverdict:
    name: вердикт ствола — красное не остаётся без читателя
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # ПОЧЕМУ `!cancelled()`, А НЕ `always()` — ЗАМЕР, А НЕ ВКУС.
    #
    # У процесса стоит `cancel-in-progress` по группе `${{ github.ref }}`: два
    # вливания подряд ВЫТЕСНЯЮТ прогон предыдущей ревизии, и его задания
    # получают исход `cancelled`. При `always()` держатель срабатывал бы на
    # каждом таком вытеснении и заводил `P0` «ствол красен» — на ШТАТНОЙ работе.
    # Замер по 40 прогонам ствола: `success` 31 · `failure` 3 · `cancelled` 6,
    # то есть ложная тревога приходила бы вдвое чаще настоящей.
    #
    # Держатель, кричащий на штатном состоянии, перестают читать — и вместе с
    # ним перестают читать настоящую находку. `!cancelled()` снимает ровно эту
    # ветвь и сохраняет ту, ради которой держатель заведён: на КРАСНОМ стволе
    # задание идёт (умолчание `success()` сняло бы его именно там).
    #
    # Вытесненная ревизия без читателя не остаётся: её вытеснил СЛЕДУЮЩИЙ
    # коммит, и вердикт выносится о нём — о том состоянии ствола, которое
    # действует. Отменённое ОТДЕЛЬНОЕ задание при неотменённом прогоне
    # по-прежнему читается как «без вердикта» и событие производит.
    needs:
      - suite
      - stand
      - stand-ceremony
      - edgeselftests
      - chart-own
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Право на запись задач — ТОЛЬКО у этого задания, и оно наименьшее из
    # достаточных.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Самопроверка идёт ДО вердикта: держатель, потерявший способность
      # производить событие, молчит ровно так же, как исправный на зелёном стволе.
      - name: держатель — доказательство инъекцией в обе стороны
        run: .github/scripts/trunk-verdict-holder.sh --self-test

      - name: вердикт ствола
        env:
          GH_TOKEN: ${{ github.token }}
          TRUNK_VERDICT_REPO: ${{ github.repository }}
          TRUNK_VERDICT_SHA: ${{ github.sha }}
          TRUNK_VERDICT_PROCESS: ${{ github.workflow }}
          TRUNK_VERDICT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          rc=0
          .github/scripts/trunk-verdict-holder.sh \
            "${{ needs.suite.result }}" \
            "${{ needs.stand.result }}" \
            "${{ needs.stand-ceremony.result }}" \
            "${{ needs.edgeselftests.result }}" \
            "${{ needs.chart-own.result }}" || rc=$?
          case "$rc" in
            0) echo "ствол зелен — держателя заводить не из чего" ;;
            1) echo "::error title=СТВОЛ КРАСЕН::держатель заведён либо дополнен в трекере. Пока он открыт, ствол считается красным; закрывать — с артефактом починки"; exit 1 ;;
            *) echo "::error title=НЕ ИСПОЛНЯЛАСЬ::событие НЕ произведено — либо исходы не разобраны, либо производитель отказал. Читателя у красного НЕ появилось"; exit 1 ;;
          esac
