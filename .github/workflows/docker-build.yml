# docker-build — ПРОИЗВОДИТЕЛЬ ОБРАЗА СЛУЖБЫ.
#
# ─────────────────────────────────────────────────────────────────────────────
# ЗАЧЕМ ОН ЗАВЕДЁН
#
# Образ службы требуется профилем умбреллы БЕЗУСЛОВНО, а собирали его только
# механизмы монорепо: задание её конвейера и рецепт её каталога развёртывания.
# Оба уезжают вместе с каталогом службы, когда тот снимут, и образ перестал бы
# производиться ВОВСЕ — молча: требование остаётся, а производитель исчезает
# вместе со строкой, которая его несла. Поэтому производитель заводится ДО
# удаления, а не вместе с ним.
#
# ЭТОТ ФАЙЛ — ЕДИНСТВЕННЫЙ ПРОИЗВОДИТЕЛЬ ПУБЛИКУЕМОГО ОБРАЗА `kaname`. Задание
# монорепо и рецепт его каталога развёртывания сняты вместе с каталогом службы:
# перепись 2026-10-16 — `git grep -nE 'prorobotech/kaname|IMAGE_NAME: kaname'
# origin/main -- .github` в PRO-Robotech/kacho — ноль строк. `make image` и
# `stand-chart.sh` здесь собирают образ локально и в реестр его не кладут.
# Значит снятое отсюда событие публикации не подхватит никто: голова линии,
# которую пинит зонт монорепо (`deploy/helm/umbrella/values.yaml` — тег
# `296-…`; перепись потребителей тега ветки-номера по kacho и kaname — 914
# файлов, 4 пина зонта), осталась бы без образа (#429).
#
# ─────────────────────────────────────────────────────────────────────────────
# ЧТО ИМЕННО ПРОИЗВОДИТСЯ — И ЧЕМ ТЕГ ОТЛИЧАЕТСЯ ОТ ПРОВЕНАНСА
#
# Тег отвечает «что собрали», провенанс — «из чего собрали», и совпадают они
# лишь пока никто не пересобирал под тем же именем. Поэтому величины РАЗНЫЕ:
# в тег идёт короткая форма, в клеймо и в файл внутри образа — ПОЛНАЯ ревизия.
#
#   ссылка на версию   — `v<МАЖОР>.<МИНОР>.<ПАТЧ>` (образ тегуется самой версией)
#   ствол              — `main-<8 знаков ревизии>`
#   ветка линии        — `<номер>-<8 знаков ревизии>` (эпик, волна: `357-…`, `366-…`)
#   запрос на слияние   — НЕ публикуется вовсе, только собирается
#
# ВЕТКА ЛИНИИ ПУБЛИКУЕТСЯ ПО ТОМУ ЖЕ ПРАВИЛУ, ЧТО СТВОЛ, и по той же причине:
# её состояние ПОСАЖЕНО вливанием, а зонт линии платформы пинит службу тегом.
# Пока `push` был сужен до ствола, у головы ветки эпика образа не было вовсе:
# тегов `357-*` и `366-*` в реестре ноль, и выкатка линии поднималась со службой
# ствола (задача PRO-Robotech/kaname#429). Запрос в линию этого не заменяет —
# он собирает и не публикует.
#
# ЛИНИЮ ОТ ЗАДАЧИ ОТЛИЧАЕТ ШАГ `gate`, А НЕ ФИЛЬТР. Ветки задач названы номером
# так же, как ветки волн и эпиков, и фильтр `push` пропускает обе; ветка задачи
# в реестр не идёт — её состояние никуда не влито и не принято, — а собирается
# по `push`, только пока её голову не собирает открытый готовый запрос (шаг
# `duplicate` задания `changes`, kaname#847).
# Признак линии — перепись запросов с этой базой у провайдера (довод у шага).
#
# ФОРМА ТЕГА СТВОЛА ВЗЯТА У МОНОРЕПО НАМЕРЕННО: профили посадки пинят службу
# именно ею. Что изменилось после выноса и о чём надо знать: `main-<ревизия>`
# теперь называет ревизию ЭТОГО дерева, а не монорепо. Прежние пины остаются
# годными — опубликованный тег неизменяем, — но новые приходят из другого
# пространства ревизий, и сравнивать их с прежними по числу нельзя.
#
# ─────────────────────────────────────────────────────────────────────────────
# ПОЧЕМУ ПУБЛИКАЦИЯ ГЕЙТИТСЯ УЧЁТНЫМИ ДАННЫМИ, А НЕ ТРЕБУЕТ ИХ
#
# Учётные данные реестра — внешнее условие, а не свойство дерева. Их отсутствие
# говорит об УСЛОВИИ («в этом репозитории секрет не объявлен»), а не о дереве, и
# ронять на нём сборку значило бы выдать одно за другое. Поэтому без них
# производитель СОБИРАЕТ и не публикует, говоря об этом вслух: замер на день
# заведения — `actions/secrets` этого репозитория отдаёт `total_count: 0`, то
# есть на уровне репозитория их нет, и публикация состоится ровно тогда, когда
# секрет доедет сюда с уровня организации.
#
# Пустое пространство имён при этом ЗАПРЕЩЕНО грамматикой ссылки на образ, и
# отказ пришёл бы ДО публикации — то есть сломалась бы и сборка. Отсюда
# `FALLBACK_NS`: тег остаётся правильной формы и в режиме «только сборка».
#
# ─────────────────────────────────────────────────────────────────────────────
# ЧЕГО ЭТОТ ПРОИЗВОДИТЕЛЬ НЕ ДЕЛАЕТ — сказано прямо
#
# Он не двигает движущихся тегов (`latest` не публикуется): движущийся тег
# означает, что вердикт вчерашнего прогона относится к образу, который сегодня
# другой. Он не правит профилей посадки: пин — решение оператора, и подставлять
# его за него производитель не вправе.
name: образ службы

on:
  # `push` — ствол, ветки линии и метки версий. Ветки те же, что базы запроса
  # ниже, и глоб тот же (довод — `ci.yml`). Глоб ШИРЕ посаженного: ветки задач
  # названы номером так же, как линии, и фильтр их пропускает. Публикуется лишь
  # посаженное, и держит это не фильтр, а шаг `gate` — он отличает линию от
  # задачи переписью запросов; судит его проба `internal/check`
  # TestImageProducerTagsALineHeadLikeTheTrunk. В отличие от процесса проверки,
  # здесь отправка в линию не повторяет вердикт её запроса — запрос образа не
  # публикует. Равенство множеств держит проба `internal/check`
  # TestReviewIntoALineRunsTheTrunkPipeline (перечень публикующих — там же).
  # Отправка в ветку задачи, чью голову собирает её запрос, сборку пропускает —
  # шаг `duplicate` задания `changes` (kaname#847); фильтр от этого не сужается.
  push:
    branches: [main, '[0-9]+']
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Запрос на слияние собирает и НЕ публикует. Это не «на всякий случай»: файл
  # сборки — часть дерева, и его поломка иначе обнаружилась бы только после
  # вливания, когда чинить приходится ствол.
  #
  # Базы запроса — те же, что у `ci.yml` (довод и перепись веток — там): ствол
  # и ветки линии, названные номером задачи.
  pull_request:
    branches:
      - main
      - '[0-9]+'
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# `actions: write` — НЕ право «на всякий случай»: кэш `type=gha` пишется через
# API кэша действий, и без этой записи `--cache-to` не падает, а МОЛЧА ничего не
# сохраняет. Кэш был бы объявлен, провязан и пуст на каждом прогоне — форма без
# содержания, заметная только по времени сборки.
#
# `pull-requests: read` — перепись запросов с базой этой ветки: ею шаг `gate`
# отличает линию от задачи (довод — у шага). Без права обращение отказывает, и
# шаг отказывает вслух, а не решает «задача» молча.
permissions:
  contents: read
  actions: write
  pull-requests: read

# Образ устаревшей ревизии не нужен никому, а сборка под две архитектуры — не та
# работа, которую стоит доводить до конца ради состояния, уже вытесненного
# следующим.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

# СТАТУС НЕ ТЕРЯЕТСЯ В ТРУБЕ. Умолчание для `run:` — `bash -e {0}`, то есть БЕЗ
# pipefail: `<сборка> | tee` отдаёт шагу код ПРАВОЙ команды и зеленеет при любом
# провале левой. `shell: bash` включает `-eo pipefail`.
defaults:
  run:
    shell: bash

env:
  # Пространство имён при НЕобъявленном секрете. Тег обязан остаться правильной
  # формы и в режиме «только сборка»: пустое имя даёт `/kaname:tag`, а грамматика
  # ссылки на образ пустой части не допускает — отказ пришёл бы до публикации.
  FALLBACK_NS: local
  IMAGE_NAME: kaname

jobs:
  # Выбор затронутого (kaname#707): на черновике запроса в ветку эпика задания ниже
  # исполняются, только если их выбрала карта `.github/ci-paths.json`; на ready, на
  # запросе в main, на push и ручном запуске — полный прогон. Пропуск даёт `skipped`,
  # а сводный вердикт `prverdict` на черновике красный по построению.
  changes:
    name: выбор затронутого (образ)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.pick.outputs.full }}
      jobs: ${{ steps.pick.outputs.jobs }}
      duplicate: ${{ steps.duplicate.outputs.duplicate }}
    steps:
      # ДВОЙНИК СБОРКИ ЗАПРОСА (kaname#847). Ветка задачи названа номером, как
      # линия, и фильтр `push` её пропускает; публикации у неё нет (шаг `gate`),
      # а ту же голову собирает прогон её запроса. Сборка по `push` здесь — без
      # потребителя: дублей «push + запрос» на одном коммите за 2026-10-02…16 —
      # 233, из них на ветках задач 204. Снять `push` с веток-номеров нельзя:
      # тег головы линии пинит зонт монорепо (`values.yaml` — `296-…`).
      #
      # Пропуск — ровно когда (1) ветка — задача: база ни одного запроса, тот же
      # признак, что у `gate`; (2) у неё открытый НЕ-черновой запрос в базу из
      # фильтра `pull_request` ниже. Черновой не в счёт: там образ выбирает карта
      # путей и может не выбрать. Отказ провайдера и неразобранный ответ —
      # «собирать», вслух: потеря сборки молча дороже лишней. Пробы —
      # `internal/check` TestImagePushOnATaskBranchIsNotRebuiltWhenItsReviewBuildsIt.
      - name: отправка в ветку задачи — двойник сборки её запроса?
        id: duplicate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REPO: ${{ github.repository }}
        run: |
          decide() { echo "duplicate=$1" >> "$GITHUB_OUTPUT"; echo "$2"; }
          unknown() {
            echo "::warning title=СБОРКА НЕ СНЯТА::ветка $REF_NAME: $1 — двойник ли сборка, не установлено; собираем"
            decide false "не установлено: собираем"
          }
          if [ "$EVENT" != push ] || [ "$REF_TYPE" != branch ] || ! [[ "$REF_NAME" =~ ^[0-9]+$ ]]; then
            decide false "$EVENT на $REF_NAME: не отправка в ветку-номер — собираем"; exit 0
          fi
          bases=$(gh api "repos/$REPO/pulls?base=$REF_NAME&state=all&per_page=1" --jq length) ||
            { unknown "перепись запросов с этой базой отказала"; exit 0; }
          [[ "$bases" =~ ^[0-9]+$ ]] || { unknown "ответ переписи баз «$bases» не разобран"; exit 0; }
          [ "$bases" = 0 ] || { decide false "ветка $REF_NAME — линия: база запроса, сборка публикуемая"; exit 0; }
          pulls=$(gh api "repos/$REPO/pulls?head=${REPO%%/*}:$REF_NAME&state=open&per_page=100") ||
            { unknown "перепись запросов с этой головой отказала"; exit 0; }
          n=$(jq '[.[] | select(.draft == false and (.base.ref == "main" or (.base.ref | test("^[0-9]+$"))))] | length' <<<"$pulls") ||
            { unknown "ответ переписи голов не разобран"; exit 0; }
          case "$n" in
            0) decide false "ветка $REF_NAME — задача без открытого готового запроса в ствол или линию: сборка по push единственная" ;;
            [1-9]*) decide true "ветка $REF_NAME — задача, её голову собирает прогон запроса (их $n): сборка по push снята" ;;
            *) unknown "число запросов «$n» не разобрано" ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: false
      - name: выбор затронутого по карте путей
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.ref }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/affected.py --github-output docker-build.yml

  image:
    if: ${{ needs.changes.outputs.duplicate != 'true' && (needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'image')) }}
    needs: [changes]
    name: образ службы (сборка · публикация по пину)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # ЧТО СОБИРАЕМ. Один шаг — один источник истины: ниже и тег, и провенанс
      # читают только его выводы.
      #
      # Развилка здесь ОСТАВЛЕНА в шаге, и это не отступление от уклада файла
      # рядом: тот выносит в скрипты логику, ЧИТАЮЩУЮ КОД ВОЗВРАТА, — её `-e`
      # обрывает молча до всякой развилки, и доказать её инъекцией нечем. Здесь
      # не читается ни один код возврата: вычисляется ИМЯ. Ошибка в нём видна
      # первой же строкой вывода, а не прячется в зелёном.
      #
      # У запроса на слияние имя ссылки имеет вид `<номер>/merge`, а косая черта
      # в теге образа недопустима — поэтому имя берётся у ИСХОДНОЙ ветки, а
      # ревизия у её вершины, а не у синтетического слияния.
      - name: что собираем — имя и ревизия
        id: subject
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          slug="${REF_NAME//\//-}"
          if [ "$REF_TYPE" = "tag" ]; then
            image_tag="$slug"          # ссылка на версию: образ носит саму версию
          else
            image_tag="$slug-${HEAD_SHA:0:8}"
          fi
          {
            echo "tag=$image_tag"
            echo "version=$slug"
            echo "revision=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "тег=$image_tag ревизия=${HEAD_SHA:0:8}"

      # УЧЁТНЫЕ ДАННЫЕ РЕЕСТРА — УСЛОВИЕ, А НЕ ВЕРДИКТ О ДЕРЕВЕ. Их отсутствие
      # переводит производителя в режим «только сборка» и говорит об этом вслух;
      # запрос на слияние не публикует НИКОГДА, даже когда секрет доступен.
      #
      # ЛИНИЮ ОТ ЗАДАЧИ ОТЛИЧАЕТ ЭТОТ ШАГ, А НЕ ФИЛЬТР `push`. Ветки задач, волн
      # и эпиков названы номером своей задачи и форму имени делят: `'[0-9]+'`
      # пропускает и `366`, и `429`. Посажено состояние только там, КУДА
      # ВЛИВАЮТ, — а вливают запросом, поэтому признак линии — перепись запросов
      # с этой базой у провайдера: ноль — ветка задачи (она ГОЛОВА запроса в
      # волну, а не его база), и её состояние не публикуется. Перепись берётся
      # по ВСЕМ состояниям: у линии, все запросы в которую уже влиты, открытых
      # ноль, а голова посажена. Замер 2026-09-27: базы `main`, `357`, `366` —
      # по запросу и больше; `398`, `405`, `415`, `315` — ноль.
      #
      # Отказ провайдера — НЕ «задача»: решить «не публикуем» значило бы вернуть
      # голову линии без образа (#429) без единого красного. Шаг отказывает и
      # называет, что не установлено.
      #
      # Ствол и ссылка на версию трекер не спрашивают: их посаженность — имя.
      # Любая другая ветка (ручной запуск на ветке полосы) не публикуется.
      - name: гейт учётных данных реестра и посаженности
        id: gate
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$DH_USER" ] || [ -z "$DH_TOKEN" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "ns=$FALLBACK_NS" >> "$GITHUB_OUTPUT"
            echo "::warning::учётные данные реестра не объявлены — ТОЛЬКО СБОРКА, публикации нет"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            landed=false; why="запрос на слияние: собираем, не публикуем"
          elif [ "$REF_TYPE" = "tag" ] || [ "$REF_NAME" = "main" ]; then
            landed=true; why="ствол или ссылка на версию: публикуем"
          elif [[ "$REF_NAME" =~ ^[0-9]+$ ]]; then
            if ! bases=$(gh api "repos/$REPO/pulls?base=$REF_NAME&state=all&per_page=1" --jq length); then
              echo "::error title=НЕ ИСПОЛНЯЛАСЬ::ветка $REF_NAME: линия или задача — не установлено, перепись запросов у провайдера отказала. Публикации нет, и это не вердикт о дереве"
              exit 1
            fi
            case "$bases" in
              0) landed=false; why="ветка $REF_NAME — задача: база ни одного запроса, её состояние не посажено; собираем, не публикуем" ;;
              1) landed=true; why="ветка $REF_NAME — линия: база запроса, голова посажена вливанием; публикуем" ;;
              *) echo "::error title=НЕ ИСПОЛНЯЛАСЬ::ветка $REF_NAME: линия или задача — не установлено, ответ переписи запросов «$bases» не разобран"
                 exit 1 ;;
            esac
          else
            landed=false; why="ветка $REF_NAME вне ствола и линии: собираем, не публикуем"
          fi
          echo "push=$landed" >> "$GITHUB_OUTPUT"
          echo "ns=$DH_USER" >> "$GITHUB_OUTPUT"
          echo "$why"

      # САМОПРОВЕРКА СВЕРКИ ОПУБЛИКОВАННОГО — БЕЗУСЛОВНО И ДО СБОРКИ. Сверка,
      # потерявшая способность упасть, молчит так же, как исправная на верном
      # образе, и различить их можно только инъекцией — до того, как поверить
      # её молчанию. Безусловно — потому что запрос на слияние саму сверку не
      # исполняет (он не публикует), и без этого шага её поломка доехала бы до
      # линии непроверенной. Реестр здесь не нужен: он подменён двойником.
      - name: сверка опубликованного — доказательство инъекцией в обе стороны
        run: .github/scripts/image-published-revision.sh --self-test

      - name: вход в реестр
        if: steps.gate.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ПИН ПО ОТПЕЧАТКУ, а не по движущемуся тегу: эмуляция задаёт то, ЧТО
      # собрано под чужой архитектурой, и вердикт прогона относился бы к
      # инструменту, который завтра другой. Нужна она только там, где собираются
      # обе архитектуры, — на запросе слияния шаг пропускается вместе с ними.
      - name: QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4
        with:
          image: mirror.gcr.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      # КОНТЕКСТ СБОРКИ — КОРЕНЬ ЭТОГО ДЕРЕВА, и это ровно то, что объявляет
      # шапка `Dockerfile`: служба несёт свой модуль и тянет платформу внешней
      # зависимостью, поэтому соседних деревьев ей не нужно.
      #
      # ДВЕ АРХИТЕКТУРЫ — ТОЛЬКО НА ПУБЛИКУЕМОМ. Эмуляция чужой архитектуры
      # стоит кратно дороже, а на запросе слияния спрашивают другое: собирается
      # ли дерево вообще. Ответ на этот вопрос одна архитектура даёт целиком.
      #
      # КЭШ — `type=gha`: у одноразовой машины builder своего между прогонами не
      # хранит, поэтому без внешнего каждая сборка шла бы с нуля. `mode=max`
      # сохраняет промежуточные ступени: у многоступенчатого файла сборки без
      # него кэшируется только последняя, то есть кэш есть, а толку с него мало.
      - name: сборка образа
        env:
          IMAGE_REF: ${{ steps.gate.outputs.ns }}/${{ env.IMAGE_NAME }}:${{ steps.subject.outputs.tag }}
          PLATFORMS: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          PUSH_FLAG: ${{ steps.gate.outputs.push == 'true' && '--push' || '' }}
          REVISION: ${{ steps.subject.outputs.revision }}
          VERSION: ${{ steps.subject.outputs.version }}
        run: |
          echo "образ:      $IMAGE_REF"
          echo "архитектуры: $PLATFORMS"
          echo "публикация: ${PUSH_FLAG:-нет}"
          docker buildx build \
            --platform "$PLATFORMS" \
            --provenance=false \
            --build-arg OCI_IMAGE_REVISION="$REVISION" \
            --build-arg OCI_IMAGE_VERSION="$VERSION" \
            --cache-from "type=gha,scope=$IMAGE_NAME" \
            --cache-to "type=gha,mode=max,scope=$IMAGE_NAME" \
            -f ./Dockerfile \
            -t "$IMAGE_REF" \
            $PUSH_FLAG .

      # ОПУБЛИКОВАННОЕ СВЕРЯЕТСЯ С ГОЛОВОЙ (п.1 предиката #429). Код отправки
      # отвечает «отправлено» и только. Есть ли тег в реестре и из какого дерева
      # собрано то, что под ним лежит, спрашивается здесь — у реестра, по
      # каждой платформе, файлом ревизии в образе. Разбор и коды — в шапке
      # сверки; красное здесь на стволе получает читателя заданием ниже.
      #
      # Условие — то же, что у публикации: где не публиковали, спрашивать реестр
      # не о чем. Ссылка, ревизия и платформы — те же выражения, что у сборки:
      # второе написание одной величины разошлось бы с первым молча. Оба
      # требования судит гейт `internal/check/image_published_revision.go`.
      - name: опубликованный образ несёт ревизию головы
        id: published
        if: steps.gate.outputs.push == 'true'
        env:
          IMAGE_REF: ${{ steps.gate.outputs.ns }}/${{ env.IMAGE_NAME }}:${{ steps.subject.outputs.tag }}
          REVISION: ${{ steps.subject.outputs.revision }}
          PLATFORMS: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
        run: .github/scripts/image-published-revision.sh "$IMAGE_REF" "$REVISION" "$PLATFORMS"

      # «Не влезли» обязано читаться числом, а не гадаться по падению: сборка
      # под две архитектуры — главный потребитель диска в этом задании.
      - name: диск после сборки
        if: always()
        run: df -h / | tail -1

  # ── ВЕРДИКТ СТВОЛА ──────────────────────────────────────────────────────────
  #
  # Держатель живёт в КАЖДОМ процессе, идущем на ствол, а не в одном из них.
  # Прежде он стоял только в `ci`, и это закрывало треть предмета: единица счёта
  # задачи #62 — прогон ПРОЦЕССА на ревизии ствола, а процессов три. Красное
  # образа службы не производило события вовсе — ровно то состояние, из которого уходят.
  #
  # Держатель ОДИН НА РЕВИЗИЮ, а не один на процесс: заголовок задачи ключуется
  # ревизией, поэтому второй покрасневший процесс той же ревизии ДОПОЛНЯЕТ уже
  # заведённого, а не заводит второго. Две задачи об одном предмете расходятся
  # молча, и расходится та, которую не читают.
  trunkverdict:
    name: вердикт ствола — красное не остаётся без читателя
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # ПОЧЕМУ `!cancelled()`, А НЕ `always()` — ЗАМЕР, А НЕ ВКУС.
    #
    # У процесса стоит `cancel-in-progress` по группе `${{ github.ref }}`: два
    # вливания подряд ВЫТЕСНЯЮТ прогон предыдущей ревизии, и его задания
    # получают исход `cancelled`. При `always()` держатель срабатывал бы на
    # каждом таком вытеснении и заводил `P0` «ствол красен» — на ШТАТНОЙ работе.
    # Замер по 40 прогонам ствола: `success` 31 · `failure` 3 · `cancelled` 6,
    # то есть ложная тревога приходила бы вдвое чаще настоящей.
    #
    # Держатель, кричащий на штатном состоянии, перестают читать — и вместе с
    # ним перестают читать настоящую находку. `!cancelled()` снимает ровно эту
    # ветвь и сохраняет ту, ради которой держатель заведён: на КРАСНОМ стволе
    # задание идёт (умолчание `success()` сняло бы его именно там).
    #
    # Вытесненная ревизия без читателя не остаётся: её вытеснил СЛЕДУЮЩИЙ
    # коммит, и вердикт выносится о нём — о том состоянии ствола, которое
    # действует. Отменённое ОТДЕЛЬНОЕ задание при неотменённом прогоне
    # по-прежнему читается как «без вердикта» и событие производит.
    needs:
      - image
      - changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Право на запись задач — ТОЛЬКО у этого задания, и оно наименьшее из
    # достаточных.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Самопроверка идёт ДО вердикта: держатель, потерявший способность
      # производить событие, молчит ровно так же, как исправный на зелёном стволе.
      - name: держатель — доказательство инъекцией в обе стороны
        run: .github/scripts/trunk-verdict-holder.sh --self-test

      - name: вердикт ствола
        env:
          GH_TOKEN: ${{ github.token }}
          TRUNK_VERDICT_REPO: ${{ github.repository }}
          TRUNK_VERDICT_SHA: ${{ github.sha }}
          TRUNK_VERDICT_PROCESS: ${{ github.workflow }}
          TRUNK_VERDICT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          rc=0
          .github/scripts/trunk-verdict-holder.sh \
            "${{ needs.changes.result }}" \
            "${{ needs.image.result }}" || rc=$?
          case "$rc" in
            0) echo "ствол зелен — держателя заводить не из чего" ;;
            1) echo "::error title=СТВОЛ КРАСЕН::держатель заведён либо дополнен в трекере. Пока он открыт, ствол считается красным; закрывать — с артефактом починки"; exit 1 ;;
            *) echo "::error title=НЕ ИСПОЛНЯЛАСЬ::событие НЕ произведено — либо исходы не разобраны, либо производитель отказал. Читателя у красного НЕ появилось"; exit 1 ;;
          esac
