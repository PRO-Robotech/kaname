# docker-build — ПРОИЗВОДИТЕЛЬ ОБРАЗА СЛУЖБЫ.
#
# ─────────────────────────────────────────────────────────────────────────────
# ЗАЧЕМ ОН ЗАВЕДЁН
#
# Образ службы требуется профилем умбреллы БЕЗУСЛОВНО, а собирали его только
# механизмы монорепо: задание её конвейера и рецепт её каталога развёртывания.
# Оба уезжают вместе с каталогом службы, когда тот снимут, и образ перестал бы
# производиться ВОВСЕ — молча: требование остаётся, а производитель исчезает
# вместе со строкой, которая его несла. Поэтому производитель заводится ДО
# удаления, а не вместе с ним.
#
# ЗДЕСЬ ОН И ЕСТЬ ЕДИНСТВЕННЫЙ. Дерево службы живёт в монорепо и уезжает сюда
# производителем поставки, который кладёт в репозиторий артефакта РОВНО
# `services/<служба>` и утверждает равенство наборов файлов. Значит объявление
# конвейера обязано лежать В ДЕРЕВЕ СЛУЖБЫ: положенное только в артефакт
# следующая же выкладка снимет, и снимет беззвучно. Что этот файл доезжает,
# держит проба `TestDeliveryCarriesItsOwnPipeline` — она перечисляет файлы
# конвейера поимённо, поэтому новый приходит в неё вместе со своей записью.
#
# В МОНОРЕПО ЭТО ОБЪЯВЛЕНИЕ НЕ ИСПОЛНЯЕТСЯ. Провайдер читает объявления
# процессов только в `.github/workflows` КОРНЯ репозитория, а этот путь лежит на
# два уровня глубже: ранеров он там не занимает и вторых прогонов не создаёт.
# Собственный образ монорепо продолжает собирать её собственное задание — два
# производителя об одном имени существуют ровно до разреза, и это осознанно:
# сначала появляется второй, потом снимается первый.
#
# ─────────────────────────────────────────────────────────────────────────────
# ЧТО ИМЕННО ПРОИЗВОДИТСЯ — И ЧЕМ ТЕГ ОТЛИЧАЕТСЯ ОТ ПРОВЕНАНСА
#
# Тег отвечает «что собрали», провенанс — «из чего собрали», и совпадают они
# лишь пока никто не пересобирал под тем же именем. Поэтому величины РАЗНЫЕ:
# в тег идёт короткая форма, в клеймо и в файл внутри образа — ПОЛНАЯ ревизия.
#
#   ссылка на версию   — `v<МАЖОР>.<МИНОР>.<ПАТЧ>` (образ тегуется самой версией)
#   ствол              — `main-<8 знаков ревизии>`
#   запрос на слияние   — НЕ публикуется вовсе, только собирается
#
# ФОРМА ТЕГА СТВОЛА ВЗЯТА У МОНОРЕПО НАМЕРЕННО: профили посадки пинят службу
# именно ею. Что изменилось после выноса и о чём надо знать: `main-<ревизия>`
# теперь называет ревизию ЭТОГО дерева, а не монорепо. Прежние пины остаются
# годными — опубликованный тег неизменяем, — но новые приходят из другого
# пространства ревизий, и сравнивать их с прежними по числу нельзя.
#
# ─────────────────────────────────────────────────────────────────────────────
# ПОЧЕМУ ПУБЛИКАЦИЯ ГЕЙТИТСЯ УЧЁТНЫМИ ДАННЫМИ, А НЕ ТРЕБУЕТ ИХ
#
# Учётные данные реестра — внешнее условие, а не свойство дерева. Их отсутствие
# говорит об УСЛОВИИ («в этом репозитории секрет не объявлен»), а не о дереве, и
# ронять на нём сборку значило бы выдать одно за другое. Поэтому без них
# производитель СОБИРАЕТ и не публикует, говоря об этом вслух: замер на день
# заведения — `actions/secrets` этого репозитория отдаёт `total_count: 0`, то
# есть на уровне репозитория их нет, и публикация состоится ровно тогда, когда
# секрет доедет сюда с уровня организации.
#
# Пустое пространство имён при этом ЗАПРЕЩЕНО грамматикой ссылки на образ, и
# отказ пришёл бы ДО публикации — то есть сломалась бы и сборка. Отсюда
# `FALLBACK_NS`: тег остаётся правильной формы и в режиме «только сборка».
#
# ─────────────────────────────────────────────────────────────────────────────
# ЧЕГО ЭТОТ ПРОИЗВОДИТЕЛЬ НЕ ДЕЛАЕТ — сказано прямо
#
# Он не двигает движущихся тегов (`latest` не публикуется): движущийся тег
# означает, что вердикт вчерашнего прогона относится к образу, который сегодня
# другой. Он не правит профилей посадки: пин — решение оператора, и подставлять
# его за него производитель не вправе.
name: образ службы

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Запрос на слияние собирает и НЕ публикует. Это не «на всякий случай»: файл
  # сборки — часть дерева, и его поломка иначе обнаружилась бы только после
  # вливания, когда чинить приходится ствол.
  pull_request:
    branches: [main]
  workflow_dispatch:

# `actions: write` — НЕ право «на всякий случай»: кэш `type=gha` пишется через
# API кэша действий, и без этой записи `--cache-to` не падает, а МОЛЧА ничего не
# сохраняет. Кэш был бы объявлен, провязан и пуст на каждом прогоне — форма без
# содержания, заметная только по времени сборки.
permissions:
  contents: read
  actions: write

# Образ устаревшей ревизии не нужен никому, а сборка под две архитектуры — не та
# работа, которую стоит доводить до конца ради состояния, уже вытесненного
# следующим.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

# СТАТУС НЕ ТЕРЯЕТСЯ В ТРУБЕ. Умолчание для `run:` — `bash -e {0}`, то есть БЕЗ
# pipefail: `<сборка> | tee` отдаёт шагу код ПРАВОЙ команды и зеленеет при любом
# провале левой. `shell: bash` включает `-eo pipefail`.
defaults:
  run:
    shell: bash

env:
  # Пространство имён при НЕобъявленном секрете. Тег обязан остаться правильной
  # формы и в режиме «только сборка»: пустое имя даёт `/kaname:tag`, а грамматика
  # ссылки на образ пустой части не допускает — отказ пришёл бы до публикации.
  FALLBACK_NS: local
  IMAGE_NAME: kaname

jobs:
  image:
    name: образ службы (сборка · публикация по пину)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # ЧТО СОБИРАЕМ. Один шаг — один источник истины: ниже и тег, и провенанс
      # читают только его выводы.
      #
      # Развилка здесь ОСТАВЛЕНА в шаге, и это не отступление от уклада файла
      # рядом: тот выносит в скрипты логику, ЧИТАЮЩУЮ КОД ВОЗВРАТА, — её `-e`
      # обрывает молча до всякой развилки, и доказать её инъекцией нечем. Здесь
      # не читается ни один код возврата: вычисляется ИМЯ. Ошибка в нём видна
      # первой же строкой вывода, а не прячется в зелёном.
      #
      # У запроса на слияние имя ссылки имеет вид `<номер>/merge`, а косая черта
      # в теге образа недопустима — поэтому имя берётся у ИСХОДНОЙ ветки, а
      # ревизия у её вершины, а не у синтетического слияния.
      - name: что собираем — имя и ревизия
        id: subject
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          slug="${REF_NAME//\//-}"
          if [ "$REF_TYPE" = "tag" ]; then
            image_tag="$slug"          # ссылка на версию: образ носит саму версию
          else
            image_tag="$slug-${HEAD_SHA:0:8}"
          fi
          {
            echo "tag=$image_tag"
            echo "version=$slug"
            echo "revision=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "тег=$image_tag ревизия=${HEAD_SHA:0:8}"

      # УЧЁТНЫЕ ДАННЫЕ РЕЕСТРА — УСЛОВИЕ, А НЕ ВЕРДИКТ О ДЕРЕВЕ. Их отсутствие
      # переводит производителя в режим «только сборка» и говорит об этом вслух;
      # запрос на слияние не публикует НИКОГДА, даже когда секрет доступен.
      - name: гейт учётных данных реестра
        id: gate
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$DH_USER" ] || [ -z "$DH_TOKEN" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "ns=$FALLBACK_NS" >> "$GITHUB_OUTPUT"
            echo "::warning::учётные данные реестра не объявлены — ТОЛЬКО СБОРКА, публикации нет"
          elif [ "$EVENT" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "ns=$DH_USER" >> "$GITHUB_OUTPUT"
            echo "запрос на слияние: собираем, не публикуем"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "ns=$DH_USER" >> "$GITHUB_OUTPUT"
          fi

      - name: вход в реестр
        if: steps.gate.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ПИН ПО ОТПЕЧАТКУ, а не по движущемуся тегу: эмуляция задаёт то, ЧТО
      # собрано под чужой архитектурой, и вердикт прогона относился бы к
      # инструменту, который завтра другой. Нужна она только там, где собираются
      # обе архитектуры, — на запросе слияния шаг пропускается вместе с ними.
      - name: QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4
        with:
          image: mirror.gcr.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      # КОНТЕКСТ СБОРКИ — КОРЕНЬ ЭТОГО ДЕРЕВА, и это ровно то, что объявляет
      # шапка `Dockerfile`: служба несёт свой модуль и тянет платформу внешней
      # зависимостью, поэтому соседних деревьев ей не нужно.
      #
      # ДВЕ АРХИТЕКТУРЫ — ТОЛЬКО НА ПУБЛИКУЕМОМ. Эмуляция чужой архитектуры
      # стоит кратно дороже, а на запросе слияния спрашивают другое: собирается
      # ли дерево вообще. Ответ на этот вопрос одна архитектура даёт целиком.
      #
      # КЭШ — `type=gha`: у одноразовой машины builder своего между прогонами не
      # хранит, поэтому без внешнего каждая сборка шла бы с нуля. `mode=max`
      # сохраняет промежуточные ступени: у многоступенчатого файла сборки без
      # него кэшируется только последняя, то есть кэш есть, а толку с него мало.
      - name: сборка образа
        env:
          IMAGE_REF: ${{ steps.gate.outputs.ns }}/${{ env.IMAGE_NAME }}:${{ steps.subject.outputs.tag }}
          PLATFORMS: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          PUSH_FLAG: ${{ steps.gate.outputs.push == 'true' && '--push' || '' }}
          REVISION: ${{ steps.subject.outputs.revision }}
          VERSION: ${{ steps.subject.outputs.version }}
        run: |
          echo "образ:      $IMAGE_REF"
          echo "архитектуры: $PLATFORMS"
          echo "публикация: ${PUSH_FLAG:-нет}"
          docker buildx build \
            --platform "$PLATFORMS" \
            --provenance=false \
            --build-arg KACHO_IMAGE_REVISION="$REVISION" \
            --build-arg KACHO_IMAGE_VERSION="$VERSION" \
            --cache-from "type=gha,scope=$IMAGE_NAME" \
            --cache-to "type=gha,mode=max,scope=$IMAGE_NAME" \
            -f ./Dockerfile \
            -t "$IMAGE_REF" \
            $PUSH_FLAG .

      # «Не влезли» обязано читаться числом, а не гадаться по падению: сборка
      # под две архитектуры — главный потребитель диска в этом задании.
      - name: диск после сборки
        if: always()
        run: df -h / | tail -1
