#
# platform-tree — ВТОРОЙ ОПЕРАНД сверок с манифестами модулей платформы,
# созданный выборкой. Один дом на все задания, которым он нужен.
#
# ЗАЧЕМ ОДИН ДОМ. Условие «дерево платформы названо ручкой PLATFORM_TREE» нужно
# двум заданиям конвейера: манифестам/канону модели (`authzartifacts`) и
# контейнерным пробам (`integration`) — три пробы пакета `internal/repo/kaname/pg`
# применяют поставляемые манифесты к живой базе. Пока условие создавало ОДНО
# задание, пробы второго пропускали себя с предпосылкой, у которой производителя
# в их задании не было: пропуск, у которого нет производителя, неотличим от
# исправной работы. Два места об одном условии разошлись бы молча (выборка,
# состав операнда, имя каталога), поэтому условие вынесено сюда, а задания его
# ЗОВУТ.
#
# ЧТО ВЫБИРАЕТСЯ И ПОЧЕМУ ИМЕННО ЭТО. Блоки модели доступов сверяются с
# манифестами ОСТАЛЬНЫХ модулей платформы, а те живут в её репозитории: держать
# их копию здесь запрещено (ban #20, `polyrepo.md` §«Копия между репозиториями
# ЗАПРЕЩЕНА»), поэтому условие создаётся на прогоне. Выборка РАЗРЕЖЁННАЯ и НЕ
# конусная: нужны ровно манифесты модулей и объявление состава стендов, а
# конусный режим тянет каталог служб целиком — плата за операнд стала бы больше
# самого операнда.
#
# Выборка кладётся ПОД корень дерева намеренно: обход сверки идёт от корня и за
# него не выходит by construction. Каталог вне корня рецепт назовёт «условие
# создано неверно» — молчаливых находок о чужих модулях не будет.
#
# ВТОРОЙ ОПЕРАНД СОСТАВНОЙ: манифесты СОСЕДЕЙ приезжают выборкой, манифест ЭТОГО
# модуля лежит здесь. Без него набор неполон, и это не «сверка уже», а сверка О
# ДРУГОМ: производитель таблицы типов читает закрытый набор модулей, и потерянный
# тип не резолвится краем — вопрос о нём не задаётся вовсе, а проверка выглядит
# пройденной. Копией репозитория это НЕ является (ban #20): файл не лежит в дереве
# платформы и не отслеживается им — он кладётся В ПРОГОНЕ, в выборку, которая
# живёт минуты и никуда не отправляется. `git add` обязателен: перечень
# манифестов сверка канона берёт у ИНДЕКСА, а не обходом диска, и
# неотслеживаемый файл не был бы найден — молча.
#
# ИСХОДОВ У ДЕЙСТВИЯ ДВА, И ОБА ЧИТАЮТСЯ ВЫХОДОМ `outcome`, а не исходом шага:
# сама выборка идёт под `continue-on-error`, поэтому шаг вызывающего зелен и
# тогда, когда операнд не создан. Вызывающий обязан ветвиться по
# `steps.<id>.outputs.outcome`: `success` — операнд лежит в `outputs.root`,
# иначе `root` пуст, аннотация о третьем исходе уже напечатана здесь, и
# передавать пустую ручку дальше законно — держатели читают её как «условие не
# создано» с названным производителем, а не как красное.
name: platform-tree
description: >-
  Дерево платформы для сверок с манифестами модулей: разрежённая выборка
  PRO-Robotech/kacho под корнем плюс манифест этого модуля. Выход outcome —
  создано ли условие; root — корень операнда (пуст, если не создано).

inputs:
  path:
    description: Каталог выборки относительно корня дерева службы.
    required: false
    default: upstream-kacho
  module:
    description: Имя каталога этого модуля внутри services/ операнда.
    required: false
    default: iam
  own-manifest:
    description: Манифест этого модуля относительно корня дерева службы.
    required: false
    default: manifest.yaml

outputs:
  outcome:
    description: Исход выборки дерева платформы (success либо иное).
    value: ${{ steps.fetch.outcome }}
  root:
    description: Абсолютный корень операнда; пуст, если условие не создано.
    value: ${{ steps.operand.outputs.root }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      id: fetch
      continue-on-error: true
      with:
        repository: PRO-Robotech/kacho
        path: ${{ inputs.path }}
        fetch-depth: 1
        sparse-checkout: |
          services/*/manifest.yaml
          deploy/stacks.txt
          deploy/helm/umbrella
        sparse-checkout-cone-mode: false
        persist-credentials: false

    # Аннотация о несозданном условии — ОТДЕЛЬНЫМ шагом без падающего пути:
    # замолчать чужой отказ ему нечем. Что делать с пустым операндом, решает
    # вызывающий: сверка канона выйдет кодом 2, пробы пропустят себя с названной
    # предпосылкой.
    - name: выборка дерева платформы не удалась — это третий исход
      if: steps.fetch.outcome != 'success'
      shell: bash
      run: |
        echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::выборка дерева платформы дала «${{ steps.fetch.outcome }}». Сверки и пробы, судящие манифесты всего набора модулей, вердикта не дадут — это третий исход, а не находка."

    - name: второй операнд достраивается манифестом этого модуля
      id: operand
      if: steps.fetch.outcome == 'success'
      shell: bash
      env:
        TREE: ${{ github.workspace }}/${{ inputs.path }}
        MODULE: ${{ inputs.module }}
        OWN_MANIFEST: ${{ inputs.own-manifest }}
      run: |
        set -euo pipefail
        mkdir -p "$TREE/services/$MODULE"
        cp "$OWN_MANIFEST" "$TREE/services/$MODULE/manifest.yaml"
        git -C "$TREE" add "services/$MODULE/manifest.yaml"
        echo "манифестов в операнде: $(git -C "$TREE" ls-files 'services/*/manifest.yaml' | wc -l)"
        echo "root=$TREE" >> "$GITHUB_OUTPUT"
