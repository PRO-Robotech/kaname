name: kaname
replicas: 1
# ── ОБРАЗ: КООРДИНАТА, КОТОРУЮ ЗАВОДИТ ОПЕРАТОР ─────────────────────────────
#
# Умолчания НЕТ намеренно, и это решение, а не пропуск. Здесь стоял тег нашего
# стенда (`kaname:dev`) — артефакт сборки образов, который кладётся в узлы
# локального кластера и в чужом реестре не существует. Дефект тот же, что у имён
# зонтичного релиза строкой ниже, и на шаг дальше их: там имя ОБЪЕКТА кластера,
# здесь координата ОБРАЗА в реестре.
#
# Умолчание при этом ВСЕГДА НЕПУСТО, поэтому профиль читается настроенным, а
# отказ приходит уже в кластере и стоит переката:
#   Failed to pull image "kaname:dev": pull access denied, repository does not
#   exist or may require authorization  (Init:ImagePullBackOff)
#
# Ни одна накладка чарта образ не переобъявляла — то есть боевая посадка
# отдельного клона была неисполнима by construction. Теперь координату называет
# накладка: `values.prod.yaml` — предписанием в зарезервированной области
# `.example.invalid`, `values.dev.yaml` — тегом нашего стенда, которому там и
# место. Незаданная координата роняет РЕНДЕР одним перечнем вместе с остальными
# неназванными (`templates/_helpers.tpl`), а не под — в кластере.
image: ""
# imageId — идентификатор СОДЕРЖИМОГО образа, необязательный.
#
# Нужен ровно одному, кто ставит по ИЗМЕНЯЕМОМУ тегу: пересборка под тем же
# тегом не меняет шаблон пода, и под не перекатывается — процесс продолжает
# работать старым бинарником. Названный здесь идентификатор попадает в
# аннотацию пода и перекат восстанавливает.
#
# Пусто по умолчанию, и тогда аннотации нет ВОВСЕ — постоянная заглушка
# выглядела бы привязкой, ничего не привязывая. Ставящему по прибитому
# отпечатку (`repo@sha256:…`) ключ не нужен: отпечаток и так часть шаблона пода.
#
# Ключ ЧАРТА, не глобальный: у отдельного продукта одна рабочая нагрузка, и
# карта, ключуемая каталогом службы, была бы формой платформы, а не его.
imageId: ""
imagePullPolicy: IfNotPresent
#
# ── ПОРТЫ: ОДНА ДВЕРЬ — ОДНА РУЧКА ──────────────────────────────────────────
#
# Ключи ниже двигают И слушатель (через `config.yaml`), И маршрут к нему. Ключа,
# двигающего одно без другого, здесь нет и заводить его нельзя: он выглядел бы
# настройкой, а Service вёл бы в никуда (задача #2337).
#
# Поверхности, чей адрес приходит УМОЛЧАНИЕМ ПРОЦЕССА, ключа посадки не имеют
# вовсе — вебхуки (:9092), выдача токенов (:9096), зеркало ключей (:9097).
# Ручки, которая двигала бы их слушатель, у этого чарта нет, поэтому и ручки,
# двигающей их маршрут, быть не должно: маршрут выводится из умолчания процесса
# (`kaname-svc.processDefaultPort`), и согласие с ним держит гейт, а не эта
# строка.
#
# Собственные REST-фронты объявляет ПОСАДКА — и объявляет АДРЕСОМ
# (`apiServer.restEndpoint`), а не портом: незаданный адрес означает «фронт не
# поднят». Порт двери выводится из этого же адреса. Здесь стояли два
# закомментированных ключа (`rest`/`internalRest`) — вторая ручка о той же
# двери; боевой профиль задал адрес и не задал их, и чарт к поднятым фронтам
# не вёл.
#
# ЗДЕСЬ БЫЛ ЧЕТВЁРТЫЙ ТАКОЙ КЛЮЧ — `ports.metrics` (задача #2394), и абзац выше
# уже утверждал, что таких ключей нет. Два места об одном предмете, из которых
# верно одно: неверным было общее утверждение. Диагностическую поверхность
# поднимает `api-server.metrics-endpoint`, карта настроек его НЕ эмитила, и
# ключ двигал порт пода с объявлением сбора, оставляя слушатель на прежнем
# адресе. Рендер при этом зелёный: `--set ports.metrics=9195` давал собирателю
# дверь, за которой никого нет.
#
# Ключ СНЯТ, а не научен двигать слушатель, и это выбор по цене: заведи он
# слушатель — диагностика стала бы ЧЕТВЁРТОЙ поверхностью умолчания процесса,
# отличной от трёх соседей формой, которую никто не решал; сверх того «сбора
# здесь нет» выражается пустым адресом, и через целочисленный порт это не
# выразимо. Снятие же дало соседям четвёртого: величина `metrics` в
# `kaname-svc.processDefaultPort` до сих пор стояла без единого вызывающего.
#
# Молчаливого приёма снятого ключа не будет: заданный `ports.metrics` отвергает
# `kaname-svc.requireNoRetiredPortKnobs` отказом рендера, называя предмет.
ports:
  grpc: 9090
  internalGrpc: 9091

# ── ОБЪЕКТЫ Service: ДВА, И РАЗДЕЛЕНЫ ПО ДОСЯГАЕМОСТИ ───────────────────────
#
# Тип — единственный рычаг, которым оператор выводит службу наружу, и на одном
# объекте он двигал бы публичные и служебные двери ВМЕСТЕ. Разделение делает
# «внутреннее не опубликовано наружу» свойством объекта: на публичном служебных
# портов нет вовсе.
#
# Умолчание `ClusterIP` не выводит наружу ничего. Как публичные двери попадают к
# арендатору — входом, балансировщиком или чужим краем — решает установка.
service:
  public:
    type: ClusterIP
  internal:
    type: ClusterIP

# ── ОБЪЯВЛЕНИЕ СБОРА ВЕЛИЧИН ────────────────────────────────────────────────
#
# Служба производит величины богато; способ снять их у отдельно поставленной
# установки был НИ ОДИН (задача #2338). Объявление ниже — тот способ: собиратель
# платформы ходит по подам и читает эти аннотации, поэтому порт Service
# диагностической поверхности не нужен.
#
# ВЫКЛЮЧЕНИЕ ТРЕБУЕТ ПРИЧИНЫ. «Сбора в этой установке нет» — законный выбор
# оператора, но он объявляется, а не получается молча: пустая строка при
# `enabled: false` неотличима от «забыли», и рендер на ней отказывает.
metricsScrape:
  enabled: true
  disabledBecause: ""

# ── ПРАВИЛА ТРЕВОГИ: ОБЪЕКТ, А НЕ ТЕКСТ СТРАНИЦЫ ────────────────────────────
#
# Восемь правил существовали прозой опубликованной страницы: тот, кто ставит
# продукт, их ВИДЕЛ, а переносить в свою систему мониторинга должен был руками
# (задача #2522). Разница между «видит» и «действует» здесь не стилистическая:
# правило, которое надо перепечатать, не перепечатает никто, — и первым не
# сработает то, ради чего замер и делался. `KanameIdentityLedgerUnsampled`
# звонит на ОТСУТСТВИЕ события, то есть там, где ждать симптома неоткуда.
#
# ВЫКЛЮЧАТЕЛЬ ОБЯЗАТЕЛЕН. `PrometheusRule` — вид ЧУЖОГО оператора; там, где
# оператора Prometheus нет, объект отвергнет схема кластера, и отвергнет она
# ВСЮ установку, а не одну тревогу.
#
# УМОЛЧАНИЕ `true` — осознанно ОБРАТНОЕ решение к «пусто — не сужаем»
# (`security.md` §«Пустой список»): правило, поставленное молча, звонит;
# правило, НЕ поставленное молча, молчит, а молчание неотличимо от исправности.
# Цену ошибки несёт та сторона, которая шумит, — поэтому умолчание стоит на ней.
# Причины при выключении здесь НЕ требуется, и это отличие от `metricsScrape`
# выше названо намеренно: там выключение снимает ЕДИНСТВЕННЫЙ способ снять
# величины, здесь — способ доставки правил, которые страница по-прежнему несёт
# текстом.
alertRules:
  enabled: true
# ── БАЗА: КООРДИНАТЫ, КОТОРЫЕ ЗАВОДИТ ОПЕРАТОР ──────────────────────────────
#
# Три величины ниже НЕ ИМЕЮТ УМОЛЧАНИЯ намеренно, и это решение, а не пропуск.
# Каждая называет объект в ЧУЖОМ кластере, которого этот чарт не создаёт:
# сетевое имя узла Postgres и координату (имя + ключ) объекта Secret с паролем
# к нему. Чарт создаёт СВОИ объекты — Deployment, Service, ConfigMap
# `<name>-config` и, если включена ручка `alertRules`, PrometheusRule; всё
# остальное, на что он ссылается, обязан завести тот, кто ставит.
#
# Здесь стояло «ровно три объекта», и число это пережило свой предмет: четвёртый
# объект завела поставка правил тревоги (#2522). Число в прозе владельца не
# имеет и стареет молча — поэтому перечень назван составом, а не счётом.
#
# ЧТО ЗДЕСЬ СТОЯЛО И ПОЧЕМУ СНЯТО. Стояли имена нашего зонтичного релиза
# (`kacho-umbrella-pg-iam` — и хостом, и именем секрета). Дефектов было два, и
# второй хуже первого:
#
#   1. чужой бренд на витрине оператора — имя объекта первое, что арендатор
#      видит при установке;
#   2. умолчание, которое ВСЕГДА НЕПУСТО и ведёт в никуда. Тот же класс, что
#      адрес зависимости, выведенный из чужого адреса: настройка выглядит
#      заданной, потому что значение есть, — и не работает, потому что значение
#      наше. Ни один профиль не обязан ничего задавать, чтобы это заметить, и
#      отказ приходит уже в кластере, поодиночке за перекат:
#        Error: secret "kacho-umbrella-pg-iam" not found
#
# ПЕРЕИМЕНОВАНИЕ ОТВЕРГНУТО: догадка о чужом кластере осталась бы догадкой,
# сменив только бренд. Пустое значение — отказ, который виден сразу и называет,
# что задать; перечнем, а не первым попавшимся (`templates/_helpers.tpl`,
# `kaname-svc.requireOperatorSuppliedNames`).
#
# `port`, `user` и `name` умолчания сохраняют и объектами кластера не являются:
# порт — зарегистрированный номер протокола, а роль и база живут ВНУТРИ узла,
# который оператор только что назвал. Имя базы к тому же есть канон продукта и
# держится гейтом дерева (`deploy/iam_database_named_for_its_product_test.go`).
db:
  host: ""
  port: "5432"
  user: iam
  name: kaname
  passwordSecretName: ""
  passwordSecretKey: ""

# ─── Config sections (viper YAML, parity с kacho-vpc) ───────────────────
# Все ключи ниже рендерятся в /etc/kaname/config.yaml через
# deploy/templates/configmap.yaml. Любой ключ можно override через
# ENV KANAME_<SECTION>__<KEY>=... (см. internal/apps/kaname/config).
logger:
  level: INFO
apiServer:
  gracefulShutdown: 10s
  # ─── Собственные REST-фронты (KAN-REST-1) ──────────────────────────────────
  # Объявлены ЯВНО, а не умолчанием процесса, и это решение: у трёх соседних
  # HTTP-рёбер адрес приходит умолчанием и потому непуст всегда — профиль, о них
  # умолчавший, поднимал их открытым текстом, и заметить это было неоткуда.
  # Здесь умолчания нет: незаданный адрес означает «фронт не поднят», и это
  # НАЗЫВАЕТСЯ самоотчётом процесса с объяснением, что именно не обслуживается.
  # Здесь стояли адреса обоих фронтов — то есть умолчание, снятое у процесса,
  # возвращалось чартом одним слоем выше, и комментарий над ним утверждал
  # обратное (#2247). Незаданный адрес означает «фронт не поднят», и процесс
  # называет это при старте с объяснением, что именно не обслуживается.
  #   restEndpoint: tcp://0.0.0.0:9098          # объявляет ПОСАДКА
  #   internalRestEndpoint: tcp://0.0.0.0:9099  # объявляет ПОСАДКА
  # ─── Docker Registry v2 token shim (`/iam/token`, :9096) ────────────────────
  # `issuer` пусто → built-in умолчание (api.kacho.local), пригодное только для
  # локального стенда; на развёрнутом окружении оно обязано нести РЕАЛЬНЫЙ
  # публичный хост реестра.
  #
  # `service` УМОЛЧАНИЯ НЕ ИМЕЕТ (задача #1184): это имя службы РЕЕСТРА, оно у
  # каждого кластера своё, и выбрать его за оператора нельзя. Полоса поднята, а
  # имя не объявлено — процесс отказывается стартовать. В умбрелле его объявляет
  # `global.kacho.registry.serviceAud` — ОДИН раз на обе стороны полосы; здесь
  # (одиночная установка чарта) его объявляют этим ключом.
  #
  #   `service` — это НЕ только fallback для `?service=`. Оно же уходит в
  #   issueUC.RegistryAudience (#321) → whitelist'ится как audience в Hydra-клиенте
  #   КАЖДОГО выпускаемого SA-ключа. Если оно расходится с тем, что docker шлёт в
  #   `?service=`, Hydra отвергает обмен:
  #     "Requested audience '<host>' has not been whitelisted by the OAuth 2.0 Client"
  #   → shim отдаёт 401 → `docker login: unauthorized`. Ключи, выпущенные с неверным
  #   значением, придётся ПЕРЕВЫПУСТИТЬ (audience фиксируется в клиенте при создании).
  #
  #   `issuer` — `iss` + realm в WWW-Authenticate; должен совпадать с realm'ом,
  #   который анонсирует data-plane реестра (KACHO_REGISTRY_TOKEN_REALM).
  registryToken:
    issuer: ""
    service: ""
repository:
  postgres:
    # Ширина пула на ОДНУ реплику. Число обязано совпадать с тем, что объявляет
    # вендоренный чарт умбреллы (deploy/helm/umbrella/charts/kaname) — там же
    # лежит и его обоснование арифметикой предела базы.
    #
    # ЭТОТ ЧАРТ НЕ УСТАНАВЛИВАЕТ НИ ОДИН СТЕК (deploy/stacks.txt), поэтому его
    # число ничем не проверялось и разошлось: стояло 50 против 80 у вендоренной
    # копии, а в dev-накладке 20 против 40 (#709). Два места об одном предмете,
    # из которых верно одно, — и неверным оказалось то, у которого нет читателя.
    #
    # Согласие держит deploy/iam_pool_declaration_parity_test.go, а не этот
    # комментарий: правка одной копии без второй роняет прогон и называет обе
    # координаты.
    maxConns: 80
    sslMode: disable
    # ── ЧИТАЮЩАЯ РЕПЛИКА: НЕОБЯЗАТЕЛЬНАЯ, НО ОБЪЯВЛЯЕМАЯ ────────────────────
    #
    # Адрес реплики, с которой служба читает. Пусто — реплики нет, и чтения
    # уходят в основной узел; это законный выбор установки, а не пропуск.
    #
    # КЛЮЧА ЗДЕСЬ НЕ БЫЛО ВОВСЕ, и нашёл это гейт обратного направления
    # (`outbound_lane_has_an_operator_knob_test.go`, задача #2474): процесс
    # полосу поднимает, а объявить её поставкой было нечем — ни ключа, ни
    # переменной в профиле, ни строки в документе установки. Возможность,
    # объявленная и неисполнимая штатным путём, — тот же класс, что почтовая
    # полоса ниже, только тише: у реплики нет даже счётчика исходов, по
    # которому её отсутствие было бы заметно.
    slaveUrl: ""
# Здесь стояли три ключа, которых нет в конфигурации сервиса: metrics.enable,
# healthcheck.enable и extapi.openfga.* — шаблон их подставлял, випер отбрасывал.
#
# Слушатель метрик у iam настоящий, и его ручка одна — api-server.metrics-endpoint
# (пустое значение выключает слушатель). Ключ движка описывал клиента, который
# собирался в композиционном корне из переменных KANAME_*, а не из этого файла;
# сегодня нет и клиента — движок снят стадией S6 эпика #747, вердикт вычисляет
# реляционная форма в своей базе. Оба ключа были ВТОРЫМ способом сказать то же
# самое, причём неработающим.
#
# Умбрелла того же сервиса рассталась с ними раньше (#204); здесь — тот же исход.

# ── ПОЧТОВАЯ ПОЛОСА ПРИГЛАШЕНИЯ ────────────────────────────────────────────
#
# Служба заводит приглашённого и КО-КОММИТИТ намерение отправить ему письмо в
# той же транзакции; дренаж очереди поднимается всегда и это намерение исполняет.
# До задачи #2474 объявить полосу поставкой было НЕЧЕМ: ни одного ключа секции
# чарт не рендерил, и документ установки о ней молчал. Возможность была
# объявлена и неисполнима штатным путём, а следствие для ставящего — тихое:
# приглашение создаётся успешно, письмо не уходит НИКОГДА (каждая попытка даёт
# исход «настройка», пока строка не отравится и не встанет в возврат).
#
# ПУСТОЙ УЗЕЛ — ЗАКОННЫЙ ВЫБОР, А НЕ ПРОПУСК: установка, у которой почты нет,
# объявляет это молчанием ключа, и секция не рендерится вовсе. Отказа старта
# здесь нет намеренно — незаданная полоса не означает «не сужаем»: письмо просто
# не отправляется, и ничьих прав это не расширяет.
#
# ПОЛОВИНА НАСТРОЙКИ ХУЖЕ ОТСУТСТВИЯ ОБЕИХ, и это судит СТРАЖ СТАРТА процесса
# (`InviteMailConfig.Validate`): узел без отправителя, логин без пароля и
# наоборот — отказ, а не предупреждение.
#
# УДОСТОВЕРЕНИЕ — ИМЕНАМИ ПЕРЕМЕННЫХ, А НЕ ЗНАЧЕНИЯМИ. Карта настроек читается
# шире секрета; сами величины оператор кладёт в объект Secret и называет его в
# карте `secrets` ниже.
inviteMail:
  # `host:port` почтового узла. Пусто — полосы нет.
  relay: ""
  # Адрес отправителя, ОДИН на установку. Обязателен, когда объявлен узел.
  from: ""
  # Отображаемое имя отправителя; необязательно.
  fromName: ""
  # ИМЕНА переменных окружения с логином и паролем к узлу — не сами величины.
  usernameEnv: ""
  passwordEnv: ""
  # `starttls` (умолчание процесса) либо `implicit`. Незащищённой полосы среди
  # имён нет намеренно: значения, которого разбор не производит, оператор выбрать
  # не может, как бы он ни написал настройку (ban #16).
  tlsMode: ""
  # Якорь доверия для проверки сертификата почтового узла. Пусто — проверка идёт
  # по системным корням, что верно для публичного ретранслятора и неверно для
  # узла с сертификатом внутреннего центра.
  caBundleFile: ""
  # Адрес страницы входа, который несёт письмо. Пусто — ссылки в письме нет.
  loginUrl: ""

# ── КАРТА ПЕРЕМЕННЫХ ОКРУЖЕНИЯ ──────────────────────────────────────────────
# Отдаётся поду ДОСЛОВНО (templates/deployment.yaml). Сюда идут те ручки службы,
# которые читаются напрямую из окружения: посадка транспорта слушателей
# (`config.LoadMTLS`) и адреса контуров поставщика личности (`Resolve*` методы).
#
# ЗНАЧЕНИЯ ЗДЕСЬ ВИДНЫ В git. Секрету место в `secrets` ниже, ссылкой.
env: {}

# ── ВЕЛИЧИНЫ ИЗ СЕКРЕТА ─────────────────────────────────────────────────────
# Имя переменной окружения → координата в объекте Secret. Пусто — ни одной такой
# переменной под не несёт, и боевой режим в старт не идёт: страж требует общий
# сговор с провайдером личности и ключ обёртки ключницы непустыми.
#
#   secrets:
#     KANAME_HOOK_TOKEN:   { secretName: kaname-authn, secretKey: hook-shared-secret }
#     KANAME_JWKS_ENC_KEY: { secretName: kaname-authn, secretKey: jwks-encryption-key-hex }
secrets: {}

# ── МАТЕРИАЛ TLS СЛУШАТЕЛЕЙ ─────────────────────────────────────────────────
# Секрет объявлен — том монтируется в `<mountPath>/server`, и ручки рёбер (карта
# `env` выше) называют файлы под этим каталогом. Секрет не объявлен — тома нет, и
# посадка остаётся открытым текстом: это законно на стенде и отвергается стражем
# боевой посадки.
tls:
  secretName: ""
  # Лист КЛИЕНТСКОЙ личности — отдельный секрет, а не тот же самый. Служба
  # звонит сама себе (собственные REST-фронты идут к её же gRPC-слушателю), а
  # лист слушателя выписывается с назначением `server auth` и БЕЗ `client auth`:
  # проверка клиентской цепи идёт именно этим назначением и серверный лист её не
  # проходит ни при каком входе. Пусто — тома нет и посадка прежняя; профиль
  # боевой посадки объявляет имя явно.
  clientSecretName: ""
  # ── ЯКОРЬ ПОСТАВЩИКА ЛИЧНОСТИ — СВОЯ КООРДИНАТА, А НЕ ЯКОРЬ ЭТОЙ УСТАНОВКИ ──
  #
  # Величина отвечает на вопрос «ЧЬИМ СЕРТИФИКАТАМ СЕРВЕРА Я ВЕРЮ У СОСЕДА»
  # (административная дорога поставщика, его набор проверочных ключей, его обмен
  # токена). Соседний `secretName` отвечает на ДРУГОЙ вопрос — «кто вправе прийти
  # КО МНЕ клиентом»: его `ca.crt` есть круг клиентских листов слушателей.
  #
  # ЗДЕСЬ ОБЕ ВЕЛИЧИНЫ БЫЛИ ОДНОЙ КООРДИНАТОЙ, и это было НАШЕ свойство, а не
  # свойство мира: у нашей установки поставщик выпущен тем же внутренним центром,
  # что и её собственные листы. У ставящего в чужом облаке он может быть выпущен
  # публичным центром либо другим внутренним — и развести их было НЕЧЕМ: сузив
  # или расширив якорь поставщика, оператор двигал заодно круг тех, кому позволено
  # говорить с этой службой (задача #2487).
  #
  # ПУСТО — тома нет, и якорь поставщика адресуется тем, что назовёт карта `env`.
  # Это законно: у поставщика, отвечающего по http либо сертификатом публичного
  # центра, якоря может не быть вовсе. Боевой профиль объявляет имя явно.
  #
  # СОВПАДЕНИЕ СОДЕРЖИМОГО ОСТАЁТСЯ ЗАКОННЫМ: оператор вправе положить в оба
  # объекта один материал — если его поставщик выпущен тем же центром, это верный
  # выбор. Разными обязаны быть КООРДИНАТЫ, чтобы выбор был выразим; держит это
  # `provider_anchor_is_its_own_coordinate_test.go`.
  providerSecretName: ""
  mountPath: /etc/kaname/tls   # <mountPath>/server|client|provider/{tls.crt,tls.key,ca.crt}

# ── ПОСАДКА ЛИЧНОСТИ И КРУГ ОТПРАВИТЕЛЕЙ ────────────────────────────────────
# Обе величины умолчания НЕ ИМЕЮТ намеренно: пустой круг означает «доверяем
# всякому пиру с сертификатом внутреннего удостоверяющего центра», а не
# объявленная посадка личности означает «неизвестно, нужны ли адреса поставщика».
# Боевой режим отказывает в пуске на каждой из них.
# ТРИ СОБСТВЕННЫХ ПОТОЛКА СЛУЖБЫ (приёмка `KAN-QUOTA-1`, `П25`; задача #2117).
#
# Сколько аккаунтов заводит одна личность (`iam.account`) и сколько путей входа
# держит человек (`iam.user.credential`) и машина (`iam.serviceAccount.credential`).
# Величину объявляет посадка: внешнего авторитета величин в самостоятельной
# установке нет by construction, и спросить её не у кого.
#
# КЛЮЧЕЙ ЗДЕСЬ НЕТ НАМЕРЕННО — тот же довод, что у `authn.providerAdminAuth` ниже.
# Объявленные пустыми, они уехали бы в настройки ДОСЛОВНО, и ветвь шаблона
# перестала бы отличать «оператор не высказывался» от «оператор объявил ноль», —
# а ноль здесь законная величина, означающая «ресурсов этого вида не заводить».
#
# Величину называет тот профиль, который её решает: боевой и стендовый профили
# рядом делают это явно. Не назвал никто — служба отказывает в пуске, называя
# настройку, переменную и вид, чей потолок остался неизвестным.
ownCeilings: {}

authn:
  # Доменное имя ЭТОЙ установки: то, кому адресованы выпускаемые ею
  # удостоверения. Пусто — значит не объявлено, и старт останавливается: клеймо
  # адресата уезжает в каждом токене, поэтому подставить его за оператора
  # нельзя. Значение — своё у каждой установки, умолчания у него не бывает.
  domain: ""
  identityProvider: ""
  trustedForwarderSANs: []
  # providerAdminAuth — ЧЕМ административный контур ВАШЕГО поставщика личности
  # аутентифицирует нас: `bearer` (контур возит административный предъявитель)
  # либо `none` (административный порт не аутентифицирует никого).
  #
  # Умолчания нет намеренно, и это тот же довод, что у соседних ключей: величина,
  # которую построение подставляет молча, предметом стража быть не может — он
  # зелен при любом входе. Прежде ответ подразумевался («не аутентифицирует
  # никого»), и подразумевался он про НАШ стенд, а не про вашего поставщика:
  # оператор, чей поставщик административный доступ аутентифицирует, получал
  # отказ на каждой административной операции фасада и ни одной строки при
  # старте о причине (задача #2471).
  #
  # `bearer` требует ПАРЫ: предъявитель подаётся объектом Secret через карту
  # `secrets` (ключ KANAME_HYDRA_ADMIN_TOKEN), и половину пары страж старта
  # отвергает — объявленный `bearer` без пришедшего предъявителя не поднимается.
  #
  # КЛЮЧА ЗДЕСЬ НЕТ НАМЕРЕННО, а не по недосмотру. Объявленный пустым, он
  # уехал бы в настройки ДОСЛОВНО — процесс получил бы пустую величину и
  # прежнее поведение, а ветвь `hasKey` в шаблоне перестала бы отличать
  # «оператор не высказывался» от «оператор объявил пусто». Величину называет
  # тот профиль, который её решает; боевой профиль рядом делает это явно.
  # Домен доверия установки: то, чьи сертификаты служба признаёт своими.
  #
  # ЗДЕСЬ СТОЯЛО «пусто — значит берётся умолчание чарта», и это утверждение
  # противоречило следующему за ним в той же строке: если чарт подставляет своё,
  # то незаданного процесс не видит НИКОГДА, и обещанный ниже отказ старта не
  # наступает ни при каком входе. Подставлялся при этом домен НАШЕЙ установки,
  # по которому у ставящего не опознаётся ни один его предъявитель.
  #
  # Верно теперь второе: умолчания нет, незаданное доезжает до стража старта, и
  # он отказывает в пуске, называя ручку и переменную
  # (`KANAME_AUTHN__TRUST_DOMAIN`). Величину называет накладка профиля — боевая
  # своим доменом, стендовая доменом стенда.
  trustDomain: ""

  # ─── СВОЯ ЧЕКАНКА ТОКЕНОВ (#897) ────────────────────────────────────────
  # Рендерится в config.yaml как authn.token-signing.*; та же величина
  # переменной — KANAME_AUTHN__TOKEN_SIGNING__<КЛЮЧ>.
  #
  # ВЫКЛЮЧЕНА ПО УМОЛЧАНИЮ, и это не осторожность, а форма стража: пока чеканка
  # выключена, её настройки не требуются — страж, требующий того, чем не
  # пользуются, отказывал бы в старте без предмета. ВКЛЮЧЁННАЯ требует их ВСЕ, и
  # каждое незаданное значение даёт отказ в старте с именем настройки.
  #
  # Асимметрия цены, из которой это выведено: слишком строгая настройка даёт
  # отказ В СТАРТЕ — видимый сразу; слишком слабая даёт принимаемый чужой токен,
  # не видимый никогда.
  tokenSigning:
    # enabled — включена ли своя чеканка. false → блок не рендерится вовсе.
    enabled: false
    # issuer — НАШ издатель. Попадает в каждый выпущенный токен и в привязку
    # «издатель → источник набора» на приёмной стороне. Пусто при enabled:true —
    # отказ в старте: незаданный издатель означает «любой», то есть токен любого
    # происхождения принимался бы за наш.
    issuer: ""
    # algorithm — подпись, закрепляемая за порождаемым ключом. Значение вне
    # закрытого словаря платформы (RS256 | ES256 | EdDSA) — отказ в старте.
    algorithm: ""
    # allowedAlgorithms — перечень допустимых подписей ПРИЁМА, через запятую.
    # Страж считает ЭЛЕМЕНТЫ, а не длину строки: одинокая запятая непуста по
    # длине и пуста по существу. Пустой перечень означает «принимаем любую» и
    # обесценивает сверку заголовка токена с ключом, которая на нём и держится.
    # Алгоритм чеканки обязан входить сюда: иначе мы выпускали бы то, что сами же
    # отвергаем.
    allowedAlgorithms: ""
    # keySetPath — путь НАШЕЙ записи публикуемого набора. ОБЪЯВЛЯЕТСЯ, а не
    # выводится из издателя: производный путь получается у ВСЯКОГО издателя,
    # поэтому состояние «записи источника нет» не наступало бы никогда, и страж
    # стал бы тождественно истинным.
    keySetPath: /.well-known/kaname/jwks.json
    # keyLifetime — срок ключа ключницы (Go duration). Ротацию исполняет сама
    # служба; отдельного задания для неё нет.
    keyLifetime: 2160h

  # ─── ПРИЁМ ПРЕДЪЯВЛЕННОГО АРЕНДАТОРОМ УДОСТОВЕРЕНИЯ (#2077, #2191) ───────
  # Рендерится в config.yaml как authn.presented-credential.*; та же величина
  # переменной — KANAME_AUTHN__PRESENTED_CREDENTIAL__<КЛЮЧ>.
  #
  # ВЫКЛЮЧЕН ПО УМОЛЧАНИЮ той же формой стража, что и чеканка выше. ВКЛЮЧЕНИЕ —
  # РЕШЕНИЕ ПРОФИЛЯ, а не сборки: умолчание, поднимающее читателя, приняло бы за
  # оператора решение о том, что служба принимает с провода.
  #
  # СВЯЗЫВАНИЕ, которое это держит: в боевой посадке поднятый собственный
  # публичный REST-фронт (`apiServer.restEndpoint`) ТРЕБУЕТ читателя — служба не
  # стартует, называя обе ручки. Половина пары хуже отсутствия обеих: арендатор
  # дотягивается до фронта, предъявляет годное удостоверение и получает тот же
  # отказ, что и предъявивший мусор.
  presentedCredential:
    # enabled — читает ли публичный слушатель предъявленное удостоверение.
    # Требует включённой своей чеканки: подпись проверяется НАШИМ реестром
    # ключей, и без неё реестра нет вовсе.
    enabled: false
    # audience — адресат ЭТОЙ поверхности. Токен, выпущенный этой же установкой
    # для ДРУГОЙ её поверхности, здесь не годится: адресат есть свойство
    # поверхности предъявления, а не издателя. Пусто при enabled:true — отказ.
    audience: ""
    # revocationCacheTtl — срок кеша ПОЛОЖИТЕЛЬНОГО вердикта об отзыве. Он же
    # ОБЪЯВЛЕННОЕ ОКНО ОТЗЫВА: столько времени субъект с отобранным правом
    # продолжает проходить. Умолчания нет намеренно — окно, выбранное за
    # оператора, он не увидит и не пересмотрит. Величина обязана быть заметно
    # короче срока выпускаемого токена, иначе отозванное истекало бы раньше, чем
    # кеш о нём забыл, и чтение отзыва стало бы неотличимо от его отсутствия.
    revocationCacheTtl: ""

# ── ПОСАДКА БЕЗОПАСНОСТИ ─────────────────────────────────────────────────
#
# ОДИН адрес на весь флот: `authMode` в корне значений сервиса. Ручку звали
# шестью разными адресами и двумя именами, и вопрос «в какой посадке работает
# этот кластер» нельзя было задать одной командой. Прежний адрес (authn.mode)
# снят; профиль, всё ещё задающий его, получает отказ рендера с обоими
# значениями в тексте — молчаливого отката к умолчанию не будет.
authMode: production
