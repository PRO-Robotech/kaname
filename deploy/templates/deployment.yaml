{{/* ОТКАЗ ОДНИМ ПЕРЕЧНЕМ, когда не названы объекты, которых чарт не создаёт.
Зовётся из ОБОИХ шаблонов, ссылающихся на такие объекты: какой из них
отрендерится первым, решает helm, а перечень обязан быть полным в любом. */}}
{{- include "kaname-svc.requireOperatorSuppliedNames" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
      annotations:
        # ПРИВЯЗКА ПОДА К СОДЕРЖИМОМУ ОБРАЗА — НЕОБЯЗАТЕЛЬНАЯ, И ЕЁ НАЗЫВАЕТ ТОТ,
        # КТО СТАВИТ.
        #
        # Предмет: координата образа с ИЗМЕНЯЕМЫМ тегом не меняет шаблон пода при
        # пересборке под тем же тегом. Kubernetes разницы не видит, под не
        # перекатывается — процесс продолжает работать СТАРЫМ бинарником под новым
        # тегом. Привязка к прибитому отпечатку (`repo@sha256:…`) этой беды не
        # имеет by construction: отпечаток и есть часть шаблона пода.
        #
        # Поэтому ключ ПУСТ по умолчанию, а аннотация при пустом значении не
        # рендерится ВОВСЕ. Постоянная заглушка была бы хуже отсутствия: она
        # выглядит привязкой, ничего не привязывая. Кто ставит по изменяемому
        # тегу — называет здесь идентификатор содержимого образа (поле `Id`
        # из `docker image inspect`), обычно из своего конвейера сборки.
        {{- with .Values.imageId }}
        kaname.cloud/image-id: {{ . | quote }}
        {{- end }}
        # Отпечаток содержимого настроек → перекат пода при изменении config.yaml.
        # Производитель у него ЕСТЬ всегда — шаблон настроек этого же чарта, —
        # поэтому он безусловен, в отличие от привязки к образу выше.
        kaname.cloud/config-checksum: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Объявления сбора здесь НЕТ, и это не пропуск. Этот каталог чарта не
        # разворачивается ничем: умбрелла тянет iam каталогом сабчарта
        # (`deploy/helm/umbrella/charts/kaname`), и объявление, стоявшее
        # здесь, не рендерилось ни в одном профиле — то есть было ровно тем
        # классом, ради которого заведена перепись накопителей: артефакт,
        # выглядящий как работа, у которого нет потребителя.
        #
        # Проверка `TestEveryRenderedChartDeclaresItsScrape` роняет любую новую
        # аннотацию сбора в нерендерящемся каталоге — с координатой и причиной.
    spec:
      # Hardened pod security context (trivy AVD-KSV-0118): run as a
      # non-root user, drop the default ambient context.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- $tls := .Values.tls | default dict }}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.name }}-config
        {{- if $tls.secretName }}
        # МАТЕРИАЛ TLS СЛУШАТЕЛЕЙ. Ручки самих рёбер приезжают переменными
        # окружения (карта `env` профиля) — их читает `config.LoadMTLS` через
        # envconfig, — но ПУТЬ, который они называют, обязан существовать в поде.
        # Ручка, называющая файл, которого под не несёт, есть объявленная и
        # неисполнимая возможность: процесс отказывает в пуске на нечитаемом
        # файле, а профиль читается как настроенный.
        #
        # Секрет не объявлен — том не заводится, и посадка остаётся прежней:
        # dev-цепочка чарта материала TLS не называет.
        - name: tls-server
          secret:
            secretName: {{ $tls.secretName | quote }}
        {{- end }}
        {{- if $tls.clientSecretName }}
        # МАТЕРИАЛ КЛИЕНТСКОЙ ЛИЧНОСТИ — ОТДЕЛЬНЫЙ ЛИСТ, А НЕ ТОТ ЖЕ САМЫЙ.
        #
        # Служба звонит САМА СЕБЕ: её собственные REST-фронты идут к её же
        # gRPC-слушателю. Лист слушателя выписывается с назначением `server auth`
        # и без `client auth`, а проверка клиентской цепи идёт именно этим
        # назначением, — поэтому предъявить серверный лист нельзя ни при каком
        # входе: рукопожатие обрывается предупреждением `bad certificate`, и
        # фронт возвращает арендатору 503 (задача #2186).
        #
        # Секрет не объявлен — тома нет, посадка прежняя: dev-цепочка чарта
        # материала TLS не называет вовсе.
        - name: tls-client
          secret:
            secretName: {{ $tls.clientSecretName | quote }}
        {{- end }}
      initContainers:
        # Миграции БД исполняет отдельный binary `kaname-migrator`
        # (cobra-based CLI), не subcommand основного.
        - name: migrate
          image: "{{ .Values.image }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/usr/local/bin/kaname-migrator", "up"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/kaname
              readOnly: true
          env:
            - name: KANAME_CONFIG_PATH
              value: /etc/kaname/config.yaml
            - name: KANAME_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.passwordSecretName }}
                  key: {{ .Values.db.passwordSecretKey }}
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.image }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/usr/local/bin/kaname", "serve"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: grpc
              containerPort: {{ .Values.ports.grpc }}
            - name: grpc-internal
              containerPort: {{ .Values.ports.internalGrpc }}
            - name: metrics
              containerPort: {{ .Values.ports.metrics }}
            # Слушатель вебхуков провайдера личности. Здесь же живут `/healthz` и
            # `/readyz`, поэтому порт обязан быть объявлен: по нему идут пробы, а
            # оператор, ищущий, куда постучаться за причиной неготовности, читает
            # именно `ports:`. Умолчание зеркалит umbrella-чарт и умолчание самого
            # процесса (authn.hooks-http-endpoint = tcp://0.0.0.0:9092).
            - name: http-hooks
              containerPort: {{ .Values.ports.hooksHttp | default 9092 }}
            # Собственные REST-фронты службы (KAN-REST-1). ДВА разных порта, а не
            # разбор пути на общем: принадлежность маршрута фронту обязана быть
            # свойством того, куда вообще можно дозвониться.
            {{- if .Values.ports.rest }}
            - name: http-rest
              containerPort: {{ .Values.ports.rest }}
            {{- end }}
            {{- if .Values.ports.internalRest }}
            - name: http-rest-int
              containerPort: {{ .Values.ports.internalRest }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/kaname
              readOnly: true
            {{- if $tls.secretName }}
            - name: tls-server
              mountPath: {{ printf "%s/server" (required "tls.mountPath не задан при объявленном tls.secretName: путь монтирования обязан быть назван явно — иначе ручки рёбер называют файлы, которых в поде нет" $tls.mountPath) | quote }}
              readOnly: true
            {{- end }}
            {{- if $tls.clientSecretName }}
            - name: tls-client
              mountPath: {{ printf "%s/client" (required "tls.mountPath не задан при объявленном tls.clientSecretName: путь монтирования обязан быть назван явно — иначе удостоверение исходящего вызова называет файл, которого в поде нет" $tls.mountPath) | quote }}
              readOnly: true
            {{- end }}
          env:
            - name: KANAME_CONFIG_PATH
              value: /etc/kaname/config.yaml
            - name: KANAME_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.passwordSecretName }}
                  key: {{ .Values.db.passwordSecretKey }}
            {{- if (index .Values.env "KANAME_REST_UPSTREAM_MTLS_ENABLE") }}
            # Имя, по которому фронт сверяет сертификат СОБСТВЕННОГО слушателя.
            # ВЫЧИСЛЯЕТСЯ шаблоном, а не выписывается в профиле: дозвон идёт в
            # петлю (адрес привязки целью соединения не является), а лист выписан
            # на имя Service — выписанное руками разошлось бы с ним молча, и
            # разошлось бы только в боевой посадке, где проверка включена.
            - name: KANAME_REST_UPSTREAM_MTLS_SERVERNAME
              value: {{ printf "%s.%s.svc.cluster.local" .Values.name .Release.Namespace | quote }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $v := .Values.secrets }}
            # ВЕЛИЧИНА ЖИВЁТ В СЕКРЕТЕ, А НЕ В ПРОФИЛЕ. Общий сговор с провайдером
            # личности и ключ обёртки ключницы страж старта требует непустыми в
            # боевом режиме, но профиль чарта отслеживается git — значит их место
            # здесь, ссылкой, а не значением в карте `env`.
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ required (printf "secrets.%s.secretName не задан" $k) $v.secretName | quote }}
                  key: {{ required (printf "secrets.%s.secretKey не задан" $k) $v.secretKey | quote }}
            {{- end }}
          # ГОТОВНОСТЬ СПРАШИВАЕТСЯ ПО ТОМУ, ЧТО СЕРВИС СТРОИТ. `/readyz` живёт на
          # слушателе вебхуков и отражает коннект к базе и поднятый LRO-worker;
          # `/healthz` там же — чистая живость. Прежде оба слота спрашивали
          # `tcpSocket: grpc`: iam с недоступной базой оставался Ready, а он фронтит
          # authN+authZ каждому сервису платформы.
          #
          # Схемы HTTPS здесь нет намеренно: ручки TLS слушателей у ЭТОГО чарта не
          # существует (её несёт umbrella-чарт), поэтому слушатель остаётся
          # открытым текстом, и проба обязана спрашивать так же. Появится ручка —
          # проба обязана переехать вместе с ней тем же изменением.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-hooks
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-hooks
            initialDelaySeconds: 10
            periodSeconds: 30
