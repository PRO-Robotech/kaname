apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: kacho
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
      annotations:
        # ПРИВЯЗКА ПОДА К СОДЕРЖИМОМУ ОБРАЗА.
        #
        # Тег локального образа (`kacho-*:dev`) неизменен, поэтому пересборка под
        # тем же тегом НЕ меняет шаблон пода: Kubernetes не видит разницы и под не
        # перекатывается — процесс продолжает работать СТАРЫМ бинарником под новым
        # тегом. Ровно тот же разрыв между намерением и исходом, что и у настроек,
        # приезжающих массовым импортом (инцидент 2026-07-25), и лечится он так же —
        # аннотацией, привязанной к содержимому.
        #
        # Значение — идентификатор содержимого образа; его пишет `make build-services`
        # в helm/umbrella/values.image-ids.yaml сразу после сборки. Профиль, который
        # этот файл не накладывает (offline-рендер, чужой реестр), получает "unset" —
        # и тогда привязки нет, что честно: привязывать не к чему.
        kacho.cloud/image-id: {{ dig "kachoImageIds" "iam" "unset" (.Values.global | default dict) | quote }}
        # ConfigMap-content hash → pod rolling-restart при изменении config.yaml.
        kacho.cloud/config-checksum: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Объявления сбора здесь НЕТ, и это не пропуск. Этот каталог чарта не
        # разворачивается ничем: умбрелла тянет iam каталогом сабчарта
        # (`deploy/helm/umbrella/charts/kacho-iam`), и объявление, стоявшее
        # здесь, не рендерилось ни в одном профиле — то есть было ровно тем
        # классом, ради которого заведена перепись накопителей: артефакт,
        # выглядящий как работа, у которого нет потребителя.
        #
        # Проверка `TestEveryRenderedChartDeclaresItsScrape` роняет любую новую
        # аннотацию сбора в нерендерящемся каталоге — с координатой и причиной.
    spec:
      # Hardened pod security context (trivy AVD-KSV-0118): run as a
      # non-root user, drop the default ambient context.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: {{ .Values.name }}-config
      initContainers:
        # Миграции БД исполняет отдельный binary `kacho-migrator`
        # (cobra-based CLI), не subcommand основного.
        - name: migrate
          image: "{{ .Values.image }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/usr/local/bin/kacho-migrator", "up"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/kacho-iam
              readOnly: true
          env:
            - name: KACHO_IAM_CONFIG_PATH
              value: /etc/kacho-iam/config.yaml
            - name: KACHO_IAM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.passwordSecretName }}
                  key: {{ .Values.db.passwordSecretKey }}
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.image }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/usr/local/bin/kacho-iam", "serve"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: grpc
              containerPort: {{ .Values.ports.grpc }}
            - name: grpc-internal
              containerPort: {{ .Values.ports.internalGrpc }}
            - name: metrics
              containerPort: {{ .Values.ports.metrics }}
            # Слушатель вебхуков провайдера личности. Здесь же живут `/healthz` и
            # `/readyz`, поэтому порт обязан быть объявлен: по нему идут пробы, а
            # оператор, ищущий, куда постучаться за причиной неготовности, читает
            # именно `ports:`. Умолчание зеркалит umbrella-чарт и умолчание самого
            # процесса (authn.hooks-http-endpoint = tcp://0.0.0.0:9092).
            - name: http-hooks
              containerPort: {{ .Values.ports.hooksHttp | default 9092 }}
          volumeMounts:
            - name: config
              mountPath: /etc/kacho-iam
              readOnly: true
          env:
            - name: KACHO_IAM_CONFIG_PATH
              value: /etc/kacho-iam/config.yaml
            - name: KACHO_IAM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.passwordSecretName }}
                  key: {{ .Values.db.passwordSecretKey }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          # ГОТОВНОСТЬ СПРАШИВАЕТСЯ ПО ТОМУ, ЧТО СЕРВИС СТРОИТ. `/readyz` живёт на
          # слушателе вебхуков и отражает коннект к базе и поднятый LRO-worker;
          # `/healthz` там же — чистая живость. Прежде оба слота спрашивали
          # `tcpSocket: grpc`: iam с недоступной базой оставался Ready, а он фронтит
          # authN+authZ каждому сервису платформы.
          #
          # Схемы HTTPS здесь нет намеренно: ручки TLS слушателей у ЭТОГО чарта не
          # существует (её несёт umbrella-чарт), поэтому слушатель остаётся
          # открытым текстом, и проба обязана спрашивать так же. Появится ручка —
          # проба обязана переехать вместе с ней тем же изменением.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-hooks
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-hooks
            initialDelaySeconds: 10
            periodSeconds: 30
