{{/* ОТКАЗ ОДНИМ ПЕРЕЧНЕМ, когда не названы объекты, которых чарт не создаёт.
Зовётся из ОБОИХ шаблонов, ссылающихся на такие объекты: какой из них
отрендерится первым, решает helm, а перечень обязан быть полным в любом. */}}
{{- include "kaname-svc.requireOperatorSuppliedNames" . -}}
{{/* СНЯТЫЙ ключ посадки отвергается вслух — из ОБОИХ шаблонов по той же
причине, что и перечень выше: какой отрендерится первым, решает helm, а отказ
обязан прийти в любом. */}}
{{- include "kaname-svc.requireNoRetiredPortKnobs" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
      annotations:
        # ПРИВЯЗКА ПОДА К СОДЕРЖИМОМУ ОБРАЗА — НЕОБЯЗАТЕЛЬНАЯ, И ЕЁ НАЗЫВАЕТ ТОТ,
        # КТО СТАВИТ.
        #
        # Предмет: координата образа с ИЗМЕНЯЕМЫМ тегом не меняет шаблон пода при
        # пересборке под тем же тегом. Kubernetes разницы не видит, под не
        # перекатывается — процесс продолжает работать СТАРЫМ бинарником под новым
        # тегом. Привязка к прибитому отпечатку (`repo@sha256:…`) этой беды не
        # имеет by construction: отпечаток и есть часть шаблона пода.
        #
        # Поэтому ключ ПУСТ по умолчанию, а аннотация при пустом значении не
        # рендерится ВОВСЕ. Постоянная заглушка была бы хуже отсутствия: она
        # выглядит привязкой, ничего не привязывая. Кто ставит по изменяемому
        # тегу — называет здесь идентификатор содержимого образа (поле `Id`
        # из `docker image inspect`), обычно из своего конвейера сборки.
        {{- with .Values.imageId }}
        kaname.cloud/image-id: {{ . | quote }}
        {{- end }}
        # Отпечаток содержимого настроек → перекат пода при изменении config.yaml.
        # Производитель у него ЕСТЬ всегда — шаблон настроек этого же чарта, —
        # поэтому он безусловен, в отличие от привязки к образу выше.
        kaname.cloud/config-checksum: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # ── ОБЪЯВЛЕНИЕ СБОРА ВЕЛИЧИН ──────────────────────────────────────
        #
        # ЗДЕСЬ СТОЯЛО «объявления сбора нет, и это не пропуск: каталог чарта не
        # разворачивается ничем». Утверждение было верно и ПЕРЕЖИЛО СВОЙ
        # ПРЕДМЕТ: этот каталог разворачивается — ради того и заведён боевой
        # профиль рядом (`values.prod.yaml`), которым служба ставится отдельным
        # продуктом. Пока предмет был мёртв, довод держал; с рождением профиля
        # он стал объяснять отсутствие сбора у ЕДИНСТВЕННОЙ поставки, где
        # величины больше некому снять (задача #2338).
        #
        # Служба производит их богато, а у отдельно поставленной установки
        # способа снять их не было НИ ОДНОГО: порта нет, объявления нет,
        # объекта монитора нет. «Сломан продукт» и «не создано условие» в три
        # часа ночи не различались ничем.
        #
        # ФОРМА ВЗЯТА У ПЛАТФОРМЫ, а не изобретена: тем же объявлением себя
        # отдают на сбор все прочие службы дерева и зонтичный чарт этой.
        # Собиратель ходит по ПОДАМ, поэтому порт Service диагностической
        # поверхности не нужен — её маршрут здесь.
        {{- if .Values.metricsScrape.enabled }}
        prometheus.io/scrape: "true"
        # ПОРТ ВЫВОДИТСЯ ИЗ УМОЛЧАНИЯ ПРОЦЕССА, а не читает ключ посадки.
        # Здесь читался `ports.metrics` (задача #2394): карта настроек адреса
        # метрик не эмитит вовсе, поэтому ключ двигал это объявление и порт
        # пода, оставляя слушатель на прежнем адресе, — собиратель приходил
        # туда, где никто не отвечает, а рендер был зелёным.
        prometheus.io/port: {{ include "kaname-svc.processDefaultPort" "metrics" | quote }}
        prometheus.io/path: /metrics
        # СХЕМА ЧИТАЕТСЯ У ТОЙ ЖЕ РУЧКИ, ЧТО ПОДНИМАЕТ ТРАНСПОРТ СЛУШАТЕЛЯ.
        # Боевой профиль поднимает эту поверхность по TLS, и объявление,
        # умолчавшее о схеме, посылало бы собирателя открытым текстом —
        # то есть обещало бы сбор, которого не происходит.
        #
        # Полоса ОДНОСТОРОННЯЯ (клиентского якоря у неё нет), поэтому схемы
        # достаточно: собиратель предъявляет только доверие к нашему листу.
        prometheus.io/scheme: {{ include "kaname-svc.edgeScheme" (dict "root" $ "edge" "METRICS") | lower | quote }}
        {{- else }}
        # СБОРА В ЭТОЙ УСТАНОВКЕ НЕТ — И ЭТО ОБЪЯВЛЕННЫЙ ВЫБОР, а не молчание.
        # Причина обязана быть названа: пустая строка при выключенном сборе
        # неотличима от «забыли», и проверка не различила бы их.
        kaname.cloud/metrics-scrape-disabled-because: {{ required "metricsScrape.disabledBecause не задан при metricsScrape.enabled=false: выключение сбора обязано нести причину — иначе «сбора здесь нет намеренно» неотличимо от «забыли объявить»" .Values.metricsScrape.disabledBecause | quote }}
        {{- end }}
    spec:
      # ПОДСТАНОВКА АДРЕСОВ СЛУЖБ ГАСИТСЯ: она перебивает величины оператора.
      #
      # Kubernetes объявляет поду адреса всех служб пространства имён
      # переменными, выводя имя из имени службы (верхний регистр, дефис →
      # подчёркивание). Корневой сегмент ВСЕХ переменных этой службы — тот же
      # `KANAME`, что и имя её собственной службы, поэтому служба
      # `{{ .Values.name }}-internal` объявляет `KANAME_INTERNAL_PORT` со
      # значением `tcp://<адрес>:<порт>` — прямо в пространство имён настроек
      # процесса, где это имя есть РУЧКА ПОРТА внутреннего слушателя.
      #
      # Ничто в этом чарте адресов служб из окружения не читает: каждый сосед
      # адресуется объявленной величиной (проверяется декларативной пробой
      # рядом). Значит подстановка не нужна вовсе, а её вред измерен — поставка
      # не поднималась: процесс проходил все миграции, отчитывался о посадке и
      # падал последним шагом, на открытии слушателя.
      #
      # Процесс с тех пор отвергает такое значение сам, называя ручку (см.
      # config/service_link_collision.go) — то есть отказ стал диагностируемым.
      # Здесь снимается ПРИЧИНА, там — молчание: одно другого не заменяет.
      enableServiceLinks: false
      # Hardened pod security context (trivy AVD-KSV-0118): run as a
      # non-root user, drop the default ambient context.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- $tls := .Values.tls | default dict }}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.name }}-config
        {{- if $tls.secretName }}
        # МАТЕРИАЛ TLS СЛУШАТЕЛЕЙ. Ручки самих рёбер приезжают переменными
        # окружения (карта `env` профиля) — их читает `config.LoadMTLS` через
        # envconfig, — но ПУТЬ, который они называют, обязан существовать в поде.
        # Ручка, называющая файл, которого под не несёт, есть объявленная и
        # неисполнимая возможность: процесс отказывает в пуске на нечитаемом
        # файле, а профиль читается как настроенный.
        #
        # Секрет не объявлен — том не заводится, и посадка остаётся прежней:
        # dev-цепочка чарта материала TLS не называет.
        - name: tls-server
          secret:
            secretName: {{ $tls.secretName | quote }}
        {{- end }}
        {{- if $tls.clientSecretName }}
        # МАТЕРИАЛ КЛИЕНТСКОЙ ЛИЧНОСТИ — ОТДЕЛЬНЫЙ ЛИСТ, А НЕ ТОТ ЖЕ САМЫЙ.
        #
        # Служба звонит САМА СЕБЕ: её собственные REST-фронты идут к её же
        # gRPC-слушателю. Лист слушателя выписывается с назначением `server auth`
        # и без `client auth`, а проверка клиентской цепи идёт именно этим
        # назначением, — поэтому предъявить серверный лист нельзя ни при каком
        # входе: рукопожатие обрывается предупреждением `bad certificate`, и
        # фронт возвращает арендатору 503 (задача #2186).
        #
        # Секрет не объявлен — тома нет, посадка прежняя: dev-цепочка чарта
        # материала TLS не называет вовсе.
        - name: tls-client
          secret:
            secretName: {{ $tls.clientSecretName | quote }}
        {{- end }}
        {{/* ЯКОРЬ ПОСТАВЩИКА — ТРЕТИЙ ТОМ, а не ключ в чужом секрете: «чьим
        сертификатам сервера я верю у соседа» и «кто вправе прийти ко мне
        клиентом» суть разные вопросы, и координата у каждого своя (#2487). */}}
        {{- if $tls.providerSecretName }}
        - name: tls-provider
          secret:
            secretName: {{ $tls.providerSecretName | quote }}
        {{- end }}
      initContainers:
        # Миграции БД исполняет отдельный binary `kaname-migrator`
        # (cobra-based CLI), не subcommand основного.
        - name: migrate
          image: "{{ .Values.image }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/usr/local/bin/kaname-migrator", "up"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/kaname
              readOnly: true
          env:
            - name: KANAME_CONFIG_PATH
              value: /etc/kaname/config.yaml
            - name: KANAME_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.passwordSecretName }}
                  key: {{ .Values.db.passwordSecretKey }}
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.image }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/usr/local/bin/kaname", "serve"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: grpc
              containerPort: {{ .Values.ports.grpc }}
            - name: grpc-internal
              containerPort: {{ .Values.ports.internalGrpc }}
            # Диагностическая поверхность. Её адрес приходит умолчанием
            # процесса ровно как у трёх соседей ниже, поэтому и порт выводится
            # оттуда же: ключа посадки у неё нет (задача #2394).
            - name: metrics
              containerPort: {{ include "kaname-svc.processDefaultPort" "metrics" }}
            # Слушатель вебхуков провайдера личности. Здесь же живут `/healthz` и
            # `/readyz`, поэтому порт обязан быть объявлен: по нему идут пробы, а
            # оператор, ищущий, куда постучаться за причиной неготовности, читает
            # именно `ports:`.
            #
            # ЗДЕСЬ БЫЛ КЛЮЧ ПОСАДКИ (`ports.hooksHttp`), и он не задавался ни
            # одним из трёх профилей. Задать его значило бы сдвинуть порт пода и
            # маршрут, не сдвинув слушатель: адрес вебхуков приходит умолчанием
            # процесса, и ручки, которая его двигает, у этого чарта нет вовсе.
            - name: http-hooks
              containerPort: {{ include "kaname-svc.processDefaultPort" "hooks" }}
            # Выдача токенов (`/iam/token`, `/iam/v1/token`) — ВНЕШНЕ досягаемая
            # поверхность. Порта у неё не было вовсе, при том что документ
            # установки обещал оператору внешнюю достижимость (задача #2337).
            - name: registry-token
              containerPort: {{ include "kaname-svc.processDefaultPort" "registryToken" }}
            # Зеркало публичных ключей проверки. Его читает плоскость данных
            # реестра; порта у него тоже не было.
            - name: http-jwks
              containerPort: {{ include "kaname-svc.processDefaultPort" "jwksProxy" }}
            # Собственные REST-фронты службы (KAN-REST-1). ДВА разных порта, а не
            # разбор пути на общем: принадлежность маршрута фронту обязана быть
            # свойством того, куда вообще можно дозвониться.
            #
            # Порт ВЫВОДИТСЯ из адреса, который профиль отдаёт процессу. Здесь
            # читался отдельный ключ (`ports.rest`), и боевой профиль его не
            # объявлял, объявив адрес: процесс поднимал дверь, которой под не
            # объявлял (задача #2337).
            {{- if .Values.apiServer.restEndpoint }}
            - name: http-rest
              containerPort: {{ include "kaname-svc.surfacePort" .Values.apiServer.restEndpoint }}
            {{- end }}
            {{- if .Values.apiServer.internalRestEndpoint }}
            - name: http-rest-int
              containerPort: {{ include "kaname-svc.surfacePort" .Values.apiServer.internalRestEndpoint }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/kaname
              readOnly: true
            {{- if $tls.secretName }}
            - name: tls-server
              mountPath: {{ printf "%s/server" (required "tls.mountPath не задан при объявленном tls.secretName: путь монтирования обязан быть назван явно — иначе ручки рёбер называют файлы, которых в поде нет" $tls.mountPath) | quote }}
              readOnly: true
            {{- end }}
            {{- if $tls.clientSecretName }}
            - name: tls-client
              mountPath: {{ printf "%s/client" (required "tls.mountPath не задан при объявленном tls.clientSecretName: путь монтирования обязан быть назван явно — иначе удостоверение исходящего вызова называет файл, которого в поде нет" $tls.mountPath) | quote }}
              readOnly: true
            {{- end }}
            {{- if $tls.providerSecretName }}
            - name: tls-provider
              mountPath: {{ printf "%s/provider" (required "tls.mountPath не задан при объявленном tls.providerSecretName: путь монтирования обязан быть назван явно — иначе якорь поставщика личности называет файл, которого в поде нет" $tls.mountPath) | quote }}
              readOnly: true
            {{- end }}
          env:
            - name: KANAME_CONFIG_PATH
              value: /etc/kaname/config.yaml
            - name: KANAME_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.passwordSecretName }}
                  key: {{ .Values.db.passwordSecretKey }}
            {{- if (index .Values.env "KANAME_REST_UPSTREAM_MTLS_ENABLE") }}
            # Имя, по которому фронт сверяет сертификат СОБСТВЕННОГО слушателя.
            # ВЫЧИСЛЯЕТСЯ шаблоном, а не выписывается в профиле: дозвон идёт в
            # петлю (адрес привязки целью соединения не является), а лист выписан
            # на имя Service — выписанное руками разошлось бы с ним молча, и
            # разошлось бы только в боевой посадке, где проверка включена.
            - name: KANAME_REST_UPSTREAM_MTLS_SERVERNAME
              value: {{ printf "%s.%s.svc.cluster.local" .Values.name .Release.Namespace | quote }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $v := .Values.secrets }}
            # ВЕЛИЧИНА ЖИВЁТ В СЕКРЕТЕ, А НЕ В ПРОФИЛЕ. Общий сговор с провайдером
            # личности и ключ обёртки ключницы страж старта требует непустыми в
            # боевом режиме, но профиль чарта отслеживается git — значит их место
            # здесь, ссылкой, а не значением в карте `env`.
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ required (printf "secrets.%s.secretName не задан" $k) $v.secretName | quote }}
                  key: {{ required (printf "secrets.%s.secretKey не задан" $k) $v.secretKey | quote }}
            {{- end }}
          # ГОТОВНОСТЬ СПРАШИВАЕТСЯ ПО ТОМУ, ЧТО СЕРВИС СТРОИТ. `/readyz` живёт на
          # слушателе вебхуков и отражает коннект к базе и поднятый LRO-worker;
          # `/healthz` там же — чистая живость. Прежде оба слота спрашивали
          # `tcpSocket: grpc`: iam с недоступной базой оставался Ready, а он фронтит
          # authN+authZ каждому сервису платформы.
          #
          # СХЕМА ПРОБЫ ВЫВОДИТСЯ ИЗ ТРАНСПОРТА ТОГО РЕБРА, НА КОТОРОЕ ОНА
          # НАЦЕЛЕНА, а не вписывается.
          #
          # ЗДЕСЬ СТОЯЛО «схемы HTTPS нет намеренно: ручки TLS слушателей у этого
          # чарта не существует», и рядом — предикат собственного снятия:
          # «появится ручка — проба обязана переехать вместе с ней тем же
          # изменением». Ручка появилась, проба за ней не переехала (#2336).
          #
          # Цена этого расхождения не косметическая: боевой профиль поднимает
          # слушатель вебхуков по TLS, kubelet шёл на него открытым текстом,
          # ответ оказывался вне полосы успеха — под НЕ СТАНОВИЛСЯ ГОТОВЫМ, а
          # проба живости перезапускала контейнер по кругу. Профиль при этом
          # рендерился и читался настроенным.
          #
          # Полоса ОДНОСТОРОННЯЯ: якоря клиента у неё нет, и kubelet, который
          # клиентского сертификата не предъявляет, проходит рукопожатие — не
          # хватало ровно схемы.
          {{- $hooksScheme := include "kaname-svc.edgeScheme" (dict "root" $ "edge" "HOOKS") }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-hooks
              scheme: {{ $hooksScheme }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-hooks
              scheme: {{ $hooksScheme }}
            initialDelaySeconds: 10
            periodSeconds: 30
