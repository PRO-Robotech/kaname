apiVersion: v1
kind: Service
metadata:
  name: iam
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: iam
  ports:
    - name: grpc
      port: {{ .Values.ports.grpc }}
      targetPort: grpc
    - name: grpc-internal
      port: {{ .Values.ports.internalGrpc }}
      targetPort: grpc-internal
