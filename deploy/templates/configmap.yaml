{{/*
ConfigMap с YAML-конфигом kacho-iam.

Сервис читает config из /etc/kacho-iam/config.yaml; конкретные поля можно
override'ить через ENV (`KACHO_IAM_REPOSITORY__POSTGRES__URL` и т.п.).

DB-пароль НЕ кладется сюда (secret); подтягивается через
`repository.postgres.password-from-env: KACHO_IAM_DB_PASSWORD` и Secret-ENV
в deployment.yaml.

Здесь только те секции, которые сервис ДЕЙСТВИТЕЛЬНО разбирает: logger,
api-server, repository, authn. Секции, которой нет в Config, випер не видит —
она выглядит настройкой и ею не является: оператор правит ключ, рендер зелёный,
поведение прежнее. Держит это deploy/service_config_sections_test.go.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-config
  namespace: kacho
data:
  config.yaml: |
    logger:
      level: {{ default "INFO" .Values.logger.level | quote }}

    api-server:
      endpoint: {{ printf "tcp://0.0.0.0:%v" .Values.ports.grpc | quote }}
      internal-endpoint: {{ printf "tcp://0.0.0.0:%v" .Values.ports.internalGrpc | quote }}
      graceful-shutdown: {{ default "10s" .Values.apiServer.gracefulShutdown | quote }}
      {{- $rt := .Values.apiServer.registryToken | default dict }}
      {{- if or $rt.issuer $rt.service }}
      # Docker Registry v2 token shim. `service` также whitelist'ится как audience в
      # Hydra-клиенте каждого выпускаемого SA-ключа (#321) — расхождение с тем, что
      # docker шлёт в `?service=`, ломает login (Hydra: audience not whitelisted).
      registry-token:
        {{- with $rt.issuer }}
        issuer: {{ . | quote }}
        {{- end }}
        {{- with $rt.service }}
        service: {{ . | quote }}
        {{- end }}
      {{- end }}

    repository:
      type: POSTGRES
      postgres:
        url: {{ printf "postgres://%s@%s:%v/%s" .Values.db.user .Values.db.host .Values.db.port .Values.db.name | quote }}
        max-conns: {{ default 0 .Values.repository.postgres.maxConns }}
        # ЯВНО ЗАДАННЫЙ, А НЕ ПОДРАЗУМЕВАЕМЫЙ — та же правка, что в двух других
        # чартах с этой строкой (перепись: `git grep 'default "disable"'`). Пустое
        # значение давало открытый канал к базе молча; теперь это отказ с именем
        # настройки. Этот чарт НЕ подключён к умбрелле и потому не покрыт
        # deploy/dbtls_declaration_test.go — тем важнее, что он не производит
        # открытый текст сам.
        ssl-mode: {{ required "repository.postgres.sslMode не задан: канал к Postgres обязан быть объявлен явно (disable|require|verify-ca|verify-full); пустое значение молча дало бы открытый текст" .Values.repository.postgres.sslMode | quote }}
        password-from-env: KACHO_IAM_DB_PASSWORD

    authn:
      mode: {{ default "production" (include "kacho-iam-svc.authMode" .) | quote }}
