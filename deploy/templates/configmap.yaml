{{/*
ConfigMap с YAML-конфигом kaname.

Сервис читает config из /etc/kaname/config.yaml; конкретные поля можно
override'ить через ENV (`KANAME_REPOSITORY__POSTGRES__URL` и т.п.).

DB-пароль НЕ кладется сюда (secret); подтягивается через
`repository.postgres.password-from-env: KANAME_DB_PASSWORD` и Secret-ENV
в deployment.yaml.

Здесь только те секции, которые сервис ДЕЙСТВИТЕЛЬНО разбирает: logger,
api-server, repository, authn. Секции, которой нет в Config, випер не видит —
она выглядит настройкой и ею не является: оператор правит ключ, рендер зелёный,
поведение прежнее. Держит это deploy/service_config_sections_test.go.
*/}}
{{/* ОТКАЗ ОДНИМ ПЕРЕЧНЕМ, когда не названы объекты, которых чарт не создаёт.
Зовётся из ОБОИХ шаблонов, ссылающихся на такие объекты: какой из них
отрендерится первым, решает helm, а перечень обязан быть полным в любом. */}}
{{- include "kaname-svc.requireOperatorSuppliedNames" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    logger:
      level: {{ default "INFO" .Values.logger.level | quote }}

    api-server:
      endpoint: {{ printf "tcp://0.0.0.0:%v" .Values.ports.grpc | quote }}
      internal-endpoint: {{ printf "tcp://0.0.0.0:%v" .Values.ports.internalGrpc | quote }}
      graceful-shutdown: {{ default "10s" .Values.apiServer.gracefulShutdown | quote }}
      # Собственные REST-фронты. Умолчания у этих адресов НЕТ намеренно: адрес,
      # приходящий умолчанием процесса, непуст всегда — профиль, о ребре
      # умолчавший, поднимал бы его молча.
      {{- if .Values.apiServer.restEndpoint }}
      rest-endpoint: {{ .Values.apiServer.restEndpoint | quote }}
      {{- end }}
      {{- if .Values.apiServer.internalRestEndpoint }}
      internal-rest-endpoint: {{ .Values.apiServer.internalRestEndpoint | quote }}
      {{- end }}
      {{- $rt := .Values.apiServer.registryToken | default dict }}
      {{- if or $rt.issuer $rt.service }}
      # Docker Registry v2 token shim. `service` также whitelist'ится как audience в
      # Hydra-клиенте каждого выпускаемого SA-ключа (#321) — расхождение с тем, что
      # docker шлёт в `?service=`, ломает login (Hydra: audience not whitelisted).
      registry-token:
        {{- with $rt.issuer }}
        issuer: {{ . | quote }}
        {{- end }}
        {{- with $rt.service }}
        service: {{ . | quote }}
        {{- end }}
      {{- end }}

    repository:
      type: POSTGRES
      postgres:
        url: {{ printf "postgres://%s@%s:%v/%s" .Values.db.user .Values.db.host .Values.db.port .Values.db.name | quote }}
        max-conns: {{ default 0 .Values.repository.postgres.maxConns }}
        # ЯВНО ЗАДАННЫЙ, А НЕ ПОДРАЗУМЕВАЕМЫЙ — та же правка, что в двух других
        # чартах с этой строкой (перепись: `git grep 'default "disable"'`). Пустое
        # значение давало открытый канал к базе молча; теперь это отказ с именем
        # настройки. Этот чарт НЕ подключён к умбрелле и потому не покрыт
        # deploy/dbtls_declaration_test.go — тем важнее, что он не производит
        # открытый текст сам.
        ssl-mode: {{ required "repository.postgres.sslMode не задан: канал к Postgres обязан быть объявлен явно (disable|require|verify-ca|verify-full); пустое значение молча дало бы открытый текст" .Values.repository.postgres.sslMode | quote }}
        password-from-env: KANAME_DB_PASSWORD

    authn:
      mode: {{ default "production" (include "kaname-svc.authMode" .) | quote }}
      {{- $authn := .Values.authn | default dict }}
      {{- with $authn.domain }}
      # АДРЕСАТ ВЫПУСКАЕМЫХ УДОСТОВЕРЕНИЙ (задача #2127).
      #
      # Из него выводится клеймо адресата, уезжающее в КАЖДОМ выпущенном токене и
      # читаемое всяким, кто токен разбирает, — без нашего исходного кода.
      #
      # Прежде значение подставляло ПОСТРОЕНИЕ, и подставляло доменное имя чужого
      # продукта: этого ключа здесь не было вовсе, ни один профиль его не
      # объявлял, поэтому адресат каждого удостоверения выбирал не оператор.
      #
      # Умолчания нет намеренно ни здесь, ни в `defaults.go` службы: величина,
      # которую построение подставляет молча, предметом стража быть не может — он
      # зелен при любом входе. Незаданное доезжает до стража старта, и он
      # отказывает в пуске, называя настройку и переменную.
      domain: {{ . | quote }}
      {{- end }}
      {{- with $authn.identityProvider }}
      # ПОСАДКА ЛИЧНОСТИ. Умолчания у ключа нет намеренно (см. defaults.go службы):
      # подстановка в одну сторону потребовала бы адресов поставщика у профиля, у
      # которого их нет, в другую — молча сняла бы это требование с профиля,
      # который никто не обновлял. Боевой режим без этой строки в старт не идёт.
      identity-provider: {{ . | quote }}
      {{- end }}
      {{- with $authn.trustedForwarderSANs }}
      # КРУГ ЗАКОННЫХ ОТПРАВИТЕЛЕЙ ПЕРЕДАННОЙ ЛИЧНОСТИ.
      #
      # ЗДЕСЬ СТОЯЛО «ключ обязан приехать файлом, а не переменной окружения»:
      # у него не было ни умолчания в `defaults.go`, ни привязки в `load.go`, а
      # `AutomaticEnv` разрешает переменную только для ключа, который випер УЖЕ
      # знает, — поэтому `KANAME_AUTHN__TRUSTED_FORWARDER_SANS`, та самая, что
      # называет текст отказа стража, до поля не доезжала. Ключ привязан задачей
      # #2040, и оба пути теперь работают.
      #
      # Чарт продолжает подавать величину ФАЙЛОМ — это не остаток: список из
      # нескольких записей в файле читается и правится, а в переменной он
      # склеивается запятыми в одну строку. Переменная остаётся вторым путём для
      # того, кто ставит службу без чарта.
      #
      # Умолчания у ключа по-прежнему нет: пустой круг означает «доверяем всякому
      # пиру с сертификатом внутреннего удостоверяющего центра», и боевой режим на
      # нём в старт не идёт.
      trusted-forwarder-sans:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}

      {{- with (include "kaname-svc.trustDomain" .) }}
      # Домен доверия установки: то, чьи сертификаты процесс признаёт своими.
      # Круг выше называет, КОМУ позволено говорить за пользователя; домен
      # отвечает на предыдущий вопрос — чьи предъявители вообще наши.
      #
      # Берётся из объявления чарта, а не пишется здесь: величина, взятая своей
      # рукой в месте употребления, становится вторым адресом одного предмета и
      # расходится с чеканкой сертификата молча — законный отправитель перестаёт
      # опознаваться, а отказ выглядит как вызов без личности.
      #
      # ВЕТВЬ, А НЕ СКВОЗНАЯ ПОДСТАВКА, и это та же форма, что у трёх ключей
      # выше. Умолчания у величины нет намеренно (см. помощника): незаданная
      # обязана доехать до стража старта незаданной, иначе стража нет вовсе.
      # Пустая строка, подставленная «как есть», дала бы манифест с пустой
      # величиной — отказ тот же, но БЕЗ ИМЕНИ: оператор не узнал бы даже, чего
      # не хватает.
      trust-domain: {{ . | quote }}
      {{- end }}

      {{- $ts := $authn.tokenSigning | default dict }}
      {{- if $ts.enabled }}
      # СВОЯ ЧЕКАНКА ТОКЕНОВ (#897): ключница, подписант, ротация и публикация
      # набора проверочных ключей.
      #
      # Блок рендерится ТОЛЬКО при enabled: пока чеканка выключена, её настройки
      # не требуются, и страж, требующий того, чем не пользуются, отказывал бы в
      # старте без предмета. Будучи включённой, чеканка требует их ВСЕ.
      #
      # Умолчаний шаблона (`default`) здесь нет намеренно: незаданное означает
      # «не сужаем», а не «взять разумное». Незаданный издатель означает «любой»,
      # пустой перечень алгоритмов — «принимаем любой», вырожденный путь набора
      # превращает страж записи источника в проверку, неспособную упасть. Каждое
      # из трёх невидимо на положительном пути: токен выпускается, проверяется,
      # запрос проходит — и защиты при этом нет. Пустое доезжает до стража, и он
      # отказывает в старте, называя настройку.
      token-signing:
        enabled: true
        issuer: {{ $ts.issuer | quote }}
        algorithm: {{ $ts.algorithm | quote }}
        allowed-algorithms: {{ $ts.allowedAlgorithms | quote }}
        key-set-path: {{ $ts.keySetPath | quote }}
        key-lifetime: {{ $ts.keyLifetime | quote }}
      {{- end }}
      {{- $pc := $authn.presentedCredential | default dict }}
      {{- if $pc.enabled }}
      # ПРИЁМ УДОСТОВЕРЕНИЯ, ПРЕДЪЯВЛЕННОГО САМИМ АРЕНДАТОРОМ, на публичном
      # слушателе (#2077, #2191).
      #
      # ЗАЧЕМ ЭТО ЕСТЬ У ОТДЕЛЬНО ПОСТАВЛЕННОЙ СЛУЖБЫ. Собственный публичный
      # REST-фронт (`api-server.rest-endpoint`) поднимается на ЛЮБОЙ посадке —
      # его поднимает объявленный адрес, а не выбор посадки, — и всякий, кто до
      # него дотянулся, приходит обычным клиентом: модульного сертификата у
      # арендатора нет и быть не может, а нашего края перед этим фронтом нет by
      # construction. Предъявленное удостоверение — единственное, чем он может
      # назваться. Без читателя фронт отвечает на годное удостоверение ровно тем
      # же, чем на негодное, и это выглядит настроенным.
      #
      # Блок рендерится ТОЛЬКО при enabled — по той же причине, что блок выше.
      # Связывание, которое это держит: в боевой посадке поднятый публичный
      # фронт ТРЕБУЕТ читателя, и служба не стартует, называя обе ручки
      # (PresentedCredentialConfig.ValidateBinding). Половина пары хуже
      # отсутствия обеих.
      #
      # Умолчаний шаблона здесь нет намеренно: незаданный адресат означает «не
      # сужаем» — токен, выпущенный для другой поверхности этой установки,
      # проходил бы здесь; незаданный срок кеша означает окно отзыва, о котором
      # никто не решал, а окно И ЕСТЬ этот срок.
      presented-credential:
        enabled: true
        audience: {{ $pc.audience | quote }}
        revocation-cache-ttl: {{ $pc.revocationCacheTtl | quote }}
      {{- end }}
