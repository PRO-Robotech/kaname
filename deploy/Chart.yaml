apiVersion: v2
name: kaname
version: 0.1.0
appVersion: 0.1.0
description: Kaname (Account, Project, User, ServiceAccount, Group, Role, AccessBinding)

# ИМЯ ЧАРТА НЕ АДРЕСУЕТ: в монорепо их ДВА с этим именем, и различие объявлено
# здесь ДАННЫМИ, а не комментарием.
#
# Предмет — не совпадение строк, а ловушка замера: за две задачи подряд вердикт
# по открытому предмету был вынесен НЕ ПО ТОМУ чарту (координаты подчарта
# приписаны продукту; обход `-- deploy` разрешился в каталог верхнего уровня и
# чарт продукта не увидел вовсе). Оба замера выглядели аккуратными — с
# координатами, номерами строк и командой.
#
# Различали их путь и лицензия. Ни того, ни другого недостаточно: путь не
# спрашивают, когда ключ поиска — имя, а лицензию не спрашивают никогда.
# Поэтому здесь стоит третий признак — назначение поставки, — и он ЕДИНСТВЕННЫЙ
# из трёх, которым предикат «чарт продукта» удовлетворить подчартом нельзя:
#
#	name == kaname AND annotations.distribution == standalone   → ровно один
#
# Переименование рассмотрено и отвергнуто ЗАМЕРОМ, а не вкусом. У подчарта имя
# чарта есть КЛЮЧ СЕКЦИИ ЗНАЧЕНИЙ каждого профиля стенда; helm незнакомый ключ
# верхнего уровня не отвергает, поэтому переименование не сломало бы установку —
# оно молча вернуло бы подчарт к собственным умолчаниям на каждом развёрнутом
# стенде. У этого же чарта переименование дёшево (`.Chart.Name` не читается ни
# одним шаблоном, имена объектов идут от `.Values.name`), но имя `kaname` здесь
# и есть имя продукта: отнять его у продукта ради различения значило бы чинить
# не ту сторону.
#
# Держатель — `deploy/chart_name_addresses_exactly_one_chart_test.go`. Он же
# истекает сам: станут имена уникальны — объявление ниже потеряет предмет и
# станет находкой.
annotations:
  # Назначение поставки. `standalone` — чарт уезжает тому, кто ставит продукт
  # отдельно; `platform` — часть нашего стенда.
  distribution: standalone
  # Полный путь чарта-тёзки от корня монорепо. Обе стороны называют друг друга,
  # и держатель требует взаимности: односторонняя запись оставила бы половину
  # ловушки на месте.
  nameTwin: deploy/helm/umbrella/charts/kaname/Chart.yaml
