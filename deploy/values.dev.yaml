# ЭТО НЕ ПОСАДКА, А ФИКСТУРА ОТКРЫТОГО ТЕКСТА. Ставить чарт с этим профилем
# нельзя, и цепочки с ним чарт больше не предлагает (задача #2473).
#
# ── ЧТО ЗДЕСЬ БЫЛО И ПОЧЕМУ СНЯТО ───────────────────────────────────────────
#
# Шапка предлагала `helm install --values values.yaml --values values.dev.yaml`,
# и цепочка стояла в перечне предлагаемых наравне с боевой. Она объявляет
# `authMode: dev` и не переопределяет режим шифрования до базы, оставляя
# небезопасное значение из базовых. ban #16 разрешает такую посадку ТОЛЬКО во
# внутрипроцессных фикстурах и запрещает её на поднятом кластере, а профиль helm
# по построению относится к поднятому кластеру. Потребителя у цепочки не было ни
# одного — значит её единственным возможным потребителем был КЛИЕНТ, которому
# чарт уезжает целиком.
#
# ── ЗАЧЕМ ФАЙЛ ОСТАЁТСЯ В ПОСТАВКЕ ──────────────────────────────────────────
#
# Он нужен ДВУМ шипованным гейтам, у которых ось двусторонняя, и открытый её
# конец берётся отсюда:
#
#   probe_scheme_follows_edge_test.go  схема пробы следует транспорту ребра —
#                                      шифрованное ребро даёт HTTPS, открытое HTTP;
#   scrape_declared_test.go            сбор величин объявлен на обоих концах.
#
# Отобрав у них открытый конец, мы получили бы односторонние гейты, зеленеющие
# на всём сломанном. Поэтому файл едет вместе с пробами, которые его читают, и
# назван в ведомости непредлагаемых профилей с этой же причиной.
#
# ── ЧЕМ ДЕРЖИТСЯ, А НЕ ЭТИМ КОММЕНТАРИЕМ ────────────────────────────────────
#
# `offered_chains_declare_production_posture_test.go`: цепочка, предлагаемая для
# установки, обязана объявлять боевую посадку, а поставляемый профиль, ни в одну
# такую цепочку не входящий, — быть названным с причиной. Ведомость истекает
# сама: запись, чей файл вернулся в предлагаемую цепочку, — находка.
#
# Координаты ниже — kind-стенда kacho-deploy, и они остаются: фикстуре нужен
# правдоподобный, а не выдуманный вход.

# ── ОБРАЗ: КООРДИНАТА СТЕНДА ────────────────────────────────────────────────
#
# Базовые значения чарта образа не несут намеренно (см. их комментарий): тег
# нашего стенда в умолчании читался бы настройкой у того, кто ставит службу в
# своём облаке, и отказывал бы уже в кластере. Стендовая накладка — тоже профиль,
# на котором служба поднимается, поэтому она называет координату ЯВНО.
#
# Тег `:dev` кладёт в узлы kind сборка образов; политика вытягивания в базовых
# значениях — `IfNotPresent`, поэтому узел берёт его из своего кэша и в реестр не
# ходит. Ставящий на своём кластере меняет эту строку так же, как имена базы ниже.
image: "kaname:dev"

logger:
  level: DEBUG

# ── БАЗА: КООРДИНАТЫ СТЕНДА ─────────────────────────────────────────────────
#
# Базовые значения чарта этих трёх ключей не несут намеренно: они называют
# объекты, которых чарт не создаёт, и умолчание у них называло бы объект нашей
# установки. Стендовая накладка — тоже профиль, на котором служба поднимается,
# поэтому она обязана назвать их ЯВНО, а не опереться на подстановку.
#
# Имена ниже — те, под которыми узел базы и секрет заводятся НА ЭТОМ стенде;
# ставящий на своём меняет их так же, как в боевом профиле.
db:
  host: "kaname-postgres"
  passwordSecretName: "kaname-db"
  passwordSecretKey: "password"

repository:
  postgres:
    # Ширина пула на ОДНУ реплику в dev-посадке. Обязана совпадать с тем, что
    # объявляет для kaname профиль умбреллы values.dev.yaml — там же стоит
    # арифметика, из которой это число получено.
    #
    # Стояло 20 против 40 у профиля умбреллы: чарт никем не устанавливается,
    # поэтому расхождение не могло проявиться ничем (#709). Согласие держит
    # deploy/iam_pool_declaration_parity_test.go.
    maxConns: 40

# ── ДОМЕН ДОВЕРИЯ: ВЕЛИЧИНА СТЕНДА ──────────────────────────────────────────
#
# Базовые значения чарта её не несут намеренно (см. их комментарий): домен нашей
# установки в умолчании читался бы настройкой у того, кто ставит службу в своём
# облаке, и по нему не опознавался бы ни один ЕГО предъявитель — молча, отказом,
# неотличимым от вызова без личности.
#
# Стендовая накладка — тоже профиль, на котором служба поднимается, поэтому она
# называет величину ЯВНО, как называет образ и имена базы выше. Значение —
# домен, под которым выпускает сертификаты внутренний удостоверяющий центр
# ЭТОГО стенда; ставящий на своём меняет эту строку так же, как остальные.
#
# Страж старта отвергает пуск без неё на ЛЮБОЙ посадке, а не только в боевой:
# у необъявленного домена нет посадки, в которой он работает.
authn:
  trustDomain: "kacho.cloud"

# ПОСАДКА БЕЗОПАСНОСТИ — один адрес на весь флот (прежний: authn.mode).
authMode: dev

# ── ТРИ СОБСТВЕННЫХ ПОТОЛКА: ВЕЛИЧИНУ ОБЪЯВЛЯЕТ ЭТА ПОСАДКА ─────────────────
#
# Служба доступа перестаёт быть авторитетом величин, но три её собственных
# потолка остаются действующими: сколько аккаунтов заводит ОДНА личность и
# сколько путей входа держит человек и машина. Спросить величину не у кого —
# внешнего авторитета в самостоятельной установке нет by construction.
#
# Умолчания у этих ключей нет ни в базовых значениях чарта, ни в службе: страж
# старта отказывает в пуске при любой незаданной или отрицательной величине, и
# именно поэтому профиль обязан назвать все три. Ноль законен и означает
# «ресурсов этого вида не заводить»; отрицательное НЕ означает «без ограничения»
# и отвергается при старте.
#
# Числа ниже — величины, которыми продукт жил до `П25` (посев применённой
# миграции): накат не меняет наблюдаемого. Свою установку размеряет тот, кто её
# ставит, — это и есть предмет ручки.
ownCeilings:
  accountsPerIdentity: 5
  credentialsPerUser: 12
  credentialsPerServiceAccount: 24

# Здесь стояло «OpenFGA по умолчанию disabled в dev-overlay»: движок снят целиком
# стадией S6 эпика #747, выключать нечего и включить нельзя. Вердикт о доступе
# вычисляет реляционная форма в базе iam. Auth-tier — Ory Kratos + Hydra.
