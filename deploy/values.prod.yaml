# values.prod.yaml — БОЕВОЙ ПРОФИЛЬ ЧАРТА СЛУЖБЫ ПРАВ.
#
# Подключается поверх базовых значений:
#   helm install iam services/iam/deploy -f values.yaml -f values.prod.yaml
#
# ── ЗАЧЕМ ОН ЗАВЕДЁН ────────────────────────────────────────────────────────
#
# Служба прав выносится отдельным продуктом, устанавливаемым в ЧУЖОМ облаке, и
# требование «отдельный клон поднимается в боевой посадке» до сих пор было НЕ С
# ЧЕМ прогнать: боевые профили дерева принадлежали зонтичному чарту, а у чарта
# службы были только базовые значения и стендовая накладка. Профиль есть
# ОБЪЯВЛЕНИЕ посадки; всё, что страж старта требует в боевом режиме, обязано
# стоять здесь и нигде больше.
#
# ── ЧТО ЭТОТ ФАЙЛ НЕ ДЕЛАЕТ ─────────────────────────────────────────────────
#
# Он не подставляет координаты чужого кластера за оператора. Имена в области
# `.example.invalid` — заведомые заглушки (домен верхнего уровня зарезервирован
# стандартом именно под это): их обязан заменить тот, кто ставит. Заглушка,
# похожая на настоящее имя, прячет дефект, который сама и кормит, — поэтому она
# здесь неотличимо ненастоящая.
#
# ── ПОЧЕМУ КАЖДАЯ РУЧКА НИЖЕ НЕСУЩАЯ, И КТО ИМЕННО ЕЁ СУДИТ ─────────────────
#
# Судей ДВА, и различать их обязательно: ручка, которую не читает ни один, —
# украшение, а профиль есть объявление посадки, а не сборник пожеланий.
#
#   1. СТРАЖ СТАРТА процесса. Снятие ручки с поверхности посадки роняет пуск —
#      это утверждается пробой `prod_profile_test.go`, по одной ручке за прогон.
#      Строки, чьего снятия страж не замечает, названы там же поимённо, в перечне
#      восстановленных намеренно, и у каждой стоит причина; перечень утверждается
#      в обе стороны — запись, чью ручку страж начал читать, роняет прогон.
#   2. СТРАЖ РЕНДЕРА чарта (`kaname-svc.requireOperatorSuppliedNames`). Он судит
#      координаты ЧУЖОГО кластера, до процесса не доезжающие вовсе: имя секрета с
#      паролем, ключ в нём, координата образа. Их снятие роняет не пуск, а
#      установку — одним перечнем, а не поодиночке за перекат.
#
# Числа обоих судей печатает перепись пробы, а не этот комментарий: выписанное
# здесь число разошлось бы с деревом молча.

# ПОСАДКА БЕЗОПАСНОСТИ. Базовые значения чарта уже несут `production`, и снятие
# этой строки посадку не уронит; она стоит затем, чтобы будущая правка умолчания
# чарта не уронила посадку МОЛЧА. Величина та же, что у боевого профиля зонтичного
# чарта: одна служба, две боевые полосы, и различие между ними никто не решал бы.
authMode: production-strict

# ── ОБРАЗ: КООРДИНАТА В ВАШЕМ РЕЕСТРЕ ───────────────────────────────────────
#
# Умолчания у этого ключа нет намеренно: в базовых значениях чарта стоял тег
# нашего стенда, и он был непуст всегда — профиль читался настроенным, а под не
# поднимался, потому что образа с таким именем в чужом реестре не существует. Ни
# одна накладка образ при этом не переобъявляла, поэтому боевая посадка была
# неисполнима by construction; строка ниже — первое место, где она названа.
#
# Строка ниже — заведомая заглушка той же формы, что `db.host`: область
# `.example.invalid` зарезервирована стандартом именно под это, и заменить её
# обязан тот, кто ставит. Заглушка, похожая на настоящую координату, прятала бы
# дефект, который сама и кормит.
#
# Величина ЭКСПЛУАТАЦИОННАЯ: посадки безопасности она не несёт, и страж старта её
# не читает — её судит страж рендера чарта (`kaname-svc.requireOperatorSuppliedNames`),
# который отказывает в установке, пока координата не названа.
image: "registry.example.invalid/pro-robotech/kaname:0.1.0"

# ── БАЗА: КООРДИНАТЫ ЧУЖОГО КЛАСТЕРА ────────────────────────────────────────
#
# Умолчания у этих трёх ключей нет намеренно (см. базовые значения чарта): они
# называют объекты, которых чарт НЕ СОЗДАЁТ, а непустое умолчание называло бы
# объекты нашей установки — выглядело бы настройкой и отказало бы уже в
# кластере. Профиль обязан назвать их ЯВНО; незаданные роняют рендер одним
# перечнем, а не поодиночке за перекат.
#
# `host` — заведомая заглушка в зарезервированной области `.example.invalid`:
# узел базы заводит тот, кто ставит, и подставить его имя за него нельзя.
# Имена секрета и ключа — ПРЕДПИСАНИЕ той же формы, что у `tls.secretName`
# ниже: объект с таким именем оператор заводит сам ДО первого прогона helm.
db:
  host: "postgres.example.invalid"
  passwordSecretName: "kaname-db"
  passwordSecretKey: "password"

repository:
  postgres:
    # ШИФРОВАНИЕ ДО СВОЕЙ БАЗЫ. Базовые значения несут `disable` — годное только
    # для стенда. Ось судит центральный дескриптор посадки (`pkg/servicecontract`,
    # отказ старта О8) по перечню безопасных значений `pkg/db`; он читает строку
    # подключения, которая уходит в пул, а не поле настройки.
    sslMode: require

apiServer:
  # СОБСТВЕННЫЕ REST-ФРОНТЫ ОБЪЯВЛЯЕТ ПРОФИЛЬ, А НЕ УМОЛЧАНИЕ ЧАРТА (#2247).
  # Умолчания нет ни у процесса, ни у базовых значений чарта: незаданный адрес
  # означает «фронт не поднят», и процесс называет это при старте с объяснением,
  # что именно не обслуживается.
  #
  # Боевой профиль оба фронта поднимает и потому обязан назвать их адреса ЗДЕСЬ:
  # ребро с пустым адресом страж старта пропускает by construction («слушателя
  # нет — судить нечего»), то есть о его транспорте вердикта НЕ БЫВАЕТ, и
  # «нарушений нет» стало бы неотличимо от «не судили».
  restEndpoint: tcp://0.0.0.0:9098
  internalRestEndpoint: tcp://0.0.0.0:9099
  registryToken:
    # REALM ДОКЕРНОЙ ПОЛОСЫ. Страж на снятии молчит — встроенное умолчание
    # процесса непусто, — но оно называет локальное имя стенда, и оставленным
    # оно отправило бы докерного клиента на хост, которого у этой установки нет.
    issuer: "https://iam.example.invalid/iam/token"
    # АДРЕСАТ ДОКЕРНОЙ ПОЛОСЫ. Умолчания нет намеренно: это имя службы РЕЕСТРА,
    # у каждой установки своё, и выбрать его за оператора нельзя. Оно же
    # уходит в адресат каждого выпускаемого ключа служебной учётки, поэтому
    # расхождение с тем, что реестр объявляет докерному клиенту, означает отказ
    # во входе, а уже выпущенные ключи придётся перевыпустить.
    service: "registry.example.invalid"

authn:
  # ДОМЕННОЕ ИМЯ ЭТОЙ УСТАНОВКИ — то, кому адресованы выпускаемые ею
  # удостоверения (задача #2127).
  #
  # Умолчания у ручки нет намеренно ни здесь, ни в коде: из неё выводится клеймо
  # адресата, уезжающее в КАЖДОМ выпущенном токене и читаемое всяким, кто токен
  # разбирает. Прежде значение подставляло построение — и подставляло доменное
  # имя ЧУЖОГО продукта: этой строки не было ни в одном профиле, поэтому адресат
  # каждого удостоверения выбирал не оператор.
  #
  # Строка ниже — ЗАГЛУШКА, и заглушка нарочно нерезолвимая (`.invalid`,
  # RFC 2606): установка, забывшая её заменить, обнаруживает это сразу, тогда
  # как правдоподобное имя выглядело бы настроенным. ЗАПОЛНЯЕТ ТОТ, КТО СТАВИТ.
  domain: access.example.invalid

  # ПОЛОСА ПОСТАВЩИКА ЛИЧНОСТИ. Умолчания нет намеренно: подстановка в одну
  # сторону потребовала бы адресов поставщика у профиля, у которого их нет, в
  # другую — молча сняла бы это требование.
  #
  # ЗНАЧЕНИЕ `own` СЕГОДНЯ НЕ ПОДНИМАЕТСЯ, и это измерено, а не предположено:
  # композиционный корень объявляет провязку своих способов входа человека и
  # своей сессии ложью прямо (`cmd/kaname/laneposture.go`, поля
  # `HumanCredentialsWired`/`HumanSessionsWired`), потому что ни того, ни другого
  # в дереве ещё нет. Полоса `own`, объявленная здесь, дала бы профиль, который
  # рендерится и не стартует НИ ПРИ КАКОМ входе. Появятся хранилища — предикат
  # смены назван там же, у полей.
  identityProvider: external

  # КРУГ ЗАКОННЫХ ОТПРАВИТЕЛЕЙ ПЕРЕДАННОЙ ЛИЧНОСТИ.
  #
  # ПУСТОЙ КРУГ ОЗНАЧАЕТ «ДОВЕРЯЕМ ВСЕМ», а не «никому»: общая библиотека сужает
  # круг ТОЛЬКО на непустом перечне, поэтому на пустом переданную личность
  # принимает любой пир, предъявивший сертификат внутреннего удостоверяющего
  # центра, — и решение о доступе принимается за названного им арендатора.
  # Боевой режим на пустом круге в старт не идёт.
  #
  # ПЕРЕЧЕНЬ ЗАПОЛНЯЕТ ТОТ, КТО СТАВИТ, и заполняет ФАКТИЧЕСКИМИ отправителями
  # своей установки. Строка ниже — заглушка ровно на одного: она поднимает стенд
  # и не выдаёт брони под компонент, которого у установки может не быть. Бронь
  # под будущее в круге доверия уже стоила продукта: круг, объявленный шире
  # фактического, разрешает говорить за пользователя предъявителю сертификата,
  # которого никто не выпускал.
  trustedForwarderSANs:
    - "spiffe://example.invalid/ns/kacho/sa/kacho-api-gateway"

  # ДОМЕН ДОВЕРИЯ УСТАНОВКИ: чьи сертификаты служба признаёт СВОИМИ.
  #
  # Круг выше называет, КОМУ позволено говорить за пользователя; домен отвечает
  # на предыдущий вопрос — чьи предъявители вообще наши. По необъявленному домену
  # не опознаётся ни один сертификат, поэтому боевой режим на нём в старт не идёт:
  # процесс отвергал бы каждого соседа молча, отказом, неотличимым от вызова без
  # личности.
  #
  # ВЕЛИЧИНУ ЗАПОЛНЯЕТ ТОТ, КТО СТАВИТ, и заполняет доменом, под которым его
  # установка ВЫПУСКАЕТ сертификаты. Строка ниже — заглушка, согласованная с
  # заглушкой круга выше: обе называют один и тот же домен, потому что
  # выпускающая и принимающая стороны обязаны сходиться.
  trustDomain: "example.invalid"

  # ── СВОЯ ЧЕКАНКА ТОКЕНОВ И ЧИТАТЕЛЬ ПРЕДЪЯВЛЕННОГО ─────────────────────────
  #
  # ПОЧЕМУ ОБА БЛОКА ЗДЕСЬ ОБЯЗАТЕЛЬНЫ, а не «включаются по желанию».
  #
  # Этот профиль поднимает СОБСТВЕННЫЙ публичный REST-фронт службы
  # (`apiServer.restEndpoint` выше). Отдельно поставленная служба — сама себе
  # край: нашего шлюза перед этим фронтом нет by construction, а модульного
  # сертификата у арендатора не бывает. Значит предъявленное удостоверение —
  # ЕДИНСТВЕННОЕ, чем дотянувшийся до фронта может назваться, и без читателя
  # фронт отвечает на годное удостоверение ровно тем же, чем на негодное.
  #
  # Страж старта связывает эту пару и НЕ ПОДНИМАЕТ службу, у которой фронт есть,
  # а читателя нет (PresentedCredentialConfig.ValidateBinding). Требование он
  # предъявляет на ЛЮБОЙ посадке, а не только на `own`: фронт поднимает
  # объявленный адрес, а не выбор поставщика личности.
  #
  # Читатель, в свою очередь, проверяет подпись СОБСТВЕННЫМ реестром ключей —
  # поэтому включён и он, и своя чеканка: без чеканки реестра не существует
  # вовсе, и каждое предъявление отвергалось бы по причине, не видимой снаружи.
  #
  # Прежде ни того, ни другого профиль не объявлял: он рендерился и не стартовал
  # (задача #2333). Второй выход из связывания — не поднимать фронт — отвергнут:
  # он оставил бы отдельно поставленную службу вовсе без REST-поверхности для
  # арендатора, то есть без того, ради чего её ставят.
  tokenSigning:
    enabled: true
    # НАШ ИЗДАТЕЛЬ. Уезжает в каждом выпущенном токене и служит ключом привязки
    # «издатель → источник набора» на приёмной стороне. Заглушка нарочно
    # нерезолвимая (`.invalid`, RFC 2606) и согласована с `domain` выше: обе
    # называют одну установку. ЗАПОЛНЯЕТ ТОТ, КТО СТАВИТ.
    issuer: "https://access.example.invalid"
    # ПОДПИСЬ ПОРОЖДАЕМОГО КЛЮЧА. Из закрытого словаря платформы
    # (RS256 | ES256 | EdDSA).
    algorithm: ES256
    # ПЕРЕЧЕНЬ ПОДПИСЕЙ, ПРИНИМАЕМЫХ НА ВХОДЕ. Назван РОВНО одним элементом — тем
    # же, которым чеканим: перечень есть то, что мы соглашаемся принять, и
    # лишний элемент в нём расширяет принимаемое, ничего не давая свежей
    # установке. Второй алгоритм добавляет тот, кому надо принять чужие токены,
    # выпущенные до смены подписи.
    allowedAlgorithms: "ES256"
    # ПУТЬ НАШЕЙ ЗАПИСИ ПУБЛИКУЕМОГО НАБОРА. Собственный, а не канонический
    # well-known: по каноническому тот же слушатель отдаёт зеркало прежнего
    # издателя, и оно остаётся там, пока прежний издатель принимается.
    keySetPath: /.well-known/kaname/jwks.json
    # СРОК КЛЮЧА КЛЮЧНИЦЫ. Ротацию исполняет сама служба.
    keyLifetime: 2160h
  presentedCredential:
    enabled: true
    # АДРЕСАТ ЭТОЙ ПОВЕРХНОСТИ. Токен, выпущенный этой же установкой для ДРУГОЙ
    # её поверхности (докерная полоса выдачи выше называет свою), здесь не
    # годится: адресат есть свойство поверхности предъявления, а не издателя.
    # Заглушка согласована с издателем и доменом. ЗАПОЛНЯЕТ ТОТ, КТО СТАВИТ.
    audience: "https://access.example.invalid"
    # ОБЪЯВЛЕННОЕ ОКНО ОТЗЫВА: столько времени субъект, у которого доступ
    # отобрали, продолжает проходить. Кешируется ТОЛЬКО положительный вердикт,
    # поэтому величина и ЕСТЬ окно.
    #
    # Заметно короче срока выпускаемого токена (потолок платформы — 30 минут):
    # окно, дотягивающее до срока токена, окном быть перестаёт — отозванное
    # истекло бы раньше, чем кеш о нём забыл, и чтение отзыва на предъявлении
    # стало бы неотличимо от его отсутствия. Причём неотличимо МОЛЧА: ряд
    # «отвергнуто» не вырос бы, потому что токены истекают сами.
    revocationCacheTtl: "30s"

# ── МАТЕРИАЛ TLS СЛУШАТЕЛЕЙ ─────────────────────────────────────────────────
#
# Секрет обязан существовать ДО первого прогона helm и нести `tls.crt`,
# `tls.key`, `ca.crt` (форма секрета `kubernetes.io/tls` плюс якорь внутреннего
# удостоверяющего центра). Имя и раскладка — те же, что у зонтичного чарта: одна
# служба, и различие между её полосами никто не решал бы.
#
# Каталог монтирования (`tls.mountPath`) здесь НЕ ПОВТОРЯЕТСЯ: его объявляют
# базовые значения чарта, и вторая строка о том же предмете разошлась бы молча.
# Пути в карте `env` ниже обязаны лежать под ним — это утверждает проба.
tls:
  secretName: kaname-server-tls
  # Клиентская личность службы: тем, чем она представляется, когда звонит сама.
  # Оператор заводит объект Secret тем же внутренним удостоверяющим центром, что
  # и серверный, но с назначением `client auth`.
  clientSecretName: kaname-client-tls

# ── ВЕЛИЧИНЫ ИЗ СЕКРЕТА ─────────────────────────────────────────────────────
#
# Обе величины страж требует непустыми в боевом режиме, и обе — секреты: их
# место ссылкой, а не значением в карте `env`, которая отслеживается git.
# Оператор заводит объект Secret сам; ни одна из величин не появляется в этом
# дереве ни разу.
secrets:
  # Общий сговор, которым подписаны вебхуки поставщика личности.
  KANAME_HOOK_TOKEN:
    secretName: kaname-authn
    secretKey: hook-shared-secret
  # Ключ обёртки приватной половины подписного ключа в ключнице.
  KANAME_JWKS_ENC_KEY:
    secretName: kaname-authn
    secretKey: jwks-encryption-key-hex

# ── ПЕРЕМЕННЫЕ ОКРУЖЕНИЯ ────────────────────────────────────────────────────
#
# Здесь стоят ручки, которые служба читает НАПРЯМУЮ из окружения, минуя файл
# настроек: посадка транспорта слушателей (её разбирает `config.LoadMTLS`) и
# адреса контуров поставщика личности (методы `Resolve*`).
env:
  # ── ВЗАИМНЫЙ TLS ОБОИХ СЛУШАТЕЛЕЙ ────────────────────────────────────────
  #
  # Внутренний слушатель НЕ ОСВОБОЖДЁН: внутренний периметр не доверенный, и
  # центральный дескриптор посадки судит его транспорт тем же отказом О8, что и
  # публичный. Оба ребра — взаимные по построению общей библиотеки: она строит
  # их с требованием проверенного клиентского сертификата, поэтому якорь клиента
  # обязателен на обоих.
  KANAME_PUBLIC_SERVER_MTLS_ENABLE: "true"
  KANAME_PUBLIC_SERVER_MTLS_CERTFILE: /etc/kaname/tls/server/tls.crt
  KANAME_PUBLIC_SERVER_MTLS_KEYFILE: /etc/kaname/tls/server/tls.key
  KANAME_PUBLIC_SERVER_MTLS_CLIENTCAFILES: /etc/kaname/tls/server/ca.crt
  KANAME_INTERNAL_SERVER_MTLS_ENABLE: "true"
  KANAME_INTERNAL_SERVER_MTLS_CERTFILE: /etc/kaname/tls/server/tls.crt
  KANAME_INTERNAL_SERVER_MTLS_KEYFILE: /etc/kaname/tls/server/tls.key
  KANAME_INTERNAL_SERVER_MTLS_CLIENTCAFILES: /etc/kaname/tls/server/ca.crt

  # ── ДОКЕРНАЯ ПОЛОСА (`/iam/token`, :9096) ────────────────────────────────
  #
  # ЭТИ ТРИ СТРОКИ — УСЛОВИЕ ТОГО, ЧТО ПРОФИЛЬ ВООБЩЕ ПОДНИМАЕТСЯ. Их здесь не
  # было, и боевая посадка не стартовала НИ ПРИ КАКОМ входе: слушатель докерной
  # полосы поднимается умолчанием процесса (`api-server.registry-token.endpoint`
  # = `tcp://0.0.0.0:9096`), а боевой режим требует на нём TLS и отказывает в
  # пуске, пока его не объявили. Отказ не зависел ни от одной величины — то есть
  # это была объявленная и неисполнимая посадка, а не ошибка оператора.
  #
  # ПОЧЕМУ ИМЕННО ЭТА НОГА ГЕЙТИТСЯ ОТДЕЛЬНО. По ней едет HTTP Basic, и пароль в
  # этой паре — ПРИВАТНЫЙ КЛЮЧ ключа служебной учётки: сервер его не хранит
  # вовсе, срок жизни ключа не ограничен, ротации нет. Снятый с провода, он
  # предъявляется напрямую, без окна истечения, — поэтому ущерб не ограничен
  # ничем, в отличие от короткоживущего предъявителя на соседней ноге.
  #
  # ПОЛОСА ОДНОСТОРОННЯЯ, и якоря клиента здесь нет намеренно: проверка
  # вызывающего на этом эндпоинте И ЕСТЬ Basic — в этом его смысл, — не хватало
  # ровно шифрования и аутентификации сервера. Требование клиентского
  # сертификата сломало бы докерного клиента, который его не предъявляет.
  # Незаданный режим проверки клиента процесс читает как `server-tls-only`,
  # поэтому четвёртой строки у этой ноги нет и быть не должно.
  # ─── Собственные REST-фронты (KAN-REST-1) ──────────────────────────────────
  # ONE-WAY server-TLS НАМЕРЕННО: до публичного фронта дотягивается арендатор
  # обычным HTTP-клиентом и клиентского сертификата не носит — требование
  # предъявить его отвергло бы КАЖДОГО на рукопожатии, то есть поверхность была
  # бы недостижима ни для кого. Вызывающего здесь аутентифицирует ПРЕДЪЯВЛЕННОЕ
  # УДОСТОВЕРЕНИЕ, которое проверяет звено собственного слушателя; TLS даёт
  # шифрование и аутентификацию СЕРВЕРА, а не вызывающего.
  KANAME_REST_SERVER_MTLS_ENABLE: "true"
  KANAME_REST_SERVER_MTLS_CLIENTAUTHMODE: server-tls-only
  KANAME_REST_SERVER_MTLS_CERTFILE: /etc/kaname/tls/server/tls.crt
  KANAME_REST_SERVER_MTLS_KEYFILE: /etc/kaname/tls/server/tls.key
  KANAME_REST_SERVER_MTLS_CLIENTCAFILES: /etc/kaname/tls/server/ca.crt
  KANAME_INTERNALREST_SERVER_MTLS_ENABLE: "true"
  KANAME_INTERNALREST_SERVER_MTLS_CLIENTAUTHMODE: server-tls-only
  KANAME_INTERNALREST_SERVER_MTLS_CERTFILE: /etc/kaname/tls/server/tls.crt
  KANAME_INTERNALREST_SERVER_MTLS_KEYFILE: /etc/kaname/tls/server/tls.key
  KANAME_INTERNALREST_SERVER_MTLS_CLIENTCAFILES: /etc/kaname/tls/server/ca.crt
  # Удостоверение, которым фронт представляется СОБСТВЕННОМУ слушателю. Фронт —
  # обычный клиент: широкого допуска он не получает и в круг разрешённых
  # отправителей личности не вносится. Единственное, чем запрос, пришедший через
  # фронт, называет субъекта, — предъявленное арендатором удостоверение.
  # ПУТИ — НА КЛИЕНТСКИЙ ЛИСТ, а не на серверный. Здесь стоял `server/`, и это
  # был не недосмотр в одно слово: серверный лист выписан БЕЗ `client auth`,
  # слушатель проверяет клиентскую цепь именно этим назначением, поэтому
  # рукопожатие обрывалось предупреждением `bad certificate` — и фронт возвращал
  # арендатору `503 {"code":14,… "tls: bad certificate"}` на КАЖДОМ запросе,
  # доходившем до обработчика (задача #2186).
  KANAME_REST_UPSTREAM_MTLS_ENABLE: "true"
  KANAME_REST_UPSTREAM_MTLS_CERTFILE: /etc/kaname/tls/client/tls.crt
  KANAME_REST_UPSTREAM_MTLS_KEYFILE: /etc/kaname/tls/client/tls.key
  KANAME_REST_UPSTREAM_MTLS_CAFILES: /etc/kaname/tls/client/ca.crt
  KANAME_REGISTRYTOKEN_SERVER_MTLS_ENABLE: "true"
  KANAME_REGISTRYTOKEN_SERVER_MTLS_CERTFILE: /etc/kaname/tls/server/tls.crt
  KANAME_REGISTRYTOKEN_SERVER_MTLS_KEYFILE: /etc/kaname/tls/server/tls.key

  # ── ТРАНСПОРТ ОСТАЛЬНЫХ HTTP-РЁБЕР ───────────────────────────────────────
  #
  # ПОЧЕМУ ЭТИ ТРИ СТРОКИ ЗДЕСЬ ПОЯВИЛИСЬ. Ручки объявлены кодом давно, но
  # задавал их ЗОНТИЧНЫЙ чарт монорепо; профиль ЭТОЙ службы о них молчал.
  # Адреса всех трёх рёбер приходят умолчанием процесса и потому непусты
  # ВСЕГДА, а умолчание транспорта означает «открытый текст», а не
  # «выключено», — то есть отдельно поставленная служба поднимала три
  # слушателя открытым текстом, и заметить это было неоткуда.
  #
  # ЦЕНА КАЖДОГО РЕБРА РАЗНАЯ, и потому названа отдельно:
  #
  #   вебхуки        — по проводу идёт ОБЩИЙ СЕКРЕТ поставщика личности: тот
  #                    самый, которым обработчик отличает поставщика от
  #                    постороннего. Снятый с провода, он позволяет звать
  #                    заведение пользователя и обогащение токена от чужого имени;
  #   зеркало ключей — аутентификация с этой поверхности снята ЗАДОКУМЕНТИРОВАННО,
  #                    и обоснование опирается на одностороннюю TLS. Без неё
  #                    предпосылка собственного исключения ложна: остаётся
  #                    неаутентифицированный слушатель открытым текстом, чьи ключи
  #                    плоскость данных реестра принимает как решающие, чью подпись
  #                    верить;
  #   скрейп         — счётчики процесса суть внутренняя кардинальность, которую
  #                    держат вне поверхности, читаемой посторонним.
  #
  # ПОЛОСЫ ОДНОСТОРОННИЕ. Якорь клиента не объявляется ни у одной: поставщик
  # личности клиентского сертификата не предъявляет, а у скрейпа его в этой
  # установке нет. Незаданный режим проверки клиента процесс читает как
  # `server-tls-only`, поэтому четвёртой строки у этих ног нет и быть не должно.
  #
  # ДЕРЖИТСЯ СТРАЖЕМ, а не этим комментарием: снятие любой из трёх строк роняет
  # не посадку, а СТАРТ — `requireHTTPEdgeTLS` в композиционном корне называет
  # ручку, адрес и то, что по этому проводу едет.
  KANAME_HOOKS_SERVER_MTLS_ENABLE: "true"
  KANAME_HOOKS_SERVER_MTLS_CERTFILE: /etc/kaname/tls/server/tls.crt
  KANAME_HOOKS_SERVER_MTLS_KEYFILE: /etc/kaname/tls/server/tls.key

  KANAME_JWKSPROXY_SERVER_MTLS_ENABLE: "true"
  KANAME_JWKSPROXY_SERVER_MTLS_CERTFILE: /etc/kaname/tls/server/tls.crt
  KANAME_JWKSPROXY_SERVER_MTLS_KEYFILE: /etc/kaname/tls/server/tls.key

  KANAME_METRICS_SERVER_MTLS_ENABLE: "true"
  KANAME_METRICS_SERVER_MTLS_CERTFILE: /etc/kaname/tls/server/tls.crt
  KANAME_METRICS_SERVER_MTLS_KEYFILE: /etc/kaname/tls/server/tls.key

  # ── ТРИ КОНТУРА К ПОСТАВЩИКУ ЛИЧНОСТИ ────────────────────────────────────
  #
  # ОБЪЯВЛЕНЫ, А НЕ ВЫВЕДЕНЫ. Незаданный адрес не остаётся пустым: служба
  # выводит его из издателя, получая ПУБЛИЧНОЕ имя входа, которое внутри
  # кластера не разрешается. Выведенный адрес непуст всегда — поэтому фасад
  # читается настроенным, обращаясь к хосту, которого никто не выбирал.
  #
  # ЧЕРЕЗ TLS С ЗАКРЕПЛЁННЫМ ЯКОРЕМ — все три. Административный контур возит
  # административный предъявитель, а API, который он открывает, не спрашивает
  # больше ничего; набор проверочных ключей решает, чьи подписи принимает
  # data-plane; обмен возит подписанное утверждение и выданный токен в теле.
  #
  # ЗДЕСЬ НЕТ ПОСЛАБЛЕНИЯ ЗОНТИЧНОГО ЧАРТА НА ОТКРЫТЫЙ ТЕКСТ, и это решение:
  # там оно оправдано тем, что публичный слушатель НАШЕГО поставщика не несёт
  # TLS и переезд его — отдельное изменение. Этот чарт поставщика не несёт
  # вовсе: его приносит тот, кто ставит, и требовать от чужой установки
  # открытого текста было бы режимом, годным только для стенда. Оператор,
  # чей поставщик отвечает по http, меняет схему сам — страж якоря тогда не
  # требует, и профиль остаётся исполнимым.
  KANAME_HYDRA_ADMIN_URL: "https://hydra-admin.example.invalid:4445"
  KANAME_HYDRA_ADMIN_CA_FILE: /etc/kaname/tls/server/ca.crt
  KANAME_HYDRA_JWKS_URL: "https://hydra-public.example.invalid:4444/.well-known/jwks.json"
  KANAME_HYDRA_JWKS_CA_FILE: /etc/kaname/tls/server/ca.crt
  KANAME_HYDRA_TOKEN_URL: "https://hydra-public.example.invalid:4444/oauth2/token"
  KANAME_HYDRA_TOKEN_CA_FILE: /etc/kaname/tls/server/ca.crt
