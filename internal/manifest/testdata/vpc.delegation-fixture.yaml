# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Фикстура доставки мира Д (PRO-Robotech/kaname#986, полоса красных проб
# PRO-Robotech/kaname#1009): манифест vpc, чья роль `vpc.address_pool_admin`
# доезжает до базы путём старта. Нужна как «роль ДРУГОГО модуля» приёмки
# docs/engineering/acceptance/delegated-grants-stay-within-the-delegation.md
# (редакция 3, §4.1; сценарии GD-05 b, GD-06 a).
#
# Построена из `vpc.resources-fixture.yaml` ровно одной правкой: ярус роли
# `vpc.address_pool_admin` — кластер (`iam.cluster`, `cluster_root`) вместо
# аккаунта. Причина — замер, а не вкус: применитель ролей пути старта
# (`internal/apps/kaname/moduleroles/apply.go`, ветка «Ярус аккаунта и проекта
# уезжает своим путём») роли яруса аккаунта и проекта ПРОПУСКАЕТ, и роль
# исходной фикстуры в базе не появляется вовсе — первый прогон мира Д упал на
# контроле «роль vpc.address_pool_admin в базе: no rows in result set». Прочее —
# дословно как в исходной фикстуре.
#
# Ярус роли `vpc.internal_consumer` — кластер, как в исходной фикстуре с
# kaname#979. Первая редакция этой фикстуры была снята с исходной ДО kaname#979, где
# роль стояла на проекте, и потолок посева (`seedgrantceiling.go`) её отвергал:
# выдача посева стоит на якоре кластера, а роль, определённая на проекте,
# действовала бы на всю установку. Перенести выдачу на проект нельзя — якорь
# посева пиннут кластером (`grantanchor.go`). Мир Д этой роли и её выдачи не
# касается: сценарии GD* берут из манифеста vpc одну `vpc.address_pool_admin`.
# Что каждая фикстура каталога проходит загрузчик, держит
# `TestEveryTestdataFixtureFacesTheLoaderWithTheSeedGrantCeiling`.
#
# Имя файла — НЕ `manifest.yaml`: проверка дерева читает файлы ровно с этим
# базовым именем, и фикстура, названная так, судилась бы как манифест модуля.

apiVersion: iam/v1
module: vpc

resources:

  - name: network
    objectType: vpc_network
    parents: [project]
    producer: derived
    verbs:
      - get
      - list
      - create
      - update
      - delete
      - {name: listOperations,   class: list}
      - {name: addCidrBlocks,    class: update}
      - {name: removeCidrBlocks, class: update}

  - name: subnet
    objectType: vpc_subnet
    parents: [project]
    producer: derived
    # Отношение, не выводимое ни из одного действия: RPC под него нет.
    # Объявляется дословно, иначе перегенерация модели его СНИМЕТ.
    relations:
      - {name: use, definition: "[user, service_account] or editor"}
    verbs:
      - get
      - list
      - create
      - update
      - delete
      - {name: listOperations,    class: list}
      - {name: addCidrBlocks,     class: update}
      - {name: removeCidrBlocks,  class: update}
      - {name: listUsedAddresses, class: list}

  - name: securityGroup
    objectType: vpc_security_group
    parents: [project]
    producer: derived
    verbs:
      - get
      - list
      - create
      - update
      - delete
      - {name: listOperations, class: list}
      - {name: updateRule,     class: update}
      - {name: updateRules,    class: update}

  - name: routeTable
    objectType: vpc_route_table
    parents: [project]
    producer: derived
    verbs: [get, list, create, update, delete, {name: listOperations, class: list}]

  - name: address
    objectType: vpc_address
    parents: [project]
    producer: derived
    relations:
      - {name: use, definition: "[user, service_account] or editor"}
    verbs:
      - get
      - list
      - create
      - update
      - delete
      - {name: listOperations, class: list}

  - name: gateway
    objectType: vpc_gateway
    parents: [project]
    producer: derived
    verbs: [get, list, create, update, delete, {name: listOperations, class: list}]

  - name: networkInterface
    objectType: vpc_network_interface
    parents: [project]
    producer: derived
    verbs: [get, list, create, update, delete, {name: listOperations, class: list}]

  - name: cidrGroup
    objectType: vpc_cidr_group
    parents: [project]
    producer: derived
    verbs:
      - get
      - list
      - create
      - update
      - delete
      - {name: listOperations,   class: list}
      - {name: addCidrBlocks,    class: update}
      - {name: removeCidrBlocks, class: update}

  # Административный ресурс кластера. Аннотации о нём молчат BY CONSTRUCTION:
  # его глаголы живут на внутреннем слушателе (ban #6), и якоря области этот
  # тип не несут — отсюда `producer: authored`.
  - name: addressPool
    objectType: vpc_address_pool
    parents: [cluster]
    producer: authored
    # Примечание несёт ЯКОРЬ — имя отношения, перед которым оно стоит в блоке:
    # канон располагает прозу и у указателя, и у ярусов, и у действий.
    notes:
      - before: cluster
        text: |
          # Административный ресурс с якорем на кластере: его RPC гейтятся прямо на
          # cluster:cluster_root#system_admin, поэтому пообъектного указателя на
          # него не пишет никто.
    # Состав субъектов и набор ярусов у административного ресурса УЖЕ общего:
    # группы среди субъектов нет, яруса editor нет вовсе. Умолчание здесь
    # расширило бы доступ молча.
    subjects: [user, service_account]
    tiers: [admin, viewer]
    verbs:
      - get
      - list
      - create
      - update
      - delete
      - {name: addCidrBlocks,          class: update}
      - {name: removeCidrBlocks,       class: update}
      - {name: bindAsNetworkDefault,   class: update}
      - {name: unbindNetworkDefault,   class: update}
      - {name: getUtilization,         class: get}
      - {name: listAddresses,          class: list}

roles:

  - id: vpc.internal_consumer
    description: >
      Ходит в vpc на пути запроса: аллокация адресов, ссылки, привязка
      интерфейсов.
    tier: {tierType: iam.cluster, tierId: cluster_root}
    rules:
      - module: vpc
        resources: [address, networkInterface, subnet]
        classes: [get, list]

  - id: vpc.address_pool_admin
    description: Ведёт адресные пулы облака.
    tier: {tierType: iam.cluster, tierId: cluster_root}
    rules:
      - module: vpc
        resources: [addressPool]
        classes: [get, list, create, update, delete]

deprecatedVerbs:
  read:
    class: get
    since: "2026-08-23"
    reason: >
      Синоним чтения из прежней грамматики. Ни одного RPC не адресует;
      проецируется в отношение чтения наравне с get и list.
    removeWhen: >
      Ни одна выданная привязка не ссылается на роль, чьи права содержат
      сегмент `.read`. Предикат: выдач с таким правом ноль.

seed:

  serviceAccounts:
    - name: kacho-vpc
      account: system
      description: >
        Личность модуля на пути запроса: под ней vpc ходит в geo за зонами,
        в iam за пределами квот и правами.

  groups:
    - name: vpc-internal-consumers
      account: system
      description: >
        Смежные модули, ходящие в vpc на пути запроса.

  accessBindings:
    - subjects:
        - {type: group, name: vpc-internal-consumers}
      roleId: vpc.internal_consumer
      scopeType: iam.cluster
      scopeId: cluster_root
      target: allInScope
