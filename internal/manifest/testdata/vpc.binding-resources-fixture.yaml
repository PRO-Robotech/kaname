#
# Фикстура проб: выдача с ПЕРЕЧНЕМ ОБЪЕКТОВ (`target: resources`) — вход ОТКАЗА.
#
# Манифест модуля конкретных объектов не называет (kaname#965): объект
# адресуется идентификатором, который присваивает запись, а манифест применяется
# на каждом старте и вернул бы ссылку снова. Загрузчик эту выдачу отвергает.
# Пробы — `object_refs_test.go`; законный близнец — та же выдача с
# `target: allInScope` без перечня.
#
# Прежде фикстура была положительным входом переписи требовательности схемы
# (оси `seed.accessBindings[].resources` и пары ключей его элемента); законной
# такая выдача больше не бывает, и из той переписи фикстура снята.
#
# Имя файла — НЕ `manifest.yaml`: проверка дерева читает файлы ровно с этим
# базовым именем, и фикстура, названная так, судилась бы как настоящий манифест.

apiVersion: iam/v1
module: vpc

seed:

  groups:
    - name: vpc-pool-operators
      account: system
      description: >
        Операторы, которым выдан доступ на ПОИМЕНОВАННЫЕ адресные пулы, а не на
        весь ярус: перечень объектов и есть предмет этой фикстуры.

  accessBindings:
    - subjects:
        - {type: group, name: vpc-pool-operators}
      roleId: vpc.addressPoolAdmin
      scopeType: iam.cluster
      scopeId: cluster_root
      target: resources
      resources:
        - {type: vpc.addressPool, id: apl000000000000001}
        - {type: vpc.addressPool, id: apl000000000000002}
