# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Фикстура доставки мира Д (PRO-Robotech/kaname#986, полоса красных проб
# PRO-Robotech/kaname#1009): манифест registry редакции, вносящей роли модуля,
# которые делегирует выпускающая служба. Приёмка
# docs/engineering/acceptance/delegated-grants-stay-within-the-delegation.md,
# редакция 3, §4.1 «роли модуля registry».
#
# Построена из `registry.public-read-fixture.yaml` (новейшая редакция registry в
# дереве проб) ровно одной правкой: в раздел `roles` дописаны три роли уровня
# кластера —
#   1. `registry.puller` — `[get, list]` над `registries` с вложенным
#      `[get, list]` над `repositories`;
#   2. `registry.pusher` — то же плюс `update` над `repositories`;
#   3. `registry.admin`  — то же плюс `delete` над `repositories`.
#
# У каждой роли, кроме правила над `registries` с вложенным, есть ВТОРОЕ правило
# верхнего уровня над `repositories` с теми же действиями, что у вложенного.
# Без него выдача с целью `registry.repositories` (GD-14 приёмки) упиралась бы в
# проверку покрытия типа (`Rules.CoversType` судит только верхний уровень
# правил), и проба красела бы по фикстуре, а не по предмету.
#
# Прочие роли и раздел `resources` — дословно как в исходной редакции: мир Д
# стоит поверх мира П6, и доставка этой редакции не снимает ни одной его роли.
#
# Имя файла — НЕ `manifest.yaml`: проверка дерева читает файлы ровно с этим
# базовым именем, и фикстура, названная так, судилась бы как манифест модуля.

apiVersion: iam/v1
module: registry

resources:

  - name: registries
    objectType: registry_registry
    parents: [project]
    producer: derived
    publicReadToChildren: true
    notes:
      - before: v_get
        text: |
          # #64 Дефект A: v_* выводятся из `owner`, поэтому СОЗДАТЕЛЬ/ВЛАДЕЛЕЦ реестра (кортеж
          # `owner` от RegisterResource) имеет полный набор глаголов CRUD на своём
          # реестре — особенно v_create (создание репозиториев). Без этого владелец получал
          # только ярус редактора v_get/v_list/v_update/v_delete (роль `edit` не задаёт
          # глагол `create`), а CreateRepository отказывал → 404 для владельца. Вычисляемое
          # отношение на ОБЪЕКТЕ (как `editor: this or admin`), НЕ каскад иерархии.
          #
          # `v_create` ЖИВЁТ ТОЛЬКО ЗДЕСЬ — не «восстанавливайте равенство», добавляя его
          # другим типам. Реестр — КОНТЕЙНЕР: «создать репозиторий в
          # этом пространстве имён» — настоящее действие над объектом реестра, которое действительно
          # запрашивается плоскостью управления (CreateRepository / RenameRepository) и
          # плоскостью данных (docker push в новый репозиторий, cross-repo mount в новый dst и
          # защитой раскрытия blob при первом push). Все другие типы отвечали на вопрос,
          # которого ни один запрос не задаёт: «создать» не является действием над уже существующим объектом,
          # а создание ресурса внутри области разрешается ярусом записи на этой
          # области. Закреплено authzmap/verb_relation_has_reader_test.go: он краснеет с
          # именем типа при возвращении носителя без читателя.
    relations:
      - name: owner
        definition: '[user, service_account]'
        position: beforeTiers
    verbs:
      - {name: get, from: [owner, super_admin]}
      - {name: list, from: [owner, super_admin]}
      - {name: create, from: [owner, super_admin]}
      - {name: update, from: [owner, super_admin]}
      - {name: delete, from: [owner, super_admin]}
      - {name: internalGetRegistryStats, class: get, internal: true}
      - {name: internalTriggerGarbageCollection, class: delete, internal: true}

  - name: repositories
    objectType: registry_repository
    parents:
      - {name: parent, type: registry_registry}
    producer: authored
    notes:
      - before: super_admin
        text: |
          # У репозитория нет собственного указателя на проект — это потомок
          # реестра, и именно реестр привязан к проекту.
      - before: v_get
        text: |
          # RG-1 D-7: wildcard публичного чтения `user:*` — анонимный pull репозитория PUBLIC.
          # Wildcard даёт v_get ТОЛЬКО репозиториям, которые ТАКЖЕ несут явный
          # кортеж `user:* v_get`, выданный overlay реестра (visibility=PUBLIC);
          # без этого кортежа `user:*` не имеет доступа → одинаковый 404. Wildcard получает
          # ТОЛЬКО v_get, ни одно отношение записи (анонимный доступ — основание только для чтения, B14).
          # #64 Дефект A: v_* выводятся из `owner` (кортеж владельца создателя/отправителя репозитория), поэтому
          # владелец полностью управляет своим репозиторием; wildcard `user:*` остаётся
          # ТОЛЬКО на v_get (основание анонимного публичного чтения, B14).
    relations:
      - name: owner
        definition: '[user, service_account]'
        position: beforeTiers
    verbs:
      - {name: get, subjects: ['user:*', user, service_account, 'group#member'], from: [owner, super_admin]}
      - {name: list, from: [owner, super_admin]}
      - {name: update, from: [owner, super_admin]}
      - {name: delete, from: [owner, super_admin]}

roles:

  - id: registry.public.read
    description: >
      Публичное чтение реестра: метаданные реестра и перечень его
      репозиториев, а через объявление контейнера — чтение каждого его
      репозитория, включая созданные позже. Только чтение.
    tier: {tierType: iam.cluster, tierId: cluster_root}
    rules:
      - module: registry
        resources: [registries]
        classes: [get, list]
        children:
          - resources: [repositories]
            classes: [get, list]

  - id: registry.reader
    description: >
      Пробная роль: чтение реестра и каждого его репозитория, включая
      созданные позже.
    tier: {tierType: iam.cluster, tierId: cluster_root}
    rules:
      - module: registry
        resources: [registries]
        classes: [get, list]
        children:
          - resources: [repositories]
            classes: [get, list]

  - id: registry.viewer
    description: >
      Пробная роль: чтение самого реестра, без его репозиториев.
    tier: {tierType: iam.cluster, tierId: cluster_root}
    rules:
      - module: registry
        resources: [registries]
        classes: [get, list]

  - id: registry.reader_get
    description: >
      Пробная роль: как registry.reader, но вложенное правило даёт только get.
    tier: {tierType: iam.cluster, tierId: cluster_root}
    rules:
      - module: registry
        resources: [registries]
        classes: [get, list]
        children:
          - resources: [repositories]
            classes: [get]

  - id: registry.puller
    description: >
      Пробная роль мира Д: чтение реестра и его репозиториев.
    tier: {tierType: iam.cluster, tierId: cluster_root}
    rules:
      - module: registry
        resources: [registries]
        classes: [get, list]
        children:
          - resources: [repositories]
            classes: [get, list]
      - module: registry
        resources: [repositories]
        classes: [get, list]

  - id: registry.pusher
    description: >
      Пробная роль мира Д: чтение реестра и запись в его репозитории.
    tier: {tierType: iam.cluster, tierId: cluster_root}
    rules:
      - module: registry
        resources: [registries]
        classes: [get, list]
        children:
          - resources: [repositories]
            classes: [get, list, update]
      - module: registry
        resources: [repositories]
        classes: [get, list, update]

  - id: registry.admin
    description: >
      Пробная роль мира Д: запись в репозитории реестра и их удаление.
    tier: {tierType: iam.cluster, tierId: cluster_root}
    rules:
      - module: registry
        resources: [registries]
        classes: [get, list]
        children:
          - resources: [repositories]
            classes: [get, list, update, delete]
      - module: registry
        resources: [repositories]
        classes: [get, list, update, delete]
