#
# Фикстура проб: раздел `resources`, записанный ДЛИННЫМИ формами.
#
# Заведена затем, что десять осей требовательности схемы входа не имели ни в
# одной прежней фикстуре: указатель и ярус там написаны короткой формой, а
# каскада, состава субъектов действия и перечня отношений вывода нет вовсе.
# Перепись честно называла их третьей категорией — «вход не произведён», — а
# третья категория не вердикт: по этим осям не было известно НИЧЕГО, ни
# зелёного, ни красного.
#
# Короткие формы тут намеренно не повторяются: их вход уже произведён соседними
# фикстурами, и вторая копия ничего бы не добавила.
#
# Имя файла — НЕ `manifest.yaml`: проверка дерева читает файлы ровно с этим
# базовым именем, и фикстура, названная так, судилась бы как настоящий манифест.

apiVersion: iam/v1
module: vpc

resources:

  - name: network
    objectType: vpc_network
    parents:
      - {name: owner, type: project}
    producer: derived
    tiers:
      - {name: viewer, from: [owner]}
      - {name: editor, from: [viewer]}
    cascade:
      - {relation: v_get, from: owner}
    verbs:
      - {name: get,  class: get, subjects: [user, service_account], from: [viewer]}
      - {name: list, class: list, from: [viewer]}
