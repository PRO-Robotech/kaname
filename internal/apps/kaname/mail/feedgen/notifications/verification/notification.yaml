name: verification
class: security
recipient: address
ttl: 1h
limits:
  - {scope: recipient, window: 24h, max: 44}
attributes:
  code: {type: secret, presence: required}
  requested_at: {type: timestamp, presence: required}
subject:
  ru: "Код подтверждения адреса"
  en: "Address confirmation code"
