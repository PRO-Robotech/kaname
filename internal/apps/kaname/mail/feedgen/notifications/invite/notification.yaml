name: invite
class: security
recipient: address
ttl: 24h
limits:
  - {scope: recipient, window: 24h, max: 50}
attributes:
  token: {type: token, presence: required}
  account_id: {type: text, presence: required}
  expires_at: {type: timestamp, presence: required}
  inviter_address: {type: text, presence: optional}
subject:
  ru: "Приглашение в облако"
  en: "Invitation to the cloud"
