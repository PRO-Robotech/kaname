syntax = "proto3";

package kaname.cloud.iam.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "corelib/api/v1/operation.proto";
import "kaname/cloud/iam/v1/service_account.proto";
import "kaname/cloud/iam/v1/user.proto";
import "kaname/cloud/iam/v1/secret_options.proto";
import "corelib/operation/operation.proto";
import "corelib/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/kaname/pkg/api/kaname/cloud/iam/v1;iamv1";

// InternalIAMService — cluster-internal RPCs (port 9091).
//
// НЕ публикуется на external TLS listener. Регистрируется в api-gateway internal mux
// (внутренний listener) — нужен auth-interceptor api-gateway (звать LookupSubject
// из interceptor'а после валидации JWT).
//
// Вызывается из admin-tooling (grpcurl) и authz-interceptor api-gateway.
service InternalIAMService {
  // Резолв subject'а по одному из ключей (external_id / id / email).
  //
  // REST exposed ONLY on the cluster-internal listener;
  // api-gateway isInternalPath() gates `/iam/v1/internal/*` to internal mux
  // and authz-public-allowlist permits the <exempt> catalog entry.
  rpc LookupSubject (LookupSubjectRequest) returns (LookupSubjectResponse) {
    option (google.api.http) = {
      post: "/iam/v1/internal/iam:lookupSubject"
      body: "*"
    };
    option (corelib.authz.v1.permission) = "<exempt>";
    option (corelib.authz.v1.exempt_reason)  = "INTERNAL_LISTENER";
  }

  // TOMBSTONE. The false-assurance stub
  // `ListPermissions` RPC is REMOVED: it ignored its required subject/resource
  // fields and unconditionally returned the whole catalog, had zero real
  // consumers (internal listener only; the UI merely referenced it in a
  // comment), and operated on compiled `module.resource.verb` permission
  // strings — NOT rule-tokens. The honest grantable catalog is the public
  // `PermissionCatalogService.ListPermissionCatalog`; per-subject "who can do X"
  // is answered by `AccessBindingService.ExpandAccess`. The method name
  // `ListPermissions` is a tombstone — never re-add an RPC under that name.
  // Intentional breaking change (documented in buf.yaml).

  // Check — single-tuple authorization check.
  // Вердикт о паре «субъект — отношение — объект». Складывает его реляционная
  // форма в собственной базе iam: внешний движок отношений, поверх которого этот
  // метод стоял прежде, снят стадией S6 эпика #747.
  // Используется per-service authz-interceptor'ами kacho-vpc / kacho-compute /
  // kacho-loadbalancer / self (kaname) для проверки прав на write/read RPC.
  // Latency budget: ≤20ms p95. Сетевого перехода к соседу больше нет — вопрос
  // задаётся той же базе, что и остальные чтения службы.
  //
  // REST exposed ONLY on the cluster-internal listener.
  rpc Check (CheckRequest) returns (CheckResponse) {
    option (google.api.http) = {
      post: "/iam/v1/internal/iam:check"
      body: "*"
    };
    option (corelib.authz.v1.permission) = "<exempt>";
    option (corelib.authz.v1.exempt_reason)  = "INTERNAL_LISTENER";
  }

  // TOMBSTONE. `WriteCreatorTuple` — synchronous own-creator tuple write — is
  // REMOVED (#788). Its comment described callers in vpc / compute / nlb; all
  // five neighbours had long since moved to `RegisterResource` (nlb says so
  // verbatim: «Replaces the former direct WriteCreatorTuple»), leaving zero.
  // What remained was a door writing straight into the relation store, past
  // `kaname.fga_outbox` — a tuple the `relation_fact` projection (migration
  // 0098) would never see. Never re-add an RPC under that name: the live path
  // is RegisterResource / UnregisterResource, where the intent lands in the
  // journal first and the direct write is only an accelerator.
  // Intentional breaking change (proto/declared-breaks.yaml).

  // GetJWKSStatus снят с контракта. Он отчитывался о таблице ключей, которую
  // дропнула миграция 0065, и после этого мог отвечать только пустым набором —
  // навсегда. Ни один вызывающий его не звал: ни сервис, ни шлюз, ни консоль, ни
  // один чёрный ящик. Read-RPC, который ничего не решает и никому не нужен, не
  // «оставляют на будущее»: это обещание, за которое никто не отвечает.
  // Верификация подписи живёт в JWKS-проксировании iam, а не здесь.
  //
  // Резервировать нечего: protobuf не знает `reserved` ни для методов сервиса,
  // ни для имён сообщений верхнего уровня — только для номеров и имён ПОЛЕЙ.
  // Защита от повторного использования имени — гейт `buf breaking` и объявление
  // ломающего изменения в сообщении коммита.

  // admin force-logout of a user. Records a USER-LEVEL revoke-all cutoff in the
  // `user_token_revocations` table and the durable `audit_outbox` row for it in
  // ONE transaction, then ends the subject's login sessions at the identity
  // provider.
  //
  // The cutoff is the gate the refresh-hook enforces: it denies every token
  // whose session authenticated at or before that instant. Nothing is
  // enumerated per token, and no `session_revocations` row is written — a
  // per-jti row cannot name a token this call has never seen. Once the person
  // re-authenticates, auth_time advances past the cutoff and new sessions are
  // issued again: the refusal is protective, not a permanent lockout.
  //
  // Async by envelope: returns an Operation, persisted before the mutation and
  // completed after it, so the id handed back is always queryable.
  //
  // FEDERATED NOTIFICATION IS NOT PRODUCED — a recorded decision, not an
  // omission. This comment used to promise a queue row "so federated downstream
  // RPs get notified" and a fan-out that refreshed every edge cache within a
  // second. Both were retired with their migrations and have no producer left;
  // the reasons are written down in
  // docs/engineering/architecture/known-divergences.md. An integrator has
  // neither our history nor a way to re-measure, so the promise is withdrawn
  // here rather than left standing.
  rpc ForceLogout (ForceLogoutRequest) returns (corelib.operation.Operation) {
    option (corelib.api.v1.operation) = {
      metadata: "ForceLogoutMetadata"
      response: "ForceLogoutResult"
    };
    // Cluster-internal listener-protected; admin authz gate enforced at
    // the api-gateway internal mux layer (system_admin role required).
    option (corelib.authz.v1.permission) = "<exempt>";
    option (corelib.authz.v1.exempt_reason)  = "INTERNAL_LISTENER";
  }

  // PollSubjectChanges drains subject_change_outbox by ascending id cursor,
  // over the window `(since_id, settled]` — never "everything above the cursor".
  // Internal-only (cluster-internal listener) — drives api-gateway authz
  // decision-cache invalidation.
  //
  // UNAVAILABLE while the journal has no settled position yet (cold start): the
  // caller retries on its next tick. This is a state, not a failure — the
  // settled flag is monotone and never withdrawn once raised.
  //
  // OUT_OF_RANGE when `since_id` sits BELOW the journal floor — the rows between
  // them have been removed and will never be delivered. The refusal carries
  // `google.rpc.ErrorInfo` with reason `SUBJECT_CHANGE_POSITION_LOST`, domain
  // `iam.kaname.cloud` and metadata `earliest_resumable_position` (decimal), and
  // the caller keys on that token, never on the prose of the message.
  //
  // The domain is the PRODUCT naming itself, and this band says `kaname.cloud`
  // like every other band this service produces. It used to say
  // `iam.kacho.cloud` — not by decision, but because this producer lived in the
  // platform module, where the product's own declaration is out of reach. The
  // reason token did NOT change with it: a caller keys on the token, and moving
  // both at once would break that binding twice in one change.
  //
  // The two refusals advise OPPOSITE actions and must never be merged. UNAVAILABLE
  // says "ask again from the same position"; OUT_OF_RANGE says "that retry will
  // never succeed — flush your decision cache, close your open streams and resume
  // from the named position". A caller that read the second as the first would
  // retry from a lost position forever, and its cache would keep answering from
  // rights that are already gone — silently.
  //
  // Why an explicit refusal exists at all: the read window is
  // `id > since_id AND id <= settled`, and a removed row simply does not appear
  // in it. The cursor rolls past it on the last row read, so "no rows" becomes
  // indistinguishable from "rows were swept" — an unapplied revocation nobody
  // observes. Until this refusal existed, sweeping the journal was impossible
  // by construction, not by preference.
  rpc PollSubjectChanges (PollSubjectChangesRequest) returns (PollSubjectChangesResponse) {
    option (corelib.authz.v1.permission) = "<exempt>";
    option (corelib.authz.v1.exempt_reason)  = "INTERNAL_LISTENER";
  }

  // RegisterResource — регистрация события объекта (`CREATED`, `UPDATED`) от
  // модуля-владельца вида: набор кортежей события, метки и цепь предков под одним
  // поколением, атомарно (приёмка NTF-3, Р30 «Единица поколения — событие»).
  // Модули не пишут права напрямую — только через службу доступа.
  //
  // ИДЕМПОТЕНТНО (контракт): повтор события (то же поколение) → gRPC OK,
  // исход REJECTED_STALE без записи, НЕ AlreadyExists. От этого зависит
  // at-least-once повтор у дренажа владельца.
  //
  // Sync unary (как Check), НЕ async через Operation: ретрай и at-least-once
  // обеспечивает сам дренаж владельца.
  //
  // authz: `<exempt>` на уровне permission-каталога (как все Internal IAM RPC).
  // Least-priv энфорсится в IAM-handler через ReBAC: mTLS client-cert →
  // ServiceAccount → relation `fga_writer` на системном объекте
  // `cluster:cluster_root`, и правилом проксируемой записи на КАЖДЫЙ кортеж набора.
  // Нет relation → PermissionDenied. cluster-internal listener :9091 only — нет
  // google.api.http.
  rpc RegisterResource (RegisterResourceRequest) returns (RegisterResourceResponse) {
    option (corelib.authz.v1.permission) = "<exempt>";
    option (corelib.authz.v1.exempt_reason)  = "INTERNAL_LISTENER";
  }

  // UnregisterResource — снятие объекта (`DELETED`), адресованное объектом:
  // все кортежи на объекте, зеркало, рёбра предков и публикация уходят, голова
  // становится надгробием поколения снятия — одной транзакцией приёма.
  //
  // ИДЕМПОТЕНТНО (контракт): снятие поколением не новее головы → gRPC OK, исход
  // REJECTED_STALE без записи, НЕ NotFound — дренаж владельца ретраит безопасно.
  //
  // Sync unary, НЕ Operation. authz: `<exempt>` + ReBAC `fga_writer` @
  // `cluster:cluster_root` и владение типом объекта (см. RegisterResource).
  // cluster-internal :9091 only, нет google.api.http.
  rpc UnregisterResource (UnregisterResourceRequest) returns (UnregisterResourceResponse) {
    option (corelib.authz.v1.permission) = "<exempt>";
    option (corelib.authz.v1.exempt_reason)  = "INTERNAL_LISTENER";
  }

  // SetPublicReadPublication — намерение владельца о публикации объекта для
  // анонимного чтения (`user:* v_get`): свой метод и своя версия (приёмка NTF-3,
  // Р30 «Публикация для анонимного чтения»; сценарий NTF3-186).
  //
  // Публикация — не событие объекта и поколения объекта не несёт. Её порядок —
  // `publication_version`: намерение применяется, только если строго новее
  // хранимой версии публикации объекта. Ложится только на ТЕКУЩЕЕ воплощение
  // объекта (`object_generation`): при голове-надгробии — если строго новее
  // надгробия; при живой голове — если не старше поколения регистрации,
  // начавшей воплощение; головы нет — применяется. Иначе исход REJECTED_STALE
  // без записи; ответ — успех и на устаревшем намерении.
  //
  // Круг вызывающих — модуль-владелец типа, допускающего публикацию (сегодня
  // registry): дверь та же, что у `RegisterResource` (mTLS client-cert →
  // ServiceAccount → `fga_writer` на `cluster:cluster_root`), плюс владение типом
  // объекта; прочие — PERMISSION_DENIED с `ErrorInfo{reason: AUTHZ_DENIED}`.
  // cluster-internal listener :9091 only — нет google.api.http (ban #6).
  rpc SetPublicReadPublication (SetPublicReadPublicationRequest) returns (SetPublicReadPublicationResponse) {
    option (corelib.authz.v1.permission) = "<exempt>";
    option (corelib.authz.v1.exempt_reason)  = "INTERNAL_LISTENER";
  }

  // CurrentAuthzRevision — токен версии прав службы доступа (приёмка NTF-3, Р30
  // «Производитель токена»; сценарий NTF3-179).
  //
  // Ответ — текстовая форма ПОЛНОГО снимка транзакций базы службы доступа на
  // момент вызова (`pg_snapshot`), а не его нижняя граница: транзакция, шедшая в
  // момент вызова, в снимке не видна, даже если она старше уже завершённых.
  // Модуль-владелец вида зовёт метод ДО открытия транзакции записи, в которой
  // пишется строка журнала, и кладёт значение в эту транзакцию как `R_E` события.
  // Вопрос об аудитории события отбрасывает каждую исходную строку права, чья
  // версия `authz_rev` в этом снимке не видна: право, выданное либо изменённое
  // после снятия токена, адресата события не даёт ни при каком порядке коммитов.
  //
  // Токен не кэшируется и между транзакциями не переиспользуется: один вызов на
  // транзакцию записи. Отказ пути токена у вызывающего — его мутация fail-closed.
  //
  // Круг вызывающих — тот же, что у `RegisterResource`: модуль-владелец вида
  // (mTLS client-cert → ServiceAccount → `fga_writer` на `cluster:cluster_root`);
  // прочие — PERMISSION_DENIED, в том числе `notify`: токен он берёт из строки
  // события. cluster-internal listener :9091 only — нет google.api.http (ban #6).
  rpc CurrentAuthzRevision (CurrentAuthzRevisionRequest) returns (CurrentAuthzRevisionResponse) {
    option (corelib.authz.v1.permission) = "<exempt>";
    option (corelib.authz.v1.exempt_reason)  = "INTERNAL_LISTENER";
  }

  // GetRoleCompiled — Internal two-projection read (redesign-2026 F5): returns a
  // Role's COMPILED permission set (`module.resource.resourceName.verb` 4-segment
  // form) that backs FGA emission. This authz-topology projection is Internal-ONLY
  // (:9091) — the public RoleService.Get/List never carry compiled `permissions`
  // (they expose only authored `rules[]`). A label-only role compiles to an empty
  // set (all rules ARM_LABELS are not compiled). cluster-internal listener only —
  // no google.api.http; admin-UI authz gating happens at the internal mux layer.
  // ResolveBasicCredential — АВТОРИТЕТ О ПРЕДЪЯВЛЕННОМ БАЗОВОМ СЕКРЕТЕ
  // (задача #1142, приёмка BAT-1 §5.3, §6).
  //
  // Край зовёт этот глагол на промахе своего кэша вердикта и получает ответ на
  // ОДИН вопрос: годно ли предъявленное СЕЙЧАС и чей это принципал.
  //
  // ОТЗЫВ ДОХОДИТ ДО ПРЕДЪЯВЛЕНИЯ КОНСТРУКЦИЕЙ, А НЕ ВТОРЫМ МЕХАНИЗМОМ. Отзыв
  // есть СНЯТИЕ строки; резолв ищет строку по первичному ключу, и предикат его
  // единственного оператора включает существование строки, вид, непросроченность
  // и активность владельца. Нет строки — нет удостоверения. Поэтому под отзыв
  // попадают и поводы, о которых глагол отзыва не знает: снятие владельца,
  // снятие участия, перевод владельца в неактивное состояние — повод привязан к
  // САМОМУ поводу, а не к перечню обязанных писать.
  //
  // ОТКАЗ ЕДИНЫЙ. Неизвестный идентификатор, неверный секрет, истёкший срок,
  // отозванное удостоверение, неактивный владелец — ОДИН И ТОТ ЖЕ код и ОДИН И
  // ТОТ ЖЕ текст. Различимый текст есть оракул: по нему отличают «нет такого» от
  // «есть, но не ваш». Различимость живёт ВНУТРЬ — в счётчиках по причинам.
  //
  // REST exposed ONLY on the cluster-internal listener.
  rpc ResolveBasicCredential (ResolveBasicCredentialRequest) returns (ResolveBasicCredentialResponse) {
    option (google.api.http) = {
      post: "/iam/v1/internal/iam:resolveBasicCredential"
      body: "*"
    };
    option (corelib.authz.v1.permission)    = "<exempt>";
    option (corelib.authz.v1.exempt_reason) = "INTERNAL_LISTENER";
  }

  rpc GetRoleCompiled (GetRoleCompiledRequest) returns (GetRoleCompiledResponse) {
    option (corelib.authz.v1.permission) = "<exempt>";
    option (corelib.authz.v1.exempt_reason)  = "INTERNAL_LISTENER";
  }

  // CheckBasicCredentialLive — ЖИВО ЛИ УДОСТОВЕРЕНИЕ, СПРОШЕННОЕ ПО ЕГО
  // ИДЕНТИФИКАТОРУ, БЕЗ ПРЕДЪЯВЛЕНИЯ СЕКРЕТА (задача #1450).
  //
  // ЗАЧЕМ ВТОРОЙ ВОПРОС, ЕСЛИ РЯДОМ ЕСТЬ `ResolveBasicCredential`. Тот отвечает
  // ПРЕДЪЯВИТЕЛЮ и потому требует самой предъявленной строки. Спрашивающий с
  // ОТКРЫТОГО соединения предъявителем не является: секрет он видел однажды, при
  // открытии, и держать его живым весь срок соединения значило бы завести
  // поверхность хранения ради контроля — то есть платить за отзыв тем самым, что
  // отзыв защищает.
  //
  // Поэтому вопрос задаётся по идентификатору СТРОКИ удостоверения. Предикат
  // живости у него ТОТ ЖЕ, что у резолва: существование строки, вид `SECRET`,
  // непросроченность и активность владельца. Разойтись они не могут — оператор
  // один, и сверка хеша в нём не участвует by construction.
  //
  // ОТВЕТ — ОТКАЗ, А НЕ ПОЛЕ. Живое удостоверение даёт `OK`, неживое —
  // `UNAUTHENTICATED` с тем же единым текстом, что у резолва; «спросить не
  // удалось» — `UNAVAILABLE`. Поле-признак означало бы, что вызывающий вправе его
  // не прочитать, и тогда контроль присутствует, провязан и не отказывает ни разу.
  // Ровно тот довод, что записан у `ResolveBasicCredentialResponse`.
  //
  // ОТКАЗ ЕДИНЫЙ И ЗДЕСЬ. Неизвестный идентификатор, истёкший срок, отозванное
  // удостоверение, неактивный владелец — один код и один текст: различимый
  // отличал бы «нет такого» от «есть, но не действует».
  //
  // БЕЗ `google.api.http` НАМЕРЕННО — как у `GetRoleCompiled`. Вызывающий ходит
  // gRPC; дружелюбного пути под этот вопрос не заводится, чтобы его нельзя было
  // выставить наружу опечаткой в таблице маршрутов края.
  rpc CheckBasicCredentialLive (CheckBasicCredentialLiveRequest) returns (CheckBasicCredentialLiveResponse) {
    option (corelib.authz.v1.permission)    = "<exempt>";
    option (corelib.authz.v1.exempt_reason) = "INTERNAL_LISTENER";
  }
}

message LookupSubjectRequest {
  // Один из ключей идентификации subject'а. Exactly one должен быть выставлен.
  oneof key {
    // Субъект личности (`sub` claim).
    string external_id = 1;
    // kaname internal id (`usr-...` или `sva-...`).
    string id = 2;
    // Case-insensitive email lookup.
    string email = 3;
  }
}

message LookupSubjectResponse {
  // Возвращенный subject — User или ServiceAccount.
  oneof subject {
    User           user            = 1;
    ServiceAccount service_account = 2;
  }
}

// TOMBSTONE: `ListPermissionsRequest` and
// `ListPermissionsResponse` were removed together with the false-assurance
// `ListPermissions` stub RPC. Never re-add messages under these names.

// CheckRequest — single-tuple authorization check.
message CheckRequest {
  // FGA-style subject string. Допустимые форматы:
  //   "user:<usr…>"
  //   "service_account:<sva…>"
  //   "group:<grp…>#member"
  string subject_id = 1;

  // FGA-relation: "viewer" | "editor" | "admin" | "use" | "member" | etc.
  // Допустимые значения зависят от authorization-model.
  string relation = 2;

  // FGA-object string. Формат "<type>:<id>", например:
  //   "project:<prj…>"
  //   "vpc_network:<net…>"
  //   "account:<acc…>"
  string object = 3;

  // Trace-id для correlation в логах (optional).
  string trace_id = 4;

  // consistency — how fresh the caller needs the answer to be.
  //
  // THE STRONGER GUARANTEE IS NOW GIVEN UNCONDITIONALLY, and that is a statement
  // about the source, not a field nobody reads. The preference used to be
  // forwarded to an external relations engine that answered from its own replicas
  // and read caches, so a default read could serve a stale negative for seconds.
  // That engine was retired: the verdict is computed from the service's own
  // primary database, in which a caller's committed write is visible to the very
  // next read by construction.
  //
  // The field stays on the contract because it states the caller's REQUIREMENT,
  // not the mechanism that meets it. Should a read path over a lagging replica
  // ever be introduced, the requirement becomes discriminating again — and
  // discriminating on it is the job of whoever introduces that path.
  Consistency consistency = 5;

  // Consistency — read-freshness preference.
  enum Consistency {
    // Unset — no explicit requirement. Answered from the primary all the same.
    CONSISTENCY_UNSPECIFIED = 0;
    // Latency-first. No read path currently trades freshness for latency, so the
    // answer is identical to the one below; the value keeps its meaning for a
    // caller that is willing to accept a lagging read if one ever exists.
    MINIMIZE_LATENCY = 1;
    // The answer must not lag the caller's own committed write. Held by
    // construction: the verdict reads the primary.
    HIGHER_CONSISTENCY = 2;
  }
}

// CheckResponse — результат authorization check.
message CheckResponse {
  // true — subject имеет relation на object'е (либо direct, либо через computed cascade).
  bool allowed = 1;
  // Human-readable reason on deny (для логов; не для UI).
  string reason = 2;
}

// TOMBSTONE: `WriteCreatorTupleRequest` and `WriteCreatorTupleResponse` were
// removed together with the `WriteCreatorTuple` RPC (#788). Never re-add
// messages under these names.
// RegisterResourceRequest — регистрация СОБЫТИЯ объекта (`CREATED`, `UPDATED`):
// набор кортежей события на объекте `object`, состояние объекта (метки, цепь
// предков) и поколение события (приёмка NTF-3, Р30 «Единица поколения — событие»).
//
// Единица поколения — событие, а не кортеж: одно событие — один вызов с одним
// поколением, и всё, что событие несёт, применяется атомарно под ним — либо
// целиком, либо исход REJECTED_STALE без единой записи. Применение по одному
// кортежу запрещено: второй кортеж того же события пришёл бы с тем же
// поколением, не новее головы, и пропал бы.
message RegisterResourceRequest {
  // Поля одиночного кортежа сняты: кортеж события выразим одним способом —
  // элементом набора `tuples`. Поле версии владельца снято полностью: порядок
  // объекта — `generation`, порядок публикации — метод `SetPublicReadPublication`.
  reserved 1, 2, 8;
  reserved "subject_id", "relation", "source_version";

  // Объект решения. Формат "<type>:<id>" словарём МОДЕЛИ прав
  // (НЕ permission-каталог), напр. "vpc_network:<net…>",
  // "compute_instance:<...>".
  string object = 3;

  // Trace-id для correlation в логах (модуль ↔ IAM). Optional.
  string trace_id = 4;

  // Метки объекта на момент события. Output-only mirror в
  // `kaname.resource_mirror`; source of truth = owner-сервис. Питает
  // `bySelector` (matchLabels) и containment. Заменяют прежние как состояние.
  // IAM делает минимальную sanity-валидацию, не дублируя owner-pattern.
  map<string, string> labels = 5;

  // Parent project id ресурса (`prj…`), если ресурс project-scoped.
  // Кладется в mirror ради containment (объект «под scope») SAME-DB, без ребра
  // iam→owner. Пусто для не-project-scoped объектов.
  string parent_project_id = 6;

  // Parent account id ресурса (`acc…`), если применимо. Mirror /
  // containment на account-scope.
  string parent_account_id = 7;

  // Цепь родительства регистрируемого объекта, от БЛИЖАЙШЕГО предка к дальнему.
  //
  // Каждый элемент — объект в форме `"<type>:<id>"`, той же, что `object` выше:
  //   ["registry_registry:reg…", "project:prj…", "account:acc…"]
  //
  // ЗАЧЕМ ОТДЕЛЬНОЕ ПОЛЕ ПРИ ДВУХ УЖЕ СУЩЕСТВУЮЩИХ. `parent_project_id` и
  // `parent_account_id` несут ровно двух предков и ровно этих. Модель прав
  // требует цепи ПРОИЗВОЛЬНОЙ формы: репозиторий → реестр → проект → аккаунт →
  // кластер — глубина четыре. Объект, чей предок не проект и не аккаунт, сегодня
  // регистрируется без предка вовсе, а объект без предка МОЛЧА выпадает из
  // области выдачи и из каскада: вопрос о нём задаётся, ответ «нет», и это
  // неотличимо от честного отказа.
  //
  // ПУСТАЯ ЦЕПЬ — ЭТО УТВЕРЖДЕНИЕ «ПРЕДКОВ НЕТ», А НЕ УМОЛЧАНИЕ. Цепь есть
  // СОСТОЯНИЕ, и применённая регистрация заменяет набор рёбер объекта целиком,
  // иначе право пережило бы перенос объекта в другую область. Следствие,
  // названное прямо: регистрация без цепи не «ничего не меняет», а СТИРАЕТ уже
  // записанных предков. Вывод из двух полей области делает ВЛАДЕЛЕЦ на своей
  // стороне (pkg/ownerregister.ParentChain) — тот, кто знает, глубже ли его
  // иерархия; iam чужой формы не додумывает. Свойство «каждый потребитель
  // называет цепь» держится гейтом по дереву (internal/repohygiene), а не этим
  // абзацем.
  repeated string parent_chain = 9;

  // Поколение события объекта у владельца: целое, строго растущее на каждое
  // событие объекта, — то же `g_E`, что владелец ставит в строку `resource-event`
  // своего журнала и берёт из счётчика объекта своей базы (приёмка NTF-3, Р30
  // «Приём поколения — CAS», «Производитель поколения — счётчик объекта модуля»).
  //
  // Обязательно: `0` — `INVALID_ARGUMENT` `generation: required`; приёма без
  // поколения нет. Применяется, только если строго новее головы объекта в
  // службе доступа (`kaname.object_head`, включая надгробие снятия); иначе исход
  // `REJECTED_STALE` — зеркало, рёбра предков, голова и кортежи не меняются, а
  // вызов отвечает успехом (контракт прокси идемпотентен: отказ породил бы вечный
  // повтор у дренажа владельца). Регистрация, применённая при отсутствии головы
  // либо поверх надгробия, начинает ВОПЛОЩЕНИЕ объекта, и её поколение служба
  // доступа хранит при голове как границу воплощения.
  int64 generation = 10;

  // Набор кортежей события на объекте `object`: структурные (субъект — предок
  // объекта) и владения (субъект — `user`, `service_account`, `group#member`).
  //
  // Непустой (`INVALID_ARGUMENT` `tuples: required`); пара в наборе одна
  // (`tuples: duplicate <subject_id>#<relation>`); подстановочного субъекта в
  // наборе нет (`tuples: wildcard subject is published by
  // SetPublicReadPublication`) — публикация для анонимного чтения идёт своим
  // методом. Применённая регистрация пишет кортежи набора, которых ещё нет;
  // кортеж, отсутствующий в наборе следующего поколения, регистрацией не
  // снимается — его снимает только снятие объекта.
  repeated RegisteredTuple tuples = 11;
}

// RegisteredTuple — кортеж набора события: субъект и отношение на объекте
// запроса регистрации.
message RegisteredTuple {
  // Субъект. Формат "<type>:<id>" либо "<type>:<id>#<relation>", напр.
  //   "user:<usr…>"
  //   "service_account:<sva…>"
  //   "registry_registry:<reg…>"
  string subject_id = 1;

  // Отношение субъекта к объекту ("parent", "project", "owner").
  string relation = 2;
}

// RegisterResourceResponse — пусто; success implicit (gRPC OK). Идемпотентность
// контракта (повтор → OK) опирается на пустой ответ без уникального id.
message RegisterResourceResponse {}

// UnregisterResourceRequest — снятие объекта (`DELETED`), адресованное объектом:
// оно снимает ВСЕ кортежи на объекте, зеркало, рёбра предков и публикацию
// объекта и кладёт надгробие одной транзакцией приёма (приёмка NTF-3, Р30
// «Единица поколения — событие»).
message UnregisterResourceRequest {
  // Поля кортежа и состояния объекта сняты: снятие адресуется объектом и их не
  // читает, а принять и проигнорировать запрещено. Поле версии владельца снято
  // полностью: публикация уходит вместе с объектом без своей версии.
  reserved 1, 2, 5, 6, 7, 8;
  reserved "subject_id", "relation", "labels", "parent_project_id", "parent_account_id", "source_version";

  // FGA-object string (см. RegisterResourceRequest.object).
  string object = 3;

  // Trace-id для correlation в логах. Optional.
  string trace_id = 4;

  // Поколение снятия объекта (см. RegisterResourceRequest.generation).
  // Обязательно: `0` — `INVALID_ARGUMENT` `generation: required`. Применённое
  // снятие оставляет НАДГРОБИЕ — голову объекта с этим поколением: регистрация
  // поколения не новее надгробия зеркала не восстанавливает (`REJECTED_STALE`).
  int64 generation = 10;
}

// UnregisterResourceResponse — пусто; success implicit (gRPC OK). Снятие
// устаревшим поколением → OK (контракт идемпотентности).
message UnregisterResourceResponse {}

// SetPublicReadPublicationRequest — намерение владельца о публикации объекта
// для анонимного чтения (кортеж `user:* v_get`).
message SetPublicReadPublicationRequest {
  // Объект публикации. Формат "<type>:<id>" словарём МОДЕЛИ прав; тип обязан
  // допускать публикацию (`INVALID_ARGUMENT` `object: type <type> does not admit
  // public read`).
  string object = 1;

  // Открывает ли намерение объект для анонимного чтения.
  bool published = 2;

  // Версия владельца намерения публикации — штамп строки намерения модуля,
  // поставленный транзакцией записи. Обязательна (`INVALID_ARGUMENT`
  // `publication_version: required`). Применяется, только если строго новее
  // хранимой версии публикации объекта (kaname#107).
  google.protobuf.Timestamp publication_version = 3;

  // Trace-id для correlation в логах. Optional.
  string trace_id = 4;

  // Поколение объекта по счётчику модуля в транзакции намерения публикации —
  // признак ВОПЛОЩЕНИЯ объекта, а не порядок публикации. Обязательно
  // (`INVALID_ARGUMENT` `object_generation: required`).
  int64 object_generation = 5;
}

// SetPublicReadPublicationResponse — пусто; success implicit (gRPC OK), в том
// числе на устаревшем намерении (контракт идемпотентен).
message SetPublicReadPublicationResponse {}

// ForceLogoutRequest — admin force-logout payload.
message ForceLogoutRequest {
  // User to log out from every active session. Required.
  string user_id = 1;

  // Free-form reason recorded on the cutoff row and in the `audit_outbox` row
  // committed with it (default "admin-force-logout"). No per-token row carries
  // it — this call writes none (see the rpc comment).
  string reason = 2;

  // ID of the admin user (or service account) triggering the force-logout.
  // Captured for audit; the authz check itself is performed at the gateway
  // (admin must hold `iam.users.forceLogout` permission on the user's account).
  string actor_id = 3;
}

// ForceLogoutMetadata — Operation.metadata payload.
message ForceLogoutMetadata {
  // User that was force-logged-out.
  string user_id = 1;
}

// ForceLogoutResult — Operation.response payload.
message ForceLogoutResult {
  // Number of revocation records this call committed — exactly one, the
  // user-level cutoff.
  //
  // IT IS NOT A COUNT OF TOKENS, and saying so is the point of this comment.
  // The cutoff denies every token whose session predates it; how many that is
  // cannot be answered here, because the call never enumerates them. The field
  // used to be documented as "session_revocations rows newly inserted", which
  // described a per-jti implementation this RPC no longer has: a reader who
  // believed it would treat 1 as "one token was logged out" and conclude the
  // rest are still live.
  int32 revoked_count = 1;
}

// PollSubjectChangesRequest — cursor-based drain of subject_change_outbox.
message PollSubjectChangesRequest {
  // since_id — return rows with id > since_id. 0 on first call.
  //
  // Zero means "I hold no position", and it is never refused with
  // OUT_OF_RANGE: a caller cannot lose a position it does not have, and the
  // caller sending zero discards the page and adopts `head_id`. Refusing it
  // would send a fresh replica to replay the retained tail instead of jumping
  // to the head — a worse outcome for no safety gain.
  int64 since_id = 1;
  // limit — max rows; server clamps to [1, 1000], default 256.
  int32 limit = 2;
}

// SubjectChange — one row from subject_change_outbox.
message SubjectChange {
  int64  id         = 1;
  string subject_id = 2;
  string op         = 3; // binding_upsert | binding_delete | group_member_change

  // subject_type — тип субъекта в словаре модели прав: `user` |
  // `service_account` | `group`.
  //
  // ПОЧЕМУ ЭТО ПОЛЕ ЕСТЬ. `subject_id` — голый идентификатор (`usrXXXX`), а
  // субъектом модели он становится только в паре с типом (`user:usrXXXX`).
  // Пару обязан собрать ЧИТАЮЩИЙ, и собрать её ему больше нечем: перепрос
  // `payload` строки не возвращает, поэтому без этого поля вызывающий назвать
  // субъекта не может. Пока единственным потребителем перепроса был сплошной
  // сброс кэша, это не было видно: сброс имени не спрашивает. Как только по
  // этому же чтению понадобилось закрыть открытый поток НАЗВАННОГО субъекта
  // (kacho#1022), полоса оказалась неисполнимой — не по ошибке вызывающего, а
  // потому, что контракт не нёс половины имени.
  //
  // Прежде пару собирал ТОЛЧОК из iam в край, потому что читал `payload`
  // напрямую. Толчок снят вместе со своим пакетом контракта (задача #1024):
  // соединение открывает потребитель, и край читает этот журнал курсором сам.
  // Поле осталось потому, что предмет его пережил механизм — имя субъекта
  // нужно ЧИТАЮЩЕМУ, кем бы он ни был.
  //
  // Пусто у строк, записанных до того, как производители начали проставлять тип.
  // Вызывающий обязан считать такую строку НЕИМЕНОВАННОЙ и не собирать субъекта
  // из префикса идентификатора: вывод типа из написания уже давал совпадение с
  // тем, чего продукт не производит.
  string subject_type = 4;
}

// PollSubjectChangesResponse — result of PollSubjectChanges.
message PollSubjectChangesResponse {
  repeated SubjectChange changes = 1;
  // head_id — the position the caller may adopt as its cursor: the SETTLED
  // boundary of the journal, narrowed to the last delivered row when the page
  // was cut by `limit`. Lets a freshly started gateway initialise its cursor
  // without replaying history.
  //
  // It is NOT `MAX(id)`. A journal number is issued by the counter on INSERT and
  // becomes visible on COMMIT, so a caller that adopted the largest visible
  // number would jump over a writer still in flight, and that row would never
  // come back — re-reading is strictly "greater than the cursor". The same holds
  // for a full page: beyond its last row the window still holds rows nobody read.
  //
  // The guarantee and its price are stated once:
  // docs/architecture/journal-position-settled-watermark.md.
  int64 head_id = 2;
}

// GetRoleCompiledRequest — the role whose compiled permissions to read (F5).
// CurrentAuthzRevisionRequest — полей нет: снимок берётся на момент вызова.
message CurrentAuthzRevisionRequest {}

// CurrentAuthzRevisionResponse — токен версии прав.
message CurrentAuthzRevisionResponse {
  // authz_rev — текстовая форма `pg_snapshot` базы службы доступа на момент
  // вызова (`xmin:xmax:xip,…`). Вызывающий хранит её как есть и не разбирает:
  // сравнивает с версией строки права сама служба доступа.
  string authz_rev = 1;
}

message GetRoleCompiledRequest {
  // ID of the Role.
  string role_id = 1;
}

// GetRoleCompiledResponse — the Internal-only compiled permission projection (F5).
message GetRoleCompiledResponse {
  // ID of the Role.
  string role_id = 1;

  // Compiled permission set (`module.resource.resourceName.verb` 4-segment form)
  // backing FGA emission. Empty for a label-only role (all rules ARM_LABELS).
  repeated string permissions = 2;
}

// ResolveBasicCredentialRequest — предъявленная строка целиком.
message ResolveBasicCredentialRequest {
  // Строка как её предъявил клиент, без разбора вызывающим: разбор и сверка
  // контрольной суммы живут в ОДНОМ объявленном месте, и край зовёт его же.
  //
  // Помечена носителем секрета: значение не имеет права осесть ни в строке
  // операции, ни в журнале, ни в ленте.
  string presented = 1 [(kaname.cloud.iam.v1.secret_bearing) = true];
}

// ResolveBasicCredentialResponse — вердикт о годном удостоверении.
//
// Отрицательного варианта у сообщения НЕТ намеренно: негодное удостоверение —
// это ОТКАЗ RPC (UNAUTHENTICATED), а не успешный ответ с полем «не годится».
// Поле-признак означало бы, что вызывающий вправе его не прочитать, и тогда
// проверка присутствует, провязана и не отказывает ни разу.
message ResolveBasicCredentialResponse {
  // "user" | "service_account".
  string principal_type = 1;
  // Идентификатор принципала (`usr…` / `sva…`).
  string principal_id = 2;
  // Отображаемое имя принципала. Пусто допустимо.
  string display_name = 3;
  // Идентификатор СТРОКИ удостоверения — им адресуется отзыв. Второго имени у
  // удостоверения нет.
  string credential_id = 4;
  // Срок действия удостоверения. Заполнен ВСЕГДА: бессрочного секрета не бывает.
  google.protobuf.Timestamp expires_at = 5;
}

// CheckBasicCredentialLiveRequest — идентификатор СТРОКИ удостоверения.
message CheckBasicCredentialLiveRequest {
  // Идентификатор удостоверения — тот самый, который резолв вернул в
  // `ResolveBasicCredentialResponse.credential_id`. Секрет сюда не кладётся и
  // класться не может: весь смысл вопроса в том, что спрашивающий секрета не
  // хранит. Поэтому поле НЕ помечено носителем секрета — и это утверждение о
  // значении, а не о форме.
  string credential_id = 1;
}

// CheckBasicCredentialLiveResponse — ПУСТО, и это решение, а не заготовка.
//
// Вопрос один и ответ на него бинарен: `OK` означает «живо», отказ — всё
// остальное. Любое поле здесь было бы сведениями, добытыми ПО ИДЕНТИФИКАТОРУ,
// без предъявления секрета, — то есть оракулом: спрашивающий узнавал бы про
// чужое удостоверение больше, чем знал до вопроса.
//
// Спрашивающему сверх этого ничего не нужно by construction: чей это поток, он
// знает — он его и открыл.
message CheckBasicCredentialLiveResponse {}
