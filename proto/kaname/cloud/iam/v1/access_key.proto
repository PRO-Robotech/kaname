syntax = "proto3";

package kaname.cloud.iam.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/PRO-Robotech/kaname/pkg/api/kaname/cloud/iam/v1;iamv1";

// AccessKey — ключ доступа человека (WebAuthn), как его видит владелец в
// перечне (iam Ф7, PRO-Robotech/kacho#1273; приёмка
// `docs/engineering/acceptance/access-keys-are-ours.md`, Р1, Р10).
//
// Ключ — ЭКЗЕМПЛЯР способа входа, а не способ: у человека их несколько, и
// строка способа вида `webauthn` не заводится (Р1). Наружу ключ адресуется
// ТОЛЬКО своим `id` — идентификатор удостоверения WebAuthn, открытый ключ и
// счётчик подписи в контракт не выходят: это байты нормы, а не адрес (Р10).
//
// Полей аттестации нет by construction (Р4): церемония запрашивает «нет», и
// хранить содержимое аттестации нечем. Признаков резервного копирования и
// проверки пользователя нет тоже: различитель ступени берётся из флагов
// КАЖДОГО утверждения, а не из памяти о регистрации (Ф11 Р3, Р1).
message AccessKey {
  // Платформенный идентификатор ключа дефисной формы `ak-<17>`; неизменяем на
  // всю жизнь ключа (ban #15). Им ключ снимается и им назван в событии аудита.
  string id = 1;

  // Человек, которому принадлежит ключ.
  string user_id = 2;

  // Имя одной формы дерева (DNS label RFC 1123); пустое при заведении
  // замещается `id`. Неизменяемо: глагола правки у ключа нет.
  string name = 3;

  // Свободный текст до 256 знаков — «Мой ноутбук». У перенесённого ключа —
  // метка источника, усечённая до предела.
  string description = 4;

  // Момент заведения: церемонией либо переносом.
  google.protobuf.Timestamp created_at = 5;

  // Момент последнего успешного предъявления; не заполнен до первого.
  google.protobuf.Timestamp last_used_at = 6;
}
