syntax = "proto3";

package kaname.cloud.iam.v1;

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "corelib/api/v1/operation.proto";
import "corelib/operation/operation.proto";
import "corelib/authz/v1/authz_options.proto";
import "kaname/cloud/iam/v1/resource_metadata.proto";

option go_package = "github.com/PRO-Robotech/kaname/pkg/api/kaname/cloud/iam/v1;iamv1";

// ResourceMetadataService — публичное чтение меток зеркала ресурса.
// Право v_get на конкретный объект проверяет обработчик в том же снимке,
// из которого читает метки. Субъект берётся из контекста аутентификации.
service ResourceMetadataService {
  // Возвращает обе карты меток доступного вызывающему ресурса.
  rpc Get (GetResourceMetadataRequest) returns (ResourceMetadata) {
    option (google.api.http) = { get: "/iam/v1/resourceMetadata/{resource_type}" };
    option (corelib.authz.v1.permission)       = "<exempt>";
    option (corelib.authz.v1.exempt_reason)    = "HANDLER_DECIDES";
    option (corelib.authz.v1.required_acr_min) = "1";
  }
  // Предварительный контракт: доступ решает будущий подготовленный сценарий.
  rpc Update (UpdateResourceMetadataRequest) returns (corelib.operation.Operation) {
    option (google.api.http) = { patch: "/iam/v1/resourceMetadata/{resource_type}" body: "patch" };
    option (corelib.api.v1.operation) = {
      metadata: "UpdateResourceMetadataMetadata"
      response: "ResourceMetadata"
    };
    option (corelib.authz.v1.permission)       = "<exempt>";
    option (corelib.authz.v1.exempt_reason)    = "HANDLER_DECIDES";
    option (corelib.authz.v1.required_acr_min) = "1";
  }
}

message GetResourceMetadataRequest {
  // Тип ресурса из каталога с точками, например registry.registries.
  string resource_type = 1;

  // Идентификатор ресурса в службе-владельце.
  string resource_id = 2;
}

// Координата находится вне тела PATCH: resource_id передаётся query-параметром.
message UpdateResourceMetadataRequest {
  string resource_type = 1;
  string resource_id = 2;
  ResourceMetadataPatch patch = 3;
}

// Маска управляет заменой карт; явная маска с пустой картой означает очистку.
message ResourceMetadataPatch {
  google.protobuf.FieldMask update_mask = 1;
  map<string, string> labels = 2;
  map<string, string> access_labels = 3;
}

message UpdateResourceMetadataMetadata {
  string resource_type = 1;
  string resource_id = 2;
}
