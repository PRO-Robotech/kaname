  string page_token = 3;

  // Optional: include revoked bindings (status='REVOKED'). Default false
  // (only PENDING/ACTIVE are returned).
  bool include_revoked = 4;
}

// ExpandAccessRequest asks "who can perform <relation> on <object_type>:<object_id>".
// `object_type` is a closed `<module>.<resource>` key or an FGA
// object type (e.g. "compute.instance", "iam_access_binding").
//
// `relation` is NOT any FGA relation and NOT a free verb: принимается ВЫВОДИМОЕ
// множество — объединение наборов `v_*` всех типов каталога ∪ ярусные
// (viewer/editor/admin) ∪ членство (member). Внутренняя машинерия модели
// (переносчики охвата, подтягивающие резолверы, платформенные роли) отвергается:
// пересылка произвольной строки дала бы возможность прощупывать внутренний граф
// отношений. Множество ВЫВОДИТСЯ из наборов типов, а не перечисляется, поэтому
// новое отношение у типа появляется здесь само и отставать не может.
//
// The server resolves the userset (direct grants + group memberships) into
// concrete principals.
message ExpandAccessRequest {
  // Object type to expand access on — closed `<module>.<resource>` key or FGA
  // object type. Unknown type → INVALID_ARGUMENT.
  string object_type = 1;

  // Object id to expand access on. Format-validated only (soft-ref).
  string object_id = 2;

  // Relation to expand (e.g. "v_delete", "viewer"). Принимается выводимое
  // множество (см. описание сообщения выше); всё остальное — INVALID_ARGUMENT.
  string relation = 3;

  // The maximum number of concrete principals to return. Default 1000, max
  // 10000 (fan-out limit). Truncation sets `truncated=true`.
  int64 max_results = 4;
}

// Principal is a concrete grantee resolved by ExpandAccess — a USER or
// SERVICE_ACCOUNT (never a GROUP; groups are expanded to their members).
message Principal {
  // Type of the principal (USER / SERVICE_ACCOUNT). Reuses SubjectType.
  SubjectType type = 1;

  // Principal id (`usr…` | `sva…`).
  string id = 2;
}

message ExpandAccessResponse {
  // Concrete principals who hold <relation> on the object (group-expanded).
  // Deduplicated; a principal granted both directly and via a group appears
  // once (no double-grant anomaly).
  repeated Principal principals = 1;

  // True when `principals` is a LOWER BOUND rather than the whole grantee set.
  // Two reasons, and neither is continuable: the grant store cut its own
  // enumeration at its server-side ceiling — it offers no continuation token, so
  // the rest is unreachable — or the resolved set exceeded `max_results` and was
  // trimmed. Either way: narrow the query. Raising `max_results` does not lift
  // the store's ceiling.
  bool truncated = 2;
}
