syntax = "proto3";

package kaname.cloud.iam.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/PRO-Robotech/kaname/pkg/api/kaname/cloud/iam/v1;iamv1";

// Membership — принадлежность человека аккаунту, ОТДЕЛЬНАЯ связь.
//
// Человек в Kachō — глобальная личность (`iam_user`), и состоять он может в
// нескольких аккаунтах сразу. Принадлежность поэтому не поле человека, а
// собственная сущность: у неё своя идентичность, своё состояние и свой след
// приглашения.
//
// Глаголов у ресурса ДВА рода, и оба названы, чтобы отсутствие третьего
// читалось как решение: ЗАВОДИТ членство `MembershipService.Create`, СНИМАЕТ —
// исключение из аккаунта (`UserService.RemoveFromAccount`). Правки нет: у
// членства нет ни одного поля, которое вызывающий назначал бы сам, — состояние
// выводится из личности, след приглашения пишется один раз.
//
// # Что делает `MembershipService.Create` — по адресу почты
//
// Один глагол на оба случая, и выбирать между ними вызывающему не нужно: ветвь
// решает адрес, а не вызывающий.
//
//   - адрес платформе НЕИЗВЕСТЕН — заводятся строка человека в состоянии
//     «приглашён» и членство `PENDING`, письмо приглашения ставится в очередь
//     (в пределах ограничения частоты на адрес).
//     Человек появляется на платформе ЭТИМ вызовом;
//   - адрес ИЗВЕСТЕН (человек зарегистрировался сам либо уже приглашён) —
//     второй строки человека не заводится: тому же человеку добавляется
//     членство в названном аккаунте. Оно `PENDING`, пока личность
//     «приглашена», и `ACTIVE` сразу во всех остальных состояниях личности, в
//     том числе у заблокированной (блокировка — свойство личности, см. `State`).
//     Отказа на зарегистрированном адресе нет: ввод зарегистрировавшегося
//     человека в аккаунт — тот же вызов.
//
// До стадии S4 рядом живёт прежний `UserService.Invite` с тем же потоком: на
// одну пару «человек × аккаунт» оба глагола, в любом порядке, дают ОДНУ строку
// членства.
//
// # Как человек появляется на платформе — перечень полный
//
//   - приглашение: `MembershipService.Create` либо `UserService.Invite` с
//     неизвестным адресом (ветвь выше);
//   - самостоятельная регистрация на полосе входа (`/iam/v1/auth/register`):
//     строка человека и его личный аккаунт с членством в нём. Регистрация
//     адресом живого приглашения второй строки не заводит — она ложится на
//     строку приглашения, а активирует его подтверждение адреса;
//   - внутренний `InternalUserService.UpsertFromIdentity` — только на
//     кластерном слушателе, для вызывающих внутри установки.
//
// Помимо этого одну служебную строку, человеком не являющуюся, заводит схема
// установки. Других путей нет: строку человека пишут ровно эти производители.
//
// Инфраструктурного на этой поверхности нет: ни внутренних идентификаторов, ни
// признаков размещения, ни следов очередей материализации.
//
// Resource id prefix: `mbr-`.
message Membership {
  // Идентификатор членства.
  //
  // Вычисляется из пары «человек × аккаунт» неизменяемой функцией и потому
  // ПЕРЕИСПОЛЬЗУЕТСЯ: снятие членства есть удаление строки, и повторное
  // приглашение того же человека в тот же аккаунт вернёт ТОТ ЖЕ
  // идентификатор. Признак «строка заведена заново» — `created_at`, а не `id`.
  string id = 1;

  // Аккаунт, которому принадлежит членство.
  string account_id = 2;

  // Человекочитаемое имя аккаунта — ЗЕРКАЛО, источник истины сам аккаунт
  // (`AccountService.Get`). Заполняется best-effort: пустое значение означает
  // «имя не задано», а НЕ «аккаунта нет».
  string account_name = 3;

  // Человек.
  string user_id = 4;

  // Состояние членства.
  State state = 5;

  // Кто позвал человека В ЭТОТ АККАУНТ — идентификатор человека.
  //
  // ОБЛАСТЬ — АККАУНТ, и это надо читать буквально: значение принадлежит ПАРЕ
  // «человек × аккаунт». У одного человека столько таких значений, сколько у
  // него членств, и они бывают разными: позвал в аккаунт A распорядитель A, в
  // аккаунт B — распорядитель B.
  //
  // НЕ ПУТАТЬ с `User.invited_by`: у того область — ПЛАТФОРМА, он называет того,
  // кто завёл личность впервые, и после этого не меняется НИКОГДА. Отличить два
  // значения по самому ответу нельзя — они одного типа и одного имени, — поэтому
  // различие названо здесь и там дословно, а не оставлено выводимым. На вопрос
  // «кто ввёл человека в ЭТУ организацию» отвечает поле членства; `User.invited_by`
  // на него отвечать не вправе и назовёт поручителя из ЧУЖОГО арендатора.
  //
  // Это и есть след приглашения, ПЕРЕЖИВАЮЩИЙ активацию: активация трогает
  // `state` и `updated_at` и не трогает его. Пусто у членства, заведённого не
  // приглашением.
  string invited_by = 6;

  // Когда членство заведено; для приглашения — когда оно выписано. Усечено до
  // секунд.
  google.protobuf.Timestamp created_at = 7;

  // Когда состояние менялось в последний раз. Усечено до секунд.
  google.protobuf.Timestamp updated_at = 8;

  // Состояний ровно два, и это закреплено конструкцией хранилища.
  //
  // Различающим состояние является в аккаунт-скоупном чтении: приглашённого
  // видит распорядитель аккаунта. В своём списке `PENDING` не читается: до
  // подтверждения адреса приглашённый находится в положении подтверждения, и
  // вызов отвечает отказом `EMAIL_NOT_VERIFIED`, а подтверждение адреса,
  // активирующее приглашение, переводит в `ACTIVE` ВСЕ его членства разом
  // (kaname#456).
  //
  // # СОСТОЯНИЕ ВЫВОДИТСЯ ИЗ СОСТОЯНИЯ ЛИЧНОСТИ, И ХОДА НАЗАД У НЕГО НЕТ
  //
  // Правило одно на все пути записи и держится конструкцией хранилища:
  // личность «приглашена» ⇒ членство `PENDING`, ИНАЧЕ ⇒ `ACTIVE`. Блокировка
  // есть свойство личности, а не членства, поэтому у заблокированного человека
  // членство остаётся `ACTIVE`.
  //
  // Следствия, названные прямо, потому что ОБА обманчивы:
  //
  //   - членство, заведённое для человека, чья личность уже НЕ «приглашена»,
  //     `ACTIVE` С САМОГО НАЧАЛА: приглашение в новый аккаунт не делает его
  //     снова ожидающим. Решает состояние личности, а не вход: приглашённый,
  //     зарегистрировавшийся по адресу приглашения, входит, оставаясь
  //     «приглашённым», и новое членство у него `PENDING` — до подтверждения
  //     адреса, которое переводит в `ACTIVE` все его членства разом;
  //   - ПЕРЕСОЗДАНИЕ членства (снятие плюс новое приглашение) в ожидание НЕ
  //     ВОЗВРАЩАЕТ: новая строка выводит состояние из той же личности и получает
  //     `ACTIVE`. Пересоздание приглашения поэтому НЕ ЯВЛЯЕТСЯ способом отозвать
  //     доверие — доступ отзывается снятием выдач и исключением из аккаунта,
  //     а вход на платформу закрывается блокировкой личности.
  //
  // Обратного перехода `ACTIVE → PENDING` не существует ни одним путём.
  enum State {
    STATE_UNSPECIFIED = 0;
    // Приглашение не активировано: адрес приглашённого не подтверждён
    // (kaname#456).
    PENDING = 1;
    // Человек состоит в аккаунте.
    ACTIVE = 2;
  }
}
