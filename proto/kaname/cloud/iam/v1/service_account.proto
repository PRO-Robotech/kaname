syntax = "proto3";

package kaname.cloud.iam.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/PRO-Robotech/kaname/pkg/api/kaname/cloud/iam/v1;iamv1";

// A ServiceAccount resource. Machine-identity (non-human) субъект внутри Account.
//
// Текущая поверхность — только CRUD без key-credentials. Key-creds RPC (CreateKey/ListKeys через Ory Hydra
// client_credentials, OAuth2 token endpoint) появятся позже.
//
// Служебная учётка привязана к Account'у; `enabled` решает, вправе ли она
// аутентифицироваться.
//
// Resource id prefix: `sva` (concatenated form, `ids.NewID`).
message ServiceAccount {
  // ID of the service account.
  string id = 1;

  // ID of the Account that this ServiceAccount belongs to.
  string account_id = 2;

  // Name of the service account. Unique within an Account. 1-63 characters long.
  string name = 3;

  // Optional description of the service account.
  string description = 4;

  // Creation timestamp.
  google.protobuf.Timestamp created_at = 5;

  // 6 — снятое `project_id`. Поле объявляло проектную область служебной
  // учётки, но заполнить его было нечем: ни один запрос его не принимал, ни
  // одна запись не передавала, а выборка агрегата его не выбирала — значение
  // было пустым всегда и у всех. Номер и имя зарезервированы, чтобы их не
  // заняли заново с другим смыслом; проектные служебные учётки, если
  // понадобятся, заводятся отдельной подсистемой со своей приёмкой, а не
  // полем в чужом сообщении.
  reserved 6;
  reserved "project_id";

  // Whether this ServiceAccount can authenticate. Defaults to true; toggle
  // false to disable without deletion.
  bool enabled = 7;

  // Tenant-facing метки. Единая модель видимости IAM-ресурсов: ServiceAccount —
  // label-selectable, как account/project; ARM_LABELS-грант на
  // iam.serviceAccount материализует глаголы своей роли на объектах, чьи `labels`
  // покрывают `matchLabels` (iam-direct same-DB), а страница List сужается тем же
  // отношением, которым каталог гейтит одиночное чтение — `v_get`; строка попадает
  // в выдачу ровно тогда, когда вызывающий вправе прочитать её по id.
  // Mutable через Update (`labels` в update_mask).
  map<string, string> labels = 8;
}

message CreateServiceAccountMetadata {
  // ID of the ServiceAccount that is being created.
  string service_account_id = 1;

  // ID of the owning Account (denormalized for account-scoped operations
  // listing — AccountService.ListAllOperations). Non-first field so the
  // corelib resource_id extractor (first `_id`-suffix match) still picks
  // `service_account_id`. Read by exact field name `account_id` by corelib.
  string account_id = 2;
}

message UpdateServiceAccountMetadata {
  // ID of the ServiceAccount that is being updated.
  string service_account_id = 1;

  // ID of the owning Account (denormalized; non-first, see CreateServiceAccountMetadata).
  string account_id = 2;
}

message DeleteServiceAccountMetadata {
  // ID of the ServiceAccount that is being deleted.
  string service_account_id = 1;

  // ID of the owning Account (denormalized; non-first, see CreateServiceAccountMetadata).
  string account_id = 2;
}

message DisableServiceAccountMetadata {
  // ID of the ServiceAccount that is being disabled.
  string service_account_id = 1;

  // ID of the owning Account (denormalized; non-first, see CreateServiceAccountMetadata).
  string account_id = 2;
}

message EnableServiceAccountMetadata {
  // ID of the ServiceAccount that is being enabled.
  string service_account_id = 1;

  // ID of the owning Account (denormalized; non-first, see CreateServiceAccountMetadata).
  string account_id = 2;
}
