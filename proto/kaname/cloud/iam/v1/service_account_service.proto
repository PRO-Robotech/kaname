syntax = "proto3";

package kaname.cloud.iam.v1;

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "corelib/api/v1/operation.proto";
import "kaname/cloud/iam/v1/service_account.proto";
import "kacho/cloud/operation/operation.proto";
import "corelib/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/kaname/pkg/api/kaname/cloud/iam/v1;iamv1";

// A set of methods for managing ServiceAccount resources.
//
// Без key-credentials RPC (CreateKey/ListKeys появятся позже через Ory Hydra
// client_credentials, OAuth2 token endpoint).
service ServiceAccountService {
  // Returns the specified ServiceAccount resource.
  rpc Get (GetServiceAccountRequest) returns (ServiceAccount) {
    option (google.api.http) = { get: "/iam/v1/serviceAccounts/{service_account_id}" };
    option (corelib.authz.v1.permission)        = "iam.service_accounts.get";
    option (corelib.authz.v1.required_relation) = "v_get";
    option (corelib.authz.v1.scope_extractor)   = {
      object_type:        "iam_service_account"
      from_request_field: "service_account_id"
    };
    option (corelib.authz.v1.required_acr_min) = "1";
  }

  // Retrieves the list of ServiceAccount resources. account_id фильтр обязателен.
  rpc List (ListServiceAccountsRequest) returns (ListServiceAccountsResponse) {
    option (google.api.http) = { get: "/iam/v1/serviceAccounts" };
    // ServiceAccount.List is default-deny via a SCOPE-FILTER, not
    // a PermissionDenied (the same model as User.List). The
    // kaname handler returns 200 with only the ServiceAccounts in Accounts
    // where the principal is a member (EMPTY list when the caller is not a
    // member of the requested Account — never 403). The handler is the
    // authoritative scope-filter gate, so the gateway middleware exempts this
    // RPC from the per-RPC FGA Check. `<exempt>` skips authz, NOT
    // authentication — a valid JWT is still required.
    // Сужение происходит НА ДАННЫХ, и это объявлено машинно, а не прозой:
    // обработчик читает страницу курсором и спрашивает модель про идентификаторы
    // ЭТОЙ страницы. Единого объекта, про который край мог бы спросить заранее,
    // у такого чтения нет by construction.
    //
    // Полоса `scope_filtered`, а НЕ `<exempt>`: последняя несёт второй смысл,
    // которому здесь не место — она допускает вызов внутреннего слушателя
    // ВООБЩЕ БЕЗ ПРИНЦИПАЛА, на основании сетевого положения. Пообъектный фильтр
    // ниже по стеку без принципала бессмыслен, поэтому лоток обязан быть тот,
    // который идёт ПОСЛЕ его извлечения.
    option (corelib.authz.v1.permission)     = "iam.service_accounts.list";
    option (corelib.authz.v1.scope_filtered) = true;
  }

  // Creates a service account in the specified account.
  rpc Create (CreateServiceAccountRequest) returns (kacho.cloud.operation.Operation) {
    option (google.api.http) = { post: "/iam/v1/serviceAccounts" body: "*" };
    option (corelib.api.v1.operation) = {
      metadata: "CreateServiceAccountMetadata"
      response: "ServiceAccount"
    };
    option (corelib.authz.v1.permission)        = "iam.service_accounts.create";
    option (corelib.authz.v1.required_relation) = "editor";
    option (corelib.authz.v1.scope_extractor)   = {
      object_type:        "account"
      from_request_field: "account_id"
    };
    option (corelib.authz.v1.required_acr_min) = "1";
  }

  // Updates the specified service account.
  // account_id is immutable.
  rpc Update (UpdateServiceAccountRequest) returns (kacho.cloud.operation.Operation) {
    option (google.api.http) = { patch: "/iam/v1/serviceAccounts/{service_account_id}" body: "*" };
    option (corelib.api.v1.operation) = {
      metadata: "UpdateServiceAccountMetadata"
      response: "ServiceAccount"
    };
    option (corelib.authz.v1.permission)        = "iam.service_accounts.update";
    option (corelib.authz.v1.required_relation) = "v_update";
    option (corelib.authz.v1.scope_extractor)   = {
      object_type:        "iam_service_account"
      from_request_field: "service_account_id"
    };
    option (corelib.authz.v1.required_acr_min) = "1";
  }

  // Deletes the specified service account.
  // ServiceAccount с висящим AccessBinding → FailedPrecondition.
  rpc Delete (DeleteServiceAccountRequest) returns (kacho.cloud.operation.Operation) {
    option (google.api.http) = { delete: "/iam/v1/serviceAccounts/{service_account_id}" };
    option (corelib.api.v1.operation) = {
      metadata: "DeleteServiceAccountMetadata"
      response: "google.protobuf.Empty"
    };
    option (corelib.authz.v1.permission)        = "iam.service_accounts.delete";
    option (corelib.authz.v1.required_relation) = "v_delete";
    option (corelib.authz.v1.scope_extractor)   = {
      object_type:        "iam_service_account"
      from_request_field: "service_account_id"
    };
    option (corelib.authz.v1.required_acr_min) = "1";
  }

  // Disables the specified service account: it may no longer authenticate.
  //
  // WHY AN ACTION AND NOT A FIELD ON Update. This is the reason the field was
  // never ADDED to UpdateServiceAccountRequest, not a description of a bug that
  // was there: an empty `update_mask` means full-object replacement by platform
  // convention, and a proto3 `bool` cannot say "not sent", so the obvious design
  // — one more maskable field — would let a client disable an account by simply
  // not filling it in. The state that decides whether a machine identity still
  // works must not be reachable by forgetting something.
  // It is also an EVENT ("this account was taken out of service"), not the
  // editing of an attribute, and it belongs in the audit trail as one.
  //
  // Step-up (acr=2) — this is a security-posture change, not routine lifecycle.
  // One call answers for the WHOLE principal the question SAKeyService/Revoke
  // answers for a single key, and it additionally stops the next mint on every
  // door (client_credentials hook, federated assertion, key issuance, docker
  // token). At the AAL1 floor a human could reach that outcome more cheaply than
  // revoking one key.
  // The floor is INTERACTIVE-ONLY: a service-account principal is exempt from it
  // by platform rule, so for machine callers this RPC costs exactly what Update
  // costs. It raises assurance for people; it is not a second authorization gate.
  //
  // WHO may call it is `v_update` — the same relation Update carries, on the same
  // object. Deliberate: whoever may rename a service account may also take it out
  // of service, and (by the editor projection) may already delete it outright.
  // The alternative — a relation of its own — would leave every existing operator
  // unable to use the control until someone re-granted them, which is the wrong
  // failure mode for something reached for during an incident.
  //
  // IDEMPOTENT: the argument is the STATE, not a transition. Disabling an
  // account that is already disabled succeeds and reports it disabled — the
  // safe direction of this control must never be the one that fails on retry.
  //
  // Already-issued access tokens are NOT invalidated by this call; they expire
  // on their own schedule. What stops immediately is every path that mints a
  // NEW one.
  rpc Disable (DisableServiceAccountRequest) returns (kacho.cloud.operation.Operation) {
    option (google.api.http) = { post: "/iam/v1/serviceAccounts/{service_account_id}:disable" body: "*" };
    option (corelib.api.v1.operation) = {
      metadata: "DisableServiceAccountMetadata"
      response: "ServiceAccount"
    };
    option (corelib.authz.v1.permission)        = "iam.service_accounts.disable";
    option (corelib.authz.v1.required_relation) = "v_update";
    option (corelib.authz.v1.scope_extractor)   = {
      object_type:        "iam_service_account"
      from_request_field: "service_account_id"
    };
    option (corelib.authz.v1.required_acr_min)  = "2";
  }

  // Enables the specified service account: it may authenticate again.
  //
  // The counterpart of Disable, and it exists for the same reason the state is
  // a column rather than a deletion — an account taken out of service has to be
  // able to come back. A one-way control is one an operator will not reach for.
  // Same shape throughout: action not field, Operation, step-up, idempotent
  // (enabling an enabled account succeeds).
  rpc Enable (EnableServiceAccountRequest) returns (kacho.cloud.operation.Operation) {
    option (google.api.http) = { post: "/iam/v1/serviceAccounts/{service_account_id}:enable" body: "*" };
    option (corelib.api.v1.operation) = {
      metadata: "EnableServiceAccountMetadata"
      response: "ServiceAccount"
    };
    option (corelib.authz.v1.permission)        = "iam.service_accounts.enable";
    option (corelib.authz.v1.required_relation) = "v_update";
    option (corelib.authz.v1.scope_extractor)   = {
      object_type:        "iam_service_account"
      from_request_field: "service_account_id"
    };
    option (corelib.authz.v1.required_acr_min)  = "2";
  }

  // Lists operations for the specified service account.
  rpc ListOperations (ListServiceAccountOperationsRequest) returns (ListServiceAccountOperationsResponse) {
    option (google.api.http) = { get: "/iam/v1/serviceAccounts/{service_account_id}/operations" };
    option (corelib.authz.v1.permission)        = "iam.service_account_operationses.listOperations";
    option (corelib.authz.v1.required_relation) = "v_list";
    option (corelib.authz.v1.scope_extractor)   = {
      object_type:        "iam_service_account"
      from_request_field: "service_account_id"
    };
    option (corelib.authz.v1.required_acr_min) = "1";
  }
}

message GetServiceAccountRequest {
  // ID of the ServiceAccount resource to return.
  string service_account_id = 1;
}

message ListServiceAccountsRequest {
  // ID of the Account to list service accounts in. Required.
  string account_id = 1;

  // The maximum number of results per page to return. Default value: 100.
  int64 page_size = 2;

  // Page token.
  string page_token = 3;

  // A filter expression. Supports filtering by [ServiceAccount.name].
  string filter = 4;
}

message ListServiceAccountsResponse {
  // List of ServiceAccount resources.
  repeated ServiceAccount service_accounts = 1;

  // This token allows you to get the next page of results for list requests.
  string next_page_token = 2;
}

message CreateServiceAccountRequest {
  // ID of the Account that the ServiceAccount will belong to.
  string account_id = 1;

  // Name of the service account. 1-63 characters long, unique within an Account.
  string name = 2;

  // Description of the service account.
  string description = 3;

  // Tenant-facing метки (делают SA label-selectable наравне с account/project).
  // Аннотации (size/key/value pattern) — паритет account/project/group request.
  map<string, string> labels = 4;
}

message UpdateServiceAccountRequest {
  // ID of the ServiceAccount resource to update.
  string service_account_id = 1;

  // Field mask. Allowed fields: name, description, labels.
  // account_id is immutable.
  google.protobuf.FieldMask update_mask = 2;

  // Name of the service account.
  string name = 3;

  // Description of the service account.
  string description = 4;

  // Tenant-facing метки (mutable; `labels` в update_mask).
  // Аннотации (size/key/value pattern) — паритет account/project/group request.
  map<string, string> labels = 5;
}

message DeleteServiceAccountRequest {
  // ID of the ServiceAccount resource to delete.
  string service_account_id = 1;
}

message DisableServiceAccountRequest {
  // ID of the ServiceAccount resource to disable.
  //
  // The whole request. There is deliberately nothing else here: an action with
  // no mask is an action nobody can half-send.
  string service_account_id = 1;
}

message EnableServiceAccountRequest {
  // ID of the ServiceAccount resource to enable.
  string service_account_id = 1;
}

message ListServiceAccountOperationsRequest {
  // ID of the ServiceAccount resource to list operations for.
  string service_account_id = 1;

  // The maximum number of results per page that should be returned.
  int64 page_size = 2;

  // Page token.
  string page_token = 3;
}

message ListServiceAccountOperationsResponse {
  // List of operations for the specified service account.
  repeated kacho.cloud.operation.Operation operations = 1;

  // This token allows you to get the next page of results for list requests.
  string next_page_token = 2;
}
