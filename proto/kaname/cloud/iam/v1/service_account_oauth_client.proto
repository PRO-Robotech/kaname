syntax = "proto3";

package kaname.cloud.iam.v1;

import "google/protobuf/timestamp.proto";
import "kaname/cloud/iam/v1/credential_kind.proto";

option go_package = "github.com/PRO-Robotech/kaname/pkg/api/kaname/cloud/iam/v1;iamv1";

// A ServiceAccountOAuthClient resource — a key credential of a service
// account (Class A workload identity): a keypair the caller signs a
// `client_assertion` with, a one-line secret, or a federated trust.
//
// N:1 with ServiceAccount: the schema holds no uniqueness on `sva_id`, so an
// account may carry several keys at once, and a key is rotated with overlap —
// issue the new one, move the workload, then revoke the old one.
//
// The client is named by the `id` of THIS row, and by nothing else: the
// assertion carries it in `iss`/`sub`, and the platform's token endpoint
// resolves it. The second name a previous external OAuth server used to assign
// is gone from the contract (number 3 reserved, kaname#362).
//
// FK to `service_accounts(id) ON DELETE RESTRICT` — preserves audit trail
// even if the SA is being decommissioned (operator must explicitly DELETE
// the oauth-client first).
//
// Resource id prefix: `soc`.
message ServiceAccountOAuthClient {
  // ID of the mapping row.
  // Конвенция Kachō: новый формат `soc<17-crockford>` (ids.NewID, без underscore);
  // legacy `soc_<body>` принимается для существующих строк (credential-id/JWK kid,
  // неизменяем — не регенерируется). Оба формата валидны.
  string id = 1;

  // ID of the ServiceAccount this client is bound to. Not unique: an account
  // may hold several keys (N:1).
  string sva_id = 2;

  // Number 3 carried the name of the client at the previous external OAuth
  // server. Removed by one breaking change together with its column and the
  // LEGACY credential kind (kaname#362); the client is named by `id`. Order —
  // docs/engineering/architecture/provider-mirror-column-retirement.md.
  reserved 3;
  reserved "hydra_client_id";

  // Free-form description (e.g. `CI builder key (Class A workload identity)`).
  // 0-256 chars.
  string description = 4;

  // Optional expiry / rotation reminder. Unset = no reminder (the service
  // layer alerts ≤14d before expires_at).
  google.protobuf.Timestamp expires_at = 5;

  // Timestamp of the most recent successful token issuance. Unset until first
  // use.
  google.protobuf.Timestamp last_used_at = 6;

  // ID of the User who created / rotated this client (audit).
  string created_by_user_id = 7;

  // Creation timestamp.
  google.protobuf.Timestamp created_at = 8;

  // Tenant-facing имя токена (задаётся при выпуске, immutable). Пусто → в UI
  // показывается description/id. Человекочитаемая метка ключа, не идентификатор.
  string name = 9;

  // Пользовательские метки токена (задаются при выпуске, immutable).
  map<string, string> labels = 10;

  // Вид удостоверения — ЧЕМ ОНО СЕБЯ ПРЕДЪЯВЛЯЕТ. Записывается при вставке;
  // читателем НЕ вычисляется и из состава прочих полей не выводится. По нему
  // читатель узнаёт, какое поле ответа выдачи было заполнено.
  CredentialKind credential_kind = 11;

}
