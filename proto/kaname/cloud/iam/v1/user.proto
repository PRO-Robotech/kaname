syntax = "proto3";

package kaname.cloud.iam.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/PRO-Robotech/kaname/pkg/api/kaname/cloud/iam/v1;iamv1";

// A User resource. Человек — ГЛОБАЛЬНАЯ личность платформы: одна строка на всё
// облако, в скольких бы аккаунтах он ни состоял. Ключи личности
// `users_identity_email_uniq` и `users_identity_external_id_uniq` глобальны, а
// принадлежность аккаунтам выражают строки `memberships` (`membership.proto`):
// аккаунтов у человека может быть несколько.
//
// Личность заводят регистрация и активация приглашения в исходе подтверждения
// адреса — обе на полосе входа самой службы — и внутренний
// `InternalUserService.UpsertFromIdentity` (см. `external_id`, `invite_status`).
//
// Resource id prefix: `usr` (concatenated form, `ids.NewID`).
message User {
  // Аккаунт снят с ресурса пользователя (kacho#471, IAM-ID-1-19).
  //
  // Поле объявляло, что у человека РОВНО ОДИН аккаунт, — так было, пока человек
  // был строкой В аккаунте. После отрыва принадлежность выражается членствами,
  // которых у него может быть несколько, и одно значение из множества читалось
  // бы вызывающим как факт о человеке.
  //
  // Резервируются И номер, И имя: номер — чтобы следующее поле не переиспользовало
  // его и старый клиент не прочитал чужое значение как аккаунт; имя — потому что
  // JSON разбирается по имени, и один резерв номера от воскрешения имени не спасает.
  //
  // «Кто состоит в этом аккаунте» спрашивается списком пользователей, суженным
  // аккаунтом: этот фильтр читает членства, а не снятую колонку.
  reserved 6;
  reserved "account_id";

  // ID of the user (kaname internal id).
  string id = 1;

  // Идентичность субъекта входа. Регистрация и активация приглашения в исходе
  // подтверждения адреса (kaname#456) пишут значение, отчеканенное полосой
  // входа службы, — `own:sub-<…>`; внутренний
  // `InternalUserService.UpsertFromIdentity` пишет значение, которое приносит
  // его вызывающий. Уникально на всю установку, после записи не меняется.
  // Пусто у PENDING.
  string external_id = 2;

  // Email (case-insensitive lookup). При Invite адрес указывает пригласивший;
  // регистрация адресом живого приглашения ложится на строку этого
  // приглашения, а не заводит вторую.
  string email = 3;

  // Human-readable display name. Задаёт пригласивший при Invite либо
  // вызывающий `InternalUserService.UpsertFromIdentity`; не задано — берётся
  // локальная часть адреса (до `@`).
  string display_name = 4;

  // Creation timestamp.
  google.protobuf.Timestamp created_at = 5;

  // invite-status.
  // PENDING — приглашение не активировано: адрес приглашённого не подтверждён
  //   (kaname#456). Приглашённый, зарегистрировавшийся адресом приглашения,
  //   входит в положение подтверждения; приглашение активирует подтверждение
  //   адреса, пока приглашение живо.
  // ACTIVE  — личность заведена, external_id заполнен: регистрацией без
  //   приглашения, подтверждением адреса живого приглашения либо внутренним
  //   `InternalUserService.UpsertFromIdentity`.
  // BLOCKED — вход на платформу запрещён (`UserService.Block`; снимается
  //   `UserService.Unblock`).
  //
  // Состояние принадлежит ЛИЧНОСТИ, и действует оно ВЕЗДЕ, где человек состоит.
  //
  // > Здесь стояло обратное — «состояние принадлежит СТРОКЕ ЧЛЕНСТВА… запрет в
  // > одном Account'е не отключает её в остальных». Это было верно, пока строка
  // > `users` и была членством, и пережило свой предмет: строк у человека теперь
  // > одна на всю платформу (глобальные ключи `users_identity_email_uniq` /
  // > `users_identity_external_id_uniq`, миграция 20260823050000), а
  // > принадлежность аккаунтам выражают строки `memberships`. Утверждение не
  // > удалено, а перевёрнуто на месте: оно читалось как ГРАНИЦА БЕЗОПАСНОСТИ, и
  // > следующий, кто пришёл бы за радиусом запрета, принял бы его за факт. Ту же
  // > правку с той же причиной несёт проза `UserService.Block`.
  //
  // Пер-аккаунтное исключение — ОТДЕЛЬНОЕ действие и отдельное поле не занимает:
  // `UserService.RemoveFromAccount` снимает строку членства и этого состояния не
  // касается (#1127).
  //
  // НЕ ИЗМЕНЯЕТСЯ через Update: у пустой `update_mask` семантика полной замены
  // объекта, а enum в proto3 неотличим от незаданного — клиент, не приславший
  // поле, запретил бы участие каждому, кого коснулся. Поэтому состояние меняют
  // ДЕЙСТВИЯ, у которых маски нет.
  InviteStatus invite_status = 7;

  // Кто завёл ЛИЧНОСТЬ на платформе — `User.id` пригласившего. Пусто у строки,
  // появившейся самозаписью.
  //
  // ОБЛАСТЬ — ПЛАТФОРМА, а не аккаунт, и различие названо здесь потому, что по
  // самому ответу его не увидеть. Значение пишется ОДИН РАЗ, при первом
  // появлении человека в облаке, и последующие приглашения его НЕ МЕНЯЮТ: у
  // человека одна строка личности на все его аккаунты. Поэтому у сотрудника,
  // которого позвал сначала один арендатор, а потом другой, здесь навсегда
  // остаётся поручитель ПЕРВОГО — то есть, с точки зрения второго, человек из
  // чужой организации.
  //
  // НЕ ПУТАТЬ с `Membership.invited_by`: у того область — АККАУНТ, и именно он
  // отвечает на вопрос «кто ввёл человека В ЭТУ организацию», на который
  // ключуются согласование и отчётность. Ошибка здесь тиха: значение верно, а
  // смысл, который ему приписывают, — нет.
  string invited_by = 8;

  // Метки человека — ПЛАТФОРМЕННАЯ величина, и владелец у них назван (#1126).
  //
  // КТО ИХ ПИШЕТ. Только надзор облака: `UserService.Update` гейтится
  // `iam_user.record_writer`, у которого источников уровня аккаунта нет ни
  // одного (#1102). Распорядитель аккаунта своих людей размечать НЕ МОЖЕТ, и это
  // решение, а не недоделка: строка `iam_user` — глобальная личность, одна на все
  // аккаунты человека, поэтому метка, поставленная из одного аккаунта, была бы
  // фактом о нём во всех.
  //
  // ЧЕМ ОНИ НЕ ЯВЛЯЮТСЯ. Не «как МОЙ аккаунт помечает этого человека». Такому
  // прочтению негде жить: носитель метки ровно один и он не пер-аккаунтный
  // (проба `repo/kaname/pg/person_labels_are_a_platform_value_integration_test.go`
  // краснеет на появлении второго). Пер-аккаунтная разметка людей — исход 1
  // задачи #1126, и она требует ресурса членства (#1085): пока у чтения нет
  // аргумента аккаунта, «метки этого человека в этом аккаунте» нечем адресовать.
  //
  // ЧТО ОНИ ДЕЛАЮТ. User — label-selectable наравне с account/project:
  // ARM_LABELS-грант на iam.user материализует глаголы своей роли на объектах,
  // чьи `labels` покрывают `matchLabels` (iam-direct same-DB), а страница List
  // сужается тем же отношением, которым каталог гейтит одиночное чтение —
  // `v_get`; строка попадает в выдачу ровно тогда, когда вызывающий вправе
  // прочитать её по id. Роль, дающая только `list` без `get`, объект в списке не
  // показывает — иначе выдача раскрывала бы содержимое, которое чтение по id
  // отказывает (List возвращает то же сообщение ресурса, что и Get).
  //
  // Mutable через UserService.Update (`labels` в update_mask). Аннотации
  // (size/key/value pattern) энфорсят sync-INVALID_ARGUMENT на request-layer —
  // паритет account/project/group request `labels`.
  map<string, string> labels = 9;

  enum InviteStatus {
    INVITE_STATUS_UNSPECIFIED = 0;
    PENDING = 1;
    ACTIVE = 2;
    BLOCKED = 3;
  }
}

// МЕТАДАННЫЕ ДЕЙСТВИЙ НАД ЛИЧНОСТЬЮ — Delete, Update, Block, Unblock,
// ResetSecondFactor, ResetAccessKeys — ОДНОЙ ФОРМЫ, и `account_id` в них не
// аккаунт действия.
//
// Предмет каждого из шести — строка `iam_user`, одна на всю платформу: гейт
// задаёт вопрос объекту `iam_user` (`identity_remover`, `record_writer`,
// `identity_suspender`), а не аккаунту, и следствие действует во всех
// аккаунтах человека разом — блокировка закрывает вход на платформу, а не в
// один аккаунт (`Membership.State`).
//
// `account_id` переносится в операцию из легаси-колонки `users.account_id`.
// Колонка пишется ОДИН РАЗ, при первом появлении строки человека, и потом не
// меняется: у приглашённого это аккаунт ПЕРВОГО приглашения, у
// зарегистрировавшегося самостоятельно — его личный аккаунт. Ни одного из
// последующих членств она не называет.
//
// Отсюда исполнимое следствие, которое и читает лента операций аккаунта
// (`AccountService.ListAllOperations`, отбор по этому полю): операция действия
// над личностью видна в ленте РОВНО ОДНОГО аккаунта — названного колонкой — и не
// видна в лентах остальных аккаунтов того же человека. Это не утверждение, что
// действие совершил тот аккаунт или что оно касается только его. Колонка
// `NOT NULL`, поэтому у этих шести операций поле не пусто.
//
// Поле стоит вторым намеренно: извлекатель `resource_id` фундамента берёт
// первое поле с суффиксом `_id`, и это должен быть `user_id`; `account_id`
// фундамент читает по точному имени. Снятие колонки — предмет открытой задачи
// kacho#1351 (стадия S4-contract); у неё и предикат снятия, и решение о судьбе
// этого поля.

message DeleteUserMetadata {
  // ID of the User (the person, platform-wide) that is being deleted.
  string user_id = 1;

  // Аккаунт из легаси-колонки `users.account_id` — см. общую шапку над
  // этим сообщением: адресует ленту операций одного аккаунта и не называет ни
  // аккаунт действия, ни аккаунты, которых действие касается.
  string account_id = 2;
}

message UpdateUserMetadata {
  // ID of the User (the person, platform-wide) that is being updated.
  string user_id = 1;

  // Аккаунт из легаси-колонки `users.account_id` — см. общую шапку над
  // `DeleteUserMetadata`.
  string account_id = 2;
}

message BlockUserMetadata {
  // ID of the User (the person, platform-wide) that is being blocked.
  // Блокировка — свойство личности: она закрывает вход на платформу во всех
  // аккаунтах человека разом, членства остаются `ACTIVE`.
  string user_id = 1;

  // Аккаунт из легаси-колонки `users.account_id` — см. общую шапку над
  // `DeleteUserMetadata`. Операция блокировки видна в ленте только этого
  // аккаунта; распорядители остальных аккаунтов человека её в своей ленте не
  // видят, хотя блокировка действует и у них.
  string account_id = 2;
}

message UnblockUserMetadata {
  // ID of the User (the person, platform-wide) that is being unblocked.
  string user_id = 1;

  // Аккаунт из легаси-колонки `users.account_id` — см. общую шапку над
  // `DeleteUserMetadata`.
  string account_id = 2;
}

message ResetSecondFactorMetadata {
  // ID of the User whose second factor is being reset.
  string user_id = 1;

  // Аккаунт из легаси-колонки `users.account_id` — см. общую шапку над
  // `DeleteUserMetadata`.
  string account_id = 2;
}

message ResetAccessKeysMetadata {
  // ID of the User whose access keys are being reset.
  string user_id = 1;

  // Аккаунт из легаси-колонки `users.account_id` — см. общую шапку над
  // `DeleteUserMetadata`.
  string account_id = 2;
}

// Invite-flow.
message RemoveUserFromAccountMetadata {
  // ID of the person whose membership is being removed. First field so the
  // corelib resource_id extractor (first `_id`-suffix match) picks it.
  string user_id = 1;

  // ID of the Account the person is being removed from. Never empty: the
  // membership is the pair, and the call names both halves.
  string account_id = 2;
}

message InviteUserMetadata {
  // ПОЛЕ ССЫЛКИ ПЕРВОГО ВХОДА СНЯТО С КОНТРАКТА — номер и имя зарезервированы
  // (решение владельца Р10 приёмки ID-MAIL-1; задача продукта #1774).
  //
  // Возвращать ссылку вызывающему значило бы выдавать приглашающему
  // предъявителя, которым тот войдёт ЗА приглашённого. Письмо приглашения
  // отправляет НАШ код через очередь `kaname.invite_mail_outbox`, и
  // предъявителя оно не несёт: доступ даёт владение почтовым ящиком, а не
  // обладание письмом. Взамен снятого поля — глагол `UserService.ResendInvite`
  // и состояние приглашения в консоли.
  //
  // Резервирование — не формальность: поле, вернувшееся под тем же номером с
  // другим типом, разъехало бы проволочно, а под тем же именем с другим
  // смыслом читалось бы клиентом по-старому.
  reserved 3;
  reserved "magic_link_url";

  string user_id = 1;
  string account_id = 2;
}

// ResendInviteMetadata — метаданные операции повторной отправки письма
// приглашения. Форма та же, что у InviteUserMetadata: человек и аккаунт;
// `user_id` первым — извлекатель resource_id фундамента берёт первое поле с
// суффиксом `_id`.
message ResendInviteMetadata {
  string user_id = 1;
  string account_id = 2;
}
