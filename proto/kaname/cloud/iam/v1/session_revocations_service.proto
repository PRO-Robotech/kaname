syntax = "proto3";

package kaname.cloud.iam.v1;

import "google/protobuf/timestamp.proto";
import "corelib/api/v1/operation.proto";
import "kaname/cloud/iam/v1/session_revocation.proto";
import "kacho/cloud/operation/operation.proto";
import "corelib/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/kaname/pkg/api/kaname/cloud/iam/v1;iamv1";

// InternalSessionRevocationsService — cluster-internal RPCs for the session
// revocation hot-path (port 9091).
//
// `session_revocations` is queryable from api-gateway on
// every access-token verification: api-gateway maintains an in-memory cache
// pre-loaded via `ListByUser` + a LISTEN/NOTIFY subscription on
// `session_revoked`. `IsRevoked` is the slow-path fallback
// when a token's `jti` is not in cache (e.g. cold start window).
//
// Revocation sources:
//   - User-initiated logout (kaname OAuth2 logout handler).
//   - Admin force-logout (InternalIAMService.ForceLogout — see
//     internal_iam_service.proto extensions).
//   - CAEP receiver (external IdP signal).
//   - Back-channel logout from Hydra (see back_channel_logout_service.proto).
//
// All revocations write to the same `session_revocations` table (PK =
// `token_jti`); LISTEN/NOTIFY fans out to every api-gateway pod ≤ 1s.
service InternalSessionRevocationsService {
  // Revoke — mark a token (and optionally cascade to all user's active tokens
  // via Hydra introspection) as revoked. Async — writes
  // `session_revocations` row + `audit_outbox` row in a single TX, then
  // returns Operation; worker NOTIFY-es `session_revoked` channel.
  //
  // Idempotent on `token_jti` (INSERT ... ON CONFLICT (token_jti) DO NOTHING).
  rpc Revoke (RevokeRequest) returns (kacho.cloud.operation.Operation) {
    option (corelib.api.v1.operation) = {
      metadata: "RevokeMetadata"
      response: "SessionRevocation"
    };
    // Cluster-internal listener-protected; callers are
    // kaname internal logout handler, ForceLogout admin RPC,
    // back-channel logout, CAEP receiver — all server-side.
    option (corelib.authz.v1.permission) = "<exempt>";
    option (corelib.authz.v1.exempt_reason)  = "INTERNAL_LISTENER";
  }

  // IsRevoked — sync hot-path lookup for api-gateway: `SELECT 1 FROM
  // session_revocations WHERE token_jti = $1`. Latency budget ≤ 5ms p95
  // (PK lookup on indexed table). Called only on cache miss.
  rpc IsRevoked (IsRevokedRequest) returns (IsRevokedResponse) {
    // Cluster-internal listener-protected; called by api-gateway itself
    // before authz can possibly run — chicken-and-egg means this MUST
    // bypass per-RPC authz.
    option (corelib.authz.v1.permission) = "<exempt>";
    option (corelib.authz.v1.exempt_reason)  = "INTERNAL_LISTENER";
  }

  // ListByUser — admin / audit endpoint: enumerate active revocations for a
  // user. Used by admin-UI to display "force-logged-out at" history and by
  // CAEP forwarder to bulk-emit events.
  //
  // The whole response is about ONE user the CALLER NAMES, so it is authorized
  // per-object on that user, and kaname enforces that itself in its own tree
  // (the coordinate is deliberately not quoted here: the service was carved out
  // into its own repository, and a path that resolves in another tree reads as
  // one that resolves in this one). The record below states that lane, so any
  // future route inherits it rather than a bypass.
  //
  // The relation is `session_reader` — the person themselves plus cloud
  // oversight, and nobody else (#1140). It used to be the READ TIER `viewer`,
  // which the model compiler expands into SEVEN sources: the person, three
  // direct subject lists (the viewer/editor/admin tiers the reconciler writes a
  // back-compat tuple into), the delegated account steward, the account owner
  // and cloud oversight. A session history is information ABOUT A PERSON, not a
  // right over an account: identity is global here (one `iam_user` row across
  // all of a person's accounts, and the identity→account link is taken from
  // membership), so a right held inside ONE account disclosed the whole
  // history — including sessions the person used in accounts that holder has
  // nothing to do with. Owner's directive, 2026-08-23: the inviter may add and
  // remove rights, not act for the invitee nor read facts about them.
  //
  // Same circle as `token_reader` (#1133) — a session and a credential are
  // neighbouring sides of one identity, and differing width would be a decision
  // nobody took. That the two agree is asserted by a gate, not by this comment.
  //
  // Narrowing the READ takes nothing away from TERMINATION: `Revoke` and
  // `ForceLogout` are `<exempt>`/`INTERNAL_LISTENER` and carry no relation on
  // the identity row at all — the calling MODULE's lane decides them.
  //
  // It is deliberately NOT `<exempt>`, and the listener's own gates do not supply
  // the decision: they narrow the CALLING MODULE — a verified certificate, plus
  // `system_viewer@cluster` held by that module's own service account — and
  // neither of them reads `user_id`.
  rpc ListByUser (ListByUserRequest) returns (ListByUserResponse) {
    option (corelib.authz.v1.permission)        = "iam.session_revocations.listByUser";
    option (corelib.authz.v1.required_relation) = "session_reader";
    option (corelib.authz.v1.scope_extractor)   = {
      object_type:        "iam_user"
      from_request_field: "user_id"
    };
    option (corelib.authz.v1.required_acr_min) = "1";
    // A refusal is the user's own miss, not "you may not". kaname answers a
    // denied caller that way already; the flag is what makes an edge that ever
    // routes this RPC answer the same, instead of a 403 that tells an outsider
    // the user exists. The edge heuristic does not cover this shape on its own —
    // it hides only `/Get` on a `v_get` scope — so the flag has to be explicit.
    option (corelib.authz.v1.hide_existence) = true;
  }

  // SessionCutoffOf — момент, раньше которого сессии человека недействительны.
  //
  // ЗАЧЕМ ОТДЕЛЬНЫЙ ВОПРОС, ЕСЛИ РЯДОМ СТОИТ `IsRevoked`. Тот спрашивает про
  // ОДНО удостоверение по его идентификатору. У браузерной сессии удостоверения
  // нет вовсе: человек предъявляет cookie, у которой нет ни `jti`, ни подписи,
  // которую край мог бы прочитать. Спросить про неё можно только по СУБЪЕКТУ и
  // моменту, в который эта сессия аутентифицировалась, — и это ровно та величина,
  // которую пишет наш выход и административный принудительный выход
  // (`user_token_revocations.revoke_before`).
  //
  // Без этого вопроса запись, которую делает наш глагол, не участвовала в решении
  // на браузерной полосе ВОВСЕ: её читали только хуки выдачи, то есть отзыв
  // действовал на выдаче и не действовал на предъявлении.
  //
  // Отсечка действует ВПЕРЁД: сессия, аутентифицировавшаяся ПОЗЖЕ момента, снова
  // законна. Поэтому отзыв снимает выданное, а не блокирует человека навсегда.
  rpc SessionCutoffOf (SessionCutoffOfRequest) returns (SessionCutoffOfResponse) {
    // Cluster-internal listener-protected; called by api-gateway itself on the
    // authN layer — before authz can possibly run. Same chicken-and-egg as
    // `IsRevoked` above, and the same lane.
    option (corelib.authz.v1.permission) = "<exempt>";
    option (corelib.authz.v1.exempt_reason)  = "INTERNAL_LISTENER";
  }
}

// RevokeRequest — input to InternalSessionRevocationsService.Revoke.
message RevokeRequest {
  // JWT `jti` of the token being revoked. Required when revoking a single
  // token; may be empty when `revoke_all_user_tokens=true` is set (then the
  // RPC enumerates active tokens via Hydra introspection and revokes each
  // individually).
  string token_jti = 1;

  // User whose token is revoked. Required.
  string user_id = 2;

  // Free-form reason — see SessionRevocation.reason for the canonical
  // vocabulary (`user-logout`, `password-change`, `caep-event`,
  // `admin-revoke`, `back-channel-logout`, `force-logout`).
  string reason = 3;

  // After this timestamp the revocation row may be pruned (defaults to
  // `now() + 30d`). Should be ≥ original token's `exp` claim so the cache
  // stays authoritative for the token's lifetime.
  google.protobuf.Timestamp ttl_expires_at = 4;

  // When true, kaname enumerates ALL active access tokens for the user
  // (Hydra introspection) and inserts a row per `jti`. Used by admin
  // ForceLogout and password-change flows.
  bool revoke_all_user_tokens = 5;
}

// RevokeMetadata — Operation.metadata payload.
message RevokeMetadata {
  // Number of token_jti rows that were newly inserted (excludes idempotent
  // no-ops on conflict).
  int32 revoked_count = 1;

  // User whose session(s) were revoked.
  string user_id = 2;
}

// IsRevokedRequest — sync hot-path lookup.
message IsRevokedRequest {
  // JWT `jti` to look up.
  string token_jti = 1;
}

// IsRevokedResponse — sync hot-path response.
message IsRevokedResponse {
  // True if a non-expired row exists in `session_revocations`.
  bool revoked = 1;

  // When the revocation row was inserted.
  google.protobuf.Timestamp revoked_at = 2;

  // Reason recorded at insertion (echo of SessionRevocation.reason).
  string reason = 3;
}

// ListByUserRequest — admin/audit enumeration.
message ListByUserRequest {
  // User whose revocations to list.
  string user_id = 1;

  // Page size (default 100, max 1000).
  int64 page_size = 2;

  // Page token.
  string page_token = 3;
}

// ListByUserResponse — admin/audit page.
message ListByUserResponse {
  // Active revocation rows for the user (not yet pruned).
  repeated SessionRevocation revocations = 1;

  // Continuation token.
  string next_page_token = 2;
}

// SessionCutoffOfRequest — вопрос про СУБЪЕКТА, а не про удостоверение.
message SessionCutoffOfRequest {
  // Человек, про сессии которого спрашивают (`users.id`).
  string user_id = 1;
}

// SessionCutoffOfResponse — отсечка субъекта.
message SessionCutoffOfResponse {
  // Есть ли отсечка вообще. ОТДЕЛЬНОЕ поле, а не «нулевая отметка времени»:
  // пустое обязано означать пусто, и вызывающий, читающий нулевой момент как
  // «отозвано всё», закрылся бы на каждом человеке, которого никто не отзывал.
  bool found = 1;

  // Момент отсечки. Сессия, аутентифицировавшаяся В ЭТОТ момент или раньше,
  // недействительна; аутентифицировавшаяся позже — законна.
  google.protobuf.Timestamp revoke_before = 2;

  // Причина, записанная вместе с отсечкой. Для диагностики оператору; решение
  // принимается по паре (found, revoke_before), а не по разбору этой строки.
  string reason = 3;
}
