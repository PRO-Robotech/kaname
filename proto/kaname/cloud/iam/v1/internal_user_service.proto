syntax = "proto3";

package kaname.cloud.iam.v1;

import "google/api/annotations.proto";
import "corelib/api/v1/operation.proto";
import "kaname/cloud/iam/v1/user.proto";
import "kaname/cloud/iam/v1/user_service.proto";
import "corelib/operation/operation.proto";
import "corelib/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/kaname/pkg/api/kaname/cloud/iam/v1;iamv1";

// InternalUserService — cluster-internal user-mutation API (port 9091).
//
// НЕ публикуется на external TLS listener.
//
// Transport:
//   - `Get` — регистрируется в api-gateway internal mux (нужен interceptor'у);
//   - `UpsertFromIdentity` — доступен через gRPC direct
//     (`grpcurl -plaintext kaname-internal:9091 ...`) и REST внутреннего
//     listener'а; вызывающий — admin-tooling.
service InternalUserService {
  // Upsert User по субъекту личности (административный путь).
  // Вызывается admin через grpcurl; внешнего вызывающего у метода нет.
  //
  // REST exposed ONLY on the cluster-internal listener;
  // api-gateway isInternalPath() gates `/iam/v1/internal/*` to internal mux
  // and authz-public-allowlist permits the <exempt> catalog entry.
  rpc UpsertFromIdentity (UpsertFromIdentityRequest) returns (corelib.operation.Operation) {
    option (google.api.http) = {
      post: "/iam/v1/internal/users:upsertFromIdentity"
      body: "*"
    };
    option (corelib.api.v1.operation) = {
      metadata: "UpsertFromIdentityMetadata"
      response: "User"
    };
    option (corelib.authz.v1.permission) = "<exempt>";
    option (corelib.authz.v1.exempt_reason)  = "INTERNAL_LISTENER";
  }

  // Internal Get без auth (для api-gateway interceptor'а; не выставляется на public mux).
  rpc Get (GetUserRequest) returns (User) {
    option (corelib.authz.v1.permission) = "<exempt>";
    option (corelib.authz.v1.exempt_reason)  = "INTERNAL_LISTENER";
  }

  // callback of the retired external identity provider (kaname#363) after a
  // successful self-service recovery flow (magic-link e-mail recovery); the
  // method stays mounted, and no caller of it remains in this tree. kaname
  // re-enables the User (if `invite_status` was `DISABLED`), invalidates all
  // active sessions for the user (writes `session_revocations` rows with
  // reason=`password-change`), and emits `iam.user.recovery_completed` audit.
  //
  // Idempotent on `(external_id, recovery_jti)` — duplicate webhook delivery
  // does NOT spawn duplicate revocations.
  rpc OnRecoveryCompleted (OnRecoveryCompletedRequest) returns (corelib.operation.Operation) {
    option (corelib.api.v1.operation) = {
      metadata: "OnRecoveryCompletedMetadata"
      response: "User"
    };
    // Cluster-internal listener-protected; the only authorized caller was
    // the retired external identity provider via secret-token (kaname#363).
    // No per-RPC authz check.
    option (corelib.authz.v1.permission) = "<exempt>";
    option (corelib.authz.v1.exempt_reason)  = "INTERNAL_LISTENER";
  }
}

message UpsertFromIdentityRequest {
  // Субъект личности (`sub` claim) — UNIQUE-key.
  string external_id = 1;

  // Email (case-insensitive). Required.
  string email = 2;

  // Human-readable display name (необязателен).
  string display_name = 3;
}

message UpsertFromIdentityMetadata {
  // ID локального User row после upsert'а.
  string user_id = 1;

  // True если был создан новый User; false если обновился existing.
  bool created = 2;
}

// payload of the recovery-completed callback.
message OnRecoveryCompletedRequest {
  // Identity id (= kaname User.external_id) whose recovery just
  // completed.
  string external_id = 1;

  // Recovery-flow id (used as idempotency key — `INSERT ... ON
  // CONFLICT (recovery_jti) DO NOTHING`).
  string recovery_jti = 2;

  // E-mail at which the recovery was completed (echo from the identity
  // traits — kaname matches it against `users.email` to defend against
  // mismatched payloads).
  string email = 3;
}

message OnRecoveryCompletedMetadata {
  // ID локального User row.
  string user_id = 1;

  // Number of active sessions revoked as part of the recovery flow.
  int32 revoked_session_count = 2;
}
