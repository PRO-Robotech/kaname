syntax = "proto3";

package kaname.cloud.iam.v1;

import "kaname/cloud/iam/v1/user.proto";
import "kaname/cloud/iam/v1/user_service.proto";
import "corelib/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/kaname/pkg/api/kaname/cloud/iam/v1;iamv1";

// InternalUserService — cluster-internal user API (port 9091).
//
// НЕ публикуется на external TLS listener.
//
// Transport: `Get` — регистрируется в api-gateway internal mux (нужен
// interceptor'у).
service InternalUserService {
  // Глагола заведения личности по удостоверению внешнего поставщика здесь
  // больше нет (kaname#929, приёмка `active-identity-has-a-way-in.md`, AWI-09):
  // его обратный вызов из края снят, вызывающего не осталось, а сам глагол
  // производил личность ACTIVE без способа входа. Людей заводят регистрация и
  // приглашение.

  // Internal Get без auth (для api-gateway interceptor'а; не выставляется на public mux).
  rpc Get (GetUserRequest) returns (User) {
    option (corelib.authz.v1.permission) = "<exempt>";
    option (corelib.authz.v1.exempt_reason)  = "INTERNAL_LISTENER";
  }

  // Глагола приёма исхода восстановления от внешнего поставщика здесь больше
  // нет (kaname#564): он снят вместе со снятым поставщиком (kaname#363),
  // вызывающего не осталось. Восстановление доступа ведёт собственная полоса
  // входа (`/iam/v1/auth/recovery/complete`).
}
