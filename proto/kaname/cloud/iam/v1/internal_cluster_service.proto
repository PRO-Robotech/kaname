syntax = "proto3";

// InternalClusterService — Internal-only.
// Registered exclusively on the api-gateway internal mux (cluster-internal listener)
// under `/iam/v1/internal/cluster/...`; never on the external TLS endpoint.
//
// Manages cluster-RBAC admin grants on the singleton `cluster:cluster_root`
// FGA object, for users and service accounts. All mutations return an
// `Operation`: it is persisted before the mutation, the handler inserts
// `cluster_admin_grants` + `fga_outbox` + `audit_outbox` rows in a single
// transaction, and the same request completes the Operation (`done=true`). The
// relation tuple itself reaches the model asynchronously, through the
// `fga_outbox` drainer. The public twin `ClusterService`
// (`cluster_service.proto`) executes the same use-cases.
//
// Read RPCs (`Get`, `ListAdmins`) are synchronous; they hit the local
// `kaname` schema only.
//
// Authorization gate:
// every RPC requires the FGA relation `system_admin` on
// `cluster:cluster_root` (resolved via `scope_extractor.object_type =
// "cluster"`, `from_request_field = "*"` ⇒ the singleton cluster id). The
// api-gateway authz middleware reads `permission_catalog.json` and enforces
// this before the request reaches the handler. Non-admin subjects MUST NOT
// be able to even observe these RPCs — `Get` / `ListAdmins` would otherwise
// leak the existence and roster of cluster admins.
package kaname.cloud.iam.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "corelib/api/v1/operation.proto";
import "kaname/cloud/iam/v1/cluster.proto";
import "kaname/cloud/iam/v1/cluster_admin_grant.proto";
import "corelib/operation/operation.proto";
import "corelib/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/kaname/pkg/api/kaname/cloud/iam/v1;iamv1";

// InternalClusterService — admin-tooling for the singleton
// `cluster:cluster_root` FGA object. See file-level comment for the
// gate and the outbox contract.
service InternalClusterService {
  // Returns the singleton Cluster resource (`id = "cluster_root"`).
  // Sync read; no Operation envelope.
  //
  // REST exposed ONLY on the cluster-internal listener.
  rpc Get (GetClusterRequest) returns (Cluster) {
    option (google.api.http) = {
      get: "/iam/v1/internal/cluster"
    };
    option (corelib.authz.v1.permission)        = "iam.cluster_admins.get";
    option (corelib.authz.v1.required_relation) = "system_admin";
    option (corelib.authz.v1.scope_extractor)   = {
      object_type:        "cluster"
      from_request_field: "*"
    };
    option (corelib.authz.v1.required_acr_min) = "1";
  }

  // Grants permanent cluster-admin (relation `system_admin` on
  // `cluster:cluster_root`) to the requested subject. Idempotent —
  // re-granting an already-active subject returns success with the existing
  // grant id.
  //
  // The handler first checks the subject's state by kind (`kaname.users` for
  // `USER`, `kaname.service_accounts` for `SERVICE_ACCOUNT`), and then
  // atomically inserts a `cluster_admin_grants` row (`INSERT … ON CONFLICT ON
  // CONSTRAINT cluster_admin_grants_cluster_subject_uniq DO NOTHING`, then an
  // in-place reactivate of a revoked row), an `fga_outbox` write-tuple row, and
  // an `audit_outbox` row in one transaction.
  //
  // REST exposed ONLY on the cluster-internal listener.
  rpc GrantAdmin (GrantClusterAdminRequest) returns (corelib.operation.Operation) {
    option (google.api.http) = {
      post: "/iam/v1/internal/cluster/admins"
      body: "*"
    };
    option (corelib.api.v1.operation) = {
      metadata: "GrantClusterAdminMetadata"
      response: "ClusterAdminGrant"
    };
    option (corelib.authz.v1.permission)        = "iam.cluster_admins.grant";
    option (corelib.authz.v1.required_relation) = "system_admin";
    option (corelib.authz.v1.scope_extractor)   = {
      object_type:        "cluster"
      from_request_field: "*"
    };
    option (corelib.authz.v1.required_acr_min)  = "2";
  }

  // Revokes cluster-admin from the requested subject. Soft revoke —
  // sets `granted_until = now()` on the active row, keeping history.
  //
  // Two CAS guards run as part of a single atomic UPDATE:
  // self-revoke is rejected (FailedPrecondition
  // `"cannot revoke own cluster admin grant"`) and last-admin revoke is
  // rejected (FailedPrecondition `"cannot revoke last active cluster
  // admin"`). Revoking a non-existent or already-revoked admin returns
  // NotFound (asymmetric with GrantAdmin idempotency).
  //
  // REST exposed ONLY on the cluster-internal listener.
  rpc RevokeAdmin (RevokeClusterAdminRequest) returns (corelib.operation.Operation) {
    option (google.api.http) = {
      delete: "/iam/v1/internal/cluster/admins/{subject_id}"
    };
    option (corelib.api.v1.operation) = {
      metadata: "RevokeClusterAdminMetadata"
      response: "ClusterAdminGrant"
    };
    option (corelib.authz.v1.permission)        = "iam.cluster_admins.revoke";
    option (corelib.authz.v1.required_relation) = "system_admin";
    option (corelib.authz.v1.scope_extractor)   = {
      object_type:        "cluster"
      from_request_field: "*"
    };
    option (corelib.authz.v1.required_acr_min)  = "2";
  }

  // Lists currently-active cluster admins. Sync read; joins
  // `kaname.cluster_admin_grants` (`WHERE granted_until IS NULL`) with
  // `kaname.users` to enrich each entry with subject email / display
  // name and the granter's email. No pagination — admins are expected to be
  // ≤50 in practice.
  //
  // REST exposed ONLY on the cluster-internal listener.
  rpc ListAdmins (ListClusterAdminsRequest) returns (ListClusterAdminsResponse) {
    option (google.api.http) = {
      get: "/iam/v1/internal/cluster/admins"
    };
    option (corelib.authz.v1.permission)        = "iam.cluster_admins.list";
    option (corelib.authz.v1.required_relation) = "system_admin";
    option (corelib.authz.v1.scope_extractor)   = {
      object_type:        "cluster"
      from_request_field: "*"
    };
    option (corelib.authz.v1.required_acr_min) = "1";
  }
}

// GetClusterRequest — singleton; no fields. Cluster id is implicit
// (`cluster_root`).
message GetClusterRequest {}

// GrantClusterAdminRequest — payload for `GrantAdmin` (both twins:
// `InternalClusterService` and `ClusterService`).
message GrantClusterAdminRequest {
  // Subject kind: `USER` or `SERVICE_ACCOUNT`. UNSPECIFIED is treated as
  // `USER` by the transport (REST callers usually omit the field). Any other
  // value returns InvalidArgument on `subject_type` with
  // `"must be 'user' or 'service_account'"`.
  ClusterGrantSubjectType subject_type = 1;

  // Id of the new admin; its form follows the kind: `^usr[0-9a-hjkmnp-tv-z]{17}$`
  // for `USER`, `^sva[0-9a-hjkmnp-tv-z]{17}$` for `SERVICE_ACCOUNT`. Empty →
  // InvalidArgument `"required"`; a form mismatch → InvalidArgument on
  // `subject_id`. A well-formed id with no row → InvalidArgument
  // `"<User|ServiceAccount> <id> not found"`; a subject barred from signing in →
  // FailedPrecondition `"User <id> is blocked"`, `"User <id> is not active"`
  // or `"ServiceAccount <id> is disabled"`.
  string subject_id = 2;
}

// GrantClusterAdminMetadata — Operation.metadata payload. Captures the
// `ClusterAdminGrant.id` immediately so callers can correlate the Operation
// with the row even before `done=true`.
message GrantClusterAdminMetadata {
  // ID of the `cluster_admin_grants` row (existing one when the grant was
  // idempotent, freshly-inserted otherwise).
  string cluster_admin_grant_id = 1;

  // Subject id from the request, echoed for client convenience.
  string subject_id = 2;
}

// RevokeClusterAdminRequest — payload for `RevokeAdmin` (both twins).
message RevokeClusterAdminRequest {
  // Subject kind: `USER` or `SERVICE_ACCOUNT`; UNSPECIFIED is treated as
  // `USER` (the REST path carries only the id — the kind is the `subjectType`
  // query parameter). Other values → InvalidArgument on `subject_type`.
  ClusterGrantSubjectType subject_type = 1;

  // Id of the admin being revoked; its form follows the kind, as in
  // `GrantClusterAdminRequest.subject_id`. Self-revoke → FailedPrecondition
  // `"cannot revoke own cluster admin grant"`; the last active grant →
  // FailedPrecondition `"cannot revoke last active cluster admin"`; no active
  // grant → NotFound `"<User|ServiceAccount> <id> is not an active cluster admin"`.
  string subject_id = 2;
}

// RevokeClusterAdminMetadata — Operation.metadata payload. Mirror of
// `GrantClusterAdminMetadata` for the revoke flow.
message RevokeClusterAdminMetadata {
  // ID of the `cluster_admin_grants` row whose `granted_until` was set.
  string cluster_admin_grant_id = 1;

  // Subject id from the request, echoed for client convenience.
  string subject_id = 2;
}

// ListClusterAdminsRequest — no fields. The list is filtered server-side to
// active grants (`granted_until IS NULL`) and ordered by `granted_at`, then by
// `cluster_admin_grant_id`, both ascending.
message ListClusterAdminsRequest {}

// ListClusterAdminsResponse — denormalized snapshot of currently-active
// admins, ready for direct UI rendering.
message ListClusterAdminsResponse {
  // Active admins. Ordered: by `granted_at`, then by `cluster_admin_grant_id`,
  // both ascending — equal timestamps never yield an unspecified order.
  repeated ClusterAdminEntry admins = 1;
}

// ClusterAdminEntry — denormalized projection of one active
// `cluster_admin_grants` row joined with `kaname.users` for the subject
// and the granter. Used exclusively by `ListAdmins` — the underlying source
// of truth is still `ClusterAdminGrant` (see `cluster_admin_grant.proto`).
//
// `subject_email` / `subject_display_name` / `granted_by_email` are mirror
// fields kept in sync via the join at read time; they are output-only
// (clients must not echo them back as inputs). The subject mirrors are read
// from `kaname.users`, so they are filled for a `USER` subject and stay empty
// for a `SERVICE_ACCOUNT` subject.
message ClusterAdminEntry {
  // ID of the underlying `cluster_admin_grants` row (`cag_<17>`).
  string cluster_admin_grant_id = 1;

  // Subject kind as stored: `USER` or `SERVICE_ACCOUNT`.
  ClusterGrantSubjectType subject_type = 2;

  // Id of the admin: `usr<17>` for `USER`, `sva<17>` for `SERVICE_ACCOUNT`.
  string subject_id = 3;

  // Subject email enriched from `kaname.users`. Filled for `USER`; empty for
  // `SERVICE_ACCOUNT` (no users row) and when the user row is absent
  // (dangling reference, surfaced as empty for graceful UI degradation).
  string subject_email = 4;

  // Subject display name enriched from `kaname.users`. Filled for `USER`
  // (empty when that user has none); empty for `SERVICE_ACCOUNT` and when
  // the user row is absent.
  string subject_display_name = 5;

  // User id of the granter (`usr<17>` for a regular admin, or the literal
  // `"bootstrap"` for the initial bootstrap-seeded admin).
  string granted_by_user_id = 6;

  // Granter email enriched from `kaname.users`. Empty string when
  // `granted_by_user_id == "bootstrap"` or when the granter user row is
  // absent.
  string granted_by_email = 7;

  // Timestamp when the grant was created.
  google.protobuf.Timestamp granted_at = 8;
}
