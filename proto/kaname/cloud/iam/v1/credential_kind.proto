syntax = "proto3";

package kaname.cloud.iam.v1;

option go_package = "github.com/PRO-Robotech/kaname/pkg/api/kaname/cloud/iam/v1;iamv1";

// CredentialKind — ЧЕМ УДОСТОВЕРЕНИЕ СЕБЯ ПРЕДЪЯВЛЯЕТ.
//
// Словарь закрыт. ВЫДАВАЕМЫХ видов ТРИ — KEYPAIR, SECRET, FEDERATED, — потому
// что форм ответа выдачи три, и по виду читатель узнаёт, какое поле ответа
// заполнено:
//
//   вид        | ключевой материал | секрет | чем предъявляется
//   -----------+-------------------+--------+---------------------------------
//   KEYPAIR    | непуст            | пуст   | подписанное утверждение, ключ наш
//   SECRET     | пуст              | непуст | сама строка секрета
//   FEDERATED  | пуст              | пуст   | утверждение ВНЕШНЕГО издателя по
//              |                   |        | перечню доверенных субъектов
//
// «Пусты оба» у FEDERATED — его ОПРЕДЕЛЯЮЩЕЕ свойство, а не пробел в ответе.
// Схлопнуть его в KEYPAIR значило бы завести дискриминатор, который не
// дискриминирует.
//
// LEGACY ОПИСЫВАЕТ, НО НЕ ВЫДАЁТСЯ. Среди уже лежащих строк есть форма без
// ключевого материала и без перечня доверенных субъектов — удостоверение
// прежнего потока. Она существует независимо от того, назвали мы её или нет;
// отнести её к KEYPAIR значило бы объявить видом, требований которого она не
// выполняет. Названный в запросе выдачи ЯВНО, этот вид отвергается ВСЕГДА и при
// любом составе прочих полей: его не производит ни один глагол, и запрос,
// которым его пытаются выпустить, исполнимого исхода не имеет ни при каком
// входе. Предикат снятия элемента словаря: строк этого вида в обеих таблицах
// ноль — исключение живёт, пока у него есть предмет.
//
// У ЛИЧНОСТИ ВИДОВ ТРИ, А НЕ ЧЕТЫРЕ: FEDERATED недостижим by construction — в
// её контракте нет поля, которым он задаётся.
enum CredentialKind {
  // Вид не назван вызывающим. В запросе выдачи разрешается сохранённым
  // поведением: пустой перечень доверенных субъектов ⇒ KEYPAIR, непустой ⇒
  // FEDERATED. В ОТВЕТЕ и в строке ресурса не встречается никогда — вид
  // ЗАПИСЫВАЕТСЯ при вставке, а читателем не вычисляется.
  CREDENTIAL_KIND_UNSPECIFIED = 0;

  // Ключевая пара ES256. Вызывающий сам собирает и подписывает
  // `client_assertion` (RFC 7521/7523) и обменивает его. Роль вида —
  // федерация, подпись утверждения, долгоживущее доверие.
  CREDENTIAL_KIND_KEYPAIR = 1;

  // Однострочный непрозрачный секрет, предъявляемый КАК ЕСТЬ — в
  // `Authorization: Bearer` на крае и в поле пароля докер-полосы. Ни библиотеки
  // JOSE, ни сборки утверждения, ни обмена. Оплачено коротким объявленным
  // сроком, отзывом на предъявлении и узнаваемой маркой.
  CREDENTIAL_KIND_SECRET = 2;

  // Удостоверение предъявляет ВНЕШНИЙ издатель по перечню доверенных субъектов.
  // Ни ключевого материала, ни секрета у нас нет.
  CREDENTIAL_KIND_FEDERATED = 3;

  // Строка прежнего потока. Не выдаётся НИ ОДНИМ глаголом; появляется только
  // обратным заполнением по фактическому содержимому.
  CREDENTIAL_KIND_LEGACY = 4;
}
