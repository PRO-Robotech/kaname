syntax = "proto3";

// InternalInteractiveClientService — Internal-only.
// Registered exclusively on the api-gateway internal mux (cluster-internal
// listener) under `/iam/v1/internal/interactiveClients`; never on the external
// TLS endpoint (ban #6). The dispatcher — not the absence of a route — is what
// keeps it off the outside: `isInternalRoute` is keyed on the (method, path)
// pair and answers 404 for external origin, hiding existence.
//
// WHAT IT MANAGES. The OAuth2 client through which a human completes an
// interactive sign-in ceremony. Registering one is a credential-lifecycle act,
// so it is admin-only and lives behind mTLS + a per-RPC authz Check like every
// other Internal* RPC (security.md: authN+authZ on BOTH listeners).
//
// AUTHENTICATION FLOOR (decision Р4 — no floor is ever lowered).
// `Create` / `Update` / `Delete` declare `required_acr_min = "2"`: they change
// the security posture — a redirect target is where an authorization code is
// delivered, so editing the list redirects credentials. `Get` / `List` declare
// `"1"`: reading a client is not issuing a credential. Every RPC declares its
// floor EXPLICITLY, because the generator's default is "2"
// (protoc-gen-kacho-permissions `DefaultRequiredAcrMin`) and an unstated floor
// would arrive as sensitive by accident rather than by decision.
//
// ASYNC CONTRACT. Mutations return `Operation` (ban #9); `done` means the
// subject of the mutation is durable and is never gated on the visibility of
// anything downstream.
package kaname.cloud.iam.v1;

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "corelib/api/v1/operation.proto";
import "kaname/cloud/iam/v1/interactive_client.proto";
import "kacho/cloud/operation/operation.proto";
import "corelib/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/kaname/pkg/api/kaname/cloud/iam/v1;iamv1";

// InternalInteractiveClientService — admin-tooling for the interactive-login
// client. See the file-level comment for the gate and the async contract.
service InternalInteractiveClientService {
  // Returns the requested InteractiveClient. Sync read; no Operation envelope.
  //
  // A malformed id is rejected synchronously as `INVALID_ARGUMENT` by the
  // first statement of the RPC; a well-formed id with no row is `NOT_FOUND`
  // (direct-read lane — this is iam's own resource).
  //
  // REST exposed ONLY on the cluster-internal listener.
  rpc Get (GetInteractiveClientRequest) returns (InteractiveClient) {
    option (google.api.http) = {
      get: "/iam/v1/internal/interactiveClients/{interactive_client_id}"
    };
    option (corelib.authz.v1.permission)        = "iam.interactive_clients.get";
    option (corelib.authz.v1.required_relation) = "system_admin";
    option (corelib.authz.v1.scope_extractor)   = {
      object_type:        "cluster"
      from_request_field: "*"
    };
    option (corelib.authz.v1.required_acr_min) = "1";
  }

  // Lists InteractiveClients. Sync read, cursor-paginated on `(created_at, id)`.
  //
  // REST exposed ONLY on the cluster-internal listener.
  rpc List (ListInteractiveClientsRequest) returns (ListInteractiveClientsResponse) {
    option (google.api.http) = {
      get: "/iam/v1/internal/interactiveClients"
    };
    option (corelib.authz.v1.permission)        = "iam.interactive_clients.list";
    option (corelib.authz.v1.required_relation) = "system_admin";
    option (corelib.authz.v1.scope_extractor)   = {
      object_type:        "cluster"
      from_request_field: "*"
    };
    option (corelib.authz.v1.required_acr_min) = "1";
  }

  // Registers a new interactive-login client at the identity provider and
  // records it. The provider call happens on the request path and is
  // fail-closed: if the provider is unreachable the mutation ends
  // `UNAVAILABLE` and leaves NO row behind — the name does not stay taken.
  //
  // REST exposed ONLY on the cluster-internal listener.
  rpc Create (CreateInteractiveClientRequest) returns (kacho.cloud.operation.Operation) {
    option (google.api.http) = {
      post: "/iam/v1/internal/interactiveClients"
      body: "*"
    };
    option (corelib.api.v1.operation) = {
      metadata: "CreateInteractiveClientMetadata"
      response: "InteractiveClient"
    };
    option (corelib.authz.v1.permission)        = "iam.interactive_clients.create";
    option (corelib.authz.v1.required_relation) = "system_admin";
    option (corelib.authz.v1.scope_extractor)   = {
      object_type:        "cluster"
      from_request_field: "*"
    };
    option (corelib.authz.v1.required_acr_min) = "2";
  }

  // Updates the mutable fields of an InteractiveClient
  // (`name`, `description`, `labels`, `redirect_uris`,
  // `post_logout_redirect_uris`). Output-only fields are immutable and are
  // rejected by name when named in the mask.
  //
  // REST exposed ONLY on the cluster-internal listener.
  rpc Update (UpdateInteractiveClientRequest) returns (kacho.cloud.operation.Operation) {
    option (google.api.http) = {
      patch: "/iam/v1/internal/interactiveClients/{interactive_client_id}"
      body: "*"
    };
    option (corelib.api.v1.operation) = {
      metadata: "UpdateInteractiveClientMetadata"
      response: "InteractiveClient"
    };
    option (corelib.authz.v1.permission)        = "iam.interactive_clients.update";
    option (corelib.authz.v1.required_relation) = "system_admin";
    option (corelib.authz.v1.scope_extractor)   = {
      object_type:        "cluster"
      from_request_field: "*"
    };
    option (corelib.authz.v1.required_acr_min) = "2";
  }

  // Removes the client at the identity provider and its row. Idempotent —
  // deleting an already-absent client does not differ in code from the first
  // delete.
  //
  // REST exposed ONLY on the cluster-internal listener.
  rpc Delete (DeleteInteractiveClientRequest) returns (kacho.cloud.operation.Operation) {
    option (google.api.http) = {
      delete: "/iam/v1/internal/interactiveClients/{interactive_client_id}"
    };
    option (corelib.api.v1.operation) = {
      metadata: "DeleteInteractiveClientMetadata"
      response: "InteractiveClient"
    };
    option (corelib.authz.v1.permission)        = "iam.interactive_clients.delete";
    option (corelib.authz.v1.required_relation) = "system_admin";
    option (corelib.authz.v1.scope_extractor)   = {
      object_type:        "cluster"
      from_request_field: "*"
    };
    option (corelib.authz.v1.required_acr_min) = "2";
  }
}

message GetInteractiveClientRequest {
  // ID of the InteractiveClient to return.
  string interactive_client_id = 1;
}

message ListInteractiveClientsRequest {
  // The maximum number of results per page. 0 → default; >1000 is REJECTED,
  // not clamped (api-conventions).
  int64 page_size = 1;

  // Opaque cursor from a previous response.
  string page_token = 2;

  // A filter expression. Supports filtering by [InteractiveClient.name].
  string filter = 3;
}

message ListInteractiveClientsResponse {
  // The page of clients.
  repeated InteractiveClient interactive_clients = 1;

  // Cursor for the next page; empty when the page is the last one.
  string next_page_token = 2;
}

message CreateInteractiveClientRequest {
  // Name of the client. Unique cluster-wide. 1-63 characters.
  string name = 1;

  // Optional description.
  string description = 2;

  // Resource labels as `key:value` pairs.
  map<string, string> labels = 3;

  // Where the provider may redirect the authorization code. Required, and
  // every entry must be an absolute `https://` URL.
  repeated string redirect_uris = 4;

  // Optional post-logout redirect targets; same `https://` rule when present.
  repeated string post_logout_redirect_uris = 5;

  // NOTE — there is deliberately NO `audiences` field (decision Р2). The
  // audience is stamped by iam from its own configuration and echoed
  // output-only. Accepting it would be a field that cannot be set correctly;
  // accepting it and ignoring it is forbidden outright (api-conventions,
  // "принято-и-проигнорировано").
}

message UpdateInteractiveClientRequest {
  // ID of the InteractiveClient to update.
  string interactive_client_id = 1;

  // Fields to update. Empty mask → full-object PATCH over mutable fields;
  // immutable fields present in the body are silently ignored. A mask naming
  // an immutable field is rejected BY NAME; a mask naming an unknown field is
  // rejected against the known-set.
  google.protobuf.FieldMask update_mask = 2;

  // New name.
  string name = 3;

  // New description.
  string description = 4;

  // New labels (replace semantics).
  map<string, string> labels = 5;

  // New redirect targets (replace semantics).
  repeated string redirect_uris = 6;

  // New post-logout redirect targets (replace semantics).
  repeated string post_logout_redirect_uris = 7;
}

message DeleteInteractiveClientRequest {
  // ID of the InteractiveClient to delete.
  string interactive_client_id = 1;
}
