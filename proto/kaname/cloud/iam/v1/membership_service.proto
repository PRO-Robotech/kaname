syntax = "proto3";

package kaname.cloud.iam.v1;

import "google/api/annotations.proto";
import "corelib/api/v1/operation.proto";
import "corelib/authz/v1/authz_options.proto";
import "corelib/operation/operation.proto";
import "kaname/cloud/iam/v1/membership.proto";

option go_package = "github.com/PRO-Robotech/kaname/pkg/api/kaname/cloud/iam/v1;iamv1";

// MembershipService — принадлежность человека аккаунту: два чтения на
// аккаунт-скоупных путях и ОДНО создание на плоской коллекции.
//
// # Поверхность ТРЁХАДРЕСНАЯ, и плоская коллекция несёт ТОЛЬКО создание
//
//   POST /iam/v1/memberships                                  — создание
//   GET  /iam/v1/accounts/{account_id}/memberships[/{id}]     — чтения аккаунта
//   GET  /iam/v1/me/memberships                               — свой список
//
// Чтения на `/iam/v1/memberships` НЕ заводятся НИКОГДА — «раз уж глагол
// рядом» не довод. Идентификатор членства вычислим офлайн из пары «человек ×
// аккаунт», поэтому плоское чтение по нему было бы вопросом «в каких аккаунтах
// состоит этот человек», заданным арифметикой вместо параметра (IAM-ID-2 §2.2,
// уровень 4). Держит это полоса C гейта IAM-ID-2-15, а не эта строка.
//
// # Аккаунт ОБЯЗАТЕЛЕН на каждом глаголе, и это несущее свойство, а не удобство
//
// Оба чтения отвечают ТОЛЬКО про названный аккаунт: он приходит входом и стоит в
// условии отбора запроса к хранилищу, а не в проверке после чтения. Рассказать о
// чужих аккаунтах эта поверхность не может by construction — она их не
// спрашивает. Это сильнее фильтрации: фильтр можно забыть, отсутствующий
// параметр забыть нельзя. У создания аккаунт приходит ПОЛЕМ ТЕЛА — и это то,
// про что край спрашивает модель прав (`scope_extractor` ниже).
//
// Перечень аккаунтов человека — факт о ТРЕТЬИХ СТОРОНАХ (в каких организациях он
// работает, куда его позвали), и права видеть его у распорядителя одного аккаунта
// нет. Чтение «все мои членства» существует отдельно, гейтится личностью и
// параметра человека не имеет вовсе.
//
// # Полоса разграничения — ПООБЪЕКТНЫЙ ГЕЙТ КРАЯ, а не сужение на данных
//
// У запроса есть ОДИН объект, про который можно задать ОДИН вопрос — аккаунт из
// пути, — поэтому применим пообъектный гейт края. Полоса `scope_filtered` здесь
// НЕ объявляется: она означала бы снятие пообъектной проверки края и замену её
// кодом, который можно забыть в следующей ветке, — второй замок к уже закрытой
// двери, ведь строки и так отбираются по аккаунту из пути.
//
// Наблюдаемое следствие, названное, а не умолчанное: у вызывающего БЕЗ права на
// аккаунт край отвечает РАНЬШЕ сервиса, поэтому негодная пагинация даёт отказ
// прав, а не 400. Это задокументированная authz-first полоса.
//
// # Отношение — `viewer` на объекте аккаунта, и выбор доказан контролем ПО ТИРУ
//
// `viewer` выводится через `editor` и `admin`, то есть накрывает ДЕЛЕГИРОВАННОГО
// распорядителя аккаунта — адресата, ради которого чтение и заводится.
// Глагольные отношения объекта аккаунта (`v_get`/`v_list`) тир распорядителя
// НАМЕРЕННО не читают: они про сам объект аккаунта, границу его области. Выбор
// `v_list` прошёл бы все прочие проверки каталога и оставил бы делегированного
// распорядителя без чтения членств в своём аккаунте.
//
// Подстановочным кортежем `viewer` @ `account` НЕ выполняется: тип объявляет
// `[user, service_account, group#member] or editor`, члена `user:*` в нём нет.
service MembershipService {
  // Creates a Membership: invites a person (by email) into the named Account.
  //
  // # Это ПЕРЕЕЗД глагола приглашения на ресурс членства (IAM-ID-1 §4, S3.2)
  //
  // Поток тот же, что у `UserService.Invite`, и до стадии S4 оба глагола живут
  // рядом. Два вызова на одну пару «человек × аккаунт» — любым из глаголов, в
  // любом порядке — дают ОДНО членство: пара уникальна полностью
  // (`UNIQUE(user_id, account_id)`), идентификатор членства вычисляется из неё
  // неизменяемой функцией и потому ПЕРЕИСПОЛЬЗУЕТСЯ. Повтор идемпотентен и
  // отвечает той же строкой.
  //
  // # Что заводится, сказано по ветвям, потому что обе обманчивы
  //
  //   - почта платформе НЕИЗВЕСТНА → одна строка человека в состоянии
  //     «приглашён» и одно членство `PENDING`. Письмо приглашения уходит РОВНО
  //     ОДНО на пару (аккаунт, почта) — на заведении строки, не на каждом вызове;
  //   - почта ИЗВЕСТНА → второй строки НЕ заводится (глобальный ключ почты):
  //     тому же человеку добавляется членство в названном аккаунте, и если он
  //     уже входил — сразу `ACTIVE`. Шага принятия нет: первый вход активирует
  //     ВСЕ приглашённые членства разом (IAM-ID-2 §2.4а).
  //
  // # Response — `Membership`, metadata — `CreateMembershipMetadata`
  //
  // Идентификатор членства берётся из `response` после `done` и `!error` —
  // он вычисляется из пары в транзакции и до неё не известен. `metadata.user_id`
  // — строка человека, если почта известна на момент принятия, иначе
  // идентификатор, который получит новая строка (см. комментарий у сообщения).
  //
  // # Разграничение — то же, что у приглашения, и переехало вместе с полем
  //
  // `account_id` — объект, про который гейт задаёт вопрос: без него вызов
  // unscoped и fail-closed (IAM-ID-1 §1.5 п. 2). Все три опции ниже — не
  // украшение, а условие работоспособности глагола. Повышенный уровень входа
  // (acr=2): это поверхность ВЫДАЧИ ПРАВ, а не рутинный жизненный цикл —
  // `project_id` + `role_id` заводят привязку доступа АТОМАРНО с членством,
  // то есть глагол выдаёт ровно то, что выдаёт `AccessBindingService.Create`,
  // и порог ниже её порога был бы обходом step-up через более дешёвую дверь.
  rpc Create (CreateMembershipRequest) returns (corelib.operation.Operation) {
    option (google.api.http) = {
      post: "/iam/v1/memberships"
      body: "*"
    };
    option (corelib.api.v1.operation) = {
      metadata: "CreateMembershipMetadata"
      response: "Membership"
    };
    option (corelib.authz.v1.permission)        = "iam.memberships.create";
    option (corelib.authz.v1.required_relation) = "editor";
    option (corelib.authz.v1.scope_extractor)   = {
      object_type:        "account"
      from_request_field: "account_id"
    };
    option (corelib.authz.v1.required_acr_min) = "2";
  }

  // Returns the specified Membership within the named Account.
  //
  // Well-formed идентификатор членства ЧУЖОГО аккаунта неотличим от
  // несуществующего: оба — `NOT_FOUND` с одним и тем же текстом контракт-тона.
  // Различимый ответ выдал бы ровно то, что сокрытие и должно было закрыть —
  // тем более что идентификатор членства вычислим офлайн из пары
  // «человек × аккаунт», то есть перебирать для оракула ничего не надо.
  rpc Get (GetMembershipRequest) returns (Membership) {
    option (google.api.http) = { get: "/iam/v1/accounts/{account_id}/memberships/{membership_id}" };
    option (corelib.authz.v1.permission)        = "iam.memberships.get";
    option (corelib.authz.v1.required_relation) = "viewer";
    option (corelib.authz.v1.scope_extractor)   = {
      object_type:        "account"
      from_request_field: "account_id"
    };
    option (corelib.authz.v1.required_acr_min) = "1";
  }

  // Retrieves the list of Memberships within the named Account.
  rpc List (ListMembershipsRequest) returns (ListMembershipsResponse) {
    option (google.api.http) = { get: "/iam/v1/accounts/{account_id}/memberships" };
    option (corelib.authz.v1.permission)        = "iam.memberships.list";
    option (corelib.authz.v1.required_relation) = "viewer";
    option (corelib.authz.v1.scope_extractor)   = {
      object_type:        "account"
      from_request_field: "account_id"
    };
    option (corelib.authz.v1.required_acr_min) = "1";
  }
}

message CreateMembershipRequest {
  // Аккаунт, в который приглашают. ОБЯЗАТЕЛЕН: пустое значение — синхронный
  // `INVALID_ARGUMENT` с именем поля, до чеканки операции. Это и есть объект,
  // про который край спрашивает модель прав.
  string account_id = 1;

  // Почта приглашаемого. ОБЯЗАТЕЛЬНА; сравнивается без учёта регистра.
  string email = 2;

  // Отображаемое имя для СВЕЖЕЙ строки человека (необязательно; пусто —
  // локальная часть почты). Человеку, который в платформе уже есть, имя этим
  // полем НЕ переписывается — приглашающий не вправе его менять.
  string display_name = 3;

  // Необязательная пара: проект аккаунта и роль, выдаваемая приглашённому на
  // этом проекте АТОМАРНО с членством. Оба либо заданы, либо пусты; проект
  // обязан принадлежать `account_id`, роль — быть назначаемой на нём (тот же
  // вопрос, что задаёт `AccessBindingService.Create`).
  string project_id = 4;
  string role_id = 5;
}

message CreateMembershipMetadata {
  // Аккаунт, в который приглашают. Известен ДО исполнения.
  string account_id = 1;

  // Человек, чьё членство заводится. У почты, ИЗВЕСТНОЙ платформе на момент
  // принятия, — идентификатор её строки (строка у человека одна, глобальный
  // ключ почты); у неизвестной — идентификатор, который получит новая строка.
  // Арбитр остаётся транзакция: если тот же человек появился между принятием
  // и исполнением (конкурентный первый вход), строка получила другой
  // идентификатор, и действующий несёт `response`. Идентификатор ЧЛЕНСТВА
  // здесь не называется вовсе — он вычисляется из пары в транзакции; читать его
  // надо из `response` после `done` и `!error`, иначе публикуется фантом.
  string user_id = 2;
}

message GetMembershipRequest {
  // Аккаунт, в котором читается членство. ОБЯЗАТЕЛЕН: он и есть объект, про
  // который край спрашивает модель прав, и он же стоит в условии отбора.
  string account_id = 1;

  // Идентификатор членства, форма `mbr-<17>`.
  string membership_id = 2;
}

message ListMembershipsRequest {
  // Аккаунт, чьи членства перечисляются. ОБЯЗАТЕЛЕН — см. комментарий службы.
  string account_id = 1;

  // The maximum number of results per page to return. Default value: 50.
  // Значение вне [0..1000] ОТВЕРГАЕТСЯ, а не подрезается.
  int64 page_size = 2;

  // Page token, opaque. Негодный токен отвергается, а не игнорируется.
  string page_token = 3;

  // Ровно один терм из белого списка: `userId="usr…"`.
  //
  // Оператор — только равенство. Подстрочный поиск (`CONTAINS`) грамматика
  // разбирает, но эта поверхность его ОТВЕРГАЕТ явно: возможности искать
  // человека по части идентификатора никто не заводил, у неё нет ни кейса, ни
  // индекса, и молча свести её к равенству значило бы ответить уверенно и
  // неверно.
  //
  // Терм действует ВНУТРИ названного аккаунта — оракула из него не возникает.
  string filter = 4;
}

message ListMembershipsResponse {
  // Членства названного аккаунта.
  //
  // Это НАБОР: порядок элементов определяется курсором `(created_at, id)` и
  // значимым НЕ является. Вызывающий обязан сверять состав, а не индексы.
  repeated Membership memberships = 1;

  // Токен следующей страницы; пусто — страница последняя.
  //
  // Вычисляется ТОЛЬКО по строкам названного аккаунта: существование строк вне
  // него он не различает ничем.
  string next_page_token = 2;
}
