# inputs.yaml — ведомость ВХОДНЫХ контрактов: тех, что лежат под `proto/` не как
# предмет службы, а как операнд её операторов `import`.
#
# ─────────────────────────────────────────────────────────────────────────────
# ЗАЧЕМ ВЕДОМОСТЬ, А НЕ ПРОСТО ФАЙЛЫ
#
# Оператор `import` резолвится ФАЙЛОМ, а не модулем: без этих шести файлов сорок
# один контракт службы не компилируется нигде, кроме дерева, откуда они взяты.
# Значит копия в дереве службы неизбежна — и вместе с ней неизбежно ДВА МЕСТА ОБ
# ОДНОМ ПРЕДМЕТЕ. Ведомость существует, чтобы расхождение этих двух мест было
# наблюдаемым, а не молчаливым: у каждого входа записан отпечаток содержимого и
# координата источника, а гейт
# `internal/contracthome/TestVendoredInputContractsMatchTheirLedger` пересчитывает
# отпечатки и падает на первом же расхождении.
#
# ─────────────────────────────────────────────────────────────────────────────
# ЧЕГО ВЕДОМОСТЬ НЕ ДЕЛАЕТ — НАЗВАНО ПРЯМО
#
# Она ловит правку копии ЗДЕСЬ. Она НЕ ловит правку ИСТОЧНИКА: сверки с деревом
# источника не ведёт никто, потому что дерева источника в прогоне проб этого
# репозитория нет by construction. Это остаток, а не обещание, и он не нов —
# `.proto`-исходники фундамента физически лежат в дереве платформы, тогда как их
# заглушки публикует модуль фундамента, и сверки этих двух тоже не ведёт никто
# (kacho#2616 §«Остаток по этой оси»). Держателем такой сверки может быть только
# сторона, видящая оба дерева, — конвейер платформы либо конвейер фундамента.
#
# ─────────────────────────────────────────────────────────────────────────────
# ЗАГЛУШКИ ЭТИХ ФАЙЛОВ ЗДЕСЬ НЕ ПОРОЖДАЮТСЯ
#
# Каждый вход несёт `stubs:` — модуль, который публикует его заглушки. Второе
# порождение в модуль службы дало бы двойную регистрацию дескриптора: паника
# инициализации у транзитивного потребителя. Охват генерации держит гейт
# `TestGenerationProducesOnlyThisServicesOwnContracts`.

# source — дерево и ревизия, из которых взята копия. Ревизия ПРИБИТА: «последний
# ствол» перестал бы быть адресом на следующем же вливании.
#
# ЭТО ЕДИНСТВЕННАЯ РЕВИЗИЯ ПЛАТФОРМЫ, КОТОРУЮ НАЗЫВАЕТ ЭТОТ КАТАЛОГ. Прежняя
# редакция предупреждала, что она и ПИН МОДУЛЯ ПЛАТФОРМЫ в `go.mod` — разные
# величины, расходящиеся на два коммита. Пина больше нет: ступень S0a
# (kacho#2617, исход C) сняла ребро `kaname → kacho` целиком, Go-пакеты службы
# публикует её собственный модуль. Сравнивать здесь не с чем, и предупреждение
# снято вместе со своим предметом. Ревизия ниже говорит ровно одно: из какого
# дерева взяты ИСХОДНИКИ входных контрактов.
#
# РЕВИЗИЯ ПЕРЕНАЗНАЧЕНА ВМЕСТЕ С ПЕРЕЕЗДОМ ФОРМЫ ОПЕРАЦИИ (kacho#2601), и прежняя
# была неверна уже до него: копия `corelib/authz/v1/authz_options.proto` лежала
# с отпечатком 26510bf9…, а в `ba27afe` у этого пути ed734abf… — вход взяли из
# более поздней ревизии и адрес не поправили. Ниже названа ревизия, в которой
# ВСЕ ШЕСТЬ путей дают ровно записанные отпечатки: коммит ветки платформы,
# принёсший контракт под нейтральный корень. После её вливания адрес
# переводится на коммит ствола тем же заходом, что снимает запись окна в
# ведомости переименований каталога (`internal/check/catalog_copy_parity.go`).
