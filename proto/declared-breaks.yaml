# ОБЪЯВЛЕННЫЕ ЛОМАЮЩИЕ ИЗМЕНЕНИЯ КОНТРАКТА СЛУЖБЫ.
#
# Конвейер зовёт `buf breaking --against …#branch=main` и роняет прогон на любом
# разрыве. Осознанный разрыв проходит ТОЛЬКО через этот перечень, и запись живёт
# РОВНО ПОКА у неё есть предмет: находка вне перечня — красное, запись без
# находки — ТОЖЕ красное.
#
# Этим адъюдикация отличается от `breaking.ignore` в `buf.yaml`: там исключение
# по пути ослепляет проверку на целом файле НАВСЕГДА и не истекает никогда.
#
# НОРМАЛЬНОЕ СОСТОЯНИЕ ПЕРЕЧНЯ НА СТВОЛЕ — ПУСТО, и это не пожелание, а
# следствие: на стволе база сравнения — сам ствол, находок ноль по построению,
# значит ни у одной записи предмета быть не может. Запись живёт ровно от
# объявления разрыва в ветке до вливания этой ветки.
#
# Разрыв, ставший историей, обязан быть отсюда удалён. Держит это не память
# исполнителя, а сам конвейер: адъюдикация идёт И НА PUSH В СТВОЛ, поэтому
# истёкшая запись называется поимённо там же и тогда же, где её предмет истёк, —
# на первом прогоне ствола после вливания.
#
# ПОЛЯ ОБЯЗАТЕЛЬНЫ ВСЕ ПЯТЬ, и у каждого своя причина:
#   rule    — идентификатор правила buf (`RPC_NO_DELETE`); без него запись не
#             сопоставима ни с чем;
#   path    — путь к `.proto` относительно этого каталога; без него запись
#             прощала бы разрыв в ЛЮБОМ файле;
#   symbol  — имя снятого символа; buf называет его в сообщении в кавычках;
#   reason  — причина; объявление без причины нечем оспорить при снятии;
#   issue   — РАЗРЕШИМАЯ ссылка (`kaname#35` либо полный URL): по голому `#35`
#             объявление не может истечь даже в принципе.
#
# СНЯТИЕ ФАЙЛА ЦЕЛИКОМ (`FILE_NO_DELETE`) объявляется так же, но `path` и
# `symbol` у него СОВПАДАЮТ — и это не описка. Предмет такой находки ровно один
# (сам файл), buf называет его в сообщении в кавычках, а поля пути у неё не
# печатает вовсе: указывать не на что.
#
#   - rule: FILE_NO_DELETE
#     path: kaname/cloud/iam/v1/user_token_service.proto
#     symbol: kaname/cloud/iam/v1/user_token_service.proto
#     reason: служба больше не выдаёт токен этим глаголом, полоса снята целиком
#     issue: kaname#35

breaks:
  # АВТОРИТЕТ ВЕЛИЧИН УХОДИТ ИЗ СЛУЖБЫ ДОСТУПА ЦЕЛИКОМ — решение владельца
  # 2026-09-06, задача PRO-Robotech/kacho#2117, приёмка KAN-QUOTA-1 стадия S4.
  #
  # Порядок соблюдён и ПРОВЕРЕН ЗАМЕРОМ, а не памятью: снятие отвечающего
  # допустимо лишь после того, как потребители перестали спрашивать. На стволе
  # платформы (PRO-Robotech/kacho@546d5b08d7) все пять — vpc, compute, nlb,
  # registry, storage — объявляют `quota.authority: "not-deployed"`, а
  # `quotaAuthority: true` в профилях умбреллы даёт НОЛЬ (было 16). Флип посажен
  # задачей kacho#2596, закрытой 2026-09-12.
  #
  # СНЯТЫ ТРИ ФАЙЛА, А НЕ ОТДЕЛЬНЫЕ СИМВОЛЫ, и `path` совпадает с `symbol`
  # намеренно: предмет находки FILE_NO_DELETE ровно один — сам файл.
  - rule: FILE_NO_DELETE
    path: kaname/cloud/iam/v1/limit.proto
    symbol: kaname/cloud/iam/v1/limit.proto
    reason: |
      сообщения авторитета величин (Limit, EffectiveLimit, LimitChange и три
      метаданных операций) сняты вместе с модулем: служба доступа отвечает
      «кому что разрешено», а не «сколько чего можно завести»
    issue: https://github.com/PRO-Robotech/kacho/issues/2117
  - rule: FILE_NO_DELETE
    path: kaname/cloud/iam/v1/limit_service.proto
    symbol: kaname/cloud/iam/v1/limit_service.proto
    reason: |
      арендаторская поверхность авторитета величин (LimitService, пять глаголов)
      снята: назначать потолки службе доступа больше нечем и незачем
    issue: https://github.com/PRO-Robotech/kacho/issues/2117
  - rule: FILE_NO_DELETE
    path: kaname/cloud/iam/v1/internal_limit_service.proto
    symbol: kaname/cloud/iam/v1/internal_limit_service.proto
    reason: |
      служебная поверхность авторитета (InternalLimitService, семь глаголов,
      включая Resolve и ListChangedSince) снята; пять её вызывающих в платформе
      перестали спрашивать домен величин до этого изменения (kacho#2596)
    issue: https://github.com/PRO-Robotech/kacho/issues/2117
