# ОБЪЯВЛЕННЫЕ ЛОМАЮЩИЕ ИЗМЕНЕНИЯ КОНТРАКТА СЛУЖБЫ.
#
# Конвейер зовёт `buf breaking --against …#branch=main` и роняет прогон на любом
# разрыве. Осознанный разрыв проходит ТОЛЬКО через этот перечень, и запись живёт
# РОВНО ПОКА у неё есть предмет: находка вне перечня — красное, запись без
# находки — ТОЖЕ красное.
#
# Этим адъюдикация отличается от `breaking.ignore` в `buf.yaml`: там исключение
# по пути ослепляет проверку на целом файле НАВСЕГДА и не истекает никогда.
#
# НОРМАЛЬНОЕ СОСТОЯНИЕ ПЕРЕЧНЯ НА СТВОЛЕ — ПУСТО, и это не пожелание, а
# следствие: на стволе база сравнения — сам ствол, находок ноль по построению,
# значит ни у одной записи предмета быть не может. Запись живёт ровно от
# объявления разрыва в ветке до вливания этой ветки.
#
# Разрыв, ставший историей, обязан быть отсюда удалён. Держит это не память
# исполнителя, а сам конвейер: адъюдикация идёт И НА PUSH В СТВОЛ, поэтому
# истёкшая запись называется поимённо там же и тогда же, где её предмет истёк, —
# на первом прогоне ствола после вливания.
#
# ПОЛЯ ОБЯЗАТЕЛЬНЫ ВСЕ ПЯТЬ, и у каждого своя причина:
#   rule    — идентификатор правила buf (`RPC_NO_DELETE`); без него запись не
#             сопоставима ни с чем;
#   path    — путь к `.proto` относительно этого каталога; без него запись
#             прощала бы разрыв в ЛЮБОМ файле;
#   symbol  — символ разрыва в форме ниже; решатель печатает его в координате
#             каждого разрыва вне перечня, и запись берёт его оттуда дословно;
#   reason  — причина; объявление без причины нечем оспорить при снятии;
#   issue   — РАЗРЕШИМАЯ ссылка (`kaname#35` либо полный URL): по голому `#35`
#             объявление не может истечь даже в принципе.
#
# ФОРМА СИМВОЛА (kaname#474). Где buf называет объемлющий символ
# (`on message`, `on enum`, `on service`), символ — `<контейнер>.<предмет>`, а
# предмет — первое имя в кавычках до контейнера:
#
#   правило                              сообщение buf                                  symbol
#   FIELD_NO_DELETE, FIELD_SAME_*        field "3" with name "x" on message "Client"    Client.3
#   ENUM_VALUE_NO_DELETE, _SAME_NAME     enum value "4" on enum "CredentialKind"        CredentialKind.4
#   RPC_NO_DELETE, RPC_SAME_*            RPC "Get" on service "RoleService"             RoleService.Get
#   RESERVED_MESSAGE_NO_DELETE           reserved name "x" on message "Account"         Account.x
#   RESERVED_MESSAGE_NO_DELETE           reserved range "[7]" on message "Account"      Account.[7]
#   MESSAGE_SAME_REQUIRED_FIELDS         Message "M" had required field "2"             M.2
#
# У поля и значения перечисления предмет — НОМЕР: имени значения buf не печатает
# вовсе, а у поля номер есть в каждой форме сообщения, имя — не в каждой. Где
# контейнера в сообщении нет, символ — первое имя в кавычках (снятое сообщение,
# перечисление, служба, параметр); у снятия файла — путь.
#
# ЗАПИСЬ ПРОЩАЕТ РОВНО ОДИН РАЗРЫВ. Запись без контейнера (`CredentialKind`,
# `page_size`) не прощает ничего: она не говорит, какое значение или чьё поле
# снято. Два разрыва, которые символ не различает (параметр двух сообщений
# одного файла, одноимённые вложенные сообщения), объявляются двумя записями.
#
# СНЯТИЕ ФАЙЛА ЦЕЛИКОМ (`FILE_NO_DELETE`) объявляется так же, но `path` и
# `symbol` у него СОВПАДАЮТ — и это не описка. Предмет такой находки ровно один
# (сам файл), buf называет его в сообщении в кавычках, а поля пути у неё не
# печатает вовсе: указывать не на что.
#
#   - rule: FILE_NO_DELETE
#     path: kaname/cloud/iam/v1/user_token_service.proto
#     symbol: kaname/cloud/iam/v1/user_token_service.proto
#     reason: служба больше не выдаёт токен этим глаголом, полоса снята целиком
#     issue: kaname#35

# ПЕРЕЧЕНЬ ПУСТ, И ЭТО ЦЕЛЬ, А НЕ ПРОСТОЙ (2026-09-13).
#
# Три записи авторитета величин сняты этим изменением: база сравнения — ствол,
# контрактов величин там больше нет, `buf breaking` находит НОЛЬ разрывов, и
# решатель назвал каждую запись потерявшей предмет. Послабление, которому нечего
# прощать, есть находка — механизм сработал ровно так, как задуман.
#
# Предикат перемера (форма конвейера, база — ствол на github):
#
#     cd proto && buf breaking \
#       --against "https://github.com/PRO-Robotech/kaname.git#branch=main,subdir=proto" \
#       --error-format=json | <решатель> proto/declared-breaks.yaml
#
# → «находок разобрано 0 · записей перечня 0 · записей без предмета 0», код 0.
#
# Пустой перечень решатель ПРОХОДИТ, а не роняет: отказ на достижении цели
# подталкивал бы держать запись ради зелёного.

# ЗАПИСИ kacho#2601 СНЯТЫ — форма операции под именем фундамента (2026-09-15).
#
# ПРЕДИКАТ СНЯТИЯ ИСПОЛНЕН. Ветка влита в ствол (#98, `40bd49a3`), база
# сравнения поднялась, и решатель назвал потерявшей предмет каждую из 52
# записей. Проверено опытом в обе стороны (форма конвейера, тот же решатель):
#
#   база — ствол до вливания (прогон ветки и её конвейер): находок 53, записей 52, объявлено и найдено 53
#   база — ствол после вливания (`40bd49a3`): находок 0, записей 52 — без предмета 52
#
# Разбор сохранён — он переживает сами записи. Контракт формы операции назван
# корнем фундамента (`kacho.cloud.operation` → `corelib.operation`); здесь он
# лежит входом операторов `import`, и снятие прежнего входа дало одно
# `FILE_NO_DELETE`. Остальные 52 находки — смена ТИПА: ответ 43 глаголов и поле
# `operations` девяти сообщений. Проволочной несовместимости не было: полное
# имя сообщения не участвует ни в двоичном кодировании, ни в JSON, и в
# `google.protobuf.Any` операцию не упаковывает ни одна служба. Записей было
# 52 при 53 находках: решатель судит символ строгим равенством, а два
# сообщения `account_service.proto` делили тройку «правило + файл + символ».
# С kaname#474 так больше не бывает: символ поля несёт сообщение, и запись
# прощает ровно один разрыв — на те 53 находки понадобилось бы 53 записи.
# ЗАПИСЬ О ПОЛЕ СЕССИИ «ТРЕБОВАНИЕ СМЕНИТЬ ПАРОЛЬ» СНЯТА — разрыв стал историей
# (2026-09-17). Решение оркестратора по PRO-Robotech/kacho#2697 (исход 1:
# завершение восстановления остаётся ОДНИМ обращением): номер 8 и имя
# `password_change_required` зарезервированы в сообщении `HumanSession`
# (kaname#201, PR #228). Производителя значения `true` у поля не было ни одного
# (`git grep -n 'PasswordChangeRequired: *true' -- '*.go' ':!*_test.go'` → 0 до
# снятия); читатели службы сняты тем же изменением, читатель края платформы —
# своей задачей после подъёма пина (kacho#2707).
#
# ПРЕДИКАТ СНЯТИЯ ЗАПИСИ ИСПОЛНЕН: линия влита в ствол (MR #266, `16b5cade`),
# база сравнения несёт `reserved`, и решатель назвал запись потерявшей предмет
# на первом же прогоне после посадки («записей без предмета 1», rc=1 —
# MR #270, прогон 35203684548). Запись снята тем изменением, которое правит
# этот перечень: послабление, которому нечего прощать, — находка.
