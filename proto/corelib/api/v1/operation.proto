syntax = "proto3";

package corelib.api.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/PRO-Robotech/corelib/api/corelib/api/v1;apiv1";

// Разметка длящейся операции — словарь, которым КАЖДЫЙ домен помечает свои
// глаголы.
//
// ПОЧЕМУ ФАЙЛ ЛЕЖИТ ПОД НЕЙТРАЛЬНЫМ КОРНЕМ (задача #2395, форма #2089)
// --------------------------------------------------------------------------
// Словарь не принадлежит НИ ОДНОМУ из двух продуктов: платформа размечает им
// свои контракты, служба доступа — свои, и ни одна сторона не является для
// другой источником. Пока он лежал под корнем платформы, 17 контрактов
// выносимой службы зависели от дерева платформы РАДИ ОДНОЙ РАЗМЕТКИ — стрелка
// против целевой раскладки, в которой каждый продукт смотрит на фундамент и ни
// один на другой продукт. Под `corelib/` обе стороны смотрят на него ВНИЗ, и
// разметка не заводит ребра между корнями продуктов вовсе.
//
// Своих потребителей файл не называет намеренно: нейтральный словарь,
// перечисляющий, кто им пользуется, перестаёт быть нейтральным в день, когда
// перечень меняется.
//
// ИМЯ ПАКЕТА. Взят корневой обмен `kacho.cloud` → `corelib`, а не описательное
// `corelib.operation.v1`: последнее занято по смыслу контрактом РЕСУРСА
// операции (`kacho.cloud.operation.v1`), который тоже объявлен классом
// `corelib` и придёт под это имя своим переездом. Два разных предмета под одним
// именем развели бы читателя молча.
//
// ФУНДАМЕНТ ОПУБЛИКОВАН, И `go_package` ВЫШЕ УЖЕ НАЗЫВАЕТ ЕГО. Модуль —
// `github.com/PRO-Robotech/corelib`, закреплён `go.mod` платформы; заглушки этого
// файла БЕРУТСЯ из него и здесь не порождаются (`proto/buf.gen.yaml` исключает
// класс фундамента из входа, поэтому второго пакета, регистрирующего это же имя
// файла, не появляется).
//
// Здесь стояло «путь Go-импорта по-прежнему несёт модуль монорепо: фундамент
// отдельным модулем ещё не опубликован». Утверждение пережило свой предмет в день
// публикации модуля, а это ЕДИНСТВЕННОЕ место, где читатель узнаёт, окончательна
// ли координата, — то есть сверявшийся перед записью импорта получал обратное
// истине. Координата proto, которую записывает у себя каждый импортёр, не менялась
// и окончательна.
//
// НОМЕР РАСШИРЕНИЯ ПРИ ПЕРЕЕЗДЕ НЕ МЕНЯЛСЯ, И ЭТО НЕСУЩЕЕ. Два блока
// `extend google.protobuf.MethodOptions` с одним номером в одном образе
// сталкиваются при РЕГИСТРАЦИИ ДЕСКРИПТОРОВ — это отказ времени выполнения, а
// не ошибка сборки. Поэтому здесь ПЕРЕЕЗД, а не копия: второго объявления
// номера 87334 в дереве нет.
extend google.protobuf.MethodOptions { Operation operation = 87334; }

// Operation is annotation for rpc that returns longrunning operation, describes
// message types that will be returned in metadata [google.protobuf.Any], and
// in response [google.protobuf.Any] (for successful operation).
message Operation {
  // Optional. If present, rpc returns operation which metadata field will
  // contains message of specified type.
  string metadata = 1; // Optional.

  // Required. rpc returns operation, in case of success response will contains message of
  // specified field.
  string response = 2; // Required.
}
