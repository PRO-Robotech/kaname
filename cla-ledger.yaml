# Ведомость соглашения о вкладе. Её судит гейт services/iam/tools/clagate;
# правила и текст самого соглашения — services/iam/CLA.md.
#
# Единица счёта здесь АДРЕС, а не имя: у одного человека имя пишется
# по-разному (в истории домена один автор представлен двумя написаниями при
# одном адресе), поэтому отбор по имени мерил бы соглашение об именовании,
# а не личность.
#
# Причина (note) обязательна у каждой записи. Запись без причины записью не
# считается: «не спрашиваем» без основания и есть тот дефект, который гейт
# ищет. Запись, которой больше нечего покрывать, — тоже находка: послабление
# живёт, пока у него есть предмет.

# Область: чьи коммиты судятся, ОТНОСИТЕЛЬНО ЭТОГО ФАЙЛА.
#
# Относительно ведомости, а не корня дерева. Здесь стояло `services/iam` —
# координата монорепо, верная ровно в одной посадке: ведомость ЕДЕТ с модулем,
# и в самостоятельном клоне тот же файл объявлял бы область, которой там нет.
# Обход тогда пуст, а ноль находок неотличим от чистого дерева (kacho#2239).
# `.` означает «модуль», где бы он ни лежал, и править файл при выносе не нужно.
scope:
  - .

# Личности правообладателя. Соглашение к ним не применяется: заключить его с
# самим собой нельзя.
owners:
  - email: pointpu@prorobotech.ru
    note: PRO-Robotech, правообладатель продукта — соглашение о вкладе к нему не применяется
  - email: kacho-workspace@local
    note: >-
      Тот же правообладатель, вторая личность ТОЙ ЖЕ машины: рабочая копия
      подписывала часть коммитов локальной настройкой вместо личной учётки.
      Адрес нероутируемый (@local), человека за ним нет, и подпись собирать
      не с кого — это дрейф настройки, а не сторонний вклад.

      Предмет — домонорепная линия домена (прежнее полирепо, 67 коммитов):
      в ней 42 вклада этой личности, из них 40 трейлером Co-authored-by
      рядом с автором pointpu@prorobotech.ru и 2 автором коммита. В дереве
      платформы её нет ни одного вхождения — ни автором, ни трейлером, — и
      запись здесь молчит; действует она в самостоятельном клоне, который
      домонорепную линию несёт.

      Объявлена СВОЕЙ личностью, а не освобождением, и это различие несущее.
      waivers утверждали бы, что вклад не является авторским произведением, —
      неправда: за этими коммитами закрытие находок аудита и правки утечек.
      signatories утверждали бы данную подпись — её никто не давал. Верно
      ровно одно: правообладатель тот же, и соглашения с самим собой не бывает.

  - email: pointpu@in-cloud.io
    note: >-
      Тот же правообладатель, второй адрес ТОЙ ЖЕ учётной записи GitHub.
      Установлено числом, а не совпадением имени: коммит b673325f приписан
      учётной записи pointpu с идентификатором 211894461 — тем же, что у 1069
      коммитов адреса pointpu@prorobotech.ru. Приписку GitHub выдаёт только по
      зарегистрированному и подтверждённому адресу, и контроль в обратную
      сторону это подтверждает: kacho-workspace@local не приписан никому.

      Как адрес попал в ствол: b673325f — схлопывание запроса слияния #79 через
      GitHub. Ветка тут ни при чём — все 31 её коммита несут
      pointpu@prorobotech.ru, а схлопнутый вышел с другим адресом. Источник —
      адрес учётной записи, которым подписываются веб-операции; он сменился
      2026-09-14 между 00:17Z и 11:53Z. Граница снята по ДВУМ репозиториям
      сразу и совпала: последние схлопывания с прежним адресом — 00:16:58Z
      (kacho) и 00:17:03Z (kaname), первые с этим — 11:53:02Z и 14:17:19Z.
      Прямого чтения настройки учётной записи наш токен не даёт (нет области
      user), поэтому источник назван выводом из этой границы, а не цитатой.

      Объявлен СВОЕЙ личностью, а не освобождением, по той же причине, что и
      строки выше. waivers утверждали бы, что вклад не авторское произведение,
      — неправда: за коммитом волна 6 целиком. signatories утверждали бы данную
      подпись — её никто не давал, и собирать её не с кого.

      Запись НЕ ИСТЕКАЕТ, и основание у этого не повторение, а норма: адрес —
      ДЕЙСТВУЮЩАЯ подпись. Решением владельца 2026-09-22 коммит подписывается
      только учётной записью корневого gitconfig — `pointpu
      <pointpu@in-cloud.io>`, переопределения в репозиториях сняты; каждый
      следующий коммит несёт этот адрес, и так и должно быть. Прежний адрес
      pointpu@prorobotech.ru — законная история: ствол не переписывается, и
      его строка выше остаётся. Своя личность — политика, а не послабление,
      поэтому гейт исключает owners из самоистечения by construction.

      Чего запись НЕ закрывает, сказано прямо: производитель подписи лежит ВНЕ
      дерева — это корневой gitconfig машины, и в этом репозитории у него нет
      ни стража, ни наблюдателя. Коммит, подписанный адресом, которого в
      ведомости нет, станет находкой этого гейта — но уже после записи в
      историю. Подпись прежним адресом этот гейт не отличит от истории вовсе:
      pointpu@prorobotech.ru в ведомости есть. Отказать такому коммиту ДО
      записи — предмет хука коммита и хука отправки (#356); в этом дереве их
      пока нет: `git ls-tree -r --name-only HEAD | grep -c '^scripts/hooks/'`
      → 0 @ a889f108.

# Сторонние авторы, принявшие соглашение вне коммита (подписанный документ,
# явная запись в задаче). Причина называет, ЧЕМ и КОГДА принято.
signatories: []

# Машинные личности, чей вклад авторским произведением не является.
waivers:
  - email: "49699333+dependabot[bot]@users.noreply.github.com"
    note: >-
      Машинная личность GitHub. Её единственный вклад в историю домена — подъём
      версии базового образа в Dockerfile (library/alpine 3.20 → 3.24, коммит
      d25f2fbfa4b3; при заведении записи здесь стоял cfb80288ea5c — тот же
      подъём в дереве платформы, не в этом репозитории): содержимое такого
      вклада есть строка версии, а не авторское
      произведение, и передавать по соглашению в нём нечего. Отдельно: путь
      подписи для неё закрыт by construction — GitHub подписывает такие коммиты
      адресом support@github.com, отличным от авторского, а подпись чужой
      личностью подтверждением не является. Запись снимается вместе с последним
      коммитом этой личности в области.
  - email: noreply@anthropic.com
    note: >-
      Машинная личность, попавшая в историю ТРЕЙЛЕРОМ, а не авторством. Вкладов
      семь, и все семь — схлопнутые коммиты слияния 2026-09-13…17 с
      коммиттером GitHub: 4c3ad523, 23605829, 83ddd08a, a67591a7, 94352d9c,
      16b5cade, 39628487; автор у первых двух pointpu@prorobotech.ru, у
      остальных pointpu@in-cloud.io. Отдельного автора за адресом нет, и
      собирать подпись не с кого. Число выведено предикатом, а не переписано:
      `git log HEAD --format='%(trailers:key=Co-authored-by,valueonly)' | grep
      -ci 'noreply@anthropic.com'` → 7 @ a889f108, и то же число даёт гейт —
      `make cla-check` печатает освобождено=8, из них один вклад dependabot.
      Запись заводилась при одном вкладе, 23424a1f2e55, — это коммит платформы
      (PRO-Robotech/kacho), в этом репозитории такого объекта нет.

      Как трейлер туда попадал: схлопывание запроса через GitHub СКЛЕИВАЕТ тела
      коммитов ветки, и трейлер, внесённый в коммит ветки, переходил в
      схлопнутый — сообщение собирал GitHub, своего тела у слияния не было.
      Трейлер атрибуции запрещён правилом git (решения владельца 2026-09-22;
      PRO-Robotech/kacho-workspace, `.claude/rules/git-issues.md`,
      gi-no-attribution-trailers): он не ставится ни в один коммит, какой бы
      формой коммит ни входил в ствол.

      Почему освобождение, а не подпись: содержимое вклада авторства владельца,
      трейлер внесён механически и авторского притязания не несёт. Передавать
      по соглашению нечего.

      Запись НЕ ИСТЕКАЕТ САМА, и это сказано прямо: история не переписывается,
      значит освобождённые вклады останутся в стволе навсегда. Истекает не
      запись, а повторение, и путь, которым трейлер приходил, снят: схлопывание
      и rebase на хостинге выключены, вливание идёт только коммитом слияния —
      `gh api repos/PRO-Robotech/kaname --jq
      '.allow_squash_merge,.allow_rebase_merge'` → `false false` @ 2026-09-23.
      Коммит слияния тел ветки не склеивает, но коммит ветки входит в ствол
      сам, со своим телом, — поэтому повторение держит запрет атрибуции, а не
      форма вливания.

      Чего запись НЕ закрывает: стражей запрета в этом дереве пока нет. Хук
      коммита, хук отправки и проверка тела запроса — предмет #356, и до них
      трейлер, внесённый в коммит ветки, дойдёт до ствола, а эта запись
      покроет его МОЛЧА: освобождение адресное, а не поштучное. Признак
      повторения — число вкладов этой личности в выводе гейта (`освобождено`
      за вычетом прочих машинных личностей) больше числа, названного в первом
      абзаце.
