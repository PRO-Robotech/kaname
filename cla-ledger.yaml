# Ведомость соглашения о вкладе. Её судит гейт services/iam/tools/clagate;
# правила и текст самого соглашения — services/iam/CLA.md.
#
# Единица счёта здесь АДРЕС, а не имя: у одного человека имя пишется
# по-разному (в истории домена один автор представлен двумя написаниями при
# одном адресе), поэтому отбор по имени мерил бы соглашение об именовании,
# а не личность.
#
# Причина (note) обязательна у каждой записи. Запись без причины записью не
# считается: «не спрашиваем» без основания и есть тот дефект, который гейт
# ищет. Запись, которой больше нечего покрывать, — тоже находка: послабление
# живёт, пока у него есть предмет.

# Область: чьи коммиты судятся, ОТНОСИТЕЛЬНО ЭТОГО ФАЙЛА.
#
# Относительно ведомости, а не корня дерева. Здесь стояло `services/iam` —
# координата монорепо, верная ровно в одной посадке: ведомость ЕДЕТ с модулем,
# и в самостоятельном клоне тот же файл объявлял бы область, которой там нет.
# Обход тогда пуст, а ноль находок неотличим от чистого дерева (kacho#2239).
# `.` означает «модуль», где бы он ни лежал, и править файл при выносе не нужно.
scope:
  - .

# Личности правообладателя. Соглашение к ним не применяется: заключить его с
# самим собой нельзя.
owners:
  - email: pointpu@prorobotech.ru
    note: PRO-Robotech, правообладатель продукта — соглашение о вкладе к нему не применяется
  - email: kacho-workspace@local
    note: >-
      Тот же правообладатель, вторая личность ТОЙ ЖЕ машины: рабочая копия
      подписывала часть коммитов локальной настройкой вместо личной учётки.
      Адрес нероутируемый (@local), человека за ним нет, и подпись собирать
      не с кого — это дрейф настройки, а не сторонний вклад.

      Предмет — домонорепная линия домена (прежнее полирепо, 67 коммитов):
      в ней 42 вклада этой личности, из них 40 трейлером Co-authored-by
      рядом с автором pointpu@prorobotech.ru и 2 автором коммита. В дереве
      платформы её нет ни одного вхождения — ни автором, ни трейлером, — и
      запись здесь молчит; действует она в самостоятельном клоне, который
      домонорепную линию несёт.

      Объявлена СВОЕЙ личностью, а не освобождением, и это различие несущее.
      waivers утверждали бы, что вклад не является авторским произведением, —
      неправда: за этими коммитами закрытие находок аудита и правки утечек.
      signatories утверждали бы данную подпись — её никто не давал. Верно
      ровно одно: правообладатель тот же, и соглашения с самим собой не бывает.

# Сторонние авторы, принявшие соглашение вне коммита (подписанный документ,
# явная запись в задаче). Причина называет, ЧЕМ и КОГДА принято.
signatories: []

# Машинные личности, чей вклад авторским произведением не является.
waivers:
  - email: "49699333+dependabot[bot]@users.noreply.github.com"
    note: >-
      Машинная личность GitHub. Её единственный вклад в историю домена — подъём
      версии базового образа в Dockerfile (library/alpine 3.20 → 3.24, коммит
      cfb80288ea5c): содержимое такого вклада есть строка версии, а не авторское
      произведение, и передавать по соглашению в нём нечего. Отдельно: путь
      подписи для неё закрыт by construction — GitHub подписывает такие коммиты
      адресом support@github.com, отличным от авторского, а подпись чужой
      личностью подтверждением не является. Запись снимается вместе с последним
      коммитом этой личности в области.
  - email: noreply@anthropic.com
    note: >-
      Машинная личность, попавшая в историю ТРЕЙЛЕРОМ, а не авторством. Вклад
      ровно один — схлопнутый коммит слияния 23424a1f2e55, у которого автор
      pointpu@prorobotech.ru, а коммиттер GitHub; отдельного автора за адресом
      нет, и собирать подпись не с кого.

      Как трейлер туда попал: схлопывание СКЛЕИВАЕТ тела коммитов ветки, а два
      коммита первой порции накопительной линии его несли. Слияние выполнялось
      без явного тела, поэтому сообщение собрал GitHub. Правило репозитория
      такие трейлеры ЗАПРЕЩАЕТ (git-issues.md, «НЕ добавлять Co-Authored-By»),
      и корпус ствола им следует — предикат по последним 300 коммитам давал
      ноль до этого случая.

      Почему освобождение, а не подпись: содержимое вклада авторства владельца,
      трейлер внесён механически и авторского притязания не несёт. Передавать
      по соглашению нечего.

      Запись НЕ ИСТЕКАЕТ САМА, и это сказано прямо: история не переписывается,
      значит коммит останется в стволе навсегда. Истекает не запись, а
      повторение — оно закрывается тем, что вливание идёт с ЯВНЫМ телом,
      а не собранным из тел ветки. Если число вкладов этой личности вырастет
      выше одного, значит повторение случилось и запись лжёт о своём предмете.
