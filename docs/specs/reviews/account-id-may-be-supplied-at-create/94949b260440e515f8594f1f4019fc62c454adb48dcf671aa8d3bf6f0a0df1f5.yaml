blocking:
  count: 1
  kinds: [COVERAGE]
  items:
    - id: B1
      kind: COVERAGE
      where: "Р6а (строки 476-499: «обновляемая в транзакции вставки, правки имени и удаления»; «Имя, равное идентификатору удалённого аккаунта, допустимо»); AID-30 (:1027-1031), AID-32 (:1046-1054), AID-33 (:1160-1162)"
      claim: >-
        Р6а вводит новый ключ базы над идентификаторами И именами живых аккаунтов, который
        обязан освобождать строку на правке имени и на удалении. Ни один из 36 сценариев не
        утверждает освобождение: AID-32 проверяет лишь, что правка на N1x проходит, но не что N1
        после неё снова свободна; AID-30 после удаления проверяет только реестр (повторный id
        отвергнут); AID-33 проверяет только отказы и приём нового имени. Утверждение Р6а «имя,
        равное идентификатору удалённого аккаунта, допустимо» держателя не имеет.
      failure_scenario: >-
        Реализация, где строка ключа Р6а вносится на вставке и правке, но не снимается на
        правке имени и на удалении (или снимается только у имени, но не у идентификатора),
        проходит все 36 сценариев. Следствие: имя переименованного или удалённого аккаунта
        больше никогда не принимается никем (`Account with name <N> already exists`), а имя,
        равное id удалённого аккаунта, отвергается — регрессия прежнего контракта
        (`accounts_name_unique` сегодня держит только живые строки) для всех арендаторов.
      predicate: >-
        grep -n -E 'освобожд|снова свобод|после удаления' по §5 документа — ни одного
        утверждения о ключе Р6а; git grep -n -i -E 'reus|освобо' 092bee4fb322 --
        tests/newman/cases/iam-account*.py 'internal/**/*account*_test.go' — существующей пробы
        «имя свободно после удаления/переименования аккаунта» нет, поэтому DoD S1 п.4 его не держит.
      fix: >-
        Добавить положительные утверждения освобождения (уровень I на базе testcontainers —
        темп стенда не расходуется; либо шагом E в AID-32/AID-30): (1) после правки имени N1 → N1x
        создание аккаунта с id N1 и создание аккаунта с именем N1 проходят; (2) после удаления
        аккаунта с именем M создание аккаунта с именем M проходит; (3) после удаления аккаунта с
        id godjee создание аккаунта без id с именем godjee проходит, а с id godjee — по-прежнему
        `Account godjee already exists` (Р5). Каждое — близнец соответствующего отказа AID-32/AID-33.

non_blocking:
  - id: N1
    kind: FORMAT
    note: >-
      Строка 9 шапки: «Редакция 2, ко второму кругу» — ложь о редакции 4 (строка 24 называет
      редакцию 4 «к кругу 4», задание диспетчера — «круг 1»). Привести строку к факту при
      правке B1; слово DRAFT не трогать.
  - id: N2
    kind: SCOPE
    note: >-
      ПРЕДИКАТ kaname#1052 п.2 требует на стенде литерал `dlputi1u`; документ даёт на стенде
      производное Xl, литерал — уровнем I (AID-06, AID-14), с доводом «выданный id сгорает
      навсегда» (§5, DoD S1 п.7). Довод верен; это переформулировка предиката задачи —
      принимает диспетчер, и задаче стоит дописать это строкой.
  - id: N3
    kind: COVERAGE
    note: >-
      Р5: обратное заполнение реестра расширенной формой из operations.account_id,
      audit_outbox.tenant_account_id и resource_journal внесёт любую строку формы (а)–(г),
      попавшую в эти колонки не как id аккаунта, и сожжёт её навсегда. Через контракт таких
      строк быть не должно; стоит назвать число таких строк на стенде замером до посадки рядом
      с DoD S1 п.5.
  - id: N4
    kind: TWIN
    note: >-
      AID-28 называет близнецом по полю AID-05 со значением `Godjee`, но сам AID-28 шлёт Xl, а
      не `godjee`; одно различие честно держит пара AID-05/AID-06. Формулировку близнеца AID-28
      стоит свести к AID-03 и паре AID-05/06.

