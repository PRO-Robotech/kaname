blocking:
  count: 1
  kinds: [CONSTRUCTIBILITY]
  items:
    - id: B1
      kind: CONSTRUCTIBILITY
      scenario: AID-18
      claim: >-
        Дано AID-18 требует после каждого заведения удалить строку accounts штатным удалением
        хранилища. Это состояние при действующей схеме не строится ни в одной из трёх ветвей.
      evidence:
        - >-
          internal/repo/kaname/pg/account_repo.go:301-319 — accountWriter.Delete удаляет только при
          NOT EXISTS projects / service_accounts / groups / roles с этим account_id.
        - >-
          internal/apps/kaname/api/account/create.go, doCreate — в той же транзакции вставляется
          проект по умолчанию (projects_account_fk ON DELETE RESTRICT, 0001_initial.sql:5490);
          значит ветви создания с генератором и с указанным id дают отказ has_projects.
        - >-
          internal/apps/kaname/api/user/mirror_tx.go — личный аккаунт заводится вместе с личным
          проектом и строкой users с account_id этого аккаунта (users_account_fk ON DELETE
          RESTRICT DEFERRABLE, 0001_initial.sql:5691); штатного удаления личного аккаунта нет.
      required_fix: >-
        Назвать путь удаления, который строится: снять зависимые строки (проект; для личного
        аккаунта — строку users либо её account_id) и затем удалить аккаунт — штатным Delete или
        прямым DELETE в интеграционной пробе — с координатой фикстуры. Утверждение о реестре
        не ослаблять.

