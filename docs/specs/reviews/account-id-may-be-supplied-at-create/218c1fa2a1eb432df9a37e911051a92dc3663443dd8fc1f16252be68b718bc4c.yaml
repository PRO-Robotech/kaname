    Дифф 7 → 8 (+36 −5) трогает шапку (статус, история ревью, дата, задача), новый §0.3в и
    AID-39: одна строка команды заменена, после блока добавлен абзац прозы. Строк
    **Given/When/Then/And** дифф не меняет (grep по +/− строкам — 0). ID сценариев r7 и r8
    равны: 41 уникальный AID, diff пуст. Блоков **Given** 43 в обеих редакциях: у AID-34
    их три, отсюда «43» дока и записи круга 4. Строка производителя AID-39 (§6.1, :2010) и
    строка фикстуры (:2046) не тронуты.
  semantics: >-
    Смысл AID-39 не изменился и проверка стала строже. Утверждение, образец, файл F и
    ожидание «пусто» прежние, а к ожиданию добавлен код возврата 1. Исходы измерены на
    ebda3c184 с обеих сторон. grep на несуществующем F даёт код 2, на пустом F код 2, на
    существующем чистом файле (go.mod) код 1, на файле с вызовом (handler.go) код 0.
    git grep на несуществующем пути давал код 1 и пустой вывод, то есть был неотличим от
    «вызовов нет». Отличие добавленной ветки — только в коде 2 для «читать нечего». Кроме
    того, grep читает и неотслеживаемый файл, где git grep молчал бы.
  gate_reach: >-
    Проба TestAcceptancePathCoordinateResolves судит только путь после `--` в строке с
    `git grep|ls-files` (acceptance_path_coordinate.go:66, :136). Строка AID-39 выходит из
    её суждения: координат-путей было 1254, стало 1253. Масками это не является. Предмет
    пробы — путь, дающий пустоту «по построению» (шапка гейта, :15–23). Новая форма этой
    пустоты дать не может: отсутствие файла видно по коду 2, и ожидаемый код назван в
    тексте. Три исхода, которые печатает отказ пробы, здесь неприменимы: файла до S1 нет
    по замыслу, дом свой, а запись ведомости живёт в internal/check, это не артефакт
    приёмки. Утверждение не ослаблено.
  coordinates: >-
