    note: >-
      Прозе у AID-39 (строки 1255–1259) и §0.3в не хватает одного факта. git grep при
      пустом F не отвечает «пустотой»: он падает с кодом 128 («empty string is not a valid
      pathspec»). Для пустоты нужен заданный, но несуществующий путь (измерено: код 1).
      Утверждения дока о git grep говорят только про «отсутствующий путь» и поэтому
      верны. Уточнять не обязательно.
  - id: R2
    kind: TWIN
    note: >-
      У утверждения «пусто, код 1» положительного контроля образца не было и в редакции 7,
      то есть это вне дельты. Измерено на ebda3c184: тот же образец на
      internal/apps/kaname/api/access_binding/handler.go даёт код 0, совпадение на :242
      (corevalidate.PageSize). Значит, образец кусается. При правке документа по другому
      поводу можно добавить строку контроля с файлом-носителем вызова.

