verification:
  method: experiment_not_reading
  what_i_did_not_take_on_trust: >-
    Ни одного числа документа. Каждый предикат §1, §5.1, §7 и §4.3 прогнан заново; перечень
    соседей ВЫВЕДЕН, а не прочитан; цитаты из Ф1, Ф11 и F4d сверены с исходными строками
    дословно, а не пересказом; способность держателей упасть проверена инъекцией, а не
    столбцом «чем держится»; объявленный автором ПРЕДЕЛ проверен собственным опытом.
  what_changed_my_reading: >-
    Две вещи. Первая: я готовился считать Д10 (расхождение с одобренной Ф11) блокирующим —
    пока не прочитал ведомость Ф11 целиком и не увидел, что принятие DoD Ф11-06 в эту фазу
    противоречило бы §0.2 ЭТОГО документа, то есть было бы разрешением вперёд; непринятие —
    единственный исход, не нарушающий ни одного из двух документов. Вторая: я готовился
    считать В1 блокирующим, пока не прочитал преамбулу §1, которая объявляет правило снятия
    приставки, и не подтвердил факт независимо.

limits:
  - >-
    ЧЕГО ЭТОТ ВЕРДИКТ НЕ ПОКРЫВАЕТ. Это вердикт о ПРИЁМКЕ, а не о будущем коде: он говорит,
    что требования названы, наблюдаемы, снабжены производителями и не противоречат одобренным
    соседям. Он не утверждает, что реализация будет верной.
  - >-
    Внешнее полномочие — «не выполнилось», ТРЕТЬЯ категория. Санкции этот вердикт не выдаёт;
    до события запрет #1 на объём §4.1 в силе.
  - >-
    Сквозные пробы и поднятый стенд не гонялись: их предмета сегодня не существует (§9 — вся
    полоса красная до кода by construction). О поведении на кластере вердикта нет.
  - >-
    Два свойства формы Ф-а остаются без ИЗОЛИРУЮЩЕГО опыта (В2). Я подтвердил, что изоляции
    на этом шве нет, — но это подтверждение предела, а не его снятие.
  - >-
    Гейт дома чужие координаты не резолвит; 32 координаты чужого дома проверены МНОЙ вручную.
    Автоматического держателя у их свежести нет — при движении kacho они устареют молча.

found_on_the_way:
  - >-
    Задач в трекере не заводил (условие задания). Ни одна находка круга на это и не тянет:
    В1 — косметика одной строки, В2 — подтверждённый предел, В3 — пояснение для исполнителя.
  - >-
    Наблюдение, полезное следующему кругу пачки: двусторонняя сверка §5.2↔§7 нашла в прежних
    редакциях расхождение на 4 строках из 7 здесь и на 7 из 9 у Ф5. Класс принадлежит ФОРМЕ
    раздела, а не документу: перепись и ведомость пишутся в разные заходы, а сверяет их только
    этот предикат. Стоит переносить его в форму задания автору приёмки, а не находить ревью.

