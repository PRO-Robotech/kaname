role_review:
  producers_for_every_then:
    checked: >-
      Все 24 «Тогда». Перепись воспроизведена ДВУМЯ независимыми выражениями: awk по §6 → 24
      различных метки, awk по §7 → 24, `diff` двух множеств ПУСТ (не только равенство чисел —
      совпадение состава). Контроль латинской формы `F4-0` → 0, то есть перепись не считает
      собственное объяснение.
    verdict: >-
      Производитель назван у 24 из 24 и КАЖДЫЙ пригоден по роду. Спорные разобраны отдельно:
      Ф4-12 требует отказа, а форма Ф-в даёт лишь ВЕЛИЧИНУ — строка это и говорит («величина —
      форма Ф-в»), отказ производит Ф4; Ф4-22 — единственный, чей производитель не Ф4, а
      «форма Ф-б (существует сегодня)», и это верно: положительный контроль окна опирается на
      живой механизм; Ф4-20 разведён на сессию (Ф3 #1269) и её выдачу регистрацией (Ф4).
  homes_for_every_given:
    checked: >-
      Сверка §4.3↔§7 исполнена предикатом документа: `comm -13` множеств номеров задач → ПУСТО.
      То есть §7 не называет ни одного строителя «Дано», о котором §4.3 молчит.
    verdict: >-
      «Дано» строится названным домом у 24 из 24. Единственный сценарий, чьё «Дано» строит
      ЧУЖАЯ фаза, — Ф4-10 (снятие прежнего объявления, шаг Ф10 #1276, OPEN), и документ не
      прячет это за формулировкой «всё строится нашим кодом»: §4.3 прямо называет её шире
      сделанного и приводит строку. Остальные строятся нашей базой либо внесённым в пробу
      различием.
  holders_can_fail:
    method: >-
      Не прочтение, а ПОВТОР инъекции с законным близнецом. Инъекция вносила РОВНО ОДНО
      различие; откат доказан содержимым (`git status --porcelain` пуст), не заявлением.
    experiments:
      - name: 'форма Ф-а, свойство «идемпотентность» (§5.2а, строка 1)'
        control: >-
          восемь названных проб на чистом дереве — PASS 8 из 8, `ok 4.301s`
          (документ называл `ok 4.632s`: расходится шумом машины, не исходом)
        injection: >-
          обезврежена повторная проверка числа собственных аккаунтов ВНУТРИ writer-транзакции
          (`else if owned > 0` под advisory-блокировкой)
        result: >-
          СОШЛОСЬ ДОСЛОВНО. FAIL у одного `TestBootstrapConcurrent_TOCTOU_SingleOwnedAccount`;
          все пять названных документом законных близнецов — PASS. Встречная половина
          проверена тем же прогоном: прежде названный держатель («пробы того же каталога»)
          при ТОЙ ЖЕ инъекции остаётся ЗЕЛЁНЫМ — `ok 4.197s`. То есть находка §0.5 п. 1
          («названный держатель не краснел на объявленном свойстве») истинна.
      - name: 'форма Ф-а, свойство «ОДНА транзакция» — заявлено держащимся ПОДПИСЬЮ, не пробой'
        control: 'не требуется: утверждение о компиляторе, а не о прогоне'
        injection: >-
          подстановка пула туда, где ожидается транзакция:
          `fga_outbox.EmitWriteTx(ctx, (*pgxpool.Pool)(nil), nil)` во временной пробе пакета
        result: >-
          СОШЛОСЬ ДОСЛОВНО, до буквы. Компилятор:
          «cannot use p (variable of type *pgxpool.Pool) as pgx.Tx value in argument to
          fga_outbox.EmitWriteTx: *pgxpool.Pool does not implement pgx.Tx (missing method
          Commit)» — ровно та строка, которую §5.2а приводит в кавычках. Подпись прод-функции
          сверена отдельно: `internal/repo/kaname/pg/fga_outbox/emitter.go:108` принимает
          `pgx.Tx` (одноимённый МЕТОД `FGAOutboxEmitter.EmitWriteTx` принимает `service.Tx` —
          документ называет именно пакетную функцию, и это точно).
      - name: 'объявленный ПРЕДЕЛ §5.2а: «первая самопривязка» — опыт не ставился'
        control: 'те же восемь проб — PASS'
        injection: >-
          самопривязка аккаунта не несёт роли владельца
          (`RoleID: domain.OwnerRoleID` → `ClusterAdminRoleID`)
        result: >-
          ПРЕДЕЛ АВТОРА ПОДТВЕРЖДЁН МОИМ ЗАМЕРОМ, а не принят на слово: инъекция роняет
          ЧЕТЫРЕ пробы сразу (`_AccountIsOwnerBinding`, `_ProjectContentMaterialized`,
          `_OwnAccessBindingMaterialized`, `_CrossServiceContentForward`) — изоляции на этом
          шве нет, ровно как документ и говорит о соседней строке. Инъекция, роняющая
          четверых, доказательством по `testing.md` §«Гейт на класс» п. 2в НЕ является;
          значит заявление §5.2а «форма держится» верно сужено, а не занижено.
      - name: 'форма Ф-д — гейт дерева с инъекцией в обе стороны'
        control: '`go test -count=1 -short ./internal/check/` → ok, код 0'
        injection: 'штатные пробы инъекции пакета, прогнаны с -v'
        result: >-
          Гейты приёмок печатают перепись и падают на пустом обходе; инъекционные пробы
          `TestAcceptance*Injection` (пять семейств) — PASS. Перепись на ЭТОЙ ветке:
          приёмок 37 · координат-путей 307 · резолвится 275 · в чужом доме 32 · находок 0;
          проб 489 · резолвится 381 · в чужом доме 108 · находок 0.
  both_sides_of_every_axis:
    checked: >-
      По каждой полосе §6 назван близнец, и я сверял НЕ таблицу §8, а сами сценарии.
    axes:
      - 'три следствия: Ф4-02/03/04 (по одному внесённому отказу на каждое) ↔ Ф4-05 (без различия)'
      - 'полоса и гейт: Ф4-07 (красное с именем) ↔ Ф4-08 (молчание) ↔ Ф4-09 (пустой разбор — ТРЕТЬЯ категория, не зелёное и не красное)'
      - 'занятость: Ф4-11/12 (два отказа, побайтово равные) ↔ Ф4-13 (свободный адрес — успех)'
      - 'время: Ф4-14 (критерий) ↔ Ф4-15 (инъекция обязана краснеть) ↔ Ф4-16 (шум стенда — «не выполнилось»)'
      - 'темп: Ф4-17 (первая безусловна) ↔ Ф4-12 (потолок исчерпан) ↔ Ф4-18 (отказ старта) ↔ Ф4-19 (объявленная величина поднимает)'
      - 'материализация: Ф4-21 (отказ, называющий шаг) ↔ Ф4-22 (после доставки проходит)'
      - 'приглашённый: Ф4-23 (три следствия) ↔ Ф4-24 (второй записи нет)'
    verdict: >-
      Ни одной односторонней оси не найдено. Отдельно отмечено, что у полосы времени близнецов
      ДВА и второй — третья категория: стенд, чей шум больше потолка годности, не выдаётся ни
      за зелёное, ни за красное.
  agreement_with_approved_neighbours:
    method: >-
      Обход по СВОЙСТВУ обоими языками, как документ и объявляет; каждое вхождение
      адъюдицировано мной заново, а не принято с его слов.
    findings:
      - 'Д1 — ОПРОВЕРЖЕНИЕ ОДОБРЕННОГО СОСЕДА, и оно истинно. F4d §12 строка 1782 дословно: «Самостоятельная регистрация человека с улицы | **0** — сегодня человек заводится приглашением либо посевом». Замер §1.6 перепроверен мной: пять сквозных проб зовут фикстуру регистрации, фикстура заводит адрес `e2e-<метка>@…`, проходит два шага формы и ЖДЁТ ПЕЧЕНЬЯ СЕССИИ (прочитан исходник фикстуры, не только имя), приглашения нет ни одного. Клауза соседа ложна о дереве. Исход документа верен: не чинить чужой предмет в чужом доме, на клаузу не опираться, стоять на более поздней одобренной Ф1.'
      - 'Д3/Д4/Д5 — требования F4d приняты ДОСЛОВНО. F4d-35 прочитан целиком (строки 1515–1523) и ложится на Ф4-06…10 один-к-одному: перепись двух величин → Ф4-06; «красное с её именем» → Ф4-07; «молчит» → Ф4-08; «падает, если полос разобрано ноль» → Ф4-09; «свойство переезжает вместе с предметом» → Ф4-10. Второго требования о том же Ф4 не заводит — расхождения ни по одной оси. F4d §5 «сегодня 2 · 2» перемерено §1.2: `hook: web_hook` 5, `hook: session` 2. Сходится.'
      - 'Д10 — РАСХОЖДЕНИЕ С ОДОБРЕННОЙ Ф11 РЕАЛЬНО, и я это перемерил, а не принял. Ф11-06 дословно: «адрес не занят ни одной личностью | регистрация паролем | выданная регистрацией сессия — уровня «1» (Р4)»; её ведомость: «| Ф11-06 | Ф11 — правило на пути регистрации | значение | Ф4 | Ф4 |», то есть столбцы «исполнимо с» и «в DoD» несут Ф4. Исход документа — НЕПРИНЯТИЕ DoD — верен и является единственным, не выдающим разрешение вперёд: §0.2 уровень сессии не разрешает, §5.3 п. 3 снял строку об уровне целиком. Ф4 производит ПРЕДМЕТ наблюдения (сессию, выданную регистрацией) и не производит УТВЕРЖДЕНИЯ о её уровне; правка столбца названа в доме Ф11. Расхождение названо вслух, а не оставлено молчаливым, — это и требуется.'
      - 'Д11 — вопрос Ф11 о восстановлении при заведённом втором факторе передан ВТОРОМУ документу пачки. Строка Ф11 §6 (1337) прочитана целиком и совпадает дословно, включая условие возврата «Ф5 (#1271) и Ф12 (#1281)». Для Ф4 предметом не является: регистрация второго фактора не требует и его заведения не производит.'
      - 'Д9 — ID-PW-1 §0.1/§5: успешное предъявление переписывает проверочное значение. К Ф4 не относится (регистрация заводит значение впервые). Названо верно — чтобы следующий не искал здесь строку про перепись.'
    verdict: >-
      Расхождений, которые ЭТОТ документ обязан был бы решить и не решает, — ноль.
      Проверено не прочтением абзаца, а адъюдикацией каждого вхождения: Д1 — чужой дом,
      Д2/Д7 — предмет Ф5, Д8 — своя задача, Д10 — решено здесь непринятием, Д11 — предмет Ф5.
  scope_beyond_the_approved_parent:
    checked: >-
      Документ объявляет ОДНУ строку объёма СВЕРХ §5 Ф1 — потолок темпа ЗАВЕДЕНИЯ — и это
      самое опасное место документа, потому что добавленное, не объявленное вслух, читалось
      бы как унаследованное. Перемерено полностью.
    verdict: >-
      ОБЪЯВЛЕНО ВЕРНО. Предикат документа воспроизведён: `sed -n '420p'` по Ф1 даёт Ф1-07 —
      «подряд N неверных ПОПЫТОК по одному адресу в окне T»; Ф1-07/08 стоят в §3.1 «Полоса
      входа паролем» (заголовки: §3.1 на 410, §3.2 на 423); §3.4 «Регистрация и её три
      следствия» о частоте не говорит — `grep -ciE 'частот|темп|окн[ео]'` → 0 при КОНТРОЛЕ по
      §3.1 → 1 (предикат находить умеет). Ведомость Ф1 §5 отдаёт Ф1-07…19 фазе Ф3 #1269, а
      Ф4 — только Ф1-20…22, Ф1-23 (первая половина), Ф1-24. Значит одобрение Ф1 этой строки
      НЕ покрывает, и покрыть её вправе только вердикт этого документа. §0.2 называет цену
      обеими сторонами, §8 инвариант 9 отделяет это отступление от первого (сужающего) как
      более опасное. Принято.
  ratified_decisions:
    - 'Р1 — транзакция названа и испытывается ПО КАЖДОМУ из трёх следствий. Довод «одностороннее испытание не доказывает свойство» верен: порядок, при котором зеркало пишется первым, даёт тот же зелёный при сшивке приложением. Ф1 Р5 прочитан дословно и это основание несёт.'
    - 'Р2 — годность сессии не гейтится на материализацию. Соответствует ban #9; обратный ход рождает фантом, и документ называет его механику. Цена (краткое окно отказа) названа и покрыта Ф4-21/22.'
    - 'Р3 — выбран второй исход дизъюнкции Ф1-22. Довод, что ПЕРВЫЙ неисполним при Ф1 Р5, проверен: Ф1 Р5 дословно требует, чтобы успех нёс сессию, а отказ её не несёт — значит «побайтово равен успеху» отменяло бы третье следствие. Остаток оракула назван, а не спрятан, с предикатом возврата (Ф6 #1272, Ф8 #1274). Осознанное исключение (отказы политики пароля не равны) названо и его предмет вынесен §4.2 с носителем.'
    - 'Р4 — полоса становится сущностью нашего кода, перечисленной ОДНИМ местом. Мотив проверен на дереве: сегодня полоса есть ключ отступа в чужом файле (§1.2 перемерено), а держит свойство гейт чужого дома (`deploy/identity_registration_lanes_issue_a_session_test.go`, 136 строк, `TestIdentity_EveryRegistrationLaneIssuesASession` — всё сверено в kacho@45d1719fe8).'
    - 'Р5 — носитель ключа темпа объявляется заново. Мотив несущий и перемерен: §1.5 подтверждена (объявление триггера 1, аргумент `iam.account`, КОНТРОЛЬ по имени 2 — вторым идёт комментарий). Ф4 убирает внешний идентификатор, и без переобъявления рубеж исчез бы МОЛЧА — класс `security-hardening.md` «контроль, у которого нет механизма исполниться». Первая регистрация остаётся безусловной; величина — настройкой, незаданная — отказ старта (Ф1 §7 инвариант 4 прочитан дословно).'
    - 'Р6 — приглашённый заводится ТОЙ ЖЕ полосой. Верно по построению: иная полоса завела бы третий набор следствий, то есть ровно класс, против которого написан гейт Р4. Граница (согласие на вступление в чужой аккаунт) названа чужой находкой и ни один сценарий на неё не опирается.'
    - 'Р7 — время ответа регистрации. Критерий взят у Ф1-48 ДОСЛОВНО, своей величины не вводится ни одной. Проверено, что регистрации в ведомости второй половины Ф1 Р3 действительно НЕТ: Ф1 §5 отдаёт время Ф3 (Ф1-48…50) и Ф5 (Ф1-51). Значит Р7 закрывает настоящий пробел, а не дублирует чужую клаузу.'

non_blocking:
  - id: В1
    where: '§1.6, строка 249'
    what: >-
      Единственная во всей пачке команда, несущая координату дома ВНУТРИ pathspec:
      `git grep -l 'register(page)' origin/main -- 'PRO-Robotech/kacho:ui-future/e2e/specs'`.
      Прогнанная ДОСЛОВНО в доме платформы она даёт 0, а не объявленные 5.
    why_not_blocking: >-
      Число верно под правилом, которое объявляет сам документ в преамбуле §1 («Форма
      `владелец/репозиторий:путь` — КООРДИНАТА, а не строка для оболочки: исполняй в рабочей
      копии названного дома, сняв приставку»). Со снятой приставкой предикат даёт РОВНО 5, и
      я подтвердил факт независимо — пять файлов названы поимённо, фикстура прочитана. То есть
      утверждение истинно и воспроизводимо, неточна форма ОДНОЙ строки.
    radius_measured: >-
      1 на два документа. Предикат: строки обоих документов, где `PRO-Robotech/<repo>:`
      стоит в исполняемой команде, а не в комментарии `# ДОМ:` — единственное попадание
      это. Все остальные предикаты обоих документов кладут дом в комментарий над командой
      и оставляют команду чистой.
    suggested_fix: >-
      Привести строку к форме соседей: `# ДОМ: PRO-Robotech/kacho` комментарием, pathspec —
      `'ui-future/e2e/specs'`. Правка косметическая и вердикта не касается.
  - id: В2
    where: '§5.2а, две строки таблицы'
    what: >-
      Две строки опыта не несут: «первая самопривязка» (опыт не ставился) и «личный аккаунт
      с личным проектом» (инъекция роняет троих — изоляции нет).
    why_not_blocking: >-
      Автор назвал обе ПРЯМО и сузил заявление ровно на них («заявление „форма держится"
      шире сделанного ровно на них; ревьюер вправе потребовать опыт по обеим»). Я потребовал
      и поставил опыт по первой: моя инъекция роняет ЧЕТЫРЕ пробы сразу — изоляции на этом
      шве действительно нет. Значит объявленный предел не отговорка, а свойство шва; заявление
      документа не шире сделанного. Сценарии Ф4-01/02/23/24 от этого не страдают: их
      производитель — фаза Ф4 плюс существующая форма, а форма в дереве есть (878 строк,
      проверено).
    suggested_fix: >-
      Необязательно. Если автор захочет, мой замер можно внести строкой в ту же таблицу:
      инъекция роли владельца роняет четверых, то есть одно-фактного различия на этом шве не
      существует — как и у соседней строки.
  - id: В3
    where: 'Ф4-10, второе «И»; §5.2 форма Ф-д; §7'
    what: >-
      «Гейта, читающего снятое объявление, в дереве не осталось» — утверждение об ОТСУТСТВИИ
      в ЧУЖОМ дереве (`PRO-Robotech/kacho`). Машинного держателя в доме службы у него нет
      by construction: гейт дома чужие координаты НЕ резолвит — его собственная перепись это
      и печатает («в чужом доме 32 · из них связаны ревизией 0»).
    why_not_blocking: >-
      Производитель назван по второй допустимой ветви правила — фазой с ОТКРЫТОЙ задачей:
      §7 говорит «совместно с PRO-Robotech/kacho», §4.3 и §10 п. 4 называют снятие шагом
      Ф10 #1276 (проверено: OPEN, метки без `blocked`), §8 инвариант 7 требует переписать
      гейт ТЕМ ЖЕ изменением. Документ не обещает, что `internal/check/` проверит чужое
      дерево, и я специально сверил, что такого обещания нет ни в одной строке.
    suggested_fix: >-
      Не требуется. Отмечено, чтобы исполнитель Ф4 не искал машинного держателя этой
      половины в доме службы и не счёл её забытой.

decisions_ruled:
  - question: 'Круг первый или повторный — и надо ли повторять чужие блокирующие?'
    ruling: >-
      ПЕРВЫЙ. Каталог `docs/specs/reviews/` на a6bffc53 несёт два имени, этого среди них нет;
      предыдущих записей у документа ноль. «Редакция 2» шапки — доводка АВТОРА до круга, а не
      ответ на вердикт: вердикта на редакцию 1 не выносилось никем. Требование «по каждому
      блокирующему предыдущей записи повтори тот самый опыт» беспредметно, и это названо, а не
      исполнено вхолостую.
  - question: 'Считать ли В1 (предикат, дающий 0 вместо 5) блокирующим?'
    ruling: >-
      НЕТ. Блокирующим делает утверждение ЛОЖНОЕ либо непроверяемое. Здесь факт истинен,
      предикат воспроизводим под объявленным самим документом правилом, радиус измерен и равен
      единице, а существо (регистрация с улицы существует) подтверждено мной независимо —
      чтением фикстуры, а не счётом файлов.
  - question: 'Считать ли блокирующим объявление объёма СВЕРХ §5 одобренной Ф1?'
    ruling: >-
      НЕТ — наоборот, это образец того, как такое обязано делаться. Добавленное объявлено
      вслух, отделено от унаследованного (§8 инвариант 9), снабжено ценой обеих сторон и
      предикатом, которым я его перепроверил. Опасность класса — в МОЛЧАЛИВОМ добавлении;
      здесь молчания нет.
  - question: 'Расхождение с одобренной Ф11 (Д10) — решать здесь или вернуть автору?'
    ruling: >-
      РЕШЕНО ЗДЕСЬ ВЕРНО, возвращать нечего. Из двух исходов — принять DoD Ф11-06 в эту фазу
      либо оставить его Ф11 — второй единственный, не выдающий разрешение вперёд вопреки §0.2
      того же документа. Правка чужого столбца названа в доме Ф11 и в чужом доме здесь не
      делается: смешение линий сделало бы вердикт непрослеживаемым.

