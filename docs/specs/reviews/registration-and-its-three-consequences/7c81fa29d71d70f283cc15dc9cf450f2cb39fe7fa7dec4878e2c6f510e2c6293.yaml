# ─── БЛОКИРУЮЩЕЕ КРУГА 1 — ЗАКРЫТО ТЕМ ЖЕ ОПЫТОМ ─────────────────────────────
blockers_round1:
  - id: Б1
    genus: PRODUCER
    status: закрыто
    removal_predicate_of_round_1: >-
      «Повтор опыта (обёртка `AccountsW().Insert` в двух родах) даёт исход, который документ
      объявляет для каждого рода; строка §7 для каждого рода называет ветку `refuse`, которая его
      производит.»
    how_closed: >-
      Выбран исход (а) — решение диспетчера по делегированию владельца. Ф4-25 (стр. 1132) держится
      при любой причине и исполняется в двух мирах, каждый — одно различие против Ф4-05. §7 называет
      для мира (i) `register.go:267-270` (есть), для мира (ii) — `register.go:258-260` сегодня
      (единый отказ, красный) и требуемые правки 1–2 §10а п. 1а. Р3 (стр. 506) закрывает перечень
      причин единого отказа двумя. §0.6 сужен до верного («состав и наблюдаемость — есть; имя —
      нет»), §9 делит группы на «без красного» и «честный красный».
    experiment: >-
      Тот же опыт, что в круге 1, на неизменённом дереве, один прогон вместе с близнецом (временная
      проба удалена): Ф4-05 — PASS; мир (i) — `store unavailable`, `ErrRefused=false`, клетка
      «занято» +0, из четырёх ничего; мир (ii) «каждая попытка занята» — попыток записи 1,
      `registration refused`, клетка «занято» +1, из четырёх ничего; Ф4-28 «первая попытка занята» —
      то же, занявший аккаунт остался у своего владельца. Ровно то, что документ объявляет сегодняшним
      исходом каждого мира: мир (i) зелёный, мир (ii) и Ф4-28 — честный красный при зелёном Ф4-05.
genus_repeat_round1: >-
  Род PRODUCER круга 1 НЕ повторился: производитель назван у 30 из 30, и у каждого из трёх новых
  «Тогда» без производителя в дереве (мир ii Ф4-25, Ф4-28…30) он назван задачей `kaname#256` и
  свойством правки, а сегодняшняя ветка кода названа прямо. Правило §14а не срабатывает.

blocking: []

non_blocking:
  - id: В1
    status: закрыто объяснением, подтверждено опытом
    what: >-
      Автор оставил приставку дома в §1.6 и объяснил почему. Опыт: временно снял приставку →
      `TestAcceptancePathCoordinateResolves` FAIL, `находок 1`, текст гейта сам предписывает форму
      `владелец/репозиторий:путь`; откачено, отпечаток восстановлен. Значит правка, предложенная
      записью редакции 2 («привести к форме соседей»), уронила бы гейт — то предложение было
      неверным, и снято оно здесь.
  - id: В5
    status: достаточно до следующей правки
    what: >-
      Носитель есть: `PRO-Robotech/kaname#279` OPEN, «iam: /iam/v1/me помечает любую роль в
      аккаунте как viewer» (`gh issue view 279`). Документ (стр. 844) говорит «задача заводится,
      номер впишется». Ни одно «Тогда» от Н2 не зависит, а новая редакция ради одного номера сбросила
      бы отпечаток и стоила бы круга. Номер вписать при следующей правке документа; до неё координата
      носителя — эта запись.
  - id: В6
    where: 'Р9 п. 3 (стр. 627 и далее), §10а п. 3'
    what: >-
      Резерв префикса — правило «как общая форма, но ещё и не начинается с `personal-cloud-`» для
      одного ресурса. Р9 разбирает, почему это не вторая ФОРМА имени, и довод принимается: форма и её
      валидатор остаются одни и идут первыми, резерв — правило пространства, как уникальность, со
      своим текстом. Но два канонических текста после посадки будут читаться как запрет того, что
      сделано: `api-conventions.md` §«Имя ресурса» («производных „как общий, но ещё и…“ не
      заводится») и комментарий фундамента у `defaultNameForID` (`corelib@v1.9.0/validate/validate.go`,
      «Разбиения … не существует: оно потребовало бы второй формы имени»). В перечне согласования
      §10а п. 3 их нет. Нужна запись резерва как названного исключения в правиле (дом — воркспейс) и
      уточнение комментария фундамента (дом — corelib); иначе следующий рецензент снимет резерв по
      правилу.
  - id: В7
    where: 'Ф4-29 (стр. 1373-1386), Ф4-30 (стр. 1388-1405)'
    what: >-
      Имена в «Дано» и у близнецов фиксированы (`acme-team`, `personal-cloudabc123`), а уникальность
      имени аккаунта глобальная: на общем стенде положительный близнец со второго прогона получит
      `ALREADY_EXISTS`. Держатель сквозного уровня обязан брать хвост уникальным на прогон (набор
      `iam-account` так и делает — `{{runId}}`); положительный близнец Ф4-29 сверх того заводит
      аккаунт, а заведение аккаунтов ограничено темпом (`accounts_rate_admission`), и «Дано» об этом
      не говорит. Одна строка в «Дано» каждого.
  - id: В8
    where: '§10а п. 1а, правка 2 (стр. 1703-1712); §12 п. 11'
    what: >-
      Утверждение «функция одна на оба пути, поэтому правка действует и на провизион под
      `external`» верно, только если правка живёт в `BootstrapPersonalResourcesTx`, а не в
      композиции `RegisterMirrorTx`; место не названо. Второе условие того же пункта: «Дано» Ф4-28 и
      мира (ii) держатель строит обёрткой порта записи аккаунта, поэтому каждая попытка записи обязана
      проходить через порт с именем в аргументе. Пустого зелёного это не даёт — «Тогда» Ф4-28 требует
      существования неизменного занявшего аккаунта, — но исполнитель, выбравший запись имени внутри
      одного оператора SQL, узнает о несовместимости с держателем только на держателе.
  - id: В9
    where: '§3.1, дополнение редакции 4'
    what: >-
      Обход соседей по НОВОМУ свойству («какие имена принимают `Create`/`Update` аккаунта») в
      документе не приведён. Сделан здесь: у 11 одобренных соседей дома службы имени
      `personal-cloud` нет ни у одного; в воркспейсе его несёт только RC-5 (согласуется); в дереве
      платформы на origin/main — 0; ни одна проба трёх деревьев аккаунт с таким именем не заводит.
      Вывод документа «расхождений, которые он обязан решить, — ноль» верен и для этого свойства.

decisions_ruled:
  - question: Резерв префикса (Р9 п. 3, Ф4-29/30) — объём сверх Б1; блокировать ли как over-scope или CONVENTION?
    ruling: >-
      НЕТ. Объём объявлен вслух третьей строкой §0.2 с ценой обеих сторон и правит контракт
      соседнего ресурса открыто; делегат владельца его видел («аккаунты с префиксом, заведённые до
      резерва, остаются»). Конвенцию резерв не нарушает по существу (форма одна, валидатор один и
      первый) — довод Р9 принят; расхождение с буквой двух канонических текстов — В6, работа по
      согласованию, а не дефект приёмки.
  - question: Достаточно ли «задача заводится» для В5 до следующей редакции?
    ruling: 'Да — см. В5: носитель #279 существует и назван этой записью.'
  - question: Держится ли открытый вопрос §12 п. 8 вне «Тогда» и в редакции 4?
    ruling: >-
      Да: в §6 слово «членство» по-прежнему встречается один раз (`awk … | grep -ci 'членств'` → 1) и
      о чужом аккаунте; новые Ф4-28…30 на членство не опираются.
  - question: Держатель Ф4-25 мира (ii) после правки — не станет ли он неотличим от Ф4-28?
    ruling: >-
      Нет: миры различаются одним фактом («занята КАЖДАЯ попытка» против «занята ПЕРВАЯ»), исходы
      противоположны (невыполнение против успеха); сегодня оба красные одинаково (попытка одна), после
      правки расходятся — это и есть способность пары упасть.

