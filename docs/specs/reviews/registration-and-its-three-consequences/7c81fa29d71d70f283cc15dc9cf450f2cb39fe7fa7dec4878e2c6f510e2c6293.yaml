    пространства имён «второй формой». Разбор кода изменил вывод: форма имени и её единственный
    валидатор не трогаются и идут первыми, отказ формы побайтово прежний (посев), резерв — правило
    пространства одного ресурса, как уникальность. Остаётся расхождение с буквой двух текстов — В6.

