# ─── БЛОКИРУЮЩЕЕ ─────────────────────────────────────────────────────────────
blocking:
  - id: Б1
    genus: PRODUCER
    title: >-
      Ф4-25: «Тогда» — «отказ дошёл до вызывающего как НЕвыполнение, а не как единый отказ» —
      производится только для ОДНОГО рода отказа записи личного аккаунта. Единственный род,
      который производит сам адаптер записи аккаунта как `ALREADY_EXISTS` — коллизия глобально
      уникального имени, — даёт на СВОБОДНОМ адресе единый отказ регистрации. Документ этого
      рода не называет и утверждает «кода не требует».
    sections: [Ф4-25 (стр. 958-970), §7 строка Ф4-25 (стр. 1190), §10а п. 1 строка Ф4-25 (стр. 1417), §0.6 «не требует кода» (стр. 241), §9 строка Ф4-25…27 (стр. 1338), Р3 «единый определено буквально» (стр. 422)]
    predicate: >-
      Цепочка кода (kaname@39628487): имя личного аккаунта —
      `"personal-cloud-" + lower(последние 6 знаков accID)` (`mirror_tx.go:198-201`);
      `accounts_name_unique UNIQUE (name)` глобален (`0001_initial.sql:3985`); адаптер отображает
      нарушение в `ErrAlreadyExists` (`account_repo.go:228-231`); `refuse` отдаёт на ЛЮБОЙ
      `ErrAlreadyExists` единый отказ `ErrRefused` и пишет клетку «занято»
      (`register.go:258-260`), а не ветку «хранилище отказало» (`register.go:267-270`), которую
      §7 называет производителем. Снаружи это `400 FAILED_PRECONDITION "registration refused"`
      вместо `503 UNAVAILABLE` (`loginlanehttp/handler.go:860-865` против `:885-886`).
      Форма `personal-cloud-…` в `Create` не зарезервирована
      (`git grep -n 'personal-cloud' -- '*.go' ':!*_test.go'` → только комментарии и строка
      самого зеркала), то есть имя такой формы занимает и самообслуживание арендатора.
    experiment: >-
      Временная проба в `internal/apps/kaname/api/registration/` (testcontainers, настоящая
      база), обёртка `kaname.Writer.AccountsW().Insert` поверх настоящего адаптера, ОДНО
      различие против Ф4-05. Род «посторонний отказ» (обёртка возвращает свою ошибку):
      `store unavailable`, `ErrRefused=false`, из четырёх не осталось ничего, повтор проходит —
      «Тогда» Ф4-25 СХОДИТСЯ. Род «коллизия имени» (строка с тем же именем зафиксирована
      отдельной транзакцией, запись аккаунта — настоящим адаптером): `registration refused`,
      `ErrRefused=true`, клетка наблюдателя `occupied=1 storeFailed=0`, из четырёх не осталось
      ничего, повтор тем же адресом ПРОХОДИТ (адрес свободен) — «Тогда» Ф4-25 НЕ сходится.
      `ok 4.458s`; файл пробы удалён.
    why_blocking: >-
      Одно-фактное различие обязано быть НАЗВАНО так, чтобы «Тогда» из него следовало
      (`change-graph.md` §6). «Запись личного аккаунта отвергается» допускает два
      конструируемых мира с противоположным исходом второго «И». Держатель §10а п. 1 выберет
      тот, что зеленеет, и находка о продукте (свободному адресу отвечают отказом занятости —
      ровно то, что сам Ф4-25 называет ложью по Р3) не всплывёт никогда. Одновременно у
      инварианта UNIQUE на четвёртом следствии нет ни одного сценария, а Р3 перечисляет две
      причины единого отказа при трёх существующих. Заявления §0.6 «кода не требует» и §9
      «красного по существу нет» шире сделанного ровно на этот род.
    what_is_needed: >-
      Автор выбирает ОДИН из двух исходов и пишет его в документ. (а) Исход «продукт обязан»:
      Ф4-25 утверждает невыполнение для ЛЮБОГО рода отказа записи аккаунта; добавляется сценарий
      на коллизию имени личного аккаунта с положительным близнецом (Ф4-05) и названным
      производителем — тогда это красное на дереве, требующее кода (например, отказ имени
      личного аккаунта не классифицируется как занятость либо коллизия не возникает по
      построению), а §0.6/§9/§10а сужаются: «кода не требует» перестаёт быть верным. (б) Исход
      «остаток»: «Дано» Ф4-25 называет род — отказ хранилища, не являющийся нарушением
      уникальности; коллизия имени названа в Р3 третьей причиной единого отказа — с ценой для
      клиента (свободный адрес получает 400 и терминальный по виду отказ, повтор прошёл бы;
      клетка счётчика «занято» лжёт) и носителем (задача с предикатом снятия). Выбор (а)/(б) —
      решение о продукте; документ вправе принять его сам, как принял Р3.
    removal_predicate: >-
      Повтор опыта этой записи (обёртка `AccountsW().Insert` в двух родах) даёт исход, который
      документ объявляет для каждого рода; строка §7 для каждого рода называет ветку `refuse`,
      которая его производит.

