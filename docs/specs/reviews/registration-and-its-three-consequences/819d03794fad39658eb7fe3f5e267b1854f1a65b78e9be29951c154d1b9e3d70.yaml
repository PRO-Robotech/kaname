decisions_ruled:
  - question: Блокирует ли открытый вопрос §12 п. 8 (членство в собственном личном аккаунте)?
    ruling: >-
      НЕТ. Проверено чтением §6 (одно вхождение «членства», о чужом аккаунте) и посевом обеих
      ветвей: исход вопроса не меняет ни числа записей снимка, ни метки `owner`, ни состава
      четырёх следствий. Вопрос законно стоит вне документа и идёт владельцу через диспетчера.
  - question: Считать ли Б1 находкой о продукте вне приёмки, а не дефектом документа?
    ruling: >-
      НЕТ. Документ сам утверждает второе «И» Ф4-25 и сам же выбирает держателя, чья инъекция
      этот род не порождает; значит дефект — в том, что «Дано» не называет род, а «кода не
      требует» шире сделанного. Продуктовая часть находки (свободный адрес получает отказ
      занятости) — следствие, ей нужен носитель в любом из исходов (а)/(б).
  - question: Годна ли для Ф4-25 инъекция посторонней ошибкой, которую §10а п. 1 фактически описывает?
    ruling: >-
      Годна как ОДИН из родов и сходится (опыт). Недостаточна как единственный: она не
      отличает дерево, где запись аккаунта не может отказать занятостью, от дерева, где может.
  - question: Роды блокирующих прошлых кругов повторились?
    ruling: >-
      Нет: прошлый круг блокирующих не имел. Правило §14а о повторе рода не применяется.

