verification:
  method: experiment_not_reading
  what_changed_my_reading: >-
    Я шёл к ✅: посевы Ф4-26/27 сошлись дословно с опытом автора, инъекция 2.1 — с §9, открытый
    вопрос оказался не влияющим. Прочитав `refuse` целиком, я увидел, что классификация идёт по
    сентинелу, а не по месту отказа, и что у записи аккаунта есть собственный источник
    `ALREADY_EXISTS`. Опыт превратил подозрение в находку: без посева обоих родов её бы не было.

limits:
  - >-
    Вердикт о приёмке, а не о коде: блокирующее требует выбора исхода в документе, а не правки
    продукта в этом круге.
  - >-
    Сквозной держатель Ф4-26 не гонялся: стенда под own нет (kacho#2699 OPEN) — «не
    выполнилось», о поведении на кластере вердикта нет.
  - >-
    Инъекция §9 п. 2.2 («регистрация не пишет аккаунт») не повторялась: автор сам объявил её не
    изолирующей, и это не утверждение, требующее опровержения.
  - >-
    Вероятность коллизии имени не измерялась на данных: хвостов 32^6 ≈ 1,07·10^9 — арифметика по
    `ids.NewID` (тело из crypto/rand), а не замер.

found_on_the_way:
  - >-
    Продуктовая сторона Б1 (носителя нет): регистрация на свободный адрес при коллизии имени
    личного аккаунта отвечает отказом занятости; клетка счётчика — «занято». Та же функция
    `BootstrapPersonalResourcesTx` вызывается провизион-хуком посадки `external`
    (`internal_upsert.go:515`) — исход коллизии там НЕ проверялся.
  - >-
    Н2 документа (лишняя метка `viewer` у собственного аккаунта) подтверждена посевом:
    `roles=[owner viewer]`; носителя в трекере нет.

