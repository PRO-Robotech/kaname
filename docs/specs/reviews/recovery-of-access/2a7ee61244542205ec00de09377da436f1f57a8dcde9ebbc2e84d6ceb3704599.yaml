accepted_parts: >-
  Перевод E→I по образцу ветви «л» Ф13-06 обоснован двумя неисполнимостями на уровне E (внесённое
  различие — правка продукта; потолок ниже шума общего ранера), число шума названо оценкой шапки
  пробы, а не замером. Производитель назван у каждой части «Тогда» Ф5-20…22, пробелы (частота как
  «не выполнилось»; пара полос A/Z для последнего «И» Ф5-29) названы заказами с носителем kaname#468
  (OPEN) и закрываются DoD п.4, а не зачитаны в зелёное. Близнец: Ф5-21 против Ф5-20 — один факт
  (синхронная постановка вместо диспетчера); Ф5-22 против Ф5-20 — размах выше потолка. DoD п.3
  требует зелёного ручного прогона с печатью величин; «не выполнилось» его не закрывает. Ф13-28 не
  тронута, держатель kacho#3273.

