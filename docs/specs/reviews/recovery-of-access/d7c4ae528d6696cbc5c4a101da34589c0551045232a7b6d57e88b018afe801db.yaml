blocking:
  - kind: COVERAGE
    text: >-
      Р9 п. 1 выдаёт код на неподтверждённый адрес личности ACTIVE без способа входа, а публичный
      сайт документации службы утверждает обратное без оговорки: docs/content/api/auth-lane.mdx
      :244–248 (врезка «Восстановление для неподтверждённого адреса»: «кода не выдаёт (исход
      unverified): сперва адрес подтверждается кодом из письма») и docs/content/advanced/
      observability.mdx:207 (клетка `unverified` — «код для него не выдаётся»); тот же тезис —
      комментарий internal/apps/kaname/retention/registry.go:106–107. Документ ни одно из этих мест
      не называет (обход по свойству сделан только для «кто ставит отметку»), §10 п. 7 их правки не
      заказывает — исполнение по букве оставит в публичной документации ложь о поведении, а
      Ф5-29 утверждает ровно противоположное врезке. Добавить в §3 (или §5.5) обход второго
      свойства Р9 тем же способом, что «Обход редакции 8» (один предикат, три дома, исход у каждой
      строки), назвать правку трёх мест тем же изменением реализации kaname#608 и дописать их в
      §10 п. 7. Формулировка в публичном тексте — без сценария злоупотребления (security-
      disclosure.md). Род тот же, что в кругах 5 и 6 (полнота обхода дельты), но предмет новый —
      другое свойство Р9; передать диспетчеру по §14а: в форму задания автора — «обход по КАЖДОМУ
      свойству, которое меняет решение, а не по одному».

