blocking:
  - kind: COVERAGE
    place: §4.2, строка «завершение у личности в состоянии членства PENDING … без строки» (новая в ред. 6)
    claim: >-
      Граница обоснована неверным фактом о дереве и принципом, который дисквалифицирует сам Ф5-29.
      (1) «Сессию выдают только действующей (Ф1-05, Ф1-59)» — дерево выдаёт сессию и PENDING:
      internal/domain/user.go:69 MaySignInToOwnLane → ACTIVE || PENDING; login.go:316–319
      (kaname#456, положение подтверждения); verification.go:496 разбирает сессию PENDING.
      (2) «Посев состояния, которого продукт не производит, сценарием не является» — «Дано» N/NB
      Ф5-29 (подтверждённый адрес без строки «пароль») в дереве тоже не производится: единственный
      писатель отметки — MarkEmailVerified (verification.go:461) после разбора сессии; сессии
      выдают login.go:551 (нужен пароль), register.go:227 (строку заводит), recovery_complete.go:309
      (без строки откатывается); удаления строк способа нет. Производитель этого состояния — Ф13
      (не посажена), что документ не называет.
    fix: >-
      Обосновать PENDING верным фактом: отметка и активация приглашения — одна транзакция
      (verification.go:461, 496–507; отказ активации откатывает отметку) — PENDING с подтверждённым
      адресом не фиксируется. В Р5/§5.5/§7 назвать производителя состояния «Дано» Ф5-29 — Ф13
      (вход только ключом), сегодня только посев; принцип §4.2 привести к этому различию.

