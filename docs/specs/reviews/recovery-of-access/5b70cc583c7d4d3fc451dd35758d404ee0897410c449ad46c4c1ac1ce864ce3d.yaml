questions:
  - q: новая редакция исполняет РОВНО решение — ни шире, ни уже
    answer: >-
      ДА. Р5 переписано под одно обращение с порядком, который производит код; Ф5-03 — «Когда» с
      `newPassword`, «Тогда» — durable-запись, полноправная сессия; Ф5-23 снят вместе с
      предметом (не ослаблен); Ф5-24 — положительный близнец с двояким по времени
      отрицательным контролем; поле и читатели — `kaname#201`; пять вопросов ban #18 — как назвал
      оркестратор, без добавлений; отвергнутый исход 2 — с доводом Ф3 Р6. Не тронуты Р1…Р4, Р6,
      Р7, Ф5-17…19 — проверено диффом. Шире — ноль; уже — ноль.
  - q: у каждого нового/изменённого «Тогда» есть производитель; у снятого назван предмет
    answer: >-
      Ф5-03: `internal/apps/kaname/api/humansession/recovery_complete.go` `Execute` — порядок
      «форма → частота → правило (Judge, до ConsumeRecoveryCode) → чтение адреса → одна
      транзакция … выдача сессии, если не заблокирована»; отказ правила — `*FieldError{Field:
      "newPassword", Rule: …}` (`password_rule.go`); код при негодном пароле не тратится —
      `rule.Judge` стоит до `w.ConsumeRecoveryCode`. Ф5-24: `Resolve` — Ф3-09 (служба);
      читатель поля на крае жив — `gateway/internal/middleware/authz.go:489` на 275240efdc,
      поэтому отрицательный контроль «посев R′ с полем под живым читателем» конструируем до
      #201, как документ и пишет. Ф5-23: предмет снятия назван — поле сессии и его читатели.
  - q: отрицания с положительным близнецом
    answer: >-
      Ф5-24 несёт близнеца `L` внутри сценария; отрицательный контроль назван поимённо и в обе
      эпохи (до/после #201). Ф5-03 — положительный контроль к Ф5-04/05/07/08, как прежде.
  - q: прежние записи ревью не тронуты
    answer: ДА — `git diff 6acf8f19..c6a3c12e -- docs/specs/reviews/` пуст.
  - q: соседи согласны
    answer: >-
      ДА — Ф3 §0.1/§7.2 и Ф1 §5 называют Ф5 Р5/Ф5-03/Ф5-24 редакции 3 теми же словами; Ф3 Р8
      и Ф5 Р5 — одна норма с двух сторон, без второго изложения.

