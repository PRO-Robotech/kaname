blocking:
  - kind: COVERAGE
    text: >-
      Неназванная дельта к одобренной соседней приёмке. Р9 п. 3–4 ставит отметку подтверждения
      адреса в транзакции завершения восстановления, вызывая существующий оператор. Одобренная
      access-beyond-login-needs-a-verified-address.md утверждает (EV-86), что отметки ставит
      только глагол EV-30, и тот же тезис несёт текст находки гейта писателей отметки
      (internal/check/people_address_writers.go, markWriterFinding: «ставит её только предъявление
      кода подтверждения»); §5.5 (4) сам фиксирует единственного вызывающего
      (verification.go:461). Гейт судит операторы SQL и останется зелёным — расхождение
      невидимо ни с одной стороны по отдельности (security-hardening.md §«Части, исправные по
      отдельности, не сходятся в целое»). §3 Ф5 («обход по свойству, исход у каждого
      расхождения») строки на это свойство не имеет. Добавить строку Д с исходом: какой текст
      соседней приёмки и находки гейта истекает или правится, в каком доме, и чем держится
      «второй вызывающий оператора отметки — только завершение восстановления личности без
      пароля» (перепись вызывающих с инъекцией в обе стороны, пункт §9/DoD).

non_blocking:
  - kind: COVERAGE
    text: >-
      Тот же стык со стороны глагола смены адреса: перечень условий, с которыми он вносится
      (addressWriterFinding), Р9 не упоминает. Решить в строке Д выше, нужно ли условие о
      личности без способа входа; публичным текстом без разбора последствий.
  - kind: FORMAT
    text: >-
      Ф5-30 (б) утверждает «сегодня отвечает 503» — это факт §5.5 (2), а не исход «Тогда»;
      держать его в колонке «красное до кода» §9, где он уже есть.

