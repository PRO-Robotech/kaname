      дословно, каждая ровно одна (`grep -cxF` → 1 по каждой), контроль в другую сторону `grep -cxF
      'verdict: CHANGES_REQUESTED'` → 0 и строка чужого отпечатка (713ff0bd…) → 0; отпечаток тела
      `gh api … | jq -j .body | sha256sum` → 54e7e4c807d7475f1f82e0de30193b2892ba5fe113cfbe0f140a433bc6964524, совпал с `event.body_sha256`;
      `created_at == updated_at` ⇒ после публикации тело не правилось.
    ban1_fact: >-
      `ban1_lifted: true` — по факту, а не по форме. Предмет, который событие снимает, назван
      `what_the_event_would_lift`: ban #1 для Ф5-25 (kaname#305, шаг 2). Код этого шага внесён
