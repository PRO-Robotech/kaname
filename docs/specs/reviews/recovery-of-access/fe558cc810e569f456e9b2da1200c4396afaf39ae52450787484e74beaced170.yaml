  - id: N1
    class: doc-truthfulness
    text: >-
      §4.3: знаменатель радиуса обновлён («из двадцати пяти»), числитель — нет, хотя «Дано» Ф5-25
      («личность с подтверждённым адресом», код Ф5-01) строится тем же, что Ф5-01. Единица «сценарии,
      которым Ф5-01 — положительный контроль» унаследована от одобренной редакции 3 и под Ф5-25 не
      подходит; на исполнимость не влияет (посев — записью в базу, как там же сказано).
  - id: N2
    class: doc-truthfulness
    text: >-
      Строка «Статус» отстаёт от каталога записей (с этой — три); документ это называет сам и
      выносит за объём правки. Тот же класс, что N1 круга 7 Ф3: заменить числа предикатом по каталогу.
  - id: N3
    class: disclosure
    text: >-
      Документ на уровне свойства, но рядом с открытой P1 задачей, чей заголовок называет признак,
      требование читается как описание текущего поведения. Окно закрывает только посадка полосы —
      сажать её той же волной, что и документ; тела записи и события держать на уровне
      «сценарий исполнен в обе стороны», без наблюдаемого до правки.

