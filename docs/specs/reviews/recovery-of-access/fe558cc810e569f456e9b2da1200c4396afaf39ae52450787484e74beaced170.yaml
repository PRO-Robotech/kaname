checks:
  fingerprint_match: true
  papers_agree: >-
    Приёмки больше не расходятся: абзац один (29a72272…) в Ф3 Р10 и Ф5 Р5; строка Ф5 §7 в Ф3 §7.2 и
    сводка Ф3 §12 говорят тот же смысл; противоречащих строк о завершении и счёте в Ф3, Ф11, Ф12 нет
    (grep по «восстановлен» × «счёт|обнул|сброс»).
  scenario_count: 'метки Ф5-N: 25 в §6 и 25 в §7 (предикат документа исполнен); было 24'
  producer_present_for_every_then: >-
    25 из 25. Ф5-25: kaname#305 (полоса) плюс Ф3 #1269 (правило, величины, форма отказа);
    тождество счёта и бюджета подбора кода — Ф12-31 «б» в доме Ф12, здесь не переутверждается.
    «Место решения одно» держит гейт дерева `internal/check` (единственный писатель обнуления) —
    существует, запись ведомости kaname#305 в нём есть и самоистекает (см. experiment).
  positive_twin_for_every_negation: >-
    Ф5-25 (а) и (в) — замки, близнец (б) в самом сценарии; отличающий факт — один (заведён ли
    второй фактор / заблокирована ли личность). Различимость показана посевом.
  constructibility: >-
    Посеяно 3 из 3 «Дано» Ф5-25 (A — строка второго фактора посевом в хранилище способов, B, C —
    блокировка признаком личности; профиль N_адрес=3, N_источник=5 удовлетворяет обоим условиям
    «Дано»), «не выполнилось» 0.
  dod_measurable: '§9 и §10 п.5 называют пробу, её уровень и предикат снятия записи ведомости — измеримо.'
  open_questions: none
  conventions: >-
    Новой ручки, RPC, поля и отказа нет; коды и форма отказа — существующие (Ф3-02, Ф3-28).
  disclosure: >-
    Текст — уровень свойства: абзац называет правило (что обнуляет счёт и что нет), а не состояние
    дерева до правки. НЕ блокирующее; см. N3.

experiment:
  isolation: >-
    Собственный экспорт `git archive 253cf0446` вне деревьев git; файл посева — только в экспорте;
    экспорт удалён после прогонов. Прогоны по одному, с пониженным приоритетом.
  seed_before_lane_fix: >-
    go test -p 1 -count=1 -run '^TestReview_F5_25_Seed$' на 253cf044 → исполнено ветвей 3:
    близнец (б) зелёный, замки (а) и (в) красные — сценарий способен упасть до правки полосы.
  seed_after_candidate_fix: >-
    Кандидатная правка полосы в экспорте: завершение решает счёт через место решения входа
    (заведённое читается до транзакции, предъявленное — вид сессии восстановления), у
    заблокированной решения нет. Тот же прогон → 3 из 3 зелёных; пробы восстановления пакета
    (`^TestRecovery_`) — 13 из 13 зелёных. Сценарий исполним, не самопротиворечив.
  ledger_self_expiry: >-
    TestFailureResetGoesThroughTheCompletedLoginGuard на кандидатной правке → красный ровно одной
    находкой: запись ведомости kaname#305 «больше нечего исключать». Так §9 и предикат снятия
    kaname#305 и описывают: запись снимается тем же изменением, что правка полосы.

