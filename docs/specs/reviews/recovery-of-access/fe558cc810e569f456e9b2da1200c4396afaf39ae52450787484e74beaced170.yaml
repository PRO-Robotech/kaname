      Обе отметки — локальная коммита и серверная толчка — стоят позже события.
    mechanism: >-
      Правка ЭТОЙ записи на месте, а не новая запись и не правка шапки документа. Отпечаток
      предмета не менялся, а координата записи ПО ОПРЕДЕЛЕНИЮ есть этот отпечаток
      (`<sha256>.yaml`), поэтому второй записи о той же редакции не бывает by construction.
      Запрет change-graph.md §2 («история ревью добавляется, не переписывается») предметом имеет
      РЕДАКЦИЮ: новая редакция получает СОСЕДНЮЮ запись. Здесь редакция та же; вердикт, разбор,
      находки, числа, `why` и `publication_pending` не тронуты — они рассуждение на момент
      вердикта, когда события ещё не было. Тронуты ровно три выводимых поля
      (issued/issued_at/ban1_lifted), добавлены этот блок и блок `event`. `effective_approval`
      выводится из СОБЫТИЯ, наступившего позже записи; не привести его к факту значит оставить
      запись, утверждающую «санкции нет» там, где она выдана.
    precedent: >-
      Форма — записи кругов 8 и 6 (`second-factor-…/02b30c2e…`, `login-lane-…/713ff0bd…`; блок
      `event` — 111a598a7, санкция — d060e6df6). Инвариант каталога на 4ed53c9b: записей 57; с
      `verdict: APPROVED` и `event.status: performed` — 23, `issued: true` у всех 23; после правки —
      27 и 27. Контроль в другую сторону, который приводил d060e6df6 (`registration-…/7c81fa29…`:
      APPROVED при `event.status: not_performed` и `issued: false`), перемером ОПРОВЕРГНУТ: событие
      на трекере есть (kaname#256, 5731034477), это пятая молчащая запись, а не контроль. Пары, где
      вердикт и событие расходятся, в каталоге этой ревизии нет вовсе, поэтому «поле следует
      событию» и «поле следует вердикту» каталог НЕ различает. Правка от различения не зависит: у
      этой записи вердикт APPROVED и событие состоялось — оба правила дают `issued: true`.
    divergence_predicate: |-
      python3 - <<'PY'   # из корня рабочей копии kaname; нужен PyYAML
      import glob, yaml
      rows = [(p, yaml.safe_load(open(p))) for p in sorted(glob.glob('docs/specs/reviews/*/*.yaml'))]
      bad = [p for p, d in rows
             if (d.get('event') or {}).get('status') == 'performed'
             and d.get('verdict') == 'APPROVED'
             and (d.get('effective_approval') or {}).get('issued') is not True]
      print('осмотрено', len(rows), '· расхождений', len(bad))
      for p in bad:
          print(' ', p)
      PY
    divergence_predicate_result: >-
      На 4ed53c9b — «осмотрено 57 · расхождений 0», и это молчание СЛЕПОЕ: предикат судит только
      запись с блоком `event`, а эта запись его не несла. Промежуточное состояние этой же правки
      (блоки `event` дописаны, `effective_approval` ещё нет) — «осмотрено 57 · расхождений 4»:
      краснеет ровно на четырёх записях правки. После — «осмотрено 57 · расхождений 0».
    silence_predicate: |-
      python3 - <<'PY'   # из корня рабочей копии kaname; нужны PyYAML и gh
      import glob, json, subprocess, yaml
      rows = [(p, yaml.safe_load(open(p))) for p in sorted(glob.glob('docs/specs/reviews/*/*.yaml'))]
      tasks = sorted({t for _, d in rows for k in ('task', 'edition_task')
                      if '#' in (t := str((d.get('subject') or {}).get(k) or ''))})
      com = {t: [c for page in json.loads(subprocess.run(['gh', 'api', '--paginate', '--slurp',
             'repos/%s/issues/%s/comments?per_page=100' % tuple(t.split('#'))], capture_output=True,
             text=True, check=True).stdout) for c in page] for t in tasks}
      silent = [(p, c['id']) for p, d in rows if (d.get('event') or {}).get('status') != 'performed'
                for k in ('task', 'edition_task') for c in com.get((d.get('subject') or {}).get(k), [])
                if {'role: acceptance-reviewer', 'subject_sha256: ' + p[-69:-5]} <= set(c['body'].splitlines())]
      print('записей', len(rows), '· задач', len(tasks), '· комментариев', sum(map(len, com.values())),
            '· событие есть, запись молчит', len(silent))
      for p, i in silent:
          print(' ', p, i)
      PY
    silence_predicate_result: >-
      На 4ed53c9b — «записей 57 · задач 17 · комментариев 94 · событие есть, запись молчит 5»:
      четыре записи этой правки и `registration-and-its-three-consequences/7c81fa29…` (kaname#256,
      событие 5731034477) — тот же дефект вне объёма этой правки, назван в её возврате. После —
      «… молчит 1». Граница названа: опрашиваются только задачи из `subject.task` и
      `subject.edition_task`; контроль в другую сторону (то же сопоставление по записям С блоком
      `event`) находит 18 событий из 23 записанных, пять остальных лежат в задачах, названных
      записью иначе. Число молчащих — нижняя граница, а не перепись.
    gate: >-
      ГЕЙТА на это свойство в дереве НЕТ. Замер на 4ed53c9b: `grep -rln 'effective_approval\|publication_pending'
      internal/ scripts/ Makefile .github` в kaname → 0 файлов; в `scripts/change-graph-gate/` и
      `scripts/docs-gate/` воркспейса → 0. Каталог `docs/specs/reviews/` читают три пробы
      `internal/check` (ведомость вершин вопроса об истории, перепись посева) — поля санкции ни одна
      не судит. Оба предиката выше держатся ВНИМАНИЕМ; держатель класса «событие на трекере есть —
      запись о нём молчит» — предмет tooling-maintainer, назван сверкой волны 377.

