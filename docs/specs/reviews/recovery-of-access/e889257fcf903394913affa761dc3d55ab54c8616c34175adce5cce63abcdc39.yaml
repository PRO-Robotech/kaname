    experiments:
      - name: 'форма Ф-а, свойство «журнал по ключу потока: повтор — бездействие» (§5.2а, строка 1)'
        control: >-
          шесть названных проб на чистом дереве — PASS 6 из 6 (`_S01_`, `_S02_`, `_S05_`,
          `_S07_`, `_BlockedStaysBlocked`, `_ActiveStaysActive`), ok 3.965s
        injection: 'снят ранний возврат по неудавшейся вставке строки журнала (`if !inserted { return }`)'
        result: >-
          СОШЛОСЬ ДОСЛОВНО, ВКЛЮЧАЯ КООРДИНАТЫ. FAIL у одного
          `TestOnRecoveryCompleted_S05_DuplicateJTI_IdempotentNoop`, и отказ пришёл РОВНО по
