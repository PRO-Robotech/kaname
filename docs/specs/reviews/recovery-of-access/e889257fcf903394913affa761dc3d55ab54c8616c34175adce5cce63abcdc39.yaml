verification:
  method: experiment_not_reading
  what_i_did_not_take_on_trust: >-
    Ни одного числа. Все предикаты §1, §5.1, §7, §4.3 прогнаны заново; перечень соседей
    выведен; цитаты из Ф1, Ф11 и F4d сверены со строками чужих документов дословно (F4d 767 и
    1779 прочитаны целиком, Ф11 703/705/839/1337 — тоже); способность держателя упасть
    проверена инъекцией, воспроизведшей заявленные КООРДИНАТЫ отказа, а не только «красное».
  what_changed_my_reading: >-
    Я готовился считать Ф5-14 блокирующим — сценарий, чей производитель заблокирован, обычно
    и есть способ протащить требование без производителя. Изменило решение чтение ведомости
    САМОЙ Ф1: производителем второй половины Ф1-31 назначен `#1773` ею, а не этим документом.
    То есть Ф5 не назначает себе удобного производителя, а наследует чужое назначение и
    честно называет срок. Обратный исход (вычеркнуть) терял бы требование навсегда.

limits:
  - >-
    Это вердикт о ПРИЁМКЕ, а не о будущем коде: требования названы, наблюдаемы, снабжены
    производителями и не противоречат одобренным соседям. О верности реализации он не говорит.
  - >-
    Внешнее полномочие — «не выполнилось», ТРЕТЬЯ категория; санкции вердикт не выдаёт.
  - >-
    Сквозные пробы и поднятый стенд не гонялись — их предмета не существует (§9, вся полоса
    красная до кода by construction). Ф5-14 не проверяем в принципе до закрытия #1773.
  - >-
    Инъекций поставлено ДВЕ из пяти строк §5.2а (журнал по ключу потока и встречная половина);
    остальные три строки таблицы я принял по описанию, проверив лишь резолвимость координат и
    имён. Это названо прямо: заявление «все пять свойств формы Ф-а держатся» я НЕ перепроверял
    целиком.
  - >-
    32 координаты чужого дома проверены вручную — гейт дома их не резолвит by construction.
    Автоматического держателя их свежести нет; при движении kacho они устареют молча.

found_on_the_way:
  - >-
    Задач в трекере не заводил (условие задания). Ни одна находка круга на задачу не тянет.
  - >-
    Наблюдение для формы раздела, а не для этого документа: двусторонняя сверка §5.2↔§7 —
    единственное, что связывает перепись производителей с ведомостью, и в прежних редакциях
    ОБОИХ документов пачки она давала расхождение (7 из 9 здесь, 4 из 7 у Ф4) плюс форму, не
    названную ведомостью ни одной строкой. Класс принадлежит форме раздела: перепись и
    ведомость пишутся в разные заходы. Дешевле перенести предикат в форму задания автору
    приёмки, чем находить это ревью третий раз.

