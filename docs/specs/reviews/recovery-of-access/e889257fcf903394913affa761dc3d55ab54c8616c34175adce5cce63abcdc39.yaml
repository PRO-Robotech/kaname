role_review:
  producers_for_every_then:
    checked: >-
      Все 24 «Тогда». Перепись двумя выражениями: awk по §6 → 24 различных метки, awk по §7 →
      24, `diff` СОСТАВОВ пуст. Контроль латинской формы `F5-0` → 0.
    verdict: >-
      Производитель назван у 24 из 24 и пригоден по роду. Разобраны спорные: Ф5-14 — род
      «наблюдаемая величина», производитель `#1773` (OPEN, blocked), и это НЕ уловка (см.
      ниже); Ф5-16 опирается на форму Ф-а, существующую сегодня, а источник события меняет Ф5 —
      расщепление верное, я проверил его инъекцией; Ф5-24 производит Ф3 (смена пароля), а
      требование, которое он контролирует, — Ф5 (Р5); Ф5-18 — Ф3 плюс форма Ф-а.
  the_locked_scenario:
    why_checked_separately: >-
      Различение «запирает» и «делает неисполнимым» — самое опасное место документа: им легко
      протащить «Тогда» без производителя, назвав отсутствие производителя сроком.
    verdict: >-
      ВЫДЕРЖИВАЕТ. Ф5-14 — вторая половина Ф1-31, и ведомость САМОЙ Ф1 §5 называет её
      производителем именно `#1773`: строка «Ф1-31 | ответ вызывающему не меняется — Ф5 |
      недоставленное видно — `#1773`» прочитана дословно. То есть производитель не выдуман
      этим документом ради сохранения сценария, а унаследован от одобренного родителя. Задача
      существует, OPEN, метка `blocked` — подтверждено. Радиус запирания назван честно и
      проверен мной: запирается РОВНО один сценарий из 24, остальные 23 от почты не зависят,
      потому что предмет фазы кончается постановкой строки в НАШУ очередь, а очередь наша
      (§1.4 перемерена). Довод «приёмка, вычеркнувшая сценарий из-за срока, теряет требование
      навсегда» принят: вычеркнутое некому вернуть, и вторая половина Ф1-31 снова стала бы
      ничьей — §8 инвариант 10 закрепляет это отдельной строкой.
  homes_for_every_given:
    checked: 'Сверка §4.3↔§7 предикатом документа: `comm -13` → ПУСТО.'
    verdict: >-
      «Дано» строится названным домом у 24 из 24. ДВА строятся не нашей базой, а чужими
      фазами — «Дано» Ф5-01 (личность: Ф4 #1270; подтверждённость адреса: Ф6 #1272), — и
      документ не прячет это: §4.3 прямо говорит, что формулировка «каждое „Дано" строится
      нашей базой» была бы шире сделанного, и называет обе строки. Радиус назван ЧИСЛОМ и
      перепроверен мной: Ф5-01 объявлен положительным контролем Ф5-02, Ф5-04, Ф5-05 и Ф5-08,
      то есть нерешённость его «Дано» унесла бы ПЯТЬ сценариев из 24 — счёт верен.
      Конструируемость обеспечена посевом, и прецедент назван точно: одобренная Ф11 строит то
      же условие «адрес — записью» (её ведомость, столбец «исполнимо с», прочитан мной).
  holders_can_fail:
    method: >-
      Повтор инъекции с законным близнецом; ровно одно внесённое различие; откат доказан
