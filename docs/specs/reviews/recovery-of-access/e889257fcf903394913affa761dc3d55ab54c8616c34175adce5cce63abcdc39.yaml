      - name: 'встречная половина той же находки: прежде названные держатели'
        control: 'не требуется — вопрос в том, краснеют ли они вообще'
        injection: 'та же, одна'
        result: >-
          ПОДТВЕРЖДЕНО. Прежде названные unit-пробы каталога `internal/apps/kaname/api/user`
          при снятом свойстве остаются ЗЕЛЁНЫМИ: `-run 'TestOnRecoveryCompleted_S0(3|4|6)'` →
          ok 0.100s, весь каталог → ok 0.387s. Документ называл 0.092s и 0.382s — расходится
          шумом машины, не исходом, и он сам это предупреждает. Значит находка §0.5 п. 1
          («шапка файла держателей прямо говорит обратное») истинна, а §5.2а заведён по делу.
      - name: 'форма Ф-з — распознаватель очередей, на который опираются Ф5-10, Ф5-11, Ф5-15'
        control: '`go test -count=1 -short ./internal/check/` → ok, код 0'
        injection: 'штатные инъекционные пробы пакета, прогнаны с -v'
        result: >-
          Держатель СПОСОБЕН найти и СПОСОБЕН смолчать — проверено обеими сторонами:
          `TestDrainRecognizer_WiringFormCanFindAndCanStaySilent` (7 подслучаев, среди них
          «сканер той же очереди — молчание», «чужой пакет с тем же именем типа — молчание»,
          «неизвестный тип библиотеки — ЯВНЫЙ ОТКАЗ»), `…OperatorForm…` (5 подслучаев) и
          `TestDrainRecognizer_EmptyTraversalIsRefused` — все PASS. Пустой обход отвергается,
          то есть Ф5-10 «пустой обход — отказ, а не успех» имеет живой производитель формы.
  both_sides_of_every_axis:
    checked: 'По сценариям §6, а не по таблице §8.'
    axes:
      - 'код: Ф5-03 (в срок — проходит) ↔ Ф5-04 (после срока) ↔ Ф5-05 (второй раз, и под конкуренцией ровно одно)'
      - 'предъявительность: Ф5-07 (прочитанное из хранилища отвергается) ↔ Ф5-03 (настоящий код в тот же срок проходит)'
      - 'величина: Ф5-06 (незаданный срок — отказ старта) ↔ Ф5-07 (объявленный срок поднял процесс)'
      - 'частота: Ф5-08 (N+1 — отказ) ↔ Ф5-03 (в пределах величины принимается)'
      - 'перепись: Ф5-10 (две величины, пустой обход — отказ) ↔ Ф5-11 (законный близнец молчит)'
      - 'исходы отправки: Ф5-12 (узел недоступен → клетка «лечится временем», ответ НЕ меняется) ↔ Ф5-13 (не почтовый протокол → клетка НАСТРОЙКИ, не повторяется вечно)'
      - 'завершение: Ф5-17 (блокировка не снимается) ↔ Ф5-18 (незаблокированная входит)'
      - 'время: Ф5-20 (критерий) ↔ Ф5-21 (инъекция обязана краснеть) ↔ Ф5-22 (шум стенда — «не выполнилось»)'
      - 'новый пароль: Ф5-23 (иное действие отвергается) ↔ Ф5-24 (после смены проходит всё)'
    verdict: >-
      Односторонних осей не найдено. Отдельно отмечаю Ф5-12/13 как образец: это не «успех и
      отказ», а ДВЕ РАЗНЫЕ КЛЕТКИ одного закрытого набора — недоступность лечится временем,
      неверная настройка не лечится никогда. Это прямое исполнение
      `security-hardening.md` инв. 8 («мягкий проход обязан отличать настройку от сбоя»), и
      Ф5-20 несёт ещё одну третью категорию: прогон, где хоть раз сработал отказ по частоте, —
      «не выполнилось», иначе полоса мерила бы предел частоты вместо неразличимости.
  agreement_with_approved_neighbours:
    method: 'Обход по свойству обоими языками; каждое вхождение адъюдицировано заново.'
    findings:
      - 'Д2а — САМОЕ СИЛЬНОЕ расхождение пачки, и разобрано оно верно. F4d §6 строка 767 прочитана целиком и совпадает ДОСЛОВНО: «поток восстановления кодом по почте | поставщик | **истекает** на полосе `own`; замещается сбросом распорядителем (Р4) и вынесен в §12 с условием возврата». Довод документа проверен: условие возврата F4d §12 — «почтовый тракт заведён продуктом» (строка 1779, прочитана), и читать «замещается» как «навсегда» значило бы сделать §12 ТОГО ЖЕ документа беспредметным — условие возврата, которое ничего не возвращает, условием не является. Исход (замещение становится дополнением; «истекает» относится к потоку ПОСТАВЩИКА и действительно истекает вместе с ним) внутренне непротиворечив и не требует правки чужого документа здесь.'
      - 'Д5 — истечение строки одобренной ID-MAIL-1 Р23 наступает ИМЕННО ЗДЕСЬ, и это признано, а не обойдено. После Ф3 и Ф5 потока поставщика не существует, значит у письма восстановления не остаётся ни одного отправителя — ровно тот признак нарушения, который Р23 сама называет («вид письма, у которого два отправителя, — либо вид, у которого нет ни одного»). Исход — вид переезжает в нашу полосу (Р3), правка строки в её доме. Верно: чинить чужой предмет здесь сделало бы вердикт непрослеживаемым.'
      - 'Д4/Д11 — ОТОЗВАННАЯ ССЫЛКА, и отзыв корректен. Прежняя редакция называла источником уровня F4e-05б; одобренная Ф11 по этой оси её ЗАМЕСТИЛА. Проверено дословно: строка 705 Ф11 — «F4e Р1, литерал `code`; F4e-05б | восстановление — вид `code`, «1» | **заменено имя, ступень та же**: `recovery_code`, «1» (Р8, Ф11-07)». Ф11 Р8 действительно объявляет словарь с `recovery_code`; Ф11 Р2 (строка 703) — «код восстановления ко «2» не прибавляет»; Ф11-29 (строка 839) — уровень «2» достигается предъявленным ЗАДАННЫМ паролем плюс фактором. Все три цитаты точны. Ф5 своего решения об уровне не заводит и ни одним сценарием на него не опирается (§5.3 п. 4 снял строку целиком) — проверено по §6.'
      - 'Д12 — вопрос, ПОИМЁННО переданный этой фазе одобренным соседом. Строка Ф11 §6 (1337) прочитана целиком: «0 сценариев (цену показывает Ф11-29) | … | Ф5 (`#1271`) и Ф12 (`#1281`, «обязателен ли второй фактор и для кого») — требовать ли второй фактор в самом восстановлении, если он заведён; ответ меняет «Дано» Ф11-29». Разведение на две половины верно и НЕ является уклонением: половина «что делает Ф5 сегодня» РЕШЕНА здесь (фактора не требует — дословный перенос Ф1-25…27, где предъявляется код и задаётся пароль, и ничего больше; Ф1-27 прочитан), половина «вводить ли» есть вопрос об ОБЯЗАТЕЛЬНОСТИ фактора, то есть предмет Ф12 #1281 (OPEN, заголовок задачи подтверждает предмет). §4.2 несёт строку с носителем И предикатом возврата, §12 п. 7 называет цену нетребования и не прячет её.'
      - 'Д6/Д7/Д8/Д9 — ID-MAIL-1: очередь используется как есть, MAIL-04 не переутверждается (два места об одном предмете разошлись бы), подтверждённость адреса вынесена Ф6 #1272, находка #2670 не чинится здесь (OPEN, метка `home:kaname` — проверена).'
    verdict: >-
      Расхождений, которые ЭТОТ документ обязан был бы решить и не решает, — ноль. Каждое либо
      решено здесь (Д2а, Д12-половина), либо отдано названному владельцу с предикатом возврата.
  ratified_decisions:
    - 'Р1 — код как предъявитель; срок и однократность держит база, а не приложение. Соответствует ban #10: «под конкуренцией два предъявления одного кода увидят одно и то же „ещё не применён"». Наблюдаемое отделено от устройства — §11 прямо перечисляет, что НЕ названо (форма кода, алфавит, длина, способ хранения, величины предела), и я сверил: в §6 этого действительно нет.'
    - 'Р2 — ответ не ждёт постановки письма в очередь. Предмет заведён верно и выведен из ДВУХ клауз Ф1 сразу (Ф1-25 и Ф1-26 прочитаны): работа, которая на одной полосе делается, а на другой нет, видна по времени даже при равных телах. Признак нарушения назван конкретно.'
    - 'Р3 — второй вид письма в ТОЙ ЖЕ полосе, новой миграцией. Мотив перемерен: §1.4 подтверждена (outbox-таблиц 6; перечень видов закреплён ограничением `ARRAY[''mail.invite.send''::text]` — ОДИН вид; отправитель 678 строк). Применённую миграцию не правят (ban #5) — исход «новая миграция» единственный. Перепись в ДВЕ величины («видов N · отправителей M») — верное требование: одно число скрывает ровно тот случай, ради которого сверка заводится.'
    - 'Р4 — завершение существующее, ключ идемпотентности один и чеканим нами. §1.3 перемерена (305/140 строк, обе таблицы по одному объявлению). Довод, что ключ есть идентификатор ПОТОКА, а не пользователя, подтверждён шапкой самого прод-файла, которую я прочитал: одна личность владеет строками в нескольких аккаунтах. Сохранение блокировки — не побочность, а решение, и оно проверено инъекцией (близнец `_ActiveStaysActive`).'
    - 'Р5 — новый пароль до любого иного действия. Ф1-27 прочитан дословно и это требование несёт. «Иное действие» определено (всё, кроме смены пароля и выхода), отказ обязан называть следующий шаг (ban #18). Ступень доверия сессии восстановления НЕ решается здесь — владелец Ф11; проверено, что ни один сценарий на значение не опирается.'
    - 'Р6 — два пути возврата доступа сосуществуют. Различитель выбран верный — «что доказал человек», а не «какой глагол позвал»: первый даёт отношение, второй — совпадение. F4d Р4 (строка 454) прочитана, остаётся действующей.'
    - 'Р7 — неразличимость ДВУМЯ половинами. Проверено, что Ф1-51 существует отдельной строкой именно потому, что у восстановления есть шаг, которого у входа нет; критерий Ф1-48 берётся дословно, своей величины Ф5 не вводит ни одной.'

non_blocking:
  - id: В1
    where: '§7, абзац «Производителей вне этой фазы — семь»'
    what: >-
      Слово «производитель» здесь взято ШИРЕ, чем в столбце «производитель» таблицы той же
      §7. По столбцу их ТРИ: #1269, #1272, #1773 (замерено разбором таблицы). Семь названных —
      #1268, #1269, #1272, #1274, #1280, #1773, #2670 — это внешние НОСИТЕЛИ документа в
      целом, то есть множество §4.2 минус Ф12 #1281.
    why_not_blocking: >-
      Утверждение не ложно и не скрывает единицу: все семь ПЕРЕЧИСЛЕНЫ номерами в той же
      строке, и я проверил каждый — все OPEN. Сама единица определена в СЛЕДУЮЩЕМ же абзаце,
      который отделяет производителя от строителя «Дано» и прямо называет #1270 и #1281
      непроизводителями. То есть смысл восстанавливается из соседнего абзаца.
    residual_cost: >-
      Читатель, сверяющий число с соседней таблицей, получает 3 и решает, что ошибся один из
      двух. Единица счёта названа не рядом с числом, а через абзац — тот самый шов, о котором
      `writing.md` §2.
    suggested_fix: >-
      Одна вставка: «семь — считая носителей §4.2; по столбцу „производитель" таблицы выше
      их три». Вердикта не касается.
  - id: В2
    where: '§5.2, строки Ф-в, Ф-г, Ф-ж'
    what: >-
      Столбец «где живёт» называет прод-координату (`…/invite_mail_outbox/outbox.go`,
      `internal/clients/invite_mail.go`), а держатели этих форм живут в ДРУГОМ пакете —
      `internal/clients/invite_mail_integration_test.go` и `…_test.go`.
    why_not_blocking: >-
      Не находка: столбцы разные по назначению — «где живёт» о прод-коде, «чем держится» об
      именах проб, и все 19 имён резолвятся `git grep -l "func <имя>"` (проверено каждое).
      Расхождения между столбцами нет, есть лишь отсутствие пути у имени.
    suggested_fix: 'Необязательно. Отмечено, чтобы исполнитель не искал пробы рядом с outbox.go.'
  - id: В3
    where: 'Ф5-06 / Ф5-07'
    what: >-
      Положительным близнецом Ф5-06 («срок не объявлен → отказ старта») назван Ф5-07, чей
      собственный предмет другой — предъявительность кода; поднявшийся процесс стоит у него
      в «Дано», а не в «Тогда».
    why_not_blocking: >-
      Близнец назван ЯВНО и он настоящий: «Дано» Ф5-07 («профиль с объявленным сроком;
      процесс поднялся») невыполнимо, если объявленная величина старт не поднимает, — то есть
      Ф5-06 не может зеленеть на страже, отвергающем любой профиль. Односторонности нет.
    suggested_fix: >-
      Необязательно. Если захочется симметрии с Ф4 (там близнец — отдельный сценарий Ф4-19),
      можно вынести «объявленная величина поднимает процесс» отдельной строкой; на объём это
      не влияет.

decisions_ruled:
  - question: 'Круг первый или повторный?'
    ruling: >-
      ПЕРВЫЙ: предыдущих записей у документа ноль. «Редакция 2» — доводка автора ДО круга;
      вердикта на редакцию 1 не выносилось. Требование «повтори опыт по каждому блокирующему
      предыдущей записи» беспредметно, и это названо, а не исполнено вхолостую.
  - question: 'Сценарий, чей производитель заблокирован (#1773), — блокирующее ли это?'
    ruling: >-
      НЕТ, и это несущее решение круга. Блокирующим было бы «Тогда» БЕЗ производителя.
      Производитель у Ф5-14 есть, он назван, его задача существует и OPEN, а назначен он не
      этим документом, а ведомостью одобренной Ф1 (строка прочитана дословно). Заблокированность
      задачи — вердикт о РАБОТЕ, а не о предмете приёмки; смешение сделало бы вердикт круга
      непрослеживаемым. Обратный исход — вычеркнуть сценарий — потерял бы требование навсегда:
      вычеркнутое некому вернуть, и вторая половина Ф1-31 снова стала бы ничьей.
  - question: 'Передача половины вопроса Ф12 (Д12) — уклонение или решение?'
    ruling: >-
      РЕШЕНИЕ. Уклонением было бы молчание либо «вернёмся позже». Здесь: половина, принадлежащая
      этой фазе, решена явно (фактора не требует, с указанием, что это перенос Ф1-25…27, а не
      новое решение); половина об обязательности отдана владельцу предмета с носителем и
      ПРЕДИКАТОМ ВОЗВРАТА («Ф12 объявляет, для кого фактор обязателен; если в её объёме окажется
      полоса восстановления, строка снимается тем же изменением»); цена нетребования названа и
      взята у Ф11 Р2, а не выдумана. Решать обязательность фактора здесь значило бы завести
      второго владельца одного предмета.
  - question: 'Опровержение соседа наполовину (§0.5) — довод за или против документа?'
    ruling: >-
      ЗА, и это стоит записать. Автор перемерил утверждение оппонента «тот же обход по Ф5
      расхождений не даёт» и опроверг его замером: сходились две строки из девяти. Приняв на
      слово, он закрыл бы класс в одном документе пачки и оставил в другом — то есть починил
      бы экземпляр вместо класса. Я воспроизвёл сверку на ОБОИХ документах: сегодня 9 из 9
      здесь и 7 из 7 у Ф4, «НЕ НАЗВАНА» — ни одной.

