measured:
  premise_6_gate_blind: >-
    go test ./internal/apps/kaname/api/ -run TestEveryMailSendingVerbPassesTheRateLimiter -v →
    «глаголов контракта осмотрено 115 · отправляющих письмо 2 — [Invite, ResendInvite] · мест
    постановки 1», PASS: запроса кода в переписи нет — Ф5-28 красный до кода. ПОДТВЕРЖДЕНО.
  producers_5_4: >-
    recovery_request.go:120 (окно источника до чтения адреса), verification.go:587, recovery_code_repo.go:150,
    tx.go:258, observer.go:115/116 — все координаты совпали. Ключ окна адресата —
    `ON CONFLICT (kind, recipient)` (tx.go:232–234); окно источника — (lane, source); величины —
    inviteMailRateLimit(cfg) и SourcePace{login.SourceAttempts, login.SourceWindow}
    (cmd/kaname/loginlane.go:533, 549). Р8 п. 2 ПОДТВЕРЖДЕНО.
  rule_8_p4_not_displaced: >-
    write(): SupersedeRecoveryCodes → InsertRecoveryCode → EmitRecoveryMail (списание, затем
    постановка) в одной транзакции с отложенным Rollback; полное окно → ErrLetterWindowFull →
    вытеснение откатывается. Ответ формируется до Dispatch (Р2) — п. 3 построением.
  holder_half: >-
    awk по TestRecoveryRequestIsBoundedPerRecipient | grep -c 'recipient-paced|RecipientPaced|outcomes_total' → 0:
    клетку не утверждает. ПОДТВЕРЖДЕНО.
  seed_constructibility: >-
    Временная проба в пакете pg (удалена; git status --porcelain → пусто) на живой схеме:
    посев строки invite_mail_windows вида `invite` sent=3 для P′, затем три списания вида
    `recovery` для P′ → [true true true] (близнец (в) Ф5-26 строится и ведёт себя как заявлено);
    четыре списания для P → [true true true false] (замок (а)); Q → true (близнец (б));
    контроль: invite для P′ сверх → false. Близнец Ф5-27 «другая полоса того же источника» —
    TestSourceWindowAdmitsExactlyTheLimitUnderConcurrentCallers PASS. Посеяно 3 из 3
    заявленных строителей «Дано» полосы, «не выполнилось» 0.

