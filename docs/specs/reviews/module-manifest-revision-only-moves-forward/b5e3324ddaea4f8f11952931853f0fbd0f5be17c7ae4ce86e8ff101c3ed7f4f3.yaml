blocking:
  - id: B1
    kind: CONSTRUCTIBILITY
    scenarios: [865-07, 865-08, 865-24, близнец 865-24]
    claim: >-
      «Дано» 865-07 вводит роль `probemod-viewer`; загрузчик такой документ отвергает, а общее
      «Дано» §4 требует, чтобы каждый документ разобрался `manifest.Load` без ошибки.
    predicate: >-
      go test -overlay (zz_review865_test.go в internal/manifest) @892853c45: фикстура
      probemod.public-read-fixture.yaml + roles[0].id=probemod-viewer → `manifest: role id is
      not `<module>.<name>`` (ErrRoleIDMalformed, internal/manifest/roles.go:461–468);
      то же с id=probemod.viewer → roles=1, err=nil.
    fix: >-
      Имя роли формы `<модуль>.<имя>` (напр. `probemod.viewer`) во всех четырёх местах; обозначить
      документ с разделом `roles` отдельно от `R(n, open)` (напр. `R⁺(n, open)`), чтобы
      «тот же документ» близнеца 865-24 читался однозначно.
  - id: B2
    kind: NEGATIVE
    scenarios: [Д9, 865-26 п.2, Д2 строка «d = a, g ≠ h»]
    claim: >-
      Каноническая форма Д9 приводит скаляр по тегу разборщика без схемы (`!!int` → десятичная
      запись, `!!float` → число JCS), а загрузчик читает тот же скаляр в строковое поле его
      исходным текстом. Два документа с разным прочитанным содержимым получают РАВНЫЙ отпечаток —
      ложное совпадение, которого Д9 по своему же доводу допускать не должна («ошибка в эту
      сторону — лишь ложный конфликт … а не ложное совпадение»). Равный номер с иным содержимым
      тогда проходит идемпотентным повтором, и строка Д2 «конфликт содержимого» не исполняется.
      Пункт 2 сценария 865-26 (`b: [0x2, 1]` равен `b: [2, 1]`) закрепляет это правило.
    predicate: >-
      go test -overlay (zz_review865b_test.go) @892853c45, роль probemod.viewer с
      `description: <x>`: Load принимает и читает Description "0x10" и "16", "016" и "14",
      "1.0" и "1" — разные строки; модель данных yaml.v3 без схемы даёт int(16)/int(16),
      int(14)/int(14), float64(1)/int(1) — по Д9 канонические формы попарно равны.
    fix: >-
      Добавить отрицательный сценарий с близнецом: при применённой редакции 5 доставка той же
      редакции, отличающаяся ровно записью строкового скаляра (`description: 16` → `0x10`), —
      конфликт; близнец — `Reformatted` без смены текста скаляра — повтор. Правило Д9 для
      скаляра — по тексту узла (значение после снятия кавычек и экранирования) вместе с тегом,
      без приведения числа; тогда `0x10`/`16` — ложный конфликт (допустимая по Д9 сторона), а
      пункт 2 865-26 о записи целого переносится в пункт 3. Выбор механизма — за автором.
  - id: B3
    kind: COVERAGE
    scenarios: [Д9, P15]
    claim: >-
      Отпечаток не определён для документа, который загрузчик принял: скаляр `.nan` / `.inf`
      в строковом поле Load принимает, Д9 переводит `!!float` в число JCS, а RFC 8785 NaN и
      бесконечность не представляет. Исход (отказ? какой текст? чей?) не назван — Д9 обещает
      отпечаток для любого принятого документа.
    predicate: >-
      то же overlay-прогон: `description: .nan` → Load err=nil, Description ".nan";
      модель yaml.v3 — float64(NaN).
    fix: >-
      Правило Д9 должно быть тотальным над принятыми документами (правка B2 снимает и это) и
      сценарием утверждать отпечаток такого документа.
  - id: B4
    kind: PRODUCER
    scenarios: [Д1, 865-17, §5 строка 865-17]
    claim: >-
      Д1 и §5 приписывают отказ на дробь существующему строгому разбору P1 («ErrShape (P1)»,
      «P1 (ErrShape существует)»). Измерено: yaml.v3 приводит `!!float` к int64 молча.
      Естественная реализация (поле int64 в оболочке) примет `revision: 1.5` как 1,
      `5.0` как 5, `1e3` как 1000 — текст контракта называет производителем код, который этого
      не производит.
    predicate: >-
      overlay-прогон: struct{Revision *int64 `yaml:"revision"`} + KnownFields(true):
      "1.5" → 1 err=nil; "5.0" → 5 err=nil; "1e3" → 1000 err=nil; "\"5\"" → error;
      "9223372036854775808" → error; "0x10" → 16 err=nil.
    fix: >-
      Производитель отказа на нецелое — проверка тега узла `!!int` до приведения (P13,
      «заводит это изменение»); в 865-17 добавить `5.0` и `1e3` → ErrShape (иначе реализация,
      отвергающая только дробную часть, проходит, а отпечаток по Д9 различает `5.0` и `5` при
      равном номере).

