      Держатель утверждения есть — 865-34 с ТЕМИ ЖЕ Дано и When (R(5,true) → R(3,false)), и
      строка прямо отсылает к нему; рекомендую при переносе дописать P17 в строку 865-01 либо
      оформить строку как ссылку, а не утверждение.
  - id: n2
    kind: COVERAGE
    note: >-
      Д10 останавливает пуск и тогда, когда пропущенный документ несёт типы вне канона с
      блоками, равными применённым (например R(3,true) после R(5,true)): исход — следствие
      решения (б), не переоткрывается. Стоит назвать это в шапке шага P17, чтобы оператор,
      откативший доставку к прежней редакции того же содержимого, читал отказ как ожидаемый.
  - id: n3
    kind: DISCLOSURE
    note: >-
      §0.1 и Д10 называют координату расхождения модели и каталога, существующего @63d8938a2,
      и его следствие. Условие — запись доставки (данные оператора), посторонним недостижимо,
      поэтому не блокирует; документ садится в ветку `865` вместе с P17, а не отдельной
      посадкой впереди него.

