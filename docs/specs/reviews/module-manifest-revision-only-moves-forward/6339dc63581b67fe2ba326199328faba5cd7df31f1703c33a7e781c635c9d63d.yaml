minor:
  - id: n1
    kind: COVERAGE
    note: >-
      Д1 определяет исход и для записей, которых нет в списке 865-17: `0o10`, `0b10`, `1_000`,
      `-0` (тег !!int, запись не десятичная → текст положительности) и `revision: ~` / пустое
      значение (тег !!null → ErrShape). Измерено overlay. Правило их определяет однозначно;
      рекомендую вписать в unit-пробу 865-17 строками таблицы, чтобы реализация, сверяющая
      запись регулярным выражением «без 0x», не прошла молча.
  - id: n2
    kind: FORMAT
    note: >-
      Тег КОЛЛЕКЦИИ в каноническую форму не входит (отображение → объект, последовательность →
      массив) — это следует из правил Д9, но не названо словами. Ложного совпадения нет:
      overlay — `!!null`/`!foo` на последовательности roles, resources, verbs, `!!null`/`!!str`/
      `!foo` на элементе-отображении и `--- !!null` на документе: Load принимает и читает то же,
      отпечаток равен; `!!null` на отображении в указатель (`tier`) Load отвергает. Стоит одной
      фразой назвать это в Д9 тем же изменением, что и реализацию P15.
  - id: n3
    kind: FORMAT
    note: >-
      Близнец 865-24 (`Q(5, true)` против отрицания `E(5, false)`) различается фактом «доставлен
      ровно применённый документ», а не одной строкой: раздел roles и признак меняются вместе.
      Выбор оправдан — пустой раздел roles служит наблюдателем «модуль не применён по частям»;
      держателю стоит назвать это в шапке пробы.

