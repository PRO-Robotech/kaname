# ─── БЛОКИРУЮЩЕЕ ────────────────────────────────────────────────────────────
blocking:
  - id: Б1
    genus: FORMAT
    where: >-
      §4.5, аннотация ВЫВОДА обратного предиката шва (строки, начинающиеся `#   → меток 55 ·
      строк «Тогда/И» осмотрено 475 …`), плюс его edition-history, где нет строки ред.12.
    what: >-
      Заявленный вывод предиката шва УСТАРЕЛ на ред.12. Документ объявляет
      «меток 55 · строк «Тогда/И» осмотрено 475 · называющих ЗНАЧЕНИЕ уровня 0 · утверждающих
      ВЫДАЧУ сессии 0». Прогон дословно скопированного предиката на a27f3563 даёт
      «меток 49 · строк 399 · 0 · 0». Ред.12 сняла шесть сценариев переноса (Ф7-21…24, Ф7-43,
      Ф7-50): 55→49 меток, 475→399 строк. Обновлены счёт §5 (55→49), держатель §8 (55→49→"49·49·0"),
      отрицания §4.13 (33→30), виды аудита §3.0 (три→два) — а этот один предикат нет.
    why_blocking: >-
      Это НЕ косметика по стандарту самого документа. §4.5 объявляет два счётчика (меток / строк
      осмотрено) ЗАГРУЖЕННЫМИ («это не украшение»; «выросшая перепись при неизменных нулях есть
      свидетельство того, что шов держится на БОЛЬШЕМ объёме, а не что предикат перестал
      смотреть») и требует от РЕВЬЮЕРА этот предикат прогнать. Ревьюер прогнал и получил 49·399 —
      против объявленных 55·475: по словам самого документа это читается как «предикат перестал
      смотреть». Ложный знаменатель в обязательном к прогону самопроверочном предикате — дефект
      truthfulness (`change-graph.md` §2, «число, пережившее свой предмет»), а не стиль. Шапка
      (строка «§4.5 (шов с Ф13 — строки переноса сняты)») заявляет §4.5 обновлённым: таблица шва
      обновлена (строк переноса нет), а вывод предиката — нет; заявление шире сделанного.
    predicate: >-
      python3 - (дословно предикат §4.5 из документа) на a27f3563 →
      «меток 49 · строк Тогда/И осмотрено 399 · называющих ЗНАЧЕНИЕ уровня 0 · утверждающих
      ВЫДАЧУ сессии 0». Ожидание документа: «55 · 475 · 0 · 0».
    fix: >-
      Обновить аннотацию `→` на «меток 49 · строк «Тогда/И» осмотрено 399 · 0 · 0» и добавить в
      edition-history строку ред.12 («редакция 11 давала 55·475; ред.12 сняла шесть сценариев
      переноса Ф7-21…24, Ф7-43, Ф7-50 — 55→49, строк 475→399, нули прежние»). Существо шва (нули)
      верно и держится — правка касается только знаменателя.
    recurrence_note: >-
      Класс повторяется: круг 4 (В1) уже ловил устаревший счётчик этого же предиката
      («редакция 9 … писала 375 — число редакции 8»). Тогда annotation несла число предыдущей
      редакции; теперь несёт число ред.11. Класс «аннотация счётного предиката несёт число
      прошлой редакции» отверг работу дважды → по
      `multi-agent-flow-orchestration.md` §14а его стоит перенести в ФОРМУ ЗАДАНИЯ автору:
      «перед сдачей перепрогнать КАЖДЫЙ счётный/шовный предикат документа и сверить его `→`
      аннотацию с выводом на своей ревизии». Решение о переносе в задание — за диспетчером.

non_blocking:
