effective_approval:
  issued: false
  ban1_lifted: false
  why: >-
    Вердикт круга 4 — CHANGES_REQUESTED. Блокирующее ОДНО, и оно о новом решении Р11 и пункте DoD
    §9.1 п. 13, заведённых редакцией 9: документ объявляет держателем двери шести глаголов ключа
    перепись `TestEveryPublicRPCCarriesAnObjectQuestion` и требует от неё исхода, который она НЕ
    ПРОИЗВОДИТ — категорий `gated`/`selfonly` у переписи нет (она печатает `door`/`data`/`exempt`/
    `ungated`; те два слова стоят только в устаревшем заголовке `census.go`), а у двух глаголов
    утверждения, освобождённых по причине `SELF_SERVICE`, решателем названа «сама сверка подписи»,
    тогда как перепись за `SELF_SERVICE` засчитывает ТОЛЬКО связывание с личностью вызывающего
    (`exempt.go`, `callerBindingMatcher`) и кладёт RPC без него в `ungated` с текстом «освобождение
    `SELF_SERVICE` объявлено, а решателя требуемой им формы на пути обслуживания нет». Сверку
    «названный утверждением человек = вызывающий» Р11 при этом отдаёт Ф12. То есть DoD п. 13
    («`ungated` среди них ноль») недостижим фазой by construction — тот же класс, что Б1 круга 3,
    — либо достижим решателем, которого ни одно «Тогда» не требует и который Р11 своим текстом
    относит к чужой фазе. ВСЕ ТРИ блокирующих круга 3 закрыты — каждое перемерено тем же опытом
    и дало другой результат; четыре не блокирующих из пяти закрыты, В3 остаётся за оркестратором.

