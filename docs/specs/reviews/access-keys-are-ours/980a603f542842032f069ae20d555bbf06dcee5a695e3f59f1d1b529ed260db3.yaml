decisions_ruled:
  - subject: Р10 — адресация `ak-…` платформенным `id`, `name` одной формы с умолчанием от `id`, `description` ≤ 256 знаков, без меток, идентификатор удостоверения — уникальность
    ruling: >-
      ПРИНЯТО. Каждая из четырёх половин проверена ОПЫТОМ, а не чтением: префикс свободен в
      обоих канонах и допустим генератором; имя от `id` удовлетворяет форме by construction
      (тысяча чеканок, ноль отказов, контроль «Мой ноутбук» красен); предел описания — руны,
      граница включена (256 принято, 257 отвергнуто); маршрутизатор пропускает пустое (свой
      required-check — как и написано), `usr-`/`soc` (полоса отсутствия — `usr` в обоих канонах,
      `soc` в слитном) и отвергает `ключ-1` и свой `ak-…` на пине без `ak` — ровно то, ради чего
      §9 п. 8 требует пин прежде чеканки. Пять отвергнутых исходов названы с ценой. Замечание к
      держателю Go-полосы имени — В4, не блокирует.
  - subject: Р11 — пол «1» у регистрации, перечня и снятия при соседях на «2»; отношения и область — у токена человека; форма ответа `Operation` у двух мутаций
    ruling: >-
      ПРИНЯТО по существу: три довода различия с соседями стоят (регистрация на «2» неисполнима
      by construction — Р5; снятие на «2» неисполнимо внутри DoD Ф7 — сессию «2» производят Ф12/Ф13;
      компенсация — окно свежести, которого у соседей нет), цена названа (остаток Р5: человек с
      чужим паролем в свежей сессии заводит свой ключ и снимает чужие, кроме последнего), предикат
      пересмотра внешний и назван (Ф12). Замер под доводами воспроизведён (`token_issuer:
      subject`; правило `level.go` на стволе; полы соседей). Что четыре глагола получают дверь
      объявлением опций — сходится с устройством переписи (карта выводится из аннотаций).
      НЕ ПРИНЯТО в Р11 ровно одно — держатель двери двух ОСВОБОЖДЁННЫХ глаголов и словарь DoD п. 13:
      blocking Б1.
  - subject: Р3 / Ф7-50 — усечение метки источника до предела, а не отказ переноса; имя перенесённой строки равно `id`
    ruling: >-
      ПРИНЯТО. Три ограничения формы на вставке переноса недостижимы by construction — доказано
      прогоном (форма имени от `id`), а не чтением; перечень отказов оператора базы «ровно два»
      стоит теперь на выводе. Цена усечения названа; альтернатива (отказ — Ф7-50 как отрицание,
      `перенос 3`) названа в §10 п. 25 вместе с тем, во что превращается сценарий.
  - subject: Ф7-48 / Ф7-49 — бит присутствия на обеих процедурах как норма
    ruling: >-
      ПРИНЯТО как норма, не как решение: перемерено по тексту обоих уровней — Level 2 безусловно в
      обеих процедурах, Level 3 освобождает только условную церемонию, которой у Ф7 нет; условие
      истечения названо (Р2). Пара «присутствие без проверки пользователя» различает два бита в
      обоих сценариях; девятая полоса единого отказа — в §3.0, §7 инв. 4 и §8 одним изменением,
      предикат даёт 9.
  - subject: Ф7-44 / Ф7-45 — сверка происхождения и хэша имени на приёме результата
    ruling: >-
      ПРИНЯТО как норма (Level 2 §7.1/§7.2 — обе фразы по разу в каждой процедуре, перемерено).
      Оба сценария — отрицания с близнецом Ф7-01, одним фактом и положительным контролем внутри;
      §8 держит обе полосы формой «одна полоса этого дефекта не различает».
  - subject: Ф7-46 / Ф7-47 — форма имени, предел описания, форма идентификатора в снятии
    ruling: >-
      ПРИНЯТО. Обе стороны каждой оси названы внутри; отказ формы отличим от Ф7-27 и не оракул —
      сверено с реализацией `corevalidate.ResourceID` (family-agnostic, пустое пропускает).
      Замечание к входу ветви а Ф7-46 — В4.
  - subject: §4.15 — «четвёртый встречный разбор» на редакции 8 без записи ревью
    ruling: >-
      Разбор в запись не оформлен и вердикта не даёт (`change-graph.md` §3) — документ это говорит
      сам; его находки взяты как данные и перемерены автором, а МНОЙ перемерены заново (Б1 — по
      тексту нормы; Б2 — по каталогу, модели и стволу; Б3 — по фундаменту и схеме соседей).
      Отпечаток редакции 8 `be4dd4c8…1432` воспроизведён. Порядковый номер разбора — В3.
  - subject: Ф7-21 — «источник с нулём ключей даёт «не выполнилось»»; §1.6 — популяция не перемерена
    ruling: >-
      НЕ находка, как и в кругах 1…3: решения обоснованы и третья категория названа с причиной;
      ни одно блокирующее на числа популяции не опирается.
  - subject: анонимный вызывающий у двух глаголов утверждения в Ф7
    ruling: >-
      НЕ находка против документа: Р11 отдаёт полосу «вызывающий ещё никто» Ф13 «вместе с её
      поверхностью», а отсечку анонима на публичном слушателе службы держит действующая цепочка
      (`public_caller_policy.go`: пол — верифицированный сертификат модуля либо предъявленное
      удостоверение; «ниже по цепочке стоят отсечка анонима и пообъектный вопрос»). Обратная
      сторона оси названа переадресацией к Ф13, и это законно. Что перепись за этой отсечкой не
      засчитывает «решателя» — предмет Б1, а не этого пункта.

