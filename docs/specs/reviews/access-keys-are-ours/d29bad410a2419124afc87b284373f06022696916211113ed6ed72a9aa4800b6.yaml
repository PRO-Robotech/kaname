      `39628487` 2026-09-17 «release/iam-lines → main, срез 3: Ф7 ключи доступа,
      corelib v1.9.0, приёмка Ф1 ред. 14 (#270)».
    why_it_blocks: >-
      Это не «устаревшая цифра в справке». §1 — основание, на котором документ выводит КАЖДОЕ
      решение («производителя нет — значит Ф7 заводит первого»), а §5 третьей осью объявляет
      `57 · 57 · 0` и преамбулой говорит, ПОЧЕМУ нулей столько: кода ещё нет. Рецензент,
      читающий ведомость, заключает «приёмка впереди кода» — тогда как код есть, влит и
      ссылается на этот самый документ. Роль обязана судить производителя у каждого «Тогда»;
      судить его по переписи, опровергнутой одной командой на том же дереве, нельзя.
