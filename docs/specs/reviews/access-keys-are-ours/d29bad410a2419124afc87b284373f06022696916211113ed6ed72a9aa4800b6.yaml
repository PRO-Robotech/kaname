      он же с `| grep -iE 'key|credential|webauthn|passkey'` → ТРИ попадания —
      `kaname.access_key_challenges`, `kaname.token_signing_keys`, `kaname.user_access_keys`
      (объявлено «ЕДИНСТВЕННОЕ попадание … Ключей доступа в хранилище ноль»);
      `internal/webauthnverify/verify.go` — проверяющий, чья шапка ссылается на ЭТОТ документ
      и на Р2, Р4, Ф7-31, Ф13 Р13;
      поверхность ключа — `git ls-files internal/apps/kaname/api/access_keys
      internal/webauthnverify` → 22 файла, с `internal/domain/access_key.go` — 5224 строки
      (begin/finish registration, begin/finish assertion, list, revoke, audit, refusals, decoy,
