  - id: Б1
    genus: PRODUCER
    where: '§1 целиком, §1.9 сводка, §5 преамбула ведомости, §9.1 п. 4'
    claim: >-
      Документ утверждает, что дерево службы не производит ключ ничем: §1 назван «Перепись
      производителей: что в дереве СЕГОДНЯ производит ключ», §1.1 — «Своего сервера ключей нет:
