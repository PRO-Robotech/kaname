# ─── РАЗБОР ДОВОДА АВТОРА ────────────────────────────────────────────────────
authors_argument_ruled:
  subject: 'проба, чьё требуемое стало истинным, превращается в регрессию (Ф7-32, Ф7-39)'
  ruling: ДОВОД ВЕРЕН — это не способ не трогать ведомость
  why: >-
    Критерий роли один: СПОСОБЕН ли сценарий упасть. Перемерено — способен обоими:
    Ф7-32 покраснеет при снятии строки `docs/content/api/auth-lane.mdx:287`; Ф7-39 покраснеет
    при возврате деривации, и четыре пробы, утверждающие `"unknown"`, красны при ней же.
    Снятие сценария сняло бы вместе с ним ЕДИНСТВЕННОГО держателя свойства, которое сегодня
    держится только тем, что кто-то его однажды выполнил. Документ, сверх того, уже несёт
    нужную защиту поимённо: §9.1 п. 3 требует по Ф7-31, Ф7-32, Ф7-33 и Ф7-39 «показать вход, на
    котором проба зелёная после Ф7 и красная при внесённом дефекте».
  caveat: >-
    Верен довод — не текст. Оставить сценарии правильно, но сказать о них в DoD придётся иначе:
    заголовок §9.1 п. 3 «все 57 существуют красными прежде кода» для этих двух ложен по
    построению. Это блокирующее Б6, а не возражение доводу.

