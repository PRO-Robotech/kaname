      п. 9 — переписать на «требуемое исполнено коммитом `39628487`, оба носителя и все четыре
      пробы сняты; пункт закрыт деревом, сценарии Ф7-32 и Ф7-39 остаются регрессиями», число
      переснять после правки §1.8.

# ─── ВАЖНЫЕ, НЕ БЛОКИРУЮЩИЕ ──────────────────────────────────────────────────
important:
  - id: В1
    where: '§4.19 СОГЛАШЕНИЕ О МЕТКАХ'
    claim: >-
      Соглашение НЕ ДЕРЖИТ, и его собственная перепись это не ловит, потому что у неё нет ни
      единицы счёта, ни команды.
    measured: >-
      Соглашение: «чужое решение называется всегда вместе с именем документа … голая `Р3` в
      этом документе значит ТОЛЬКО его собственное решение о переносе ключей. Правило
      проверяется переписью: все перекрёстные ссылки документа несут приставку дома, голых
      меток соседа ноль».
      Найдено: стр. 4618 — «её **редакция 4** меняет решение **Р3**» — это Р3 приёмки Ф13
      (рукоятка), тогда как семью строками выше, стр. 4611, «перенос (**Р3**)» — Р3 ЭТОГО
      документа. Обе голые `Р3` в одном абзаце, с противоположными референтами — ровно то
      столкновение, ради которого соглашение написано.
      Плюс притяжательная форма без приставки дома: стр. 529 «её Р10 п.1» · 3424 и 3477 «её
      Р6» · 3686 «её Р1…Р5» · 4827 «её Р1» · 5474 «её Р3» · 848 и 3366 «своим Р3» · 3541
      «своим Р10». Дом в каждом случае назван соседним предложением, но приставки метка не
      несёт — то есть утверждение «все перекрёстные ссылки несут приставку дома» ложно при
      любой единице счёта, кроме «читатель догадается».
    fix: >-
      Назвать единицу («вхождение метки `Р<N>`, чей референт — чужое решение») и дать команду,
      а не прозу; привести стр. 4618 к `Ф13 Р3`; решить про притяжательные формы одним
      правилом и применить его переписью.

  - id: В2
    where: '§4.7, абзац о разности «пин против рабочей копии»'
    claim: >-
      Атрибуция разности «шестнадцать» опирается на неверный счёт незакоммиченных документов, а
      различимость, объявленная утраченной, уже нужна и уже потрачена.
    measured: >-
      §4.7: «столбец рабочей копии — снимок, который двигается с каждой правкой любого из ДВУХ
      незакоммиченных документов этого изменения … Разность есть вклад неприменённых правок:
      `614 − 598` и `533 − 517`, по ШЕСТНАДЦАТЬ на обеих осях».
      Незакоммиченных приёмок ТРИ (см. `premise_corrections`).
      Вклад СУДИМОГО документа отделён этим кругом и равен НЕ шестнадцати: отсоединённая копия
      на `736c0de4`, поверх неё положен ТОЛЬКО судимый документ, прогон гейта →
      «координат-путей **607** · резолвится **526**», то есть вклад этого документа **9 · 9**,
      а остальные **7 · 7** принесли соседи.
      ОТВЕТ НА ВОПРОС КРУГА: «не разделены» — признание честное (инъекции сделаны верно и
      вывод из них верен), но различимость нужна и уже потеряна на этом самом абзаце.
      ВЕРНУТЬ ЕЁ МОЖНО БЕЗ ПРАВКИ ПРИБОРА, одной командой, и она исполнена:
      `git worktree add --detach <кат> <пин>` → положить в копию ТОЛЬКО судимый документ →
      прогон. Разность против пина тогда есть вклад ЭТОГО документа by construction — та же
      «отделённость по построению», которой §4.7 уже пользуется в переписи по ревизиям,
      применённая к рабочей копии.
    fix: >-
      Исправить «двух» на «трёх» с именами; переснять разность как `9 · 9` для этого документа
      и назвать остальные `7 · 7` вкладом соседей; добавить изолирующий прогон четвёртой
      строкой таблицы осей — он и есть недостающее деление.

  - id: В3
    where: 'Р10, стр. 1595'
    claim: остаток В2 круга 8 — четвёртое место с прежним пином фундамента.
    measured: >-
      §4.19 В2: «пин приведён к дереву в ТРЁХ местах (шапка и два блока предикатов)» — стр. 154,
      1186, 1686 несут `v1.9.0`, и `grep -n corelib go.mod` → `v1.9.0`. Стр. 1595 по-прежнему
      несёт «`PRO-Robotech/corelib`, пин `v1.8.0`» (`grep -n corelib <док>` — четвёртое
      попадание из пяти содержательных).
    fix: привести стр. 1595 к `v1.9.0` либо снять версию оттуда как избыточную.

  - id: В4
    where: '§4.7, вторая строка переписи (снимок рабочей копии)'
    claim: снимок рабочей копии устарел на единицу уже в этой редакции.
    measured: >-
      Объявлено «путей-спецификаций без `--` 80 · магических 191 · эллипсисов 2 (в рабочей
      копии)». Прогон гейта в рабочей копии на судимом отпечатке: «без `--` 80 · магических
      **192** · эллипсисов 2». На пине `736c0de4` — `80 · 188 · 2`, совпало дословно.
      Документ сам предсказал этот класс («впредь его положено переснимать вместе с последней
      правкой»), и снятие снимка отстало от последней правки на одну строку.
    fix: переснять снимок последним действием редакции, а не серединой.

  - id: В5
    where: '§3.0 определение «единого отказа аутентификации» · §3 целиком'
    claim: >-
      «Тогда» ни одного сценария не называет код отказа, а «единый отказ» определён только
      побайтовым равенством — то есть выполним ЛЮБЫМ кодом, включая неверный.
    measured: >-
      `grep -coE 'UNAUTHENTICATED|INVALID_ARGUMENT|FAILED_PRECONDITION|ALREADY_EXISTS|NOT_FOUND|PERMISSION_DENIED|UNAVAILABLE'`
      по документу → **2**, оба `INVALID_ARGUMENT` и оба ВНЕ §3 (стр. 1667 и 4412).
      §3.0: «„единый отказ аутентификации“ — отказ, чьи код и тело ПОБАЙТОВО равны». Какой это
      код — не сказано нигде. Реализация, отдающая на всех четырнадцати полосах один и тот же
      `INTERNAL`, определение УДОВЛЕТВОРЯЕТ.
      Не блокирую: класс новый на девятом круге, он не меняет ни одного решения и ни одного
      близнеца, а §7 инв. 1 сознательно держит «Тогда» на наблюдаемом. Но `api-error-codes-vocab`
      требует словаря кодов, и пробе нужен якорь.
    fix: >-
      Назвать код единого отказа один раз в §3.0 (как названы срок испытания и поток аудита) и
      добавить его в строку §8, которая этот отказ держит.

