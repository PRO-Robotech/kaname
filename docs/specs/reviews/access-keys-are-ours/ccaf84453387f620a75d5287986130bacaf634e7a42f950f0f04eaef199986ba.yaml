route_signals:
  proto: false   # контракт ключа уже в дереве; этот круг proto не двигает
  db_schema: true   # Р12 — третья миграция с колонкой признака обнаружимости
  public_rpc: true  # Р11 — записи каталога разрешений у шести глаголов ключа
  ui: false         # строка публичной страницы (Ф7-32) деревом УЖЕ закрыта, перемерено
  new_domain: false
  security_surface: true  # проверяющий утверждения, единый отказ, каталог разрешений, оракул существования
  note: >-
    Признаки взяты по содержанию сценариев и решений, а не по заголовкам. `ui` снят
    относительно круга 8: требуемое Ф7-32 в дереве исполнено (`auth-lane.mdx:287`).

disclosure_check: >-
  Документ дефектов защиты не называет и путей к ним не даёт: отказы описаны как контракт
  (единый текст, неразличимость), а не как найденная брешь. Эта запись тоже — все координаты
  указывают на влитый штатный код и на текст приёмки. Род DISCLOSURE не применён.
