# ─── ЧЕТЫРЕ ОСОБЫХ ПРОВЕРКИ ЗАДАНИЯ ──────────────────────────────────────────
special_checks:
  - subject: 'Пара Ф7-26 + Ф7-56 — различает ли вторая то, чего не различала первая'
    outcome: РАЗЛИЧАЕТ
    proof: >-
      Разбор по построению на двух продуктах. P_строки: страж отказывает ⟺ строк осталось бы < 1.
      P_годные: страж отказывает ⟺ годных осталось бы 0.
      Ф7-26 (один ключ, «не сообщено»): у P_строки строк 1→0 → отказ; у P_годные годных 0 → отказ.
      ОБА дают отказ — Ф7-26 зелен на дефектном продукте, то есть слеп, ровно как документ и
      говорит.
      Ф7-56 (два ключа: первый «подтверждённо обнаружим», второй «не сообщено»; снимается ПЕРВЫЙ):
      у P_строки строк 2→1 ⇒ ПРОПУСК, а контракт требует отказа → КРАСНОЕ; у P_годные годных
      1→0 ⇒ отказ → зелёное. Исходы РАЗНЫЕ — пара не слепа вдвое.
      Оба положительных контроля Ф7-56 закрывают свои оракулы: снятие второго (негодного) ключа
      проходит у обоих продуктов — это близнец, отличающийся одним фактом (каким ключом);
      снятие любого из ДВУХ годных проходит — без него отрицание зеленело бы на продукте,
      который просто запрещает снимать первый заведённый ключ.
      Третий кандидат в дефекты — страж, считающий годным всё, кроме «подтверждённо необнаружим»,
      — тождествен P_строки (у состояния нет писателя) и ловится тем же Ф7-56.
      Четвёртый — страж, не считающий пароль способом, — ловится положительным контролем Ф7-26.
      Перекрытия нет: пробы дополняют друг друга, а не дублируют.
  - subject: 'Число колонок: посылка задания — «прежнее решение закрывало перечень числом одиннадцать»'
    outcome: ПОСЫЛКА ЗАДАНИЯ ОПРОВЕРГНУТА, АВТОР ПРАВ
    proof: >-
      В редакции 11 (`git show HEAD:<путь>`) числа колонок нет НИ ОДНОГО: `grep -nE
      'одиннадцат|двенадцат|колонок'` по Р1 не даёт ни одного попадания о колонках — все
      попадания «одиннадцатая/двенадцатая» относятся к ПОЛОСАМ единого отказа. Перечень идёт
      прозой одной фразой, и я пересчитал его сам: `id` · человек · идентификатор удостоверения ·
      открытый ключ · алгоритм · счётчик подписи · имя · описание · момент заведения · момент
      последнего предъявления = РОВНО ДЕСЯТЬ. Путь «десять + рукоятка (Ф13 Р3) + признак
      обнаружимости = двенадцать» верен; таблица Р1 редакции 12 несёт ровно 12 строк, у каждой
      один владелец решения и один наблюдающий сценарий.
  - subject: 'Предикат, ставший ложным от правки автора: честное уточнение или подгонка'
    outcome: ЧЕСТНОЕ УТОЧНЕНИЕ
    proof: >-
      Третий предикат §4.3 перемерен мной на объявленной ревизии: 10 при корпусе 45 — совпало.
      Два новых совпавших адъюдицированы поимённо, и адъюдикация проверяема: Ф12 —
      одно вхождение в чужом смысле (ложное); Ф13 — 30 вхождений
      (`git grep -c -i -P 'обнаружива|проверк\w+ пользователя' cbbac984 -- <Ф13>`), то есть
      совпадение ПО ПРЕДМЕТУ, и Ф13 действительно решает одну величину церемонии своим Р3.
      Признак подгонки — сужение в сторону, которая спасает фразу; здесь сужение идёт в
      сторону, которую ВЫНУЖДАЕТ замер: опровергнутая часть («величину `user.id` решает сосед»)
      названа прямо, а не поглощена, и вывод переформулирован уже — «параметров, которые
      закрывает Р9», — а не шире. Вывод, ради которого абзац написан (у параметров Р9 другого
      дома нет), устоял.
  - subject: 'Воспроизводимость переписи гейта — прогнать не меньше трёх раз'
    outcome: ВОСПРОИЗВОДИТСЯ — ПОСЫЛКА АВТОРА ОПРОВЕРГНУТА
    proof: >-
      Пять прогонов подряд, вывод побайтово идентичен (см. Б1, В1). «Стабильный вердикт поверх
      нестабильного замера» здесь НЕ имеет места: замер стабилен на фиксированном дереве, а
      двигалось дерево — и двигал его отслеживаемый коммит соседней полосы, а не мелькающий
      черновик. Следствие для чтения остальных чисел документа: их НЕ надо читать иначе —
      все, что я перемерил, совпали.
  - subject: 'Вывод §4.3 «параметров церемонии не решает ни один документ» — устоял ли'
    outcome: УСТОЯЛ В СУЖЕННОЙ ФОРМЕ
