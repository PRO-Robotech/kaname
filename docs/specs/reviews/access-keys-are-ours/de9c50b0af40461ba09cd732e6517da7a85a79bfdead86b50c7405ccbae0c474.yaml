    Полоса ЧТЕНИЯ — Ф7-56. Область значений — Ф7-57. Три полосы названы и объявлено, что они не
    подменяют друг друга.
  producers: 'У всех 57 «Тогда» назван производитель; строк §5 — 57; без производителя — 0.'
  twins: >-
    §7 инв. 2 называет близнеца для КАЖДОЙ полосы §3, включая новую §3.11. Инв. 3: полагается
    34 · есть 34, ни одной строки БЕЗ ПОМЕТКИ. Ф7-56 несёт близнеца (Ф7-26) и два положительных
    контроля внутри; Ф7-57 — близнеца внутри плюс живого близнеца противоположного исхода
    (Ф7-31).
  constructibility: >-
    ПОСЕВОМ НЕ ПРОВЕРЯЛОСЬ И НЕ МОГЛО: предмета в дереве нет by construction — §1.1 (своего
    сервера ключей нет), и замер живой посадки этого круга подтверждает (таблицы нет, миграции
    не применены). Это приёмка ДО кода (ban #1), поэтому конструируемость судится по названному
    строителю, а не посевом. Оба новых «Дано» строителя называют: Ф7-56 — «строится записью», с
    доводом, почему действием не строится (Ф7-01 требует сессии человека с паролем, Р5), и с
    указанием, где признак появляется ДЕЙСТВИЕМ (Ф7-41); Ф7-57 — «продукт после Ф7 с решением
    Р12», строители трёх строк названы внутри «Когда». Третий исход — ⟳ не выполнилось.
  conventions: >-
    Ни один новый сценарий не нарушает запретов ядра. ban #5 закрыт прямо: §9.1 п. 4 кладёт
    колонку признака ВМЕСТЕ с таблицей ключей и отдельно измеряет состояние посадки, чтобы
    решение о третьей миграции принимал ban #5, а не документ. ban #10: потолок и гонки —
    на DB-уровне (Р8, Ф7-15/20/37). ban #15: адресация по `id` (Р10). ban #14: сужения объёма
    названы и посчитаны (§6). §7 инв. 1 (Тогда описывает наблюдаемое): исключений два, оба
    объявлены числом — Ф7-31 и Ф7-57.
  dod: >-
    §9.1 п. 3 называет все 57 красными до кода и ставит Ф7-57 в первые красные вместе с Ф7-13,
    отдельно различая «неисполнимое Когда» как ТРЕТЬЮ КАТЕГОРИЮ, а не красное. Ф7-56 — на
    настоящей базе после Ф7-41. Каждый пункт измерим.
  open_questions: >-
    §10 пп. 28 и 29 заводят оба решения редакции 12 как РЕШЕНИЯ с отвергнутым исходом, ценой с
    обеих сторон и точным перечнем того, что правится при отклонении. Критичных без ответа нет;
    дефолты зафиксированы автором, рецензент их ПРИНИМАЕТ (см. decisions_ruled).

decisions_ruled:
  - id: '§10 п. 28'
    decision: 'Правило годности «не подтверждена — значит негоден» ПРИНЯТО'
    why: >-
      Консервативность выбрана в сторону лишнего отказа, видимого сразу и с названным следующим
      шагом, против ошибки в сторону запирания, возврат из которой стоит отдельного пути (§6).
      Размен назван честно с обеих сторон; отвергать не стал.
  - id: '§10 п. 29'
    decision: 'Область значений в три состояния при двух писателях ПРИНЯТА'
    why: >-
      Довод проверен по существу: писателя у среднего состояния нет из-за ПОЛИТИКИ ПРИЁМА
      (Ф7-41), а не из-за области значений, и читатель у него есть уже сегодня (правило
      годности судит его наравне). Различие «зарезервировано на будущее» против «значение,
      которое факт может принимать, но политика не пропускает» в документе проведено явно —
      §3.11 и Р12 говорят это словами, а Ф7-57 наблюдает числом парой «состояний 3 · писателей
      2», где `3 · 3` объявлено красным. Требование задания исполнено.

neighbour_note:
  subject: docs/engineering/acceptance/passwordless-login-with-access-key.md
  verdict: NOT_JUDGED
  why: 'У соседа свой отпечаток и свой круг; вердикт на него не переносится и здесь не выносится.'
  observation: >-
    Ломающего следствия ЗДЕСЬ → ТУДА не нашёл. Опора Ф7 на Ф13 — только Р3 как ДОМ решения о
    рукоятке, и она названа «только счётом»: число колонок (12) от значения рукоятки не зависит,
    ни один сценарий Ф7 рукоятку не наблюдает. Одно наблюдение для оркестратора, не находка:
    у Ф13 есть СВОЁ решение с номером Р12 (о пути возврата доступа), не совпадающее по предмету
    с Р12 этого документа; два разных решения под одной меткой в соседних приёмках — источник
    тихой путаницы при ссылке «Р12» без имени дома.

route_signals:
  proto: false
  schema: true
  public_rpc: false
  ui: false
  new_domain: false
  security_surface: true
  note: >-
    schema — колонка признака ложится с таблицей ключей (§9.1 п. 4). security_surface —
    правило годности стража последнего способа входа; предмет самозапирания человека, не
    стороннего доступа. Публичный RPC новых глаголов не появляется: Ф7 владеет своим глаголом
    снятия, полоса снятия ПАРОЛЯ измеренно отсутствует и здесь не заводится.

disclosure_check:
  applied: true
  outcome: PASSES
  why: >-
    Признак восстановимости прогнан по документу и по этой записи. Названный дефект —
    самозапирание человека при стороже, считающем строки, — в дереве не производится ничем:
    производителей ноль (§1.1), таблицы на живой посадке нет, миграции не применены, ключей
    ноль. Сборки «координата + условие + следствие для постороннего» нет: предмет
    самозатрагивающий, а не путь чужого доступа. Правило названо прямо, не выхолощено.
