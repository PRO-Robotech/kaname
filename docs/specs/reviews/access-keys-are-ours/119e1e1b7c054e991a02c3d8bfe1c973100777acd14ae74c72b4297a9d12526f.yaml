      второй человек), но она — НОСИТЕЛЬ единственного изменённого факта, а не второе
      независимое изменение: «подписано другим ключом того же человека» невыразимо без
      второго ключа. Проверено на Ф7-19, где соблазн был обратный: там сдвинуто ОДНО —
      сохранённое значение счётчика, — а отношение «сообщённый не больше сохранённого»
      сохранено, и это ровно то, что делает его второй стороной оси, а не третьим случаем.
  - subject: Р4 — решение не требовать и не хранить аттестацию
    ruling: >-
      НЕ оспаривается. Довод («внешний авторитет на пути запроса даёт либо недоступность
      регистрации, либо проверку-украшение») самостоятелен, условие возврата названо и
      внешнее, а пола «3» в каталоге сегодня нет вовсе — перемерено: 338 записей, «3» среди
      полов отсутствует. Б1 и Б2 — о переписи вокруг этого решения, не о нём.
  - subject: Р1 — ключ в своей таблице, строки способа вида `webauthn` не заводится
    ruling: >-
      НЕ находка, и различие с F4d-14 ПОДТВЕРЖДЕНО чтением F4d-14: она требует уникальности
      по паре «человек, ВИД» и отдельной строкой утверждает, что «заведение третьего ВИДА не
      требует правки ни одной существующей строки». Об экземплярах одного вида она не
      высказывается. Довод Р1 о невозможности положить открытый ключ в колонку материала
      сверен с миграцией ветки Ф2 П1: материал непуст, индекса нет намеренно, статистика
      снята, имя таблицы стережёт гейт — всё четыре свойства на месте, и поиск по
      идентификатору удостоверения действительно требовал бы индексированной колонки.
      «Кто исполняет» назван прямо: Ф7 своей миграцией, Ф2 не трогается.
  - subject: Ф11 как «черновик» в задании круга
    ruling: >-
      Задание называет Ф11 черновиком; на ревизии ревью это НЕ так, и документ прав:
      её запись ревью круга 3 объявляет APPROVED, внешнее событие 5690585262 существует,
      его `subject_sha256` совпадает с отпечатком документа Ф11, `ban1_lifted: true`.
      В ствол ветка не влита — и документ называет её именно «одобренной внешним событием и
      не влитой», что и есть верная форма. Расхождение задания с деревом снято замером,
      а не выбором правдоподобного.
  - subject: §1.6 — популяция не перемерена
    ruling: >-
      НЕ находка. «Не выполнилось» названо третьей категорией с причиной (стенда в
      досягаемости нет, чужие кластеры не трогают), и ни один сценарий §3 на эти числа не
      опирается — решает перепись Ф7-21. Я тоже не перемерял и по той же причине; см.
      limits.
  - subject: расхождение пина фундамента
    ruling: >-
      НЕ находка документа, а МОЙ промах единицы: первый замер я снял с рабочей копии
      `project/kaname`, отставшей на b673325f, и получил v1.7.0 против объявленных v1.8.0.
      На `origin/main` и на отпечатке документа — v1.8.0. Записано, потому что это ровно тот
      класс, который корпус велит проверять первым у СЕБЯ.

