# ─── НЕ БЛОКИРУЮЩЕЕ ─────────────────────────────────────────────────────────
non_blocking:
  - id: Н-1
    where: >-
      Шапка (строка «Статус: DRAFT — редакция 12») против единственной строки §4.5
      («…правит редакция 13»).
    what: >-
      Весь документ называет себя «редакция 12» (шапка, ⚠-бюллетень, провенанс, тумбы) — кроме
      одной строки edition-history §4.5, где правка знаменателя отнесена к «редакции 13».
      ⚠-бюллетеня для редакции 13 нет.
    adjudication: НЕ блокирует.
    why_not_blocking: >-
      (1) По стандарту, которым сам круг 7 отделял блокирующий FORMAT от косметики: блокирует
      счётчик, объявленный ЗАГРУЖЕННЫМ и ОБЯЗАТЕЛЬНЫЙ к прогону, чья устарелость означает
      «предикат перестал смотреть». Номер редакции в шапке — не загруженный счётчик, прогону не
      подлежит, никакой верификации не подрывает. (2) Правку не может проявить финальный
      smoke/e2e — это ярлык документации, а не поведение продукта. (3) Автор исполнил фикс круга
      7 ДОСЛОВНО (обновить §4.5 + строка edition-history); бампа шапки и бюллетеня круг 7 не
      требовал, а дисциплина `header_left_untouched` (change-graph §2) шапку от ревью защищает.
      (4) Читается непротиворечиво: шапка называет СУБСТАНТИВНУЮ редакцию (12 = снятие переноса),
      лог §4.5 корректно относит FORMAT-микроправку к 13-му проходу. (5) Класс не тот, что
      отвергал дважды: там — аннотация СЧЁТНОГО предиката с числом прошлой редакции; здесь —
      номер редакции в прозе шапки, отвергается впервые, под §14а не подпадает.
    optional_fix: >-
      Для полной ярлычной однозначности автор может либо бампнуть шапку до «редакция 13» с
      ⚠-бюллетенём, либо смягчить строку §4.5 (не вводить нового номера, «правит эта редакция по
      кругу 7»). Не требуется для одобрения.
  - id: Н-2
    where: §2 Р2, абзац «Три величины…» (первый после заголовка Р2), строка про «Редакция 2».
    what: >-
      Не-changelog абзац решения Р2 называет снятые ред.12 метки: «Редакция 2 … строила на
      третьей два сценария (Ф7-21, Ф7-22) …».
    adjudication: >-
      НЕ блокирует — переношу адъюдикацию круга 7 (Н(ред.12)-1) и подтверждаю её замером: ссылка
      прошедшего времени, привязана к «Редакция 2», описывает провенанс Р2, а не утверждает
      текущее существование Ф7-21/Ф7-22. Ретайр-ин-плейс требует отсутствия ЖИВЫХ ссылок;
      историческая — не живая. Все вхождения снятых меток (Ф7-21…24, Ф7-43, Ф7-50) по всему
      документу — шапка/бюллетени/тумбы/комментарии предикатов/провенанс; живых нет.
    optional_fix: >-
      Можно добавить «(ныне снятые)» после «(Ф7-21, Ф7-22)». Не требуется.

