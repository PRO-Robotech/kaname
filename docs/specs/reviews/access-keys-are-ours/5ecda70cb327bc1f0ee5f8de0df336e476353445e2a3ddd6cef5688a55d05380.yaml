      один сценарий §3 на эти числа не опирается, решает перепись Ф7-21, и DoD §9.1 п. 7 несёт
      оговорку третьей категории (дописана редакцией 3 по В5 круга 1 — проверено).
  - subject: Р8 — потолок как отдельный вид учёта
    ruling: >-
      НЕ находка, и решение подтверждено ДЕРЕВОМ, а не доводом: множество видов закрыто
      ограничением схемы (три имени, ключа среди них нет), триггер списания существует, ручки
      посадки — указатели, то есть «ноль отличим от незаданного» уже действует. Довод Д1
      одобренного соседа процитирован дословно и проверен в его файле; `iam.credential`
      действительно анкерен двумя таблицами, и таблицы ключей среди них нет.

# ─── СОСЕДИ: НЕЗАВИСИМЫЙ ОБХОД ПО СВОЙСТВУ, ОБОИМИ ДОМАМИ ───────────────────
neighbours_traversed:
  method: >-
    Предикат ревьюера СВОЙ и шире авторского: объединение трёх его словарей плюс различительные
    токены, которых у него нет (`аутентификатор`, `второй фактор`, `доверяющ`, `rp_id`,
    `challenge`, `credential_id`, `счётчик подписи`, `беспарольн`). Цель — найти соседа, которого
    авторский обход не видит. Состояние КАЖДОГО одобренного установлено по записи ревью и
    отпечатку, а не по шапке.
  home_kaname:
    corpus: 40
    matched_by_reviewer_predicate: 15
    not_adjudicated_by_document: 0
    detail: >-
      Пятнадцать совпавших — ровно те пятнадцать, которые документ адъюдицирует поимённо
      (Ф1 · Ф11 · Ф4 · Ф5 · ID-PW-1 · credential-ceiling · retention-sweep ·
      expired-credential-reclaim · roles-come-as-data · composed-model · module-withdrawal ·
      non-empty-project · plan-confirms · refusal-text · сам документ). Остаток НУЛЬ:
      `comm -23` двух множеств пуст. Обход ствола на два коммита вперёд ветки проверен
      отдельно — новых приёмок в нём нет ни одной.
  home_workspace:
    corpus: 218
    matched_first: 29
    matched_second_md: 17
    matched_third: 37
    approved_among_first: 8
    not_adjudicated_approved: 0
    detail: >-
      Статус ВСЕХ 29 совпавших первым предикатом прочитан по одному. Одобренных среди них
      ВОСЕМЬ — 3.7b · 5.4 · COMP-E1a · F4d · F4e · IAM-INT-1 · ID-MAIL-1 · SEC-acr-stepup, —
      и ВСЕ ВОСЕМЬ адъюдицированы документом поимённо. Утверждение документа «одобренных среди
      остальных 18 — НОЛЬ» ПОДТВЕРЖДЕНО, как и «DRAFT 17, и один приёмкой не является вовсе»:
      единственный файл без строки статуса — `sub-phase-3.0-kac127-test-migration-matrix.md`,
      дословно тот, что назван. Тринадцать файлов второго предиката, не пойманных первым,
      перечислены и совпали с тринадцатью документа (3 по предмету + 10 «решают другое»).
      Двадцать три новых у третьего предиката адъюдицированы по совпавшему токену: 20 —
      обычный глагол «обнаружива», 4 — `attestation`/«аттестац» в чужих смыслах (RG-1, W2.B,
      W3.3, WATCH-1; WATCH-1 попадает в оба счёта, отсюда 20+4−1=23).
  verdict_on_traversal: >-
    Соседа, решающего наш предмет и не адъюдицированного документом, НЕ НАЙДЕНО ни в одном из
    двух домов. Блокирующее Б3 круга 1 закрыто не разметкой, а обходом, который сам себя
