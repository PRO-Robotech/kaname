reviewer_own_errors:
  - >-
    Круг 1: мой предикат статуса приёмки 3.3 (`grep -m1 -oE 'APPROVED'`) совпал со словом внутри
    строки `> **Status**: DRAFT — awaiting acceptance-reviewer APPROVED.`, то есть в предложении,
    ОТРИЦАЮЩЕМ доказываемое. Автор опроверг это замером, опровержение ПРИНЯТО. Класс — тот же,
    что я вменил ему: распознаватель, знающий одну форму записи предмета.
  - >-
    Этот круг, поймано до записи: прогнав тот же строгий предикат по статическим шапкам соседей
    дома, я получил `DRAFT` у Ф5 и Ф4 и был в шаге от блокирующего «документ называет
    APPROVED то, что DRAFT». Ошибка была бы моей: `change-graph.md` §2 говорит прямо, что
    статическая форма вердикта в шапке после ревью не меняется, а действующее одобрение
    выводится из записи и внешнего события. Перемер по записям дал APPROVED у всех пяти, причём
    `subject.sha256` каждой записи совпал с отпечатком ДЕЙСТВУЮЩЕГО файла — то есть вердикты
    не оторваны от редакций. Записано, потому что предикат, который я собирался применить,
    выглядел строгим и мерил не то.
  - >-
    Первая форма моего предиката для Б2 («отвергают заведение ключа») захватила Ф7-36 — отказ
    СНЯТИЯ — по общей фразе про повторное предъявление. Перемерено по блокам сценариев; в
    находку Ф7-36 не вошёл. Класс тот же, и он показывает, почему перечень надо ВЫВОДИТЬ
    аккуратным предикатом, а не широким.

limits: >-
  Вердикт относится к ОТПЕЧАТКУ 5ecda70c…5380 на ревизии 51c02c23 и ни к какой другой редакции.
  Он судит ПОЛНОТУ И ИСТИННОСТЬ утверждений документа о дереве, о соседях и о себе самом, а не
  качество решений Р1…Р9: ни одно решение этим кругом не отвергнуто, и Б1 — о ДОВОДЕ Р9, а не
  о её выборе. Санкции запись не выдаёт и выдать не может: её выпускает внешнее событие,
  публикуемое оркестратором; здесь оно `not_performed`, и это третья категория, а не «нет».
  Числа §4.7 и §4.3 зависят от содержимого ветки и сдвинутся от появления ЭТОЙ записи —
  предикаты названы, величины перемеряются, вывод не двигается.

next_round: >-
  Оба блокирующих закрываются правкой ТЕКСТА и одним выведенным предикатом, а не пересмотром
  решений. Б1 — назвать различитель рода величины, применимый к обоим спискам, и привести
  формулировку Р2 к тому, что Р2 делает. Б2 — вывести перечень отказов полосы заведения
  предикатом по образцу §3.0 и свести с ним три места (Ф7-01, §8, §4.1 п. 11), включив
  Ф7-15, Ф7-37 и Ф7-38. По каждому в записи назван fix_predicate; круг 3 повторит ТОТ ЖЕ опыт,
  которым находка сделана, и потребует другого исхода.
