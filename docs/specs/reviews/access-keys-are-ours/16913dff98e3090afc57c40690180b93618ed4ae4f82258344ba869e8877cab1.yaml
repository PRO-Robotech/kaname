important:
  - id: В1
    genus: PRODUCER
    where: '§1.9, строка 850'
    claim: >-
      Одна строка сводки §1.9 осталась с прежним исходом, и это НЕ потерянная правка, а
      мисчтение находки круга 9: автор починил соседнюю строку.
    measured: >-
      Круг 9 в блокирующем Б1, пункт (3), назвал строку «производителей привязки **и величин
      контракта** | наш контракт | чужая настройка | **ОСТАЛАСЬ ВЕРНОЙ**». Редакция 14 исправила
      строку 857 («производителей значения-утверждения о согласии устройства»), а строка 850
      стоит как была.
      Почему она неточна: колонка таблицы озаглавлена «дерево службы на `cbbac984`», а в клетке
      стоит координата ДЕРЕВА ПЛАТФОРМЫ. Строка сводит ДВА предиката под один исход: привязка
      (имя доверяющей стороны, происхождения) — действительно чужая настройка, и это верно; но
      «величин контракта» девять, и ШЕСТЬ из них объявляет НАШЕ дерево
      (`internal/apps/kaname/api/access_keys/deps.go:22–42`) — ровно то, что §1.2 и Р9 теперь
      говорят прямо.
    why_not_blocking: >-
      Нагрузки не несёт: на эту строку не ссылается ни одно решение, ни один сценарий, ни один
      пункт DoD — §1.9 цитируется целиком и только ради Ф7-32/Ф7-39 (стр. 355, 4748, 4814,
      5449). Читатель, идущий по ссылке самой клетки (§1.2), получает верный перемер. Класс
      «дерево объявлено пустым» закрыт в пяти местах из шести; остаток — неточность сводки, а не
      утверждение, пережившее предмет. Блокировать десятый круг на строке, чья собственная
      ссылка ведёт к опровержению, было бы непропорционально.
    fix: >-
      Развести строку на две («привязка» — осталась верной на пине платформы; «величины
      контракта» — стала ложной наполовину: три ручки посадки чужие, шесть литералов наши,
      производитель `deps.go`), либо оговорить в клетке, что она о привязке.
  - id: В2
    genus: FORMAT
    where: '§4.7, пятиосевая таблица, стр. 4033–4038'
    claim: снимок рабочей копии переснят НЕ ВЕСЬ, и две таблицы §4.7 стоят на разных пинах молча.
    measured: >-
      Вторая строка вывода переснята верно (`81 · 192 · 2` — совпало с моим прогоном дословно).
      Но пятиосевая таблица озаглавлена «на пине `736c0de4` | в рабочей копии», и её клетка
      «отслеживаемых путей» даёт `3499 | 3499`. Мой прогон в рабочей копии: **3500**. Пин верен
      (`git ls-tree -r 736c0de4 --name-only | wc -l` → 3499), а рабочая копия ушла на единицу:
      `git ls-tree -r e9ee8b0d --name-only | wc -l` → **3500** (плюс путь принёс `b94e2c64`).
      Рядом таблица вкладов стоит уже на пине `e9ee8b0d` — то есть §4.7 несёт два пина в
      соседних таблицах, и это нигде не сказано.
    why_not_blocking: >-
      «Находок 0» — единственный вердикт этого прибора — не сдвинулся ни на одном из пяти моих
      прогонов. Остальное объявлено ориентиром самим разделом.
    fix: привести пятиосевую таблицу к `e9ee8b0d` (тогда оба пина одинаковы) либо назвать пин у каждой таблицы.
  - id: В3
    genus: FORMAT
    where: '§4.19 СОГЛАШЕНИЕ О МЕТКАХ, команда'
    claim: у предиката есть единица счёта, но нет отсечки — его вывод не прочитать глазами.
    measured: >-
      Команда исполнена: вывод — **745** голых вхождений, потому что предикат по построению
      ловит и все собственные `Р1…Р12`, которые бесприставочными быть ВПРАВЕ. Сам текст говорит
      «каждое читается глазами: чей референт». Перепись, требующая 745 ручных чтений, будет
      исполнена один раз и больше никогда — то есть держателем работает ровно до первого
      повторения.
    why_not_blocking: >-
      Экземпляр, ради которого соглашение заводилось, ПОЙМАН и исправлен; единица счёта названа,
      чего прежде не было. Это улучшение прибора, а не его отсутствие.
    fix: >-
      Сузить дешёвой отсечкой — печатать только вхождения, у которых в том же предложении есть
      имя чужого дома либо которых нет в диапазоне Р1…Р12 этого документа; либо ограничить
      перепись разделами §4.x, где и случилось столкновение.
  - id: В4
    genus: FORMAT
    where: '§6 Out-of-scope · Р1, таблица колонок (стр. 903)'
    claim: >-
      Четвёртый носитель лжи о рукоятке — комментарий ПРИМЕНЁННОЙ миграции — не назван ни в §6,
      ни в §4.5, и может упасть между двумя документами.
    measured: >-
      Круг 9 установил четыре носителя. Три первых — контракт, публичная страница, реализация.
      Четвёртый: `internal/migrations/20260917221000_access_keys_are_our_record.sql:38–40` и
      `:105` (`COMMENT ON COLUMN … 'Рукоятка user.id церемонии (у ключей Ф7 — платформенный id
      человека как байты)…'`). Миграция влита `39628487` и применена → ban #5: правке не
      подлежит, нужна НОВАЯ миграция с новым комментарием.
      Документ правильно отдаёт РЕШЕНИЕ о значении рукоятки соседу (Р1, стр. 903: «рукоятка —
      не решение этого документа | Ф13 Р3 | наблюдатель свой, в ведомости Ф13»), но МИГРАЦИЯ —
      это колонка таблицы, которую заводит Р1 ЭТОГО документа. Предмет, который оба документа
      вправе отдать друг другу, — предмет без носителя.
      Ф13 не судился (запрет круга), поэтому проверить, записано ли «миграций у изменения две»
      там, я не могу и не делаю.
    why_not_blocking: >-
      Приёмка Ф7 значения рукоятки не решает и не правит — это установлено и верно. Носителя
      требует не решение, а ПОСЛЕДСТВИЕ чужого решения для своей колонки; §6 существует ровно
      для таких строк, и добавление строки объёма не меняет.
    fix: >-
      Строка в §6: «комментарий колонки `user_handle` (применённая миграция) — 0 сценариев
      здесь; правится новой миграцией вместе с решением Ф13 Р3 | условие возврата: **Ф13
      `#1282`**», чтобы предмет имел носителя в обоих домах, а не в нуле.
  - id: В5
    genus: FORMAT
    where: '§9.1 п. 3'
    claim: обоснование уже факта — названы два уже-зелёных, а исключены из счёта четыре.
    measured: >-
