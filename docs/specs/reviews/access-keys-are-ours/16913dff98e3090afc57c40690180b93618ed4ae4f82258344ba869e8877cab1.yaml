# ─── РАЗБОР ДОВОДА АВТОРА ────────────────────────────────────────────────────
authors_argument_ruled:
  subject: 'исход строки §1.9 — «предмет переехал», а не «стала ложной»'
  ruling: ДОВОД ВЕРЕН ПО СЛЕДСТВИЮ; ЯРЛЫК ШИРЕ СВОЕГО ОПРЕДЕЛЕНИЯ — и это важное, не блокирующее
  why_sound: >-
    Различие между вторым и третьим исходом у автора операциональное, а не вкусовое, и в этом он
    прав: второй исход требует ПЕРЕМЕРИТЬ величину и оставить её (тогда §9.1 п. 9 чинится
    заменой `6` на `5` — и остаётся пунктом, требующим работы); третий требует СНЯТЬ величину
    вместе с предметом (тогда пункт ПЕРЕПИСЫВАЕТСЯ — и становится регрессией). Автор выбрал
    третий и довёл следствие до конца: п. 9 действительно переписан, а не перенумерован, и
    «пройдено / не пройдено» по нему теперь определено. Это и есть проверяемая разница между
    двумя исходами, и она подтверждена текстом п. 9.
  where_loose: >-
    Определение третьего исхода в §1.9 гласит: величина, чей предмет переехал, «СНИМАЕТСЯ вместе
    с предметом». Строка 857 не снята — она оставлена с числами `5 · 0`. То есть применён ярлык,
    чьему определению строка не удовлетворяет: предмет (деривация) не переехал, а был ИСПОЛНЕН,
    и величина не снята, а стала ОПОРНОЙ ВЕЛИЧИНОЙ РЕГРЕССИИ. Это четвёртая форма, а не третья.
    §1.9 объявляет исходы «названными правилом, а не по вкусу» — значит правило обязано либо
    получить четвёртый исход, либо расширить третий словами «снимается ЛИБО становится опорной
    величиной регрессии». Вердикта не двигает: следствие выбрано верно при любом ярлыке.

