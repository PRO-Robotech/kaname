    предиката плюс сверка меток и строк ведомости в обе стороны), §7 инв. 3, §8, §4.12 и §4.13
    (все названные там предикаты). Способность предиката §3.0 падать проверена инъекцией в обе
    стороны на копии документа (снятое слово у Ф7-43 и дописанное у Ф7-23 — оба ловятся именем
    места). Состояние КАЖДОГО одобренного соседа дома установлено по записи ревью и отпечатку
    файла; чужие цитаты (Ф4 §1.2, Ф4-01, Ф4-06, Д5, Ф1-24, Ф1 §4.1, Ф1-48…50, Ф1 §7 инв. 4,
