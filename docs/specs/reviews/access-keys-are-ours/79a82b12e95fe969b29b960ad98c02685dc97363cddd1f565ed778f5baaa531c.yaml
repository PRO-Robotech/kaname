# ─── ЧТО АДЪЮДИЦИРОВАНО И НАХОДКОЙ НЕ ПРИЗНАНО ──────────────────────────────
decisions_ruled:
  - subject: >-
      различитель рода величины Р2 — «чей это факт: установки или продукта»
    ruling: >-
      ПРИНЯТ как решение (§10 п. 19 объявляет его решением, а не замером). Проверено, что он
      применён ко всем девяти величинам и к потолку, ни одну не относит к обоим родам, и что
      формулировки Р2, Р9, §1.3, Р4, врезки Ф7-34, §7 инв. 5 и §8 (строка Ф7-13) ему не
      противоречат. Отнесение перечня алгоритмов к ручке («криптополитика установки») —
      защитимый выбор; довод, которого документ в круге 2 не писал (обратимость сужения
      расширением), теперь стоит в §7 инв. 9 и назван из Р2. Предмета для блокирующего нет.
  - subject: Р3 — событие ВИДА «перенос» на каждую перенесённую строку (решение редакции 6, §10 п. 18)
    ruling: >-
      НЕ отвергнуто. Три исхода названы, выбран третий с доводом (оператор, спросивший «откуда
      ключ», получает ответ; «ключ без события — красное» остаётся истинным на перенесённых
      строках); форма взята у живого соседа `iam.sa_key.expired_reclaimed` (в дереве есть). В дереве
      вида переноса нет и решать его больше некому — проверено предикатом (48 видов, 0 по
      `migrat|import|transfer`).
  - subject: Р3 — перенос ОДНОЙ транзакцией, повтор после успеха — отказ целиком (решение редакции 7, §10 п. 21)
    ruling: >-
      НЕ отвергнуто. У трёх ключей цена атомарности нулевая, а без неё «ни один ключ не перенесён»
      ложно на любом отказе после первой строки; повтор отвергается уникальностью идентификатора
      удостоверения (Р1) и откатывается — следствие, а не новая механика; «пропускать уже
      перенесённые» отвергнуто как второй читатель без предмета. Ф7-43 ветвь б исполнима на
      настоящей базе (§9.1 п. 5 это и требует).
  - subject: Р5 / §4.4 расх. 11 — носитель полосы «регистрация личности ключом без пароля»
    ruling: >-
      Решение о носителе (своя приёмка, составляющая Ф4 и Ф7; не Ф7, не Ф13, не правка одобренной
      Ф4) ПРИНЯТО: все три отвергнутых исхода названы с ценой, цитаты соседей перечитаны и верны,
      предикат «все «Дано» §3.1 называют вошедшего человека» даёт `9 · 0`. Отсутствие ЗАДАЧИ у
      носителя — non_blocking В3, а не спор с решением.
  - subject: Ф7-16 — «смена пароля (глагол Ф2)» как правка строки способа
    ruling: >-
      НЕ находка: глагол существует — Ф1 (одобрена, в стволе) Р4 и §3.3 описывают смену пароля,
      ID-PW-1 (одобрена) называет её 18 раз; «Дано» строится действиями Ф2, Ф7-01, Ф7-14 и
      человека без пароля больше не требует.
  - subject: Ф7-21 — «источник с нулём ключей даёт «не выполнилось», а не успех»
    ruling: >-
      НЕ находка, как и в кругах 1–2: решение обосновано известной популяцией (три личности с
      ключами, §1.6), и DoD п. 6 несёт ту же оговорку.
  - subject: §4.13 Б1 — три литерала из шести совпадают с умолчаниями нормы
    ruling: >-
      ПОДТВЕРЖДЕНО по существу без обращения к сети: в Level 2 `attestation` по умолчанию `"none"`,
      `userVerification` — `"preferred"` в обоих словарях, `requireResidentKey` — `false`,
      у `residentKey` умолчания нет. Значит «предпочтительна» ×2 и «нет» совпадают с нормой,
      «требуется» — нет; вывод документа (декларативная проба как второй держатель, инъекция
      значением) верен.
  - subject: три одобренных соседа дома без записи ревью (`credential-ceiling`, `retention-sweep`, `composed-model`)
    ruling: >-
      НЕ находка против этого документа: у них нет каталога записей вовсе, вердикт объявлен только
      статической шапкой — состояние ДОМА до заведения формы записей. Документ ссылается на их
      решения (Д1, норма механизма ограничения, посылка «условий 6») — перечитаны в файлах и верны.
  - subject: §1.6 — популяция не перемерена
    ruling: >-
      НЕ находка, как и в кругах 1–2: третья категория названа с причиной; ни один сценарий на числа не опирается.

