blocking:
  - kind: CONSTRUCTIBILITY
    scenario: §5.2 строка «X, Y, X/app, Y/app … кортежи owner usr-A»; §0.6; §3 «Производительность»; §6 п.7; DP-01 a, b, DP-03, DP-05, DP-15, DP-16
    claim: >-
      Документ по-разному отвечает на вопрос, где исполняется политика Р1: в обработчике
      или в use-case `Register`.
      (1) §5.2 строит «Дано» так: кортежи `owner` usr-A на X, Y, X/app, Y/app пишет
      use-case мира напрямую, «запись ДО политики». Это `p.reg.Register` в
      `registerRegistry` и `registerRepository`
      (public_container_read_world_integration_test.go:178-205) на прежней редакции
      registry, где ключа `writes` нет. Такое «Дано» строится, только если политика
      стоит ВНЕ use-case.
      (2) §3 «Производительность» говорит, что политика стоит «0 обращений сверх чтения
      строки каталога, которое транзакция уже делает (`catalog_type.go:98`)». Это чтение
      делает `catalogObjectType` внутри транзакции `emit` use-case
      (register_resource.go:837-840).
      (3) §0.6 и §6 п.7 говорят, что после задачи пробы, которые регистрируют через
      `uc.Register` отношением-неуказателем (`parent` у `compute_instance`,
      register_resource_mirror_integration_test.go:68-73), своё «Дано» не строят. Значит,
      политика действует на уровне use-case.
      По (2) и (3) запись `owner` из (1) получает отказ политики. Тогда `newPCRWorld`
      падает на `require.NoErrorf` при построении. Падает базовый мир всех сценариев
      DP-*, кроме DP-04, DP-20 и части DP-10/11, и весь набор П6, который §6 п.7
      требует держать зелёным. По (1) неверны (2) и (3). Посевом это не решить: исход
      зависит от того, где стоит политика, а документ называет это место двумя
      способами.
    remedy: >-
      Назвать одно место и согласовать с ним остальной текст.
      (а) Политика в обработчике, рядом с `validateProxyTuple`. Тогда исправить §3
      «Производительность»: обработчику нужно своё чтение каталога, вне транзакции
      записи. Назвать это обращение числом и сказать, что значит промах. Исправить §0.6
      и §6 п.7: пробы, которые вызывают use-case напрямую, политику не проходят. §5.2
      тогда верен.
      (б) Политика в use-case, в транзакции `emit`. Тогда перестроить «Дано» мира с
      `owner`: например, доставить W до `registerRegistry` и `registerRepository` либо
      писать кортеж `owner` через существующий писатель факта. Назвать писателя
      строкой §5.2. В §6 п.7 назвать мир П6 (`newPCRWorld`) среди переписываемых.
      Решает автор. Рецензент записывает только то, что (б) честнее держит слова
      «единственный вход» (§0.2) против будущих вызывающих use-case. Цена (а) — одно
      чтение каталога вне транзакции.

important:
  - where: Р9 («вывод — до первого оператора записи») против Р10 и производителя PB-01 из #983
    note: >-
      По одобренной #983 сверка привязки стоит «на уровне записи зеркала и цепи
      (оператор либо триггер `UpsertTx`), не в `emit`» (строка 781 её документа). Если
      вывод стоит до первого оператора записи, отказ вывода возникает раньше отказа
      привязки. Р10 требует обратного порядка для PB-24 a–d, в том числе для PB-24 c,
      первой регистрации, где привязку заводит этот же запрос. Наблюдаемое поведение в
      Р10 названо, держатель есть. Но место «до первого оператора» — условие к коду
      (fa-b2), и с одобренным производителем #983 оно не сходится. Убрать место из Р9 в
      замысел либо в §7 строке 4 назвать, как реализация выбирает отказ.
  - where: Р12, §3 «Безопасность», В4
    note: >-
      Проверка «проект опоры есть в kaname» читает строку `projects` без блокировки. У
      окна «регистрация обогнала удаление проекта» есть объявленный законный исход: это
      `non-empty-project-is-not-deleted.md` §7.4 и IAM-PNE-1-13
      (project_delete_nonempty_integration_test.go:170, проба зовёт `UpsertTx` напрямую,
      эта задача её не трогает). Документ это окно не называет. «Закрывается регистрация
      под проектом … с которым иерархия не согласна» верно только на момент чтения. Чтобы
      исполнитель не написал мерцающую пробу сериализации, нужна строка: окно остаётся,
      исход IAM-PNE-1-13 законен, ссылка на §7.4.
  - where: Р4 (опора записи из `writes` — первое звено цепи)
    note: >-
      Объект зарегистрирован указателем `project:prj-A` с цепью `[account:acc-A]`
      (DP-11 d принимает такую регистрацию) либо с пустой цепью и пустым полем
      (DP-11 b, K из DP-14). Для такого объекта опора по Р4 не выводится, и запись
      `owner` получает Р8 «parent scope does not match», хотя ничего не разошлось, а факт
      указателя в `relation_fact` проект называет. Исход детерминирован и закрыт
      отказом, поэтому замечание не блокирующее. Его стоит назвать сценарием либо брать
      опору из факта указателя.
  - where: DP-10 g ↔ DP-11 b
    note: >-
      Близнецы различаются двумя фактами: проектом опоры и объектом (Q против
      `registry_registry:e12813c6a/b`). Каждый сценарий исполняется на своём мире,
      поэтому объект можно взять один.
  - where: DP-20 i
    note: >-
      Утверждается форма политики в строке каталога `{project: [project], owner: […]}`,
      а форма колонки по §6 п.1 — «замысел». Утверждать через читателя политики (Р1),
      а не через вид колонки.
  - where: §0.1, §0.3
    note: >-
      Документ публичный и садится раньше фикса. Он перечисляет конкретные формы
      записи, которые сегодня проходят, вместе с координатами. Воспользоваться ими
      можно только с личностью модуля на внутреннем слушателе, поэтому замечание не
      блокирующее. Рекомендация: оставить свойство («правило не спрашивает, указатель ли
      отношение у типа»), примеры убрать (security-disclosure,
      disc-no-consolidated-assembly).

