important:
  - where: §4.1 «передоставка P0», DP-01, DP-05, DP-06 a, DP-20 j
    note: >-
      «Дано» «`writes` не действует» строится повторной доставкой P0 поверх W. Сегодня
      это работает, но документ не называет почему. Ни P0, ни новая редакция ключа
      `revision` не несут (`grep -i revision` по обеим фикстурам пуст). Поэтому
      `JudgeRevision` (modulecatalog/revision.go:134) каждый раз даёт
      RevisionUndeclaredOverUnapplied, и строки применяются. Если документ объявит
      редакцию, то при равном номере и другом отпечатке исход — RevisionConflict, а
      при меньшем номере — RevisionStale. В обоих случаях `ApplyAll` ошибки не
      возвращает, модуль уходит в census.NotApplied, а `applyDelivered` проходит
      `require.NoError`. Ложного зелёного это не даёт: DP-20 j и DP-01 покраснеют. Но
      исполнитель будет искать причину в политике. Рекомендация: строкой §4.1 назвать
      это условие и в пробе проверять, что census.NotApplied пуст. Предикат снятия
      этой ветки — S2 kaname#865 (revision.go:155-161). После неё P0 без редакции не
      загрузится вовсе.
  - where: DoD п.6, фраза «По существу, без мира, принимались бы DP-01 a–e, DP-04 b, …»
    note: >-
      Это новая сводная сборка «вот формы, которые сегодня проходят». Того же рода
      был перечень, снятый из §0.1 решением п.6 (security-disclosure,
      disc-no-consolidated-assembly). Воспользоваться можно только с личностью модуля
      на внутреннем слушателе, поэтому замечание не блокирующее, как и в круге 1.
      Рекомендация: убрать фразу из DoD. Строки «Красна @…» у сценариев сводки не
      собирают, их достаточно.
  - where: Р9 «до её первого оператора записи» против §7 строки 4
    note: >-
      По §7 строке 4 отказ вывода, найденный до первой записи, не возвращается, пока
      в той же транзакции не установлено, что сверка привязки #983 этот запрос
      пропускает. Сверка стоит на уровне записи зеркала (оператор либо триггер
      `UpsertTx`). Значит, отказ Р8 может вернуться ПОСЛЕ оператора записи. Тот
      откатывается, и «ничего не записано» остаётся верным. Противоречия нет, но
      «до первого оператора записи» в Р9 читается строже, чем позволяет §7. Можно
      уточнить: «вычисляется до первой записи; когда возвращается — §7 строка 4».
  - where: Р4, «relation_fact_pkey (object_type, object_id, relation)»
    note: >-
      В скобках назван префикс, а не ключ. Ключ — PRIMARY KEY (object_type,
      object_id, relation, subject) (0001_initial.sql:4257). Именно четвёртая колонка
      позволяет двум фактам указателя у `X/app` в DP-17 e существовать одновременно.
      Рекомендуется назвать ключ полностью и чтение по префиксу из трёх колонок.

questions_relayed:
  - >-
    Правило Р4 «фактов указателя несколько — хватает согласия с одним» автор выбрал
    сам и вынес вопросом (fa-b4). Мнение рецензента: на корректность и безопасность
    (а) не влияет. Каждый факт указателя — уже выведенный kaname родитель. Прежний
    факт и так даёт объекту доступ через каскад контейнера, пока он не снят, так что
    согласие с ним область не расширяет. DP-17 e/f закрепляют любой выбор. Решает
    диспетчер.

constructibility:
  seeded: 0
  named_fixture_rows_verified: 11 of 11 (§5.2)
  not_performed: 1
  reason: >-
    Посев не ставился. Задание не назвало изоляцию для посева, а testcontainers по
    правилу машины идут только слотом внешнего кластера. Посев на 6e4077e3a ничего
    не доказал бы: загрузчик отвергает W (manifest.go:450, KnownFields(true)), и мир
    честно красный. Конструируемость показана писателями, каждый сверен с кодом:
    (1) `registerRegistry` и `registerRepository` пишут указатель раньше `owner`
    (public_container_read_world_integration_test.go:178-205), а prj-A посеян в acc-A
    (system_class_world_integration_test.go:126). Поэтому у `owner` после W есть опора.
    (2) Факт указателя пишет триггер `relation_fact_from_journal` на `fga_outbox` в
    той же транзакции регистрации (0001_initial.sql:1389-1395). К следующей
    регистрации он виден.
    (3) Ключ relation_fact включает subject (:4257), поэтому два факта указателя
    при переносе в DP-17 e допустимы.
    (4) Повторная доставка P0 поверх W применяется, потому что ни у одной фикстуры
    нет `revision` (important п.1).
    (5) Фикстура P0 в дереве не правится: W строится правкой в пробе. Её читают
    modelrender, modelcompose и sc70, и они не затронуты.

