blocking:
  - kind: COVERAGE
    where: Р3 «Границы значения», OS-04
    claim: >-
      Р3 объявляет два поведения, у которых нет ни одного сценария: (1) байты не-UTF-8 в
      заголовке заменяются U+FFFD; (2) урезание до 512 «знаков». OS-04 (б) проверяет урезание
      только однобайтовым `x`, на котором «знак», «руна» и «байт» совпадают. Слово «знак» не
      определено (руна или байт).
    why_blocking: >-
      Столбец пишется в транзакции выдачи сессии, то есть на пути входа. Если байты не-UTF-8
      не обезврежены, или урезание по байтам разрезало многобайтовую руну, хранилище отвергнет
      строку, и откажет сам вход (503) для любого клиента с таким заголовком. Решение принято,
      но держателя у него нет, поэтому реализация вправе его пропустить, и ни одна проба этого
      не заметит.
    measured: >-
      Слушатель полосы читает заголовки net/http; httpguts допускает в значении байты ≥0x80
      (obs-text), так что такой вход до глагола доходит. Поле пишет IssueSession
      (internal/apps/kaname/api/humansession/issue.go:57), которую зовут login.go:551,
      register.go:227, recovery_complete.go:326, access_key_login.go:461.
    required: >-
      Назвать единицу («знак» = руна Unicode) и добавить в OS-04 буквы: (г) значение с байтами
      не-UTF-8 → вход 200, а в перечне на их месте U+FFFD; (д) 600 двухбайтовых рун → 512 рун,
      и значение остаётся допустимым UTF-8. Положительный близнец обеих букв — (а), различие
      одно.

important:
  - kind: PRODUCER
    where: §5 строка OS-05
    note: >-
      Названный производитель `ValidatePageToken` (internal/apps/kaname/shared/pagination.go:23)
      отдаёт gRPC-статус с текстом `Illegal argument pageToken` и деталью BadRequest. OS-05 же
      утверждает `Illegal argument pageToken: malformed` и пустой `details`. Тексту OS-05
      отвечает FieldError полосы (refusals.go:63) поверх `pagetoken.WellFormed`; производителя
      назвать так. То же касается `corevalidate.PageSize` и текста про pageSize.
  - kind: CONSTRUCTIBILITY
    where: OS-16 Given
    note: >-
      Написано «тот же путь, что у кейсов подтверждения в tests/newman/cases/kaname-login-lane.py».
      В этом файле кейсов подтверждения нет: grep verif/confirm находит только печенья.
      Подтверждение кодом из письма живёт в tests/newman/cases/kaname-address-verification.py
      (`_await_letter`, `_confirm`). Человек обязан быть свежим, а не посевным
      `{{loginLaneEmail}}`: `end-others` по общему посевному человеку сняло бы сессии кейсов
      соседних наборов того же шага.
  - kind: COVERAGE
    where: OS-05
    note: >-
      Нет нижней границы `pageSize=-1`. Именно на ней дерево уже ловило насыщающее приведение
      (pagination.go, шапка ValidateRawPagination). Рекомендую букву (з).
  - kind: FORMAT
    where: OS-13 (в)
    note: >-
      Если повышение перевыпускает носитель, следующий `end` идёт новым носителем `S_A`.
      Стоит сказать это явно.

