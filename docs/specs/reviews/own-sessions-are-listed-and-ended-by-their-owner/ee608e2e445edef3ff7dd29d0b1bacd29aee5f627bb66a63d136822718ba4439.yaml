round1_blocking_closed:
  - kind: COVERAGE
    where: Р3 «Границы значения», OS-04
    closed_by: >-
      Р3 называет единицу (руна) и порядок приведения (замена каждого байта вне UTF-8 на U+FFFD,
      затем урезание до 512 рун; исход входа не меняется). OS-04 несёт (г) байты 0xFF 0xFE → две
      U+FFFD и (д) 600 рун «ж» → 512 рун; на всех пяти входах 200 и проверка utf8.Valid тела
      перечня. Близнец (г) и (д) — (а), различие одно. §5 разделён: у (г), (д) производитель —
      новый тип домена, держатель — проба OS-04.
    can_fail: >-
      (г) отличает «каждый байт» от «каждый пробег»: strings.ToValidUTF8 дал бы одну U+FFFD
      (измерено: "a\xff\xfeb" → "a�b"). (д) отличает урезание по байтам (256 рун) от
      урезания по рунам (512). Непривёденный байт роняет запись в хранилище, и «200» на (г)
      краснеет.

important:
  - kind: CONSTRUCTIBILITY
    where: «Дано I» (S_C «без заголовка»), OS-04 (в) и «запись регистрации»
    note: >-
      Харнесс ходит настоящим http.Client (handler_test.go:279 lane.do). Клиент Go без
      заданного User-Agent подставляет `Go-http-client/1.1`; заданный пустым — заголовок не
      шлёт вовсе (измерено). Поэтому: S_C и (в) обязаны ставить Header.Set("User-Agent", ""),
      иначе OS-01 «у S_C ключа нет» покраснеет на исправном продукте (дефект фикстуры, не
      продукта); «пустое значение» (в) на проводе неотличимо от «нет заголовка», что
      Р3 и так приравнивает; для записи регистрации проба должна сама задать заголовок —
      «взять из своего запроса» при незаданном значении даст пустоту, а сервер увидит
      `Go-http-client/1.1`.
  - kind: FORMAT
    where: OS-04 When
    note: >-
      «три входа `avLane.login`», а букв пять (а)…(д); Тогда говорит «пяти входов». У (б)
      осталось слово «знаков» — на ASCII совпадает с руной, но лучше «рун».

