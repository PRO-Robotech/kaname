blocking:
  - kind: NEGATIVE
    scenario: Р2 / новый A197-08
    finding: >-
      Нет сценария и инварианта базы «личность нашей полосы без носителя невозможна».
      Функция триггера при пустом ключе делает RETURN NULL — заведение не считается вовсе
      (20260917130000_schema_functions_leave_the_platform_brand.sql, ветвь
      `IF v_identity IS NULL OR v_identity = ''`). Если ключ берётся из нового столбца, то любой
      путь, отчеканивший личность нашей полосы без записи носителя (либо записавший его ПОСЛЕ
      вставки аккаунта в той же транзакции), молча снимает рубеж. Р2 говорит «вместе с
      личностью», но этого не держит ни сценарий, ни ограничение.
    required: >-
      Отрицательный сценарий: строка с идентичностью нашей полосы без носителя отвергается базой
      (названный SQLSTATE); близнец — та же строка с носителем проходит. Для полосы активации
      приглашения — порядок: носитель записан до вставки личного аккаунта (A197-04 утверждает
      принято 1 после активации).
  - kind: FORMAT
    scenario: A197-05
    finding: >-
      «Тогда: база отвергает запись» — без SQLSTATE и без текста; Р2 строит на этом
      классификацию в INTERNAL, а отображение зависит от кода.
    required: Назвать SQLSTATE (и сообщение) отказа правки носителя.

important_nonblocking:
  - "A197-05: близнец отличается не одним фактом (INSERT против UPDATE). Законная запись носителя на активации — UPDATE пустого носителя в значение; ограничение обязано её пропускать. Ближайший близнец — UPDATE NULL→значение проходит, значение→другое отвергается."
  - "Существующие фикстуры (`ownLaneFixture`) вставляют строку нашей полосы без носителя; DoD п.2 «без правки утверждений» правку фикстуры допускает — назвать это явно."

