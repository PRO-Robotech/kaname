blocking:
  - kind: COVERAGE
    scenario: Р2 п.2, вторая ветвь
    finding: >-
      Р2 п.2 объявляет второй отказ KQ006 — «вставка либо чеканка с присланным носителем,
      отличным от адреса строки в нижнем регистре, отвергаются», — но ни один сценарий его не
      утверждает: A197-05 судит только правку непустого носителя, A197-08 — только CHECK при
      отключённых триггерах. Реализация, в которой триггер молча перезаписывает присланное
      значение либо принимает его, оставляет все восемь сценариев зелёными — обещание
      без держателя, на финале не всплывёт вовсе.
    required: >-
      Либо сценарий (триггеры включены): вставка строки нашей полосы с адресом
      `own-k@example.invalid` и присланным носителем `own-z@example.invalid` → KQ006, строки
      нет; близнец в один факт — присланный носитель равен адресу → проходит; та же пара для
      чеканки (правка PENDING→own: с присланным чужим носителем). Либо снять ветвь из Р2 п.2
      и назвать исход (перезапись базой) сценарием.

important_nonblocking:
  - "A197-04: «Дано» строится сценой EV-72 (`internal/handler/loginlanehttp/address_verification_invite_integration_test.go`, `newAVLane`/`registerInvitee`/`confirm`), а не фикстурами, названными в §3 — назвать её. Счёт «принято 1» конструируем: `ActivateInviteOnVerificationTx` (mirror_tx.go) вставляет личный аккаунт ПОСЛЕ `ActivateInvite` той же транзакцией."
  - "A197-08: `session_replication_role = replica` снимает и FK-триггеры, не только триггеры строки — «аккаунт свободен» в «Дано» верен, но несущим не является; оговорить, что положительный близнец при отключённых триггерах проходит в том числе без проверки FK."
  - "Путь активации поставщиком (`internal_upsert.go:330` → `ActivateInviteTx` с идентичностью поставщика) носителя не получает — согласно Р4; назвать в §5 одной строкой."

confirmed:
  - "Производитель у «Тогда»: 8 из 8 (§4); заказанные — kaname#197."
  - "Близнец у отрицаний: 01, 04, 05 (два), 06, 08 (три) — свои; 03, 07 — существующие пробы."
  - "Конструируемость A197-08 и A197-05 посеяна: под суперпользователем (rolsuper=t у POSTGRES_USER образа) replica + пустой носитель → 23514 по имени ограничения; replica + носитель → INSERT 1; поставщик с носителем → 23514; origin + пустой → база назначила lower(email); PENDING→own: правкой → носитель назначен; смена адреса проходит, носитель прежний; правка на другой и на '' → KQ006 с сообщением; то же значение → UPDATE 1."
  - "Пользователь pgtest = POSTGRES_USER (corelib v1.10.0 pgtest.go:188,236) — суперпользователь; посылка «testcontainers-база под суперпользователем» подтверждена."
  - "users_email_check требует длину ≥3: перенос Р3 пустого носителя у нашей полосы не даст — CHECK встанет после заполнения."
  - "Писатель external_id в существующую строку один — ActivateInvite (PENDING→ACTIVE); пути смены полосы нет, KQ006 ни один нынешний оператор не ломает."
  - "KQ004/KQ005/KQ003 ветви pgmaperr.go — как в §4; users в checkValueLanes — одна запись (строка 474)."

