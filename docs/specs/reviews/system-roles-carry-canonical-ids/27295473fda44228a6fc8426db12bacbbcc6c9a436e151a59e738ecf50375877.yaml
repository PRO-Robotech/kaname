    scenario: SRCI-05
    reading: >-
      «Побайтно» значит равенство полей `allowed` и `deny_reasons` (порядок deny_reasons
      сохраняется) для каждой из Ч1–Ч4. Поле `checked_at` в сравнение не входит.
  - id: R2
    scenario: SRCI-07б
    reading: >-
      Цель B3 на проводе — `"target":{"resources":{"resources":[{"type":"vpc.network","id":"<O1>"}]}}`.
      В пробе через обработчик — `resourcesTarget(…)` (f8_target_integration_test.go), как у
      соседних держателей.

