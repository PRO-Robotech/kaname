round1_blocking_disposition:
  - id: B1
    kind: CONSTRUCTIBILITY
    outcome: fixed
    note: >-
      В телах SRCI-04 (третье When), SRCI-08 и SRCI-08б есть `"target":{"allInScope":{}}`.
      Фраза «без target = все объекты» снята. Порядок create.go: :296 структурные ворота, затем
      ворота класса, затем :315 правило кластера. Прежний id admin даёт FAILED_PRECONDITION
      «Role … not found» на :296. Новый id admin проходит до операции. Новый id viewer даёт
      INVALID_ARGUMENT trunkRule на helpers.go:380. Близнец SRCI-08/08б теперь различает ровно
      роль. Вызывающий `K` назван: restore_cluster_admin, адрес, сессия уровня «2» —
      как у держателя system_class_s2_integration_test.go:372-377.
  - id: B2
    kind: COVERAGE
    outcome: fixed
    note: >-
      Решение Р4: миграция пишет события ленты, лента не глушится и не переписывается. Решение
      названо с доводом по коду и по норме, отвергнутые варианты — с ценой. SRCI-12 перечисляет
      наблюдаемое: последнее событие о прежнем id — DELETED, первое о новом — CREATED, о каждой
      выдаче из BR — UPDATED, CREATED/DELETED о выдачах нет, о прочих предметах событий нет. У
      SRCI-12 есть близнец SRCI-12б: B5 против B2, отличие — одна роль. SRCI-06 и SRCI-10 явно
      приведены к Р4: лента исключена по имени у производителя, прежние строки неизменны,
      дописанное — по правилу SRCI-12, sequence_no в сравнение не входит. Производители — 6
      триггеров (перемерено) и journal.go. Форма миграции заказана (У2).
  - id: B3
    kind: CONSTRUCTIBILITY
    outcome: fixed
    note: >-
      Цель B2 конкретна: iam.account/A1, resources [{vpc.network, O1}]. Объект O1 посеян
      seedMirrorObject (delete_fanout_deadlock_integration_test.go:135). На 092bee4fb глагол
      принимает это состояние: системная роль назначаема везде (role_scope.go:97-103), правило
      кластера судит только cluster (helpers.go:361-363), ворота класса молчат. Ч1–Ч4 выписаны
      полями AuthorizeService.Check по образцу system_class_world_integration_test.go:260-275.
      Срез до объявлен положительным контролем фикстуры. Та же ошибка, найденная автором сверх
      замечания (B3/B4 в SRCI-07б/-10б), тоже исправлена.

blocking: []

minor:
  - kind: FORMAT
    scenarios: [SRCI-05]
    note: >-
      «Ответы Ч1–Ч4 совпадают со срезом до побайтно». В AuthorizeCheckResponse есть поле
      `checked_at`: время решения, усечённое до секунды (authorize_service.proto:284), его
      проставляет authorize_service.go:415. Срез до и срез после разделены накатом миграции.
      Поэтому буквальное побайтное сравнение красное на верной реализации. Ложного зелёного
      это не даёт, поэтому замечание не блокирующее. Чтение зафиксировано ниже, дефолт R1.
  - kind: FORMAT
    scenarios: [SRCI-07б, SRCI-05, SRCI-12]
    note: >-
      Тело глагола в SRCI-07б: `"target":{"resources":[…]}`. На проводе ветвь — сообщение
      AccessTargetResources с повторяемым полем `resources` (access_binding.proto:290-319).
      Значит, форма — `{"resources":{"resources":[…]}}`, так её пишут
      docs/content/api/access-binding.mdx:112 и соседние приёмки. Массив на месте сообщения
      краем не разбирается. SRCI-07б — интеграционная проба через структуры обработчика, а не
      кейс края (DoD п.5), поэтому замечание не блокирующее. Нотация B2/B5 в SRCI-05/-12
      описывает посев писателем репозитория и допустима. Чтение — дефолт R2.
  - kind: FORMAT
    scenarios: [SRCI-09 (снят)]
    note: >-
      Второй довод снятия неточен: «id строки выдачи выводится из имени формы, formKey = "role:"
      + <имя>». На деле form.roleID — уже резолвленный id роли (module_seed_writer.go:264 и
      318-329), то есть id выдачи выводится из id роли. Вывод это не меняет. Повтор держит
      естественный ключ «субъект, форма, якорь» (шапка grant, :286-301), и после миграции
      ключ совпадает с перенесённой строкой. Главный довод — выдач посева на эти две роли 0 —
      перемерен и верен. Снятие SRCI-09 принято.
  - kind: FORMAT
    scenarios: [SRCI-12, §8а У2]
    note: >-
      У2 описывает альтернативную форму (правка roles.id при изменённых ключах). Сказано, что
      такая форма обязана сама дописать DELETED о прежнем id. Но первое событие о новом id
      тогда будет UPDATED, а не CREATED, и SRCI-12 покраснеет. Сценарий здесь прав: это условие
      к замыслу, и в У2 его стоит дописать («и CREATED о новом id»). Наблюдаемое этим не
      меняется.
  - kind: DoD
    note: >-
      DoD п.6 — `<база #1052> <голова #1052>`. После вливания #1052 и снятия ветки пару надо
      выводить из родителей коммита вливания. Как именно — дело исполнителя. Предикат при этом
      корректен (при пустом перечне `grep -vxFf` пропускает всё).

review_defaults:
