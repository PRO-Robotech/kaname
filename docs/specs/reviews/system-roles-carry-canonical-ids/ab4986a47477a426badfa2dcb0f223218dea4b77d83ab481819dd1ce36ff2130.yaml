delta_disposition:
  - item: SRCI-05 B2 (форма)
    kind: CONSTRUCTIBILITY
    outcome: fixed
    note: >-
      Форма `system.viewer` на iam.account/A1 с целью allInScope проходит все ворота по таблице.
      Отказ на прежнюю цель-перечень подтверждён кодом (CoversType, точное равенство модуля).
  - item: SRCI-05 Ч1
    kind: CONSTRUCTIBILITY
    outcome: fixed
    note: >-
      Ч1 опирается на B1 (admin на аккаунте). Путь: реконсайлер раскрывает правило `*` в
      vpc.network на ограниченной области, ярус admin, editor ⊇ admin. U0 — владелец A1 и не
      субъект проверок, поэтому разрешение Ч1 не может прийти от владения.
  - item: SRCI-05 близнецы
    kind: TWIN
    outcome: fixed
    note: Ч5 (U3, update) — близнец Ч1, отличие одно (субъект). Ч3 и Ч4 — близнецы Ч2 (глагол, субъект).
  - item: SRCI-05 B6
    kind: COVERAGE
    outcome: accepted
    note: >-
      Строку кластерной выдачи миграция обязана перенести; это держат GET и listByRole в
      «Тогда». О праве по B6 срез сознательно не утверждает ничего, довод — Д6.
  - item: SRCI-07б B3, SRCI-12 B5, BR
    kind: CONSTRUCTIBILITY
    outcome: fixed
    note: >-
      B3 с целью allInScope глаголом достижима (в редакции 2 цель-перечень системной роли была
      недостижима; круг 2 этого не увидел). B5 сохраняет единственное отличие от B2 — роль. В BR
      добавлена B6.
  - item: шапка, история ревью
    kind: FORMAT
    outcome: fixed
    note: Правка после вердикта названа; одобрение круга 2 внесено в историю. Вердикт объявлен непереносимым.

blocking: []

minor:
  - kind: FORMAT
    scenarios: [SRCI-05]
    note: >-
      Таблица ворот начинается с «роль существует». Ворота обработчика и права выдавать
      (handler.go: форма id роли и наличие цели; create.go:286 delegatedGrantAuthority) в неё
      не внесены, хотя заголовок обещает «все ворота в порядке вызова». На конструируемость это
      не влияет: формы id прежних ролей на 092bee4fb судил круг 2, полномочия K — тот же посев,
      что у держателя ствола. Стоит дописать две строки.
  - kind: FORMAT
    scenarios: [SRCI-05, §5 контроль фикстуры]
    note: >-
      «Те же формы с другими субъектами, отличие от посева одно: писатель» противоречит само
      себе: субъект тоже другой. На мире со всеми миграциями после реализации у близнецов другой
      и id роли. Точнее так: «отличие по предмету — писатель; субъект и id роли — по
      построению». Ложного зелёного здесь нет: «Тогда» SRCI-05 судит посев, а не близнецов.
  - kind: COVERAGE
    scenarios: [SRCI-05]
    note: >-
      Можно добавить Ч6 по U4 (субъект B6) без закреплённого значения, только с требованием
      «ответ после миграции равен ответу до неё». Тогда перенос кластерной выдачи будет
      охвачен и по праву, а дефект Д6 контрактом не станет. Не блокирует: перенос строки
      уже держат GET и listByRole.
  - kind: FORMAT
    scenarios: [SRCI-05]
    note: >-
      Сноска ¹ выводит «system.admin не роль создателя» из исхода прогона. Прямое основание в
      коде — catalog/facts.go:651: при подстановке в модуле или ресурсе ContainerGrants
      пропускает правило.

