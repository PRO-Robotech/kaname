    - tuples.go:87-93 → роль с правилами при Create даёт только указатель на родителя; mapClusterRelations (:221) — лишь на ветке роли «только с перечнем прав»
    - reconcile/tuples.go:121 scopeSelfMember и :55-73 → на кластере член «сама область» не выводится (Д6 подтверждён чтением)
    - seed/role_verb_reseed.go:147 listMaterializingSystemRoles, migrate_backfill.go:290-300 (`WHERE is_system = true`) → досев проекций перечисляет системные роли по признаку, а не по константе; на старой базе с новым кодом он адресует роли с прежними id
    - serve.go:2141, :2162, :2201 и migrate_backfill.go:201, :246 → координаты шага пересчёта проекций верны
