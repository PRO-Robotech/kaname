premise:
  outcome: confirmed
  note: >-
    Посылки автора перемерены по коду @092bee4fb. Подтверждено: форма B2 редакции 2 недостижима;
    Ч1 по кластерной выдаче недостижим; новые формы B1, B2, B6 проходят ворота Create.
  commands:
    - git show 092bee4fb:internal/apps/kaname/api/access_binding/create.go | sed -n 285,320p → порядок — delegatedGrantAuthority, :296 validateStructuralGates, :302 validateSystemClassGates, :315 validateGlobalAllSelector
    - sed -n 60,150p structural_gates.go → :64-70 роль существует; :82 IsRoleAssignable; :108 ворота создателя; :126 ворота 3a и :138-146 ворота 3 судят только b.Target.Resources (при allInScope молчат)
    - sed -n 97,103p internal/domain/role_scope.go → системная роль назначаема на любой области
    - catalog/facts.go:648-655 ContainerGrants → при module=="*" или res=="*" правило пропускается, поэтому system.admin и system.viewer ролью создателя не являются (сноска ¹ верна; прямая координата — facts.go:651)
    - sed -n 195,212p internal/domain/access_binding_target.go → CoversType сравнивает модуль точным равенством; правило `*` не покрывает vpc.network, поэтому форма B2 редакции 2 получает отказ structural_gates.go:141-143
    - sed -n 361,385p helpers.go → ворота кластера молчат вне кластера; на кластере исключение даёт только IsClusterAdminRole (role_cluster_admin.go:51-54)
    - sed -n 195,300p internal/domain/rule_fingerprint.go → MaterializingSelectorsInScope; scopeIsBounded — account/project; dottedTypes при module=="*" и bounded → AllMaterializableTypes, на кластере → nil
    - feed_registry.go:50 → "vpc.network" в materializableTypes
    - reconcile_adapter.go:405 → selectors := role.Rules.MaterializingSelectorsInScope(b.Scope)
    - rule_verbs.go:63-89 ResolveVerbsAndTier → глагол `*` раскрывается в набор глаголов типа; delete → ярус admin; list/get → ярус viewer
    - internal/authzmodel/fga_model.fga, type vpc_network → editor = … or admin; viewer = … or editor (Ч1 разрешён ярусом admin, Ч3 получает отказ при ярусе viewer)
