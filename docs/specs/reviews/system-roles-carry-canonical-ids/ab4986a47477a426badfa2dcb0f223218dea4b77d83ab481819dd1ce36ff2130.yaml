constructibility:
  method: >-
    По заданию — чтение кода @092bee4fb: каждая выдача проведена через ворота Create в порядке
    вызова, материализация — через реконсайлер до яруса в модели. Посева не было: изоляция
    (пространство стенда или слот) заданием не названа. Контроль фикстуры @3ca34095c — прогон
    автора; он относится к формам редакции 2 (кластерный admin, цель-перечень viewer). Новые формы
    B1 и B2 глаголом не прогонялись. Их держит «срез до» как положительный контроль: при неверном
    чтении проба краснеет на фикстуре, а не даёт ложное зелёное.
  seeded: 0
  of: 5
  by_code_reading: 5
  items: [B1, B2, B6, B3 (SRCI-07б), B5 (SRCI-12)]
  not_executed: 5
