blocking:
  - id: B1
    kind: CONSTRUCTIBILITY
    scenarios: [SRCI-04 (третье When, выдача), SRCI-08, SRCI-08б]
    note: >-
      Тела `POST /iam/v1/accessBindings` в трёх сценариях — «без `target`, то есть выборка
      все объекты». Контракт так не читается: `target` ОБЯЗАТЕЛЕН
      (`proto/kaname/cloud/iam/v1/access_binding_service.proto:521-526`), и обработчик первым
      оператором отвечает на его отсутствие `INVALID_ARGUMENT "target is required; use
      target.allInScope{} to grant all objects under the anchor"`
      (`internal/apps/kaname/api/access_binding/handler.go:144` → `delta_input.go:27,40`) — ДО
      `create.go:296` и `create.go:315`. Названные производители «Тогда» (`structural_gates.go:70`,
      `helpers.go:380`) этими телами не достигаются: SRCI-04 вместо FAILED_PRECONDITION получит
      INVALID_ARGUMENT иного текста, SRCI-08 вместо операции — отказ, SRCI-08б — отказ другим
      текстом; близнец SRCI-08/08б различает тогда не роль, а ничего. Исправление: в тела добавить
      `"target":{"allInScope":{}}` — ровно так строит запрос держатель, на который ссылается §5а
      (`system_class_s2_integration_test.go:382`, `allInScopeTarget()`), и убрать из текста
      «без target = все объекты». Предикат: `sed -n 141,147p handler.go` (вызов — :144); `sed -n 36,41p delta_input.go`.
  - id: B2
    kind: COVERAGE
    scenarios: [SRCI-06, SRCI-07, SRCI-10, §9 «поток изменений»]
    note: >-
      Поведение ленты изменений ресурсов не названо. На `kaname.roles` и `kaname.access_bindings`
      стоят триггеры ресурсного журнала подписки, срабатывающие by construction на любой
      вставке, правке и снятии строки
      (`internal/migrations/20260914090000_resource_journal_serves_the_subscription.sql:325-339`,
      AFTER UPDATE … WHEN (OLD.* IS DISTINCT FROM NEW.*)). Миграция, меняющая id роли и
      `role_id` выдач, их зажжёт, если её не заглушить. Документ этого не решает, но неявно
      требует тишины: SRCI-06 («строк с новым id — столько же, сколько было с прежним», по
      каждой таблице, включая `resource_journal`) и SRCI-10 (полный срез после повторного
      наката равен срезу после первого — `sequence_no` из BIGSERIAL при эмиссии разошёлся бы)
      проходят только при молчащем журнале. Тишина означает, что подписчик, держащий роль и
      выдачу по событию (консоль перечитывает по событию — `subscription.md`
      sub-refetch-not-apply), не узнает ни о смене `roleId` у `B1`/`B2`, ни о снятии роли с
      прежним id и появлении роли с новым: его состояние ссылается на id, который больше ничего
      не адресует (SRCI-04). SRCI-07 судит только `subject_change_outbox` и `fga_outbox`, а §9
      называет «поток изменений — да» лишь по нему. Нужно: решение (эмиссия событий о
      `iam_role` и `iam_access_binding` миграцией — либо тишина с названным следствием для
      подписчика и чем оно снимается) и сценарий с близнецом на наблюдаемое в ленте; SRCI-06/-10
      привести к этому решению явно (что именно в `resource_journal` растёт и на сколько), а не
      держать его следствием равенства.
  - id: B3
    kind: CONSTRUCTIBILITY
    scenarios: [SRCI-05 (Given B2 и тройки проверки права), SRCI-06/-07/-09/-10/-11 через базу SRCI-05]
    note: >-
      Given SRCI-05: «выдача B2 роли system.viewer на области кластера на G1» — цель не названа.
      С `allInScope` это ровно то состояние, которое глагол отвергает (SRCI-08б документа,
      `helpers.go:380`: роль наблюдателя несёт правило-якорь — `rule.go:88-96`, правила без
      names/labels), то есть посев писателем репозитория в обход глагола заводит выдачу,
      которой продукт создать не может, и «U2 чтение — разрешено» утверждается о вымышленном
      состоянии. С пообъектной целью объект обязан быть назван. Тройки
      `InternalIAMService.Check` («изменение объекта», «чтение того же объекта») не называют ни
      тип, ни id объекта, поэтому ожидаемые «разрешено/отказ» из Given не выводятся. Нужно:
      цель B2 — конкретная (`resources:[{type,id}]` посеянного объекта либо names/labels),
      объект троек назван тем же значением, запрос `Check` выписан полями.

minor:
  - kind: COVERAGE
    note: >-
      SRCI-09 не способен покраснеть от этого изменения: посев выдач модуля резолвит роль по имени,
      а выдач посева на `system.admin`/`system.viewer` в дереве kaname нет — выдачи посева в
      `0001_initial.sql:3190-3196` относительные (`role_id` NULL, `granted_relation`), в
      `manifest.yaml` роль этих имён в выдаче не названа (`grep -n 'system\.admin\|system\.viewer'
      manifest.yaml` → одна строка комментария). Назвать выдачу посева на одну из двух ролей
      (в том числе из манифестов модулей kacho) либо признать сценарий инвариантом без предмета и
      снять.
  - kind: DoD
    note: >-
      DoD п.5: `git grep -c 'SRCI[0-9]'` считает строки, а не покрытые ID — одиннадцать не
      доказывает. Предикат по предмету: `git grep -ho 'SRCI-\?[0-9]\{2\}' -- '*_test.go' tests/newman
      | tr -d - | sort -u | wc -l` → 11 (написание ID в функциях — `SRCI<NN>`, в кейсах — `SRCI-NN`).
  - kind: FORMAT
    note: >-
      SRCI-04/-08: `Create` несёт `required_acr_min = "2"` (`access_binding_service.proto`), фикстура
      вызывающего обязана его давать — назвать в Given, иначе отказ уровня входа замаскирует
      предмет.
  - kind: FORMAT
    note: >-
      SRCI-11: при внешних ключах без ON UPDATE миграция обязана держать замок строки прежней роли
      до фиксации, иначе вставка (б), зафиксированная после снимка UPDATE выдач, роняет саму
      миграцию нарушением ключа на снятии роли. Это условие к замыслу (`flow-acceleration.md`
      fa-b2), а не к приёмке; «Тогда» верно при таком замке (`access_bindings_role_is_live` при
      отсутствии строки отдаёт решение ключу, `0001_initial.sql:281-286` → 23503).

