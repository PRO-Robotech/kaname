scope:
  reviewed: >-
    Документ целиком, §0…§6, против тела #406 и записи круга 1. Каждая команда §0 и DoD п. 4, 8
    перепрогнана на 3e71cbf19, выводы совпали: три определения ограничения
    (…175117.sql:209, …225650.sql:64 и :84); `client-revoke` в миграциях, домене, не-тестовом Go
    — 0, 0, 0; писатели RevokeFamily — grants.go:77, oauth_ceremony_repo.go:597 и :704;
    перепись констант 1·1·2·0·0 в порядке таблицы §0.3; вызовов церемонии из cmd/ — 0; SELECT причины — ноль;
    откатывающих проб 16; `ждёт слова` — 31-deployment.md:508 и doc.go:37;
    RevocationClientRevoke в grants_test.go — :64, :178. Новый предикат §0.4 по пину — 16 и 14;
    14 вызовов разобраны поимённо, все от testClientID; оставшиеся два — client_secret_test.go
    (живой токен, сверка секрета) и endpoints_internal_test.go. TestRevokeToken, случай
    «token was issued to another client», существует и подаёт только токен обновления.
    Координаты rc.2 сверены чтением: ceremony.go:1009 и :1037 (условие совпадения клиента),
    revocation.go:44-62. Координаты службы §0.9, Р4, KN-FRV-01 сверены по строкам.
    Гейты DoD п. 13 на дереве ветки: TestAcceptancePathCoordinateResolves и
    TestAcceptanceProbeCoordinateResolves — PASS, находок 0 (приёмок 47).
  method: experiment_not_reading
  document_edited_by_reviewer: false

closure_of_round_1:
  blocking_1_NEGATIVE: >-
    ЗАКРЫТО. KN-FRV-12 посеян стендом K1: от X прежним токеном — успех, A живо, токен оборота и
    B приняты; затем C тем же токеном — A отозвано с `client-revoke`, оба токена доступа A
    отвергнуты, B принят. Инъекции на двух копиях rc.2 (replace через отдельный файл модуля):
    без сверки церемонии со словом красна только KN-FRV-12 (X отзывает A), 01…04 зелены; без
    слова X получает server_error, A живо. Без сверки движка со словом красна только KN-FRV-04
    (оба вызова X — успех, A отозвано), 01…03 и 12 зелены; без слова X получает
    temporarily_unavailable на живых токенах и успех без действия на прежнем. Всё — как в §0.6
    и §6 п.12.
  non_blocking_2_PRODUCER: 'ЗАКРЫТО: Р4 больше не называет KN-FRV-10 держателем ухода семейства.'
  non_blocking_3_CONSTRUCTIBILITY: >-
    ЗАКРЫТО: §0.9 и KN-FRV-05 называют столкновение у ceremonyScene. Опытом: вторая сцена с
    меткой той же длины в той же базе не заводится (посев сессии), с меткой другой длины —
    заводится.
  non_blocking_4_SCOPE: 'ЗАКРЫТО: строка «Задача» называет для #315 и #318 снятие блокера, а не санкцию.'

