findings:
  blocking: []
  non_blocking:
    - id: 1
      kind: FORMAT
      where: 'KN-FRV-12 и KN-FRV-03, «Дано»'
      statement: >-
        «Тогда» утверждает, что оба токена доступа A — выданный кодом и выданный оборотом —
        отвергнуты, а «Дано» называет принятым только токен оборота. Опытом токен, выданный
        кодом, после оборота принят, так что утверждение различающее; стоит назвать его
        состояние и в «Дано», чтобы исходное состояние было частью контракта.
    - id: 2
      kind: FORMAT
      where: 'KN-FRV-05, «Красный до правки»'
      statement: >-
        На Т1 проба увидит отказ писателя слоя доступа как внутреннюю ошибку: наблюдено
        first=0/internal. Код 23514 лежит под ним и в тексте ошибки не виден. Описание красного
        в запросе должно назвать то, что проба печатает.
    - id: 3
      kind: FORMAT
      where: '§6 п.11'
      statement: >-
        11 перечислен среди проб стенда K1, а §4 и KN-FRV-11 держат его пробами сопряжения
        grants_test.go без стенда. Было и в редакции 1.

