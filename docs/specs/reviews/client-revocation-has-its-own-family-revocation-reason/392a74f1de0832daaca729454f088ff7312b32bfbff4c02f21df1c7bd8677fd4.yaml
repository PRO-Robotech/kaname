scope:
  reviewed: >-
    Документ целиком, §0…§6, против тела #406 (ПРЕДИКАТ СНЯТИЯ пп. 1–4, DoD) и его
    комментария 2026-09-25 п.2. Каждая команда §0 перепрогнана на 2dfaeb875, выводы совпали:
    словарь домена пять значений (oauth_ceremony.go:109, :112-121, :126-131, :135-143); три
    определения ограничения (…175117.sql:209, …225650.sql:64 и :84); `client-revoke` в
    миграциях, домене и не-тестовом Go — 0, 0, 0; писатели RevokeFamily — grants.go:77,
    oauth_ceremony_repo.go:597 и :704; перепись констант 1·1·2·0·0; SELECT причины — ноль;
    откатывающих проб 16; `client-revoke` в пробах 3; `ждёт слова` — 31-deployment.md:508 и
    doc.go:37; вызовов церемонии из cmd/ — 0. Координаты фундамента rc.2 сверены чтением:
    ports.go:318-343, ceremony.go:1009 и :1037, notes.go:265-277, revocation.go:54-62,
    strategy.go:223-243; пробы фундамента, названные документом, существуют.
  method: experiment_not_reading
  document_edited_by_reviewer: false

constructibility:
  seeded: >-
    Стенд K1 (newFlowRig) на копии дерева со словом в домене, без миграции (дерево Т1 §6 п.5),
    черновой пробой вне запроса. Посеяно и зелено: KN-FRV-01, 02, 03, 04 (обе половины, X
    заведён как C, §0.9). Обмен токена обновления после отзыва — invalid_grant на 01 и 02, как
    написано. Три истекающие пробы §0.7 красны ровно на grants_test.go:99, :186 и
    revocation_reaches_presentation_test.go:598. Посеян и недостающий случай (находка 1): X,
    прежний токен обновления семейства A — успех без действия, A живо, токен оборота принят;
    затем C тем же токеном — A отозвано с `client-revoke`.
  named_fixture_not_seeded: >-
    KN-FRV-05…10 (база в контейнере): фикстуры названы (acScene, ceremonyScene, versionsOf,
    requirePgRefusal, revokeFamilySQL), приём отката и наката до версии есть у соседа #404.
    Этим кругом не посеяны: очередь тяжёлого замка. KN-FRV-11 — статическая проба, посеяна
    прогоном TestGrants_* выше.
  counts: 'посеяно 5 из 11 сценариев плюс недостающий; названной фикстурой 6; не выполнилось 0'

findings:
  blocking:
    - id: 1
      kind: NEGATIVE
      where: '§1.1 п.3, §2 последний пункт, KN-FRV-03, KN-FRV-04, §5'
      statement: >-
        §1.1 п.3 объявляет свойство «отзыв открыт только клиенту, которому грант выдан» для
        отзыва целиком, а KN-FRV-04 утверждает его на двух путях §0.4 из трёх. Третий путь —
        прежний токен обновления, KN-FRV-03 — отрицательного близнеца не имеет, и §2 выводит
        его из объёма доводом «это изменение его не трогает». Довод неверен тем же рассуждением,
        которым документ сам заводит KN-FRV-04: сверку клиента на этом пути исполняет церемония
        (ceremony.go:1037), и нагружается она впервые именно словом. Пробы, держащей её, нет ни
        в фундаменте rc.2 (все вызовы Revoke в пробах oauthceremony идут от testClientID либо
        судят сверку секрета), ни в документе.
      experiment: >-
        Копия фундамента rc.2 со снятым условием совпадения клиента на ceremony.go:1037,
        подключённая replace. Со словом: KN-FRV-01…04 зелены все, недостающий случай красен —
        семейство A отозвано вызовом X с причиной `client-revoke`, токен оборота отвергнут.
        Без слова, та же копия: вызов X отказывает server_error, A живо,
        TestK1_ClientRevokeRefusesLoudlyWhileTheWordIsMissing зелена. Значит, до слова свойство
        держал отказ порта, после слова — только эта сверка, и ни один сценарий редакции её
        потерю не видит.
      required: >-
        Сценарий на третий путь от X (третий вызов KN-FRV-04 либо отдельный KN-FRV-NN): прежний
        токен обновления семейства A, клиент X доказан — успех без действия (RFC 7009 §2.2),
        причины и отметки нет, токен оборота A принят; близнец — тот же вызов от C отзывает A
        с `client-revoke`. Строку в §5 с производителем ceremony.go:1037; строку в §6 п.5
        (Т0: половина X зелена, контроль C красен); строку в §6 п.12 — инъекция на копии
        фундамента, с исходом, названным выше. Пункт §2 о чужом клиенте снять либо переписать:
        утверждать это изменение обязано, потому что оно этот путь открывает.
  non_blocking:
    - id: 2
      kind: PRODUCER
      where: 'Р4, последний абзац'
      statement: >-
        «Выполнимым откат становится, когда такие семейства уходят вместе со своей сессией …
        Держит это KN-FRV-10». KN-FRV-10/2 освобождает откат заменой причины прямым оператором,
        а не каскадом сессии; уход по сроку сессии, удалению человека и клиента не утверждает
        ни один сценарий. Переписать держателя либо снять слово «держит».
    - id: 3
      kind: CONSTRUCTIBILITY
      where: '§0.9, KN-FRV-05'
      statement: >-
        Столкновение сцен одной длины метки названо только у acScene. У ceremonyScene слоя
        доступа носитель сессии выводится так же из длины метки
        (oauth_ceremony_race_integration_test.go, len(tag)*104729+7), а KN-FRV-05 заводит две
        сцены в одной базе. Назвать это и там.
    - id: 4
      kind: SCOPE
      where: 'шапка, строка «Задача»'
      statement: >-
        «Приёмка держит … через неё задачи #315 и #318» читается как санкция на их код. §2
        говорит обратное. Сказать в шапке прямо, что для #315 и #318 это блокер, а не санкция:
        их величины требуют своей приёмки.

