findings:
  blocking:
    - id: B1
      kind: DoD
      where: '§7.6 п.5, дерево Т3, список «Зелены»'
      statement: >-
        Т3 объявляет зелёными «10 обе половины» и «сосед #404 в форме §7.5». На Т3 обе пробы
        красны. Причина та же, что у 08: голова Т3 — миграция #406 (шесть слов), домен — четыре.
        Последнее «Тогда» обеих проб — «повторный накат, сверка словарей пуста» — находит два
        расхождения, logout и client-removed, база шире домена. Отказ-часть 10/2 (три
        расхождения) и соседа (четыре) на Т3 зелена: до повторного наката пробы доходят. Пункт
        не выполним как написан: исполнитель либо не сдаст п.5, либо сделает повторный накат
        зелёным на Т3 и тем ослабит утверждённое «Тогда».
      measured: >-
        T3 = origin/406 @ 335a5f444 + суженный домен + перевод проб §7.0.5 и перечней §7.5, без
        миграции #339. go test ./internal/migrations/ -count=1 → 170 PASS · 4 FAIL:
        TestIntegration_RevocationVocabularyAgreesWithTheDomain (:225),
        TestTokenFamilySchema_KN_FRV_07 (:153, logout принят),
        TestTokenFamilyMigration_KN_FRV_10 (family_revocation_reason_client_revoke_integration_test.go:261,
        после goose.Up — два расхождения), TestIntegration_ConsentLeavingRollsBackToTheSameStructure
        (consent_leaves_the_schema_integration_test.go:382, после повторного наката — те же два).
        На T4 (T3 + черновая миграция) все четыре зелёные.
      fix: >-
        В §7.6 п.5 перенести из «Зелены» Т3 в «Красны» Т3 две строки: KN-FRV-10/2 (повторный
        накат) и соседа #404 (повторный накат), с причиной «после повторного наката база шире
        домена — logout, client-removed, как у 08». В «Зелены» Т3 оставить 10/1 и отказ-части
        10/2 и соседа. Тем же изменением выровнять §7.4 и §7.5, если они это повторяют.
  non_blocking:
    - id: N1
      kind: FORMAT
      where: '§7.6 п.8, последнее предложение'
      statement: >-
        «Близнецу наката #404 годится любое слово, которое принимает версия перед #404» —
        неточно. Близнец идёт через накат #404 с проверкой лежащих строк, поэтому слово обязано
        приниматься и определением наката #404. consent-withdrawn версия перед #404 принимает, а
        накат на нём отказывает. Годятся литерал client-removed и session-ended: литерал
        client-removed проверен на T3 и T4 (ConsentLeavingRefusesAFamilyCarryingTheWithdrawnReason
        — PASS).

