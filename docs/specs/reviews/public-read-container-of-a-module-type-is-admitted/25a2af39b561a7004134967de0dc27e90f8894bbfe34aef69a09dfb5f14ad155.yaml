blocking:
  - id: B1
    kind: NEGATIVE
    where: "Р1 п. 3 (строки 102-103), сценарии PM-05…PM-08"
    note: >-
      Нет отрицательного сценария на границу исключения Р1 п. 3 со стороны ПРЯМОЙ записи:
      ключ на boxes, у items действие get длинной формой с system_class. Р2 отвергает
      второе объявление только у ресурса С КЛЮЧОМ (контейнера), у ребёнка ключа нет — вход
      доходит до допуска. Р3 формулирует находку на уровне ОБЪЯВЛЕНИЯ-семени, а v_get
      ребёнка — законное семя (п. 3); реализация, исключающая v_get ребёнка целиком,
      проходит PM-01…PM-09 и молча допускает класс, названный модулем в блоке ребёнка
      (SC-37 соседа). PM-05 этот вход не держит — он без ключа, где исключения нет вовсе.
    predicate: >-
      Посеяно пробой в изолированной копии (git archive 892853c45): П1 + у items
      `{name: get, subjects: [system_class, user, service_account, 'group#member']}` →
      manifest.Load проходит; блок probemod_item несёт
      `define v_get: [system_class, user, service_account, group#member] or super_admin or
      public_reader from box`; допуск сегодня — находок 4, четвёртая
      `Д3: probemod_item.v_get: подстановочная запись субъекта system_class`.
    fix: >-
      Добавить сценарий (близнец PM-01, отличие — один факт: класс в составе get ребёнка):
      Тогда ровно одна находка Д3 — тип probemod_item, отношение v_get, запись system_class
      (либо отказ загрузки с координатой, если автор распространит Р2 на детей — выбрать и
      записать). Р1/Р3 уточнить: исключение действует на ТЕРМ (запись system_class первой у
      контейнера; терм `public_reader from <указатель>` у ребёнка), а не на объявление.
      Строка в таблице производителей и в DoD п. 1 (красный/зелёный).
  - id: B2
    kind: DoD
    where: "таблица «Опора» строка 54, DoD п. 4 (строки 323-325)"
    note: >-
      Изменение соседа названо (исключение Р1, третье ребро Р3), но согласовано не до
      конца. (а) После изменения в соседе остаются утверждения, противоположные новому
      правилу допуска, и DoD их правку не требует: §5 п. 6 «Третье ребро (Term.Computed)
      не заводится» (строки 752-756 соседа), §3 строка Д3 «рёбер два» (строка 644), §2.9
      «рёбер два, и это замер» (строка 493); тот же довод — в шапке reachableWildcardFindings
      (admit.go:546-550), которую DoD п. 3 называет лишь разделами. «Строка таблицы правок»
      у соседа места не имеет — такого раздела в нём нет (есть §0.x «что изменилось»). Два
      места об одном правиле безопасности, из которых одно ложно. (б) Таблица «Опора: одобренные
      соседи» перечисляет 9f1b5a85… наравне с одобренными, хотя у этой редакции вердикта нет
      (fa-b7-pin-approved-neighbour) — это надо сказать прямо.
    fix: >-
      DoD п. 4: назвать места соседа — §3 (строка Д3), §5 п. 6, §2.9 — и форму правки
      (пометка «заменено приёмкой public-read-container-…, Р1/Р3» со ссылкой; новая
      подсекция §0.x с датой и задачей); строка его истории о непереносе вердикта. В таблице
      «Опора» у 9f1b5a85… — статус «вердикт на редакцию не перенесён (§0.2 соседа);
      клауза Д3 меняется ЭТОЙ приёмкой, санкция — её одобрение». DoD п. 3: и раздел «Рёбра»
      шапки reachableWildcardFindings — с предикатом, что фраза «Третье ребро не заводится
      для НОВОГО типа» после правки отсутствует.

remarks_non_blocking:
  - id: I1
    kind: FORMAT
    note: >-
      Р3, строки 119-120: «объявление-семя, от которого класс достижим не через три
      следствия Р1» читается так, что путь ЧЕРЕЗ законную точку законен — тогда v_update
      (→ v_get) и peek (→ box.public_reader) находками не были бы, что противоречит Р1
      («всякое иное объявление, из которого класс достижим») и PM-07/PM-08. Переписать:
      находка — у каждого объявления нового типа, кроме законных термов Р1, из которого класс
      достижим любым путём, включая путь через законные точки.
  - id: I2
    kind: FORMAT
    note: >-
      PM-03/PM-04, «Когда»: `POST /iam/v1/accessBindings` — путь края, а держатель (DoD п. 2)
      — integration без края. Назвать вызов в форме держателя (AccessBindingService.Create
      в процессе, как public_container_read_world_integration_test.go) и оставить ссылку
      на «Вне объёма» п. 3.
  - id: I3
    kind: COVERAGE
    note: >-
      «ADM-A-07, 08, 20…22, 27 не меняются» — не измерено. На входе ADM-A-27
      (`v_get: [user, service_account] or hidden`) третье ребро Р3 даёт вторую находку
      (семя acme_widget.v_get → hidden → cluster.viewer); держатель
      TestAdmitSeedingRuleWildcardReachableOnlyViaDeadRelation судит набор правил и
      findingsOf(...)[0] — исход зависит от порядка находок. Сказать это в опоре и
      условием к коду (порядок по семени).
  - id: I4
    kind: DoD
    note: >-
      DoD п. 2 без команды; назвать её (`heavy-slot.sh integration -- go test <пакет> -run
      '^TestPM0[34]_' -count=1`) и пакет мира П2.

