remarks_non_blocking:
  - id: N1
    kind: DoD
    note: >-
      DoD п. 4, предикат «grep -c ссылки на приёмку ≥ 7 / ≥ 4» считает СТРОКИ со ссылкой, а не
      места: семь строк в одной новой §0.3 его выполняют при нетронутой строке Д3 §3. Добавить
      по месту, напр. `grep -n '^| \*\*Д3\*\*' <сосед> | grep -c 'рёбер \*\*два\*\*'` → 0 и то
      же для строки Д3 документа решения (стр. 250, «по ДВУМ рёбрам») → 0. Неблокирующее:
      места и форма правки перечислены, отказ держит п. 4а (§5 п. 6).
  - id: N2
    kind: CONVENTION
    note: >-
      Условие к коду (fa-b2, в замысел): прототип признаёт терм Р1 п. 3 по «указатель ведёт в
      объявленный контейнер», не проверяя «ребёнок ТОГО ЖЕ манифеста», и запись класса Р1 п. 2
      — без «первой». Сегодня различающий вход авторской записью не строится (терм в v_get
      ставит только ключ своего манифеста; каскад `{relation: public_reader, from: box}` уходит
      в super_admin и ловится Р3 как путь не от семени), поэтому сценария не требую; исполнитель
      держит формулировку Р1, а не прототип.

