      объявления»; выбор «Р2 не на ребёнка» записан с основанием. Перепосев на 892853c45:
      PROTO_MODE=old → B1 находок 4 (три probemod_box + probemod_item.v_get), anon/user:* —
      то же, близнец — 3; PROTO_MODE=A (прототип автора через overlay) → B1/anon/user:* —
      ровно 1 `Д3 probemod_item.v_get` с записью system_class / system_class:anonymous /
      system_class, близнец — 0. Строки 8–9 замера и строка «Прототип» совпали дословно.
  - id: B2
    kind: DoD
    status: снято
    predicate: >-
      «Опора» называет статус 9f1b5a85… и источник санкции. DoD п. 3 и п. 4 перечисляют места
      и предикаты; каждое «сегодня» перемерено на 892853c45: `git grep 'вне канона (находки
      Д3)' -- internal` → 1; `git grep 'Третье ребро не заводится для НОВОГО типа' -- internal
