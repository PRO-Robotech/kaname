  - id: M4
    kind: FORMAT
    note: >-
      `upsertParentEdges` — emitter.go:354, строка 381 — оператор INSERT внутри него (строки 103,
      412 документа).
  - id: M5
    kind: FORMAT
    note: >-
      П2 требует двух кодов в одной пробе («служба ствола», затем «код изменения»). Дефолт
      рецензента: «до» строится тем же кодом изменения, доставляющим фикстуру прежней формы
      (правило без children загрузчик принимает), «перезапуск» — новые use-case поверх той же
      базы, как `applyDelivered`. Записать так в П2.
  - id: M6
    kind: FORMAT
    note: >-
      ND-10 и снятие объявления: в пробе соседа public_reader снимается явным полным проходом
      `rec.ReconcileBinding` после доставки. «Опрос доходит до false» без названного прохода —
      назвать, кто его запускает (как у соседа).

  - id: M7
    kind: FORMAT
    note: >-
      ND-04 (ж): назван текст, но не поле `BadRequest.field_violations[0].field`
      (`shared.InvalidArg(field, desc)`, образец — handler.go:49 «permissions»). Записать
      значение: `children` либо `rules[0].children`.

