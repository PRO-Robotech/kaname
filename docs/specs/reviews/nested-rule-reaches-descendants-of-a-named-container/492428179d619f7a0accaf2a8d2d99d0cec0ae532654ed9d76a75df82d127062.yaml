blocking:
  - id: B1
    kind: SCOPE
    title: охват на allInScope противоречит одобренному исходу соседа SC-68 Б2
    finding: >-
      «Вне объёма» п. 2 (строки 45-49) и Р3 п. 2: на `allInScope` и пустой цели вложенное
      правило не даёт ничего сверх правил верхнего уровня. Роль `registry.public.read` после
      Р5 держит `registry.repositories` ТОЛЬКО вложенным правилом. Сосед, SC-68 Б2
      (anonymous-and-authenticated-are-subject-classes.md, строки 1325-1331 редакции 11):
      `usr-D` с той же ролью и целью `{"allInScope":{}}` → `v_get` на `…02/app` → true,
      `BatchCheck` `[true, true, true, true]`. По семантике этого документа `…01/app` и
      `…02/app` там → false. Строка 62 («Исходы SC-60…73 не меняются») поэтому ложна.
    predicate: >-
      sed -n 45,49p <док>; sed -n 1325,1331p <сосед ред. 11>; роль — строки 186-187 и П1 таблица
    fix_options: >-
      (а) правка SC-68 Б2 соседа: другая роль для Б2 с правилом верхнего уровня над
      repositories либо исход `…0x/app → false` с новым доказательством живости Y и `…02/app`;
      (б) охват вложенного правила на allInScope — «все контейнеры области», это расширение
      объёма В-решения. Выбор — диспетчер; рекомендация — (а): объём документа не растёт.
  - id: B2
    kind: COVERAGE
    title: заявленные исходы без сценария
    finding: >-
      (1) Вложенное правило на `allInScope` и `{}` не даёт ничего сверх верхнего уровня
      (строки 47-49) — сценария нет. Это граница поверхности: реализация, которая проецирует
      вложенный тип в проекцию глаголов роли, на allInScope молча отдаст все репозитории
      области; держателя нет. Предикат снятия задачи #874 требует прямо: «Законные близнецы:
      `allInScope`, пустая цель» (gh issue view 874 -R PRO-Robotech/kaname) — в документе их нет.
      (2) Цель, называющая объект типа, покрытого только вложенным правилом, отвергается
      воротами 3 (строки 140-143) — сценария нет. Сегодня `CoversType` читает только
      правила верхнего уровня (structural_gates.go, ворота 3); правка домена `Rule` под
      `children` этот исход меняет незаметно.
      (3) Отказ `children` на `Update` (Р4, строка 159) — ND-04 (ж) держит только `POST`.
      (4) «Нет второй дороги» (Р5, ND-10) утверждена только для `anonymous`, а Р5 говорит о
      двух классах; `authenticated` без пробы.
    fix: >-
      ND-11: `registry.reader` человеку с целью `{"allInScope":{}}` → X и Y true,
      `…01/app` false; близнец ND-02. ND-12: та же роль с целью `[registry.repositories
      …01/app]` → FAILED_PRECONDITION текстом ворот 3 дословно; близнец ND-02 (цель X).
      ND-04 (ж) — тем же телом через `PATCH`. ND-10 — обоими классами.
  - id: B3
    kind: PRODUCER
    title: держатель SC-68 Б1 назван в документе, которого нет у соседа
    finding: >-
      Р5 (строки 202-204): «после редакции 11 SC-68 Б1 держит ND-02». В редакции 11 соседа
      такого текста нет: строка производителя SC-68 и DoD S5 по-прежнему называют
      `-run '^Test(Ask|Batch)_SC68_'`, а этот шаблон на 422d1bc6f даёт ноль функций, то есть
      `ok` без единого исполненного теста. Это тот же предмет, что B2 записи соседа
      c3fda648…; закрывается правкой соседа, здесь — ссылкой на неё.
    predicate: >-
      git grep -c 'func Test\(Ask\|Batch\)_SC68_' 422d1bc6f -- internal → код 1, пусто

  - id: B4
    kind: CONSTRUCTIBILITY
    title: «Дано» ND-09 в написанном виде переноса не производит — опровергнуто посевом
    finding: >-
      ND-09 «Когда»: служба-владелец повторно регистрирует `…01/moved` с цепью на Y. Посев
      на 422d1bc6f (форма регистрации — `registerRepository` П1, `source_version` не задан):
      регистрация принята, но рёбра предков остались прежними —
      `[registry_registry:reg00000000000000001 project:… account:…]`. Причина в коде:
      рёбра заменяются только когда применилась строка зеркала (`upsertParentEdges` зовётся
      при `applied`, emitter.go:301-310), а `StmtInsertOrSupersede` обновляет строку лишь
      при `source_version` строго новее хранимого. Р3 («регистрация заменяет рёбра
      целиком», строки 137-139) верна только для более новой версии. Проба по ND-09 как
      написана была бы красной из-за «Дано», а не из-за продукта.
    predicate: >-
      heavy-slot.sh integration -- go test ./internal/apps/kaname/api/access_binding/
      -run '^TestSeedND874_' -count=1 -v (временный посев, ветка-черновик 9981c4ad2,
      внешний кластер, ns t874-heavy-integration-be38 снят) → TestSeedND874_ReRegisterMovesParentChain
      FAIL: «does not contain registry_registry:reg00000000000000002».
    fix: >-
      ND-09 «Когда»: повторная регистрация с `source_version` строго новее прежней (оба
      вызова — `parent` и `owner`); Р3 — то же условие словами. Близнец — та же повторная
      регистрация без более новой версии: права не переносятся.

important:
  - id: M1
    kind: PRODUCER
    note: >-
      Строка производителя ND-05: «текст (в) уже производят». Текст — да, условие — нет:
      `PublicReadContainer.CoveredChild` (internal/domain/public_read.go:37-45) перебирает
      только правила верхнего уровня, у `registry.reader` ребёнок лишь вложенный, и на
      стволе ворота такую выдачу пропускают. Чтение вложенных правил в `CoveredChild` и в
      `GrantsReadsOnly` (ворота SC-21, Р5 п. 2; internal/domain/system_class.go:182 перебирает
      только `r.Rules`), а также в стражах базы `kaname.role_grants_reads_only` и
      `kaname.access_binding_subject_class_reads_only` — заказ; назвать его.
  - id: M2
    kind: FORMAT
    note: >-
      ND-05 (в): «при манифесте прежней редакции (`deliverPriorEdition`)». С одной прежней
      редакцией роли `rolb812261cfaa239694` нет, и отказ — `Role … not found`
      (system_class_gates.go:116; сосед, строка 1361). Строится только «П1, затем
