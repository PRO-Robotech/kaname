remarks_non_blocking:
  - id: R1
    kind: OPEN-QUESTION
    note: >-
      Р3 п. 2 (строка 133): «c проходит ветвь P (якорь либо имена)». Ветвь меток у
      правила-владельца не названа, а Р1 её не запрещает (registry.registries — тип с метками).
      Дефолт рецензента, фиксируется здесь: контейнер выбран, если проходит селектор P в
      ЛЮБОЙ его ветви, метки включительно — иначе ключ children под правилом с matchLabels был
      бы принят и не действовал бы. Держатель — проба того же вида, что ND-08 «И», с
      matchLabels у правила-владельца (пара: метка совпала / нет).
  - id: R2
    kind: FORMAT
    note: >-
      DoD, строка 520: «соседу — редакция 11 (Р5)» — по тексту документа уже 11–12.
  - id: R3
    kind: FORMAT
    note: >-
      ND-11 (а) и ND-02 держат SC-68 Б2 и Б1 соседа ролью registry.reader (rolb812…), а SC-68
      спрашивает registry.public.read (rolb1325…). Правила ролей совпадают (таблица П1), id нет;
      в пробе держателя назвать это или задать Б1/Б2 той же ролью.

