important_nonblocking:
  - "A198-07: «Дано» (выкупленная строка, ACTIVE + членство ACTIVE) §1.4 не строит. Посев рецензента показал: голый ActivateInvite после отметки адреса отвергается отложенным ключом users_active_has_a_way_in_fk (23503 → INTERNAL); строится так — InsertPending (срок в будущем) → отметка подтверждения адреса → строка пароля приглашённого (как inviteePasswordSQL в pg-фикстуре) → ActivateInvite. Назвать эту фикстуру в харнессе §3 (её нет в пакете registration_test)."
  - "A198-07: близнец «A198-02» отличается двумя фактами (состояние строки и истёкший срок). Строже — близнец с PENDING и тем же живым сроком: меняется ровно состояние, письмо прибавляется."
  - "Р5 называет BLOCKED (срок не пишется, письма нет), сценария на BLOCKED нет — ветвь та же CASE, что у ACTIVE; держит A198-07 частично."
  - "§1.1: «(и др.)» — вхождение OutcomeRefusedInviteExpired в *_test.go одно (register_expired_invite_integration_test.go)."
  - "DoD п.3: <база> — назвать ревизию (origin/296 на момент посадки), иначе предикат не исполним как есть."

confirmed:
  - "Производитель у «Тогда»: 7 из 7 + §4 (§5); заказанные — правка run в invite.go, допустимость показана: InsertPending на ветви того же аккаунта возвращает прежний id, inserted=false, срок продлён ≥ now+23ч, членство PENDING→PENDING, регистрация после — Invited=true, клетка issued-invited 1."
  - "Близнец у отрицаний/позитивов: 7 из 7 назван (A198-07 — с оговоркой выше)."
  - "Конструируемость посевом: 7 из 7 «Дано» построены (A198-01/03/04 — пробы в дереве PASS; A198-02/05/06/07 — разовая проба рецензента), «не выполнилось» 0."
