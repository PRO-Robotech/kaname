blocking:
  - id: B1
    kind: COVERAGE
    summary: >-
      Р4 не покрывает состояние «фактор заведён, строки набора нет либо материал не читается»,
      которое производитель выводит в тело и которое схема допускает; утверждение «ноль remaining
      означает ровно одно — коды исчерпаны» и Р2 «issuedAt — момент выпуска» на нём ложны.
    evidence:
      - >-
        internal/apps/kaname/api/humansession/sf_status.go:106-122 @db8bcb7e — out.BackupCodes
        создаётся с Remaining=0 ДО чтения набора; isNotFound → только журнал (IssuedAt нулевой →
        handler.go:1548 moment → "0001-01-01T00:00:00Z"); SetSize !ok → только журнал, Remaining=0
      - >-
        опора Ф12 §13 (second-factor-totp-and-recovery-codes.md:2820-2829 @db8bcb7e): «Дано» с
        active без набора схема допускает (связывающего ограничения нет)
    failure_scenario: >-
      строка lookup_secret отсутствует при active totp → GET отдаёт сводку {remaining: 0, total: 10,
      issuedAt: "0001-01-01T00:00:00Z"}; клиент читает «коды исчерпаны» о наборе, которого нет —
      ровно класс Р-3, которым документ мотивирован
    fix: >-
      строка Р4 и Р2 для этого состояния (ключа нет / отказ — выбор автора, назвать) + сценарий
      Go integration (Given: удалена строка lookup_secret; близнец — BCS-01) с производителем
      sf_status.go:106-122; поправить фразу «ровно одно»
  - id: B2
    kind: COVERAGE
    summary: >-
      Р5 утверждает текст отказа формы запасного кода у четырёх глаголов (снятие, перечеканка,
      повышение, вход), сценарии — у двух (BCS-12 снятие, BCS-14 вход); повышение идёт ОТДЕЛЬНЫМ
      производителем, мимо parseSecondFactorField.
    evidence:
      - >-
        handler.go:1077 → humansession.JudgeStepUpForm (second_factor.go:227-235) →
        JudgeCodeForm("code", …); снятие и перечеканка — parseSecondFactorField("", …) handler.go:996,1029
    failure_scenario: >-
      реализация меняет текст/поле только в parseSecondFactorField; Р5 у повышения нарушен, ни
      один сценарий документа не краснеет; DoD п.1 зелёный
    fix: >-
      сценарий повышения `method=lookup_secret, code=ABC` → 400/3 дословно (близнец — BCS-06);
      для перечеканки — сценарий либо явная строка «тот же производитель, что снятие:
      handler.go:1029» в таблице производителей
  - id: B3
    kind: TWIN
    summary: >-
      У отрицательного BCS-14 (вход, 400 формы) положительного близнеца нет ни в документе, ни
      ссылкой; самопроверка автора «близнецы — пройдены» перечисляет пары без BCS-14.
    evidence:
      - backup-code-set-has-one-form.md:342-350 (BCS-14 без близнеца)
      - опора Ф12-12 «вход паролем и запасным кодом» (second-factor-totp-and-recovery-codes.md:1648)
    failure_scenario: >-
      вход с полем secondFactor способом lookup_secret отвергается ВСЕГДА — BCS-14 зелёный,
      неотличимо от «путь мёртв»
    fix: >-
      назвать близнеца (Ф12-12 с отпечатком опоры либо новый BCS: тот же вход с живым кодом → 200,
      ответ без backupCodeSet); у BCS-12 заодно назвать положительного близнеца BCS-11 (BCS-13 —
      отрицательный)
