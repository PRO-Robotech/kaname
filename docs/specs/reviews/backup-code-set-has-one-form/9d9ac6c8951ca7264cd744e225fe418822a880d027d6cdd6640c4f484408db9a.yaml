new_blocking_from_delta:
  - id: B1
    kind: DoD
    where: DoD п. 6, :584-594
    summary: >-
      Новый предикат по написанию снял с охвата `.github`, которое было в одобренном п. 6
      редакции 4, и объяснения этому нет. Обоснование в тексте покрывает только пробы, которые
      утверждают отсутствие ключа. Заголовок пункта «только не-тестовое дерево» читаемому не
      соответствует: `.github/scripts` — не-тестовое дерево, и предикат его не читает.
    failure_scenario: >-
      На ревизии db8bcb7e в `.github/scripts/redact-newman-report.py` 5 строк прежней формы,
      среди них самопроверка чистильщика с телом `{"backupCodesRemaining": 9}` и утверждением
      `bodies[3].get("backupCodesRemaining") == 9` (:2342, :2420-2421). Это тело синтетическое,
      службу оно не спрашивает. Поэтому опора «по предмету» (BCS-06/31/32 краснеют против службы)
      его не ловит, и предикат редакции 5 тоже. Чистильщик отчётов newman, режущий коды из
      публичных отчётов, остаётся настроен на прежнюю форму, а п. 6 при этом объявлен пройденным.
      Предикат редакции 4 эту строку видел.
    predicate: >-
      `git grep -c 'backupCodesRemaining' db8bcb7e87f11b267bb1470894bf033b3c033e78 -- internal cmd docs/content .github ':(exclude)*_test.go'`
      → 4 файла, 10 строк (добавляется redact-newman-report.py: 5); на @225428b30 тот же предикат
      → 0 строк. Возврат `.github` выполним сегодня и ничего не стоит.
    fix: >-
      Вернуть `.github` в предикат п. 6:
      `git grep -n 'backupCodesRemaining' -- internal cmd docs/content .github ':(exclude)*_test.go'`
      → 0, контроль @db8bcb7e → 4 файла, 10 строк. Обоснование исключения ограничить тем, что
      действительно исключено (тесты Go и `tests`). Если `.github` исключается намеренно,
      назвать причину и держателя этой части дерева по предмету.
non_blocking:
  - id: N1
    where: DoD п. 6, обоснование исключения `tests`
    note: >-
      Опора «по предмету» («проба, ждущая ключ со значением, краснеет против службы») верна для
      проб и посевов, которые спрашивают службу. Пример — tests/authz-fixtures/seed_key_person.py:416
      @db8bcb7e: `.get(...) != 0` против новой службы падает посевом. Заглушки внутри `tests`,
      отвечающие сами (seed_key_person.py:613 @db8bcb7e), она не покрывает. Сегодня их 0, это
      измерено @225428b30. Учесть при правке.
