  git grep -n 'func <имя>' e9ce4ffbdc:gateway/ → own_session_lane_test.go:608 (F13_28) и :403
  (F3_51), login_lane_relay_composition_test.go:97 (F12_38), own_session_address_gate_test.go:326
  (F6b_04), login_lane_paths_test.go:297 (F13_28 пути) — строки совпали с документом; на стволе
  a952484649 каждая функция есть (git grep -c → 1 на каждую), утверждение «четыре Go-пробы есть и в
  стволе» верно (держателей четыре, F3_51 — опорная). Проба браузером:
  git grep -n '^test("' e9ce4ffbdc:ui-future/e2e/specs/access-key-assurance.spec.ts → метки и
  строки :296 :322 :338 :364 :384 совпали дословно; на a952484649 файла нет — «только на ветке
  эпика» верно; e9ce4ffbdc содержится в origin/3172-identity-own-2; 18180823b5 (#3037) — предок
  e9ce4ffbdc. Ф13-09 первая половина «нет»: AST-обход строковых литералов
  tests/newman/cases/*.py (46 модулей) → 0 вхождений «Ф13-09»; единственное вхождение — комментарий
  kaname-access-keys.py:1930. Сценариев 32 на обеих ревизиях (awk §5…§6 | sort -u | wc -l → 32 и
  32); «Дано», «Тогда», решения Р1…Р15 и §7 не тронуты — дифф затрагивает шапку, §5 (обозначения),
  §6 (две строки, §6.4), §8, §9 п. 8, ровно как объявлено шапкой. Пробелы §6.4 (текст F4d-22 на
  двух глаголах, состав запроса без носителя) названы честно, а не прикрыты соседней пробой.
