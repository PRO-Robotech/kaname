blocking:
  - id: B1
    kind: COVERAGE
    summary: >-
      Тумба Р11 (строка 1117) утверждает: ключ, заведённый церемонией Ф7-01, обнаруживаем by
      construction, и «ключ, не появившийся в полосе» больше не возникает. Это ложно на той же
      ревизии: Ф7 Р12 (редакция 15) держит у ключей церемонии состояние «не сообщено» с писателем —
      приём результата церемонии без расширения (Ф7-41, третья сторона), и правило годности стража
      считает такой ключ негодным именно потому, что полоса входа его может не найти. Ф13 §4.4 (строка
      1424) сама читает три состояния соседки.
    why_blocking: >-
      Сведение объявлено как «ни одного нового решения», а довод ветви (а), написанный до Р12 ветви
      (б), перенесён дословно и противоречит решению, которое сведение же сохраняет: снятие Р11
      обосновано несуществующим свойством, и исход для ключа в состоянии «не сообщено», не
      предложенного аутентификатором, документ объявляет невозникающим.
    fix: >-
      Переписать обоснование тумбы Р11: предмет снят вместе с переносом; ключ церемонии в состоянии
      «не сообщено» может не появиться в полосе — его исход держат Р2 (второй формы входа нет; «не
      предложен аутентификатором» Тогда на нашей стороне не имеет) и страж годности Ф7 Р12, а не
      свойство by construction. Сценарии и счёт (32) не трогаются.
non_blocking:
  - id: N1
    summary: >-
      Четыре документа (Ф1, Ф4, Ф7, Ф13) ссылаются на решение kacho#2703 «полосы регистрации ключом не
      будет» от 2026-10-03; сама задача OPEN, и последний её комментарий (2026-09-25) решения не несёт
      — оно записано только в плане сессии (plan-final.md R1). Событие одобрения не публиковать, пока
      решение не опубликовано комментарием в kacho#2703: иначе ссылка документа указывает на носитель,
      которого нет.
  - id: N2
    summary: >-
      Строка §4.4 (1421) «оба её писателя (церемония и перенос Ф7; писатель переноса снят)» — при
      правке писать «писатель — церемония», слово «оба» читается как два живых.
