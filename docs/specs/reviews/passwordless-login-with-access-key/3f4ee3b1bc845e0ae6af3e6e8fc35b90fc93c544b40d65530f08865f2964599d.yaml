effective_approval:
  issued: false
  ban1_lifted: false
  why: >-
    Вердикт круга 4 — APPROVED: блокирующих ноль. Редакция 4 — ОДИН предмет: снятие переноса
    трёх ключей (решение владельца 2026-09-17, kacho#1273; диспетчер 2026-09-18, вариант «а»),
    задевшее одобренную ред.3 в четырёх местах. Проверено по существу: (1) отпечаток совпал
    (см. fingerprint_note); (2) Ф13-24 снят тумбой-пропуском, номер не переиспользован, живых
    ссылок нет — только шапка/тумба/комментарий предиката §5; (3) Р11 снят тумбой, живых ссылок
    на СВОЙ Р11 нет (ссылки на Ф7 Р11 — к соседу, законны); (4) Ф13-23 переписан под свой
    предмет (человек без пароля из сессии, выданной ключом, заводит НОВЫЙ ключ), производитель —
    Ф7 (Ф7-01) + Ф13 (Ф13-05); (5) шов Ф13 §6.1 ↔ Ф7 §4.5 согласован; (6) все счётные предикаты
    прогнаны на a27f3563 и совпали. Санкция этим НЕ выдана: эпоха post-cutover, политика называет
    единственного, кто выпускает effective approval, — `pointpu`; роль без внешнего события
    полномочия не даёт (`change-graph.md` §3). До события запрет #1 по этой редакции остаётся
    в силе — третья категория, не «нет».
  what_the_event_would_lift: >-
    Кодирование объёма §4.1 п. 1…14 в фазе Ф13 `#1282` (полоса входа ключом: два глагола формы
    семейства Ф3, сверка через проверяющего Ф7, рукоятка в строке ключа, счёт по источнику,
    провязка в страж посадки), и только то, что §0.2 разрешает поимённо. Ф13-25 и Ф13-13
    остаются условиями DoD до посадки Ф5 (#2698) и `kaname#208` — §9 п. 6, 7.
  what_the_owner_sees_in_the_event: >-
    Редакция 4 ратифицирует снятие предмета переноса, а не новое наблюдаемое поведение: сервер
    Ф7 уже построен и в линии (kaname#263 в release/iam-lines) без переноса. Сняты: Ф13-24
    (перенесённый ключ без рукоятки), первая половина Ф13-23 (вход перенесённым ключом), Р11
    (судьба перенесённого ключа), дописки Д6/Д28/Д29/Д30 к Ф7. Число сценариев 32 → 31. Решение
    «не заводить второй формы входа» осталось и живёт в Р2 (довод об оракуле, не о цене переноса).
    Новая внешняя поверхность прежняя — два глагола формы на origin консоли (Р1),
    неаутентифицированные на уровне запроса by construction.
