# ─── БЛОКИРУЮЩЕЕ КРУГА 2 — ТОТ ЖЕ ОПЫТ, ДРУГОЙ РЕЗУЛЬТАТ ─────────────────────
round2_blocking_recheck:
  - id: Б3
    predicate_round2: >-
      Ф13-32 ред. 2 против Ф3-28 («N неверных, затем N + 1-я — 429»), Ф3 Р10 (неверный пароль
      считается по адресу И по источнику; успех обнуляет по адресу) и Ф13-04 («`N_источник − 1`
      уже; ещё один — 200; второй — 429»): «Дано» `N_адрес − 1` + «ещё один → 429» — на одну
      раньше; (а) «ни одного 429» без ограничения `N_источник`.
    result_round3: >-
      Ф13-32 ред. 3 (:1141–1164). «Дано»: `N_адрес ≥ 2` и `N_источник ≥ 2·N_адрес`; один
      источник; `N_адрес` неверных по адресу уже предъявлено — «граница включена: `N_адрес`-я —
      401, следующая была бы 429 (Ф3-28; та же арифметика, что у Ф13-04 по источнику)».
      Арифметика по адресу: (а) `begin`, вход ключом (200), `N_адрес − 1` неверных → счёт после
      обнуления доходит до `N_адрес − 1 < N_адрес` → все 401 — верно по Ф3-28 (N-я ещё 401);
      (б) без `begin`/входа — первая же неверная есть `N_адрес + 1`-я → 429 — верно по Ф3-28;
      «каждая следующая — 429» — верно (окно не истекло, счёт ≥ N). Различимость: без обнуления
      первая неверная после входа в (а) была бы `N_адрес + 1`-й → 429; при `N_адрес = 1`
      добавочных неверных ноль, ветвь (а) ничего не различает — отсюда `N_адрес ≥ 2` (Н11 круга 2
      называла ≥ 3 для «Дано» на `N − 1` и ≥ 2 для «Дано» на `N` — выбран второй, верно).
      Арифметика по источнику: `N_адрес` неверных «Дано» (по Ф3 Р10 считаются и источником) +
      `begin` (Р9: попытка) + `N_адрес − 1` неверных = `2·N_адрес`; успешный вход попыткой не
      считается (Р9: «пара `begin` + успех стоит одной попытки»); по Ф13-04 `N_источник`-я
      попытка ещё 200 (граница включена) → при `N_источник ≥ 2·N_адрес` 429 по источнику на
      верной реализации невозможен — «ни одного 429» стало утверждением о счёте по адресу.
      Второе расхождение, найденное автором сверх Б3: «И» ред. 2 «`begin` и `login` посчитаны
      попытками источника» → ред. 3 «`begin` … посчитан попыткой источника … после входа счёт не
      уменьшился» — согласовано с Р9 того же документа. §8 строка Ф13-32 (:1753) сверена:
      «первая же неверная после входа оказывается `N_адрес + 1`-й … 429: красный (при
      `N_адрес ≥ 2`); … 429 по источнику на верной реализации исключён «Дано»
      (`N_источник ≥ 2·N_адрес`)» — то же, что в сценарии. Р9 (:696–720) не менялся. Остатков
      старой арифметики нет: `grep -n 'N_адрес − 1'` → только ред. 3 (:1147, :1149, :1156 —
      добавочные попытки после обнуления), `grep 'на границе)'` → 0.
    neighbour_check: >-
      Ф3-28, Ф3-29 и Р10 на ветке #214 между b10566a5 (= 1a7f6846, ревизия, которую Ф13
      цитирует) и 230a7414 (ред. 10) — `diff` пуст по всем трём: цитаты Ф13 верны о действующей
      редакции Ф3. Ф3 Р10 дословно: «успешный вход … обнуляет счёт по адресу» (:10 раздела);
      «Считаются: неверный пароль · адрес, которого нет …» — по обоим счётам.
    verdict: ЗАКРЫТ

