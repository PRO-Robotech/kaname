  причиной). Форма E + I у Ф13-09 — по образцу Ф13-06 (B1 (а) круга 9). Производитель назван у
  каждой части «Тогда» Ф13-28 и Ф13-09; оба пробела края закрыты пробами kacho#3273, координаты
  существуют в названной ревизии. Близнец: none_no_carrier против A_live_session — ровно один факт
  (нет нашего печенья сессии); отсечка против «сессии нет» — один факт состояния сессии.
