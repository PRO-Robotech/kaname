# ─── ПЕРЕМЕР ПОСЫЛОК ЗАДАНИЯ — ОБЕ ОПРОВЕРГНУТЫ, И ОБЕ ПО ОДНОЙ ПРИЧИНЕ ──────
task_premise_remeasured: >-
  Посылка задания «редакция 5, своего круга не получала НИ РАЗУ» — ОПРОВЕРГНУТА второй
  половиной и уточнена первой.
  (1) «Круга не получала ни разу» — НЕВЕРНО. Перепись каталога записей (`ls
  docs/specs/reviews/passwordless-login-with-access-key/`) даёт ТРИ записи: `449a08dd…`
  (round 1, CHANGES_REQUESTED), `305f0777…` (round 2, CHANGES_REQUESTED), `83347069…`
  (round 3, APPROVED, `ban1_lifted: true`, событие
  kacho#1282#issuecomment-5709230381). Поэтому номер круга здесь — 4, а не 1, и роды
  блокирующих прежних кругов прочитаны (Б1 «клетка без производителя», Б2 «неполная
  ведомость дельты», Б3 «арифметика границы частоты») — ни один из них этим кругом не
  повторился.
  (2) «Редакция 5» — верно о коммите, НЕ верно о теле документа: слово «редакция 5» в
  файле встречается НОЛЬ раз, документ называет себя «редакция 4» (30 вхождений). Второе
  содержимое под тем же ярлыком «редакция 4» лежит на ветке
  `issue-1282-f13-f7-without-transfer` (`3f4ee3b1…`, 1876 строк, 31 сценарий, СТАРОЕ Р3
  «платформенный id»), коммит a27f3563 от 2026-09-19. То есть ярлык редакции НЕ является
  однозначным именем содержимого; отпечаток — является, и судим отпечаток.
  ВАЖНО: на существо это НЕ влияет — §4.4 проверен прогоном против ОДОБРЕННОЙ редакции 3
  и его закрытый перечень оказался ВЕРЕН (см. predicates_run), поэтому пункт отнесён в
  важные, а не в блокирующие.

