    sections: [Ф13-20 (:1585–1594), Ф13-05, Ф13-06 «з»]
    predicate: >-
      Ф13-20 «Дано»: «личность с паролем, КЛЮЧЕЙ НЕТ; подставной аутентификатор, у которого
      есть ключ ДРУГОЙ личности». «Когда»: «предъявлено утверждение ЧУЖОГО ключа с
      `userHandle` ЭТОЙ личности». Против ближайшего положительного Ф13-05 (человек со своим
      ключом входит) внесено ТРИ различия разом: у субъекта нет ключей · предъявлен ключ
