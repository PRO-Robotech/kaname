  - id: Н4-4
    genus: COVERAGE
    title: Параметры церемонии — дома у каждого ровно один, и это проверено; дыры в шве нет
    detail: >-
      Перемерено по обоим документам, потому что задание называло это риском. RP ID —
      Ф13-01 «rpId — имя доверяющей стороны Ф7 Р2», ручка посадки соседки. `userVerification`
      — литерал `"preferred"`, назван ДВАЖДЫ одинаково (Ф13-01 и Д7) со ссылкой на Ф7 Р9 и
      с наблюдением равенства (Ф7-42). user handle — решён здесь, Р3, 64 байта. `credProps.rk`
      — соседка, :1979 «сообщается ровно один раз, в церемонии регистрации», и на нём стоит
      её Р12. Словарь алгоритмов — соседка, Р2, и он НАМЕРЕННО «не объявлено» как величина
      контракта: это ручка посадки («криптополитика оператора ЭТОЙ установки»), решение с
      доводом, а не умолчание. Конкретных значений COSE (`ES256`/`-7`) не называет ни один
      из двух документов — и это ПРАВИЛЬНО для полосы входа: алгоритм — параметр РЕГИСТРАЦИИ,
      утверждение его не несёт. Пункт записан затем, чтобы следующий круг не искал эту дыру
      заново: её нет.

