      Заголовок обещает предмет «личность БЕЗ КЛЮЧЕЙ», а «Тогда» наблюдает другое:
      «сверяется рукоятка СТРОКИ КЛЮЧА (владелец — другой человек), а не присланная
      (Ф13-06 «з»)» — то есть наблюдается несовпадение рукоятки со строкой, и это предмет
      уже существующей ветви Ф13-06 «з». Строка «И» это подтверждает, снимая обещанное
      заголовком с наблюдения вовсе: «что аутентификатор человека без ключей ничего не
      предлагает, службе НЕ НАБЛЮДАЕМО (Р2) и здесь НЕ УТВЕРЖДАЕТСЯ».
      Слова «положительный близнец» либо «положительный контроль» в теле Ф13-20
      отсутствуют — перепись по §5 даёт их у 15 сценариев из 32, у Ф13-20 нет.
      Контроль в обратную сторону — соседние отрицания близнеца несут: Ф13-16 «положительный
