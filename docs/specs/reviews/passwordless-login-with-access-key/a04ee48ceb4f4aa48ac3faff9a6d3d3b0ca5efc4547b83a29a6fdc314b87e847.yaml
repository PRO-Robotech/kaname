      ровно одно: какое из двух испытаний подписано». Форма в документе есть и применяется.
    revision: kaname@b0e25c52
    why_blocking: >-
      Отрицание без положительного близнеца неотличимо от «предмета уже нет»: Ф13-20 зелен и
      у реализации, которая сверяет рукоятку правильно, и у реализации, которая на полосе
      ключа не находит НИЧЕГО и отвечает единым отказом всегда, — второе прошло бы весь §5,
      потому что единый отказ побайтово одинаков by construction (Р7, Ф13-06). Именно этот
      класс §1 документа объявляет входом работы. Сверх того при трёх внесённых различиях
      красный сценарий не называет, какое из трёх его вызвало, — то есть не различает
      дефект сверки рукоятки от дефекта поиска строки.
    consequence_for_decisions: >-
      Ни одно решение не меняется; Р2 (обнаружение без имени) остаётся как есть. Меняется
      «Дано»/«Тогда» одного сценария и, возможно, его заголовок.
    outcomes: >-
      Либо (а) свести Ф13-20 к одному различию против Ф13-05 — оставить субъекта с ключом и
      подменить ТОЛЬКО рукоятку (тогда он честно дублирует Ф13-06 «з» и его стоит слить с
      ней, назвав слияние), либо (б) сделать его предметом ровно то, что обещает заголовок:
      у субъекта ключей нет, предъявлено утверждение по идентификатору удостоверения,
      которого в базе нет, — и назвать положительным близнецом Ф13-05 с единственным
      внесённым различием «есть строка ключа / нет строки». В обоих случаях дописать строку
      «положительный близнец … ; внесённое различие — ровно одно», как у Ф13-24.

