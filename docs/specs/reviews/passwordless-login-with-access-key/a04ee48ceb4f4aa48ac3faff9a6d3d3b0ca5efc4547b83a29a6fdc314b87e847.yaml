  - id: Н4-3
    genus: FORMAT
    title: Величины частоты названы символами соседа, а не числами — и это верно, но стоит сказать явно
    detail: >-
      Р9 не добавляет ни одной ручки и отсылает к четырём величинам Ф3 Р10
