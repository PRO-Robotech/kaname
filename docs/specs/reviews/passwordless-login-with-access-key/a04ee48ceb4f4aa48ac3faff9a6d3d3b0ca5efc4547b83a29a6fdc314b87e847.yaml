blocking:
  - id: Б4-1
    genus: CONVENTION
    title: >-
      ОДИН вид признака формы `access-key-login` объявлен на ДВА меняющих состояние глагола
      (`begin` и `login`) — против правила Ф3 Р12 «его вид — вид ЭТОЙ формы»; следствие:
      признак, выданный под форму ЗАПРОСА, предъявим на форме ПОДТВЕРЖДЕНИЯ, и документ
      утверждает это проходом (Ф13-26 «г» → 200), ни разу не назвав решением
    sections: [Р1 таблица поверхности (:506–507), Ф13-02 (:1286–1295), Ф13-26 (:1692–1702), Ф13-27 (:1704–1710)]
    predicate: >-
      Таблица Р1 (:506, :507) даёт в колонке «вид признака формы» ОДНО И ТО ЖЕ значение
      `access-key-login` для `POST /iam/v1/auth/access-key/begin` и для
      `POST /iam/v1/auth/access-key/login`. Ф13-27 закрепляет это счётом: «перепись видов
      формы печатает 7 (шесть Ф3, Ф4, Ф5 плюс ОДИН)» — один вид на два новых глагола.
      Норма соседа, прочитанная на своей ревизии (login-lane-… @ 713ff0bd, Р12 :1048–1070):
      «признак — значение, которое `GET /iam/v1/auth/csrf?form=<вид>` выдаёт держателю
      контекста для ОДНОГО ВИДА ФОРМЫ», и проверка — «его вид — вид ЭТОЙ ФОРМЫ».
      При одном виде на две формы предикат «вид этой формы» их не различает by construction.
      Что документ об этом утверждает: Ф13-26 «Дано» — «контекст `K1` и признак `T1` вида
      `access-key-login`; ИСПЫТАНИЕ ВЫДАНО ПОД `K1`» (то есть `T1` уже послужил форме
      `begin`), ветвь «г» — «с годным `T1` под `K1`» → `200`. То есть переносимость признака
      с формы запроса на форму подтверждения ПРЯМО УТВЕРЖДАЕТСЯ как проход.
      Контроль в обратную сторону — предикат различать умеет: оба отрицательных сценария
      ловят ЧУЖОЙ вид (Ф13-02 «б» — признак вида `login`; Ф13-26 «б» — вида `password`),
      и оба дают 403. Ни одного сценария о признаке ТОГО ЖЕ вида, выданном СОСЕДНЕЙ форме
      семейства, в §5 нет.
    revision: kaname@b0e25c52 (документ a04ee48c…); Ф3 на 713ff0bd (полоса)
    why_blocking: >-
      Это класс, который в этой же сессии уже стоил дефекта: при одном виде формы на два
      пути значение с формы запроса оказалось предъявимо на форме подтверждения. Здесь он
      не «возможен» — он ОБЪЯВЛЕН проходом, и объявлен молча: ни Р1, ни одно из Р2…Р15 не
      несёт решения «вид один на оба глагола», нет ни довода, ни цены, ни отвергнутого
      исхода (два вида: `access-key-begin` и `access-key-login`). Документ, который в
      семнадцати других местах называет отвергнутый исход с ценой, здесь принял развилку
      умолчанием механизма соседа — а приёмка про аутентификацию именно этого делать не
      вправе: умолчание принадлежит механизму Ф3, не контракту Ф13.
      Отдельно: `begin` МЕНЯЕТ СОСТОЯНИЕ (заводит строку испытания со сроком — Р1, Ф13-03)
      и сам считается попыткой (Р9), то есть подпадает под «каждую форму, меняющую
      состояние» Ф3 Р12 наравне с `login`, а не является чтением.
    consequence_for_decisions: >-
      Существо полосы не меняется ни в одном сценарии. Требуется ОДИН исход из двух, названный
      решением: либо (а) вид остаётся один — тогда в Р1 появляется абзац «почему один вид на
      два глагола» с ценой (признак `begin` предъявим на `login`; чем это безопасно —
      предположительно тем, что оба под одним контекстом `kaname_form`, а контекст сменяется
      выдачей сессии), отвергнутый исход «два вида» назван, и §5 получает сценарий,
      НАБЛЮДАЮЩИЙ перенос признака между двумя глаголами семейства (сегодня он лишь
      подразумевается ветвью Ф13-26 «г»); либо (б) видов два — тогда правятся Р1 (две строки
      таблицы), Ф13-02 «б», Ф13-26 «б», Ф13-27 (перепись печатает 8, не 7) и §9 п. 4.
    outcomes: >-
      Назвать решение в Р1, назвать отвергнутый исход с ценой, и в обоих случаях завести
      сценарий с ПАРОЙ: признак, выданный `?form=access-key-login` и предъявленный `begin`,
      затем тот же признак предъявлен `login` — с явным «Тогда» (проход при исходе (а),
      403 `FORM_TOKEN_REJECTED` при исходе (б)) и положительным близнецом.

