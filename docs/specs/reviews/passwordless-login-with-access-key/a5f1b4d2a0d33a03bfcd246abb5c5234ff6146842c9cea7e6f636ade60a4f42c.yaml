    §4.2 с носителем и предикатом возврата по каждой строке, плюс §4.4/§4.5 «вне объёма
    редакции» с проверкой чтением. Over-scope нет: §7 инв. 16 («ни одна фаза не разрешена
    вперёд») и §0.2 закрывают сценарии Ф7, Ф8, Ф10, Ф12 и составную регистрацию ключом.
    Under-scope не обнаружен: каждое решение Р1…Р15 имеет сценарий, ведомость §6 замкнута.
  coverage: >-
    33 сценария, сгруппированы полосами (испытание · вход · уровень · второй фактор · две
    полосы · перенесённый ключ · утрата · формы/край/посадка/журнал/дерево). Negative несут
    конкретные коды: 400 INVALID_ARGUMENT с именем поля, 403 PERMISSION_DENIED с
    `reason = FORM_TOKEN_REJECTED`, 401 UNAUTHENTICATED единым отказом, 429
    RESOURCE_EXHAUSTED с `reason = TOO_MANY_ATTEMPTS` и `Retry-After`. Конкурентный конфликт
    предмета не имеет: полоса выдаёт сессию одной операцией Ф3, однократность испытания
    держится замещением (Ф13-03, Ф13-08). Edge: граница частоты включена с обеих сторон
    (Ф13-04, Ф13-32), пустой `allowCredentials` как ПУСТО, а не отсутствие (Ф13-01).
  producers: >-
    У КАЖДОГО «Тогда» назван производитель — §6 «сценарий → производитель», 33 строки из 33,
    плюс §6.1 (шов с Ф7 §4.5), §6.2 (решения Ф3), §6.3 (строки Ф11/Ф12). Требуемых без
    держателя нет: Ф13-33 получил его этой редакцией (Б4-2 закрыт).
  twins: >-
    Отрицаний без положительного близнеца не найдено. Перемерены поимённо те, что были
    предметом кругов: Ф13-02 (д)/(е) · Ф13-26 (д)/(г) · Ф13-20/Ф13-05 · Ф13-23/Ф13-24 ·
    Ф13-03 · Ф13-32 (а)/(б) · Ф13-30 (пара (б),(к)) · Ф13-31 · Ф13-33 (инъекция в обе
    стороны). По словарю («близнец», «положительный контроль») НЕ судил: перепись по словам
    недобирает — многие сценарии несут близнеца структурно ветвями; это ошибка, названная
    кругом 4, и я её не повторял.
  format: >-
    Given/When/Then у каждого, уникальные метки Ф13-NN, уровень наблюдения (E · I · P) у
    каждого. «Когда» несёт конкретный payload camelCase, «Тогда» — код плюс содержимое
    (`reason`, текст, заголовки, `Set-Cookie`). Форма ответа входа объявлена побайтово
    равной Ф3-01.
  traceability: >-
    Двусторонняя по метке: §5 ↔ §6 ↔ §8 (чем краснеет до кода) ↔ §9 (DoD). Сквозная проба —
    §9 п. 9, набор `tests/newman/` дома службы под сертификатом края.
  realism: >-
    Требований будущих фаз нет. «Магических» предпосылок нет: §5 преамбула перечисляет, чем
    строится каждое «Дано», и помечает несозданные условия как ТРЕТЬЮ КАТЕГОРИЮ с носителем
    (§4.3).
  dod: >-
    §9 — одиннадцать пунктов, каждый measurable; три условия (пп. 6, 7, 8) названы словами и
    в вердикт не вычитаются; §7 инв. 15 объявляет три исхода у каждой пробы. DoD ссылается
    на конкретные сценарии и на финальную сквозную пробу.
  conventions: >-
    Нарушений `00-kacho-core.md` §Non-negotiables ни одним сценарием не найдено. ban #5
    соблюдён явно и с ценой: комментарий ВЛИТОЙ миграции не правится на месте — требуется
    новая миграция с новым `COMMENT ON COLUMN` (§4.4, четвёртое место). ban #15: адресация
    по `id`, и решение Р3 именно об этом — платформенный `id` УБИРАЕТСЯ из рукоятки, потому
    что рукоятка уезжает в чужое хранилище безвозвратно. ban #11: отложенного без предиката
    снятия не осталось — Р11 получила предикат и того, кто его заметит (Н4-2 круга 4).
    ban #6: полоса — слушатель формы с допуском ровно краю по SAN (Ф3 Р16), Internal на
    внешний слушатель не выносится.
  open_questions: критичных нет; дефолтов на ревью не фиксировалось
  security_disclosure: >-
    Документ публичный (§10 — граница текста объявлена). Ни одного дефекта защиты с
    координатой эксплуатации ни документ, ни эта запись не называют: предмет обеих — КОНТРАКТ
    и наблюдаемость решения. Проверено: `grep -ciE 'CVE|эксплойт|exploit'` по документу → 0.

# ─── ГРАНИЦЫ ЭТОГО КРУГА ────────────────────────────────────────────────────
limits:
  - >-
    Конструируемость «Дано» ПОСЕВОМ не проверялась — граница, поставленная заданием и
    обоснованная документом: таблицы ключей на посадке нет (`to_regclass` пусто, миграции
    ключа не применены, голова `20260917210000`). Это ТРЕТЬЯ КАТЕГОРИЯ: посеяно 0 из 33,
    «не выполнилось» 33. Чинится посевом на стенде — чужой момент. Замер посадки я НЕ
    переснимал: он сделан кругом 4 (8 из 8, включая обратный контроль), и задание его не
    переоткрывает.
  - >-
    Прогон сценариев §5 не производился: испытуемого нет (∅4 держится, глаголов входа
    ключом в дереве ноль — перемерено на трёх ревизиях). Вердикт вынесен о КОНТРАКТЕ, как и
    положено этой роли. Единственный настоящий прогон круга — разрушающая проверка Б4-2, и
    она поставлена на ветке заготовки, а не на стволе; что она доказывает и чего не
    доказывает, названо в round4_blocking_recheck.Б4-2.limit_named.
  - >-
    Три состояния обнаружимости, Р3 по существу и корректная часть шапки НЕ перепроверялись:
    они проверены кругом 4 и этой редакцией не менялись (перемерено посценарным сравнением и
    чтением §4.5). Граница поставлена заданием и принята.
  - >-
    Числа §1.1 и §1.2 на ревизиях `af0ca8f3` · `6acf8f19` · `94352d9c` · `bbd25128` сплошь
    мной НЕ переснимались — документ сам объявляет их сплошной перемер работой своего круга.
    Перемерено выборочно то, на что опираются мои выводы (перечислено в predicates_run).
  - >-
    Дом платформы (PRO-Robotech/kacho) этим кругом НЕ читался: судимая редакция его не
    трогает. Утверждения о крае (`#2689` влит, `275240efdc`) приняты как объявленные и мной
    не перемерены.
  - >-
    Правило оркестрации о повторе рода (`multi-agent-flow-orchestration.md` §14а) прочитать
    НЕ УДАЛОСЬ — файла в `.claude/rules/` нет (перепись каталога: 18 файлов, такого нет;
    скила `rule-multi-agent-flow-orchestration` в перечне тоже нет). Третья категория, не
    отказ: я применил правило о роде из собственного тела (§6) и из скила `change-graph`,
    который в дереве ЕСТЬ. Названо, потому что сигнал о повторе рода адресован диспетчеру, и
    он должен знать, что норму я взял не из её дома.

reviewer_errors_named_first:
  - >-
    Первый прогон посценарного сравнения дал ШЕСТЬ изменённых сценариев вместо пяти —
    «изменён Ф13-31», чего §4.5 не называет. Находка была бы блокирующей (перечень «вне
    объёма» объявлен закрытым и проверяемым чтением) и НЕВЕРНОЙ. Разобрано до вывода:
    diff показал, что весь «изменённый» текст Ф13-31 — исчезнувший горизонтальный
    разделитель `---`, который прежде завершал §5, а теперь принадлежит блоку Ф13-33; тело
    сценария побайтово то же. Перемер с нормализацией разделителя дал РОВНО ПЯТЬ, как и
    объявляет §4.5. Названо первым, потому что ошибка моя, а не автора, и потому что круг 4
    споткнулся о разбиение §5 в другом месте — прибор тот же, и он требует контроля каждый
    раз.
  - >-
    Едва не зачёл «ветка не опубликована» в дефект документа. Остановился на вопросе, от
    чего стоит ВЫВОД: он стоит на отсутствии файла в стволе, а не на состоянии ветки, и
    отсутствие я перемерил отдельно. Записано, потому что это ровно тот разбор, который
    отличает устаревшее утверждение от неверного.

cycle:
  round: 5
  previous_blocking_genera:
    round_1: [производитель клетки, полнота ведомости дельты]
    round_2: [арифметика границы частоты]
    round_3: []
    round_4: [CONVENTION, PRODUCER, CONVENTION, TWIN]
  repeat_of_previous_genus: false
  blocking_this_round: 0
  signal_to_dispatcher: >-
    Рода, отвергающего работу дважды, В БЛОКИРУЮЩИХ НЕТ — блокирующих ноль, поэтому форму
    задания автору менять не требуется. Но диспетчеру говорю прямо то, что он просил
    сказать прямо: род CONVENTION на этом документе стоял бы ТРЕТЬИМ, если бы Н5-1 (пять
    остаточных ярлыков «редакция 5») был поднят до блокирующего. Я его до блокирующего не
    поднял — основания в non_blocking.Н5-1.why_not_blocking, — но сам факт, что класс
    «утверждение документа о себе и о дереве» всплывает четвёртый круг подряд (Б4-1, Б4-3,
    теперь Н5-1, Н5-2), есть сигнал О ФОРМЕ ЗАДАНИЯ, а не о прилежании автора: задание
    круга за кругом называет ПРЕДМЕТЫ («закрой Б4-1»), и автор закрывает их точно, а
    остаточная гигиена собственных утверждений документа предметом задания не становится
    ни разу. Если диспетчер хочет, чтобы она перестала всплывать, в форму задания автору
    стоит внести ПОСТОЯННЫЙ шаг: «перед сдачей прогнать предикаты, которые документ
    объявляет о самом себе, и приложить их вывод» — тот же приём, которым документ уже
    держит §5 (предикат меток) и §3 (контроль множествами). Это заказ диспетчеру, а не
    автору: форму задания меняет он.
  note: >-
    Ни один блокирующий прежних кругов не воспроизвёлся. Все четыре круга 4 закрыты ПО
    СУЩЕСТВУ, а не наличием правки: по каждому названо, что именно проверялось и как
    (round4_blocking_recheck), и по Б4-2 поставлен настоящий разрушающий опыт с числом.
