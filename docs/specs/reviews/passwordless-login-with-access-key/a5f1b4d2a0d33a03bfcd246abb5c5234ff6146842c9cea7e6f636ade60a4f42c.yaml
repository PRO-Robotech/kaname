label_reconciliation:
  decision: Ярлык редакции — 6, а не 5
  judged_as: решение, и решение ПРИНИМАЕТСЯ
  why_sound: >-
    Основание автора верно и есть ТО ЖЕ правило, что «отпечаток без ревизии — неполное
    утверждение»: судимый текст нёс ДВА ярлыка (тело — «редакция 4», 30 вхождений; несущий
    коммит `b0e25c52` — «редакция 5»), а ярлык «редакция 4» сверх того носил и другой текст
    (`3f4ee3b1…`). Назвать этот текст «5» значило бы дать одному ярлыку два разных
    содержимых — ровно дефект Н4-1 круга 4, воспроизведённый. Примирение ВПЕРЁД, без
    переименования задним числом, сохраняет записи кругов 1…4 нетронутыми (перемерено:
    `git diff --name-only 2758124e 61094230 -- docs/specs/reviews/` → 0 путей) и оставляет
    однозначным именем содержимого ОТПЕЧАТОК, а не ярлык. Примирение вписано ВРЕЗКОЙ в
    шапку (:34–45), и врезка называет цену альтернативы.
  execution_incomplete: >-
    ИСПОЛНЕНИЕ решения неполно, и это единственная новая находка круга — вынесена в
    важные, не в блокирующие (Н5-1). Перемер: вхождений «редакци* 6» — 35 (на 34 строках);
    вхождений «редакци* 5» — 7, из них ДВА законны (врезка :38–39 пересказывает, как
    прежний текст был назван коммитом), а ПЯТЬ называют ЭТОТ текст старым ярлыком:
    :1260 (§3 Д10 «исход РЕДАКЦИЕЙ 5 ИЗМЕНЁН»), :1394 (§4.5 «Редакция 5 закрывает четыре
    блокирующих круга 4» — под заголовком «ВНЕ ОБЪЁМА редакции 6»), :1413 («Редакция 5
    добавила к этому перечню исключений четвёртое и пятое» — и в ТОЙ ЖЕ фразе далее «оба
    потому, что редакция 6 сама ссылается»), :1474 (комментарий предиката §5 «Редакция 5
    завела Ф13-33»), :2365 («Редакция 5 дала этому решению ДЕРЖАТЕЛЯ»).
    Из этого — одно ПРЯМОЕ саморасхождение: :1474 «Ф13-33 завела редакция 5» против :2110
    «Ф13-33 — редакцией 6». И одно утверждение врезки, опровергаемое однострочным
    предикатом: :43–44 «его тело и его коммит называют его ОДИНАКОВО».

holder_requirement_is_honest:
  decision: Держатель ТРЕБУЕТСЯ, а не наследуется
  judged_as: решение, и решение ПРИНИМАЕТСЯ
  verdict_on_honesty: ЧЕСТНО ЗАПИСАНО — требуемое заданием стоит в документе, а не подразумевается
  what_the_document_says: >-
    Р3 (:838–845): «заготовка написана ВНЕ ствола — на `origin/main` (`cbbac984`) и на
    несущей `2758124e` файла по этой координате НЕТ (`git cat-file -e <ревизия>:<путь>` →
    нет)»; «поэтому приёмка держателя ТРЕБУЕТ, а не наследует: он едет вместе с рукояткой,
    тем же исполнителем и тем же изменением (§9 п. 1), до его посадки Ф13-33 —
    «не выполнилось» (§4.3, §8)». Та же строка стоит в §4.3 (:1371) третьей колонкой —
    «Ф13-33 (P) — «не выполнилось»: обходить нечего, и гейт обязан ответить «предмета нет»,
    а не «ноль находок»» — и в §8 (:2252), и в §9 п. 3 порядком первых красных.
  remeasured_by_me: >-
    `git cat-file -e cbbac984:internal/apps/kaname/api/access_keys/ceremony_handle_gate_test.go`
    → нет; то же на `2758124e`; то же на несущей `61094230`. Отсутствие в стволе и на
    несущей ревизии ПОДТВЕРЖДЕНО тремя замерами.
  branch_publication_aged_within_the_day: >-
    Одно утверждение документа УСТАРЕЛО за часы, и задание это предсказало. Документ
    (:841–842): «на день редакции 6 перепись `git branch -r --contains <её голова>` ПУСТА —
    на origin ветка не опубликована». Мой замер (тот же день, 2026-09-22):
    `git branch -r --contains bd10ba67` → `origin/fix/access-key-irreversible-facts`;
    `git ls-remote --heads origin refs/heads/fix/access-key-irreversible-facts` →
    `bd10ba67c1bcfa51390016506ce8da933ad46a7e`. Ветка ОПУБЛИКОВАНА.
    НЕ БЛОКИРУЮЩЕЕ и даже не важное, по трём причинам, и все три проверены:
    (1) утверждение ВРЕМЕННО́Е по форме («на день редакции 6») и несёт ПРЕДИКАТ, а не
    голый факт — то есть написано ровно так, чтобы устаревание было обнаружимо одной
    командой; это и есть требуемая форма, а не её нарушение;
    (2) ВЫВОД, который на нём стоит, от него НЕ ЗАВИСИТ: «приёмка держателя требует, а не
    наследует» опирается на отсутствие файла по координате в СТВОЛЕ и на несущей ревизии —
    а это отсутствие мной перемерено и ДЕРЖИТСЯ на всех трёх ревизиях;
    (3) сдвиг произошёл в сторону, УКРЕПЛЯЮЩУЮ документ: держатель стал достижим, и именно
    поэтому я смог поставить разрушающую проверку Б4-2 настоящим прогоном, а не чтением.

