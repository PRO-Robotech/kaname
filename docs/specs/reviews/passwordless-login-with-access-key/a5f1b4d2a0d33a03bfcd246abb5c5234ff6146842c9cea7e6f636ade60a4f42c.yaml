# ─── ВАЖНЫЕ, НЕ БЛОКИРУЮЩИЕ ─────────────────────────────────────────────────
non_blocking:
  - id: Н5-1
    genus: CONVENTION
    title: >-
      Решение о ярлыке исполнено не до конца: ПЯТЬ мест тела называют этот текст
      «редакция 5», одно из них прямо противоречит соседнему месту о том же предмете, и
      врезка утверждает о теле то, что однострочный предикат опровергает
    sections: ["шапка врезка :43–44", "§3 Д10 :1260", "§4.5 :1394", "§4.4 хвост :1413", "§5 комментарий предиката :1474", "§11 п. 1 :2365", "§6 :2110"]
    predicate: >-
      `grep -oiE 'редакци[а-я]* +\*{0,2}5\*{0,2}\b' <файл> | wc -l` → 7; из них законны два
      (:38, :39 — пересказ того, как несущий коммит назвал ПРЕЖНИЙ текст). Пять остальных
      называют ЭТОТ текст. Саморасхождение: :1474 «Редакция 5 завела Ф13-33» против :2110
      «Ф13-33 — редакцией 6». Утверждение врезки :43–44 «его тело и его коммит называют его
      ОДИНАКОВО» опровергается той же командой. Контроль в обратную сторону: «редакци* 6» —
      35 вхождений, то есть форма в документе применяется и применена в подавляющем
      большинстве мест; предикат ловит именно остаток, а не отсутствие работы.
    revision: kaname@61094230
    why_not_blocking: >-
      Назвал НЕ блокирующим по трём проверенным основаниям, и основания названы, чтобы
      следующий круг не искал их заново.
      (1) Класс тот же, что круг 4 сам вынес в важные (Н4-1), проверив существо. Существо
      проверено и здесь — и оно верно: перечень §4.5 «вне объёма» прогнан мной посценарным
      сравнением с предшественником и СОШЁЛСЯ (5 изменённых, 1 заведённый, 0 снятых).
      Поднимать класс до блокирующего после того, как автор исполнил заказанное, значило бы
      двигать планку кругом позже.
      (2) Там, где идентичность содержимого НЕСУЩАЯ, документ называет пару «отпечаток ·
      ревизия», и все четыре такие пары я перемерил — сходятся. Читателя, которого ярлык мог
      бы ввести в заблуждение о СОДЕРЖИМОМ, не существует: ярлык объявлен неоднозначным
      самим документом, и рядом с ним в несущих местах стоит отпечаток.
      (3) Ни одно решение, ни один сценарий, ни один производитель, ни одна пара, ни один
      пункт DoD от ярлыка не зависит. Контракт исполним как есть.
      Против этого стоит одно отягчающее, и оно названо честно: врезка, написанная ЗАТЕМ,
      чтобы закрыть двусмысленность ярлыка, сама делает о теле утверждение, которое телом
      не подтверждается. Это ровно класс «два места об одном предмете, где одно верно».
      Взвешено — и перевесило то, что предмет расхождения есть ЯРЛЫК, который документ сам
      объявляет не именем содержимого.
    outcomes: >-
      Привести пять мест к ярлыку «6» (или снять ярлык там, где он не нужен, оставив
      отпечаток с ревизией), и после этого утверждение врезки :43–44 станет верным. Правка
      механическая, предикат снятия — команда выше, ожидаемый вывод — 2.
  - id: Н5-2
    genus: FORMAT
    title: >-
      §4.4 сохраняет исторический заголовок «ВНЕ ОБЪЁМА редакции 4», а §4.5 — «редакции 6»;
      два раздела об одном роде предмета читаются как один, и §4.4 при этом ПРАВИЛСЯ
    detail: >-
      §4.4 (:1374) — перечень «вне объёма» РЕДАКЦИИ 4, сохранённый исторически, и это
      законно. Но его хвост (:1413) дописан ЭТОЙ редакцией («добавила к этому перечню
      исключений четвёртое и пятое»), а строка про Р11 (:1371 в §4.4) несёт НОВЫЙ предикат
      снятия, заведённый по Н4-2 круга 4. То есть исторический раздел содержит свежую
      работу, и различить, что в нём от редакции 4, а что от редакции 6, можно только
      чтением. Не блокирующее: обе дописки верны по существу (предикат снятия Р11 назван
      полностью — что прогнать, какой вывод считать разрешающим, и КТО заметит: исполнитель
      §9 п. 1, строка DoD Ф7 §9.1 п. 6), и §4.5 перечисляет своё. Просьба на будущее: если
      исторический раздел дописывается, помечать дописку её редакцией с отпечатком — тем же
      правилом, которое документ вводит врезкой.
  - id: Н5-3
    genus: COVERAGE
    title: Проверено по заданию и дыры НЕТ — числа §1.1/§1.2 честны тем, что называют ревизию
    detail: >-
      Записано затем, чтобы следующий круг не искал эту дыру заново. Сплошной перемер
      §1.1/§1.2 этой редакцией НЕ производился, и документ говорит это сам (§4.5 хвост),
      называя исключения поимённо: предикат о `user.id` соседки, ∅1/∅2 (закрыты), ∅4
      (держится). Точечные перемеры, которые документ объявляет, я прогнал и они СОШЛИСЬ:
      `git show 2758124e:internal/handler/loginlanehttp/handler.go | grep -c 'access-key'`
      → 0 (то же на `cbbac984` и `61094230` — ∅4 держится, и на нём стоит весь предмет
      приёмки); `git show 2758124e:internal/domain/human_session.go | grep -cE 'FormKind = "'`
      → 8; Р15-предикат о колонках соседки → 2 на `2758124e` и 0 на `cbbac984` (то есть он
      различает редакции, а не тождественно истинен). Числа, снятые редакциями 2 и 3 на
      ревизиях `af0ca8f3` · `6acf8f19` · `94352d9c` · `bbd25128`, мной не переснимались —
      названо в limits.

