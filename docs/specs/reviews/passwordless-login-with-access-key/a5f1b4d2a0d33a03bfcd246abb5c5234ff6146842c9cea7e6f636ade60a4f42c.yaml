      вне консоли получит 403 на ВТОРОМ запросе и примет отказ формы за отказ ключа»;
      «закрытый перечень видов Ф3 растёт на ДВА»); и ОТВЕРГНУТЫЙ ИСХОД дословно
      («Отвергнуто: ОДИН вид `access-key-login` на оба глагола… стояло УМОЛЧАНИЕМ… цена
      отвергнутого: предикат Ф3 Р12 на этой полосе не сужал бы НИЧЕГО»). Прежний текст
      исхода §3 Д10 сохранён дословно рядом с новым — правка не читается переписыванием
      истории.
    twin_singlefactness_verified: >-
      ОБЕ пары перемерены чтением, потому что род TWIN на этом документе уже срабатывал.
      Ф13-26 (:1931–1952): «Дано» несёт ОДИН контекст `K1` и под ним ДВА признака —
