  Главная посылка задания — «четыре блокирующих круга 4 закрыты и новых не заведено» —
  ПОДТВЕРЖДЕНА по первой половине полностью и по второй с одной оговоркой, вынесенной в
  важные, а не в блокирующие (Н5-1 ниже).
  (1) «Круг 4 дал ⛔ с четырьмя блокирующими, роды CONVENTION · PRODUCER · CONVENTION ·
  TWIN» — ПОДТВЕРЖДЕНА: `grep -c '^  - id: Б4-' <запись круга 4>` → 4; роды в порядке
  записи — CONVENTION (Б4-1) · PRODUCER (Б4-2) · CONVENTION (Б4-3) · TWIN (Б4-4).
  (2) «Номер круга 5, прежних записей четыре» — ПОДТВЕРЖДЕНА ПЕРЕПИСЬЮ, а не заданием:
  `ls docs/specs/reviews/passwordless-login-with-access-key/` → 4 записи (`449a08dd…`
  round 1 CHANGES_REQUESTED · `305f0777…` round 2 CHANGES_REQUESTED · `83347069…` round 3
  APPROVED, issued true, ban1_lifted true · `a04ee48c…` round 4 CHANGES_REQUESTED).
  Отсюда круг — ПЯТЫЙ.
  (3) «Ветка `fix/access-key-irreversible-facts` @`bd10ba67` на origin не опубликована;
  отправка идёт прямо сейчас — перемерь» — ОПРОВЕРГНУТА НА МОМЕНТ МОЕГО ЗАМЕРА, и задание
  это предсказало: `git branch -r --contains bd10ba67` →
  `origin/fix/access-key-irreversible-facts`; `git ls-remote --heads origin
  refs/heads/fix/access-key-irreversible-facts` → `bd10ba67c1bcfa51390016506ce8da933ad46a7e`.
  Ветка ОПУБЛИКОВАНА. Что из этого следует для вердикта — ничего: вывод документа
  («приёмка держателя ТРЕБУЕТ, а не наследует») стоит не на неопубликованности ветки, а на
  отсутствии файла по координате в СТВОЛЕ и на несущей ревизии, и это отсутствие
  перемерено мной и держится (см. holder_requirement_is_honest).
  (4) «Конструируемости «Дано» посевом не требовать — таблицы ключей на посадке нет» —
  ПРИНЯТА как граница задания и не оспаривается: это третья категория, документ
  предсказывает её сам (§4.3, §8), чинится посевом на стенде — чужой момент.

