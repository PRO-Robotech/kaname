# ─── БЛОКИРУЮЩИЕ КРУГА 2 ─────────────────────────────────────────────────────
blocking:
  - id: Б3
    title: >-
      Ф13-32 (держатель обнуления счёта по адресу, заведён этой редакцией): близнец (б) утверждает
      429 на N-й неверной попытке, тогда как Ф3-28 и собственный Ф13-04 этого документа дают 429 на
      N+1-й — на верной реализации близнец красный; ветвь (а) утверждает «ни одного 429», не
      ограничив в «Дано» величину `N_источник`, хотя те же попытки считаются и по источнику
    sections: [Ф13-32 (:1075–1089), §7 инв. 10, §8 строка «Ф13-32 счёт по адресу», §9 п. 3, Р9 (:657–658), §6 строка Ф13-32]
    predicate: >-
      Ф3-28 (login-lane-… :1877–1881, 1a7f6846): «N неверных попыток по A, затем N + 1-я … N + 1-я
      по каждому — 429» — N-я попытка проходит как 401. Ф13-04 (:1066–1070) читает ту же арифметику
      верно: «`N_источник − 1` уже; ещё один — 200 (граница включена); второй — 429». Ф13-32 «Дано»
      (:1078): «`N_адрес − 1` неверных … уже предъявлено (Ф3-28 — на границе)» — N−1 не граница;
      «Когда»/«Тогда» (б) (:1080, :1083): «ещё один неверный пароль → 429 TOO_MANY_ATTEMPTS
      (Ф3-28)» — это N-я попытка, по Ф3-28 она 401; 429 придёт на следующей. Контроль в обратную
      сторону: при «Дано» `N_адрес` неверных (граница включена) (б) даёт 429 и (а) остаётся
      различающим. Вторая половина: Ф3 Р10 (:886 «попыткой не считается … успешный вход обнуляет
      счёт по адресу») считает неверный пароль И по адресу, И по источнику; в (а) один источник
      делает `2·(N_адрес − 1)` неверных плюс `begin` и `login` — при `N_источник ≤ 2·N_адрес` часть
      получит 429 ПО ИСТОЧНИКУ на верной реализации, а «Тогда» (а) говорит «ни одного 429» без
      оговорки; последнее «И» самого сценария это подтверждает («посчитаны попытками источника»).
    revision: kaname@56801a87 (документ); Ф3 на 1a7f6846
    why_blocking: >-
      Это класс, за который линия платила трижды и который §1 документа объявляет входом работы:
      «Тогда», которого продукт не производит. Сценарий стоит в DoD Ф13 (§6: «в DoD — Ф13»; §9
      п. 3: «все 32 существуют красными прежде кода») и в §7 инв. 10; интеграционная проба по нему
      (§8) на верной реализации красна в (б) навсегда либо «чинится» ослаблением утверждения —
      ровно то, что `testing.md` §E2E запрещает. Одобрить значило бы ратифицировать противоречие
      двух документов одного дома (Ф3-28 против Ф13-32) и внутреннее (Ф13-04 против Ф13-32). Что
      сценарий держит — обнуление счёта по адресу входом ключом (Р9, Н5 круга 1) — верно и
      нужно; неверна арифметика границы, а не решение.
    consequence_for_decisions: >-
      Р9 не меняется. Меняется «Дано» и «Тогда» одного сценария: либо «`N_адрес` неверных уже
      предъявлено (граница включена: N-я — 401, Ф3-28)», тогда (а) — вход, затем `N_адрес − 1`
      неверных → все 401; (б) — ещё одна → 429; либо оставить `N_адрес − 1` и в (б) писать «ещё
      две: первая — 401, вторая — 429». И в «Дано» — `N_источник > 2·N_адрес + 2` (либо неверные
      пароли ветви (а) с другого источника, чем `begin`/`login`), чтобы «ни одного 429» было
      утверждением о счёте по адресу, а не о величине профиля. Заодно — п. Н11: (а) различает
      реализации только при `N_адрес ≥ 3`, и это стоит назвать в «Дано».
    outcomes: >-
      Поправить Ф13-32 «Дано», «Когда» (б) и «Тогда» (а)/(б) под Ф3-28 и Ф3 Р10; сверить §8
      строку «Ф13-32» («`N_адрес`-й неверный после входа даёт 429: красный» — при исправленном
      «Дано» это верно) и Р9 (:657–658 — не меняется). Число сценариев (32), метки §5 и ведомость
      §6 не меняются.

# ─── НЕ БЛОКИРУЮЩИЕ ─────────────────────────────────────────────────────────
non_blocking:
  - id: Н11
    where: Ф13-32 «Дано»/«Тогда» (а)
    what: >-
      Ветвь (а) отличает «обнуляет» от «не обнуляет» только при `N_адрес ≥ 3`: без обнуления
      после `N − 1` первая из `N − 1` дополнительных — N-я — тоже 401, и лишь вторая — 429; при
      `N_адрес = 2` обе реализации дают одинаковый исход. Назвать `N_адрес ≥ 3` в «Дано» (или
      строить «Дано» на `N_адрес`, и тогда достаточно `N_адрес ≥ 2`).
  - id: Н12
    where: Р15, таблица «что дописывать у Ф7», строка «Ф7-25 — перечень ключей»
    what: >-
      Перечень ключей — не «Тогда» Ф7-25 (там: «утверждение снятым ключом перестаёт проходить»);
      о перечне говорят Ф7 §3.0 («перечень ключей после отказа тот же») и Р11 (глагол перечня).
      Довод строки верен, координата — соседняя. Писать «Ф7 Р11 / §3.0 — перечень ключей».
  - id: Н13
    where: Р1 (:432–433 «страница арендатора (§4.1 п. 14) перечисляет, какие поля снять перед отправкой»), §4.1 п. 14
    what: >-
      §4.1 п. 14 говорит «дополнить существующую страницу входа» и не называет перечня полей;
      обещание Р1 о содержании страницы носителя в DoD не имеет. Добавить в п. 14: «в том числе —
      какие поля ответа браузера (`clientExtensionResults`, `authenticatorAttachment`) снять» —
      иначе цена Н10 названа в Р1 и не доедет до страницы.
  - id: Н14
    where: шапка («Линия … заведена заново на bbd25128 и остаётся базой PR»), §0.4 вторая строка
    what: >-
      На момент круга 2 голова линии — 1f51668f (слияние `origin/main` в линию), дерево
      побайтово равно 94352d9c/bbd25128; merge-base ветки 6acf8f19, PR #219 base=release/iam-lines
      — всё верно по содержимому, устарела ссылка. Не находка о документе (он мерил свою
      ревизию и назвал её); в редакции 3 перемерить строку одной командой, как документ и велит.
  - id: Н15
    where: §3 сводка, контроль «голое `DoD` считало бы и Д17»
    what: >-
      Утверждение верно (Д17 несёт «в DoD Ф13»), но число при этом совпадает: голое `DoD` даёт
      Д17+Д28+Д30 = 3, а `Ф7-21|Ф7-24|DoD Ф7` даёт Д28+Д29+Д30 = 3 — контроль по числу не
      различает. Назвать в контроле множества («{Д17, Д28, Д30} против {Д28, Д29, Д30}»), а не
      величину.
  - id: Н16
    where: Ф13-30 второе «И» («обе ветви прогнаны, клетка +2, других клеток «единого отказа» прогон не тронул»)
    what: >-
      «Дано» Ф13-30 — прогоны Ф13-06 «каждая ветвь», и тогда другие клетки тронуты by
      construction; фраза читается о паре (б)+(к), но подлежащее — «прогон». Написать «прогон
      пары (б), (к) — клетка +2, прочих клеток эта пара не тронула».

