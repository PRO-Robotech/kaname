    sections: [Ф13-06 («к» — «строка снята, аутентификатор её ещё держит»), Ф13-30 («единый отказ» по причине: … удостоверение неизвестно … ключ снят), Р10 (перечень причин), Ф13-21 («утверждение ключом A — единый отказ входа (Ф13-06 «к»)»), §7 инв. 1, §7 инв. 13]
