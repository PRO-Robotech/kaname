decisions:
  Р1:
    verdict: ПРИНИМАЮ (с Н10)
    basis: >-
      Ф3 Р2 дословно: семейство `/iam/v1/auth/*`, ретрансляция краем, «текст отказа входа —
      один на все причины»; Ф12 Р4 тем же доводом положила шесть глаголов сюда же. «Глагол
      формы, не RPC» — подтверждено деревом: у семи путей `loginlanehttp` нет дескриптора
      контракта (§1.1 ∅4), перепись публичных RPC их не видит by construction; Ф7 Р11
      действительно ждала причины освобождения у «своего глагола» и сама оговорила, что не
      обязывает Ф13 брать ту же — Д1 интерпретация верна. Два глагола вместо одного —
      норма требует свежего испытания до подписи; довод против испытания без состояния
      (однократность Ф13-08) принимаю.
  Р2:
    verdict: ПРИНИМАЮ
    basis: >-
      `allowCredentials: []` — единственная форма, при которой Ф7 Р9 «обнаруживаемое
      удостоверение требуется» имеет читателя; identifier-first отвергнут оракулом адреса
      (Ф1 §7 инв. 3) — довод из дерева, не из вкуса. Привязка к контексту формы —
      единственное состояние анонимного вызывающего (Ф3 Р12). Срок — тот же литерал, что у
      Ф7 (Ф7-54 «И»: «срок — та же величина контракта … литерал один»). «preferred» — Ф7 Р9
      строка «проверка пользователя при предъявлении — предпочтительна».
  Р3:
    verdict: ПРИНИМАЮ (с Б2 — ведомость)
    basis: >-
      Ф7 значения `user.id` не называет: `grep -ci 'userhandle\|user\.id'` по Ф7 → 0 —
      перемерено. Правило возврата колонки Ф7 Р1 писано о признаке резервного копирования,
      Ф7 Р9 — об обнаруживаемости; применение его к рукоятке — интерпретация по аналогии, и
      документ называет это словом «дописано» (Д2) — принимаю. Платформенный `id` как
      рукоятка: неизменяем (ban #15), без личных данных, ≤ 64 байт; одна рукоятка на все
      ключи человека — то, что аутентификатор считает «одной учёткой», и это стандартное
      поведение, а не побочный эффект; альтернатива §11 п. 1 (случайная на ключ) дала бы
      человеку несколько записей одной учётки в выборе аутентификатора — не отвергаю за
      автора, довод в пользу решённого назван. Сверка рукоятки «сверить нечего — отказ»
      (Ф13-24) — правильный исход «принято-и-проигнорировано».
  Р4:
    verdict: ПРИНИМАЮ
    basis: >-
      Ф-а один (IssueSession — 1·3 вызывающих), `KeyAssertion(userVerified, backupEligible)`
      существует с той же сигнатурой (level.go:174), правило «2»/«3» — строки 222–224;
      Ф13-10…12 = Ф11-03…05 сверены построчно (Ф11 :825–827); граница «нули → «2»» —
      level.go:172–173 и Ф11 Р3. Отказ от колонки флагов в записи — верно по Ф11 Р1 (копия
      читает запись); Ф13-13 — держатель, производитель `kaname#208` — верно.
  Р5:
    verdict: ПРИНИМАЮ
    basis: >-
      Обе стороны оси названы и наблюдаемы: Ф13-15 (не требуется), Ф13-16 (не принимается —
      с проверкой «код не потреблён»), Ф13-17 (внутри сессии проходит, уровень прежний по
      монотонности Ф11 Р2 — «наивысшая строка»), близнец Ф12-14 с другой стороны. Довод
      «два правила об одном поле» против `secondFactor` у входа ключом — точный. Обратное
      направление (ключ как второй фактор) отдано Ф7/Ф12 — Ф12 §0.2 :146 и §4.2 :943
      подтверждают.
  Р6:
    verdict: ПРИНИМАЮ
    basis: >-
      «Откат — свойство двух независимых полос, не глагол» — согласовано с Ф12 Р3
      (обязательность действием) и Ф7-24 (людей без пароля источник несёт). Ф13-18
      наблюдает обе половины; отрицательные контроли названы.
  Р7:
    verdict: ПРИНИМАЮ
    basis: >-
      Ф3-02 случай C («личность без строки способа входа») — есть (:1409, преамбула
      случаев); текст `authentication failed` — константа `TextAuthenticationFailed`
      (refusals.go:20); предикат §5 даёт семь меток, как объявлено; Ф1-48…50 — критерий
      времени, Ф1-51 — форма измерительной пробы.
  Р8:
    verdict: ПРИНИМАЮ (с Б1 — состояние снятого ключа; Н4 — нумерация)
    basis: >-
      Образец Ф12 Р9 дословно (гасит ПРОЧИЕ, текущей уровня не понижает); пол `Revoke` «1» и
      окно свежести Р5 делают «Дано» Ф13-21 строимым из сессии паролем — Ф7 Р11 таблица;
      цена (сессия телефона при снятии ключа ноутбука) названа; отвергнутые исходы — с
      доводом из состава записи Ф3 Р1. Дописка к Ф7-25 (Д3) — верно названа.
  Р9:
    verdict: ПРИНИМАЮ (с Н5)
    basis: >-
      Ф3 Р10 — два счёта; у полосы без имени адреса нет — источник единственный; `begin`
      как попытка — довод о росте хранилища верен (контекст чеканится на запрос);
      арифметика границы Ф13-04 согласована с Ф3-29 (N+1-я — 429). Ручек не добавлено —
      Ф7 Р2 три, Ф3 Р3/Р10 — согласовано.
  Р10:
    verdict: ПРИНИМАЮ (с Б1)
    basis: >-
      Событие то же (`AuditSessionIssued`, issue.go — 2), поле `access_key_id` формы `ak-…`
      (Ф7 Р10 — адрес наружу), идентификатор удостоверения не выходит; держатель
      `TestAuditPayloadCarriesNoPersonalData` существует (audit_payload_pii_test.go:41).
      Перечень причин в клетках — Б1 по одной клетке.
  Р11:
    verdict: ПРИНИМАЮ (с Б2 — ведомость)
    basis: >-
      Различение «не обнаруживаемое — нам не наблюдаемо» и «без рукоятки — наблюдаемо»
      верно: Ф7-21 печатает обнаруживаемость «не установлено» отдельной строкой; второй
      формы входа нет — Р2. Чтение переписи по паре «с рукояткой · без» — правка Ф7-21,
      подлежит ведомости.
  Р12:
    verdict: ПРИНИМАЮ
    basis: >-
      Три шага перемерены: Ф7-26 держит «не запирает»; путь объявлен Ф5 Р6 (таблица двух
      путей — :) и F4d Р4; производителей нет — `recovery_complete.go` :218–226 (отказ при
      `!replaced`, откат), `writeError` default → 503; `#2698` OPEN с двумя исходами в теле,
      `#2702` OPEN. Разведение «Ф13 требует — владелец решает» честное; довод к ветви
      «заводит» назван как довод, не как решение. Ф13-25 — «условие не создано», третья
      категория, в DoD не вычитается — верно по `change-graph.md` §5.
  Р13:
    verdict: ПРИНИМАЮ
    basis: >-
