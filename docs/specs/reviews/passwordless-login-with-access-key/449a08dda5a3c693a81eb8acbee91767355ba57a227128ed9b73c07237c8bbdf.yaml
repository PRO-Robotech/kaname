      ДОПИСКА к составу строки Ф7 Р1 (восемь величин) и к перечню Ф7-25/Ф7-27 (снятый ключ
      в перечне не показывается; отказ Ф7-27 остаётся побайтово равным), и её нет ни в §3,
      ни в §0.2 «два места, где Ф13 дописывает». Документ при этом объявляет: «Ф13
      добавляет к сверке ровно две вещи» (Р13) и «состав … не расширяется» (Д13) — третье
      требование к хранению Ф7 названо не как решение, а как факт в «Когда».
    consequence_for_decisions: >-
      Р10 и Р13 остаются верными по существу; меняется одно: либо перечень причин в
      счётчике сжимается («удостоверение неизвестно ЛИБО снято» — одна клетка, и Ф13-06 «к»
      теряет слово «строка»), либо заводится решение Р15 «снятый ключ остаётся строкой с
      отметкой снятия ради клетки и ради Ф13-21» с записью «дописано» в §3 и с ценой (Ф7-25
      перечень, Ф7-27 равенство, уборка отметок).
    outcomes: >-
      Выбрать один из двух исходов и назвать его решением; поправить Ф13-06 «к» (устройство
      — вон из «Когда»: «ключ снят глаголом Ф7-25»), Ф13-30 и Р10 под выбранное; при втором
      исходе — строка §3 «дописано», §0.2 «три места», §9 п. 1 (что заводит исполнитель Ф7).
  - id: Б2
    title: >-
      Ведомость дельты к Ф7 неполна: Р3, Р11, Ф13-24 и §9 п. 1 ДОПИСЫВАЮТ к «Тогда» Ф7-21
      (перепись печатает пару «с рукояткой · без»), РАСШИРЯЮТ число Ф7-24 (люди с
      переносимым ключом без рукоятки — «в числе Ф7-24 с уточнением») и правят DoD Ф7
      («п. о переносе получает чтение величины»), а §0.2 говорит «два места, где Ф13
      дописывает», §3 сводка — «дописано — 4 (Д2, Д3, Д12, Д14)», и ни одна из этих трёх
      дописок строкой §3 не названа
    sections: [§0.2 (:158–162), §3 сводка (:771–773), Р3 (:463–470), Р11 таблица (:641), Ф13-24 (P) и второе «И», §9 п. 1, §6.1 строка «обнаруживаемость перенесённых ключей — никому»]
    predicate: >-
      `grep -n 'добавляет к DoD Ф7\|DoD Ф7 п. о переносе\|в числе Ф7-24 с уточнением' <док>`
      → :465, :1553, :1257 — три утверждения о правке одобренного соседа;
      `grep -nE '^\| \*\*Д[0-9]+\*\*' <док> | grep -c 'Ф7-21\|Ф7-24\|DoD Ф7'` → 0 — ни одна
      строка ведомости их не несёт. Контроль: Д2 (:745) несёт колонку, писателей и сценарий
      расхождения — и ни слова о переписи; Д3 (:746) — про Ф7-25. В Ф7: Ф7-21 «Тогда» —
      закрытый перечень печатаемого (объём · алгоритмы · наибольшее число · обнаруживаемость
      «не установлено» · столбец меток), рукоятки в нём нет; Ф7-24 считает людей, чей
      единственный ключ НЕПЕРЕНОСИМ по Ф7-22, — ключ без рукоятки по Ф7-22 переносим.
    revision: kaname@79cbd628 (документ); Ф7 на 12e9608d
    why_blocking: >-
      §0.2 обещает владельцу, что все места, где Ф13 дописывает к глаголам соседей,
      «названы с доводом и ценой и видны владельцу в событии одобрения этого документа».
      Ведомость §3 — то, что владелец ратифицирует; три правки одобренной Ф7 стоят вне неё,
      значит одобрение Ф13 покрыло бы меньше, чем Ф13 меняет, — и правка Ф7-21 (перепись
      ДО переноса, необратимого действия) при этом исполнялась бы «по этой приёмке» (§9 п. 1)
      без строки, по которой её можно найти. Это та же норма, что документ сам применяет к
      Ф7 §4.4 («один предмет жил в трёх таблицах, и правка одной оставила бы две расходиться
      молча»).
    consequence_for_decisions: >-
      Р3 и Р11 по существу принимаются (см. decisions); меняется ведомость, а не решения:
      три строки §3 с исходом «дописано» (Ф7-21 — величина переписи; Ф7-24 — уточнение
      счёта; DoD Ф7 — чтение величины), сводка «дописано — 7», §0.2 — перечень мест целиком.
    outcomes: >-
      Добавить Д27…Д29 (или расширить Д2 явным перечнем трёх дописок с их ценой), поправить
      сводку и предикат §3, поправить §0.2; в §6.1 строку «обнаруживаемость перенесённых
      ключей — никому» дополнить: «рукоятка — Ф13 читает переписью Ф7-21, дописано».

