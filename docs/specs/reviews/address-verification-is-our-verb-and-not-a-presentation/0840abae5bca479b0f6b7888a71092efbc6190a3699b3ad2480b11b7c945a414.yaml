blocking:
  count: 1
  genera: [CONVENTION]
  repeated_genus_warning: >-
    ТРЕТЬЕГО ПОВТОРА НЕТ — говорю это прямо, потому что вопрос был задан прямо. Роды
    БЛОКИРУЮЩИХ по кругам: круг 1 — DoD, COVERAGE×4, DoD, SCOPE, CONVENTION; круг 2 —
    FORMAT, SCOPE; круг 3 — CONVENTION. Род CONVENTION срабатывает ВТОРОЙ раз, не третий, и
    экземпляр круга 1 (§1.2) ЗАКРЫТ — я его перемерил, он держится. Форма задания менялась
    перед каждым кругом. Признака «род отверг работу дважды без изменения формы задания» здесь
    нет. Но класс у двух экземпляров один, и это стоит сказать диспетчеру: разбор — в
    dispatcher_note ниже.
  items:
    - id: B11
      genus: CONVENTION
      where: '§1.3 целиком; Р17, пятая строка таблицы; §7 инвариант 2а; §9 п. 6'
      new_in_this_round: true
      claim_under_test: >-
        «Числа получены на cbbac984; у каждого предиката прогнан контроль в обратную сторону»
        (§1, врезка) — и шире: §1 есть доказательная база документа, из которой выводится
        контракт нового глагола.
      finding: >-
        §1.3 утверждает о крае то, чего край не делает. Дословно: «Ответ краю — `200` с телом
        `{}` НА ЛЮБОМ ИСХОДЕ (полоса `requestRecovery`)… Различимы полосы ТОЛЬКО клеткой
        счётчика: перечень исходов закрыт и объявлен… (`queued` · `no-row` · `unverified` ·
        `store-failed`)». Измерено: на отказе ЧТЕНИЯ адреса
        `RequestRecoveryUseCase.Execute` возвращает `ErrStoreUnavailable`
        (internal/apps/kaname/api/humansession/recovery_request.go:93-96), край отдаёт его
        ветвью handler.go:885-886 как `503`/`14`. Клетка `store-failed` ставится на ДВУХ
        путях — на пути чтения, где ответ 503, и вне пути ответа, где ответ 200, — то есть
        перечень из четырёх клеток по коду ответа НЕ однороден, и «только клеткой счётчика»
        для него неверно. Собственный комментарий глагола говорит это прямо:
        «Ошибка возвращается ТОЛЬКО на отказ формы и на недоступность хранилища при чтении»
        (recovery_request.go:88-89).
      second_place_about_the_same_subject: >-
        По тому же предмету у продукта есть ВТОРОЕ место, и оно ВЕРНО: опубликованная страница
        линии (`docs/content/api/auth-lane.mdx:189-193`) перечисляет ТРИ исхода — «адреса нет ·
        адрес не подтверждён · код выдан» — и «при любом исходе» относит к ним, не включая
        отказ хранилища. Ложным из двух мест оказалась приёмка.
      why_it_is_not_bookkeeping: >-
        Оно несущее для НОВОГО глагола, а не только для описания соседа. По одной оси документ
        говорит два несовместимых слова: Р17 закрепляет на отказ хранилища `503`/`14`, а §1.3
        (и вслед за ним клетка Р3 «200, тело {} — на любом исходе», взятая у образца «дословно»)
        утверждает `200`. Ни один сценарий §5 эту ось не решает: `503` встречается в документе
        РОВНО ОДИН раз — в таблице Р17 (`grep -n '503' $D` → одна строка, 584). Ни строки
        ведомости §6, ни кейса §9 п. 6, ни якоря в инварианте 2а у него нет: инвариант 2а
        перечисляет ЧЕТЫРЕ якоря (Ф6-07, Ф6-22, Ф6-30, Ф6-31) при ПЯТИ значениях Р17.
        Реализатор обязан выбрать между 200 и 503 на достижимой ветви, а приёмка выбранное не
        подтвердит и не опровергнет — то самое, что Р17 своими словами объявляет недопустимым:
        «выбранное реализацией значение приёмка потом не сможет ни подтвердить, ни опровергнуть».
      why_this_genus: >-
        CONVENTION, а не FORMAT: дефект не в форме «Тогда» (значения как раз названы абсолютно
        и верно), а в том, что §1 — доказательная база — несёт утверждение о дереве, которого
        дерево не подтверждает. Тот же род и тот же класс, что B8 круга 1 (§1.2, «предикат давал
        1, а не 0, и фраза отрицала существующий предмет»). Документ сам записал об этом классе:
        «ложная опора под верным выводом есть тот же класс, что здесь ловится у продукта».
        Разница с B8 в одном и она важна: у §1.2 был ПРЕДИКАТ, и он подвёл; у §1.3 предиката под
        этой фразой НЕТ ВОВСЕ — стоят два grep об условии выбора и о чтении, а утверждение о коде
        ответа не измерено ничем.
      what_to_do: >-
        Три правки, и они об одном. ПЕРВОЕ: исправить §1.3 — сказать, что 200 на любом исходе
        ПОИСКА (адреса нет · не подтверждён · код выдан), а отказ ЧТЕНИЯ выходит `503`/`14`, и
        поставить под фразу предикат (ветвь `ErrStoreUnavailable` в глаголе и ветвь края), как
        стоит под остальными фразами §1. ВТОРОЕ: решить ось для НАШЕГО глагола явно — глотает
        ли запрос отказ чтения в 200 (тогда это РАСХОЖДЕНИЕ с образцом, и его надо назвать
        решением с ценой, потому что «форма взята дословно» перестанет быть правдой) или
        отвечает 503 как сосед (тогда клетка Р3 обязана это сказать). ТРЕТЬЕ: чем бы ни
        кончилось второе — дать оси сценарий с абсолютной парой и строкой ведомости, либо снять
        пятую строку из Р17, сказав, что отказ хранилища семейством полосы не является и
        значение приведено справочно. Сегодня строка стоит как значение контракта, а держателя
        у неё нет.
      what_is_NOT_wrong_here: >-
        Называю прямо, чтобы правка не поехала дальше нужного: ПЯТЬ ЗНАЧЕНИЙ Р17 ВЕРНЫ, все до
        одного, включая `503`/`14` — край именно это и производит. Довод «решение ратифицирует
        то, что край уже производит» подтверждён. Дефект не в значениях, а в том, что по оси
        отказа хранилища документ говорит ещё и второе, несовместимое, слово — и молчит
        сценарием.

non_blocking:
  - id: N4
    genus: TWIN
    where: '§7 инвариант 2 (а), пара Ф6-12 ↔ Ф6-13; §5, «Дано» Ф6-13'
    finding: >-
      Ф6-12 объявляет: «положительный близнец к Ф6-13: у ОБОИХ «Дано» адрес хранится с
      заглавными, различие — сменился он или нет». Но «Дано» Ф6-13 звучит «код выдан Ф6-01», а
      адрес Ф6-01 — `person@example.invalid`, в нижнем регистре. Как написано, пара различается
      ДВУМЯ фактами: регистром хранимого адреса и сменой адреса.
    why_not_blocking: >-
      Оба сценария самостоятельны, у каждого свой производитель и свой наблюдаемый исход, и
      каждый фальсифицируем по отдельности — я посеял оба. Страдает только доказательная сила
      ПАРЫ, а не сами утверждения.
    what_to_do: 'либо «Дано» Ф6-13 сослать на Ф6-12, либо переписать строку близнеца в Ф6-12.'
  - id: N5
    genus: TWIN
    where: '§7 инвариант 2, заключительная фраза «Отрицаний без близнеца — ноль»'
    finding: >-
      Фраза обещает обход: «у каждого сценария, чьё «Тогда» есть отказ или отсутствие, назван
      либо близнец (а, б), либо контроль (г)». Обошёл §5 сам: трёх сценариев нет ни в одном из
      четырёх перечней. Ф6-16 («механизмов, вычисляемых после нашего, НОЛЬ») — перепись,
      дающая ноль, то есть ровно тот вид утверждения, которому контроль нужен больше всех.
      Ф6-05 («ответ не ждёт», «отказ транзакции не оставляет строк») — отрицание без названного
      положительного. Ф6-22 несёт положительный контроль внутри себя («в пределах величины
      верный код принимается»), но не попал ни в (б), ни в (г).
    substance_is_there_bookkeeping_is_not: >-
      Проверил существо, а не только перечень. Держатель Ф6-16 —
      `TestIntegration_AddressVerificationTriggerHasNoLaterNeighbour` — контроль в обратную
      сторону НЕСЁТ, и сильный: `require.NotZero(t, sameKind, "свой триггер обязан найтись в
      переписи — иначе она не читает каталог")`, а затем внесённое различие — созданный сосед
      `zz_lm_probe_rewrite_email`, после которого перепись ОБЯЗАНА назвать его по имени, и
      граница наблюдаема (отметка пережила смену адреса). Прогнал — зелено. Положительный
      близнец Ф6-05 лежит в «Тогда» Ф6-01 (успешный путь оставляет обе строки), но не назван.
      То есть дефект бухгалтерский, а не предметный.
    what_to_do: 'дописать Ф6-16 в (г), Ф6-22 в (б) или (г), Ф6-05 в (а) с указанием на Ф6-01.'
  - id: N6
    genus: FORMAT
    where: 'Р17, шапка таблицы'
    finding: >-
      Шапка «Семейств отказа ТРИ, и вот их значения» стоит над таблицей из ПЯТИ строк, и какая
      строка какому семейству принадлежит, читатель выводит сам. Три семейства — предъявление
      кода, форма (два исхода), частота; пятая строка (отказ хранилища) семейством полосы не
      является вовсе.
    why_not_blocking: 'арифметика восстановима из текста ниже; но она восстановима ЧТЕНИЕМ, а не разметкой.'
    what_to_do: 'разметить строки по семействам — и это часть правки B11, а не отдельная работа.'

scope_and_boundaries:
  verdict: ДЕРЖАТСЯ
  detail: >-
    §3.1 перечисляет восемь предметов объёма, §3.2 — семь строк вне объёма, и у каждой строки
    есть носитель И предикат возврата: последняя строка, которой носителя не хватало, его
    получила (B10 закрыт). Фазы вперёд не разрешены: полосы входа ключом, консоли и отказа на
    действии сценариев здесь нет — проверено обходом §5. Разделение фазы `#1272` на два
    документа объявлено решением Р14 с ценой ВЫБРАННОГО хода, а не отсрочкой.

coverage:
  verdict: ПОЛНОЕ ПО ОБЪЯВЛЕННОМУ ОБЪЁМУ, С ОДНОЙ ДЫРОЙ ПО ОСИ ОТКАЗА ХРАНИЛИЩА (B11)
  producers: 'сценариев 31, производителей названо у 31; сценариев без производителя — НОЛЬ'
  twins: 'отрицаний без положительного близнеца или контроля — НОЛЬ по существу; три не разнесены по перечням (N5)'
  negative_codes: >-
    INVALID_ARGUMENT 400/3 (Ф6-31, с именем поля) · UNAUTHENTICATED 401/16 (Ф6-07…Ф6-10, Ф6-13) ·
    PERMISSION_DENIED 403/7 (Ф6-30) · RESOURCE_EXHAUSTED 429/8 (Ф6-22) · конкурентный конфликт
    (Ф6-08 — один победитель решением оператора базы, не проверкой-перед-применением) ·
    UNAVAILABLE 503/14 — ОБЪЯВЛЕН Р17 И НЕ ПОКРЫТ (B11).
  edge_cases: >-
    граница срока (Ф6-07), однократность (Ф6-08), вытеснение (Ф6-10), регистр в хранимом адресе
    (Ф6-12), смена адреса в обе стороны (Ф6-13…Ф6-15), повтор подтверждения (Ф6-26), нулевая и
    отрицательная величина ручки как «не объявлена» (Ф6-27).
  lifecycle_and_async: >-
    Формы `Operation` здесь НЕТ, и это верно, а не пропуск: предмет — слушатель формы полосы
    входа (13 путей, `h.mux.HandleFunc`), а не ресурсный gRPC-контракт. Асинхронность выражена
    иначе и явно: работа уходит ВНЕ пути ответа диспетчером (Ф6-05), и этого требует Р7, потому
    что иначе полосы разошлись бы по времени.

conventions:
  verdict: ДЕРЖАТСЯ, С ОДНИМ ИСКЛЮЧЕНИЕМ ПО СУЩЕСТВУ (B11)
  checked: |
    ban #2  чужих облаков — 0 (перепись по документу)
    ban #11 отложенной работы — 0 (TODO/FIXME/XXX по документу → 0)
    ban #15 адресация: глагол адресуется адресом человека как ПРЕДМЕТОМ доказательства
            владения, идентификатор ресурса в путь не попадает — конфликта нет
    ban #6  Internal-vs-external: пути публичные НАМЕРЕННО и это несущее свойство (Ф6-02 —
            человек, который войти не может); инфра-чувствительного в ответах нет: тело `{}`
    имена путей: `/iam/v1/auth/verify-email` и `…/confirm` — форма СУЩЕСТВУЮЩЕЙ полосы
            (`/iam/v1/auth/recovery`, `…/recovery/complete`, `…/second-factor/confirm`),
            ратифицирована Р15; свой путь ресурса не заводится
    JSON: camelCase — `csrfToken`, `email`, `code` ✓
    ban #10 within-service инварианты на DB-уровне: срок и однократность — одним оператором,
            вытеснение — там же, гонка со сменой адреса — механизмом схемы; Р10 прямо
            запрещает заводить software-проверку «не переехал ли адрес» ✓
    ban #12 TDD: §8 называет, чем краснеет КАЖДАЯ группа до первой строки кода, и отдельно —
            какие группы зелены сегодня и обязаны остаться зелёными (я их прогнал)

definition_of_done:
  verdict: ИЗМЕРИМО, С ОДНИМ ПУНКТОМ, КОТОРЫЙ ЧИНИТСЯ ВМЕСТЕ С B11
  detail: >-
    Одиннадцать пунктов (1, 1а, 2…10) — у каждого объективное «пройдено / не пройдено», и
    числа проверяемы: 15 путей (13 измерено + 2), 10 видов формы (8 измерено + 2), 1 вызывающий
    у писателя отметки, ноль обратных заполнений, две величины переписи писем по трём. Пункт 8
    честно разделён на 8а (пара полос у прибора) и 8б (прогон — ШАГ СДАЧИ, а не ручка) и прямо
    говорит, что «не выполнилось» зелёным не считается. Пункт 9 снимает врезку страницы линии
    ТЕМ ЖЕ изменением — врезка существует, проверил: `docs/content/api/auth-lane.mdx:204-209`.
