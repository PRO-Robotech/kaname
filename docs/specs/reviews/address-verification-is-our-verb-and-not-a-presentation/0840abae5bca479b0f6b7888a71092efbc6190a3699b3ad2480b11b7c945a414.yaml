dispatcher_note_on_the_genus_class:
  genus: CONVENTION
  rounds: 'круг 1 — B8 (§1.2); круг 3 — B11 (§1.3)'
  task_form_changed_between_rounds: true
  repeat_is_second_not_third: true
  what_this_means: >-
    Признака «род отверг работу дважды БЕЗ изменения формы задания» здесь нет: форма менялась,
    и экземпляр круга 1 закрыт — я его перемерил. Но КЛАСС у двух экземпляров один: §1 несёт
    утверждение о дереве, которого дерево не подтверждает. И у двух экземпляров есть общая
    механика: в §1.2 подвёл предикат, который стоял; в §1.3 предиката под фразой НЕ СТОЯЛО
    ВОВСЕ. Фразы §1 без предиката — это и есть непокрытая полоса.
  what_i_recommend: >-
    Дешёвая правка формы задания, не круг ревью: потребовать, чтобы КАЖДАЯ фраза §1,
    утверждающая что-либо о поведении края, несла под собой предикат и контроль в обратную
    сторону — ровно так, как это уже сделано у фраз о наличии вызывающих и о составе словарей.
    Тогда класс закрывается разметкой раздела, а не новой находкой на четвёртом круге.
  what_i_do_not_decide: >-
    Порядок агентов и число кругов — не мой предмет. Называю признак и его причину; решение о
    форме задания принимает диспетчер.

