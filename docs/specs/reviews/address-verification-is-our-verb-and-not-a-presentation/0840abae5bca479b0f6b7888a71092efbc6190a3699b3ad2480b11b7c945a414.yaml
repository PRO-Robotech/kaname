    §1.5  5 · 5 · 5 ✓ (имена способов, строки правила уровней, имена в ограничении состава)
    §1.6  0 по новой единице; контроль 1 ✓ (разбор — в non_blocking_taken_in_this_edition)
  contract_numbers_of_dod: |
