closure_of_round_two:
  b9_format_absolute_refusal_values:
    closed: true
    how_i_checked: >-
      НЕ чтением ответа автора: сверил КАЖДОЕ из пяти значений с кодом края своим чтением.
      Все пять совпали с тем, что край производит СЕГОДНЯ. Довод автора — «решение ратифицирует
      то, что край уже производит, а не выбирает новое» — ПОДТВЕРЖДЁН: ни одно значение не
      заказывает правку края молча.
    measured: |
      internal/handler/loginlanehttp/handler.go:908-914 — коды google.rpc.Code объявлены
        числами: codeInvalidArgument=3, codePermissionDenied=7, codeResourceExhausted=8,
        codeUnavailable=14, codeUnauthenticated=16
      предъявление кода  401/16  — handler.go:859, ветвь ErrAuthenticationFailed →
        StatusUnauthorized + codeUnauthenticated, TextAuthenticationFailed, errorInfo=nil
        (значит ни машинного признака, ни Retry-After — ровно как сказано в Р17)
      форма, признака нет 400/3 — form_token.go:57-58, presented=="" → FieldRequired("csrfToken");
        refusals.go:63-68 — Error() = "Illegal argument csrfToken: required", то есть ПОЛЕ НАЗВАНО;
        handler.go:853 — *FieldError → StatusBadRequest + codeInvalidArgument
      форма, признак отвергнут 403/7 — form_token.go:60-66 → ErrFormTokenRejected;
        handler.go:377-380 (judgeForm) → StatusForbidden + codePermissionDenied +
        errorInfo{ReasonFormTokenRejected} — машинный признак есть
      частота 429/8 — handler.go:854-857 → заголовок Retry-After ставится ПЕРЕД ответом,
        затем StatusTooManyRequests + codeResourceExhausted + errorInfo{ReasonTooManyAttempts}
      хранилище 503/14 — handler.go:885-886 → ErrStoreUnavailable → StatusServiceUnavailable +
        codeUnavailable + unavailableText; TextRequestNotPerformed = "request not performed;
        try again later" (refusals.go:24) — «запрос не выполнен», как и сказано
      комментарий самого края, judgeForm (handler.go:370): «признак формы: отсутствует → 400 с
        полем; не подошёл → 403» — край объявляет ту же пару исходов своими словами
    two_outcomes_of_the_form_family:
      verdict: ДОВОД ВЕРЕН, И ОН СИЛЬНЕЕ, ЧЕМ НАПИСАН
      detail: >-
        Автор доказывает «исходов у формы два» смыслом: свести их значило бы спрятать то, ради
        чего существует сценарий о непереносимости. Довод верен, но у него есть ЖЁСТКОЕ
        основание, которого автор не назвал: край УЖЕ различает эти два исхода двумя разными
        парами, и сведение их в одно значение было бы ЗАКАЗОМ ПРАВКИ КРАЯ — ровно тем, что
        Р17 и заведена не допускать. Ф6-31 действительно различает то, чего не различает
        Ф6-30: Ф6-30 закрепляет 403/7 на признак, взятый для ДРУГОГО вида формы, Ф6-31 —
        400/3 на отсутствие признака вовсе, и реализация, отвечающая «признака нет» на
        признак чужого вида, зелена при одном сценарии и красна при двух.
    relation_between_families:
      verdict: ЦЕНА НАЗВАНА ВЕРНО; СЛИЯНИЕ СЕМЕЙСТВ К ОСИ НЕ ДОБАВЛЯЕТ НИЧЕГО
      detail: >-
        Проверено, а не принято на веру. Ось неразличимости — «существует ли адрес», и она
        держится ВНУТРИ каждого семейства по построению, а не по договорённости:
        (1) семейство предъявления — отказ один на негодный, чужой, истёкший и применённый,
        потому что оператор не находит ни одного (recovery_complete.go:37 объявляет это
        дословно: «наружу уходит тот же ErrAuthenticationFailed»);
        (2) семейство формы зависит ТОЛЬКО от признака и адреса не читает вовсе —
        judgeForm стоит до всякого чтения;
        (3) семейство частоты — recovery_complete.go:50, «(1) Частота — до всего»: ограничитель
        исполняется ПЕРЕД чтением адреса, поэтому 429 одинаков для адреса, которого нет ни у
        кого. Существование адреса по этой оси не течёт ни через одно семейство.
        Отсюда: слияние семейств к оси «есть ли адрес» не добавило бы НИ СКОЛЬКО — автор
        утверждает это и он прав, — а отняло бы ось «что делать дальше». Цена выбранной
        стороны названа верно и полностью: клиент, и злоумышленник вместе с ним, узнаёт, что
        упёрся в потолок частоты, и получает Retry-After.
  b10_scope_carrier_coordinate:
    closed: true
    three_places_checked: |
      §3.2, колонка «носитель» строки «число производителей записанного уровня сессии» — стоит
      §3.2, врезка под таблицей — стоит, вместе с записью о маршруте
      §10 (а), пункт 3 ведомости соответствия разбору — стоит, с пометкой «НЕ ЗАКРЫТ ЗДЕСЬ,
        но носитель у него есть»
      §10.1 «Что остаётся УСЛОВИЕМ одобрения» — стоит, объявлено ЗАКРЫТЫМ
    carrier_verified_live: >-
      `gh issue view 343 -R PRO-Robotech/kaname --json number,state,title` →
      {"number":343,"state":"OPEN","title":"сессия: уровень уверенности пишут пятеро, условия
      на прежний нет"}. Координата существует, открыта, и заголовок совпадает с тем, как
      документ её называет, — держатель тот самый, а не одноимённый.
    not_in_dod_and_that_is_correct: >-
      В §9 (определение готовности) координаты нет, и это ВЕРНО, а не пробел: §9 судит предметы
      В ОБЪЁМЕ, а этот вынесен вне объёма. Пункт готовности на чужой предмет был бы готовностью,
      которую полоса не может исполнить.

route_defect_record:
  where_it_stands: '§3.2, врезка сразу под таблицей вне объёма (строки 653-660); отзвуки — §10 п.3 и §10.1'
  is_it_where_the_next_one_will_see_it: >-
    ДА. Врезка стоит вплотную под той самой строкой, о которой она, и в том разделе, куда
    следующий читатель придёт с вопросом «почему у этой строки носитель появился позже».
    Из §10 п.3 и §10.1 на неё есть обратные ссылки, то есть она достижима и со стороны
    ведомости закрытия, а не только сверху вниз.
  rule_or_excuse: >-
    ПРАВИЛО. Проверял по трём признакам. Первое: сформулировано обобщённо и исполнимо —
    «форма задания обязана нести саму координату как ДАННОЕ, а не как условие», и дальше
    названа причина в общем виде: «условие, адресованное тому, кто координаты не имеет, есть
    блокирующий, встроенный в задание». Это применимо к любому заданию, а не только к этому.
    Второе: врезка не защищает документ — она открывается словами «строка ПОЛУЧИЛА носителя»,
    то есть дефект уже устранён, и запись сделана не вместо исправления, а сверх него.
    Третье: механизм назван честно и проверяемо — «координата появилась у другого исполнителя
    ПОСЛЕ редакции, и вернуть её в документ было некому», «род блокирующего отверг работу
    дважды». Второе проверено мной по записям: SCOPE стоял B7 (круг 1) и B10 (круг 2) — счёт
    верен. Оправдания в тексте нет: слово «виноват маршрут, а не строка» стоит РЯДОМ с
    исправленной строкой, а не вместо неё.
  one_note_for_the_dispatcher: >-
    Правило записано в приёмке, а действует оно в форме ЗАДАНИЯ, которую пишет диспетчер.
    Документ — верное место, чтобы вывод не выводили заново, но сам по себе он форму задания
    не меняет. Это не дефект документа; это строка, которую стоит перенести в то место, где
    задания составляются.

