        опоре, а не в выводе: ложная опора под верным выводом, класс, который документ сам
        называл в редакциях 3-5.
      what_to_do: >-
        Назвать держателем Р11 #456 EV-01 (ответ и хранилище после регистрации); EV-86 оставить
        только там, где он о переходе (Р1, Р13). Фразу о литерале уточнить: о механизме #456
        молчит, значение утверждает EV-01.
      execution_check: >-
        grep -c 'EV-01' в разделе Р11 → не меньше 1; строки «Держатель единственности — `#456`
        EV-86» нет.
      predicate: |
        sed -n 1472,1478p docs/engineering/acceptance/access-beyond-login-needs-a-verified-address.md  # EV-86: Дано — миграции и посев; перепись операторов
        sed -n 924,930p docs/engineering/acceptance/access-beyond-login-needs-a-verified-address.md    # EV-01: ответ false И чтение сессии false
        git grep -n 'SET email_verified_at' -- '*.go' ':!*_test.go'                                  # → 1 оператор, адаптер
        git grep -n 'MarkEmailVerified(' -- '*.go' ':!*_test.go'                                     # → объявление порта и реализация

