    - id: B13
      genus: PRODUCER
      where: '§2 Р11, абзацы «Исход» и «Цена»; §4.2 п. 4 (Р11)'
      new_in_this_round: true
      finding: >-
        Р11 — единственный исход, который называет ТОЛЬКО этот документ, и держатель ему назван
        не тот. Документ пишет: отметку ставит только глагол подтверждения (#456 EV-86); держатель
        единственности писателя — #456 EV-86. EV-86 так, как он записан, этого не держит:
        «Дано» — миграции и посев, входящие в изменение; единица — ОПЕРАТОР записи; в DoD он стоит
        как «посадка не пишет в записи людей» (#456 §9 п. 11, Р13). Оператор записи отметки в
        дереве один (адаптер), и второй вызывающий того же оператора — ровно тот ход, от которого
        страховал Р11 (регистрация, ставящая отметку), — счёт операторов не меняет: EV-86 зелен и
        при нём.
      the_holder_that_exists: >-
        Держит это #456 EV-01: после регистрации ответ несёт session.emailVerified = false И
        чтение сессии по тому же носителю даёт email_verified = false. Регистрация, поставившая
        отметку, краснит второе утверждение, какой бы литерал ни стоял в ответе. Значит и фраза
        «#456 ничего не утверждает о литерале» требует уточнения: о механизме — ничего, но значение,
        которое литерал производит, и значение хранилища EV-01 утверждает оба, в одном сценарии.
      what_is_NOT_wrong_here: >-
