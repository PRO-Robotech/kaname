blocking:
  count: 8
  genera: [DoD, COVERAGE, SCOPE, CONVENTION]
  items:
    - id: B1
      genus: DoD
      where: §9 п.6; §3.3 первая строка
      claim_under_test: 'Доставка письма сценариев не делает неисполнимыми'
      finding: >-
        §9 п.6 требует newman-прогоном ПОЛОЖИТЕЛЬНЫЙ путь «Ф6-01 → письмо → Ф6-06 → запрос
        восстановления ВЫДАЁТ код». Этот путь недостижим ПО ПОСТРОЕНИЮ в объявленном объёме,
        и соседняя полоса уже упёрлась в то же самое и записала причину дословно:
        `tests/newman/cases/kaname-recovery-lane.py:20-23` — «Счастливого завершения с
        настоящим кодом здесь нет: код уходит ПИСЬМОМ, и прочитать его через край нельзя by
        construction — это предмет Ф5-14 (доставка, kacho#1773)». Перепись кейсов соседа
        подтверждает: три кейса, положительного завершения среди них нет
        (OK-REQUEST-SAME-ANSWER · NEG-WRONG-CODE · NEG-CSRF-MISSING). Доставка — `#1773`,
        OPEN, blocked, и §3.3 сама выносит её вне объёма.
      second_defect_same_line: >-
        Вторая половина того же пункта — «запрос восстановления ВЫДАЁТ код» — через край
        НЕНАБЛЮДАЕМА по требованию самого документа: Ф6-03 требует побайтово равного ответа
        на всех исходах запроса, а различимы они «только клеткой счётчика». То есть один
        пункт готовности просит newman увидеть ДВА предмета, которых newman увидеть не может.
      why_blocking: >-
        Пункт готовности обязан иметь объективное «пройдено / не пройдено». Этот измерим и
        навсегда «не пройдено» — значит либо полоса не сдаётся никогда, либо пункт тихо
        объявят исполненным. Оба исхода хуже правки.
      what_to_do: >-
        Развести уровни: на newman оставить то, что видно на проводе без письма (Ф6-01,
        Ф6-03, Ф6-07, Ф6-22), а положительный путь Ф6-06 отдать интеграционному уровню, где
        значение кода берётся из намерения/строки очереди в процессе. Либо назвать
        наблюдателя письма (приёмник `#1773`) и признать пункт зависящим от него —
        и тогда снять §3.3 утверждение «доставка сценариев не делает неисполнимыми».

    - id: B2
      genus: COVERAGE
      where: §5 (нет сценария); §4.2 форма Ф-а; §8 строка «механизм базы»; §10 В4
      claim_under_test: 'решение владельца В4 — повторное подтверждение НЕ переписывает уже стоящий момент'
      finding: >-
        Сценария на это решение в документе нет ни одного, а производитель, названный
        существующим (Ф-а), делает ОБРАТНОЕ. Измерено посевом, не чтением: тот же оператор,
        что у единственного писателя, переписал стоящий момент с 2026-09-01 10:00 на
        2026-09-22 23:00, marked=t. Причина в самом операторе — `UPDATE users SET
        email_verified_at = $3 WHERE id = $1 AND email = $2` не несёт условия на прежнее
        значение. Существующая проба Ф-а
        (`TestLoginMethodRepo_VerificationLandsOnlyOnTheVerifiedValue`) повторного
        подтверждения не касается вовсе — прочитана целиком, отметка в ней ставится один раз.
      why_blocking: >-
        Документ объявляет Ф-а «существует сегодня», а §8 требует, чтобы эта группа «осталась
        зелёной, а не чтобы их завели». Реализованный как написано, документ посадит
        поведение, которое владелец отверг, и ни одна проба этого не заметит.
      what_to_do: >-
        Завести сценарий «годный код предъявлен для уже подтверждённого адреса → момент
        ПРЕЖНИЙ» с положительным близнецом «для неподтверждённого → момент новый»
        (различие ровно одно: стоит ли отметка). Ф-а перестаёт быть данностью и переезжает в
        предмет правки — §4.2 и §8 обязаны это сказать. В4 уходит из §10 в §2 решением.

    - id: B3
      genus: COVERAGE
      where: §5 (нет сценария); Р8; §9 (нет пункта); §10 В3
      claim_under_test: 'решение владельца В3 — величины темпа СВОИ, не общие с полосой входа'
      finding: >-
        Р8 требует «величины — настройка без умолчания», но держателя у этого требования нет:
        сценария отказа старта на незаданную величину темпа в документе нет, хотя ровно такой
        сценарий для срока кода есть (Ф6-11). Требование без держателя — ручка, объявленная и
        никем не судимая. Вдобавок число: §10 В3 говорит «две новые ручки», а механизм,
        названный формой Ф-к (`humansession/rate.go`), несёт ЧЕТЫРЕ величины —
        AddressAttempts · AddressWindow · SourceAttempts · SourceWindow, и `Limits.Validate()`
        требует положительной каждую из четырёх. Своя пара осей — это четыре ручки, не две.
      why_blocking: >-
        С закрытым В3 полоса приобретает собственные величины. Без сценария на их незаданность
        «настройка без умолчания» держится вниманием, а не исходом старта, — и умолчание
        подставится молча.
      what_to_do: >-
        Дописать сценарий отказа старта на незаданные величины темпа с положительным близнецом
        (объявленные — процесс поднимается), по образцу Ф6-11; поправить число ручек на то,
        что несёт `Limits`; добавить пункт готовности.

    - id: B4
      genus: COVERAGE
      where: Р4; §3.1 п.2; Ф6-09
      claim_under_test: 'хранится СВЁРТКА значения, а не значение'
      finding: >-
        Утверждение верно для таблицы кода и НЕВЕРНО для второго хранилища, которое эта же
        полоса заводит. Измерено: `invite_mail_outbox/outbox.go:99+` кладёт в payload строки
        очереди ключ `"code"` со значением `in.Code.Letter()` — предъявимый код ОТКРЫТЫМ
        ТЕКСТОМ (цепочка: recovery_request.go:151 → iface.go:170 → recovery_code_repo.go:146
        → EmitRecoveryTx). Строка живёт в очереди до дренажа. Ни один сценарий документа этот
        срок не ограничивает: Ф6-20 утверждает только появление строки своего вида и паритет
        отправителя.
      consequence_on_a_scenario: >-
        Отсюда Ф6-09 становится двусмысленным, и два прочтения дают ПРОТИВОПОЛОЖНОЕ «Тогда».
        «Дано» звучит «значением, ПРОЧИТАННЫМ ИЗ ХРАНИМОЙ СТРОКИ», а хранимых строк о коде
        теперь две: из строки кода читается свёртка — отказ (прочтение, которое §6 молча
        выбирает, назвав «свёртка в строке кода»); из строки очереди читается сам код —
        ПРИНЯТИЕ. Сценарий обязан назвать, какую строку он имеет в виду, иначе он утверждает
        тавтологию (свёртка не есть значение) и молчит о том, что весомо.
      why_blocking: >-
        «Хранение свёрткой» внесено в объём прямой строкой §3.1 п.2. Объёмное утверждение,
        верное для одного из двух хранилищ, — это не мелочь формулировки: оно закрывает
        вопрос, который на деле открыт.
      what_to_do: >-
        Сказать про очередь прямо: значение лежит в ней открытым до дренажа, и назвать, чем
        ограничен срок его жизни там (дренаж, уборка, или решение «так и есть, вот почему»).
        Ф6-09 переписать так, чтобы «Дано» называло строку кода поимённо.

    - id: B5
      genus: DoD
      where: §9 п.1; Р3
      claim_under_test: 'перепись видов формы — на один больше прежнего'
      finding: >-
        Число противоречит форме, которую Р3 объявляет взятой у соседней полосы ДОСЛОВНО.
        Измерено: пара восстановления несёт ДВА вида формы — `FormRecovery` и
        `FormRecoveryComplete` (human_session.go:263, перечень из 8), и сосед утверждает
        неперенос признака между ними отдельным утверждением:
        `kaname-recovery-lane.py:184` — «признак предъявления отличается от признака запроса
        — вид формы замешан». При одном виде на два пути признак, взятый для формы запроса,
        предъявим на форме подтверждения — то есть взята НЕ та форма, что объявлена взятой.
      note_on_the_neighbour_rule: >-
        Правила «путь = вид» в дереве нет и я его не постулирую: пять путей второго фактора
        делят один вид. Находка не в арифметике, а в расхождении с названным образцом —
        документ копирует полосу восстановления, а число берёт от другой.
      why_blocking: >-
        Пункт готовности несёт проверяемое число, и число выбирает сторону в вопросе, который
        документ нигде не обсуждает; вдобавок сторона — более слабая.
      what_to_do: >-
        Решить явно: два вида (как у образца) — и тогда исправить число и завести сценарий
        непереносимости признака между формами запроса и подтверждения; либо один — и тогда
        сказать, почему ослабление против образца допустимо.

    - id: B6
      genus: COVERAGE
      where: §9 п.10
      claim_under_test: 'Шесть пунктов возврата разбора закрыты, и вот чем'
      finding: >-
        Таблица не сходится с §7 разбора, на который ссылается. §7 разбора
        (`dead-lanes-verification-and-assertion.md`, отпечаток f527e1a1…) перечисляет:
        п.1 решение Б5 с ценой дословно · п.2 решение Б7 · п.3 ЧИСЛО ПРОИЗВОДИТЕЛЕЙ
        ЗАПИСАННОГО УРОВНЯ как «Дано» сценария А · п.4 отрицательный близнец на уровень ·
        п.5 заглавная буква в хранимом адресе · п.6 условие годности прибора. В таблице
        документа строки 1, 2 и 6 — «конфликтная вставка и смена адреса», «срок и
        однократность кода», «неразличимость ответа» — пунктами §7 НЕ ЯВЛЯЮТСЯ; настоящие
        п.1 и п.2 исполнены (Р1 и Р2), но в таблице не зачтены; а п.3 не закрыт ВОВСЕ — он
        вытолкнут в §3.2 «вне объёма».
      why_blocking: >-
        Подстановка трёх чужих строк на места трёх настоящих прячет ровно тот пункт, который
        не закрыт. Разбор называет его необратимым: §1.3 п.2 — «Необратимо обратное —
        оставить производство уровня из имён… четыре места перепишут записанное значение
        вниз, и вернуть его будет не из чего». Заголовок «шесть закрыты» при пяти закрытых —
        это «ноль находок», полученный непрочтением целого вида предмета.
      what_to_do: >-
        Привести таблицу к §7 разбора построчно; строку п.3 либо закрыть сценарием, либо
        объявить отложенной ЯВНО, с решением владельца (см. owner_questions O1).

    - id: B7
      genus: SCOPE
      where: §3.2, строка «запрет второго производителя записанного уровня сессии»
      claim_under_test: 'вне объёма — с НОСИТЕЛЕМ и ПРЕДИКАТОМ ВОЗВРАТА по каждой строке'
      finding: >-
        Носителя у этой строки на деле нет. Объявлены два: «находка А разбора классов,
        §1.3 п. 2» — документ, который САМ НЕ ЗАКОММИЧЕН (untracked, как и предмет ревью), и
        «задачей на предмет «число производителей записанного уровня»» — задачи такой не
        существует: `gh issue list -R PRO-Robotech/kacho --search "записанн уровень
        производител" --state all` → `[]`. Носитель, которого нет в дереве, и задача, которой
        нет в трекере, отложенное не удерживают.
      why_blocking: >-
        §3.2 сама вводит контракт «носитель + предикат возврата по каждой строке». Строка,
        нарушающая собственный контракт документа, — отложенное без держателя, то есть
        снятое молча. Тяжесть задаёт разбор: полоса входа ключом и есть первый производитель
        верхней ступени.
      what_to_do: >-
        Завести задачу до одобрения и внести её номер строкой; либо, если владелец решит
        закрыть предмет здесь, внести сценарий и снять строку из §3.2.

    - id: B8
      genus: CONVENTION
      where: §1.2, третий предикат; ∅4 в §4.1
      claim_under_test: "git ls-files | grep -icE 'seed.*\\.sql' → 0 — посева SQL у службы нет"
      finding: >-
        Предикат не воспроизводится на объявленной ревизии: на cbbac984 он даёт 1, не 0.
        Попадание — `internal/migrations/20260913144108_seed_identity_leaves_the_platform_brand.sql`.
      what_survives: >-
        ВЫВОД ∅4 уцелел, и я проверил его своим предикатом, не авторским: сплошная перепись
        имени колонки по всем `*.sql` даёт 6 вхождений в ОДНОМ файле
        (20260915111233), из них присваивание ровно одно — `NEW.email_verified_at := NULL`,
        то есть база отметку только СНИМАЕТ; ни один посев и ни одна миграция её не ставят.
        Множество отмеченных строк пусто by construction — это верно.
      second_way_the_sentence_is_wrong: >-
        «Посева SQL у службы нет» неверно и во втором смысле: посев у службы есть, и он лежит
        В МИГРАЦИИ — ровно тот класс, который `data-integrity.md` §«Данные СТЕНДА заводятся
        посевом, а не миграцией» называет по имени. Предметом этой приёмки он не является, но
        фраза документа его отрицает.
      why_blocking: >-
        §7 инвариант 7 документа обещает: «Ни одно число документа не датировано самоссылкой:
        каждое несёт ревизию замера и команду пересчёта». Число, чья команда на своей же
        ревизии даёт другое, этот инвариант ломает, а ∅4 — одна из пяти опор Р1. Правка — одна
        строка, и цена ошибки именно поэтому мала; но опору, которую цитируют дальше, чинят до
        одобрения, а не после.

non_blocking:
  - id: N1
    where: Р7
    subject: 'утверждение, ради которого документ отказался наследовать свойство соседа'
    outcome: ДОВОД ВЕРЕН — и он сильный; назвать его точнее
    detail: >-
      Проверено по коду, не по тексту. Для пары, которую Р7 имеет в виду и которую §1.6
      называет прямо — «адрес есть, не подтверждён» ↔ «адреса нет», — неразличимость держится
      ИМЕННО ПО ПОСТРОЕНИЮ: в `recovery_request.go` обе ветки (`case !found:` и
      `case !target.EmailVerified:`) после ОДНОГО и того же чтения `RecoveryTarget` трогают
      клетку счётчика и возвращают nil, работы у них поровну. Утверждения на эту пару нет ни
      одного: прибор её не несёт (его полосы — «адрес подтверждён» ↔ «адреса нет»,
      recovery_timing_probe_integration_test.go:188-191). Значит вывод «наследовать нельзя,
      утверждать заново надо» ВЕРЕН, и Ф6-03/Ф6-04 не дублируют ничьё утверждение.
    what_to_sharpen: >-
      Формулировка «обе её полосы» неточна дважды. Во-первых, полос у соседа три плюс отказ
      хранилища (закрытый перечень — 4 клетки, observer.go:101-104), и какие две имеются в
      виду, сказано только в §1.6, а не в Р7. Во-вторых, для ТРЕТЬЕЙ полосы («адрес
      подтверждён») свойство держится не чистым построением, а тем, что чеканка и постановка
      уходят диспетчером вне пути ответа (`dispatch.go`, GoDispatcher), — ПЛЮС прибором,
      который существует и которого конвейер не запускает. То есть «а не утверждением» верно
      для одной пары и неверно для другой; §1.6 это знает, Р7 — не говорит. Назвать пару
      внутри Р7 — и довод станет неоспоримым.

  - id: N2
    where: §4.3 п.2
    subject: '«код нельзя подобрать» переписано в два сценария — честное сужение или потеря'
    outcome: СУЖЕНИЕ ЧЕСТНОЕ В ТРЁХ НОГАХ ИЗ ЧЕТЫРЁХ, четвёртая потеряна молча
    detail: >-
      Неподбираемость держится четырьмя вещами: срок (Ф6-07), однократность (Ф6-08),
      ограничение темпа (Ф6-22) и ЭНТРОПИЯ значения. Первые три переписаны в наблюдаемое
      корректно. Четвёртая не упомянута нигде, и её производитель в §6 не назван: Ф-д — это
      хранилище (`recovery_code_repo.go`), а значение чеканит
      `domain.NewRecoveryCodeValue()`. Ограничение темпа подбор и так ограничивает, поэтому
      это не блокирующее; но Р4 берёт форму у соседа «без изменений», а §9 п.2 заводит СВОЮ
      таблицу кода — то есть чеканка у полосы своя, и наследуется она молча. Это ровно то, что
      Р7 отказывается делать с неразличимостью: назвать бы производителя значения и здесь.

  - id: N3
    where: не предмет документа — находка о соседе
    subject: 'у соседней полосы положительный кейс утверждает не то, что объявляет'
    outcome: НАХОДКА, подтверждающая §0 документа живым прецедентом
    detail: >-
      Шапка набора соседа объявляет `{{loginLaneEmail}}` как «почта человека с ПОДТВЕРЖДЁННЫМ
      адресом (посев)» (kaname-recovery-lane.py:13). Посева отметки не существует:
      `git grep -rniE 'email_verified' -- .github/ deploy/ tests/` → НОЛЬ попаданий, а
      писателя никто не зовёт (§1.1). Значит `IAM-RECOVERY-OK-REQUEST-SAME-ANSWER` сравнивает
      полосу `unverified` с полосой `no-row`, а не `verified` с `no-row`, — то есть зелен и на
      полосе, которая не работает никогда. Это в точности тот риск, который Ф6-01 называет
      своим «положительным контролем полосы», и он уже реализовался по соседству. Стоит
      сослаться на прецедент в §0 и завести задачу на шапку соседнего набора.

  - id: N4
    where: §3.3, третья строка
    subject: 'конструируемость «Дано» посевом'
    outcome: ПОДТВЕРЖДЕНА ПОСЕВОМ для всего, что сегодня посеять можно
    detail: >-
      Утверждение «ручного вмешательства в базу не требует ни один» проверено прогоном, а не
      чтением: фикстура строит строку человека и строку способа входа, отметка ложится
      адаптером, база поднята из миграций дерева. Замечание к формулировке: «отметка,
      поставленная адаптером напрямую» достижима только в процессе, поэтому «Дано» сценариев
      Ф6-04 и всей полосы кода через край (newman) не строится — что само по себе верно и
      согласовано с §9 п.5, но §3.3 стоит сказать это вслух, иначе метка «E» читается как
      «достижимо newman-ом» (см. B1).

decisions_ratified_on_review:
  note: >-
    Ниже — решения владельца, принесённые заданием круга. Они НЕ переоткрываются; здесь
    зафиксировано, исполняет ли их документ.
  R1:
    text: обратного заполнения не будет
    price_named_honestly: true
    price_check: >-
      Р1 называет цену прямо и полностью: «Каждый существующий человек проходит подтверждение
      сам, и до того полоса восстановления ему закрыта», и отдельно — что платят люди,
      заведённые до глагола, каждый по одному разу. Асимметрия названа честно: «Ничего не
      заполнять сегодня дёшево… а платят за это люди».
    consequence_covered_by_a_scenario: true
    consequence_check: >-
      ГЛАВНОЕ требование задания исполнено. Ф6-02 — не иллюстрация, а несущий сценарий:
      «Дано» — человек без отметки, пароля не помнит, ни носителя сессии, ни носителя
      контекста формы; «Когда» — берёт контекст формы БЕЗ носителя сессии и зовёт путь
      запроса; «Тогда» — 200, письмо в очереди, и путь не потребовал ни сессии, ни пароля.
      Достижимость проверена по дереву: `PathCSRF` смонтирован как GET без носителя сессии
      (handler.go:182), сосед берёт признак ровно так же и утверждает это newman-ом. То есть
      Р1 не превращает мёртвое восстановление в мёртвое навсегда, и документ это ЗАКРЫВАЕТ,
      а не упоминает.
    verdict: ИСПОЛНЕНО
  R2:
    text: подтверждение предъявлением не является
    leaks_found: 0
    leak_check: >-
      Перемерено моими предикатами, не авторскими, по всем четырём ногам. Словарь способов —
      5 (`internal/assurance`); строки правила уровней — 5 (`level.go`, var rows); имена в
      ограничении состава предъявленного — 5 (20260916190000:84). Искал ЧЕТВЁРТОЕ место и не
      нашёл: соседние ограничения (`user_login_methods_kind_check`, ограничения второго
      фактора) — другие словари, не словарь предъявления. Четвёртая нога — выдача сессии —
      утверждена с ДВУХ сторон: Ф6-06 («Set-Cookie в ответе нет») и Ф6-17 («носителя сессии не
      несёт ни на одном исходе»), в §5 ровно два утверждения о Set-Cookie.
    verdict: ИСПОЛНЕНО — течи нет ни в одном из трёх множеств и ни в выдаче
  V1_refusal_on_action_is_a_separate_acceptance:
    verdict: ИСПОЛНЕНО
    check: >-
      Сценария об отказе на действии, требующем подтверждённого адреса, в §5 нет ни одного
      (перепись §5 по образцу «отказ на действии|требующ.*подтверждённ» — 0 попаданий);
      §3.2 выносит предмет строкой с носителем (Ф1 §5). §10 В1 обязан быть снят как решённый.
  V2_path_names_accepted:
    verdict: ИСПОЛНЕНО — имена Р3 приняты; §10 В2 снять как решённый
  V3_own_rate_knobs:
    verdict: НЕ ПОКРЫТО — см. blocking B3
  V4_repeat_verification_does_not_rewrite:
    verdict: ПРОТИВОРЕЧИТ ПРОИЗВОДИТЕЛЮ — см. blocking B2 (опровергнуто посевом)
  V5_own_ttl_knob:
    verdict: ИСПОЛНЕНО — Ф6-11 требует объявленной ручки и отказа старта, ручка своя; §10 В5 снять как решённый

rewritten_thens_reviewed:
  note: 'автор сам назвал три места, где «Тогда» переписано под найденного производителя; разобрано каждое'
  items:
  - id: 1
    what: '«письмо доставлено» разведено на строку очереди и доставку'
    verdict: ЧЕСТНОЕ СУЖЕНИЕ В §5, ПОТЕРЯ В §9
    why: >-
      На уровне сценария разведение верно: производитель строки очереди наш (Ф6-20), доставка
      — `#1773`, наблюдается у приёмника. Но §9 п.6 требования сузить забыл и просит
      доставленное письмо обратно. Сужение, не доведённое до пункта готовности, — см. B1.
  - id: 2
    what: '«код нельзя подобрать» переписано в два сценария'
    verdict: ЧЕСТНО В ТРЁХ НОГАХ, ЧЕТВЁРТАЯ (энтропия) ПОТЕРЯНА МОЛЧА
    why: см. non_blocking N2
  - id: 3
    what: '«уровень не понижается» сужено до отрицательного близнеца о касании этого глагола'
    verdict: СУЖЕНИЕ ЧЕСТНОЕ, НО ВЫТОЛКНУТОЕ ОТЛОЖЕНО БЕЗ ДЕРЖАТЕЛЯ
    why: >-
      Само сужение правильно и своей парой обеспечено: Ф6-17 утверждает неизменность
      записанного уровня при касании ЭТОГО глагола, Ф6-18 — положительный близнец, меняющий
      ровно один факт (какой глагол тронут), и производитель у него существующий
      (`humansession/step_up.go`, пишет уровень строкой `PresentInSession`). Предмет «число
      производителей записанного уровня» действительно ДРУГОЙ. Но вытолкнут он вопреки §7 п.3
      разбора и без носителя — B6 и B7.

owner_questions:
  - id: O1
    question: >-
      Разбор классов (§7 п.3, §1.3 п.2) требует, чтобы «число производителей записанного
      уровня сессии» вошло в ЭТУ приёмку как «Дано» сценария А, и называет этот предмет
      единственным НЕОБРАТИМЫМ: мест пересчёта уровня из имён — пять, пишущих в базу —
      четыре, и в день посадки входа ключом они перепишут записанное значение вниз без
      возможности восстановить. Документ выносит предмет вне объёма (§3.2). Это расхождение
      приёмки с разбором, на который она опирается, и решение о нём — объёмное.
    options:
      - закрыть предмет здесь отдельной полосой сценариев (объём растёт, посадка отодвигается)
      - оставить вне объёма, но завести задачу ДО одобрения и внести её номер в §3.2 как носителя
    why_owner: >-
      Выбор между «шире объём сейчас» и «риск необратимого понижения к посадке входа ключом» —
      стратегический, не авторский. Рецензент его не принимает.
    reviewer_note: >-
      Второй вариант дешевле и, на мой взгляд, достаточен, ЕСЛИ задача заводится до одобрения:
      предмет действительно другой, а срочность привязана к полосе входа ключом, а не к этой.

route_signals:
  proto: нет — документ контракта .proto не трогает; глагол живёт на собственном слушателе формы полосы входа
  schema: ДА — новая таблица кода подтверждения и третий вид письма в ограничении очереди (§9 п.2)
  public_rpc: ДА — два новых пути полосы входа, достижимых без носителя сессии
  ui: нет — экраны консоли вне объёма (§3.2, девять экранов, отдельная волна)
  new_domain: нет — предмет внутри kaname
  security_surface: >-
    ДА, и широко: путь, достижимый без входа вообще; предъявитель-код со сроком; ограничение
    темпа; неразличимость ответа как требование; открытое хранение предъявимого значения в
    очереди (B4); решение о том, что подтверждение не выдаёт сессию (Р2).

disclosure_check:
  verdict: ГРАНИЦЫ ДЕРЖАТСЯ — и в документе, и в этой записи
  detail: >-
    §11 документа проверен по существу, а не по объявлению: сборки «координата + условие +
    следствие» в нём нет, значения и свёртки не приводятся, рабочая директория не названа.
    Состояние линии, названное §0, уже объявлено самой линией публично —
    `docs/content/api/auth-lane.mdx:204-209` несёт врезку «Подтверждение адреса под `own` —
    производителя на линии нет» вместе с предикатом; документ его не раскрывает, а ссылается.
    Оба репозитория публичны, поэтому и ЭТА запись написана тем же правилом: она называет
    координаты объявлений и чинимые дефекты контракта, но не собирает шаг к использованию.
    Замечание B4 названо как дефект утверждения о хранении, без формы значения и без пути к
    нему; §9 п.9 документа (снятие врезки тем же изменением, что заводит производителя) —
    правильный и обязательный пункт, его сохранить.

