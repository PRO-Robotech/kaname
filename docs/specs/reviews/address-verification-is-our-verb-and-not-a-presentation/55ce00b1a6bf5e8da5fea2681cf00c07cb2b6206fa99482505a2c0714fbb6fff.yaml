    - id: B5
      genus: DoD
      status: ЗАКРЫТ — обе половины, и вторая найдена автором ВОПРЕКИ пересказу задания
      how: >-
        Видов формы заводится ДВА, число готовности исправлено на 10 (было «на один
        больше»), непереносимость признака между формами — Ф6-30.
      the_mistransmission: >-
        Задание круга 2 передало эту находку автору как «виды ПИСЬМА», тогда как координата
        моей записи — «виды ФОРМЫ». Автор сверился с ЗАПИСЬЮ, а не с пересказом, и нашёл
        настоящую находку. Это правильный порядок: запись ревью есть предмет, пересказ —
        нет. Проверены ОБЕ половины.
      half_one_form_kinds: >-
        ВЕРНО. `internal/domain/human_session.go:263` — `formKinds` несёт ВОСЕМЬ видов
        (FormLogin, FormLogout, FormPassword, FormRegister, FormRecovery,
        FormRecoveryComplete, FormSecondFactor, FormStepUp), и пара восстановления берёт
        ДВА из них. Значит после посадки станет ДЕСЯТЬ — число §9 п. 1 верно, прежнее «на
        один больше» было неверно. Довод «при одном виде на два пути признак, взятый для
        формы запроса, предъявим на форме подтверждения» подтверждён у соседа ДОСЛОВНО:
        `tests/newman/cases/kaname-recovery-lane.py:184` — «признак предъявления отличается
        от признака запроса — вид формы замешан». Ф6-30 утверждает ровно это и несёт
        положительный близнец (Ф6-06) с различием в один факт — для какого вида взят признак.
      half_two_mail_kinds: >-
        Работа, сделанная по неверному пересказу, ничего не сломала и по существу НУЖНА.
        Р5 — не «третий вид», а ПЕРЕЕЗД письма подтверждения к нам, и это иной предмет, чем
        виды формы. Замер сходится: словарь видов письма сегодня несёт ДВА имени на обеих
        сторонах — схема (`mail.invite.send`, `mail.recovery.send`) и применитель
        (`outbox.go:45,48`), после переезда обе станут тремя. Существующий гейт
        `TestEveryMailKindHasExactlyOneSender` прогнан, зелен. Утверждение Р5 «признак
        „письмо несёт предъявителя“ между видами НЕ переносится и объявляется заново» —
        верное и важное: приглашение предъявителя не несёт, восстановление и подтверждение
        несут, и наследовать это молча нельзя.

    - id: B6
      genus: COVERAGE
      status: ЗАКРЫТ
      how: >-
        §9 п. 10 разведён на ДВЕ ведомости — (а) шесть пунктов §7 самого разбора и (б) шесть
        пунктов возврата, названных заданием, — и третий пункт разбора объявлен НЕЗАКРЫТЫМ
        прямым текстом.
      what_i_verified: >-
        Прочитал §7 разбора (`dead-lanes-verification-and-assertion.md`, отпечаток
        f527e1a1…, строки 306-317) и сверил построчно. Совпадение полное: п. 1 решение Б5 с
        ценой → Р1; п. 2 решение Б7 «является ли подтверждение предъявлением» → Р2; п. 3
        число производителей записанного уровня → объявлен НЕ ЗАКРЫТЫМ; п. 4 отрицательный
        близнец на уровень → Ф6-17/Ф6-18; п. 5 заглавная буква → Ф6-12; п. 6 условие
        годности прибора → Р12 и Ф6-23…Ф6-25. Подстановки чужих строк на места настоящих
        больше нет, и «шесть закрыты» при пяти закрытых больше не объявляется.
      why_this_matters: >-
        Заголовок «шесть закрыты» прятал ровно тот пункт, который не закрыт. Теперь
        незакрытость объявлена, и это честнее, чем закрытость: ведомость, называющая свой
        пробел, предмет удерживает; ведомость, его подменяющая, — снимает молча.

    - id: B7
      genus: SCOPE
      status: ЗАКРЫТ ПО СУЩЕСТВУ, НЕ ЗАКРЫТ В ПРЕДМЕТЕ — см. blocking B9
      how_far_it_got: >-
        §3.2 получила врезку: строка несёт ОБЕЩАНИЕ, а не носителя, и это объявлено условием
        одобрения (§10.1). Названы предмет и предикат ДОСЛОВНО — именно для того, чтобы
        задача была заводима без этого документа.
      what_is_now_true_in_the_world: >-
        Держатель ЗАВЕДЁН и мною проверен: `PRO-Robotech/kaname#343`, состояние OPEN,
        заголовок «сессия: уровень уверенности пишут пятеро, условия на прежний нет»
        (`gh issue view 343 -R PRO-Robotech/kaname --json number,state,title,url`). Предмет
        задачи совпадает с предметом строки.
      what_is_still_not_true_in_the_subject: >-
        КООРДИНАТЫ В ДОКУМЕНТЕ НЕТ: `grep -n '343' $D` → пусто; строка 558 по-прежнему
        несёт «задача трекера, заводимая ДО одобрения этой редакции». Я сужу отпечаток, а не
        мир вокруг него. Подробности и разбор тяжести — blocking B9.

    - id: B8
      genus: CONVENTION
      status: ЗАКРЫТ — обе половины
      what_i_verified: >-
        Все предикаты §1.2 прогнаны дословно на голове и воспроизводятся. Присваивание
        колонке в миграциях — ОДНО, и это `NEW.email_verified_at := NULL`
        (20260915111233:105): база отметку только СНИМАЕТ. Контроль в обратную сторону
        находит присваивание там, где оно есть (`SET email_verified_at` в
        `login_method_repo.go:240`). Перепись посева вне миграций даёт 0; контроль со
        включением миграций даёт 1, и единственное попадание названо поимённо —
        `20260913144108_seed_identity_leaves_the_platform_brand.sql`. Прежнее «→ 0» под
        предикатом, дающим 1, исчезло.
      second_half: >-
        Вторая половина ошибки — словесная — тоже исправлена и исправлена честно: документ
        теперь ГОВОРИТ, что посев у службы есть и лежит он в миграции, называет класс по
        имени (`data-integrity.md` §«Данные СТЕНДА заводятся посевом, а не миграцией»),
        объявляет его вне объёма и объясняет, зачем назвал: прежняя фраза его ОТРИЦАЛА.
        Документ, отрицающий существующий предмет, снимает его молча — эта строка снята.
      conclusion_survives: >-
        Вывод ∅4 держится и на моём предикате: множество отмеченных строк пусто by
        construction в ЛЮБОМ развёртывании этой ревизии — производителя ноль, обратного
        заполнения нет, посев отметок не ставит, механизм базы отметку только снимает.

beyond_the_order:
  note: >-
    Три места, где автор сделал больше заказанного. Задание просило судить их отдельно; сужу.
  items:
  - id: X1
    what: 'отрицательный близнец «своей ручки», которого не заказывали (Ф6-11)'
    verdict: ДОВОД ВЕРЕН, КОНСТРУКЦИЯ ГОДНАЯ — и её стоит назвать прямо
    the_authors_claim: >-
      «Своя ручка» проверяема только если ЧУЖАЯ тоже падает, и потому профиль, объявивший
      ТОЛЬКО соседний срок, обязан ВСЁ РАВНО отказать в старте.
    why_it_is_right: >-
      Разобрано как конструкция проверки, а не как формулировка. Сценарий, несущий ТОЛЬКО
      «незаданная роняет старт», удовлетворяется реализацией, у которой СВОЕЙ ручки нет
      вовсе: она читает `login.RecoveryCodeTTL` (сегодня ровно это и есть в дереве —
      `cmd/kaname/loginlane.go:501`, `CodeTTL: login.RecoveryCodeTTL`) и отказывает в старте,
      когда не задана ОНА. Положительный путь такой реализации зелен, отрицательный тоже
      зелен, а решение Р16 при этом нарушено полностью и молча. Добавленная ветвь строит
      мир, в котором утверждение ЛОЖНО, и требует, чтобы он краснел: профиль с объявленным
      сроком восстановления и НЕобъявленным сроком подтверждения обязан не подняться. Под
      реализацией «читаю чужое» он поднимется — сценарий упадёт. Значит ветвь есть
      РАЗЛИЧИТЕЛЬ двух реализаций, а не повтор.
    generalisation: >-
      Это тот же класс, которым Р5 отказывается наследовать признак предъявителя и Р7 —
      неразличимость: утверждение «X — СВОЁ» не проверяется наблюдением за X, оно
      проверяется тем, что мир, где X чужое, отличим. Автор применил класс к ручке, которой
      ещё нет, и применил верно.
    constructibility: >-
      Ветвь конструируема: профиль, задающий срок восстановления и не задающий срок
      подтверждения, строится настройкой без кода. Пункт готовности 5а повторяет обе стороны
      дословно — то есть сдача полосы проверяется тем же различителем, а не формулировкой.

  - id: X2
    what: 'раздел открытых вопросов стал ведомостью закрытия'
    verdict: ПРАВИЛО ВЕРНО, ИСПОЛНЕНО НА ПЯТИ ИЗ ПЯТИ; цена названа у пяти из пяти, но у одного — цена НЕ ТОЙ стороны
    the_rule_recorded: >-
      «Вопрос закрывается решением с названной ценой, никогда — удалением, потому что
      удалённый вопрос неотличим от забытого». Правило верное и выведено из случившейся
      ошибки, а не из общих соображений: запись круга 1 объявила В1, В2 и В5 решёнными
      владельцем, решения до автора не дошли, и редакция 2 держала их открытыми, назвав
      расхождение. Вычеркни автор их тогда — расхождение исчезло бы вместе с ними.
    all_five_closed_by_decision: >-
      Проверено по каждому: В1 → Р14, В2 → Р15, В3 → Р8, В4 → Р13, В5 → Р16. Ни один не
      вычеркнут: каждый стоит строкой ведомости с указанием решения и колонкой «цена названа
      в». Раздел не пуст, и это правильно — пустой раздел неотличим от раздела, из которого
      всё вынесли.
    the_one_asymmetry: >-
      Цена названа у всех пяти, но у Р14 названа цена ОТВЕРГНУТОЙ альтернативы, а не
      выбранного хода. Р1, Р2, Р8, Р13, Р15, Р16 говорят, чем платим ЗА СДЕЛАННЫЙ выбор
      (человек подтверждает сам · два экрана вместо одного · четыре ручки и четыре способа
      уронить старт · «когда подтвердили впервые» не восстановить · имя снимается только
      ломающим изменением · ещё одна ручка). Р14 говорит, чем платили бы ЗА ДРУГОЙ
      («включить отказ раньше — переселить тупик с восстановления на обычную работу») и
      добавляет процессное следствие (фаза закрывается двумя документами). Не блокирующее —
      см. non_blocking N2.

  - id: X3
    what: 'три решения владельца, которых не было в круге 1 (Р14, Р15, Р16)'
    verdict: ВНЕСЕНЫ РЕШЕНИЯМИ, НЕ ВЫЧЁРКИВАНИЕМ; фаза объявлена закрывающейся ДВУМЯ документами в трёх согласованных местах
    how_each_lies: >-
      Р14 — «Решение владельца, переданное после круга 1», основание («включить отказ раньше
      производителя — переселить тупик»), обязательный порядок, следствие о двух документах.
      Р15 — ратификация имён, цена названа стороной выбранного хода: «имя, попавшее в
      опубликованный контракт, снимается только ломающим изменением, поэтому выбирается один
      раз». Р16 — своя ручка, основание («восстановление — человек без доступа ПРЯМО СЕЙЧАС;
      подтверждение человек ОТКЛАДЫВАЕТ»), цена («ещё одна ручка и ещё один способ уронить
      старт»), и честная оговорка «величина здесь не называется: её назовёт реализация».
      Ни одно из трёх не есть строка вычёркивания.
    two_documents_declared_consistently: >-
      Проверено на согласованность в трёх местах, потому что расхождение между ними и было бы
      находкой: §3.1 («Фаза #1272 закрывается ДВУМЯ документами, и этот — первый»), Р14
      («фаза закрывается двумя документами, и это записывается здесь, а не выводится») и §10
      строка В1. Все три говорят одно. §3.2 несёт вторую половину строкой с носителем
      («отдельная приёмка фазы #1272, объявленная Р14») и предикатом возврата («посадкой
      этого документа»). Класс «задача, закрытая одним документом из двух, оставила бы вторую
      половину без носителя» назван самим документом — и это ровно тот класс, который §3.2
      ловит у себя самой в строке про уровень.
    my_own_error_named: >-
      Три решения не дошли до автора не по его вине, и моя запись круга 1 объявила В1, В2 и
      В5 решёнными, когда автор о решениях не знал. Это дефект ПЕРЕДАЧИ, не редакции, и
      кругом он не оплачивается автором.

