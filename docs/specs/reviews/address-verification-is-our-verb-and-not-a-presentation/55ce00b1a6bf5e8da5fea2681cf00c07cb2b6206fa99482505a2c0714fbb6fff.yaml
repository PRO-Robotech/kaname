    - id: B4
      genus: COVERAGE
      status: ЗАКРЫТ — и закрыт шире, чем я просил
      how: >-
        Р4 разведена на ДВА хранилища значения (свёртка в строке кода, предъявимое значение
        открытым текстом в строке очереди), получила ЧЕТВЁРТУЮ ногу — энтропию (форма Ф-н,
        сценарий Ф6-29), Ф6-09 назвал свою строку поимённо, близнец Ф6-28 назвал свою, срок
        жизни открытого значения назван в Ф6-20 и в §3.2 с предикатом возврата.
      what_i_verified:
        two_stores: >-
          `invite_mail_outbox/outbox.go:120` кладёт в payload ключ "code", и приходит туда
          `in.Code.Letter()` (`recovery_code_repo.go:146`) — канонический предъявимый код
