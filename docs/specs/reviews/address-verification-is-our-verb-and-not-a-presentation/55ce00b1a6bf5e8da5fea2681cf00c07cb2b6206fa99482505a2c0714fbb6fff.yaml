disclosure_check:
  verdict: ГРАНИЦЫ ДЕРЖАТСЯ — и в документе, и в этой записи
  detail: >-
    §11 проверен по существу, а не по объявлению. Сборки «точная координата + условие +
    следствие» в документе нет: координаты §1, §4 и §6 суть адреса объявлений и механизмов,
    условие и следствие при них не собраны. Значений, свёрток, ручек и секретов нет ни
    образцом, ни формой; адреса примеров — в зарезервированной зоне `example.invalid`
    (перепись реальных доменов по документу → 0). Рабочая директория задачи не названа.
    Состояние линии, названное §0, уже объявлено публично самой линией
    (`docs/content/api/auth-lane.mdx:204-209`, врезка с предикатом) — документ его не
    раскрывает, а ссылается и заводит производителя, который врезку снимет (§9 п. 9).
    ЭТА запись написана тем же правилом: она называет координаты объявлений и чинимые
    дефекты контракта, но шага к использованию не собирает. Замечание B9 названо как дефект
    НЕЗАКРЕПЛЁННОСТИ контракта отказа; абсолютное значение соседа приведено потому, что оно
    уже лежит в публичном дереве в наборе проб, и его сокрытие здесь ничего бы не защитило.

