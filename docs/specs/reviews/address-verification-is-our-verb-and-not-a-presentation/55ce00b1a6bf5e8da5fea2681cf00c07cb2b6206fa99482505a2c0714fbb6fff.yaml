    моё средство; оба разобраны по существу.
  count_closed: 8
  count_open: 0
  items:
    - id: B1
      genus: DoD
      status: ЗАКРЫТ
      how: >-
        §9 п. 6 переписан и разведён по уровням. Newman получил ТОЛЬКО то, что видно на
        проводе без письма: три побайтово равных ответа запроса, фиксированный отказ на
        негодном/просроченном/повторном коде, отказ по частоте, отсутствие носителя сессии.
        Положительный путь ушёл на интеграционный уровень, где значение кода берётся В
        ПРОЦЕССЕ — из намерения письма либо из строки очереди до дренажа.
      what_i_verified: >-
        Наблюдаемая форма утверждения «мёртвая полоса ожила» теперь названа и она
        действительно наблюдаема: «строка очереди письма ВОССТАНОВЛЕНИЯ появилась после
        Ф6-06 там, где до него её не было». Производитель этой строки наш
        (`recovery_code_repo.go:146` → `EmitRecoveryTx`), и выход по полосе
        `case !target.EmailVerified:` до подтверждения строки не оставляет — то есть
        различие до/после наблюдаемо изнутри процесса без почтового ящика. Пункт стал
        измеримым и исполнимым; прежний был измеримым и навсегда «не пройдено».
      leftover: >-
        Строка «новая коллекция newman несёт запись ведомости производителя» дописана и
        стоит там, где нужно, — этот класс уже дважды ронял запрос линии.

    - id: B2
      genus: COVERAGE
      status: ЗАКРЫТ — и закрыт НЕ ТАК, как предписывало моё средство; это верно
      my_prescription_was: >-
        Круг 1 предписывал сценарий «годный код предъявлен для уже подтверждённого адреса →
        момент ПРЕЖНИЙ». Предписание писалось под тогдашнее решение владельца (В4 —
        «не переписывает») и отражало ЕГО, а не мою находку.
      what_the_owner_did: >-
        Владелец РАЗВЕРНУЛ решение на основании того же посева, которым я его и опроверг.
        Теперь в документе стоит ОБРАТНОЕ моему средству: момент ПЕРЕПИСЫВАЕТСЯ, хранится
        момент последнего подтверждения (Р13), сценарий Ф6-26.
      judged_on_the_merits: >-
        ПРАВИЛЬНО, и я подтверждаю это СВОИМ посевом на этой редакции, а не ссылкой на круг 1.
        Оператор единственного писателя —
        `UPDATE users SET email_verified_at = $3 WHERE id = $1 AND email = $2` — условия на
        прежнее значение НЕ несёт. Посев на одноразовом postgres:16-alpine дословно этим
        оператором: первое подтверждение положило 2026-09-01 10:00:00+00 (marked=t), повторное
        положило 2026-09-22 23:00:00+00 (marked=t), в строке осталось ВТОРОЕ, следа первого
        нет. Моё средство требовало бы ВТОРОГО механизма с другим поведением — ровно то, что
        Р10 запрещает на соседней оси. Решение владельца снимает противоречие, а не обходит его.
      surviving_half_of_my_finding_is_in: >-
        Уцелевшая половина находки внесена и внесена честно: §4.2 говорит, что существующий
        держатель Ф-а `TestLoginMethodRepo_VerificationLandsOnlyOnTheVerifiedValue` О ПОВТОРЕ
        МОЛЧИТ, и объявляет Ф6-26 НЕ ИМЕЮЩИМ ДЕРЖАТЕЛЯ. Прочитал пробу целиком
        (`login_method_repo_integration_test.go:301-355`): отметка в ней ставится один раз
        (строка 325), момент сверяется с записанным (строка 329), повторного предъявления нет.
        Объявление «без держателя» верно, и §8 соответственно переводит Ф6-26 в группу,
        которая КРАСНЕЕТ до кода, а не в группу «зелены сегодня».
      control_in_the_other_direction: >-
        Тем же посевом проверено Ф6-13: после смены адреса оператор строки не находит
        (marked=f) — то есть посев умеет давать и «не записалось», и «записалось», и мой
        вывод о переписи не есть артефакт всегда-истинного предиката.

    - id: B3
      genus: COVERAGE
      status: ЗАКРЫТ
      how: >-
        Р8 несёт «величин ЧЕТЫРЕ, и они СВОИ» с названной ценой (четыре новые ручки и четыре
        новых способа уронить старт); сценарий отказа старта — Ф6-27; пункт готовности 1а.
      what_i_verified: >-
        `internal/apps/kaname/api/humansession/rate.go` — `Limits` несёт ровно четыре
        величины (AddressAttempts, AddressWindow, SourceAttempts, SourceWindow), а
        `Limits.Validate()` требует положительной КАЖДУЮ отдельной ветвью switch с отдельным
        текстом. Значит требование Ф6-27 «каждая из четырёх роняет старт ПО ОТДЕЛЬНОСТИ —
