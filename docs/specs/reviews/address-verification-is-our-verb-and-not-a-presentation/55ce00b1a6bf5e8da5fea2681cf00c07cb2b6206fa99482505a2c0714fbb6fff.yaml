blocking:
  count: 2
  genera: [FORMAT, SCOPE]
  repeated_genus_warning: >-
    Род SCOPE повторился со круга 1 (B7 → B9) БЕЗ изменения формы задания автору. Это тот
    признак, при котором править надо задание, а не редакцию, — разбор в
    dispatcher_note_on_the_repeated_genus ниже.
  items:
    - id: B9
      genus: FORMAT
      where: 'Р3 (таблица), Ф6-07, Ф6-08, Ф6-09, Ф6-10, Ф6-22, Ф6-30; §9 п. 6'
      new_in_this_round: true
      my_own_miss: >-
        НАЗЫВАЮ ЧЕСТНО: это моё упущение круга 1, а не регрессия редакции 3. Дефект стоял и
        в редакции 1; я его не поднял. Автор за мой пропуск кругом не платит — но и одобрить
        контракт с ним я не могу.
      claim_under_test: '«Тогда» каждого сценария несёт проверяемый ожидаемый исход'
      finding: >-
        Ни один ОТКАЗ полосы не несёт абсолютного значения. Перепись документа:
        `grep -noE '\b(400|401|403|404|409|412|422|429|500)\b' $D` → ПУСТО. Единственный
        названный код — `200`, и он назван только для успеха. Семейств отказа при этом ТРИ, и
        они разные: отказ предъявления кода (Ф6-07…Ф6-10, «фиксированным текстом»), отказ
        формы (Ф6-30, «отказ формы»), отказ по частоте (Ф6-22, «отказ по частоте
        фиксированным текстом»).
      what_is_pinned_and_what_is_not: >-
        Закреплено ОТНОСИТЕЛЬНОЕ: Ф6-08, Ф6-09 и Ф6-10 равны отказу Ф6-07 «по коду и телу», а
        сам Ф6-07 не закреплён ничем. Абсолютного значения нет ни у одного из трёх семейств,
        и отношение МЕЖДУ семействами тоже не названо: различим ли отказ по частоте от отказа
        предъявления — документ не говорит, хотя для полосы, чьё несущее свойство есть
        неразличимость, это ровно тот вопрос, который обязан быть решён явно.
      why_blocking: >-
        Три причины, каждая самостоятельна. ПЕРВАЯ: §9 п. 6 прямо заказывает newman-кейсы
        «фиксированный отказ на негодном, просроченном и повторном коде (Ф6-07…Ф6-09)» и
        «отказ по частоте (Ф6-22)». Кейс края утверждает ПАРУ — статус и код, — и написать
        его из этого документа НЕЛЬЗЯ: числа в нём нет. Пункт готовности, из которого не
        строится заказанная им проверка, объективного «пройдено» не имеет. ВТОРАЯ: значение
        выберет реализация, и приёмка одобрит контракт, которого не назвала, — а имя и код
        опубликованного отказа снимаются только ломающим изменением (довод самого Р15).
        ТРЕТЬЯ, и она решающая: документ уже потратил целый блокирующий (B5) на класс
        «берёт у образца форму, а число — у другой полосы», и Р5 записала правилом, что
        свойство у соседа НЕ наследуется молча, а объявляется заново. Абсолютное значение
        отказа наследуется здесь молча — тем же классом, который документ полосе запрещает.
      the_value_exists_and_does_not_need_inventing: >-
        Чинится одной строкой, потому что значение уже есть у образца и его не надо
        придумывать: сосед закрепил отказ предъявления как `401` плюс `code 16`
        (`tests/newman/cases/kaname-recovery-lane.py:30` —
        «IAM-RECOVERY-NEG-WRONG-CODE — неверный код с новым паролем → 401 code 16»), и там же
        утверждается «текст отказа фиксирован». Опубликованная страница линии
        (`docs/content/api/auth-lane.mdx`) называет статусы соседних полос (400, 401, 403,
        409), но для `recovery/complete` тоже молчит — то есть пробел у семейства общий, и
        закрывать его надо там, где принимают решение, а не в пробе.
      what_to_do: >-
        Внести в таблицу Р3 абсолютное значение отказа предъявления (статус и код) и
        закрепить его в Ф6-07 как значение, а не как ссылку; Ф6-08…Ф6-10 оставить
        относительными к нему — так и задумано. Назвать абсолютное значение отказа формы
        (Ф6-30) и отказа по частоте (Ф6-22) и СКАЗАТЬ ПРЯМО, различимы ли три семейства между
        собой: если различимы — это решение с ценой (клиент узнаёт, что попал в предел
        темпа); если нет — это решение с другой ценой (человек не отличает «код не тот» от
        «слишком часто») и оно тем более должно быть записано.

    - id: B10
      genus: SCOPE
      where: '§3.2, строка «число производителей записанного уровня сессии»; §10.1'
      repeat_of: B7
      claim_under_test: 'вне объёма — с НОСИТЕЛЕМ и ПРЕДИКАТОМ ВОЗВРАТА по каждой строке'
      finding: >-
        Координаты держателя в предмете нет. `grep -n '343' $D` → пусто; строка 558 несёт
        «задача трекера, заводимая ДО одобрения этой редакции». Держатель при этом СУЩЕСТВУЕТ
        и проверен мною: `PRO-Robotech/kaname#343`, OPEN, «сессия: уровень уверенности пишут
        пятеро, условия на прежний нет». То есть закрыто существо, не закрыт предмет.
      why_blocking_despite_the_substance_being_closed: >-
        Три причины. ПЕРВАЯ: я сужу отпечаток, а не мир вокруг него. Читатель этой редакции
        держателя найти не может — для него строка по-прежнему обещание. ВТОРАЯ: §3.2 вводит
        СВОЙ контракт «носитель и предикат возврата по каждой строке», и строка нарушает
        контракт собственного документа. ТРЕТЬЯ, и она снимает спор: §10.1 объявляет это
        УСЛОВИЕМ ОДОБРЕНИЯ дословно — «пока в строке стоит обещание, а не номер задачи,
        документ одобряться не должен». Редакция, объявившая себя неодобряемой, одобрения
        получить не может: одобрив, я поставил бы вердикт в противоречие с текстом, который
        одобряю.
      severity_stated_honestly: >-
        Правка — ОДНА СТРОКА, и содержимое её уже известно целиком. Тяжесть здесь не в цене
        починки, а в том, что условие одобрения объявил сам документ и подтвердил владелец.
        Если бы FORMAT (B9) не держал возврат сам по себе, я всё равно не смог бы поставить
        ✅ на этот отпечаток — но тогда вопрос «стоит ли круг одной строки» встал бы в полный
        рост, и ответ на него не мой: см. dispatcher_note_on_the_repeated_genus.
      what_the_line_must_carry: >-
        Номер `PRO-Robotech/kaname#343` в колонке «носитель» §3.2 вместо формулы «задача
        трекера, заводимая ДО одобрения»; та же координата в §10.1 вместо «её номер
        вписывается в §3.2 тем, кто её заведёт»; §9 п. 10 строка 3 может остаться «НЕ
        ЗАКРЫТ», но носителя незакрытости теперь надо назвать.
      predicate_of_return_is_sound_but_narrower_than_the_holder: >-
        Проверено отдельно, потому что предикат возврата — половина контракта строки, и
        негодный предикат вернул бы предмет мёртвым. Предикат §3.2 («перепись МЕСТ
        ПРОИЗВОДСТВА уровня: производителем считается место, выводящее уровень из ИМЁН
        способов») работает: `git grep -n 'LevelOf(' -- '*.go' ':!*_test.go'` вне дома правила
        даёт ПЯТЬ мест (change_password.go:229, issue.go:62, second_factor.go:343, :362, :415)
        — то есть перепись печатает 5, а не 1, и предмет виден. Контроль в обратную сторону
        тоже исполним: место, которое уровень ЧИТАЕТ, находится
        (`human_session_repo.go:50`). ЗАМЕЧАНИЕ, не блокирующее: держатель #343 ШИРЕ строки —
        он несёт вторую ось, которой в §3.2 нет, а именно что оператор записи
        (`human_session_repo.go:312`, `UPDATE human_sessions SET … WHERE id = $1 AND ended_at
        IS NULL`) условия на ПРЕЖНИЙ уровень не несёт вовсе, а кардинальность сверяется
        постфактум. Существующий гейт `TestAssuranceLevelHasOneWriterAndOneHome` этого не
        ловит по построению: его предмет — единственность ВЫЧИСЛЕНИЯ значения и дом оси в
        схеме, а не условие ЗАПИСИ (прочитана шапка гейта целиком,
        `internal/check/assurance_level_sole_writer_test.go:1-45`). Держатель шире строки —
        это хорошо, а не плохо; строке достаточно своей оси.

non_blocking:
  - id: N1
    where: §1.6, первый предикат
    subject: 'число, изменившееся оттого, что документ лёг в дерево'
    outcome: ВЫВОД ЦЕЛ, ЧИСЛО ДРЕЙФУЕТ ПО САМОССЫЛКЕ — починка в одну строку
    detail: >-
      §1.6 пишет `git grep -rln 'KACHO_RECOVERY_TIMING'` → «ОДИН файл: сама проба». На
      объявленной ревизии это ВЕРНО и я проверил:
      `git grep -rln 'KACHO_RECOVERY_TIMING' cbbac984` → один файл, проба. На голове
      85b7365a тот же предикат даёт ТРИ: проба, ЭТОТ документ и запись ревью круга 1 —
      потому что оба документа ручку называют. То есть исполнение условия круга 2
      («предмет обязан лежать коммитом») само сломало предикат.
    why_not_blocking: >-
      Это не тот класс, что B8. Там предикат не воспроизводился НА СВОЕЙ ЖЕ ревизии, то есть
      не был прогнан вовсе; здесь он прогнан верно и ревизия названа. И вывод держится
      независимо от числа: перепись по рецептам и рабочим потокам
      (`git grep -rln 'KACHO_RECOVERY_TIMING' -- .github deploy Makefile '*.mk'`) даёт НОЛЬ
      на обеих ревизиях — конвейер прибор действительно не запускает.
    what_to_do: >-
      Сузить единицу так, чтобы она не считала разговор о себе: либо исключить документы
      (`-- ':!docs'`), либо сказать «один НЕ-документный файл». Иначе число будет расти с
      каждым документом, который ручку упомянет, и однажды прочтётся как «конвейер её
      ставит».

  - id: N2
    where: Р14
    subject: 'цена названа — но цена отвергнутой альтернативы, а не выбранного хода'
    outcome: АСИММЕТРИЯ ПРОТИВ СОБСТВЕННОГО СТАНДАРТА ДОКУМЕНТА
    detail: >-
      Р14 объявляет «Основание и цена — дословно» и даёт основание (включить отказ раньше
      производителя — переселить сегодняшний молчаливый тупик с восстановления на обычную
      работу) плюс процессное следствие (фаза закрывается двумя документами). Чем платим за
      СДЕЛАННЫЙ выбор — за разделение и обязательный порядок — не сказано. А платим
      различимым: между посадкой этого документа и посадкой второго отметка производится, но
      не потребляется нигде, кроме восстановления, — то есть инвариант «действие,
      требующее подтверждённого адреса, отвергается» не держится НИГДЕ, и это окно открыто
      ровно на длину второй приёмки.
    why_not_blocking: >-
      Следствие не потеряно: §3.2 несёт строку «отказ на действии» с носителем (отдельная
      приёмка Р14, Ф1 §5) и предикатом возврата («посадкой этого документа»), и там же
      сказано «до тех пор он не заводится, и это решение, а не отсрочка». То есть предмет
      удержан контрактом §3.2; недостаёт одной фразы в Р14, а не держателя.
    what_to_do: >-
      Привести Р14 к стандарту Р1, Р2, Р8, Р13, Р15 и Р16: назвать, чем платим за
      разделение, — окном, в котором инвариант не держится нигде, и его длиной, измеряемой
      второй приёмкой.

  - id: N3
    where: §7 инвариант 2
    subject: '«Пар двенадцать» — счёт верен, перечень смешивает две разные связи'
    outcome: ДЫРЫ НЕТ, ХАРАКТЕРИСТИКА НЕТОЧНА
    detail: >-
      Перебрано по всем 30 меткам: отрицания без близнеца не осталось ни одного. Но перечень
      двенадцати неоднороден. Одиннадцать строк — настоящие пары «отрицание ↔ положительный
      близнец» с различием ровно в один факт, названным в самом сценарии. Двенадцатая —
      «Ф6-11 ↔ Ф6-27 по устройству» — пара СИБЛИНГОВ: они различаются тем, КАКАЯ ручка не
      объявлена (срок кода против четырёх величин темпа), а не одним фактом об одном
      предмете. Симметрично, три настоящие пары в счёт не вошли, потому что живут ОДНОЙ
      меткой со своим отрицанием: Ф6-10 («второй код в тот же срок проходит»), Ф6-22
      («в пределах величины верный код принимается»), и внутренние положительные ветви
      Ф6-11, Ф6-27, Ф6-30.
    why_not_blocking: >-
      Предмет инварианта — «у каждого отрицания есть близнец», и он ИСПОЛНЕН. Неточен
      способ счёта, а не покрытие. Внутрисценарный близнец ничем не хуже межсценарного:
      он в том же «Дано» и тем самым различие в один факт держит строже.
    what_to_do: >-
      Сказать, что связей ДВЕ — межсценарная пара и внутрисценарная ветвь, — и считать их
      порознь; Ф6-11 ↔ Ф6-27 из перечня пар убрать, назвав их тем, что они есть: два
      сценария одного устройства, у каждого свой близнец внутри.

scope_and_boundaries:
  verdict: ДЕРЖАТСЯ — с одной строкой без координаты (B10)
  in_scope_vs_phase: >-
    §3.1 перечисляет восемь предметов и все восемь принадлежат первой половине фазы #1272.
    Спека-книги 00..04 в дереве kaname нет (`docs/specs/` несёт только `reviews`) — этапность
    здесь задаёт декомпозиция Ф1, и документ ссылается на неё поимённо (Ф1-25 заводит
    предмет; Ф1 §5, строка Ф6; Ф1-06 и Ф1-23 для второй половины). Это верный якорь для
    этого дома.
  over_scope: >-
    НЕТ. Перепись §5 по образцу отказа на действии даёт ноль; сценариев полосы входа ключом,
    консоли и АAA-надстроек нет; Ф6-17 и Ф6-18 опираются на СУЩЕСТВУЮЩИЕ глаголы (вход
    паролем и `humansession/step_up.go`), а не на будущую фазу.
  under_scope: >-
    НЕТ по отношению к объявленному объёму. Единственный пункт разбора, оставшийся без
    сценария (число производителей записанного уровня), объявлен вне объёма ЯВНО, решением
    круга 1 и подтверждением владельца, и несёт предикат возврата; недостаёт только
    координаты держателя — B10.
  boundary_rows_checked: >-
    Все семь строк §3.2 проверены на наличие носителя и предиката возврата. Шесть несут
    оба; седьмая (уровень) несёт предикат и не несёт координаты. Строка «код письма лежит
    открытым» проверена особо, потому что заведена этим кругом: носитель назван (решение Ф5
    плюс писатель намерения), предикат возврата назван и ОПИРАЕТСЯ НА СУЩЕСТВУЮЩИЙ механизм
    — уборка доставленных строк очереди заведена
    (`invite_mail_wiring.go:296`, `outbox.StartQueueRetentionSweep`), значит условие
    «уборка перестанет снимать сданную строку» наблюдаемо, а не гипотетично.

coverage:
  verdict: ПОЛНОЕ по объявленному объёму
  detail: >-
    Каждый из восьми предметов §3.1 несёт хотя бы один сценарий; положительный путь покрыт
    Ф6-01 и Ф6-06, и Ф6-01 прямо назван «положительным контролем полосы» с доводом — без
    него Ф6-03, Ф6-04 и Ф6-07…Ф6-10 зеленели бы на подтверждении, не работающем никогда.
    Довод не теоретический: ровно это уже случилось по соседству (моя находка N3 круга 1 —
    положительный кейс соседа сравнивает `unverified` с `no-row`, а не `verified` с
    `no-row`).
  negative_codes: >-
    Словарь кодов gRPC здесь неприменим по построению: предмет — полоса формы по HTTP, а не
    ресурсный API, и форма взята у одобренного соседа (200 на любом исходе запроса,
    фиксированный отказ на предъявлении). Семейства отказа покрыты: негодный и чужой и
    истёкший и применённый (Ф6-07…Ф6-10), отказ формы (Ф6-30), отказ по частоте (Ф6-22),
    отказ старта (Ф6-11, Ф6-27), отказ транзакции (Ф6-05, Ф6-20). Чего им недостаёт —
    абсолютного значения, и это B9, а не пробел покрытия.
  concurrency: >-
    ПОКРЫТО там, где инвариант спорный: Ф6-08 требует, чтобы под конкуренцией ровно одно
    предъявление ставило отметку, и прямо называет механизм — «решение принимает один
    оператор базы, а не проверка-перед-применением» (ban #10). Ф6-13…Ф6-15 закрывают гонку
    «подтверждение против смены адреса» механизмом схемы, и Р10 запрещает заводить вторую
    проверку в коде.
  lifecycle_and_async: >-
    Асинхронная половина выражена не Operation, а очередью письма, и это верно для полосы
    формы: Ф6-05 требует, чтобы ответ не ждал ни чеканки, ни строки очереди, и чтобы отказ
    транзакции не оставлял ни того, ни другого — намерение атомарно со своим предметом.
    Ban #9 здесь не предмет: ресурсной мутации у полосы нет.
  producers: >-
    30 из 30. Ведомость §6 сверена по трём осям: метка без строки — ноль, строка без метки —
    ноль, пригодность — проверена выборочно на четырёх строках, и там, где круг 1 нашёл
    несоответствие рода (Ф6-01 «чеканен код» при производителе-ХРАНИЛИЩЕ), теперь стоит
    форма Ф-н рядом с Ф-д. Производителей вне фазы один (#1773, доставка), и он честно
