        the_fourth_leg: >-
          Форма Ф-н существует и держит ровно то, что ей приписано:
          `internal/domain/recovery_code.go` — `crypto/rand`, алфавит Крокфорда из 32 знаков
          без I, L, O, U (строка 60), `RecoveryCodeLength = 10` (строка 57) → 50 бит, и тип
          НЕ печатается: `String`, `GoString`, `Format`, `LogValue` дают заглушку
          `[redacted recovery code]`, `MarshalJSON` возвращает ОТКАЗ
          `ErrRecoveryCodeNotSerializable`. Утверждения Ф6-29 «заглушка вместо значения» и
          «наружу ровно двумя путями» воспроизводимы на существующем коде.
        the_lifetime_claim: >-
          Утверждение «сданную строку снимает уборка» проверено, а не принято на слово:
          `cmd/kaname/invite_mail_wiring.go:296-304` заводит
          `outbox.StartQueueRetentionSweep` на `clients.InviteMailTable` с ключом партиции,
          и шапка пакета (`outbox.go:17-24`) объявляет то же решение со ссылкой на
          `known-divergences.md` §20 и гейт
          `TestSendTimeStaysQueueLivenessAndOffTheContract` — гейт прогнан, зелен. Значит
          предикат возврата §3.2 («уборка перестанет снимать сданную строку либо срок кода
          станет длиннее срока уборки») опирается на существующий механизм и проверяем.
      note: >-
        Разведение Ф6-09 ↔ Ф6-28 — лучшая конструкция редакции. Пара несёт ПРОТИВОПОЛОЖНЫЕ
