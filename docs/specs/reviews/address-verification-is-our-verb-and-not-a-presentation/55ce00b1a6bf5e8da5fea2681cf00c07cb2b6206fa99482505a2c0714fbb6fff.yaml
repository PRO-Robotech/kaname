dispatcher_note_on_the_repeated_genus:
  genus: SCOPE
  rounds: 'круг 1 — B7; круг 2 — B10'
  task_form_changed_between_rounds: false
  what_this_means: >-
    Род, отвергший работу дважды БЕЗ изменения формы задания, означает, что править надо
    задание, а не редакцию. Автор исполнил круг 1 по существу полностью: он назвал предмет и
    предикат ДОСЛОВНО именно для того, чтобы задачу мог завести кто угодно без этого
    документа, — и задачу действительно завели. Не сработал не автор, а МАРШРУТ: координата
    появилась ПОСЛЕ редакции, у другого исполнителя, и вернуть её в документ было некому.
  what_i_recommend: >-
    Не гонять круг ревью ради одной строки. Форма задания автору должна нести саму строку
    как ДАННОЕ, а не как условие: вместо «строка обязана нести номер задачи» — «в §3.2,
    колонка „носитель“, поставить `PRO-Robotech/kaname#343`; в §10.1 заменить „её номер
    вписывается тем, кто её заведёт“ на ту же координату». Тогда род закрывается вместе с
    FORMAT одним заходом автора, а не отдельным кругом.
  what_i_do_not_decide: >-
    Порядок агентов и число кругов — не мой предмет. Я называю признак и его причину; решение
    о форме задания принимает диспетчер.

