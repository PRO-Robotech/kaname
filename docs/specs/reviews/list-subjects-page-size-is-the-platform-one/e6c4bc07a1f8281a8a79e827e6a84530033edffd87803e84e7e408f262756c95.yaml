blocking: []

minor:
  - id: M1
    kind: CONSTRUCTIBILITY
    note: >-
      Контроль «Дано» для LSP-01…03 отсекает только T < 61, а утверждение LSP-03 («ровно T − 50,
      next_page_token пуст») истинно лишь при T ≤ 99: при T ≥ 100 вторая страница с умолчанием —
      50 с непустым курсором (subjects.go:244 `if len(subjects) == limit`). Посевом T = 61 или 62
      (61 человек + владелец), поэтому сегодня не краснеет, но граница не записана. Правка:
      контрольный шаг — «61 ≤ T ≤ 99, иначе фикстура сломана, сценарий не исполнен».
  - id: M2
    kind: FORMAT
    note: >-
      Строка «вызывающий проходит внешний перехватчик глагола» называет устаревший механизм:
      «каталог требует viewer на кластере, выданный классу authenticated (caller_authority.go:7-17)».
      На a3a53471e каталог для ListSubjects несёт `required_relation: ""` и `scope_filtered: true`
      (internal/apps/kaname/seed/embedded/permission_catalog.json:2723-2731; proto
      authorize_service.proto:149-155 прямо говорит, что прежняя строка viewer-на-кластере
      гейтом не была); внешняя дверь пропускает scope_filtered без вопроса об объекте
      (internal/authzguard/own_door.go:352-354), порог required_acr_min=1 держит acr_floor.go,
      машинная учётка от него освобождена (acr_floor.go:61). Исход сценариев тот же; текст
      писателя исправить, чтобы документ не описывал несуществующий гейт.
  - id: M3
    kind: TWIN
    note: >-
      LSP-09 (403) — дописать «положительный близнец — LSP-05, отличается ровно accountBId
      вместо accountAId». Сейчас назван только LSP-08 (отрицание).
  - id: M4
    kind: PRODUCER
    note: >-
      LSP-10: держатель названа машинно только для числа умолчания
      (TestPageSizeContractNamesTheDefaultTheServiceApplies; `git grep 'default 500'`). Клаузы
      «называет диапазон [0..1000] и отказ INVALID_ARGUMENT» у поля и «комментарий глагола
      называет [0..1000]» предиката не имеют. Предложение для DoD: `git grep -c '\[0\.\.1000\]'
      HEAD -- proto/kaname/cloud/iam/v1/authorize_service.proto` → ≥ 2 и `git grep -n 'Hard cap:
      page size ≤ 1000' HEAD -- proto` → пусто.
  - id: M5
    kind: FORMAT
    note: >-
      Дрейф координат @a3a53471e: callerAuthorityRelations — caller_authority.go:55 (не :53);
      newHandlerWithAuthorizer — handler_test.go:223 (не :229); `if limit <= 0` — subjects.go:202-204
      (не :201-203). Смысл ссылок верен.
  - id: M6
    kind: DoD
    note: >-
      DoD LSP-04…09: «красная на a3a53471e (… LSP-06: текст без поля)» верно, только если дублёр
      стоит ПОД настоящей службой (RelationQueries); если дублёр — сам service.Authorizer, то
      сегодня LSP-06 даёт успех, а не текст без поля (проверка `> 1000` живёт в
      authorize_service.go:1255-1257). Красная в обоих случаях; уточнить уровень дублёра в пробе.
  - id: M7
    kind: FORMAT
    note: >-
      Соседняя приёмка list-page-size-default-named-once.md приведена с отпечатком
      (7d7314a4…cd5e34f — перемерено, совпал), но она DRAFT; на неё опирается лишь
      подкрепляющее число «28 List-глаголов», канон решения — api-pagesize. Не блокирует.

