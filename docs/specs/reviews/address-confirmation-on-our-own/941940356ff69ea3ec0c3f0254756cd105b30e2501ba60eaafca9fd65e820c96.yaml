limits:
  - >-
    О поведении на ПОДНЯТОМ стенде этот круг вердикта не выносит: стенд не
    поднимался. Документ этого и не обещает — он объявляет наблюдаемое; числа
    «80 личностей, 0 подтверждений» из разбора задачи здесь так же не перемерены,
    и §0.5 называет это третьей категорией честно.
  - >-
    Конструируемость «Дано» проверена РАЗБОРОМ дерева и раскладки полос, а не
    ПОСЕВОМ: хранилища подтверждённости на стволе нет (Ф2 П1 не влита), поэтому
    посеять состояние «адрес подтверждён» сегодня нечем ни одному сценарию. Именно
    разбор раскладки полос и дал Б1 — то есть предел назван, но не помешал найти
    неконструируемое.
  - >-
    Вердикт вынесен о редакции 2 ЦЕЛИКОМ (отпечаток 941940356ff6…c96), а не о
    приращении к редакции 1. Записи о редакции 1 не выносилось: круг первый.
  - >-
    Полномочие внешним событием НЕ подтверждено (event.status: not_performed).
    Для CHANGES_REQUESTED это третья категория, а не отказ в вердикте: заключение
    роли действительно, санкции на код не было и нет.

found_on_the_way:
  - >-
    Задач не заводил. Отмечаю для следующего круга: §10 п. 1а называет ТРИ
    расхождения с ID-MAIL-1 и выбирает по каждому исход, а расхождение с Ф1,
    найденное Б2 (ослабление признака вердикта против формулировки Ф1 §9 п.1), в
    §10 п. 1а не попало, хотя §1.4а уже завёл там запись об опровержении ДРУГОГО
    довода Ф1. Оба расхождения с одним соседом стоит вести одинаково — ровно тем
    доводом, которым сам документ объясняет вынос п. 1 из §10: «разное обращение
    с одним соседом было бы не решением, а невниманием».

