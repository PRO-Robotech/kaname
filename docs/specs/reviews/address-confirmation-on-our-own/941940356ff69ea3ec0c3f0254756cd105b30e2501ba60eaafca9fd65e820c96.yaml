# ─── РЕШЕНИЯ: РАТИФИЦИРОВАНЫ ПОИМЁННО ───────────────────────────────────────
decisions_ruled:
  - id: Р1
    ruling: РАТИФИЦИРОВАНО
    basis: >-
      Три исхода задачи рассмотрены, у каждого назван свой довод отказа. Довод
      «рубеж не защищает, а наказывает» опирается на §0.5 и подтверждается замером
      §1.1 плюс раскладкой полос: сессию выдаёт регистрация (- hook: session на
      обеих полосах регистрации), требование стоит на входе — значит
      неподтверждённый живёт внутри срока сессии и запирается при возврате.
  - id: Р2
    ruling: РАТИФИЦИРОВАНО
    basis: >-
      Перечень ВЫВОДИТСЯ: разборщик прогнан, дал 33, и три выпадающих по критерию
      действия совпали с названными. Замер оси (б) по свойству ГЛАГОЛА вместо
      бессрочности состоятелен — ни один из трёх выдаваемых видов к сессии не
      привязан. Обе величины (3 из 33 и 30 вне перечня) названы, как и требует
      корпус. Полнота публичной поверхности проверена встречно: публичных RPC,
      выдающих удостоверение, ровно два.
  - id: Р3
    ruling: РАТИФИЦИРОВАНО ПО СУЩЕСТВУ, форма ведомости — Б3
    basis: >-
      Оба исключения по существу верны, и довод об оракуле существования
      (восстановление) сильнее довода о круговом рубеже — он делает включение
      нарушением уже объявленного контракта Ф1 Р3, а не спорным выбором. Довод об
      исключении запроса кода («отказ, чей следующий шаг — то самое действие,
      которое он отверг, исполнимого исхода не имеет ни при каком входе») точен и
      опирается на действующее правило api-conventions.md. Спор — только о том,
      чем ведомость держится (Б3), а не о составе исключений.
  - id: Р4
    ruling: РАТИФИЦИРОВАНО
    basis: >-
      Код выбран верно: FAILED_PRECONDITION — состояние личности, права есть.
      Пара «HTTP 400 + code 9» соответствует таблице края; оговорка про 412
      («край не производит его ни для одного кода») точна и снимает класс
      утверждения, которое не покраснеет никогда. Форма признака взята у
      единственного объявления домена службы — второго словаря не заводится.
  - id: Р5
    ruling: РАТИФИЦИРОВАНО
    basis: >-
      Три звена и РАЗНЫЕ производители названы честно; «Ф6 не производит поток
      целиком» сказано прямо. Величины перенесены дословно из Ф1 §4.1 (15 мин,
      однократность) — сверено в первоисточнике, строки 577 и 462. Сверх того
      значение 15m подтверждается и действующим объявлением полосы подтверждения
      в шаблоне продукта (lifespan: 15m, use: code), то есть перенос не расходится
      с тем, что стенд делает сегодня.
  - id: Р6
    ruling: РАТИФИЦИРОВАНО, условие 4 задето Б1
    basis: >-
      Порядок несущий и обоснован верно: обратный оставляет продукт без рубежа
      вовсе, и обе половины по отдельности зелены. Четвёртое условие отличено от
      трёх первых правильно — оно стережёт СТАРУЮ границу. Оговорка: его
      доказатель (Ф6-19) задет Б1, и вместе с Б1 надо сказать, чем условие 4
      проверяется до снятия хука.
  - id: Р7
    ruling: РАТИФИЦИРОВАНО
    basis: >-
      Оба гейта ПРОГНАНЫ мной и оба PASS; оба — положительные утверждения, значит
      при снятии предмета краснеют и зовут к себе, как документ и говорит. Выбор
      второго исхода корпуса (перевод на признак, который дерево производит)
      вместо снятия обоснован: предмет MAIL-52 («требование не снимается тихо»)
      переносится вместе с рубежом, а MAIL-16 после переноса становится сильнее.
      Довод подтверждается шапкой самого гейта: «самый дешёвый способ вернуть вход
      при первой неудаче с доставкой — снять требование (это ловит MAIL-52) либо
      выключить поток (это ловит только этот гейт)».
  - id: Р8
    ruling: РАТИФИЦИРОВАНО ПО ЗАМЫСЛУ, область перечисления — Б3
    basis: >-
      Три стороны разведены верно, и довод о том, что первые две молчат на
      действии без строки и без читателя, точен. Требование инъекции по каждой
      стороне с тремя прогонами и с законными близнецами поставлено правильно.
      Не хватает ровно одного — объявленной ОБЛАСТИ перечисления третьей стороны
      (Б3).
  - id: Р9
    ruling: РАТИФИЦИРОВАНО
    basis: >-
      Наблюдение исходом, а не значением, обосновано замером: полей
      подтверждённости в контракте 0 при контроле 18. Довод «значение наружу
      заводит второго читателя, у которого нет экрана, а у экрана нет держателя»
      согласуется с тем, что край подтверждённости не видит (§1.4, 12 полей / 0).
  - id: Р10
    ruling: РАТИФИЦИРОВАНО ПО СУЩЕСТВУ, наблюдаемое задето Б1
    basis: >-
      Предмет решения установлен верно и подтверждён замером: снимаемый хук
      действительно единственная граница окна выкупа — провизион-хук стоит на всех
      четырёх полосах, нагрузка о подтверждённости не несёт ни одного поля, отбор
      идёт совпадением адреса. Различение «расширяется ДОСТУП, а не выкуп» точное.
      Граница «кража приглашения не отменяется задним числом» названа честно, и
      отказ от обратного заполнения обоснован тем, что отличить законный выкуп от
      чужого у активной строки нечем. Спор — только о том, какими сценариями это
      наблюдается (Б1).

