# ─── БЛОКИРУЮЩИЕ ────────────────────────────────────────────────────────────
blocking:
  - id: Б1
    title: >-
      Ф6-19 и Ф6-20 не строятся «той же полосой», дельта пары — ДВА факта, а при
      прочтении «вход» отрицание Ф6-19 зеленеет СЕГОДНЯ, без Р10
    sections: [§3.6, §7 п.2, §7 п.10, §8, Р6 усл. 4, ведомость §5]
    predicate: >-
      (1) Путь выкупа — провизион-хук — стоит ровно на двух полосах регистрации и
      двух полосах входа и НЕ стоит нигде больше:
      git show 45d1719fe:deploy/helm/umbrella/charts/kaname/templates/_kratos-identity.tpl
      | awk '/^    [a-z]+:/{lane=$1} /hooks\/provision/{print NR": "lane}'
      → 356,360,376 registration · 406,421 login; секции recovery/verification/
      settings/logout — ни одного.
      (2) require_verified_address стоит ТОЛЬКО на двух полосах входа — перепись
      MAIL-52, прогнана мной: «полос входа прочитано 2 ([password webauthn]) ·
      из них с требованием подтверждённого адреса 2».
      (3) Ведомость §5 ставит ОБА сценария в «в DoD Ф6» с «исполнимо с Ф2 П1»
      (строки 944–945 документа), то есть БЕЗ снятия хука.
    revision: kacho@45d1719fe · kaname@ef3a707d
    why_blocking: >-
      До снятия хука неподтверждённый доходит до выкупа ТОЛЬКО полосой регистрации:
      на входе его отвергает хук раньше выкупа. Подтверждённый на полосе регистрации
      неконструируем by construction — подтверждение по Р5 идёт ПОСЛЕ регистрации,
      а регистрация заводит личность. Значит «та же полоса» в Ф6-20 не выполнима ни
      при каком входе, а фактическая дельта пары — два факта: подтверждённость И
      полоса. Документ объявляет её одно-фактной в §7 п.2 и §3.0а.
      Тяжелее другого: Given Ф6-19 допускает «вход», и на полосе входа он зелен
      СЕГОДНЯ, без Р10 — выкуп просто не достигается, потому что хук отвергает
      неподтверждённый вход раньше. Тогда отрицание, ради которого заведено
      решение Р10 (инвариант §7 п.10, условие 4 порядка Р6), НЕ МОЖЕТ УПАСТЬ, а
      §8 объявляет его красным до кода — это верно только для полосы регистрации.
      Кейс, который не может упасть, хуже отсутствующего (testing.md §E2E).
    outcomes: >-
      Исхода два. (а) Назвать полосу в Given КАЖДОГО из двух сценариев поимённо:
      Ф6-19 — полоса регистрации (там исход красен без Р10 и условие 4 Р6 получает
      своего доказателя ДО снятия хука), Ф6-20 — полоса входа, и признать дельту
      двухфактной, назвав, почему полоса на исход не влияет (код выкупа общий —
      UpsertFromIdentity на всех четырёх полосах). (б) Оставить пару одно-фактной,
      перенеся ОБА сценария в DoD, где хук снят, — но тогда условие 4 порядка Р6
      теряет доказателя до снятия хука, и Р6 обязан сказать, чем оно проверяется
      вместо Ф6-19. «Оставить как есть» исходом не является: при нынешнем Given
      сценарий допускает прочтение, при котором он зелен без фикса.
  - id: Б2
    title: >-
      §9.1 п.1 называет производителем признака готовности машинную «проверку
      вердикта дома приёмок»; такой проверки нет НИ В ОДНОМ из двух домов, и
      одобренная Ф1 тот же признак формулирует ИНАЧЕ и верно
    sections: [§9.1 п.1]
    predicate: >-
      В доме документа: git grep -hoE 'func Test[A-Za-z_]*' -- 'internal/check/acceptance_*_test.go'
      даёт три гейта приёмок — EditedAfterItsVerdictSaysSo, PathCoordinateResolves,
      ProbeCoordinateResolves; ни один вердикта не читает. Шире:
      git grep -lnE 'APPROVED' -- 'internal/check' → только фикстуры инъекций и гейт
      датировки; git grep -ln 'specs/reviews' -- 'internal' 'scripts' → ПУСТО.
      В воркспейсе: check-01 судит docs/specs/*-acceptance.md (приёмок kaname там
      нет), а check-04 прогнан мной и печатает прямо: «приёмок второго дома в дереве
      продукта нет … их вердикт судит гейт его дома» — то есть сам отказывается
      судить и отсылает к гейту, которого нет. Ссылка check-04 на kaname#11 ведёт на
      ЗАКРЫТУЮ задачу о координатах проб, а не о вердикте
      (gh issue view 11 -R PRO-Robotech/kaname → CLOSED «check: 30 мёртвых координат
      проб в приёмках»).
    revision: kaname@ef3a707d · kacho-workspace@0290f73e9
    why_blocking: >-
      Это первый пункт DoD фазы, и его производителя не существует: признак
      недостижим by construction и закрывает фазу словом, а не фактом. Ровно тот
      класс, который корпус ловит, — документ объявляет механизм, которого нет.
      Отдельно тяжело то, что ОДОБРЕННЫЙ сосед этот же признак формулирует верно:
      Ф1 §9 п.1 требует записи, привязанной к отпечатку, и даёт САМОИСПОЛНИМЫЙ
      предикат (разбор YAML записи с проверкой subject.sha256), прямо оговаривая,
      что судить надо запись, а не шапку. Ф6 заменил исполнимый предикат ссылкой
      на несуществующий гейт — расхождение с одобренным соседом В СТОРОНУ
      ослабления, и §10 п. 1а его не называет, хотя называет три других.
    outcomes: >-
      Исхода два. (а) Переписать п. 1 на форму Ф1 §9 п.1 — предикат, разбирающий
      docs/specs/reviews/<имя>/<отпечаток>.yaml и сверяющий verdict, роль и
