      стенде, где ретранслятор принимает письмо и молча теряет его. Получение приёмником
      утверждает MAIL-04 (ID-MAIL-1: «приёмник получает письмо восстановления», производитель
      #1773) — его Ф5 называет своим Д7. Фраза документа «Ф5-14 … единственный сценарий
      одобренных соседей, который это делает» неточна. НЕ блокирую: Ф5 сама файлит Ф5-14 в
      строку §6 «доставка письма до приёмника» с той же оговоркой («что письмо покидает
      кластер — предмет почтовой задачи»), усл. 2 — условие ПЕРЕВОДА СТЕНДА, держится
      вниманием (документ говорит это сам), а не «Тогда» сценария. Исход: назвать доказателем
      пару Ф5-14 + MAIL-04 (как Ф5 Д7), либо переписать усл. 2 под то, что Ф5-14 производит.
      Класс тот же, что Б-О-4 круга оппонента (названный сценарий утверждает не то свойство),
      второй раз — назван, чтобы третий не оплачивать.
  - id: В10
    title: >-
      «Дано» Ф6-25 говорит «код ДОСТАВЛЕН НА АДРЕС и предъявлен в срок» — доставка до приёмника
      предусловием не является по §5.1 п. 4 и §6, а факт §3.0а зовётся «код получен» и
      строится строкой очереди
    detail: >-
      §5.1 п. 4: «доставка письма ДО ПРИЁМНИКА — не предусловие ни одного сценария Ф6»; §3.0а:
      «код получен — строка намерения письма в очереди, проба читает код из неё, а не из
      почтового ящика». «Дано» Ф6-25 противоречит первому дословно и не названо во втором.
      Смысл ясен (код восстановления Ф5 читается из строки её вида письма), но перечень фактов,
      объявленный «ПОЛНЫМ», этой формы не несёт. Исход: «код получен (строка очереди Ф5) и
      предъявлен в срок».
  - id: В11
    title: >-
      §0.6б цитирует перепись гейта проб «координат 521 → 524 · резолвится 397 → 400»; на
      судимом содержимом гейт даёт 527 · 403, и разница 3 — три имени проб, которые абзац
      переписи САМ добавил после прогона
    detail: >-
      TestAcceptanceProbeCoordinateResolves на aaa48317: «координат 527 · резолвится 403 · в
      чужом доме 124». Имён проб (`Test[A-Z]…`) в документе: редакция 4 (5854cda0) — 7,
      редакция 5 — 10; три добавленных — TestAcceptanceEditedAfterItsVerdictSaysSo,
      TestAcceptancePathCoordinateResolves, TestAcceptanceProbeCoordinateResolves, все в абзаце
      §0.6б, где перепись процитирована. Число, описывающее перепись, сдвинуто самим актом его
      записи — класс «утверждение документа О СЕБЕ, опровергаемое его же содержимым», третий
      раз подряд (Б5, Б6 круга 2). Не блокирую: ни одно решение и ни один пункт DoD на этом
      числе не стоят, а гейт печатает верное сам. Исход: снимать переписи ПОСЛЕ последней
      правки либо писать рядом, что абзац добавляет N координат.
  - id: В12
    title: >-
      §3.0а объявляет «Все шестнадцать фактов строятся В ДОМЕ документа», а строка «живая
      сессия» той же таблицы называет домом PRO-Robotech/corelib:operations
    detail: >-
      Фикстура и вправду в доме службы — проба кладёт личность в контекст напрямую, — но
      делает это пакетом фундамента, и столбец «дом» это и записал. Либо в столбце стоит
      «Ф6 (проба) через corelib:operations», либо утверждение «в доме все» получает оговорку.
      Следствий для оси 2 §5.3 нет: производитель у факта назван.
  - id: В13
    title: >-
      §7 п. 2 объявляет «каждое отрицание стоит в паре» и перечисляет восемь пар — Ф6-10 (отказ
      на повторном предъявлении) и Ф6-11 в перечне нет
    detail: >-
      Близнецы существуют: у Ф6-10 — Ф6-08 (его «Дано» — «код предъявлен успешно (Ф6-08)»),
      у Ф6-11 — Ф6-07 («ответ тот же, что в Ф6-07»). Перечень, объявляющий себя о КАЖДОМ
      отрицании, их не называет; дописать две строки.
  - id: В14
    title: >-
      Однократность кода (Ф6-10) утверждена последовательно; конкурентной формы — два
      предъявления одного кода в полёте → ровно одно проходит — нет ни в §3, ни в §8
    detail: >-
      data-integrity.md §«Чек-лист» п. 5 требует интеграционной пробы с конкурирующими
      транзакциями на спорный путь; однократность кода — атомарный CAS. НЕ блокирую по тому же
      доводу, что В4 круга 2: одобренные соседи на том же предикате конкурентной формы не несут
      (Ф1-29 — «код однократен», Ф5 — ни одного вхождения «одновремен|параллел|гонк»), и
      строгость, которой сосед не подвергался, завела бы расхождение. Исход: строка §8 для
      Ф6-07…11 называет конкурентную форму как замок для integration-tester.
  - id: В15
    title: >-
      §7 п. 14 держится предикатом «вызовов MarkEmailVerified в прод-коде 2» — верно только
      после посадки ОБЕИХ фаз; при посаженной Ф6 без Ф5 верно «1»
    detail: >-
      Инвариант «ровно два писателя» с предикатом «2» покраснел бы (либо, что хуже, не был бы
      заведён) на дереве, где Ф6 посажена раньше Ф5, — а Р5 порядок между ними объявляет
      безразличным. Назвать оба момента: «1 после Ф6, 2 после Ф5; третий — находка».

# ─── РЕШЕНИЯ: РАТИФИЦИРОВАНЫ ПОИМЁННО ───────────────────────────────────────
decisions_ruled:
  - id: Р1
    ruling: РАТИФИЦИРОВАНО
    basis: >-
      Три исхода задачи рассмотрены с доводом отказа у каждого; «рубеж не защищает, а
      наказывает» опирается на §0.5 и раскладку полос поставщика (сессию выдаёт регистрация,
      требование стоит на входе — перемерено: hook: session на обеих полосах регистрации,
      require_verified_address — на двух полосах входа).
  - id: Р2
    ruling: РАТИФИЦИРОВАНО, включая сужение до посадки own с ПЕРЕВЁРНУТЫМ доводом редакции 5
    basis: >-
      Перечень выведен разборщиком (33; в перечне 3 — SAKeyService.Issue, UserService.Invite,
      UserTokenService.Issue; вне 30). Замер (б) свойством глагола: видов 5 − 2, полей сессии 0
      при контроле 24. Довод сужения до own перемерен по трём осям и прочитан ВЕРНО этой
      редакцией: писателей 0 при контроле 5, нагрузка провизиона 3 поля без подтверждённости,
      полей verif* 0 — доказывают, что на external наша колонка чужого состояния не несёт, а не
      что на own его «не производит ничто». Обе стороны оси названы (Ф6-03 · Ф6-23).
  - id: Р3
    ruling: РАТИФИЦИРОВАНО
    basis: >-
      Два исключения по существу; довод об оракуле сверен с Ф1-25/26 и Ф1 Р3; неисполнимость
      отказа на запросе кода — api-conventions.md §«Неисполнимая возможность». Форма запроса
      кода решена (публичный RPC, возвращающий Operation) — 34-й элемент переписи после посадки.
      Различение «исключение из перечня» / «запись ведомости гейта» доведено до конца (Б7).
  - id: Р4
    ruling: РАТИФИЦИРОВАНО
    basis: >-
      Пара «HTTP 400 + code 9» соответствует таблице края; признак — форма П4: сверено чтением
      internal/apps/kaname/shared/reference_refusal.go (status.New(codes.FailedPrecondition)
      + errdetails.ErrorInfo{Reason, Domain: refusaldomain.For(ServiceIAM)}) — синхронный статус
      на пути запроса, и UserService.Invite уже отвечает FailedPrecondition синхронно
      (invite.go: 4 места). Отказ сужен до own тем же замером, что Р2.
  - id: Р5
    ruling: РАТИФИЦИРОВАНО, второй писатель ратифицирован
    basis: >-
      Пять звеньев с разными производителями; граница у Ф5 Р3 и §4.3 сверена дословно;
      отправитель существует (678 · 1 · 3 · 1 · 0). Второй писатель взят по поручению
      одобренной Ф5 (Д8 и строка §6, строка 466 — сверены) и по требованию MAIL-39
      («его адрес после этого подтверждён» — сверено). Путь восстановления кодом на own — наш:
      F4d Д2а Ф5 («поток истекает на own и замещается сбросом… Ф5 есть условие возврата»)
      и Ф5 Р6 «два пути сосуществуют». Довод о безразличии порядка Ф5/Ф6 на own точен.
  - id: Р6
    ruling: РАТИФИЦИРОВАНО ПО СУЩЕСТВУ; доказатель условия 2 — В9
    basis: >-
      Порядок перенесён с «снятия хука» на «перевод стенда на own» верно: на own входа с
      требованием нет by construction (Ф1-06, Ф3), и промежуток без рубежа возникает при
      появлении стенда. Условие 4 имеет доказателя Ф6-19. Держание «вниманием и порядком фаз»
      названо честно. Доказатель условия 2 утверждает не то свойство — В9, не блокирую.
  - id: Р7
    ruling: РАТИФИЦИРОВАНО, оба гейта ПРОГНАНЫ и П2 доказан инъекцией
    basis: >-
      На PRO-Robotech/kacho@45d1719fe (отдельная рабочая копия): П2 PASS «полос входа
      прочитано 2 ([password webauthn]) · с требованием 2»; П3 PASS «стендов объявлено 6 ·
      … включён и не выключен никем 6 · источников 1». ИНЪЕКЦИЯ: снята строка
      `- hook: require_verified_address` с одной полосы входа шаблона → П2 FAIL «полоса входа
      "webauthn" не несёт требования подтверждённого адреса», перепись «2 · с требованием 1»;
      дерево восстановлено, porcelain по deploy → 0, hook снова 2. Держатель настоящий; предмет
      у него — external, уходит с Ф10 (#1276: 17 → 47 файлов deploy/identity_*_test.go).
      Исход первый по корпусу (снять вместе с предметом) выбран верно.
  - id: Р8
    ruling: РАТИФИЦИРОВАНО
    basis: >-
      Три стороны; область равна единице Р2, цена сужения названа числом и перемерена (3 · 2 · 1,
      bootstrap_token поимённо). Ведомость — одна запись с предикатом появления, который
      производит сама фаза; запись о восстановлении снята, а не переименована (Б7). Перепись в
      пять величин и три инъекции с законными близнецами поставлены верно.
  - id: Р9
    ruling: РАТИФИЦИРОВАНО
    basis: >-
      Полей подтверждённости в контрактах 0 при контроле 18; край — 12 полей, о подтверждённости
      0. Наблюдение исходом определено один раз (§3.0).
  - id: Р10
    ruling: РАТИФИЦИРОВАНО ПО СУЩЕСТВУ; конструируемость его наблюдаемого — Б9
    basis: >-
      Предмет перемерен: выкуп по совпадению адреса (FindPendingByEmail 3 · ActivateInvite 6),
      на external границей служит хук на входе (2 полосы), на own границы нет (Ф4 §1.4
      «активирует приглашение, если оно было», Ф4 Р6 «активирует строку», Ф1-23 «сессия годна»,
      Ф1-06 — сверены дословно). Три исхода рассмотрены, выбран (а) с доводом. Сужение до own
      верно, обе стороны названы. Расхождение с Ф4-23 и оговорка о Ф4 §12 п. 4 («решение не
      принимать решение») сверены дословно — Р10 занимает оставленное место. Что не
      ратифицировано — КАК строится «Дано» Ф6-20 и кто производит переход строки: Б9.
  - id: Б-О-2 исход (б)
    ruling: РАТИФИЦИРОВАНО — external не трогается до Ф10
    basis: >-
      Посадочная ось перемерена по трём домам: corelib identityposture/provider.go 74–83
      (External — «личность проверяет внешний поставщик; его адреса обязательны»; Own —
      «проверяем мы сами»; external объявлен переходным), профили продукта
      (identityProvider: external ×2, own ×0, комментарий базового профиля — «сегодняшняя
      посадка ВСЯКОГО развёрнутого стенда … объявлено ПЕРЕХОДНЫМ»), таблица требований
      службы (laneExternal 3 строки о поставщике · laneOwn 7, среди них «дорога к внешнему
      поставщику не строится»). Три довода против (а) состоятельны; цена (б) для арендатора
      external названа прямо и несёт предмет с номером (#1276).

cycle:
  round: 3
  blocking_round_1: 4
  blocking_round_2: 4
  blocking_round_3: 1
  converging: 'ДА по числу (4 → 4 → 1) и ДА по предмету'
  note: >-
    Все четыре блокирующих круга 2 закрыты (подтверждено тем же опытом на редакции 5), все
    четыре находки третьего оппонента подтверждены и закрыты. Единственное блокирующее этого
    круга — новое, о конструируемости «Дано» одной пары, и закрывается текстом и решением
    автора без ожидания чужой фазы. Вторая величина признака приостановки —
    метка блокировки у задачи — ОТСУТСТВУЕТ: #1272 OPEN с метками bug,P2,size:S,area:iam,
    release:identity-own, `blocked` среди них нет. Приостановка цикла не показана.
  class_rejected_twice: >-
    Класс круга 2 «признак готовности, недостижимый by construction» (Б3 → Б7) этим кругом НЕ
    воспроизвёлся — перепись по предикатам появления предмета в форме задания сработала.
    Второй класс круга 2, «утверждение документа О СЕБЕ, опровергаемое его же содержимым»,
    воспроизвёлся ТРЕТИЙ раз (Б5, Б6 → В11), теперь в неблокирующей форме: число переписи
    сдвинуто самим абзацем, который его цитирует. В форму задания на редакцию 6 переезжает
    шаг: переписи гейтов снимаются ПОСЛЕ последней правки текста, либо рядом с числом стоит
    вклад самого абзаца.
    Новый класс этого круга — «фикстура „Дано" и механизм „Тогда" разошлись у сценария о
    ПЕРЕХОДЕ строки, а не о чтении состояния» (Б9). Проверяется одним вопросом к каждому
    сценарию, чьё «Тогда» — изменение сохранённого состояния: даёт ли названная фикстура этот
    переход при ЛЮБОМ допустимом устройстве продукта.

