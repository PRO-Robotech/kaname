# ─── БЛОКИРУЮЩИЕ ────────────────────────────────────────────────────────────
blocking:
  - id: Б9
    title: >-
      «Дано» Ф6-20 («адрес A подтверждён») строится, по §3.0а, ПРЯМОЙ ЗАПИСЬЮ колонки — а
      «Тогда» Ф6-20 («приглашение выкуплено, строка ACTIVE») по Р10 производит АКТ подтверждения
      (Ф6-08 либо Ф6-25). Названная фикстура даёт объявленный исход только при механизме,
      которого документ не называет; при другом — сценарий красен на продукте, исполняющем Р10
      дословно
    sections: ['§3.0а строка «адрес подтверждён»', '§3.6 Ф6-19/Ф6-20', 'Р10', '§8 строка Ф6-19/20', '§7 п. 14']
    predicate: >-
      Два места об одном предмете внутри документа: §3.0а — «значение users.email_verified_at
      (NULL ↔ момент) — прямая запись»; Р10 — «Момент выкупа — подтверждение адреса (Ф6-08 либо
      Ф6-25)»; §3.6 — «свойство утверждается о СОСТОЯНИИ, а не о пути»; §8 — «состав членства до
      и после ПОДТВЕРЖДЕНИЯ»; §7 п. 14 — писатели считаются ВЫЗОВАМИ `.MarkEmailVerified(`.
      Замер на ветке Ф2 П1 (origin/issue-1268-p1-login-method, там, где документ строит
      это «Дано»): писатель — метод хранилища LoginMethodRepo.MarkEmailVerified, оператор
      `UPDATE users SET email_verified_at = $3 …` (internal/repo/kaname/pg/login_method_repo.go,
      строки 132–148); триггер на колонке ровно один — СНИМАЕТ отметку при смене адреса
      (миграция 20260915111233…, строка 105: `NEW.email_verified_at := NULL`), триггера на
      переходе NULL → момент нет; собственные пробы ветки строят «подтверждён» именно прямой
      записью `UPDATE kaname.users SET email_verified_at = now()` — четыре места в
      login_method_schema_integration_test.go (строки 347, 402, 608, 807). Сегодня активацию
      PENDING-строк делает заведение зеркала (UpsertFromIdentity → ActivateInvite, §1.8: 3 · 6),
      и к колонке она не привязана ничем.
      Отсюда исход фикстуры: проба, построившая «подтверждён» прямой записью (форма §3.0а и
      форма собственных проб Ф2 П1), увидит «строка ACTIVE» ТОЛЬКО если выкуп ложится на
      переход колонки на уровне базы; если выкуп исполняют use-case двух писателей после
      MarkEmailVerified (естественное чтение «момент — предъявление кода» и счёта писателей
      вызовами), проба красна на продукте, исполняющем Р10 дословно. Для Ф6-02/04/22/25 та же
      фикстура годна — там «Тогда» ЧИТАЕТ состояние; для Ф6-20 «Тогда» есть ПЕРЕХОД строки,
      и его производителя документ не назвал.
    revision: kaname@aaa48317 · ветка origin/issue-1268-p1-login-method
    why_blocking: >-
      Это ровно вопрос конструируемости, который ревьюеру предписано задавать отдельно: не
      «описано ли состояние», а «даёт ли названная фикстура объявленный исход». Здесь ответ
      зависит от решения, которого в документе нет, и две его половины уже отвечают по-разному
      (§3.0а — колонка; §8 — акт). Исполнитель, реализовавший Р10 в use-case, и
      integration-tester, построивший «Дано» по §3.0а, получат красный Ф6-20 на верном
      продукте — и «сценарий неверен, а не продукт» обнаружится посевом, а не третьей
      вычиткой. Пара Ф6-19/20 несущая: на ней стоят Р10, Р6 усл. 4, §7 п. 10 и §9.1 п. 6.
      Отдельно: если выбран исход «о состоянии», то писателей у выкупа становится столько же,
      сколько у колонки, включая разовый перенос Ф2 П3, — и это надо сказать, а не оставить
      следствием.
    outcomes: >-
      Исхода два, оба закрываются текстом и решением автора. (а) «Дано» Ф6-20 строится АКТОМ:
      «адрес A подтверждён предъявлением кода (Ф6-08)», дом — Ф6; строка §3.0а получает
      оговорку, что для сценариев о ВЫКУПЕ фикстура — акт, а не колонка; дельта пары остаётся
      одно-фактной (подтверждённость), и §8 уже читается так. (б) Р10 решает, что выкуп —
      функция СОСТОЯНИЯ колонки и держится на уровне базы: активация PENDING-строк по совпадению
      адреса ложится тем же оператором, что переход email_verified_at из NULL (ban #10,
      within-service инвариант), — тогда прямая запись годная фикстура для любого писателя,
      а §7 п. 14 переформулируется как «два вызывающих одного оператора». «Оставить как есть»
      исходом не является: две половины документа уже дают разные вердикты одной пробе.

