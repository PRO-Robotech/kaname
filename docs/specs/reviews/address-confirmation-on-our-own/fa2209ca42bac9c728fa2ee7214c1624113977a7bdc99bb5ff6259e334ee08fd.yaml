      `JOIN kaname.access_bindings b … WHERE b.status = 'ACTIVE' AND (b.expires_at IS NULL OR
      b.expires_at > now()) AND b.revoked_at IS NULL`. Вердикт читает СТРОКУ выдачи напрямую;
      «материализация» (`invite.go:629 EmitReconcileEvent(… "iam.accessBinding" …)`) — родословная
      объекта привязки для Get/Delete по ней, глагол по проекту от неё не зависит. (2) Носитель
      ожидания в схеме: `0001_initial.sql:1608 status text DEFAULT 'ACTIVE'`, `:1631 CHECK
      (status = ANY (ARRAY['PENDING','ACTIVE','REVOKED']))`; писателей `PENDING` в прод-коде — 0
      (`git grep -n AccessBindingStatusPending -- 'internal/**/*.go' ':!*_test.go'` → enum, Validate,
      две проекции). (3) Дискриминатор «положена приглашением»: `invite.go:598–607` пишет id,
      subject, role_id, resource, target; `access_binding/create.go:167` — те же поля плюс
      `GrantedByUserID` из принципала; столбца «положена по адресу/по id» нет
      (`0001_initial.sql:1600–1619`), `granted_by_user_id` у приглашения — `''` (не контракт, а
      дефект аудита, kaname#262). `MembershipService.Create` — тот же use-case
      (`membership/create.go:14`). (4) В документе: `grep -n 'access_bindings.status\|b\.status'`
      → 0; `grep -n 'relverdict'` → 1 (:1132, контроль «не читает invite_status|memberships» —
      верно, но ЧТО читает, не сказано); «не материализована» — :1851, «материализуется она сразу
      после фиксации» — :1836, «объекты выдачи и её материализации Ф4 и линия не пишут и не
      переписывают» — :1852.
    revision: kaname@9e0b097c (дерево 783da6f8 = a154796c + ветка; internal/ равно линии)
    why_blocking: >-
      Три части, каждая достаточна. (а) Правило, объявленное «одним объявлением базы», обязано
      отличать выдачу приглашения от выдачи по `id` — §6 и (д) требуют этого явно («выдача по id
      ожидания не получает»), — а по схеме их строки неразличимы: правило базы в объявленной форме
      НЕКОНСТРУИРУЕМО без нового объекта, которого документ не называет. Исполнитель обязан будет
      выбрать сам: завести носитель признака (объект, не названный ни в Р10, ни в §8 — тот же класс,
      что Б10 четвёртого оппонента: «на уровне базы» без единого объекта), либо расширить область
      на всякую выдачу субъекту без отметки (меняет §6 и контракт — выдача по id тоже ждёт), либо
      ставить ожидание в use-case приглашения (нарушает §7 п. 15 «вторая копия — находка», которое
      гейт будет держать). Выбор меняет КОНТРАКТ (область правила), а не устройство, поэтому он
      не «деталь реализации», а незакрытый вопрос приёмки. (б) Состояние (д) «выдача ожидает» —
      новое состояние, которое решение гейтит; форма задания круга 4 требовала для КАЖДОГО такого
      состояния перечень его читателей в прод-коде, и для (д) он не сделан: единственный читатель
      выдачи на пути вердикта (`b.status = 'ACTIVE'`) в §1.8 не назван — при том что он и есть
      производитель «отказа прав» для строки в `PENDING`, то есть ровно то, что делает исход (а)
      дешёвым и держимым без второго читателя. Не назвав его, документ подталкивает ко второму
      читателю в use-case — классу, который сам запрещает. (в) «Тогда» Ф6-19 (3) и Р10 (д)
      объясняют отказ отсутствием материализации; на пути вердикта материализации нет — это
      утверждение о дереве, опровергнутое чтением композиционного корня, и под APPROVED оно
      санкционировало бы пробу, ждущую «нематериализованности» там, где судит столбец. Отдельно
      довод §6 «угрозы „чужой предъявитель адреса“ в выдаче по id нет by construction» ложен
      частично: на пути 1 строку личности занимает предъявитель чужого адреса (сам документ, Р10
      §«Судьба строки»), и выдача по `id` ЭТОЙ строки распорядителем достаётся ему же —
      «by construction» здесь ничего не доказывает; область правила надо выбирать доводом, а
      не этой фразой.
    outcomes: >-
      Исходов три, «оставить как есть» не исход; при любом — «не материализована» в Ф6-19 (3),
      Р10 (д) и §8 заменяется тем, что вердикт читает. (а) НАЗВАТЬ ОБЪЕКТЫ: носитель ожидания —
      `access_bindings.status = 'PENDING'` (столбец и его читатель на вердикте существуют, писателя
      заводит Ф6 — как у членства, правилом базы на вставке и переходом по отметке); дискриминатор
      «положена приглашением» — объект, который Ф6 заводит (столбец/признак строки выдачи, пишет
      глагол приглашения; ban #5 — новой миграцией), и правило судит по нему; §1.8 — третья
      перепись дополняется читателем `b.status` и его действием (отказ прав); §8 — красное до кода:
      после приглашения строка выдачи `ACTIVE` и глагол проходит; зелёное — `PENDING` → `ACTIVE` тем
      же переходом, что отметка; §7 п. 15 — «одно объявление» покрывает оба предмета одной
      функцией, и это сказано с именами. (б) РАСШИРИТЬ область: всякая выдача субъекту с нашей
      чеканкой без отметки ожидает — тогда §6 строка снимается, (д) и §0.2 переписываются, цена
      названа (распорядитель, выдавший по id неподтверждённому, ждёт отметки), и довод «угрозы
      нет by construction» снимается вместе с ней. (в) ОЖИДАНИЕ СТАВИТ ГЛАГОЛ приглашения
      (use-case) — тогда §7 п. 15 и «не вторая копия» переписываются честно, и это названное
      отступление от Р10 (б) с доводом, почему у выдачи иначе нельзя. Исход выбирает автор
      решением; рецензент предмет не проектирует.

