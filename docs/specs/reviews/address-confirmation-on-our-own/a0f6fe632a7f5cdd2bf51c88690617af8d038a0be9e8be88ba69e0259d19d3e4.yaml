    OPEN с метками bug,P2,size:S,area:iam,release:identity-own. Приостановка цикла не показана;
    рост числа — от углубления разбора (код, а не текст), а не от несходимости.
  class_rejected_twice: >-
    Класс круга 3 «фикстура „Дано“ и механизм „Тогда“ разошлись у перехода» (Б9) — НЕ
    воспроизвёлся: перепись оси 3 и объекты Р10 сработали. Класс «утверждение документа О
    СЕБЕ» — ЧЕТВЁРТЫЙ раз (Б5, Б6, В11, В18/В19), по-прежнему в неблокирующей форме. Два НОВЫХ
    класса этого круга, и оба переезжают в форму задания на редакцию 8: (1) «звено, взятое у
    соседа, названо ИМЕНЕМ ФАЙЛА, а не ВЕТВЬЮ КОДА, которую предмет требует» (Б13) —
    противоядие: по каждому чужому звену назвать держателя соседа (гейт) и прогнать его на
    инъекции своего предмета; (2) «решение стережёт состояние, которого продукт для ОТКАЗА не
    читает» (Б14) — противоядие: по каждому состоянию, которое решение гейтит, перечислить всех
    его читателей в прод-коде и действия, которые они отвергают; пустой перечень значит, что
    решение не гейтит ничего, — и отдельно перечислить ВСЁ, что пишет тот же глагол, а не
    только строки, названные документом.

