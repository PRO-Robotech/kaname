      в задаче с предикатом «строк ACTIVE/BLOCKED без головы полосы 0»); либо запись у F4d, если
      автор считает, что F4d-52 своим близнецом обещал обратное. Класс — «утверждение о чужом
      документе без цитаты», тот же, что Б10 (2) с обратным знаком.
