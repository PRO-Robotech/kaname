      перестаёт числиться ожидающей», Ф1-20 — «адрес числится неподтверждённым»; обе цитаты
      дословны. Оговорка про Ф4 §12 п. 4 («решение не принимать решение») сверена дословно и
      верна — Р10 занимает оставленное место, а не отменяет чужое решение.

cycle:
  round: 2
  blocking_round_1: 4
  blocking_round_2: 4
  converging: 'НЕТ по числу; ДА по предмету — обе величины названы ниже'
  note: >-
    Число блокирующих не убыло: четыре и четыре. Вторая величина, требуемая
    multi-agent-flow-orchestration.md §«Круг не запускается там, где ПРЕДМЕТА ещё нет», —
    метка блокировки у задачи — ОТСУТСТВУЕТ: `#1272` OPEN с метками bug,P2,size:S,area:iam,
    release:identity-own, `blocked` среди них нет. Значит приостановка цикла не показана:
    признак требует ОБЕИХ величин, и вторая отрицательна.
    По предмету круг сходится: все четыре блокирующих круга 1 закрыты (три полностью, Б3 —
    частично, остаток в Б7), и все четыре блокирующих этого круга закрываются ТЕКСТОМ И
    РЕШЕНИЕМ автора, не ожиданием чужой фазы. Ни одно не требует Ф2, Ф3, Ф4, Ф5 или `#1773`.
  class_rejected_twice: >-
    Один класс отверг работу ВТОРОЙ раз подряд и потому назван отдельно
    (multi-agent-flow-orchestration.md §«Класс, отвергший работу ДВАЖДЫ, переезжает в форму
    задания»): «признак готовности, недостижимый by construction» — Б3 круга 1 и Б7 этого
    круга. Круг 1 нашёл его в отсутствии ОБЛАСТИ; круг 2 — в предикате появления предмета,
    который названная фаза не производит. Форма задания на редакцию 4 обязана нести шагом
    ПЕРЕПИСЬ ПРОИЗВОДИТЕЛЕЙ по каждому предикату появления предмета, а не только по «Тогда»:
    предикат истечения послабления есть то же утверждение о производителе, и проверяться
    обязан тем же способом.
    Второй класс повторился ВНУТРИ круга дважды (Б5 и Б6) и назван здесь, чтобы третий раз не
    оплачивать: «утверждение документа О СЕБЕ, опровергаемое его же содержимым». Оба
    опровергаются собственными предикатами документа, прогнанными один раз.

