verification:
  method: >-
    исполнение каждого предиката документа в ТОМ дереве, которое он называет (kaname
    @f8c5a370 и ветка origin/issue-1268-p1-login-method, kacho @45d1719fe и рабочая копия,
    kacho-workspace @9116ca0fe), плюс встречные замеры, которых документ не объявлял:
    предикат §10 п. 4 на ЧЕТЫРЁХ ревизиях и отдельно по вкладу самого документа; разбор
    столбца «Given» всех 23 сценариев; разбор столбца «исполнимо с» ведомости §5; объём
    одобренной Ф5 §4.1 и §4.2 против названного предиката появления предмета; состав
    use-case, пишущих строку удостоверения, с проверкой client_token; ключевание находок
    в судье гейта истории.
  subject_digest_matches_current_document: true
  header_left_untouched: true
  prior_records_untouched: true
  document_untouched: true
  neighbours_opened: >-
    Ф1, Ф4, Ф5 (PRO-Robotech/kaname, origin/main) и ID-MAIL-1 (PRO-Robotech/kacho-workspace
    @9116ca0fe) — все четыре одобренные, все прочитаны в первоисточнике; восемь цитат сверены
    дословно: Ф1 §5 строка Ф6, Ф1 §5 строка Ф3, Ф1-20, Ф1 §9 п. 1, Ф4-23, Ф4 §12 п. 4,
    Ф5 Р3, Ф5 §4.3, ID-MAIL-1 MAIL-01, MAIL-03 и §11 шаги 6–7.

limits:
  - >-
    О поведении на ПОДНЯТОМ стенде этот круг вердикта не выносит: стенд не поднимался.
    Документ этого и не обещает — он объявляет наблюдаемое.
  - >-
    Конструируемость «Дано» проверена РАЗБОРОМ дерева и раскладки полос, а не ПОСЕВОМ:
    хранилища подтверждённости на стволе нет (Ф2 П1 не влита), поэтому посеять состояние
    «адрес подтверждён» сегодня нечем ни одному сценарию. Предел назван, но не помешал:
    именно разбор раскладки полос подтвердил закрытие Б1, а разбор объёма одобренной Ф5 дал
    Б7.
  - >-
    Сверка перечня фактов §3.0а с «Дано» §3 сделана ЧТЕНИЕМ, а не машинно: факт назван прозой,
    а не меткой, и документ это оговаривает сам. Отсюда В7 — находка чтения, а не предиката.
  - >-
    Вердикт вынесен о редакции 3 ЦЕЛИКОМ (отпечаток 830ac6dba686…287), а не о приращении к
    редакции 2. Запись круга 1 не редактировалась и не удалялась — рядом положена соседняя.
  - >-
    Полномочие внешним событием НЕ подтверждено (event.status: not_performed). Для
    CHANGES_REQUESTED это третья категория, а не отказ в вердикте: заключение роли
    действительно, санкции на код не было и нет.

found_on_the_way:
  - >-
    Задач не заводил. Отмечаю для оркестратора: краснота гейтового набора дома (Б8) владельца
    не имеет и этой полосе не принадлежит — оба исхода, названные самим гейтом, запрещены
    и автору, и рецензенту. Пока предмет не заведён, ЛЮБОЙ прогон набора в этом дереве красен
    по причине, не относящейся ни к документу, ни к работе исполнителя.
  - >-
    Круг 1 назвал ЧЕТЫРЕ use-case, выдающих удостоверение, редакция 3 и мой перемер дают ТРИ.
    Расхождение разрешено уточнением единицы, а не выбором: client_token строк удостоверения
    не пишет вовсе и публичным `Operation`-RPC не является. Отмечаю, потому что число круга 1
    было названо без предиката и могло бы уехать в следующее задание фактом.

