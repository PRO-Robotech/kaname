blocking_closed:
  - id: B1
    kind: PRODUCER
    how: >-
      Р1а: Revoke/Delete → `<exempt>` · HANDLER_DECIDES, прежний вопрос двери (v_delete на
      iam_access_binding) переезжает в обработчик тем же портом и надзором администратора
      облака (own_door.go шапка, checkAdapter); делегированный путь — после прежних. Отказ двери
      на этих RPC — `permission denied` без hide_existence (catalog записи без флага;
      corelib interceptor.go:216), поэтому отказ обработчика побайтово тот же (GD-30 f).
      Держатели через слушатель — GD-32 (doorUnder, own_door_test.go:65-72) и GD-E5;
      расширение поверхности (+6 освобождённых, «освобождённых 19» в шапке own_door.go)
      названо в критерии безопасности; acr-пол — отдельный перехватчик (acr_floor.go), «2»
      сохраняется. Делегат не получает v_delete материализацией: объектные глаголы выдачи
      приезжают реконсайлом по ролям с правилами на iam.accessBinding (create.go:482-492), а
      делегат выдач не держит (GD-15).
  - id: B2
    kind: PRODUCER
    how: GD-30 a утверждает revokedByUserId = sva-iss; производитель revoke.go:119 + principal.go:72-74. Замечание круга 1 снято как ошибочное.
