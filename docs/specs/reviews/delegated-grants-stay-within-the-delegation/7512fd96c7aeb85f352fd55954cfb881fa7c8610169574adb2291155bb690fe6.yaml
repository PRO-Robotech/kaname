    Подтверждена. (1) Существующий писатель: `auditTenantAccountID` отдаёт аккаунт только при
    `ResourceType == "account"`, иначе "" (helpers.go:36-41); "" уходит в столбец NULL через
    `nullableString(ev.TenantAccountID)` (pg/access_binding_repo.go:1488) — утверждение «у Bo
    NULL, как сегодня» производимо существующим кодом. Тот же помощник пишет AccountId
    метаданных операции (create.go:325, revoke.go:125, delete.go:149, update.go:182) — оговорка
    Р5 о метаданных обоснована. (2) B10/B13/B14 и Bo — на prj-A (тело V :622, GD-10 a :765,
    GD-30 Given), prj-A ∈ acc-A (мир Д :560). (3) §7: новый предикат на 313042dcb выдаёт 0
    (`grep -c '"gdl"' "$(go list -m -f '{{.Dir}}' github.com/PRO-Robotech/corelib)/ids/ids.go"`
