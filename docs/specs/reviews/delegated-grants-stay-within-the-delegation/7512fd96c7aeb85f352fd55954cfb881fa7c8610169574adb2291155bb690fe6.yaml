important_nonblocking:
  - "Р5, последнее предложение: «Строки выдач без `delegationId` и `accountId` в метаданных операции — прежним писателем» допускает чтение «выдач без delegationId и без accountId». Смысл (подтверждён возвратом автора) — два предмета: строки аудита выдач без delegationId И AccountId в метаданных операции (в т.ч. у делегированных выдач) остаются за `auditTenantAccountID`. Полосе реализации — держать метаданные операции прежними; при следующей правке приёмки развести предложение на два."
  - "Р5 объявляет tenant_account_id = аккаунт делегирования и у УДАЛЕНИЯ (`Delete`) делегированной выдачи, а GD-70 утверждает только выдачу, Revoke и отзыв делегированием. Глубина та же, что у `delegation_id` при удалении, принятая кругом 2; держатель для Delete-строки в integration-пробе GD-70 желателен (шаг Delete B10' по GD-30 c), не блокирует."
