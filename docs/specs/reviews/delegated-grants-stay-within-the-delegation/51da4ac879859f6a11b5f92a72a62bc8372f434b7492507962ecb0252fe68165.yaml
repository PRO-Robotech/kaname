premise:
  task_premise: >-
    Подтверждена в части, проверенной рецензентом: три пути права выдавать
    (helpers.go:155 requireGrantAuthority; Path 0 IsClusterAdminE, Path 1 :239, Path 2
    fgaHoldsScopeAdminE → relations.Check «admin» :320); отзыв действует с коммита
    (delete.go:23-31 «ОТЗЫВ ДЕЙСТВУЕТ С КОММИТА») — поэтому GD-20 детерминирован после `done`.
    «Правило R4» рецензент не искал повторно — принято допущение А1 автора, вопрос В2 открыт.

blocking:
  - id: B1
    kind: PRODUCER
    scenario: GD-30 a, c (и e — в части «побайтово равна b»); GD-41 a; через §5.3 — SRI-65, SRI-67, SRI-71
    claim: >-
      Отзыв и удаление выдачи делегатом при названных производителях не производятся.
      `AccessBindingService.Revoke` и `Delete` несут пообъектную аннотацию `v_delete` на
      `iam_access_binding:<access_binding_id>` (access_binding_service.proto:67-68, :419-420;
      permission_catalog.json:2539-2545), и её на арендаторском слушателе исполняет собственная
      дверь kaname `authzguard.NewOwnDoor` (cmd/kaname/serve.go:885; own_door.go:39-49 «карта
      ТОТАЛЬНА … незамапленный отвергается»). Делегат (sva-iss) отношений на объекте выдачи не
      держит — это утверждает сам документ (Р3, GD-15: выдач с субъектом sva-iss 0). Значит
      Revoke B10 от sva-iss отвергается дверью ДО use-case, и правка `revoke.go:105` /
      `delete.go:125`, названная в §5.1 производителем GD-30, до вызова не доходит; GD-41 a
      вместо текста deletion_protection получит отказ двери. Интеграционные пробы, вызывающие
      use-case напрямую, позеленели бы при неработающем глаголе на настоящем слушателе.
    measured: >-
      Прочтено @5c6b7c078: access_binding_service.proto:61-68, :413-420;
      permission_catalog.json:2539-2545; serve.go:870-893; own_door.go:20-60;
      fga_model.fga `type iam_access_binding` (v_delete: [user, service_account, group#member]
      or super_admin).
    fix: >-
      Назвать производителя прохода двери и включить его в §3 и критерий безопасности: либо
      аннотация Revoke/Delete → решает обработчик (`<exempt>`/HANDLER_DECIDES, как у Create —
      это расширение поверхности, назвать в «безопасность» и держать отрицаниями GD-30 b/d и
      посторонним без права), либо иной путь, совместимый с Р3. Держатель GD-30/GD-41 a —
      проба через слушатель (или newman-кейс S2), а не только вызов use-case.
  - id: B2
    kind: PRODUCER
    scenario: GD-30 a («ключа `revokedByUserId` нет»)
    claim: >-
      Существующий писатель отзыва на вызывающем-учётке пишет не пусто: `actor =
      PrincipalUserID` → пусто, затем подстановка `binding.GrantedByUserID` (у выдачи делегата
      пуст, GD-10) → `"system:revoke"` (revoke.go:185-198). Контракт перечисления это
      закрепляет: `REVOCATION_REASON_REVOKE — revoked_by_user_id — вызывающий`
      (access_binding.proto:258). §5.1 правки этого поведения не заказывает, Р4 говорит только
      об отзыве делегирования. «Тогда» GD-30 a названным производителем не производится.
    measured: прочтено @5c6b7c078 revoke.go:185-198, access_binding.proto:252-266.
    fix: >-
      Либо утверждать фактическое значение (`revokedByUserId: "system:revoke"`), либо заказать
      смену подстановки как изменение контракта (затрагивает ВСЕ отзывы учёткой, не только
      делегатом) с производителем, близнецом и записью в Р6/Р4.
  - id: B3
    kind: PRODUCER
    scenario: GD-61 c
    claim: >-
      Пара «производитель — текст» несогласована. Названный производитель
      `shared.ValidatePagination` (pagination.go:60-62) отвечает сообщением
      `Illegal argument page_size`; `corevalidate.PageSize` (corelib v1.15.0 validate.go:250-253)
      — сообщением `invalid argument` с описанием нарушения поля
      `page_size must be in [0..1000] (0 means default)`; сообщение `page_size must be in …`
      даёт лишь репозиторий (internal/repo/kaname/pg/helpers.go:28). Документ отмечает это как
      исправленное в редакции 1, но ссылка :60 указывает на другой текст.
    measured: >-
      Прочтено: pagination.go:60-91; corelib errors.go:80 (`invalid argument`), validate.go:249-259;
      pg/helpers.go:28.
    fix: >-
      Назвать один производитель (для `List` по правилу — сырой формат до права,
      `ValidateRawPagination`) и утверждать его форму: сообщение + `BadRequest.field_violations[0]`
      (`field='page_size'`, описание дословно).
  - id: B4
    kind: COVERAGE
    scenario: Р2 п.5, Д6 — нет ни одного сценария
    claim: >-
      Граница «группа — из аккаунта делегирования, человек — участник аккаунта» не держится ни
      одним сценарием: в D1 `subjectTypes = {SERVICE_ACCOUNT, SYSTEM_CLASS}`, поэтому GD-11 d
      (человек) и e (группа) отвергаются осью типа субъекта, а не Д6. Делегирование с
      `subjectTypes` ⊇ {USER, GROUP} допустимо формой (1…4), и реализация, пропустившая Д6 для
      группы или человека, прошла бы все пробы — делегат выдавал бы права чужой группе или
      постороннему человеку. Кроме того, «участник аккаунта» не определён предикатом: у типа
      `account` модели нет отношения членства (определения: cluster, super_admin, owner, admin,
      editor, viewer, v_get, v_list, v_update, v_delete, member_remover), источник членства —
      `MembershipService` (membership_service.proto:68) — документом не назван.
    measured: >-
      Прочтено @5c6b7c078: fga_model.fga `type account` (перечень define), membership_service.proto:68,
      domain/group.go:17 (AccountID), domain/service_account.go:20 (AccountID).
    fix: >-
      Назвать источник «участника» (ресурс/таблица и предикат). Добавить делегирование с
      `subjectTypes` ⊇ {USER, GROUP} и пары, отличные одним фактом: группа acc-A → создана /
      группа acc-B → `permission denied`; участник acc-A → создана / не участник →
      `permission denied`.

