  - "GD-06 c: «живой точечный тип проекта, как его публикует каталог прав» — подставить точную строку типа."
  - "Имя поля в отказах формы: kaname преимущественно пишет snake_case в `field_violations` (`InvalidArg(\"account_id\"` ×5, `page_size` ×3; `ownerUserId` ×3 — исключение); выбрать одну форму и сверить с соседями, текст — контракт (`api-error-tone`)."
  - "GD-70: «выполнены GD-01, GD-10 a, GD-30 a, GD-13, GD-40» — Given GD-40 требует B10 ACTIVE, GD-30 a его отзывает; написать «шаги When» и полный состав выдач, от которого считается `revoked_binding_count: 1`."
  - "GD-20: названный близнец (вызов от sva-iss при D1) требует D1, которого в Given нет; естественный близнец — выдача V' до отзыва usr-E, уже стоящая в Given."
  - "Р5: аудит отзыва делегированной выдачи ОБЫЧНЫМ держателем права (не делегатом) — несёт ли `delegation_id`, не сказано."
  - "Опора svc-registry — DRAFT (fa-b7): при смене её отпечатка до круга 2 таблицу §5.3 сверить заново."

