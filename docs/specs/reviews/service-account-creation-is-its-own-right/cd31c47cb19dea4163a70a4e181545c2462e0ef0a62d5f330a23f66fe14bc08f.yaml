important_nonblocking:
  - kind: COVERAGE
    text: >-
      Слово «немедленно» в «Выключении» точнее заменить на «в пределах окна вердикта двери, не
      дожидаясь срока токена». Сами SAC-30 и SAC-33 ждут pollAsk false и окно вердикта двери
      (PositiveTTL, строка 550). Прямой факт отзыв снимает в своей транзакции
      (access_binding/revoke.go:160-215), но кэш вердикта двери остаётся. Формулировку предложила
      запись круга 2, поэтому автору она в вину не ставится. Сценарии определяют поведение точно,
      а слово только упрощает прозу и опасного прочтения не даёт: окно — секунды, срок токена
      намного длиннее.
  - kind: COVERAGE
    text: >-
      Утверждение «по ним учётка создаёт и ведёт учётки» верно для арендаторского слушателя kaname,
      а этот путь и судит приёмка (Р-В5). Край kacho резолвит личность через
      InternalIAMService.LookupSubject, и тот выключенной учётке отказывает
      (internal_iam/lookup_subject.go:132-133, FAILED_PRECONDITION). Там остаточное право уже, то
      есть безопаснее, чем написано. Уточнить слушатель можно при ближайшей правке; пока ошибка в
      безопасную сторону.

