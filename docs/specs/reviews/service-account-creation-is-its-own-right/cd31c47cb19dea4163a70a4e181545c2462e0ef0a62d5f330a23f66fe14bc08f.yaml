closed_from_round_2:
  - id: B4
    kind: COVERAGE
    status: closed
    where: Р3, «Исход для самого создателя», пункт «Выключение» (строки 438-443)
    note: >-
      Текст теперь верен коду на пути, которым ходит потребитель (арендаторский слушатель kaname,
      Р-В5). 1) Выпуск закрыт: обмен ключа на токен отказывает выключенной учётке
      (service/token_enrichment_own_lane.go:110-111 — ErrServiceAccountDisabled), выпуск ключа —
      sa_keys/usecases.go:385, токен реестра — registry_token/sakey_validator.go:112. 2) Выпущенный
      токен принимается: читатель предъявленного удостоверения (internal/presentedcred, провязка
      cmd/kaname/serve.go:945-959) проверяет подпись, издателя, аудиторию и реестр отзыва
      выпущенных токенов; состояние учётки он не читает (git grep -i
      'enabled|service_accounts|MayAuth' -- internal/presentedcred ':!*_test.go' → 0), и Disable в
      реестр отзыва ничего не пишет (git grep -i revoc -- api/service_account ':!*_test.go' → о
      предмете 0). 3) Дверь выключенность не судит: personmarks читает только kaname.users
      (`SELECT id, (email_verified_at IS NOT NULL)`), а admission.ID возвращает `!person ||
      verified` (admission.go:98-99) — учётка не человек и допущена. Значит, по выпущенному
      токену учётка-создатель до его срока создаёт и ведёт учётки по роли C — как и написано.

closed_important_from_round_2:
  - kind: COVERAGE
    where: SAC-40 e; §5.1 строка SAC-40
    note: >-
      Строка e — RoleService.Update rol-own, updateMask ["rules"], правило d. Отказ с полем
      `rules[0].createdBySubject` согласован с таблицей отказов (строка 464 — `Create`, `Update`).
      UpdateRoleRequest плоский (role_service.proto:235-249), путь поля без обёртки верен.
      Близнец назван (c). Производитель у e — §5.1.
  - kind: SCOPE
    where: §3, Д-1003
    note: Подтверждение диспетчера записано с цитатой.
  - kind: DoD
    where: DoD S1 п.6
    note: >-
      Правило общее («проба, чьё Дано требует роли C или её выдачи»), три примера даны после
      «так —». Исход каждой пробы до и после изменения в DoD-proof называется одной из трёх
      категорий. Пункт измерим.

