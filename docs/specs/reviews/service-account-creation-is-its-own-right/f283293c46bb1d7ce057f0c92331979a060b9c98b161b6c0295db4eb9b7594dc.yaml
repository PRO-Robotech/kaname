important_nonblocking:
  - kind: COVERAGE
    text: >-
      Р2 п.4 отвергает `createdBySubject` и в `RoleService.Create`, и в `Update`. SAC-40 держит
      `Update` только для глагола `create` (строка b). Для селектора `Update` не держит
      (строка d — только Create). Чтобы пара была полной, к SAC-40 стоит добавить строку
      `RoleService.Update` rol-own, `updateMask: ["rules"]`, правило d.
  - kind: SCOPE
    text: >-
      Рост контракта `Rule.created_by_subject` (вопрос автора 1) рецензент принимает по
      существу. Поле только вывода, аддитивное, по образцу `children`. Без него каталог
      показывает меньше, чем роль даёт, а это часть B1. Поле названо в «Типе изменения», в
      критериях безопасности (п.4) и в DoD S1 п.1. На входе оно отвергается с именем поля
      (`api-outcome-reject`). Имя поля в нарушении — `rules[<i>].createdBySubject`, оно
      согласовано с соседним `rules[%d].resourceNames` (registered_keys.go:160).
  - kind: SCOPE
    text: >-
      Д-1003 записан как решение диспетчера. Рецензент его подлинности не проверял: решение
      пришло со слов автора. Само прочтение, что кортежи ведения — проекция выдачи, укладывается
      в Р-В3. Диспетчеру — подтвердить, что это его решение.
  - kind: DoD
    text: >-
      DoD S1 п.6 требует «сперва красные» у всех 22. До изменения роль C не существует, поэтому
      «Дано» с выдачей G на 5c6b7c078 не строится. Часть отрицательных строк (SAC-13, SAC-20
      слева, SAC-22 a) кончится «не выполнилось», а не красным. Это не дефект контракта: в
      DoD-proof исход называть тремя категориями.

