premise:
  task_premise: >-
    Подтверждена. Блокирующие круга 1 закрыты (раздел closed_from_round_1). Координаты автора
    перемерены: UNIQUE действующей выдачи по subject_id с якорем subjects[0]
    (0001_initial.sql:4443, create.go:213-224). Охрана удаления учётки по subjects[0] и по
    access_binding_subjects (service_account_repo.go:286-317). ExpireBinding — reconcile.go:829.
    Приём срока строкой — URG-34 (:784-796); CHECK на expires_at у access_bindings нет. Отзыв
    применяет прямой факт в своей транзакции (revoke.go:160-215). Поэтому ожидания «окно двери»
    в SAC-32 a достаточно: правильное ведение отличимо от снятого. Produces отвечает «нет»,
    если объект гейта не тип правила (producibility.go:97-110). Подстановка — role_verbs.go:51.
    У Rule занят номер 7, номер 1 зарезервирован. Номер 8 свободен.

closed_from_round_1:
  - id: B1
    kind: CONSTRUCTIBILITY
    status: closed
    where: §0.11, Р2, Р2 п.4, Р2а, SAC-40 d, SAC-41, SAC-42
    note: >-
      Названа третья форма: `containerVerbs` с проекцией на отношение родителя. Её следствия
      расписаны для загрузчика, roleexport (MOD-RL-18/19), генератора, раскрытия `*`,
      материализации и RoleService. Предикат «сегодня не объявимо» стоит в переписи §0.11 и
      держится SAC-42 b. `*` не достигает контейнерного действия: SAC-11 c, SAC-42 h. Каталог
      показывает оба правила: SAC-41, поле `Rule.created_by_subject`.
  - id: B2
    kind: NEGATIVE
    status: closed
    where: Р3 п.4, SAC-34, SAC-35
    note: >-
      Обе гонки есть: 10 раундов × 16 Create. Повторная проверка после дренажа
      resource_reconcile_outbox. У каждой гонки близнец меняет один факт. Механизм отдан
      замыслу (fa-b2).
  - id: B3
    kind: COVERAGE
    status: closed
    where: Р3 пп.1–2, SAC-32, SAC-33
    note: >-
      Вторая выдача G' с субъектами [sva-iss2, sva-iss] строится: якорь UNIQUE — sva-iss2.
      Delete и истечение разведены (SAC-33 a, b; REVOCATION_REASON_EXPIRED).

blocking:
  - id: B4
    kind: COVERAGE
    scenario: Р3, «Исход для самого создателя», пункт «Выключение» (строки 433-436)
    claim: >-
      Документ называет неверный исход на поверхности безопасности. Текст: «Останавливается
      выпуск ей новых токенов (`service_account/set_enabled.go:43-48`), поэтому действовать она
      не может». Указанные строки говорят обратное: «Access tokens already minted are not
      invalidated here; they run out on their own schedule». Дверь выключенность учётки не
      проверяет: решатель композиционного корня — relverdict + personmarks, а personmarks
      читает только подтверждённость адреса человека. Выключенная учётка-создатель с уже
      выпущенным токеном до его истечения продолжает создавать учётки и выпускать им ключи.
      Это следует из Р1 и Р2 п.2. Абзац написан в ответ на важное замечание 4 круга 1. Его
      прочтёт потребитель svc-registry, когда будет выбирать рычаг на случай инцидента:
      Disable выпускающего ведение не останавливает, отзыв выдачи роли C останавливает
      (SAC-30, SAC-33). Текст, вводящий в заблуждение о безопасности, блокирует
      (`00-kacho-core.md#ban19-block-criterion`).
    measured: >-
      sed -n 43,48p internal/apps/kaname/api/service_account/set_enabled.go @5c6b7c078 — цитата
      выше. grep -n -i -E 'service_account|enabled|SELECT' internal/repo/kaname/pg/personmarks/*.go
      → одна строка запроса, `SELECT id, (email_verified_at IS NOT NULL)`. В cmd/kaname/wiring.go:275
      решатель — authzcascade.WrapAdmitted(verdictAsker, personmarks.New(pool)). git grep
      проверки выключенной учётки на пути двери и проверки токена → 0 о предмете.
    fix: >-
      Переписать пункт «Выключение». Disable останавливает выпуск новых токенов и ключей. Уже
      выпущенные токены действуют до своего срока, и пока они действуют, учётка-создатель
      создаёт и ведёт учётки по роли C. Немедленно снимает право создателя конец выдачи роли C
      (Р3 п.2; держатели SAC-30, SAC-33). Нового поведения нет, новых сценариев не нужно.
      Правится одна фраза, предмет остального документа не меняется.

