  - "Близнец SAC-21 (usr-A) производим: account.admin включает owner; у project, iam_group, iam_role, iam_service_account super_admin = admin from account (fga_model.fga:427, :903, :916, :846)."
  - "Новые структурные отказы Р2 достижимы после права выдавать: порядок requireGrantAuthority → validateStructuralGates → validateSystemClassGates (create.go:268-283). Ворота 2 и 3 на SAC-02 a/b/c не срабатывают раньше для системной роли с правилом на serviceAccount."
  - "Вызов SAKeyService.Issue от учётки поддержан (sa_keys/handler.go:59, usecases.go created_by = владелец аккаунта)."
  - "Противоречия с #986 (43622b18…37c1) нет: §2 п.2 соседа передаёт предмет сюда, GD-25 g верен в мире без роли C, Д2/GD-06 c не дают делегировать модуль iam, Д6 допускает выдачу на sva-cr1."
  - "Раскрытия дефекта защиты в публичном тексте нет: класс назван без пошаговых условий."

