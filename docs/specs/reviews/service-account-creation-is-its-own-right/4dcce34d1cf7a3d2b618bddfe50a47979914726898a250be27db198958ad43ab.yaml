important_nonblocking:
  - kind: SCOPE
    text: >-
      В «Решениях владельца» нет Р-В3 «через канаме только авторизация токенов на пуш пул»
      (опора, строки 81-82; сосед #986 §3 приводит его и называет единственную запись kaname от
      себя). Приёмка вводит ещё одну запись kaname по собственной логике: кортежи ведения по
      факту создателя пишутся при создании, выдаче и отзыве. По существу это проекция выдачи C
      и укладывается в «kaname авторизует». Прочтение нужно назвать явно, как в #986. Остальные
      решения владельца выдержаны: учётки и ключи заводит учётка svc-registry (Р-В1), лимитов
      в kaname нет (§2 п.5, Р-В7), публикации наружу нет (§2 п.7, §7, Р-В5), права учётки модуля
      уже, чем сегодня (Р-узко).
  - kind: COVERAGE
    text: >-
      Состав двух приёмок. Опора svc-registry (строка 576) даёт ОДНОЙ учётке
      `registry-token-issuer` и роль C, и делегирование #986. Учётка заводит sva-X, выдаёт ей
      роль registry (Д6 #986 допускает) и выпускает ей ключ (Р2 п.2). Свойство Д4 #986 «право
      писать выдачи не даёт права на данные» для держателя обоих прав не выполняется. Это
      назначение выпускающего, и против сегодняшнего (admin + SAA) ничего не расширено. Но в
      §3 «безопасность» состав нужно назвать.
  - kind: FORMAT
    text: >-
      SAC-20 a, d, h и SAC-E3 c: тело вызова не задано (`…`, «в acc-A»). Нужен конкретный
      payload, чтобы отказ двери не спутать с отказом формы.
  - kind: COVERAGE
    text: >-
      Не сказано, что происходит с кортежами ведения при удалении или выключении самого
      создателя S. Идентификаторы не переиспользуются, поэтому это не перевыдача, но исход
      нужно назвать.

