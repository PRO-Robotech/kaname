  task_premise: >-
    Подтверждена. Каталог прав, записи с областью account: 16, из них editor 7
    (jq по permission_catalog.json @5c6b7c078). У ServiceAccountService/Create стоит editor на
    account. У SAKey Issue/Revoke стоит v_update на iam_service_account, у Delete — v_delete.
    У ServiceAccountService/List отношения у двери нет: список сужается пообъектно (list.go:261).
    Модель: account.editor (fga_model.fga:324), iam_service_account.super_admin = admin from
    account (:846). Строки соответствия со svc-registry §3а (строка 261 опоры) и роль
    `registry-token-issuer` (строка 576) прочитаны: SA Create/Delete, SAKey Issue/Revoke и
    делегированные выдачи держит ОДНА учётка.

blocking:
  - id: B1
    kind: CONSTRUCTIBILITY
    scenario: SAC-41, SAC-01, SAC-11 c, SAC-40; Р2 (правило роли), Р2 п.4; §5.2 строка «роль C»
    claim: >-
      Роль C в объявленной форме `{module: iam, resources: [serviceAccount], verbs: [create]}`
      нынешний загрузчик манифеста не принимает. Если же принять её единственным существующим
      способом, она противоречит Р1 и Р2 п.4. Загрузчик отвергает поимённое действие, которого
      раздел `resources` не объявляет (`internal/manifest/rolenamedverbs.go:117-135`,
      ErrRoleRuleVerbUnknownToContract). У `serviceAccount` объявлены только get, list, update,
      delete (`manifest.yaml:684-688`). Если объявить `create` у ресурса, генератор выведет
      `define v_create` на `iam_service_account`: действия ресурса выводятся в `v_<действие>`
      объекта (`manifest.yaml:684-688` ↔ `fga_model.fga:895-898`). Это не
      `account#service_account_creator` из Р1, и это возвращает `v_create` на объект вопреки
      §0.4. Подстановка `classes: ["*"]` (`manifest.yaml:1022-1023`) раскрывается в объявленные
      действия ресурса, и `iam.service_account.admin` получил бы `create`. SAC-11 c и Р2 п.4
      утверждают обратное. Нужен третий механизм: действие правила на `serviceAccount`
      проецируется в отношение РОДИТЕЛЯ `account`, а `*` его не раскрывает. Документ этот
      механизм не называет, а в переписи §0 нет производителя-отказа загрузчика.
      Кроме того, SAC-41 закрепляет в публичном каталоге ролей правило из одного `create`, а
      роль по Р2 п.2 даёт ещё get/list/update/delete на созданных учётках. Текст правила
      расходится с выдаваемым правом, а это право на ключи, то есть на действие от имени учётки.
    measured: >-
      Прочтено @5c6b7c078: rolenamedverbs.go:101-138; roles.go:286-301, :317, :346 (classes и
      verbs кладутся в Verbs дословно); manifest.yaml:675-688, :1015-1023; fga_model.fga:843-898.
    fix: >-
      Назвать форму объявления права создания в манифесте и её следствия для загрузчика,
      roleexport (MOD-RL-18/19), генератора модели и раскрытия `*`. Добавить в §0 предикат
      «сегодня загрузчик отвергает». Если форма правила роли C остаётся `verbs: [create]`,
      Р2 п.2 и SAC-41 должны говорить, как каталог ролей показывает выдаваемое ведение,
      либо правило роли должно его называть. Сценарий-держатель: встроенный манифест с ролью C
      загружается, тот же `create` в правиле с `*` право создания не даёт.

  - id: B2
    kind: NEGATIVE
    scenario: Р3, Р4; SAC-30 (нет конкурентного близнеца)
    claim: >-
      Нет сценария на конкурентный конфликт, хотя инвариант Р3 «глаголы на учётках создателя
      есть тогда и только тогда, когда есть действующая выдача C» поддерживают три писателя:
      создание учётки (материализация по факту создателя), выдача G (материализация ранее
      созданных, SAC-31) и отзыв G (снятие). Запись и снятие одного кортежа некоммутативны
      (`data-integrity.md#write-delete-noncommutative`). Create учётки от S идёт одновременно с
      Revoke G: создание прочло выдачу как действующую, а запись кортежей легла после снятия.
      Тогда S сохраняет v_update на новой учётке после отзыва и выпускает ей ключи. Это
      перевыдача на поверхности безопасности. Все 22 сценария позеленеют при такой
      реализации: SAC-30 гонит отзыв и создание последовательно.
    measured: >-
      grep -n -i -E 'гонк|конкурент|одновремен|параллел' по документу → 0 совпадений о
      предмете. Создание учётки пишет событие реконсайла в той же транзакции
      (service_account/create.go:151-162), отзыв — отдельная транзакция (revoke.go).
    fix: >-
      Сценарий: N параллельных ServiceAccountService.Create от sva-iss и Revoke Bc. После done
      всех операций и окна у каждой учётки, созданной sva-iss (в том числе созданной в гонке),
      Check(sva-iss, v_update) = false. Близнец — то же без Revoke: истина у каждой.
      Зеркальная гонка Create против выдачи G: после окна все учётки sva-iss ведомы.
      Механизм (замок, предикат головы партиции, реконсайл от состояния базы) — в замысел (fa-b2).

  - id: B3
    kind: COVERAGE
    scenario: Р3 («хотя бы одна действующая выдача»); SAC-30, SAC-31
    claim: >-
      Р3 утверждает два поведения без держателя. (1) Ведение сохраняется, пока у S есть хотя бы
      одна действующая выдача C. Вторая выдача строится: UNIQUE действующей выдачи берёт якорем
      subjects[0] (`0001_initial.sql:4443`, `access_binding/create.go:213-224`). Выдача C с
      subjects [sva-iss2, sva-iss] — вторая действующая выдача C для sva-iss. Реализация,
      которая снимает ведение на ЛЮБОМ отзыве, проходит все 22 сценария. (2) Выдача кончается
      не только через Revoke: есть ещё AccessBindingService.Delete (`access_binding/delete.go`)
      и истечение `expires_at` (`create.go` MinExpiresIn; реконсайл
      `access_binding/reconcile/reconcile.go`). Снятие ведения и `service_account_creator` на
      этих путях не утверждено.
    measured: >-
      Прочтено @5c6b7c078: 0001_initial.sql:4443 (access_bindings_active_grant_uniq по
      subject_id); create.go:213-224, :245-247; delete.go и reconcile.go несут expires_at.
    fix: >-
      Добавить: (a) две действующие выдачи C у sva-iss, отзыв одной → ведение sva-cr1 и создание
      сохраняются, отзыв второй → снимаются. Близнец — SAC-30. (b) Delete выдачи и выдача с
      expiresAt → после истечения и окна оба права сняты. Близнец — та же выдача без истечения.

