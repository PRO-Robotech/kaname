defaults_fixed:
  - question: чем строится «Дано» Ф1-53, если правка своих данных требует свежести 15 мин (§4.1)
    default: >-
      Подтверждение смены текущим паролем (одобренная F4d-19: смена требует
      подтверждения текущим способом и проходит, предусловия свежести сценарий не
      несёт) и есть предъявление, удовлетворяющее свежести для смены пароля.
      Фикстура: управляемые часы; вход в t; обращения ежечасно; в t + срок − 2ε смена
      пароля из этой сессии с подтверждением текущим паролем; предъявление в
      t + срок ± ε. Реализация, требующая отдельного шага вверх ДО подтверждения,
      сделала бы Ф1-53 неконструируемым в Ф3 (шаг вверх — Ф11, §0.2).
    binding_on: исполнителя Ф3 (#1269)
  - question: обязывает ли Ф1-59 слать код восстановления заблокированной личности
    default: >-
      Нет. «Дано» строится и без этого: запрос кода, затем блокировка, затем
      предъявление кода в срок. Ответ на запрос кода равен Ф1-25 при любом выборе
      (как Ф1-26, где письмо не отправляется).
    binding_on: исполнителя Ф5 (#1271)
  - question: требует ли фраза Ф1-57 перевести блокировку на отсечку субъекта
    default: >-
      Нет — это пояснение, а не требование к `set_blocked`; этой редакцией не
      решено. Решит — строкой §4.2 (Н-R4-1).
    binding_on: исполнителя Ф3 (#1269)

