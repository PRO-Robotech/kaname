reviewers_own_error_named_first: >-
  Первый прогон обхода соседей §5.2 дал у меня 18 кандидатов вместо 12 авторских,
  и я едва не записал это находкой. Причина — МОЙ инструмент: в этой оболочке
  `grep` — функция-обёртка над ugrep, а у него `grep -vq` на пустом входе
  возвращает 0 (у GNU grep — 1), поэтому фильтр «статус APPROVED» пропускал
  DRAFT-приёмки. Проверено отдельно: `printf '' | grep -vqE x; echo $?` → 0,
  `printf '' | command grep -vqE x; echo $?` → 1. Тот же обход через GNU grep дал
  ровно 12 — посылка автора подтвердилась. Все числа этой записи сняты заново
  через `command grep`. Второе, без влияния на вердикт: первая рабочая копия
  рецензии легла в project/tmp, а не в tmp/ воркспейса; снята тем же заходом,
  пустой каталог удалён.

