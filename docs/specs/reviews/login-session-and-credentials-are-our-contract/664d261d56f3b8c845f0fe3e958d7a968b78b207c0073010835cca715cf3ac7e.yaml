# ─── БЛОКИРУЮЩЕЕ ──────────────────────────────────────────────────────────
blockers:
  - id: Б-R4-1
    title: >-
      Откат воскрешает сессию того, кто вышел в нашей посадке, а документ
      объявляет окно отката «не шире, чем было бы без перевода»
    where:
      - §4.2, строка «действующие сессии прежнего поставщика», столбец «почему» (стр. 720)
      - §10.9, «Отвергнутый исход О2 «а»» (стр. 1785–1790)
      - §3.10, Ф1-60
    sign: >-
      Сложение ЧЕТЫРЁХ правил самого документа. (1) Ф1-57 и §5.1 «Выход»: выход в
      нашей посадке снимает запись НАШЕЙ сессии; отсечку субъекта пишут смена пароля,
      блокировка, принудительный выход и восстановление — выхода среди них нет.
      (2) §4.2 и §10.9: у поставщика сессии при переводе не снимаются, нового пути к
      компоненту нет; ни Ф1-52 («ответ равен ответу близнеца без печенья вовсе»), ни
      одобренная F4d-26 («перечень гасимых называет наш носитель; имя без нашего
      производителя — находка») гашения печенья поставщика в браузере не требуют, а
      первое по буквальному прочтению его исключает. (3) Ф1-60: после отката печенье
      поставщика обслуживается его сессией, если отсечки субъекта позже его момента
      нет; внешняя полоса отсечку читает на обоих путях (F4d §1.5;
      PRO-Robotech/kacho:gateway/cmd/api-gateway/main.go — `WithSessionCutoff` рядом
      с `WithKratos` у маршрута «кто я»). (4) Без перевода выход идёт потоком
      поставщика, и его сессия деактивируется (§5.1 «Выход»;
      PRO-Robotech/kacho:ui-future/shared/src/lib/kratos.ts, `submitLogout`).
      Итог: у личности, чей держатель вышел в нашей посадке между переводом и
      откатом, всякая копия её печенья поставщика, выданного до перевода (оставшаяся
      в браузере общего компьютера, сохранённая, украденная), после отката снова
      обслуживается, а без перевода была бы мертва. Из пяти причин отзыва Ф1-17 откат
      переживают четыре (их отсечку либо резолв блокировки внешняя полоса читает);
      пятая — выход — не переживает.
    experiment: |
      Модель на правилах документа (перевод в 1 ч, выход в 2 ч, откат и обращение в 3 ч,
      срок печенья поставщика 24 ч), воспроизводится за секунду:
        H = 3600
        def accepted_after_rollback(transfer, user_logs_out, mode='single'):
            P = {'active': True, 'auth': 0, 'exp': 24 * H}; cutoff = None
            if user_logs_out:
                if not transfer: P['active'] = False        # выход потоком поставщика
                elif mode == 'all': cutoff = 2 * H          # «все сессии» пишет отсечку
            return P['active'] and 3 * H < P['exp'] and not (cutoff is not None and cutoff >= P['auth'])
      вывод:
        перевод=нет вышел=нет → True
        перевод=нет вышел=да  → False
        перевод=да  вышел=нет → True
        перевод=да  вышел=да  → True      ← окно ШИРЕ, чем без перевода
        перевод=да  вышел=да, режим «все сессии» → False
    subject: >-
      Объявленная цена обратимости уже, чем её производят правила документа, и
      разница приходится ровно на то население, которому выход нужнее всего: общий
      компьютер (следующий за ним после отката входит чужой сессией) и выход после
      подозрения на компрометацию (украденная копия оживает). Дефект §1.3, который
      закрывает Ф1-14 («выход делает сессию непригодной на стороне сервера»), после
      отката возвращается для них. Отказ от О2 «а» обоснован именно ложной посылкой
      («окно, которое он закрывает, не шире того, что было бы без перевода»). По
      ban #18 вопрос безопасности отвергает решение, расширяющее поверхность без
      названного расширения.
    removal_predicate: >-
      (а) обе фразы «не шире того, что было бы без перевода» (строки 720 и 1788)
      сняты либо называют подмножество «вышедшие в нашей посадке»:
      `grep -c 'не шире того, что было бы без перевода' $D` → 0 либо каждое вхождение
      несёт оговорку; (б) заведён сценарий-близнец Ф1-60, отличающийся от неё ОДНИМ
      фактом — держатель выполнил выход в нашей посадке между переводом и откатом, —
      с объявленным исходом и производителем в §5: либо отказ с названным
      механизмом (выбор автора; например, выход в нашей посадке пишет ту же отсечку
      субъекта с моментом не позже перевода — все наши сессии аутентифицированы
      позже, Ф1-57 не задет, второго источника и пути к компоненту не заводится;
      либо отсечку пишет шаг отката), либо проход как объявленная цена с ответом на
      вопрос безопасности ban #18 и строкой §4.2; (в) довод отказа от О2 «а»
      перепроверен по исправленной посылке. Проверка (б):
      `awk '/^### §3.10 /,/^## §4 /' $D | grep -ciE 'вышел|выход[а-я]* в нашей посадке'`
      → больше нуля (сегодня 0: единственное вхождение «выход» в §3.10 — «выход без
      личности», о другом). Попутно — сказать, включает ли «ответ равен близнецу»
      в Ф1-52 заголовки: от этого зависит, закрыт ли для исполнителя один из
      способов снять половину подмножества (гашение печенья поставщика в браузере).
    why_blocking_not_default: >-
      Дефолтом это не лечится: исполнитель Ф3 и оператор отката читают документ, а
      в нём стоит ложное утверждение о свойстве безопасности. Любой дефолт был бы
      либо решением принять дыру (вопрос безопасности ban #18 — не рецензента),
      либо решением о механизме (правка О2 — автора).

# ─── НЕБЛОКИРУЮЩИЕ ────────────────────────────────────────────────────────
non_blocking:
  - id: Н-R4-1
    what: >-
      Ф1-57 («Тогда») и §5.1 «Выход» называют блокировку писателем отсечки
      субъекта. Дерево этого не делает и обосновывает намеренно: kaname
      `internal/apps/kaname/api/user/set_blocked.go`, абзац «WHAT IT DOES NOT DO» —
      «The identity-wide session cutoff (`user_token_revocations`) is deliberately
      NOT used»; блокировка действует на предъявлении резолвом субъекта
      (`internal/apps/kaname/api/internal_iam/lookup_subject.go:91`,
      `FAILED_PRECONDITION "identity %s is blocked"`). Одобренная F4d §1.5 перечисляет
      писателей отсечки без блокировки. Сверх того фраза описывает устройство внутри
      «Тогда» (§7 инв. 1).
    consequence: >-
      Прочитанная буквально, она переводит блокировку на отсечку: после снятия
      блокировки сессии, выданные до неё, больше не оживают. Это «было/становится»,
      которого нет в §4.2. Сама фраза «отзыв блокировкой» одобрена с редакции 1
      (Ф1-17), поэтому не блокирующее. Отдельно: обоснование в set_blocked.go («…в
      другом аккаунте») устарело в самом дереве — его же шапка говорит, что строка
      теперь одна на человека; это предмет дерева, не документа.
    predicate: >-
