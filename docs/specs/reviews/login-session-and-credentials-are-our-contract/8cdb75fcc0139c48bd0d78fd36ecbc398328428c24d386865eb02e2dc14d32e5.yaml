      этот раз он совпадает с классом, который сам документ уже ловил (Ф1-63, редакция 5): у
      записи с монотонным моментом появился новый писатель, а свойство «причина принадлежит
      записи, чей момент стоит» держится замком другого писателя. Цена — журнал причин, который
      Ф1-17 объявляет контрактом («причина отзыва — наш журнал»): реализация, пишущая отсечку
      смены пароля своим SQL, проходит Ф1-15, Ф1-65, Ф1-66 и Ф1-63 (там глагол — выход) и на
      каждом восстановлении и после каждого принудительного выхода переписывает журнал. Инвариант
      2 сам говорит, почему прозы «ту же запись» недостаточно: «неназванный близнец не защищает —
