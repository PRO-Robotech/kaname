# ─── БЛОКИРУЮЩЕЕ ──────────────────────────────────────────────────────────
blockers:
  - id: Б-R7-1
    title: >-
      Редакция 9 завела ВТОРОГО писателя отсечки с отброшенным моментом — смену пароля, — а
      свойство «причина и актор принадлежат записи, чей момент стоит» держится замком, который
      исполняет только ПЕРВОГО (выход); для смены пароля его не держит ни один сценарий и ни один
      замок, при том что последовательность «стоящая отсечка старше → смена пароля» на пути
      восстановления ОБЯЗАТЕЛЬНА (Ф1-27)
    where:
      - §4.2, пункт «запись монотонна и по МОМЕНТУ, и по ПРИЧИНЕ», стр. 1034–1060 — писателем с отброшенным моментом назван только выход; смена пароля упомянута лишь в случае РАВНЫХ моментов
      - §5, строка Ф3, стр. 1186 — «запись отсечки монотонна и по моменту, и по причине с актором … (Ф1-63: выход, чей момент отброшен, причины стоящей отсечки не меняет)»
      - §8, строка отзыва, замок Ф1-63, стр. 1832 — «поставить отсечку моментом позже … затем выполнить выход и утверждать обе величины»
      - §3.3, Ф1-27, стр. 717 — «требуется задать новый пароль до любого иного действия (Р4)»; Ф1-63, стр. 696 — «Дано» проходит через этот шаг молча
    sign: >-
      Вопрос круга 6 — «что держалось by construction у ПРЕЖНЕГО механизма и чем держится у
      нового» — редакция 9 задала своему механизму ТРИЖДЫ и ответила на два: наши сессии не
      задеты (момент раньше первой аутентификации — модель §5.1) и равные моменты выхода и смены
      пароля (объявлено «на равных стоит последняя, ни один сценарий не утверждает»). Третий случай
      не задан: у редакций 7 и 8 смена пароля отсечки не писала вовсе, поэтому «смена пароля не
      трогает причину и актора СТОЯЩЕЙ отсечки старше неё» держалось by construction. Редакция 9
      сделала её писателем с моментом, который хранилище ОТБРАСЫВАЕТ (`GREATEST`), — ровно та
      форма, в которой редакция 5 нашла свою «вторую ошибку» у выхода и завела Ф1-63: единственная
      операция записи в дереве переписывает причину и актора БЕЗУСЛОВНО
      (`internal/repo/kaname/pg/user_token_revocations_repo.go`, `upsertRevokeAllSQL`: у момента
      `GREATEST`, у причины и актора `= EXCLUDED.`; перемерено). Довод редакции 5 — «без этой
      половины механизм ломает Ф1-17 внутри самого документа» — переносится на второго писателя
      слово в слово, и не перенесён.
    experiment: |
      1) Замок Ф1-63 исполняет один глагол — предикат по отрезку «от „для Ф1-63“ до „для Ф1-64“»
         строки отзыва §8:
           awk '/^## §8 /,/^## §9 /' "$D" | grep -oE 'для Ф1-63 — .*для Ф1-64' \
             | grep -ciE 'смен[аыу] пароля|сменён пароль'   → 0
           контроль той же формы: ... | grep -ciE 'выполнить выход'   → 1
         (первая версия моего предиката — `[^;]*(;[^;]*){0,3}` — давала 1, захватив замок Ф1-65;
          см. мою ошибку 1.)
      2) Сценария, чьё «Когда» — смена пароля, а «Тогда» утверждает причину, в §3.3 нет:
           awk '/^### §3.3 /,/^### §3.4 /' "$D" | grep -E '^\| \*\*Ф1-' \
             | awk -F'|' '$4 ~ /смен[ёе]н пароль|смена пароля|сменил пароль/ && $5 ~ /причин/' | wc -l  → 0
           контроль («Когда» — выход, «Тогда» — причина, это Ф1-63)                                  → 1
      3) Пункт §4.2 «запись монотонна…» называет смену пароля только в случае равных моментов:
           строки пункта со словом «смен»: 7, 9, 10 (о восстановлении и о переезде «Дано»), 23
           («выход и смена пароля пишут один момент») — случая «момент смены пароля отброшен» нет.
      4) Последовательность не экзотична, а ОБЯЗАТЕЛЬНА: Ф1-27 «требуется задать новый пароль до
         любого иного действия (Р4)»; одобренная соседка Ф5 (`recovery-of-access`, origin/main)
         производителем Ф5-24 «после смены пароля проходит всё» называет **Ф3 «смена пароля»**,
         вход — «пароль, смененный той же сессией» (строка 862). Значит на КАЖДОМ восстановлении
         вслед за отсечкой `now` (причина «password-change», актор — у сегодняшнего писателя
         пустой: `internal_on_recovery.go` передаёт revokedBy `""`) идёт запись смены пароля с
         отброшенным моментом. Второй путь наблюдаем в журнале: принудительный выход
         администратором → повторный вход → смена пароля → причина и актор стоящей отсечки
         названы «смена пароля» и человек; действие администратора из журнала причин исчезло —
