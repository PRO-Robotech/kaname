# ─── ТРИ БЛОКИРУЮЩИХ КРУГА 1: ЧЕМ ПРОВЕРЕНО, ЧТО СНЯТЫ ──────────────────────
blockers_round1:
  - id: Б1
    was: >-
      DoD п.1 и §0.3 называли производителем вердикта проверку, которая документ
      не обходит; читателя вердикта нет ни в одном из двух домов
    resolution: ЗАКРЫТ
    author_outcome: исход 1 — признак переписан на достижимый, остаток назван отдельной строкой DoD
    how_verified:
      - >-
        предикат 1 исполнен в kacho-workspace:
        `python3 scripts/docs-gate/check-04-product-acceptance-verdict.py` → PASS,
        перепись «документов .md прочитано 138, приёмок второго дома среди них 0»,
        упоминаний этого документа в выводе 0. Посылка автора ПОДТВЕРДИЛАСЬ.
      - >-
        предикат 3 исполнен в доме службы:
        `git grep -lnE 'APPROVED|CHANGES_REQUESTED' -- 'internal/check/*.go' ':!*_test.go'`
        → пусто (код 1). ПОДТВЕРДИЛСЯ.
      - >-
        ВСТРЕЧНЫЙ замер СВОИМ выражением, шире авторского, потому что предикат
        автора сужен до одного каталога и исключает тесты, а гейты этого дерева
        суть тесты: обход ВСЕГО дерева по признаку «файл и называет каталог
        приёмок, и делает файловый ввод-вывод (os.ReadDir|ReadFile|Walk|Glob|Open)».
        Кандидатов 24; из них несущих токен вердикта — 4
        (internal/manifest/acceptancekeystate_test.go, acceptancestate_test.go,
        internal/supplyhygiene/schema_name_test.go,
        internal/apps/kaname/modulecatalog/plan_verdict_test.go). ВСЕ четыре
        вхождения — в КОММЕНТАРИЯХ, ни одно не исполняется. Два выражения,
        построенные по-разному, дали один ответ: машинного читателя вердикта в
        доме службы НЕТ.
      - >-
        довод автора «предмет гейта ДРУГОЙ — он судил бы дом приёмок целиком, 34»
        перемерен: `git ls-files 'docs/engineering/acceptance/*.md' | wc -l` → 34,
        и независимо перепись гейта дома печатает «приёмок 34». СХОДИТСЯ.
      - >-
        новый признак §9 п.1 ПРОГНАН дословно в форме §10.1 — вернул
        `CHANGES_REQUESTED acceptance-reviewer f8ea0dd4…a16f9b8`, и отпечаток
        записи РАВЕН отпечатку редакции 1. То есть признак исполним, а не
        «выглядит достижимым».
      - >-
        ОТРИЦАТЕЛЬНЫЙ контроль признака: тот же признак на отпечатке редакции 2
        (записи ещё нет) → `fatal: path … does not exist`. Признак СПОСОБЕН не
        выполниться — то есть он не вакуумен.
  - id: Б2
    was: >-
      §4.3 озаглавлен «обязано это доказать», формы доказательства не называл;
      раздел без метки Ф1-NN выпадал из переписи §5 и из §8
    resolution: ЗАКРЫТ
    how_verified:
      - >-
        посылка перемерена на редакции 1: упоминаний §4.3 — 3, строк замка §8 — 8.
        Обе цифры автора СОШЛИСЬ.
      - >-
        §3.8 заведён: Ф1-44…47. §4.3 несёт таблицу «что не меняется → чем
        доказано», четыре строки, у каждой метка. §8 несёт строку Ф1-44…47.
        §5 называет производителя Ф2.
      - >-
        оговорка Ф1-45 («ни одна выдача не переиздавалась и не правилась самим
        переносом») предъявленную дыру ЗАКРЫВАЕТ: перенос, сменивший id и
        починивший за собой ссылки, обязан был выдачи ПРАВИТЬ — значит красное.
        Оговорка наблюдаема (состояние строк выдачи до и после), устройства не
        называет, §7 инвариант 1 не нарушает.
      - >-
        Ф1-44 несёт защиту от вакуума: перепись на ПУСТОМ множестве даёт «не
        выполнилось», а не «прошло». Это ровно тот класс, который ловит
        `testing.md` §«Четыре класса проверок», п. 1.
      - >-
        Ф1-47 — контроль в обратную сторону (внесённая смена одного id даёт
        красное с его именем), то есть группа способна отвергнуть.
  - id: Б3
    was: вторая половина Р3 («время ответа не расходится систематически») не покрыта ничем
    resolution: ЗАКРЫТ
    how_verified:
      - >-
        посылка перемерена на редакции 1: слов о времени ответа — 1 вхождение,
        внутри самого Р3; сценариев в §3 на признаки измерения — 0. СОШЛОСЬ.
      - >-
        §3.9 заведён: Ф1-48 (критерий), Ф1-49 (положительный контроль),
        Ф1-50 (третья категория), Ф1-51 (полоса восстановления отдельной строкой).
        Все четыре в §5 и в §8.
      - >-
        (а) ВЫПОЛНИМОСТЬ: названо что меряется (времена ответа двух полос),
        как (чередуясь — снимает дрейф нагрузки), чем сравнивается (медианы),
        сколько повторов (объявлено настройкой и печатается). Конструируемо.
      - >-
        (б) НЕ ВАКУУМЕН ЛИ КРИТЕРИЙ — проверено ЧИСЛЕННЫМ ОПЫТОМ, а не доводом.
        Смоделированы две полосы по параметрам, которые документ САМ переносит
        дословно (§4.1, argon2 64МБ/3): «личности нет» — медиана 2 мс,
        «пароль неверен» — медиана 90 мс, по 400 обращений, логнормальный хвост.
        Критерий «разница медиан > максимального межквартильного размаха» даёт
        КРАСНОЕ при разбросе 1.5 / 4.5 / 13.8 / 45.2 мс и ЗЕЛЁНОЕ при 83.8 / 201.5
        / 554.4 мс. То есть критерий ловит настоящий оракул на широкой и
        реалистичной полосе и слепнет ровно там, где Ф1-50 обязан ответить
        «не выполнилось». Вакуумным он НЕ является.
      - >-
        (в) ПОЛОЖИТЕЛЬНЫЙ КОНТРОЛЬ ЕСТЬ — Ф1-49, заведомо внесённое различие.
        Его ГРАНИЦА измерена и вынесена замечанием Н1 ниже.
      - >-
        §7 инвариант 3 разделён на две половины; клауза про Ф1-22, известная
        круга 1 как неверная (В3), исправлена тем же заходом и названа автором
        как вынужденное исключение из «не трогать ратифицированное».


# ─── НОВОЕ БЛОКИРУЮЩЕЕ КРУГА 2 ──────────────────────────────────────────────
blocking:
  - id: Б4
    title: >-
      §5 не называет производителя «Тогда» у Ф1-06 и Ф1-23, а фаза, которая его
      произвела бы, выпала из ведомости при ПЕРЕНУМЕРАЦИИ фаз относительно эпика
    sections: [§5, §3.1 Ф1-06, §3.4 Ф1-23]
    genus: объявлено и не производится — ТОТ ЖЕ род, что у всех трёх блокирующих круга 1
    parts:
      - part: а
        title: у отказа на ДЕЙСТВИИ нет производителя
        predicate: >-
          Ф1-06 и Ф1-23 требуют дословно: «действия, требующие подтверждённого
          адреса, ОТВЕРГАЮТСЯ с отказом, называющим следующий шаг». Ведомость §5
          отдаёт оба сценария фазе Ф4 (`#1270`), чей столбец «что она обязана
          произвести» читается целиком: «регистрация одной транзакцией;
          переписанный гейт полос». Отказа на действии среди этого нет.
          Встречный предикат по всей §5:
          `awk '/^## §5 /,/^## §6 /' <файл> | grep -ciE 'подтвержд'` → 1, и это
          единственное вхождение стоит в столбце Ф2, где означает ХРАНИМЫЙ
          ПРИЗНАК («строка адреса и её подтверждённость»), а не отказ.
          Хранить признак и отвергать по нему — разные производители.
      - part: б
        title: сценарий про ВХОД поручен фазе РЕГИСТРАЦИИ
        predicate: >-
          Ф1-06 лежит в §3.1 «Полоса входа паролем», его «Когда» — «предъявлен
          верный пароль», а первая половина «Тогда» — «вход состоится». Это
          предмет Ф3 («вход паролем»), а ведомость отдаёт строку Ф4. Диапазон Ф3
          в §5 записан как «Ф1-01…03, Ф1-05, Ф1-07…19» — то есть 06 пропущен
          НАМЕРЕННО. Итог: у Ф1-06 первая половина отдана не тому, кто её
          производит, вторая — никому.
      - part: в
        title: подтверждённость не доезжает до места, где по ней отвергают
        predicate: >-
          Гейт на действии требует, чтобы подтверждённость была ВИДНА в точке
          решения. Ведомость никому этого не поручает: Ф2 производит хранимый
          признак, Ф3 — «сессия и её срок», и ни одна строка не обязуется
          провести признак в контракт сессии или в проверку на крае. Замер:
          полей подтверждённости адреса в контрактах дома службы — 0
          (`git grep -ilE 'email_verified|address_verified|verified_at' -- '*.proto'`
          → 0; все 7 вхождений слова verified в этих контрактах — проза о
          verified principal и verified certificate); в базовой миграции службы
          поля подтверждённости нет вовсе
          (`grep -inE 'verified|confirmed' internal/migrations/0001_initial.sql`
          → пусто, что согласуется с §1.1).
      - part: г
        title: ПЕРЕНУМЕРАЦИЯ фаз разошлась с эпиком, и в расхождение провалился производитель
        predicate: |
          Сверка §5 с телом эпика #1266 (исполнено `gh issue view 1266`):
            фаза  эпик #1266                                 §5 приёмки
            Ф5    #1271 «восстановление доступа»              #1773 «восстановление и почта»
            Ф6    #1272 «подтверждение адреса — разобрать»    «политика пароля», «входит в Ф3»
          Состояния перемерены: #1271 OPEN «iam Ф5: восстановление доступа»;
          #1272 OPEN «iam Ф6: подтверждение адреса — разобрать, чем оно является
          сегодня»; #1773 OPEN «почта: доставка подтверждения адреса и
          восстановления — второй вход человека».
          Следствия два, и оба несущие.
          (1) Ф6 эпика — «подтверждение адреса», #1272 — есть ИМЕННО та фаза,
          которая произвела бы отказ из частей (а) и (в). В §5 она не названа
          НИ РАЗУ: номер Ф6 занят «политикой пароля» и свёрнут в Ф3. То есть
          производитель не «забыт» — он вытеснен перенумерацией.
          (2) Ф5: сценарии восстановления Ф1-25…31 отданы задаче #1773, предмет
          которой — ДОСТАВКА ПИСЬМА, а не восстановление. Производитель
          восстановления #1271 в §5 отсутствует.
    why_blocking: >-
      Ровно тот класс, которым отвергнуты все три блокирующих круга 1:
      наблюдаемое объявлено, производителя нет. Здесь он хуже обычного, потому
      что выглядит закрытым — строка в ведомости ЕСТЬ, и обе переписи §5
      («метка без строки» и «строка без метки») по ней зелены. Не сходится не
      наличие строки, а ПРИГОДНОСТЬ названной фазы произвести то, что сценарий
      требует, и этого ни одна перепись документа не проверяет.
      Цена пропуска названа соседней полосой замером и не является
      предположением: подтвердить адрес в продукте сегодня нечем —
      производителей отказа «адрес не подтверждён» в прод-коде обоих деревьев
      ноль, все попадания проза (перемерено обеими языковыми формами).
      Значит требование, объявленное двумя сценариями, не произведёт никто, и
      обнаружится это при закрытии фазы, а не здесь.
    outcomes: >-
      Исходов три, и «оставить как есть» среди них нет. (а) Назвать
      производителем отказа фазу Ф6 эпика (#1272) — вернуть её в ведомость под
      её номером и её предметом, а «политику пароля» перенумеровать либо
      объявить подфазой Ф3 без занятия номера Ф6. (б) Развести Ф1-06: половину
      «вход состоится» отдать Ф3, половину «действия отвергаются» — названному
      производителю отказа; то же для Ф1-23. (в) Поручить кому-то явно
      проведение подтверждённости в точку решения (часть в). Плюс отдельно:
      привести строку Ф5 к эпику — сценарии восстановления принадлежат #1271,
      а #1773 производит доставку.
    note_on_the_fourth_outcome: >-
      Соседняя полоса сообщает четвёртый исход своего разбора: требование
      остаётся, но рубеж переезжает со ВХОДА на ДЕЙСТВИЕ, и это СОВПАДАЕТ с тем,
      что документ объявляет в Ф1-06 и Ф1-23. Проверено чтением обоих сценариев:
      да, оба уже говорят «вход состоится / сессия годна, а действия
      отвергаются» — то есть ОБЪЯВЛЕНИЕ документа верно и правки не требует.
      Неверно только ПОРУЧЕНИЕ. Блокирующее поэтому лежит целиком в §5 и §3
      не трогает.

# ─── ВОЗРАЖЕНИЕ АВТОРА ПО В2: АВТОР ПРАВ ────────────────────────────────────
objection_adjudicated:
  id: В2
  round1_claim: >-
    «форма `дом:путь` внутри git grep даёт ТИХИЙ НОЛЬ. Это ХУЖЕ несуществующего
    пути — тот даёт код 2, а этот выглядит замером»
  author_objection: >-
    коды сравнены у РАЗНЫХ инструментов: 2 возвращает grep на отсутствующем
    файле, а у git grep приставка дома и обычный промах корнем дают ОДИНАКОВУЮ
    единицу; тише обоих делает труба `| wc -l`
  ruling: АВТОР ПРАВ — возражение подтверждено замером, запись круга 1 ошибалась в МЕХАНИЗМЕ
  measurement: |
    grep по несуществующему файлу              → код 2 + предупреждение в stderr (слышно)
    git grep с приставкой дома в pathspec      → код 1, молча
    git grep по просто несуществующему корню   → код 1, молча          ← НЕОТЛИЧИМЫ
    обе формы через | wc -l                    → печатают 0, код трубы 0 (тише обеих)
  reviewer_error_named_first: >-
    Ошибка моя, и называю её прямо: круг 1 сопоставил код 2 у `grep` с кодом 1 у
    `git grep` и объявил приставку дома ОСОБО тихой. Приставка не тише обычного
    промаха путём — у `git grep` они неразличимы by construction. Это тот же
    класс, который корпус называет «предикат меряет инструмент, а не предмет»,
    применённый к самому рецензенту.
  what_survives_of_the_remark: >-
    Вывод круга 1 — «форма годна для ГЕЙТА координат, но не для предиката;
    развести их стоит явно» — уточнением НЕ отменён и остаётся верным. Именно он
    и реализован: приставка сохранена как координата, рядом названы дом
    исполнения и правило подстановки (преамбула §1, один раз на все предикаты).
  author_experiment_reproduced: >-
    Автор утверждает, что снятие приставки гейт дома отверг ТРЕМЯ находками.
    ВОСПРОИЗВЕДЕНО: в своей рабочей копии снял приставку
    (`sed 's#PRO-Robotech/kacho:##g'`), прогнал
    `go test ./internal/check/ -run TestAcceptancePathCoordinateResolves` →
    FAIL, «находок 3», строки 238, 266, 294, каждая с координатой и текстом
    «МЁРТВЫЙ ПУТЬ ПРЕДИКАТА». Перепись при этом сдвинулась ожидаемо:
    «в чужом доме 31 → 27», «резолвится 241 → 242». Файл восстановлен из копии,
    `git status --porcelain` пуст — откат ДОКАЗАН, а не заявлен.
  conclusion: >-
    Разведение «приставка = координата, дом исполнения = строкой над командой»
    — верное решение: оно удовлетворяет обе стороны, которые иначе
    взаимоисключающи. Замечание В2 закрыто.

# ─── НОВЫЕ ЗАМЕЧАНИЯ: НЕ БЛОКИРУЮЩИЕ ────────────────────────────────────────
non_blocking:
  - id: Н1
    severity: важное — читается первым исполнителем Ф3
    title: >-
      величина ВНЕСЁННОГО различия Ф1-49 не ограничена сверху, и слово
      «заведомое» приглашает выбрать её большой; тогда положительный контроль
      проходит ВХОЛОСТУЮ, а настоящий оракул уезжает зелёным
    measured: |
      Опыт (те же параметры: «личности нет» 2 мс против argon2 90 мс, 600 обращений):
      стенд с разбросом 172 мс — настоящий оракул (разница 83 мс)  → ЗЕЛЁНОЕ, оракул спрятался
        Ф1-49, внесено   90 мс (соразмерно оракулу) → зелёное — контроль ПРОВАЛИЛСЯ (верный сигнал)
        Ф1-49, внесено  500 мс                      → КРАСНОЕ — контроль прошёл, проба объявлена годной
        Ф1-49, внесено 2000 мс                      → КРАСНОЕ — контроль прошёл, проба объявлена годной
      стенд с разбросом 340 мс — та же картина.
    why_it_matters: >-
      Ф1-49 объявлен именно затем, чтобы «без него Ф1-48 зеленел бы и на
      продукте, различающем полосы». Опыт показывает: он исполняет эту роль
      ТОЛЬКО когда внесённое различие соразмерно тому, которое критерий обязан
      различать. Внесённое различие, выбранное «заведомо большим», делает
      контроль проходимым при живом оракуле — и тогда Ф1-48…51 зелены все
      четыре, а §7 инвариант 3 зелен при оракуле, читаемом секундомером. Это тот
      же исход, ради которого Б3 и заводился.
    why_not_blocking: >-
      Предмет Б3 — «вторая половина не покрыта НИЧЕМ» — закрыт: сценарии,
      критерий, положительный контроль и третья категория есть, и критерий
      измеримо не вакуумен. Недостаёт ОДНОЙ клаузы в «Дано» Ф1-49, и величина
      для неё уже есть В САМОМ документе — §4.1 переносит argon2 64МБ/3 дословно
      как контрактную величину. То есть вопрос ДЕФОЛТАБЕЛЕН, и дефолт
      зафиксирован ниже (`defaults_fixed`), а не оставлен исполнителю.
  - id: Н2
    severity: число без своей единицы счёта
    title: >-
      §10.1 говорит «шесть проб трёх гейтов», а предикат, напечатанный строкой
      ВЫШЕ, даёт двенадцать
    measured: |
      git grep -hoE 'func Test[A-Za-z]*' -- 'internal/check/acceptance_*_test.go' | sort -u | wc -l  → 12
      git ls-files 'internal/check/acceptance_*_test.go' | wc -l                                     → 6   ← это ФАЙЛЫ
      git ls-files 'internal/check/acceptance_*.go' | grep -vc _test.go                               → 3   ← гейтов, верно
    detail: >-
      «Три гейта» верно. «Шесть» считает ФАЙЛЫ и подписано «проб». Существа Б1
      это не касается — ни при шести, ни при двенадцати ни одна проба вердикта
      не читает, — но число стоит рядом со своим предикатом и ему противоречит,
      а это ровно тот класс, который документ ловит в других местах.
  - id: Н3
    severity: величина без названного производителя
    title: >-
      «объявленный потолок годности» (Ф1-50) и «объявленная нижняя граница»
      числа обращений (Ф1-48) нигде не объявлены — ни значением, ни правилом
      вывода, ни среди печатаемого
    detail: >-
      Предикат: `grep -nE 'потолок|нижн(ей|яя) границ'` по документу — 3
      попадания, все три СЛОВО «объявленный/объявленной», ни одного объявления.
      Ф1-48 перечисляет печатаемое (обе медианы, оба размаха, число обращений,
      критерий) — потолка и нижней границы среди печатаемого НЕТ, поэтому
      «прошло» от «порог был выбран щедро» читатель не отличит.
      С дефолтом Н1 потолок становится САМООГРАНИЧЕННЫМ (щедрый потолок роняет
      Ф1-49), то есть отдельного числа ему не требуется — но печатать его всё
      равно надо.
  - id: Н4
    severity: довод шире сделанного
    title: >-
      §3.9 и §10.3 объясняют выбор размаха вместо миллисекунд тем, что
      «абсолютная величина есть свойство железа»; выбор абсолютную величину не
      УСТРАНЯЕТ, а ПЕРЕНОСИТ — в потолок годности Ф1-50
    detail: >-
      Критерий «разница ≤ размаха при размахе ≤ потолка» эквивалентен «разница
      ≤ потолка» в худшем случае: потолок и есть максимальное неразличаемое
      различие, выраженное в миллисекундах, и стареет он так же молча. Перенос
      защитим и лучше исходного (потолок ограничивает ГОДНОСТЬ ЗАМЕРА, а не
      вердикт, и он один на пробу, а не один на стенд), но подавать его как
      устранение хардварного числа не следует: следующий читатель решит, что
      величины, стареющей молча, в пробе нет вовсе.
  - id: В4
    severity: перенесено из круга 1, автором осознанно не тронуто
    title: >-
      §7 инвариант 2 называет положительные близнецы не для всех полос — §3.3,
      §3.4, §3.5 без них, хотя по существу близнецы есть (Ф1-12, Ф1-20, Ф1-25/27)
    detail: >-
      Автор объявил в §10.5, что сверх блокирующих не правит ничего, и это
      верное решение по цене круга. Замечание остаётся открытым и не блокирует:
      одно-фактность пар проверена кругом 1 пообъектно и подтверждена.
  - id: В5
    severity: перенесено из круга 1, сроковое
    title: производитель Ф5 (`#1773`) несёт метку `blocked`, и круг 2 добавил ему Ф1-51
    detail: >-
      Перемерено: `#1773` OPEN, метки `bug, blocked, P1, size:L, area:iam,
      release:identity`. Остальные производители (`#1268 #1269 #1270 #1280`),
      эпик `#1266` и вынесенные `#1281 #1282` — OPEN, `release:identity-own`.
      Предмета приёмки не касается; предикат готовности релиза это увидит.

# ─── ДЕФОЛТЫ, ЗАФИКСИРОВАННЫЕ НА РЕВЬЮ (раздел 4.8 регламента роли) ─────────
defaults_fixed:
  - question: какой величины должно быть внесённое различие Ф1-49
    default: >-
      Порядка того различия, которое критерий обязан различать, и НЕ БОЛЬШЕ —
      то есть порядка стоимости хеширования, которую §4.1 уже переносит
      дословно как контрактную величину (argon2id, память 64 МБ, итераций 3).
      Внесённое различие, заметно превосходящее её, делает Ф1-49 проходимым при
      живом оракуле и потому положительным контролем не является.
    rationale: >-
      Величина выводится из документа и нового решения не требует. С ней потолок
      годности Ф1-50 становится самоограниченным: всякий потолок, при котором
      настоящий оракул прячется, роняет и Ф1-49 — то есть проба честно отвечает
      «не выполнилось» вместо ложного зелёного.
    binding_on: исполнителя Ф3 (`#1269`), при написании пробы Ф1-48…50
    status_after_round_2: >-
      Дефолт зафиксирован на ревью (раздел 4.8 регламента роли) и сам по себе
      блокирующим НЕ является. Но документ возвращается автору из-за Б4, то есть
      круг 3 состоится в любом случае — значит клаузу дешевле внести В ДОКУМЕНТ
      тем же заходом, чем оставлять её жить только в этой записи: исполнитель Ф3
      читает приёмку, а не архив ревью. Замечания Н2, Н3, Н4 — та же логика.

# ─── СХОДИМОСТЬ ЦИКЛА ───────────────────────────────────────────────────────
cycle:
  blocking_by_round: {round_1: 3, round_2: 1}
  round1_genus: >-
    Все три блокирующих круга 1 — ОДИН род: «объявлено и не производится».
    Б1 — признак готовности назвал держателем механизм, которого нет ни в одном
    доме; Б2 — раздел объявил «обязано это доказать» и формы доказательства не
    назвал; Б3 — решение объявило наблюдаемое из двух половин и производителя
    второй не завело.
  round2_genus_repeat: >-
    ДА, И ЭТО НАХОДКА О ПРОЦЕССЕ, А НЕ О ДОКУМЕНТЕ. Б4 — тот же род второй раз
    подряд: наблюдаемое объявлено, производителя нет. Три экземпляра круга 1
    закрыты, четвёртый найден в разделе, который круг 1 проверил и ПРОПУСТИЛ.
  why_round1_missed_it:
    reviewer_error_named_first: >-
      Промах мой, и называю его прямо. Круг 1 проверял §5 ДВУМЯ переписями —
      «метка без строки» и «строка без метки» — и объявил «43/43 без дыр, без
      дублей». Обе переписи верны и обе отвечают на вопрос «ЕСТЬ ЛИ СТРОКА».
      Ни одна не отвечает на вопрос «ПРОИЗВОДИТ ЛИ названная фаза то, что
      сценарий требует», а блокирующее лежит именно там. Мой предикат был слеп
      к целому виду дефекта, и слепота эта молчаливая: она не даёт ни красного,
      ни зелёного.
    second_instance_same_round: >-
      Тем же кругом я проверил «задачи-производители: все 9 существуют и OPEN» —
      утверждение истинное и НЕ ОТНОСЯЩЕЕСЯ К ДЕЛУ. Существование задачи не
      говорит, что её ПРЕДМЕТ производит отданные ей сценарии. Проверь я предмет,
      расхождение Ф5 (#1773 — доставка письма, а сценарии — восстановление)
      вскрылось бы кругом раньше.
    what_the_predicate_must_become: >-
      Перепись §5 обязана сверять не наличие строки, а ПАРУ: каждое «Тогда»
      требует производителя определённого рода (отказ, значение, запись,
      величина), и столбец «что она обязана произвести» обязан этот род нести.
      Плюс третья ось, которой не было вовсе: ведомость сверяется с ЭПИКОМ —
      номер фазы, её задача и её предмет обязаны совпадать с телом эпика, иначе
      производитель вытесняется перенумерацией незаметно для обеих переписей.
  class_moves_into_the_task_form: >-
    Род отвергает работу второй раз, поэтому он перестаёт быть замечанием и
    становится ШАГОМ ЗАДАНИЯ (`multi-agent-flow-orchestration.md` §14а,
    «Класс, отвергший работу ДВАЖДЫ, переезжает в форму задания»). Форма шага,
    обязательная ДО написания следующего круга сценариев: перепись
    производителей ПЕРВЫМ действием — по каждому «Тогда» назвать фазу, её
    задачу и род того, что она произведёт, сверить перечень фаз с телом эпика
    в обе стороны, и только потом писать сценарии. Круг 3 без этого шага
    заплатит за тот же класс третий раз.
  radius:
    unit: подраздел (заголовок §N либо §N.M)
    measured: изменено 14 · заведено 9 · не тронуто 15 из 29 прежних
    changed: [шапка, §0.3, §1, §1.1, §1.2, §1.3, §1.4, §1.5, §3.7, §4.3, §5, §7, §8, §9]
    added: [§3.8, §3.9, §10, §10.1, §10.2, §10.3, §10.4, §10.5, §10.6]
    untouched: [§0, §0.1, §0.2, §2, §3, §3.1, §3.2, §3.3, §3.4, §3.5, §3.6, §4, §4.1, §4.2, §6]
    note: >-
      §3.7 в «изменено» — АРТЕФАКТ границы раздела: единственная его дельта в
      том, что за ним теперь идёт §3.8, а не §4. Тело §3.7 идентично.
  number_and_radius_measure_different_things: >-
    Число блокирующих убывает 3 → 1. Радиус ПРАВКИ круга 2 при этом вырос
    (480 → 900 строк): правка расширяющая, а не переставляющая. Радиус
    БЛОКИРУЮЩЕГО круга 2, наоборот, самый узкий из всех, что были: одна таблица
    §5, семь её строк; §3 не трогается вовсе, потому что объявление сценариев
    верно. Оба движения — признак сходимости, но род повторился, и это
    перевешивает арифметику: см. `class_moves_into_the_task_form`.
  cycle_converges: >-
    ДА по числу и по радиусу. Круг 3 оправдан: предмет Б4 исполним ЭТИМ кругом —
    производители существуют (#1272 и #1271 открыты), и требуется привести к
    ним ведомость, а не дождаться чужой работы.
  declaration_matches_measurement: >-
    ДА. Автор объявил состав правки в шапке. Сверено посекционными отпечатками:
    §2 побайтово идентичен; все 43 строки сценариев Ф1-01…43 побайтово
    идентичны; §0.1, §4.1, §4.2, §6 не тронуты. Объявление сходится с деревом
    полностью — заявление НЕ шире сделанного.
  out_of_turn: >-
    НЕТ, приостановка не требуется. Производители §5 — фазы, которые
    разблокирует одобрение этого документа; это нормальный порядок приёмки до
    кода (ban #1). Б4 тем более не требует приостановки: он чинится правкой
    ведомости, а не чужой открытой задачей. Признак «производителей напишет
    другая ОТКРЫТАЯ задача, а не эта фаза» не выполняется.

