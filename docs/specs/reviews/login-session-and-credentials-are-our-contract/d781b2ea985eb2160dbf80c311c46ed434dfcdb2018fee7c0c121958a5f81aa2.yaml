# ─── ГРАНИЦА ЭТОГО ВЕРДИКТА — НАЗВАНА, А НЕ ПОДРАЗУМЕВАЕТСЯ ─────────────────
limits:
  - >-
    СТЕНД НЕ ПОДНИМАЛСЯ. О поведении продукта вердикта нет BY CONSTRUCTION:
    документ описывает то, чего ещё не существует, ни одно «Тогда» сегодня
    ничем не производится. Проверено ровно одно — что документ сходится с
    деревом и что его утверждения о дереве истинны на названных ревизиях.
    Автор объявил эту границу сам, и она верна; вердикт её наследует.
  - >-
    §3.9 проверен ЧИСЛЕННЫМ ОПЫТОМ над моделью задержки, а не замером на живой
    полосе входа — которой нет. Опыт отвечает на вопрос «вакуумен ли критерий»
    и НЕ отвечает на вопрос «каков разброс на будущем стенде». Величины опыта
    (2 мс против 90 мс) взяты из параметров, которые документ переносит
    дословно, а не выдуманы; форма распределения выбрана логнормальной как
    типичная для задержки ответа и сама предметом замера не является.
  - >-
    Соседние приёмки не рецензировались (рядом идут три полосы со своими
    предметами). Утверждения этого документа о ДРУГИХ документах дома
    (например число 34) проверены как числа, а не по существу.
  - >-
    Существование внешних задач проверено состоянием, заголовком и метками
    через `gh`; их ТЕЛО не рецензировалось. Круг 1 проверял только
    существование — чего оказалось мало (см. `cycle.why_round1_missed_it`);
    круг 2 добавил сверку ЗАГОЛОВКА задачи с предметом, который ведомость ей
    поручает, и именно она вскрыла часть «г» блокирующего Б4.
  - >-
    Б4 найден НЕ этим кругом в одиночку. Соседняя полоса, закрывавшая разбор
    `kacho#1272`, передала четыре наблюдения; каждое перепроверено здесь СВОИМ
    выражением и подтвердилось — а часть «г» при перемере оказалась ШИРЕ
    переданного: расходится с эпиком не только номер Ф6, но и задача Ф5
