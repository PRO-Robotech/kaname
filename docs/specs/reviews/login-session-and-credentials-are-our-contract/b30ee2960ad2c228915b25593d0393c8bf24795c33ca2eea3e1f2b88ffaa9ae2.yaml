reviewers_own_error_named_first: >-
  ДВЕ, обе — про мой собственный разборщик, и обе поймал контроль, а не внимательность.
  (1) Проверяя абзац §5 «счёт вхождений даёт на четыре больше числа различных
  меток», мой разбор столбца «сценарии» дал 70 при 67 различных — на ТРИ больше, и я готовил
  находку «число снова отстало». Расхождение с числом автора (71 = 67 + 4) разрешила единица:
  мой отбор строк брал только строки, начинающиеся с `| **Ф`, и пропустил строку `| почта — вне
  нумерации эпика | #1773 | Ф1-31 — вторая половина |` — четвёртую из четырёх, где сценарий
  стоит во второй строке. С ней 71 = 67 + 4; утверждение документа верно. Тот же класс, что
  §14 `testing-verdict.md`: разошлось с чужим числом — сперва проверяй свой разборщик.
  (2) Первая версия предиката Н-R8-2 — `переживание величины.*` без правой границы — давала
  **1** и объявила бы «сегодня 0» ложью: отрезок перескакивал в замок Ф1-65, где «снять» и
  «снятой» стоят по своему делу. Годная граница — «до „Для Ф1-65“» — даёт 0 при контроле
  `кончилась` → 1. Ровно та ошибка, которую запись круга 7 назвала у себя первой; я повторил
  её на другом отрезке той же строки и поймал только прогоном перед записью.

# ─── БЛОКИРУЮЩЕЕ КРУГА 7: ТОТ ЖЕ ОПЫТ, ДРУГОЙ РЕЗУЛЬТАТ ───────────────────
round_tasks:
  - id: Б-R7-1
    was: >-
      Редакция 9 завела ВТОРОГО писателя отсечки с отброшенным моментом — смену пароля, — а
      свойство «причина и актор принадлежат записи, чей момент стоит» держалось замком, который
      исполняет только ПЕРВОГО (выход); для смены пароля его не держал ни один сценарий и ни один
      замок, при том что последовательность «стоящая отсечка старше → смена пароля» на пути
      восстановления обязательна (Ф1-27).
    resolution: ЗАКРЫТО по всем трём частям своего предиката снятия — (а) И (б) при требуемом «(а) ЛИБО (б)», плюс (в)
    experiment:
      - >-
        (а) `awk '/^## §8 /,/^## §9 /' "$D" | grep -oE 'для Ф1-63 — .*для Ф1-64' | grep -ciE
        'смен[аыу] пароля|сменён пароль'` — редакция 9 → **0**, редакции 10 и 11 → **1**;
        контроль той же формы «выполнить выход» → 1 на всех трёх; отрезок существует (1 строка)
        на всех трёх. Слово «актор» в отрезке замка: редакция 9 → **0**, редакции 10 и 11 →
        **6** — замок утверждает три величины, как «Тогда» Ф1-63.
      - >-
        (б) `awk '/^### §3.3 /,/^### §3.4 /' "$D" | grep -E '^\| \*\*Ф1-' | awk -F'|' '$4 ~
        /смен[ёе]н пароль|смена пароля|сменил пароль/ && $5 ~ /причин/' | wc -l` — редакция 9 →
        **0**, редакции 10 и 11 → **1** (Ф1-67); контроль «Когда» выход, «Тогда» причина → 1
        (Ф1-63) на всех трёх. Прогнано под `mawk 1.3.4` этой машины — той самой, о которой
        §10.16 говорит, что класс `[ёе]` в ней байтовый; предикат проходит на литерале «смена
        пароля», как автор и объяснил.
      - >-
        (в) адъюдикацией пункта §4.2 «запись монотонна» (стр. 1143–1204): в нём есть
        предложения, где смена пароля стоит рядом с «отбрасывает / отброшенным моментом» И с
        «причину и актора» вне случая равных моментов («Писателей с отброшенным моментом с
        редакции 9 ДВА, и держатель у каждого свой»; «сегодняшняя операция переписала бы причину
        и актора так же»; «Что запись с отброшенным моментом переписала бы … После
        принудительного выхода — и причину, и актора»), и назван обязательный путь (Ф1-27,
        восстановление у личности, входившей нашей посадкой до него). Строка Ф3 §5 несёт «Ф1-67:
        то же для смены пароля — второго писателя с отброшенным моментом» и обязательность пути.
      - >-
        Замок §8 прочитан целиком (строка группы отзыва, 3-й столбец): исполняет ОБА глагола на
        одном «Дано» — выход, затем «отдельным прогоном той же пробы на том же „Дано“» смену
        пароля ЕЁ путём записи (одной транзакцией с материалом и снятием записей прочих), —
        утверждает ТРИ величины (момент, причина, актор) после каждого плюс исход Р4 на втором;
        положительный контроль в той же пробе (запись с большим моментом ставит свои причину и
        актора); отрицательный контроль назван поимённо — сегодняшняя операция (`GREATEST` у
        момента, `EXCLUDED` у причины и актора) краснеет на втором прогоне и молчит на
        положительном контроле. Отрицательный контроль воспроизведён моим кодом: мир A
        (первый наш вход 1.2 < принудительный выход 1.5 < входы 1.6, 1.7; смена из 1.6) —
        верная операция даёт (1.5, «принудительный выход», администратор), дешёвая —
        (1.5, «смена пароля», человек): краснеет.
      - >-
        Форма держателя (в) — сценарий на принудительном выходе плюс замок плюс проза —
        проверена моделью §10.16 своим кодом: на пути восстановления при акторе смены ∅ дешёвая
        операция даёт то же, что верная, — (1.8, «смена пароля», ∅) — то есть близнец Ф1-63 на
        восстановлении был бы вакуумен by construction; на принудительном выходе различимы обе
        оси при любом акторе. Выбор — замер, не вкус; принято.
      - >-
        Конструируемость «Дано» Ф1-67 — названным домом, без второго факта: наш вход до
        принудительного выхода — Ф1-01; принудительный выход — F4d-24 (первый дом, APPROVED;
        `git grep -c 'rpc ForceLogout' -- proto/kaname/cloud/iam/v1/internal_iam_service.proto`
        → 1; `force_logout.go:206` `reason := strings.TrimSpace(req.GetReason())`, `:232`
        `revokedBy := domain.UserID(actor)`, `:214` `RevokeBefore: now`); два повторных входа —
        Ф1-01/Ф1-13. Порядок моментов задан правилами документа, а с редакции 11 первый факт
        назван в «Дано» словами, а не выведен (OPP-R8-1).
      - >-
        Норма одного факта: близнец Ф1-67 — Ф1-17 с причиной «принудительный выход», тот же
        принудительный выход без смены пароля за ним, по тому же образцу, что Ф1-27 для Ф1-63
        (принят кругами 5…7); положительная половина — в самом сценарии («первая годна»).
        Строка §7 инв. 2 для §3.3 называет пару и почему близнец не на восстановлении.
    facts_verified_myself:
      - >-
        Операция записи: `internal/repo/kaname/pg/user_token_revocations_repo.go`,
        `upsertRevokeAllSQL` — `revoke_before = GREATEST(...)`, `reason = EXCLUDED.reason`,
