      - >-
        Дифф §3 по ячейкам, своим разборщиком: 9 → 10 — ровно одна новая строка (Ф1-67), ни
        одна существующая ячейка не изменена; 10 → 11 — изменены «Дано» Ф1-63 (279 → 473
        символов), «Дано» Ф1-67 (353 → 465) и «Тогда» Ф1-67 (1862 → 2176); дифф «Тогда»
        Ф1-67 по предложениям — заменено одно предложение о покрытии обязательного пути двумя
