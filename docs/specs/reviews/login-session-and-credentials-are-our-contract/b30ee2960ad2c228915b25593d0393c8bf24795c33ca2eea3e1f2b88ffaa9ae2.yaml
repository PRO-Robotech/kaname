cycle:
  blocking_by_round: {round_1: 3, round_2: 1, round_3: 0, round_4: 1, round_5: 1, round_6: 1, round_7: 1, round_8: 0}
  genus_of_round_8_findings: >-
    Блокирующих ноль. Оба содержательных незаблокировавших (Н-R8-1, Н-R8-2) — того же рода,
    что четыре предыдущих блокирующих («держатель не отличает верную реализацию от дешёвой на
    своём „Дано“»), и здесь они НЕ блокируют по названному основанию: дешёвая реализация не
    делает ложным ни одно «Тогда», отклоняется в сторону большего отзыва и только внутри
    остатка, который документ уже назвал свойством с действием оператора. Признак для
    следующего круга, если он будет: перечень осей вопроса круга 6 у документа теперь шесть
    строк; седьмая — «от чего отсчитывается момент, когда ранняя запись перестала
    существовать» — выводится из второго замка Ф1-64, а не составляется заново.
  what_went_right: >-
    Блокирующее круга 7 закрыто по всем трём частям предиката, причём обоими исходами (а) и
    (б), где требовался один; форма держателя выбрана замером с моделью, которую я
    воспроизвёл. Обе находки оппонента до круга 8 приняты замером и закрыты фактом в «Дано» и
    определением единицы — не оговоркой; при этом ни одно решение, ни одно «Когда», ни один
    утверждаемый факт «Тогда» не тронуты, что сверено диффом по ячейкам, а не списком «НЕ
    тронуты». Четыре из пяти незаблокировавших закрыты; перепись §5 сходится в обе стороны;
    отставшее число снято как класс, а не поправлено; ошибка собственного `awk` названа
    автором вместе с ценой.

limits:
  - >-
    СТЕНД НЕ ПОДНИМАЛСЯ. Утверждения о поставщике и о крае (граница `After(cutoff)`,
    порядок «сессия выдана → отсечка записана» на живом восстановлении) я не исполнял — как и
    автор; дерево платформы этот круг не открывал, координата края взята из записи круга 7.
  - >-
    Модели §10.16/§10.17 исполняют правила ДОКУМЕНТА и сегодняшнюю операцию записи дерева; они
    не утверждают, что исполнитель Ф3 напишет два пути. Именно поэтому держатель — замок и
    сценарий, а не код.
  - >-
    Обход соседей вёл по СВОЙСТВУ «что пишет смена пароля, от чего считается момент, что
    гасит»: Ф5, Ф11, F4d — по названным строкам и отпечаткам; ID-PW-1, Ф4, «непустой проект» и
    187 воркспейсных соседок не перечитывал — круги 3, 4 и 7 сделали это, а предмет редакций
    10 и 11 лежит в §3.3, §4.2, §8 и у трёх названных соседок. «Противоречий больше нет» я не
    утверждаю.
  - >-
    Перепись §7 инв. 2 по девяти полосам, не тронутым редакциями 10 и 11, не адъюдицировал
    заново — сверил дельту (§3.3: +Ф1-67) и неизменность строк §3 остальных полос диффом по
    ячейкам.
  - >-
    Н-R8-1 и Н-R8-2 оценены как незаблокировавшие суждением о цене, а не предикатом: ближайший
    предыдущий круг, столкнувшийся с этим родом на «Дано» из двух сессий (круг 6), заблокировал,
    потому что дешёвая реализация там оставляла чужое устройство в сессии после смены пароля —
    видимый арендатору дефект. Здесь видимого дефекта нет ни у арендатора, ни у оператора; если
    владелец считает единый момент контрактом той же силы, что «все прочие», это блокирующее
    следующего круга, и предикат у него уже назван.
