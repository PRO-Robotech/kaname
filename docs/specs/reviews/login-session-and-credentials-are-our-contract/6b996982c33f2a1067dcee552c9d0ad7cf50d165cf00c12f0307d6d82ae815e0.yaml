    summary: >-
      §5, строка Ф3 (строка 1512): столбец меток приведён (Ф1-53…58, Ф1-63…65, Ф1-67), а столбец
      предмета по-прежнему обязывает Ф3 производить свойства четырёх снятых сценариев —
      «печенье прежнего поставщика после перевода — отсутствие сессии на обоих читателях края,
      пока посадка наша (Ф1-52), его оживание при откате посадки до своего срока (Ф1-60) и отказ
      ему после отката (Ф1-61, Ф1-66; после отката отсечку читает внешняя полоса — F4d §1.5)», а
      запись отсечки выходом и сменой пароля подписана метками Ф1-61 и Ф1-66. Предмет снят
      самой редакцией 16 (§3.10), заголовок которой объявляет §5 (строка Ф3) правленым.
    why_blocking: >-
      Ведомость производителей — единственное место, где фаза получает заказ; живая строка
      заказывает Ф3 откат и оживание печенья, которых нет (kaname#363, kacho#2792). Предикат
      сверки Ф3 §7.1 читает только столбец меток (cut -f4) и этого не видит — пусто при 43 из 43.
    fix: >-
      В столбце предмета строки Ф3 снять три пункта о печенье поставщика и откате; пункты о
      записи отсечки выходом и сменой пароля переадресовать на замок момента записи §8 и живые
      Ф1-63, Ф1-64, Ф1-67, без меток Ф1-61 и Ф1-66.
