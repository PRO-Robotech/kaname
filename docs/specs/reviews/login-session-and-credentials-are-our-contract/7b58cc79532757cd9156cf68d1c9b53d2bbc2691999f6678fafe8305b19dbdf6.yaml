questions:
  - q: новая редакция исполняет РОВНО замечание — ни шире, ни уже
    answer: >-
      ДА и на одну копию ГЛУБЖЕ, с доказательством: четыре места круга 9 (800→817 «Дано» Ф1-63,
      803→820 пояснение «Тогда» Ф1-67, 1214→1234 §4.2 «оставшиеся две», 2030→2052 §8 замок Ф1-66)
      правлены словом по образцу how_to_close; пятое (§5, строка Ф3: «обязательна» →
      «возможным, не обязательным», с отзывом редакций 10…12) найдено вторым предикатом и
      названо опровержением посылки круга. Ни один факт «Тогда» не тронут — дифф 3d346ddd..639bade4
      меняет только эти пять ячеек/абзацев, шапку, §10.18 (указатель у числа «три») и новый
      §10.19. Записи редакций 10…12 и §10.16…§10.18 оставлены как записи своих редакций — верно
      (история добавляется, не переписывается).
  - q: у каждого нового/изменённого «Тогда» есть производитель; у снятого назван предмет
    answer: >-
      Новых «Тогда» нет; изменённые — только словом («возможный, не обязательный») с указанием
      производителя (`recovery_complete.go` пишет пароль сам, PR kaname#200; Ф3-19 — смена из
      сессии восстановления по текущему паролю). Снятого нет — снят был шаг в редакции 12, здесь
      снимаются его последние упоминания.
  - q: отрицания с положительным близнецом
    answer: >-
      Не затронуто редакцией: близнецы Ф1-63/Ф1-27 и Ф1-67/Ф1-17 те же; §8 замок Ф1-66 —
      отрицательный контроль «только полоса входа» и положительный Ф1-60 в том же прогоне — на
      месте (строка 2052).
  - q: прежние записи ревью не тронуты
    answer: ДА — `git diff ac9135bc..639bade4 -- docs/specs/reviews/` пуст.
  - q: соседи (ведомости соответствия) согласны
    answer: ДА — Ф3 §7.1/§7.2, Ф5 §13 (см. neighbouring_acceptances_reviewed).

