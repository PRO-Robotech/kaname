questions:
  - q: новая редакция исполняет РОВНО решение — ни шире, ни уже
    answer: >-
      Решение велело правку одной фразы §4.2 («этот шаг — глагол Р4»); автор перемерил и нашёл
      три копии — расширение законно и названо (§10.18). Но обход был по образцу
      `глагол Р4|обязателен|иного действия` — без словоформ «обязательная/обязательной/
      Обязательный», — и четыре живых копии той же посылки остались; редакция УЖЕ своего
      предмета — Б1. Факты «Тогда» не тронуты — подтверждено word-diff'ом Ф1-67 (правлено одно
      пояснение); перепись §5 — 67.
  - q: у каждого нового/изменённого «Тогда» есть производитель
    answer: >-
      Изменено одно пояснение в «Тогда» Ф1-67 — производитель прежний (замок §8, Ф1-67); §4.2:
      «новый пароль пишет само завершение одной транзакцией с отсечкой now» —
      `recovery_complete.go` `complete`: `ReplaceLoginVerifier` → `EndOtherSessions` →
      `UpsertCutoff(RevokeReasonPasswordChange)` → … → `IssueSession` в одной `Writer`-транзакции
      — есть на 6acf8f19 и ed547967. «Путь остаётся возможным» — Ф3-19/Р6 (смена по текущему
      паролю из живой сессии) — есть.
  - q: отрицания с положительным близнецом
    answer: Новых отрицаний нет; замки §8 не тронуты.
  - q: прежние записи ревью не тронуты
    answer: ДА — `git diff 6acf8f19..c6a3c12e -- docs/specs/reviews/` пуст.
  - q: соседи согласны
    answer: >-
      ДА по строкам, которые §10.18 называет (Ф5 §13 «ведомость с Ф3/Ф1 обновлена» — сходится с
      §5 строкой Ф5 и §4.2). Внутри документа — НЕТ: §8 (строка Ф1-66) и «Дано» Ф1-63 по-прежнему
      называют смену пароля из сессии восстановления обязательной — Б1.

