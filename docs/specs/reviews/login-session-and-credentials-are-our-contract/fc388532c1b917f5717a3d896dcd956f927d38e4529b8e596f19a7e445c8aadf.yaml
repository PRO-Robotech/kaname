blocking:
  - id: Б1
    class: распознаватель не знал словоформы — отозванная посылка живёт в четырёх местах, из них два — в «Дано»/«Тогда» сценариев
    where: строки 800 (Ф1-63, «Дано»), 803 (Ф1-67, «Тогда», предложение после правленого), 1214 (§4.2, пункт «оставшиеся две», абзац о «Дано» Ф1-63), 2030 (§8, строка «Ф1-52, Ф1-60, Ф1-61, Ф1-66 перевод стенда и откат»)
    what: >-
      Редакция 12 отзывает обязательность пути «новый пароль — глаголом Р4 из сессии
      восстановления» и в §10.18 объявляет перепись полной («ТРИ живых места»). Перепись шла
      образцом `глагол Р4|обязателен|иного действия` и не знала форм «обязательная смена»,
      «обязательной смены», «Обязательный путь». Остались: (800) «Дано» Ф1-63 — «поэтому
      обязательная смена пароля (Ф1-27) отсечки не сдвинула» — «Дано» называет шаг, которого в
      контракте больше нет; (803) в той же ячейке Ф1-67, через одно предложение после
      правленного «возможна, но не обязательна», — «Обязательный путь при этом покрыт обеими
      своими половинами»: ячейка утверждает оба и противоречит себе; (1214) «„Дано“ Ф1-63 —
      … после обязательной смены пароля»; (2030) §8 — «восстановление (Ф1-27) с обязательной
      сменой пароля из его сессии» — тест-план второй половины замка Ф1-66 строит «Дано» шагом,
      который §10.18 в том же документе называет «возможным, не обязательным».
    why_blocking: >-
      Два места об одном предмете внутри ОДНОЙ ячейки «Тогда» — читатель не может установить,
      какое действует; «Дано» Ф1-63 и §8 описывают устройство завершения редакций 10…11 —
      следующий исполнитель построит замок Ф1-66 обязательным шагом, которого нет
      (`recovery_complete.go` пишет пароль сам). Класс — `testing-verdict.md` §14 (свой
      разборщик молчит на неизвестной форме) и `writing.md` §1 (заявление шире сделанного:
      «три» при семи).
    how_to_close: >-
      Четыре правки словом (обязательная → выполненная/сделанная; «Обязательный путь» →
      «Путь через восстановление»; §8 — «с последующей сменой пароля из его сессии
      (возможной, Ф3-19)»); §10.18 — перепись заново предикатом со словоформами и число «семь,
      из них четыре вне записей кругов»; предикат снятия —
      `grep -n -iE 'обязательн(ый|ая|ой|ым) (путь|смен)' "$D"` вне §10.16…§10.18 и шапки → 0.

non_blocking:
  - id: В1
    where: §10.18, предикат переписи
    what: >-
      Предикат цитируется как `grep -n 'глагол Р4\|обязателен\|иного действия'` — форма
      экранирования `\|` годна для GNU grep без `-E`, но она же и есть причина Б1: образец
      знал одну словоформу из четырёх. Закрывается вместе с Б1.

