# ─── БЛОКИРУЮЩЕЕ КРУГА 4: ТОТ ЖЕ ОПЫТ, ДРУГОЙ РЕЗУЛЬТАТ ───────────────────
round_tasks:
  - id: Б-R4-1
    was: >-
      Откат воскрешает сессию того, кто вышел в нашей посадке, а документ объявлял окно
      отката «не шире, чем было бы без перевода». Модель круга 4 давала
      `перевод=да вышел=да → True` при `False` без перевода.
    resolution: ЗАКРЫТО по всем трём частям своего предиката снятия
    experiment:
      - >-
        МОДЕЛЬ КРУГА 4 ПРОГНАНА ДОСЛОВНО — воспроизводится: `перевод=нет вышел=нет → True` ·
        `перевод=нет вышел=да → False` · `перевод=да вышел=нет → True` ·
        `перевод=да вышел=да → True` · режим «все сессии» → False. Все пять строк как в записи круга.
      - >-
        ТА ЖЕ ОСЬ ПО ПРАВИЛАМ РЕДАКЦИИ 5 (отсечка выхода = первая аутентификация личности
        нашим входом − ε; граница включающая, `AuthenticatedAt.After(cutoff)`):
        `перевод=да вышел=да → False`. Сменилась РОВНО та строка, которой круг блокировал;
        остальные три совпали. Окно больше не шире, чем без перевода.
      - >-
        (а) `grep -c 'не шире того, что было бы без перевода'`: редакция 4 → **2**,
        редакция 5 → **0**. Единственное оставшееся «не шире» (стр. 2008) — внутри §10.10,
        в абзаце «Своя ошибка — первой», и описывает утверждение ПРЕЖНЕЙ редакции как
        ошибочное, а не утверждает его.
      - >-
        (б) близнец заведён: `awk '/^### §3.10 /,/^## §4 /' | grep -ciE 'вышел|выход[а-я]* в
        нашей посадке'` — редакция 4 → **0**, редакция 5 → **1** (Ф1-61). Различие с Ф1-60
        одно — выход; Н-R4-8 закрыт тем же: «ни одна из пяти причин отзыва не наступала»
        стоит в «Дано» Ф1-52 и наследуется Ф1-60, Ф1-61 меняет ровно это.
      - >-
        (в) довод отказа от О2 «а» перепроверен по исправленной посылке (§10.9, абзац
        «Отвергнутый исход О2 «а»»): выигрыш поделён надвое, часть об отозванных закрыта
        механизмом без нового пути, отказ подтверждён. Оговорка к этой части — ниже, Б-R5-1.
      - >-
        Механизм не задевает Ф1-57: отсечка датируется РАНЬШЕ первой нашей аутентификации,
        все наши сессии аутентифицированы позже. Проверено моделью и границей края.
  - id: Н-R4-1…Н-R4-9
    was: девять незаблокировавших круга 4
    resolution: ВОСЕМЬ ЗАКРЫТЫ, один вне полномочий автора — перемерено по предикатам круга
    experiment:
      - >-
        Н-R4-1 (блокировка как писатель отсечки): фразы нет — `grep -nE 'её пишут смена
        пароля'` → 0 совпадений в Ф1-57; устройство вынесено в §5.1 (§7 инв. 1).
      - >-
        Н-R4-2 (сироты F4d-20/34): `awk '/^### §10.9 /,0' | grep -ciE 'F4d-20|F4d-34|сирот'`
        — редакция 4 → **0**, редакция 5 → **2**.
      - >-
        Н-R4-3 (третья ось §5, род): строка Ф3 §5 на `счётчик|наблюдаем|громк` — редакция 4
        → **0**, редакция 5 → **1**; на `повтор|текст` → **1**.
      - >-
        Н-R4-4 (конкурентность): `awk '/^## §3 /,/^## §4 /' | grep -ciE 'одновременн'` —
        редакция 4 → **0**, редакция 5 → **1** (Ф1-62); §8 несёт конкурентную пробу.
      - >-
        Н-R4-5 (шов с Ф11): §10.8 п. 1 на `Ф1-15|Р6` → **3**.
      - >-
        Н-R4-6 (строка «Статус» шапки): НЕ закрыт и закрыт автором быть не мог — правка
        шапки вне его полномочий. Переношу ниже как Н-R5-3, адресат прежний.
      - >-
        Н-R4-7 (единицы «полос»): единицы названы в §10.10 — тел 8 из 14, вхождений 14 в
        телах без учёта регистра и 13 с учётом, плюс 1 в заголовке. Расхождение разрешено
        единицей, а не выбором.
      - >-
        Н-R4-8 закрыт вместе с Б-R4-1 (выше); Н-R4-9 принят находкой по дороге (§10.10, п. 1)
        и строкой §4.2 «цена отката сессиями не исчерпывается».

# ─── БЛОКИРУЮЩЕЕ ──────────────────────────────────────────────────────────
blockers:
  - id: Б-R5-1
    title: >-
      Отсечка выхода не захватывает НИ ОДНОЙ аутентификации у поставщика, случившейся
      позже первой нашей, — а документ называет ОДИН источник такого из ДВУХ: поставщик
      поднят до S3 и доступен в окне НАШЕЙ посадки
    where:
      - §4.2, «Откат не отменяет отзыва», последний пункт («остаток — повторный цикл»), стр. 931–940
      - §4.2, строка «действующие сессии прежнего поставщика» — «У отозванных в нашей посадке не оживает ничего», стр. 812
      - §10.9, абзац «Отвергнутый исход О2 «а»» — «Часть об отозванных в нашей посадке закрыта БЕЗ нового пути», стр. 1973–1975
    sign: >-
      Сложение правил самого документа с ОДНИМ фактом одобренного соседа — та же форма,
      что у Б-R4-1. (1) §4.2: отсечка выхода датируется моментом раньше ПЕРВОЙ
      аутентификации личности нашим входом; граница включающая. Значит она не захватывает
      ничего, аутентифицированного позже этого момента — это свойство механизма, а не
      частный случай. (2) Документ называет РОВНО ОДИН источник такой поздней
      аутентификации — вход у поставщика «в окне отката» (повторный цикл), и условие
      остатка записано именно этими словами: `grep -nE 'в окне отката'` → стр. 934 и 939,
      других вхождений нет. (3) Второй источник существует и в окне отката не нуждается:
      компонент поставщика снимается стадией S3, а посадка переводится стадией S2 (F4d Р7,
      стр. 514: «подчарты и шаблонные артефакты снимаются — только со стендов, где значение
      уже `own` (S3)»), то есть ВЕСЬ период S2…S3 — тот самый, в котором живут Ф1-52,
      Ф1-60 и Ф1-61, — поставщик поднят, а его публичная полоса самообслуживания объявлена
      постоянным адресом стенда (`kacho:deploy/helm/umbrella/values.yaml`, стр. 18:
      `https://kratos.<domain> — Kratos public selfservice`; умолчание
      `kratosPublicBaseURL` собирается из него же в
      `charts/kaname/templates/_kratos-identity.tpl`, стр. 78). (4) Материал входа у
      поставщика при этом прежний — это находка самого документа (§10.10, «найдено по
      дороге», п. 1). Итог: человек, аутентифицировавшийся у поставщика ПОСЛЕ перевода и
      затем вышедший в нашей посадке, после отката снова обслуживается этой сессией — а
      без перевода его выход шёл бы потоком поставщика и погасил бы её. Окно шире, чем без
      перевода, БЕЗ повторного цикла; «У отозванных в нашей посадке не оживает ничего»
      остаётся шире истинного, и абзац остатка этого случая не называет.
    experiment: |
      Модель на правилах ДОКУМЕНТА (перевод 1.0 · наш вход 1.2 · выход 1.8 · откат 2.0 ·
      обращение 2.2), воспроизводится за секунду:
        E = 1e-9
        def alive_after_rollback(provider_auth, first_our_auth, logged_out, at, exp):
            cut = (first_our_auth - E) if logged_out else None
            return at < exp and not (cut is not None and provider_auth <= cut)
      вывод:
        печенье выдано ДО перевода        auth=0.0 -> False   # названо: Ф1-61 держит
        вход у ПОСТАВЩИКА в окне НАШЕЙ посадки auth=1.6 -> True    # НЕ названо
        для сравнения, названный остаток: вход у поставщика в окне ОТКАТА auth=2.2 -> True
      Без перевода вовсе выход идёт потоком поставщика и сессия мертва (§4.2, §5.1
      «Выход»; kacho:ui-future/shared/src/lib/kratos.ts, submitLogout) -> False.
      Предикаты факта (3), прогнаны мной:
        git show origin/main:docs/specs/sub-phase-F4d-identity-provider-posture-acceptance.md \
          | grep -nE 'подчарты и шаблонные артефакты снимаются'        # -> 514 (S3, не S2)
        git -C project/kacho show 45d1719fe8:deploy/helm/umbrella/values.yaml \
          | grep -nE 'public selfservice'                              # -> 18
        awk '/^## §4 /,/^### §4.3 /' "$D" | grep -ciE 'в окне отката'  # -> 2, оба про повторный цикл
    subject: >-
      Тот же род, что Б-R4-1, и та же цена: объявленное свойство безопасности уже, чем его
      производят правила документа, а разница приходится на выход после подозрения на
      компрометацию — ровно на тех, кому выход нужнее всего. Отличие от Б-R4-1 в размере
      населения, а не в существе: там страдал КАЖДЫЙ вышедший, здесь — вышедший, чья
      личность аутентифицировалась у поставщика после перевода. Читатель §4.2 (оператор
      отката) сегодня сверяет себя с условием «повторный цикл»; не найдя его у своего
      стенда, он заключит, что все вышедшие защищены, и не сделает того единственного, что
      закрывает случай, — принудительного выхода, который пишет отсечку моментом `now` и
      захватывает всё. Это действие существует и названо документом (Ф1-17), поэтому
      узкое условие прячет исполнимый шаг, а не только неточность. По ban #18 вопрос
      безопасности отвергает решение, расширяющее поверхность без НАЗВАННОГО расширения:
      расширение здесь наполовину названо.
    removal_predicate: >-
      (а) условие остатка §4.2 названо СВОЙСТВОМ, а не одним своим источником: отсечка
      выхода не захватывает ничего, аутентифицированного у поставщика позже первой
      аутентификации личности нашим входом, — и перечислены ОБА пути получить такую
      аутентификацию (окно отката · поставщик, поднятый до S3, в окне нашей посадки).
      Проверка: `awk '/^## §4 /,/^### §4.3 /' "$D" | grep -ciE 'в окне (нашей )?посадки|пока
      поставщик поднят|до S3'` → больше нуля, и рядом с «в окне отката» стоит второй путь;
      (б) сводная фраза «У отозванных в нашей посадке не оживает ничего» приведена к
      истинному подмножеству либо снята: `grep -c 'не оживает ничего' "$D"` → 0 либо
      вхождение несёт оговорку о моменте аутентификации; (в) довод §10.9 «закрыта БЕЗ
      нового пути» ограничен тем, что он действительно закрывает, — аутентификациями до
      перевода; (г) ИСХОД выбран автором и назван: принять как объявленную цену (тогда
      §4.2 отвечает на вопрос безопасности ban #18 и называет принудительный выход
      действием оператора) ЛИБО закрыть механизмом (напр. отсечка моментом `now` на выходе,
      если посадка умеет отличить наши сессии иначе, — но это уже решение о механизме и
      задевает Ф1-57, поэтому выбор за автором, не за мной). Заводить сценарий §3 круг НЕ
      требует: его «Дано» потребовало бы аутентификации у поставщика под нашей посадкой,
      а это предмет F4d, не Ф1; довольно строки §4.2 и, если исход (г) — цена, строки в
      §10.9 «Что осталось» с предикатом снятия S3.
    why_blocking_not_default: >-
      Дефолтом не лечится: выбор между «объявленная цена» и «механизм» есть решение о
      безопасности (ban #18) и о механизме — оба принадлежат автору, не рецензенту. А
      оставить как есть значит оставить в §4.2 утверждение, которое оператор отката
      прочтёт как гарантию.

# ─── НЕБЛОКИРУЮЩИЕ ────────────────────────────────────────────────────────
non_blocking:
  - id: Н-R5-1
    what: >-
      «Посадка помнит момент первой аутентификации личности нашим входом и ПОСЛЕ того, как
      та сессия кончилась» (§4.2, стр. 897) — новая хранимая величина, названная требованием
      к Ф3 в строке ведомости §5. Ни один сценарий §3 не строит «Дано», где первая сессия уже
      кончилась, и §8 замка на переживание не называет: у Ф1-64 обе сессии живы by
      construction («две сессии одной личности»).
    consequence: >-
      Реализация, помнящая момент первой аутентификации только пока та сессия жива, проходит
      Ф1-64 (там первая жива) и нарушает требование ведомости: после конца первой сессии выход
      из второй запишет отсечку её моментом — то есть ровно отвергнутый «момент своей сессии»,
      против которого Ф1-64 и заведён. Не блокирующее: требование СТОИТ в §5 и связывает
      исполнителя Ф3, а §10.11 честно называет соседний остаток той же оси («носитель,
      переживающий свою сессию») и объясняет, почему сценария о НЁМ не заводит. Здесь предмет
      уже: не форма носителя, а переживание ХРАНИМОЙ ВЕЛИЧИНЫ, и о ней решение уже принято.
