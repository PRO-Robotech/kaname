  - id: В2
    title: >-
      форма «дом:путь» внутри git grep -- даёт ТИХИЙ НОЛЬ
    detail: >-
      'PRO-Robotech/kacho:gateway/internal/**' — валидный pathspec, невалидный
      адрес: команда исполняется, возвращает 0, выглядит замером. Затронуты §1.2c
