blocking:
  - id: Б1
    title: >-
      DoD п.1 и §0.3 называют производителем вердикта проверку, которая документ не обходит;
      читателя вердикта нет НИ В ОДНОМ из двух домов
    sections: [§0.3, §9 п.1]
    predicate: >-
      python3 scripts/docs-gate/check-04-product-acceptance-verdict.py в
      PRO-Robotech/kacho-workspace @origin/main. Перепись: «дерево продукта
      project/kacho … документов .md прочитано 138, приёмок второго дома среди
      них 0». Грепом по выводу — 0 упоминаний login-session. Сам код check-04
      (строки 125-140) объявляет: «приёмок в каталоге acceptance/ в дереве
      продукта 0, в репозитории службы PRO-Robotech/kaname — 30. Их вердикт судит
      гейт ДОМА (kaname#11)». Встречный замер в kaname:
      git grep -hoE 'func Test[A-Za-z]*' -- internal/check/acceptance_*_test.go
      даёт три гейта приёмок — EditedAfterItsVerdictSaysSo, PathCoordinateResolves,
      ProbeCoordinateResolves; ни один вердикт не читает. Шире:
      git grep -lnE 'APPROVED' -- '*.go' ':!*_test.go' в internal/check — пусто.
    revision: kaname@b41f8f98 · kacho-workspace@origin/main
    why_blocking: >-
      Это признак готовности фазы, и он недостижим by construction: названная
      проверка документ не видит и видеть не должна (check-04 прямо отказывается
      судить чужое дерево — «два места об одном предмете расходятся молча»), а в
      доме читателя вердикта нет вовсе. DoD, который нельзя выполнить, закрывает
      фазу словом, а не фактом. Ровно тот класс, который корпус ловит: документ
      объявляет механизм, которого нет.
    outcomes: >-
      Исхода два. (а) Назвать держателем гейт ДОМА и завести его — читателя
      вердикта в internal/check, отдельным пунктом DoD, с инъекцией в обе стороны.
      (б) Переформулировать DoD на существующего держателя, сказав прямо, что
      машинного читателя вердикта у этого дома сегодня НЕТ и он заводится своим
      изменением. «Оставить как есть» исходом не является: §0.3 утверждает
      обратное тому, что делает check-04.
  - id: Б2
    title: >-
      §4.3 озаглавлен «обязано это доказать» и формы доказательства не называет; раздел без
      метки Ф1-NN, поэтому выпадает из самопроверки «43/43»
    sections: [§4.3, §8, §5]
    predicate: >-
      grep -nE '§4\.3|4\.3' по документу даёт РОВНО 3 попадания: 378 (сам раздел),
      400 (ведомость §5, привязка к Ф2), 443 (инвариант §7-7). В таблице §8
      (awk '/^## §8 /,/^## §9 /' | grep '^| ') восемь строк, все с метками Ф1-NN;
      строки для §4.3 нет. Предикат §5 «число строк с меткой Ф1- равно покрытому»
      §4.3 не считает by construction — метки у него нет.
    revision: kaname@b41f8f98
    why_blocking: >-
      Это единственное НЕОБРАТИМОЕ утверждение документа. Перенос 80 личностей
      (Р1, §4.1) — операция, после которой смена id ломает выдачи прав, членства
      и журналы, и откатить её нечем (ban #15). Всем сорока трём сценариям форма
      замка названа, а тому единственному, чья ошибка не откатывается, — нет.
      Производитель (Ф2) и инвариант (§7-7) названы, и этого мало: §8 объявлен
      «формой замка», и §4.3 в нём отсутствует.
    outcomes: >-
      Дать §4.3 строку в §8 — чем краснеет ДО кода (перепись id до и после
      переноса, равенство множеств) — и метку сценария, чтобы он попадал в счёт
      §5. Цена починки — две строки; цена пропуска — необратима.
  - id: Б3
    title: >-
      Р3 объявляет наблюдаемое из ДВУХ частей; вторая («время ответа не расходится
      систематически») не покрыта ни одним сценарием
    sections: [Р3, §3.1, §3.5, §7 п.3]
    predicate: >-
      grep -nE 'время ответа|систематическ' по документу — РОВНО 1 попадание,
      строка 227, внутри самого Р3. Обход §3 (awk '/^## §3 /,/^## §4 /') на
      'врем|тайминг|timing|задержк|систематич|constant.time' не даёт ни одного
      сценария. Следствие: у второй половины Р3 нет ни сценария, ни строки в §5,
      ни строки в §8.
    revision: kaname@b41f8f98
    why_blocking: >-
      Оракул закрыт наполовину, и вторую половину документ САМ назвал — то есть
      знает о ней и не завёл производителя. Класс не теоретический: Р1 переносит
      argon2 memory 64MB / iterations 3 (сверено в источнике, строки 515-519).
      Проверка пароля НЕСУЩЕСТВУЮЩЕЙ личности заканчивается до хеширования,
      существующей — после; разница в десятки миллисекунд измеряется тривиально.
      Ф1-02 и Ф1-03 будут побайтово равны и при этом различимы по времени —
      то есть §7 инвариант 3 («ни один отказ не является оракулом существования»)
      окажется зелёным при живом оракуле.
    outcomes: >-
      Завести сценарий на постоянство времени отказа для §3.1 и §3.5 (либо
      записать решением, что тайминг-полоса вне объёма, и вынести её в §6 с
      номером задачи). Второе — законный исход: §6 для того и существует. Чего
