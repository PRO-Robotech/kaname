questions:
  - q: новая редакция исполняет РОВНО решение kacho#1268 — снятие вместе с предметом, не ослабление; чтение `$2a$` остаётся; замер в §1
    answer: >-
      ДА. §3.8 — надгробие с перечнем четырёх снятых и их предмета; §4.3 — надгробие, ban #15 не
      отозван (в документе после ред. 14 ни одна операция `id` не касается); инв. 7 — «снят,
      номер сохранён»; §8 строка — надгробие; §4.2 «Порядка „перенос — до перевода“ больше нет»
      — сказано словами с носителем условия перевода (F4d §8 S2, ws#662). Р1 несёт то, что от
      популяции не зависит: формат в перечне читаемых и не записываемых — проверено в дереве:
      `internal/domain/password_hash_format.go:35` («ОТМЕТКА записываемости»), `:179 Writable:
      false`; `internal/passwordverify/verifier.go:207 bcryptMarkerPrefix = "$2a$"`, `:221
      HasPrefix`. §1.6 — команда, числа, дата, «этой редакцией не перемерен» — и я не могу
      перемерить тоже (контекстов kubectl 0). Ни одна снятая строка не «ослаблена»: дифф не
      содержит ни одного изменённого «Тогда» — только два «Дано» (Ф1-04, Ф1-52) со словом о
      происхождении значения и одно «Когда» Ф1-04 («пароль, которому значение соответствует»).
  - q: «Дано» Ф1-04 конструируемо ПОСЕВОМ — доказано посевом, а не полнотой перечисления
    answer: >-
      ДА, посев в дереве ЕСТЬ и исполняется: `internal/repo/kaname/pg/login_method_repo_
      integration_test.go:152,167,172,186,196` кладут `Verifier: lmVerifier(t, "$2a$12$…")`
      через писателя хранилища (репозиторий формат не судит — `Writable` читает только настройка
      «что писать», `password_hash_format.go:299–303`); `human_session_repo_integration_test.go`,
      `login_verifier_stays_inside_integration_test.go`, `usecase_test.go:246–274` (вход по
      `$2a$` и «не переписывается») — тот же посев на уровне use-case. То есть состояние «хранимое
      значение формата прежнего поставщика» продукт читает и проба кладёт — сегодня, на линии.
  - q: у каждого нового/изменённого «Тогда» есть производитель; у снятого назван предмет
    answer: >-
      Новых «Тогда» нет; изменённых «Тогда» нет (проверено диффом). У снятых Ф1-44…47 предмет
      назван — перенос П3, решение kacho#1268, §1.6; §5 строка Ф2 называет П1 (`kaname#95`,
      MERGED в линию 8ed128b9) и П2 (`kaname#137`, MERGED 68e66887) — оба на линии, заголовки
      «Ф2 П1: способ входа строкой и подтверждённость адреса», «Ф2 П2: проверяющий пароля
      следует за хранимым значением».
  - q: отрицания с положительным близнецом
    answer: >-
      Не затронуто по существу: §7 инв. 2 — девять полос (§3.8 снят, строка-надгробие оставлена,
      чтобы перепись читалась против прежних редакций) — 5·2·12·4·4·5·3·—·1·3; близнецы
      остальных полос те же, что в круге 10.
  - q: прежние записи ревью и шапка не тронуты; история добавляется
    answer: ДА — `git diff a154796c 7c5ee22c -- docs/specs/reviews/` пуст; строка «Статус» не менялась; §10.1…§10.19 не правились (дифф их не касается), §10.20 добавлен.
  - q: открытые вопросы — критичные или дефолтабельные
    answer: >-
      Один, назван автором в §10.20 («Остаток назван, а не подразумевается»): §3.10 без
      продуктового пути к нашей сессии той же личности без причины отзыва Ф1-17 — три исхода,
      выбор отдан оркестратору. ДЕФОЛТАБЕЛЬНЫЙ: документ уже держит исход 1 (пробы на посеве,
      срок жизни S2…S3 назван в §3.10), он ничего не отзывает, «Дано» конструируемо (вопрос
      выше), ни один факт «Тогда» от выбора не зависит; исходы 2 и 3 — новая редакция со своей
      записью. Дефолт зафиксирован в decisions.

