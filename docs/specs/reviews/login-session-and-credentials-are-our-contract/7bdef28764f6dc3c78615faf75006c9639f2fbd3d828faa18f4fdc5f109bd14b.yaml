decisions:
  - subject: >-
      §10.20 «Остаток»: §3.10 (Ф1-52/60/61/66) и механизм §4.2 «отсечка моментом раньше первой
      аутентификации» держатся на посеве значения формата прежнего поставщика; продуктового пути
      той же личности в нашу посадку без причины отзыва Ф1-17 после снятия переноса нет
    verdict: >-
      ДЕФОЛТ ЗАФИКСИРОВАН — исход 1 («оставить как есть: пробы на посеве, срок жизни S2…S3
      назван»). Основание: «Дано» конструируемо посевом, существующим в дереве (questions);
      ни один факт «Тогда» от исхода не зависит; исход 1 ничего не отзывает, исходы 2 и 3 —
      отзыв либо новый производитель, то есть новая редакция со своей записью. Решение о смене
      исхода — оркестратора, и оно принимается новой редакцией, не этой записью.
  - subject: Р1 переформулирован под ID-PW-1 («проверяющий следует хранимому значению»), формат `$2a$` читаемый и не записываемый
    verdict: >-
      принято — ратифицировано; перечень форматов и отметка записываемости в дереве,
      `Writable: false` у наследуемого формата
  - subject: §3.8, §4.3, инв. 7, §8 строка, §4.2 пункт — надгробия с сохранёнными номерами, метки Ф1-44…47 не переиспользуются
    verdict: >-
      принято — снятие вместе с предметом, не ослабление (`testing.md` §«Гейт на класс», п. 9);
      история добавляется, не переписывается
  - subject: третий вид кода `mail.confirm.send` не является предметом Ф1 (задание волны спрашивало о нём у Ф6)
    verdict: >-
      не рассматривался здесь — предмет Ф6, см. запись Ф6 этого круга

