# ─── Б4 ЗАКРЫТ: ЧЕМ ПРОВЕРЕНО ──────────────────────────────────────────────
blocker_round2:
  id: Б4
  was: >-
    Ведомость §5 называла фазу по каждому сценарию, но названная фаза требуемого
    не производила: производитель отказа на действии (Ф6 эпика, #1272) был вытеснен
    из ведомости перенумерацией, Ф5 указывала на #1773 (доставка письма) вместо
    #1271 (восстановление доступа), обе половины Ф1-06 и Ф1-23 висели на одной
    фазе, а подтверждённость адреса не была поручена никому.
  resolution: ЗАКРЫТ
  verified_by:
    - part: а+б — отказ на действии и разведение Ф1-06
      how: >-
        Ф6 вернулась в ведомость СВОИМ номером и СВОИМ предметом (#1272,
        «подтверждение адреса»), и её столбец несёт род дословно: «ОТКАЗ НА
        ДЕЙСТВИИ, требующем подтверждённого адреса, называющий следующий шаг».
        Сверено пословно с «Тогда» Ф1-06 и Ф1-23 — «называющий следующий шаг»
        совпадает буквально, а не по смыслу.
    - part: в — подтверждённость доезжает до точки решения
      how: >-
        Поручено ЯВНО, а не оставлено остатком: столбец Ф3 несёт «подтверждённость
        адреса как поле сессии, видимое в точке решения». Цепочка производителей
        полна и все три звена названы: Ф2 (#1268) хранит «строку адреса и её
        подтверждённость» → Ф3 (#1269) проводит её в сессию → Ф6 (#1272) отвергает
        на действии. Пригодность Ф3 держать это поле проверена по ТЕЛУ #1269:
        его ПРИЗНАК — «край зовёт ОДИН адрес (GET /sessions/whoami) и получает
        четыре поля», то есть состав полей сессии есть собственный предмет #1269.
    - part: г — перенумерация
      how: >-
        Сверка с эпиком исполнена своим разборщиком против живого тела #1266:
        Ф2/#1268 · Ф3/#1269 · Ф4/#1270 · Ф5/#1271 · Ф6/#1272 · Ф11/#1280 —
        совпадают номером И предметом, шесть из шести. Ф5 приведена к #1271
        («восстановление доступа»), #1773 выведена из нумерации и стоит без номера;
        её отсутствие в эпике перемерено отдельно (`grep -c 1773` по телу эпика → 0).
    - part: порядок Ф3↔Ф6
      how: >-
        Названа клауза, которой круг 2 не требовал и которая закрывает промежуток:
        требование снимается с полос входа «не раньше, чем отказ на действии
        заработает». Без неё обе фазы по отдельности зелены, а продукт между ними
        остаётся без рубежа вовсе.
  fourth_outcome_accepted: >-
    Разбор #1272 дал исход «требование остаётся, рубеж переезжает со входа на
    действие». Он СОВПАДАЕТ с тем, что Ф1-06 и Ф1-23 объявляют с редакции 1,
    поэтому §3 не тронут — и это верное решение по цене круга: неверным было
    поручение, а не объявление. Сверено побайтово (см. numbers_remeasured).
  authors_own_predicate_check: >-
    Автор проверил свою посылку своим выражением и отчитался об исходе В ОБЕ
    СТОРОНЫ: полей подтверждённости в контрактах дома 0, в базовой миграции 0,
    оба ПОДТВЕРДИЛИСЬ, и рядом назван контроль (слово `verified` в тех же
    контрактах встречается, то есть предикат не слеп). Это ровно та строка,
    отсутствие которой делает «перемерил и сошлось» неотличимым от «не перемерял».

# ─── ГЛАВНОЕ ЭТОГО КРУГА: ПЕРЕПИСЬ ВОСПРОИЗВОДИТСЯ, НО НЕ ПОЛНА ────────────
census_of_the_third_axis:
  authors_number: 11
  reproduces: ДА — все одиннадцать воспроизведены моим разборщиком, ни одно не отвергнуто
  my_number: 15 мест сильных + 1 среднее = 16
  finding: >-
    ПЕРЕПИСЬ НЕ ПОЛНА, и это находка О ПЕРЕПИСИ, а не о строке. Тем же стандартом,
    которым автор нашёл свои четыре (#8…#11 — «столбец не нёс рода X»), я нахожу
    ещё четыре сильных и одно среднее. Радиус слепоты — не край выборки: это тот
    же класс, в той же таблице, на тех же 51 сценариях.
  my_standard_is_the_authors: >-
    Проверено на самоподобие: авторские #8…#11 суть «сценарий требует названного
    механизма — столбец назначенной фазы его не несёт». Мои пять построены тем же
    правилом; ни одно не строже. Если бы я применял более строгий стандарт, он
    отверг бы и авторские четыре — он их принимает.
  additional_places:
    - id: '12'
      scenario: Ф1-30
      required_genus: ограничение частоты на полосе восстановления («подряд N неверных кодов → отказ по частоте»)
      carried_by_column: НЕТ
      strength: сильное — род отсутствует В ТРЁХ независимых местах
      predicate: >-
        `awk '/^## §5 /,/^## §6 /' <файл> | grep -c 'частот'` → 1, и это
        единственное вхождение стоит в строке Ф3, не Ф5. Тело #1271 (ПРЕДМЕТ:
        «чеканка и проверка кода, его доставка, вызов существующего завершения»)
        и его ПРЕДИКАТ СНЯТИЯ («код чеканится, истекает, применяется однократно;
        повторное применение отвергается; журнал и отсечка работают неизменно»)
        ограничения частоты не называют тоже.
    - id: '13'
      scenario: Ф1-35
      required_genus: наблюдаемость — «отличимо, что проверка по базе утечек не состоялась»
      carried_by_column: НЕТ
      strength: сильное
      predicate: >-
        `наблюдаемост` в §5 целиком → 1 вхождение, и оно в строке `#1773`
        (доставка), а не в подфазе «политика пароля».
    - id: '14'
      scenario: Ф1-36
      required_genus: самоотчёт процесса при старте — «видно, что проверка выключена»
      carried_by_column: НЕТ
      strength: сильное
      predicate: '`самоотчёт` в §5 целиком → 0'
    - id: '15'
      scenario: Ф1-27
      required_genus: принуждение задать новый пароль до любого иного действия
      carried_by_column: НЕТ
      strength: сильное
      predicate: >-
        `задать` и `нов(ый|ого) парол` в §5 целиком → 0. «Отзыв прежних сессий»
        в столбце Ф5 — другой механизм: он гасит старое, а не запирает новое.
    - id: '16'
      scenario: Ф1-09, Ф1-10
      required_genus: >-
        атрибуты печенья (`same_site`, `path`, признак постоянства) и ОТСУТСТВИЕ
        ключа `domain` на посадке без доменного имени
      carried_by_column: НЕТ
      strength: >-
        среднее — род несёт ТЕЛО задачи (#1269: «Печенье: имя, срок, атрибуты
        (на адресной посадке — host-only)»), но не столбец. То есть здесь
        расходятся не ведомость и продукт, а ведомость и задача.
      predicate: '`печень`, `same_site`, `домен` в §5 целиком → 0 · в §3 → 3 (предикат не слеп)'
  borderline_rejected_and_why: >-
    Названы, чтобы мою перепись можно было опровергнуть так же, как я опровергаю
    авторскую. НЕ засчитаны: Ф1-20 («адрес числится неподтверждённым и подтверждение
    затребовано») — род несёт ИМЯ строки, «Ф4 регистрация и три следствия»;
    Ф1-18 (идемпотентность выхода) и Ф1-13 (различимость сессий для отзыва) —
    свойства операции «отзыв тремя способами», а не отдельные механизмы;
    Ф1-05 (отказ, различимый лишь доказавшему право) — проекция отказа, внутри
    «вход паролем»; Ф1-25/26 («отправлен код» / «письмо не отправляется») —
    чеканка и передача, а не доставка: доставка отделена Ф1-31 и отдана #1773
    верно; Ф1-43 — внутри семантики защиты форм; Ф1-47 — контроль, его форма
    названа §8.
  why_it_is_not_blocking:
    principle: >-
      РАЗЛИЧАЮТСЯ ДВА ДЕФЕКТА, И ОНИ НЕ ОДНОГО ВЕСА. Б4 был дефектом ПОРУЧЕНИЯ:
      фаза-производитель отсутствовала в ведомости вовсе (Ф6/#1272) либо была не той
      (Ф5→#1773, чей предмет — письмо). Мои пять — дефекты ПРОВЕРКИ: столбец
      «что она обязана произвести» есть род-сводка, которой ведомость сверяет саму
      себя, а поручение несёт столбец «сценарии» — и он покрывает 51 из 51.
    measured: >-
      Каждый из пяти сценариев СТОИТ в списке сценариев ПРАВИЛЬНОЙ фазы: Ф1-30 в
      «Ф1-25…30» у Ф5/#1271, Ф1-35/36 в «Ф1-32…38» у подфазы политики пароля,
      Ф1-27 в «Ф1-25…30» у Ф5, Ф1-09/10 в «Ф1-07…19» у Ф3. Исполнитель идёт от
      перечня сценариев к §3 и читает «Тогда» целиком — ни одно требование не
      остаётся непроизводимым. В Б4 этого не было: второй половины Ф1-06 не было
      в перечне НИ ОДНОЙ фазы, способной её произвести.
    consequence_named: >-
      Цена остатка названа честно и она не нулевая: следующий читатель, сверяющий
      ведомость по третьей оси, найдёт эти пять и потратит круг. Поэтому они
      записаны здесь поимённо с предикатами — чтобы круг тратил не он.
  the_real_finding: >-
    ТРЕТЬЯ ОСЬ — РУЧНОЙ ПРОХОД, И ПРОИЗВОДИТЕЛЯ У НЕЁ НЕТ. Первые две оси суть
    предикаты: их прогоняют и получают число. Третья — адъюдикация 51 «Тогда»
    против восьми столбцов, и она промахнулась ДВАЖДЫ ПОДРЯД у РАЗНЫХ людей:
    мой круг 2 не увидел ни одного из одиннадцати (я проверял наличие строки),
    круг 3 автора не увидел пяти из шестнадцати. Это свойство оси, а не
    небрежность прохода: у неё нет механизма, который делал бы её полноту
    наблюдаемой, и её неполнота МОЛЧИТ — ни красного, ни зелёного.
    §9 п. 3 вносит третью ось в признак готовности Ф1 и делает это ВЕРНО; но
    формулировка «ведомость сверена по трём осям» истинна как «проход выполнен»
    и не значит «проход исчерпывающ». Различать это обязан следующий читатель, и
    здесь сказано, чем именно они различаются.
  what_would_close_it: >-
    Механически ось выразима лишь частично: «столбец фазы обязан нести хотя бы
    один род из каждого «Тогда» её сценариев» машинно не решается — род живёт в
    прозе. Выразима её ДЕШЁВАЯ половина: перепись «сценариев у фазы N · различных
    родов в её столбце M», печатаемая рядом, делает под-перечисление ВИДНЫМ
    (у Ф3 сценариев 24 при восьми родах в столбце — само по себе не находка, но
    именно там мои четыре и лежат). Предмет отдельного изменения; задачу не завожу —
    прямой запрет владельца по лимиту, и она бы легла в чужой релиз.

# ─── РАЗВЕДЕНИЕ СЦЕНАРИЯ НА ПОЛОВИНЫ: ПОЛОВИНА НЕ ПОТЕРЯНА ────────────────
halves_split:
  checked_because: >-
    Расщепление нормы надвое уже стоило потери в соседней приёмке линии: половина
    получила строку, половина осталась в ПРОЗЕ, и перепись этого не увидела —
    знаменатель не изменился.
  here_it_cannot_happen_by_construction: >-
    Здесь обе половины стоят не только в поясняющей таблице половин, но и в
    ГЛАВНОЙ таблице, в столбце «сценарии», с пометкой половины:
    «**Ф1-06 (первая половина)**» у Ф3 и «**Ф1-06 и Ф1-23 — вторые половины**» у Ф6.
    ДОКАЗАНО ЭКСПЕРИМЕНТОМ, а не прочтением: мой разборщик разворачивал ТОЛЬКО
    главную таблицу и таблицу половин не читал вовсе — и всё равно вернул у
    Ф1-01, Ф1-06, Ф1-23, Ф1-31 по ДВА производителя. То есть перепись наличия
    видит обе половины, и потеря половины в прозе тут невозможна.
  sum_of_halves_equals_the_whole:
    Ф1-01: «выдана сессия, признак входа» → Ф3 «вход паролем; сессия» · «уровень уверенности» → Ф11 «значение уровня в нашей сессии» — обе половины покрыты
    Ф1-06: «вход состоится» → Ф3 · «действия отвергаются с отказом, называющим следующий шаг» → Ф6 (совпадение дословное)
    Ф1-23: «выданная сессия годна» → Ф4 «годная сессия, выданная регистрацией» (дословно) · «действия отвергаются» → Ф6
    Ф1-31: «ответ вызывающему не меняется» → Ф5 «ответ, не раскрывающий существования адреса» · «недоставленное видно» → #1773 (дословно)
  third_element_of_Ф1_06_adjudicated: >-
    «Тогда» Ф1-06 несёт и третье: «исход объявлен ОДИН и тот же на всех посадках».
    Производителя ему не назначено — и не должно быть: «объявлен» исполняет САМ
    документ, а не фаза. Та же форма у Ф1-22 и Ф1-35, и она у автора последовательна.

# ─── ПОЛЕ СЕССИИ, ВИДИМОЕ В ТОЧКЕ РЕШЕНИЯ ─────────────────────────────────
session_field_charge:
  charged_to: Ф3 (#1269), столбцом «что она обязана произвести»
  producer_is_fit: >-
    ДА. Сессия — собственный артефакт #1269 («Свой поток входа: форма → проверка
    пароля → сессия»), а состав её полей назван его же ПРИЗНАКОМ («край получает
    четыре поля»). Источник истины — Ф2 (#1268), потребитель — Ф6 (#1272);
    все три звена в ведомости названы, ни одно не подразумевается.
  precedent_is_NOT_structurally_identical_and_that_is_correct: >-
    Автор ссылается на прецедент «так же названо поле другой фазы» — это Ф11
    («значение уровня в нашей сессии», Ф1-01). Устроены они РАЗНО, и это надо
    сказать, иначе следующий читатель «починит» расхождение и сломает инвариант:
    у уровня уверенности есть СВОЙ сценарий (Ф1-01 объявляет его наблюдаемым в
    ответе), а у подтверждённости — нет и БЫТЬ НЕ МОЖЕТ: «поле сессии, видимое в
    точке решения» описывает УСТРОЙСТВО, а §7 инвариант 1 требует от «Тогда»
    наблюдаемого. Место в столбце производителя — единственное, где это
    требование выразимо, не нарушая инварианта. Размещение верное.
  residual_risk_named: >-
    У требования нет собственного замка: оно проверяется КОСВЕННО, через вторые
    половины Ф1-06/Ф1-23, то есть дефект Ф3 всплывёт в Ф6 — фазой позже. Страхует
    это клауза порядка («снятие требования с полос входа не раньше, чем отказ на
    действии заработает»), и она в §5 есть. Не блокирующее: косвенный замок всё же
    замок, а прямой был бы нарушением инварианта 1.

# ─── СВЕРКА С ЭПИКОМ — ПРОГНАНА МНОЙ, В ОБЕ СТОРОНЫ ───────────────────────
epic_reconciliation:
  source: живое тело PRO-Robotech/kacho#1266, раздел ДЕКОМПОЗИЦИЯ (13 фаз)
  forward:
    result: 6 из 6 СХОДЯТСЯ номером И задачей И предметом
    detail: >-
      Ф2/#1268 «хранилище удостоверений и перенос 80 личностей» · Ф3/#1269 «вход
      паролем, сессия, отзыв, выход» · Ф4/#1270 «регистрация и её три следствия» ·
      Ф5/#1271 «восстановление доступа» · Ф6/#1272 «подтверждение адреса —
      разобрать» · Ф11/#1280 «уровень уверенности (AAL)».
  reverse:
    result: 7 фаз эпика без сценариев здесь — ровно те, что документ и называет
    detail: Ф1/#1267 (сам документ) · Ф7/#1273 · Ф8/#1274 · Ф9/#1275 · Ф10/#1276 · Ф12/#1281 · Ф13/#1282
  outside_the_numbering:
    '#1773': >-
      ПРОВЕРЕНО: в теле эпика отсутствует (`grep -c 1773` → 0), поэтому стоит без
      номера фазы — верно. Номер ей дать нельзя: он снова занял бы чужой предмет,
      и это ровно механизм Б4.
  my_parsers_own_blind_spot_named: >-
    Мой разборщик выдал одну ложную строку — разделитель таблицы `---` прочёлся
    как строка фазы «без номера». Это шум МОЕГО выражения, не находка о документе;
    называю, чтобы следующий, прогнав тот же разборщик, не завёл её задачей.
  residual_not_blocking:
    what: >-
      Две строки ведомости заряжают #1269 предметами, которых нет ни в строке
      декомпозиции эпика («вход паролем, сессия, отзыв, выход»), ни в ПРЕДМЕТЕ и
      ПРЕДИКАТЕ СНЯТИЯ самой задачи: политика пароля (Ф1-32…38) и защита форм от
      подделки запроса (Ф1-39…43); туда же ограничение частоты (Ф1-07/08).
      Четырнадцать сценариев заряжены задаче, чей предикат снятия их не покрывает.
    why_this_is_NOT_the_Б4_class: >-
      Перемерено по телу эпика: политики пароля, защиты форм и ограничения частоты
      в декомпозиции НЕТ ВОВСЕ — ни одной фазой (`grep -niE 'полит|подделк|csrf|
      частот|перебор|утеч'` по телу #1266 даёт только прозу замера). Значит номер
      не ВЫТЕСНЕН чужим предметом (механизм Б4), а предмет РАЗМЕЩЁН там, где живёт
      его служба, и размещение объявлено явно — «подфаза без занятия номера».
      Это в точности тот исход, который круг 2 назвал одним из двух допустимых.
    what_closes_it: >-
      Привести ПРЕДИКАТ СНЯТИЯ #1269 к ведомости в момент открытия Ф3 — иначе
      фаза закроется зелёной без четырнадцати сценариев. Задачу на это НЕ ЗАВОЖУ:
      прямой запрет владельца по лимиту. Записано здесь, чтобы у остатка был адрес.

# ─── НЕЗАБЛОКИРОВАВШИЕ КРУГА 2: ПРИНЯТО ЛИ ПО СУЩЕСТВУ ────────────────────
non_blocking_adjudicated:
  - id: Н1
    claim: принято — величина внесённого различия объявлена
    ruling: ПРИНЯТО ПО СУЩЕСТВУ, НО НЕ ВЕЗДЕ
    verified: >-
      §3.9 несёт клаузу «порядка стоимости проверки пароля (§4.1) и НЕ БОЛЬШЕ»,
      и величина в §4.1 действительно есть: «argon2id, 64 МБ / 3 / 4». Дано Ф1-49
      переписано, «заведомое» из него убрано. То есть предмет замечания закрыт.
    residue: >-
      Слово «заведомым» уцелело В ДВУХ местах, и одно из них ЖИВОЕ: §8, строка
      «Ф1-48…51 … инъекция ЗАВЕДОМЫМ различием обязательна» — а §8 и есть тот
      раздел, по которому исполнитель строит пробу. Второе (§10.3) — запись
      прошлого круга, свидетельство, а не указание. Предикат: `grep -n 'заведом'`
      по документу → 2 попадания, строки 777 и 949.
      Не блокирующее: §3.9 и Ф1-49 — владелец величины, §8 объявляет ВИД замка,
      а не его параметр; читатель, дошедший до §8, уже прочёл §3.9. Но два места
      об одном предмете расходятся молча, и расходится обычно то, которое читают
      при написании кода.
  - id: Н2
    claim: число исправлено на 12 проб в 6 файлах, гейтов 3
    ruling: ПРИНЯТО, ПЕРЕМЕРЕНО МНОЙ
    verified: >-
      Все три предиката прогнаны в доме: `func Test` уникальных → 12 ·
      файлов проб → 6 · не-тестовых гейтов → 3. Рядом исправлен и РАЗБОР
      («шесть считало ФАЙЛЫ и было подписано „проб“») — то есть исправлено не
      число, а единица счёта, что и требовалось.
  - id: Н3
    claim: потолок годности и нижняя граница объявлены ПРАВИЛОМ ВЫВОДА
    ruling: ПРИНЯТО — ПРАВИЛО ДАЁТ ВЕЛИЧИНУ И К СЕБЕ НЕ ОТСЫЛАЕТ
    verified: >-
      Проверено на круговую ссылку прямо: потолок C определяется через Ф1-49
      («годен тот C, при котором инъекция краснеет»), а Ф1-49 от C НЕ ЗАВИСИТ —
      он зависит от внесённого различия и от критерия Ф1-48. Потребитель C —
      Ф1-50. Цепочка Ф1-49 → C → Ф1-50 разомкнута, круга нет.
      Правило даёт ВЕЛИЧИНУ операционно: при внесённом различии порядка стоимости
      проверки пароля Ф1-49 краснеет, пока размах меньше этого различия, — то есть
      C есть наибольший размах, при котором инъекция ещё отвергает. Это число,
      добываемое прогоном, а не отсылка.
      Направление самоограничения верное: щедрый потолок прячет настоящий оракул
      И одновременно роняет Ф1-49 — щедрость ловится, а не проходит.
      Нижняя граница выведена тем же способом и усилена воспроизводимостью
      (три прогона подряд). Обе внесены в печатаемое Ф1-48 — проверено по тексту.
  - id: Н4
    claim: сказано прямо, что выбор размаха величину не устраняет, а переносит
    ruling: ПРИНЯТО ПО СУЩЕСТВУ, НО НЕ ВЕЗДЕ
    verified: >-
      §3.9 несёт признание дословно, вместе с тем, почему перенос лучше исходного
      (потолок ограничивает ГОДНОСТЬ ЗАМЕРА, а не вердикт; он один на пробу, а не
      один на стенд) и с предупреждением, ради которого замечание и писалось.
    residue: >-
      §10.3 сохранил прежний довод без поправки: «Порог взят разбросом, а не числом
      миллисекунд, потому что абсолютная величина есть свойство железа стенда».
      §10.3 — запись круга 1, то есть свидетельство о прошлом; но довод в ней
      сформулирован как действующее обоснование, а не как то, что круг 2 уточнил.
      Не блокирующее по той же причине, что и остаток Н1.
  - id: В4
    claim: близнец назван для всех девяти полос §3
    ruling: ПРИНЯТО; ОДНА ЯЧЕЙКА ПОМЕЧЕНА ИНВЕРТИРОВАННО
    verified: >-
      Перепись отрицаний по полосам (5·1·5·3·3·5·3·1·1) воспроизводится
      пообъектно; таблица близнецов несёт девять строк из девяти.
    minor: >-
      Строка «§3.9 время → близнец Ф1-49» помечена обратно собственной логике
      соседней строки: у §3.8 близнецом названы ПОЛОЖИТЕЛЬНЫЕ (Ф1-44…46), а
      отрицание вынесено в инъекцию Ф1-47. По тому же правилу у §3.9 отрицание
      есть Ф1-49 (обязан краснеть), а положительный — Ф1-48. Механизм при этом
      верен и полон: контроль на месте, вакуумности нет. Инвертирована подпись,
      а не контроль, — поэтому мелочь, а не замечание.
  - id: В5
    claim: принято как СРОК, а не как дефект
    ruling: ПРИНЯТО, МЕТКИ ПЕРЕМЕРЕНЫ
    verified: >-
      #1773 → OPEN, метки `bug, blocked, P1, size:L, area:iam, release:identity`;
      #1269/#1271/#1272 → OPEN, `release:identity-own`. Различие релизов реально,
      и §5 теперь называет его строкой — а не оставляет предикату готовности
      релиза обнаружить его самому.

# ─── КЛЮЧЕВОЕ УТВЕРЖДЕНИЕ АВТОРА — ПРОВЕРЕНО ОПЫТОМ ───────────────────────
authors_key_claim_tested:
  claim: >-
    «Обе переписи наличия остаются зелёными при всех одиннадцати BY CONSTRUCTION —
    они отвечают на вопрос „есть ли строка" и пригодности не проверяют».
  is_it_about_impotence_or_completeness: >-
    ОБ ИМПОТЕНЦИИ, и это верная характеристика. Утверждение говорит «проверка НЕ
    СПОСОБНА увидеть этот вид дефекта», а не «дефектов больше нет». Если бы автор
    подал его как полноту, это было бы заявление шире сделанного; он этого не делает.
  tested_how: >-
    ЭКСПЕРИМЕНТОМ, а не прочтением: обе переписи наличия прогнаны моим разборщиком
    по РЕДАКЦИИ 2 — той самой, которую круг 2 отверг за Б4.
  result: |
    редакция 2 (с Б4):  меток §3 51 · покрыто 51 · метка без строки нет · строка без метки нет
                        фазы ведомости: Ф2 Ф3 Ф4 Ф5 Ф6 Ф11
    редакция 3 (Б4 снят): те же 51/51, те же шесть фаз
  conclusion: >-
    ПОДТВЕРЖДЕНО, и сильнее, чем заявлено. Обе переписи на дефектной редакции
    зелены — это доказывает импотенцию. Сверх того: НАБОР ФАЗ у обеих редакций
    ОДИН И ТОТ ЖЕ (Ф6 в редакции 2 присутствовала, но несла предмет «политика
    пароля»), поэтому и перепись по ИМЕНАМ фаз была бы зелена. Вытеснение
    перенумерацией ловится ТОЛЬКО сверкой ПРЕДМЕТА с эпиком — то есть третья ось
    обязательна не как строгость, а как единственный способ увидеть этот класс.

