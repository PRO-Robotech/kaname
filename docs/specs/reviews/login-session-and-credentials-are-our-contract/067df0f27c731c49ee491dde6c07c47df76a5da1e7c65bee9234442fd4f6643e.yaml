# ─── ЧТО ИСПОЛНИТЕЛЬ ОБЯЗАН УНЕСТИ ИЗ ЭТОГО КРУГА ─────────────────────────
defaults_fixed:
  - question: несёт ли Ф5 (#1271) ограничение частоты на полосе восстановления
    default: >-
      ДА. Ф1-30 заряжен Ф5 списком сценариев, и требование «отказ по частоте,
      величины настройкой» связывает #1271 наравне с остальными её сценариями —
      несмотря на то, что род-сводка §5 его не называет.
    binding_on: исполнителя Ф5 (#1271)
  - question: несёт ли подфаза «политика пароля» наблюдаемость несостоявшейся проверки
    default: >-
      ДА — и в обоих видах: «отличимо в наблюдаемости, что проверка не состоялась»
      (Ф1-35) и «в самоотчёте процесса при старте видно, что проверка выключена»
      (Ф1-36). Оба связывают #1269 наравне с Ф1-32…34, 37, 38.
    binding_on: исполнителя Ф3 (#1269), подфаза политики пароля
  - question: несёт ли Ф5 принуждение задать новый пароль
    default: >-
      ДА. «Требуется задать новый пароль до любого иного действия» (Ф1-27) —
      отдельный механизм, а не следствие отзыва прежних сессий.
    binding_on: исполнителя Ф5 (#1271)
  - question: какова величина ВНЕСЁННОГО различия Ф1-49, если читать §8, а не §3.9
    default: >-
      Та же, что в §3.9: порядка стоимости проверки пароля (§4.1) и НЕ БОЛЬШЕ.
      Слово «заведомым» в §8 читать как «объявленным величиной §3.9», а не как
      приглашение выбрать различие большим: большое различие делает Ф1-49
      проходимым при живом оракуле и положительным контролем его не оставляет.
    binding_on: исполнителя Ф3 (#1269), при написании пробы Ф1-48…51
  - question: покрывает ли предикат снятия #1269 всё, что ведомость ему поручает
    default: >-
      НЕТ, и это надо знать заранее: политика пароля, защита форм и ограничение
      частоты в его ПРЕДИКАТЕ СНЯТИЯ не названы. Ведомость старше — фаза не
      закрыта, пока её сценарии красны, даже если предикат задачи молчит.
    binding_on: оркестратора, открывающего Ф3

# ─── ГРАНИЦА ЭТОГО ВЕРДИКТА ───────────────────────────────────────────────
limits:
  - >-
    СТЕНД НЕ ПОДНИМАЛСЯ. О поведении продукта вердикта нет BY CONSTRUCTION:
    документ описывает то, чего ещё не существует, ни одно «Тогда» сегодня ничем
    не производится. Проверено ровно одно — что документ внутренне сходится и что
    его утверждения о дереве и о трекере истинны на названных ревизиях.
  - >-
    ТРЕТЬЯ ОСЬ ПРОВЕРЕНА РУЧНОЙ АДЪЮДИКАЦИЕЙ, а не предикатом, — потому что
    предиката у неё нет (см. census_of_the_third_axis). Значит МОЯ перепись
    подвержена ровно той же неполноте, что и авторская, и «шестнадцать» —
    нижняя граница, а не итог. Число названо так, чтобы его можно было
    опровергнуть: каждая находка несёт свой предикат, а отвергнутые кандидаты
    перечислены поимённо с причиной.
  - >-
    ТЕЛА ЗАДАЧ прочитаны у четырёх (#1269, #1271, #1272, #1773) и у эпика #1266.
    Тела #1268, #1270, #1280 НЕ читались — сверка с ними сделана по строке
    декомпозиции эпика, то есть по заголовку, а не по предмету. Вид дефекта,
    который здесь мог бы уцелеть, назван: предикат снятия задачи, не покрывающий
    заряженные ей сценарии, — ровно тот, что найден у #1269.
  - >-
    Соседние приёмки дома не рецензировались. Числа этого документа о ДРУГИХ
    документах (34 приёмки) проверены как числа, а не по существу.
  - >-
    §3.9 численным опытом в этом круге НЕ перепроверялся: круг 2 его уже поставил,
    и предмет круга 3 — ведомость, а не критерий. Проверено только то, что клаузы
    Н1/Н3/Н4 внесены и что правило вывода потолка не замкнуто на себя.
  - >-
    Этот вердикт — ЗАКЛЮЧЕНИЕ РОЛИ. Санкции он не выдаёт до внешнего события
    (см. effective_approval.publication_pending). Читатель, увидевший здесь
    APPROVED и не увидевший `event.status: performed`, обязан прочесть это как
    «вердикт есть, санкции ещё нет», а не как разрешение кодировать.
