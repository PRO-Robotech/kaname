reviewers_own_error_named_first: >-
  ТРИ, и все три — про мой собственный разборщик, а не про работу автора.
  (1) Перепись отрицаний §7 инв. 2 моим выражением дала 5·2·12·3·4·5·4·0·1·3 = 39 при
  объявленных 5·2·10·4·4·5·3·1·1·2 = 37. Я едва не записал расхождение находкой.
  Разрешается ЕДИНИЦЕЙ, а не выбором правдоподобного: документ считает «сценарий, чьё
  «Тогда» несёт отказ либо негодность», мой образец захватывал сверх того «не
  принимается», «краснеет», «не проходит». Числа при этом НЕ ДВИГАЛИСЬ ни в редакции 6,
  ни в 7, а множество сценариев осталось 64 — круг 5 перемерил ту же перепись своим
  выражением и получил объявленное. Находки нет.
  (2) Знаменатель приёмок воркспейса я взял как «любой .md со словом acceptance» и
  получил 188 против объявленных 187. Единица документа — файл, ОКАНЧИВАЮЩИЙСЯ на
  `acceptance.md`; лишний у меня — `docs/specs/KAC-170-acceptance-review-report.md`,
  отчёт о ревью, а не приёмка. Число документа верно для своей единицы.
  (3) Первый мой контроль к перебору значений отсечки вернул НОЛЬ по обеим строкам —
  и по «дешёвой», и по «верной» реализации. Ноль по обеим неотличим от слепого
  предиката, то есть контролем не был. Годный контроль — цель, заведомо выразимая
  монотонной отсечкой («оставить живыми две поздние»): он даёт 50 значений, и только
  после него ноль по первым двум строкам стал вердиктом перебора, а не его молчанием.

