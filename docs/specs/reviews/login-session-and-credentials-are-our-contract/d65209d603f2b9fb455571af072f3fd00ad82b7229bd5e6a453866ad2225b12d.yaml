# ─── БЛОКИРУЮЩЕЕ ──────────────────────────────────────────────────────────
blockers:
  - id: Б-R6-1
    title: >-
      У Р4 «гасит ПРОЧИЕ сессии» не осталось производителя: новый механизм сделал
      «прочие» ПЕРЕЧИСЛЕНИЕМ, а единственный сценарий задаёт ровно две сессии — и не
      отличает реализацию, снимающую ВСЕ прочие записи, от снимающей ОДНУ
    where:
      - §5.1, блок «Смена пароля гасит прочие ЗАПИСЯМИ, а не отсечкой», стр. 1289–1333
      - §3.3, Ф1-15 — «две сессии одной личности» → «первая годна, вторая — нет (Р4)», стр. 615
      - §2, Р4 — «Наблюдаемое: после смены пароля текущая сессия продолжает работать, вторая — нет», стр. 544
      - §8, строка «Ф1-14…19, Ф1-55…58, Ф1-63, Ф1-64 отзыв» — поимённые замки есть у Ф1-55, Ф1-56, Ф1-58, Ф1-63, Ф1-64; у Ф1-15 нет
    sign: >-
      Вопрос ВОЗНИК ВПЕРВЫЕ В ЭТОЙ РЕДАКЦИИ, и потому его не мог найти ни один прежний
      круг. До редакции 7 механизмом Ф1-15 была ОТСЕЧКА СУБЪЕКТА — одна строка, один
      предикат `alive(s) ⟺ auth(s) > cutoff`. При ней «все прочие» держится BY
      CONSTRUCTION: отсечка монотонна по моменту, поэтому «снять одну прочую, оставив
      более раннюю» невыразимо в принципе, и двух сессий сценарию хватало. Редакция 7
      этот механизм отозвала (Б-R6-2 оппонента, и отзыв ВЕРЕН — я перемерил его сам) и
      завела ПЕРВЫЙ исполнимый: «гасит прочие сессии личности снятием их ЗАПИСЕЙ». Записи
      снимаются поштучно, значит «все прочие» стало свойством ПЕРЕЧИСЛЕНИЯ — и теперь обе
      реализации, верная и дешёвая, выразимы. Сценарный набор за механизмом не пошёл:
      сценариев с тремя сессиями в §3 НОЛЬ (перепись ниже), §8 счёта не называет, а обе
      одобренные соседки, которых смена пароля касается, цитируют Ф1-15 как ДАННОСТЬ и
      его «Тогда» не производят — ID-PW-1 (7 строк) и Ф5 (1 строка), у Ф4 и «непустого
      проекта» 0. Производитель Р4 живёт здесь и больше нигде.
    experiment: |
      Правила взяты у самого документа: старый механизм — alive(s) ⟺ auth(s) > C, отсечка
      ОДНА на субъекта и монотонна (F4d Р5); новый — alive(s) ⟺ запись s не снята (§5.1).

      1) НОВЫЙ механизм: различает ли §3 верную реализацию и дешёвую?
         def impl_all(S, cur): return {s for s in S if s == cur}            # снимает ВСЕ прочие
         def impl_one(S, cur):                                             # снимает ОДНУ прочую
             others = sorted((s for s in S if s != cur), key=lambda s: s[1])
             return {s for s in S if s != others[-1]}
         сессий 2 (это и есть «Дано» Ф1-15): верная жива=[s1] · дешёвая жива=[s1]  -> НЕ РАЗЛИЧАЕТ
         сессий 3:                            верная жива=[s1] · дешёвая жива=[s1,s2] -> различает
         сессий 4:                            верная жива=[s1] · дешёвая жива=[s1,s2,s3] -> различает

      2) КОНТРОЛЬ, показывающий, что вопрос НОВЫЙ: выразима ли дешёвая реализация СТАРЫМ
         механизмом? S=[(s1,1.0),(s2,1.5),(s3,2.0)], перебор отсечки 0.00…3.99:
           оставить s1,s2 (дешёвая)              -> годных значений 0  — НЕ выразима
           оставить только s1 (верная, Р4)       -> годных значений 0  — НЕ выразима (это и есть Б-R6-2)
           оставить s2,s3 (КОНТРОЛЬ перебора)    -> годных значений 50, напр. 1.0
         Третья строка обязательна: без неё ноль в первых двух неотличим от слепого перебора.

      3) Перепись §3 своим разбором: сценариев 64; несущих «две сессии одной личности» —
         Ф1-15, Ф1-16, Ф1-57, Ф1-64; несущих три и более — НОЛЬ.
         `grep` по всему документу: «три сессии | трёх сессий | третья сессия» -> 0 по существу
         (три совпадения ложные — они на «предъявление внутри сессии»).

      4) Производитель у соседей: git grep -c 'Ф1-15' origin/main -- 'docs/engineering/acceptance/*.md'
         -> ID-PW-1 7 · Ф11 5 · Ф5 1 · Ф4 0 · «непустой проект» 0; у ID-PW-1 строка 985
         («настоящая смена по-прежнему даёт Ф1-15») и у Ф5 строка 429 (Д10) — обе ЦИТИРУЮТ.
    subject: >-
      Третий раз подряд ТОТ ЖЕ РОД, что у Б-R4-1 и Б-R5-1, только вывернутый: там
      объявленное свойство было УЖЕ производимого правилами, здесь оно ШИРЕ
