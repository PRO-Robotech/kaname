        Н-R5-2 (три перечня писателей отсечки, три единицы): ЗАКРЫТ — и закрыт СИЛЬНЕЕ,
        чем я просил. Моя посылка круга 5 была ЧАСТИЧНО НЕВЕРНА, и автор это перемерил:
