round_tasks:
  - id: Б-R5-1
    was: >-
      Отсечка выхода не захватывает НИ ОДНОЙ аутентификации у поставщика, случившейся
      позже первой нашей, а документ называл ОДИН источник такого из ДВУХ: второй —
      поставщик, поднятый до S3 и досягаемый в окне НАШЕЙ посадки — назван не был.
    resolution: ЗАКРЫТО по всем четырём частям своего предиката снятия
    experiment:
      - >-
        МОДЕЛЬ КРУГА 5 ПРОГНАНА ДОСЛОВНО — воспроизводится строка в строку:
        `auth=0.0 → False` (Ф1-61 держит) · `auth=1.6 → True` (вход у поставщика в окне
        НАШЕЙ посадки) · `auth=2.2 → True` (окно отката) · без перевода вовсе → False.
        Механизм редакции 5 круг 6 НЕ пересматривает и я его не трогал: блокировала
        узость ОБЪЯВЛЕНИЯ, и другой результат обязан быть в документе, а не в модели.
      - >-
        (а) оба пути названы, и остаток назван СВОЙСТВОМ:
        `awk '/^## §4 /,/^### §4.3 /' | grep -ciE 'в окне (нашей )?посадки|пока поставщик
        поднят|до S3'` — редакция 5 → **1** (ремарка о читателях края), редакция 7 → **2**,
        и второй путь стоит ПЕРВЫМ подпунктом «остаток», прежний — вторым. Рядом стоит
        общее основание обоих: «аутентификация у поставщика позже нашей первой».
      - >-
        (б) сводная фраза приведена к истинному подмножеству: `grep -c 'не оживает ничего'`
        → 1 в обеих редакциях, но вхождение редакции 7 несёт оговорку о моменте —
        «не оживает ничего из **аутентифицированного до перевода**», и следом названо, что
        оживает. Оговорка стоит теперь и в НОРМАТИВНОЙ колонке «становится», не только в
        «почему»: это находка оппонента Б-R6-3, принятая автором.
      - >-
        (в) довод §10.9 ограничен: «Часть об отозванных… закрыта без нового пути» получила
        границу — «закрыто то, что личность аутентифицировала у поставщика ДО перевода», —
        и сверх того новый довод, почему отказ от О2 «а» границей не пересматривается: «а»
        действует В МОМЕНТ перевода, то есть закрывает ровно то, что и так закрыто, а оба
        пути позднего печенья лежат ПОСЛЕ её действия. Довод я проверил и он верен.
      - >-
        (г) ИСХОД выбран автором и назван: объявленная цена. Механизм отвергнут с
        разбором — отсечка моментом `now` погасила бы и все наши сессии (Ф1-57, Ф1-64
        краснеют by construction), снятие сессий у поставщика заводит путь к снимаемому
        компоненту. По ban #18 расширение поверхности названо целиком, и рядом назван
        исполнимый шаг оператора — принудительный выход; предикат снятия остатка внешний
        (S3, `#1276`).
    facts_verified_myself:
