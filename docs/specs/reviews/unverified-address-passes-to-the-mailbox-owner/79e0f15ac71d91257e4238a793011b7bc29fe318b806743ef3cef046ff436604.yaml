minor:
  - kind: CONSTRUCTIBILITY
    note: >-
      §6 строка A458-11 называет «`seedEnrolledSecondFactor` с секретом, доступным пробе — есть».
      На e21f1222656d фикстура (recovery_failure_count_integration_test.go:174–) чеканит секрет
      локально и его не возвращает; секрет даёт `enrolledSecondFactor`
      (step_up_journal_integration_test.go:310), но она идёт глаголами церемонии под сессией.
      «Дано» конструируемо — писатель тот же, секрет у пробы в момент посева, — но фикстуре нужен
      возврат секрета; автору проб учесть, не читать «есть» буквально.
  - kind: FORMAT
    note: >-
      A458-11 «уровень после повышения равен уровню, который та же проба получает … на
      восстановлении подтверждённой записи» — относительное утверждение; конкретное значение
      уровня было бы точнее. Измеримо и в паре с близнецом падает, поэтому не блокирует.
  - kind: DISCLOSURE
    note: >-
      Свойство решения названо (§0, Р3, §3): удостоверения, оставшиеся на записи, после отметки
      действуют так же, как на подтверждённой, и снимаются администратором облака либо
      владельцем. Фраза «Отметка удостоверений не касается» верна о строках удостоверений;
      при правке соседних документов формулировку держать именно так, свойством, без
      расширения в сторону описания последствий.
  - kind: FORMAT
    note: >-
      §3 строка «личные токены человек снимает сам … без фактора, своей сессией» — утверждение
      о дереве без предиката; на исход сценариев не влияет.
  - kind: FORMAT
    note: >-
      Неблокирующие кругов 2–3 (положительный контроль A458-09 «предшествует» вместо «не
      превосходит»; форма сравнения клеток DoD п. 10 и пр.) правкой не тронуты — остаются к учёту.

