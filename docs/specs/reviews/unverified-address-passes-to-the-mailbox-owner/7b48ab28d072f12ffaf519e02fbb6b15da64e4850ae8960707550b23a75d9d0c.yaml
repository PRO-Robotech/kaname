  - "Близнец у каждого отрицания: A458-01 (а)(б), -06 ↔ -05, -07, -08 (положительный контроль), -09 (близнец и положительный контроль), -10; DoD п. 10 (б) — близнец на подтверждённом адресе."
  - "Scope — предикат задачи #458 (пара: неподтверждённый адрес переходит, подтверждённый — нет); «Вне объёма» с носителями и предикатами возврата; открытых вопросов нет."
  - "ErrInviteNotValid / INVITE_NOT_VALID / текст — существующий производитель глагола подтверждения (verification.go:62–83, :497); ErrInviteExpired — из объяснения отказа активации (user_repo.go:727)."

