round_1_blockers:
  B1: >-
    СНЯТ. A458-06 строит негодность так, как её судит база: (а) `RemoveMembership`
    (user_repo.go:1146–1200) одним оператором снимает членство и ставит
    `invite_expires_at = now()`, если других членств нет; (б) посев срока в прошлом. Активация
    судит `invite_expires_at > now()` (user_repo.go:692), объяснение — `<= now()` (:716) →
    ErrInviteExpired; часы глаголов не переводятся, код жив. «Продолжение» — повторное
    приглашение продлевает срок (`GREATEST(users.invite_expires_at, $7)`, user_repo.go:629–631).
    Обе ветви Р6 покрыты — заодно снято прежнее неблокирующее замечание о «снято».
  B2: >-
    ЧАСТИЧНО. Шов назван верно (между `uc.verifier.Verify`, login.go:294, и `sharedMoment` в
    `issue`, login.go:529), положительный контроль и DoD п. 3 — на той же постановке. Но
    различение «Р5 против отсечки» держится на часах, а не только на месте барьера — см. B5.
  B3: >-
    СНЯТ. П9 и DoD п. 10: кейс набора `kaname-recovery-lane` с близнецом, третий исход на
    стенде без посадки `own`, носитель `chart-own` (e2e-newman.yml:1140). Набор уже читает код
    дверью `GET /codes` и клетки — слушателем метрик (`_metrics_step`, kaname-recovery-lane.py:1448).
  B4: >-
    СНЯТ. Р5 — одно требование к выдаче входа без сравнения с сегодняшним поведением и без
    перечня видов материала; §11 правдив; факт и причина правки опубликованного названы в шапке.

blocking:
  - id: B5
    kind: CONSTRUCTIBILITY
    scenario: A458-09 «Дано» и его положительный контроль; DoD п. 2 (г), п. 3
    claim: >-
      На управляемых часах, которые §5 объявляет для всех сценариев («часы глаголов
      управляемые»), постановка «Дано» A458-09 зелена и БЕЗ требования Р5, то есть инъекцией (г)
      не краснеет. Механизм: и переход, и вход берут момент из одного источника отсечки
      (`CutoffClock`); в харнессе полосы формы это `momentclock.Func(clock.Now)` над
      `avClock`, который стоит, пока его не сдвинут (address_verification_harness_integration_test.go:87–101,
      :225, :233, :274). Переход пишет отсечку моментом `at` = T (recovery_complete.go,
      `UpsertCutoff{RevokeBefore: at}`); вход, отпущенный барьером, читает `m` = T и
      отвергается существующей проверкой `hasCutoff && !m.After(cutoff)` (login.go, `issue`,
      граница включающая) — это `issueBeforeCutoff`, а не Р5. Тот же исход, что у
      «положительного контроля отсечки», поэтому утверждение DoD п. 2 (г) «положительный
      контроль остаётся зелёным — это и показывает, что A458-09 судит Р5» на этой постановке
      ложно: зелены обе. DoD п. 3 (N параллельных входов той же постановкой) — то же.
    measured: >-
      Прочтено на d33a3b866abc: login.go:271–388 (admitted) и :510–603 (issue, sharedMoment,
      LockPersonForLogin, проверка отсечки); shared_moment.go:30–38; revocationpolicy/clock.go:76–88;
      recovery_complete.go:240–340 (UpsertCutoff моментом `at`); харнесс avLane — строки выше.
      Посев не ставился: вывод следует из сравнения двух равных моментов без ветвления.
    fix: >-
      В «Дано» A458-09 (и в DoD п. 3) назвать: между фиксацией перехода и снятием барьера
      источник моментов выдачи сдвигается строго позже отсечки (например, управляемые часы —
      на ≥ 1 мкс; либо харнесс с возрастающим источником), так что `m` > отсечки и отсечка вход
      не накрывает — отказ даёт только Р5. Положительный контроль оставить с барьером после
      чтения момента (там `m` = момент до перехода < отсечки при любых часах). Одним
      предложением сказать, что на стоящих часах обе постановки отвергаются отсечкой и Р5 не
      различают.

important_nonblocking:
  - "DoD п. 10 и A458-01: «клетка `queued` прибавила 1, `unverified` — 0» на общем стенде `chart-own` с соседними кейсами набора, бегущими тем же процессом, точной дельтой не утверждается; набор уже использует форму `>= 1` (kaname-recovery-lane.py:1703). Назвать форму сравнения (≥ 1 для своей клетки; для `unverified` — либо свой источник, либо снять утверждение со сквозного кейса, оставив его интеграции)."
  - "Не учтены (переносятся из круга 1, автор правил только блокирующие): согласия `consent_grants` прежнего держателя при переходе — назвать решение в Р3; харнессы A458-03 (токен-эндпоинт, полоса базового секрета) и A458-04 (ProjectService.Get) — не полоса формы, назвать харнесс каждой пробы; A458-02 «кто я края» в харнессе полосы формы — Resolve хранилища, назвать, что судится."
  - "Раскрытие: постановка A458-09 с положительным контролем описывает шов, на котором сегодняшняя смена материала другими путями (смена пароля, восстановление) не накрывается отсечкой. Р5 сформулирован требованием ко всякому такому пути, и исход вне перехода не утверждается — блокирующим не считаю; при правке B5 не добавлять текста о сегодняшнем исходе этих путей."

confirmed:
