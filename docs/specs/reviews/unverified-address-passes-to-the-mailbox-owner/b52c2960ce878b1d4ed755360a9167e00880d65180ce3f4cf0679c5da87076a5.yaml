previous_blocking_disposition:
  - id: B5
    kind: CONSTRUCTIBILITY
    scenarios: [A458-09, DoD п. 2 (г), DoD п. 3]
    outcome: closed
    note: >-
      «Дано» A458-09: переход фиксирует отсечку своим моментом T, затем источник моментов выдачи
      сдвигается строго позже (управляемые часы, ≥ 1 мкс), затем снимается барьер; дописано
      предложение о стоящих часах. DoD п. 2 (г) и п. 3 — та же постановка; п. 2 (г) прямо
      говорит, что без сдвига инъекция доказательством не считается. Конструируемость
      показана названной фикстурой: avClock харнесса полосы формы имеет Advance
      (address_verification_harness_integration_test.go:87–101, :179 старт в разрешении 1 мкс),
      источник отсечки — momentclock.Func(clock.Now) (:225, :233, :274). Момент выдачи и
      отсечка оба идут через sharedMoment с Truncate(time.Microsecond) (shared_moment.go:30–38;
      recovery_complete.go:219, :324 RevokeBefore: at), поэтому сдвиг ≥ 1 мкс переживает
      усечение: m = T + 1 мкс, проверка `hasCutoff && !m.After(cutoff)` (login.go:556) вход не
      накрывает, отказ может дать только Р5 — постановка способна покраснеть под инъекцией (г).
      Положительный контроль (барьер после чтения момента) читает момент до сдвига, m ≤ T,
      отвергается отсечкой при любых часах — различение Р5 и отсечки держится.

