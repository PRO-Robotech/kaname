blocking:
  - id: B1
    kind: CONSTRUCTIBILITY
    scenario: A458-06 (и его «Продолжение»)
    claim: >-
      Given «срок приглашения истёк до предъявления кода (часы глаголов переведены за срок)» при
      названных производителях не строится. Срок приглашения судит БАЗА своими часами:
      оператор активации — `invite_expires_at > now()` (internal/repo/kaname/pg/user_repo.go:692),
      его объяснение — `invite_expires_at <= now()` (:716). Часы глаголов на это суждение не
      влияют. Зато код восстановления судят именно часы глаголов
      (`ConsumeRecoveryCode … expires_at > $3`, recovery_code_repo.go:132, $3 = now глагола),
      а срок кода — 5m (config/required_settings.go:275). Перевод часов глаголов на сутки
      (срок приглашения A458-05) гасит КОД, а приглашение для базы остаётся живым: исход —
      единый отказ `access not restored`, а не `INVITE_NOT_VALID`. Сценарий краснел бы не тем,
      «Продолжение» с «тем же кодом» — тоже.
    measured: >-
      Прочтено на d33a3b866abc: user_repo.go:684–694 (ActivateInvite), :708–720
      (explainRefusedActivation), recovery_code_repo.go:122–134. Посев не ставился — исход
      следует из предикатов SQL без ветвления.
    fix: >-
      Строить негодность приглашения так, как её видит база: снятием приглашения
      распорядителем (оператор снятия ставит `invite_expires_at = now()`, user_repo.go:1188 —
      это заодно сценарий «снято» из Р6) и/или посевом `invite_expires_at` в прошлом
      писателем хранилища; часы глаголов не трогать дальше срока кода. «Продолжение» —
      повторное приглашение в пределах срока кода.
  - id: B2
    kind: CONSTRUCTIBILITY
    scenario: A458-09 (и DoD п.1, п.2 (г), п.3)
    claim: >-
      Место барьера названо «прошёл проверку пароля … до своей транзакции выдачи», и этого
      мало: исход сценария зависит от того, стоит ли барьер ДО чтения момента выдачи
      (`sharedMoment` в `issue`, login.go:529) или ПОСЛЕ него. Барьер после чтения момента
      даёт отказ уже сегодня существующей проверкой «момент не позже отсечки»
      (login.go:550–557, `issueBeforeCutoff`), то есть A458-09 зелен до кода, инъекция (г) его
      не краснит, а DoD п.1 требует красного до кода — проба при такой постановке упасть не
      способна. Оба места дают один и тот же «Тогда» (`401`/`16`), поэтому по тексту сценария
      их не различить.
    measured: прочтено login.go:271–388 и :524–603 на d33a3b866abc.
    fix: >-
      Назвать шов барьера: между сверкой пароля и чтением момента выдачи (например, обёртка
      над портом проверяющего — `Verify` в login.go:84 — возвращает «совпал» и ждёт
      барьер). Тем же предложением назвать вторую постановку (барьер после чтения момента)
      положительным контролем существующей отсечки, и сказать, что DoD п.3 строится той же
      постановкой.
  - id: B3
    kind: DoD
    where: §5 вступление, §8
    claim: >-
      Ни один сценарий не доведён до сквозной пробы через край, и DoD не содержит финального
      e2e/smoke. Это полоса замены поставщика (`release:identity-own`): готово только при
      сквозной пробе на стенде. Условие для неё в дереве есть: набор
      `tests/newman/cases/kaname-recovery-lane.py` уже читает код из письма приёмником стенда
      (`{{standMailboxUrl}}`, дверь `GET /codes`), заводит своих людей регистрацией и
      называет третью категорию для стенда без посадки `own`.
    fix: >-
      Добавить в DoD кейс(ы) набора восстановления: регистрация без подтверждения → запрос
      кода → завершение кодом из письма → прежний пароль `401`/`16`, новый `200`,
      `emailVerified: true`; и близнец на подтверждённом адресе. С ID сценариев (A458-01/02
      как минимум), строкой ведомости производителя, если её требует расширение набора, и
      третьим исходом «условие не создано» на стенде без посадки `own`.
  - id: B4
    kind: DISCLOSURE
    where: Р5 (третье предложение), §11
    claim: >-
      Р5 не ограничивается требованием: оно сравнивает сегодняшнее поведение пути выдачи по
      видам материала и называет, где именно сверка «вводится этим изменением» и на каких
      путях. Вместе с близнецом A458-09 это даёт постороннему в публичном репозитории
      координату, условие и следствие в одном месте (`security-disclosure.md`,
      disc-no-consolidated-assembly), а §11 утверждает обратное («сформулировано требованием,
      а не описанием сегодняшнего поведения»). Документ уже на origin.
    fix: >-
      Сформулировать Р5 одним требованием к выдаче входа (сверка предъявленного материала с
      хранимым после захвата строки человека, на любом материале) без сравнения с сегодняшним
      состоянием и без перечня, где это «уже так», а где «вводится». Близнец A458-09 оставить:
      он описывает наблюдаемое без перехода. Разбор сегодняшнего поведения — в задачу/дифф
      фикса, не в приёмку.

important_nonblocking:
  - "Согласия (`consent_grants`), выданные прежним держателем клиентам церемонии, переходом не снимаются: новый держатель войдёт в такой клиент без экрана согласия. Токенов прежнему держателю это не даёт (сессии и выданное отсечены), но решение — снимать ли согласия при переходе — стоит назвать в Р3 явно, с причиной."
  - "A458-04 (положительная половина: ProjectService.Get по привязке) и A458-03 (отказы токен-эндпоинта и полосы базового секрета) не исполнимы на харнессе полосы формы, куда §4.2 П8 кладёт все пробы: решение прав и токен-эндпоинт живут в харнессах cmd/kaname (`address_admission_ceremony_integration_test.go`, `ceremony_*_integration_test.go`) и internal_iam. Назвать харнесс каждой такой пробы."
  - "Р6 говорит «истекло либо снято», сценарий есть только на истечение; при исправлении B1 снятием распорядителя покрыть обе ветви или назвать, какая чем."
  - "A458-02 «кто я края (InternalHumanSessionService.Resolve)» — в харнессе полосы формы это Resolve хранилища (`avVerificationStore.Resolve`), а не глагол внутреннего слушателя; назвать, что судится."

confirmed:
  - "Производитель назван у каждого «Тогда»: §6, 14 строк из 14 (10 сценариев с близнецами и отказами полос); заказанные П1–П8 — одно изменение."
  - "Близнец у каждого отрицания назван: A458-01 (а)(б), -06 (A458-05), -07, -08 (положительный контроль), -09, -10; у положительных -02…-05 — близнец «адрес подтверждён» или «перехода не было»."
  - "Scope совпадает с предикатом задачи #458 (пара близнецов: неподтверждённый адрес переходит, подтверждённый — нет); «Вне объёма» с носителями и предикатами возврата."
  - "Смена адреса как путь возврата записи прежнему держателю закрыта: её предъявление требует живой сессии того же человека в подтверждённом положении (email-change-is-confirmed-from-the-new-address.md Р2), а переход снимает все сессии и пароль."
  - "Регистрация на строку приглашения даёт PENDING с паролем, допускаемый ко входу (login.go: `MaySignInToOwnLane`, комментарий Р11 п.1) — Given A458-05 строится."

