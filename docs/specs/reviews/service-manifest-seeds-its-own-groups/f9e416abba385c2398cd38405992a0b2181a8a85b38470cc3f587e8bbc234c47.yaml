verification:
  method: >-
    исполнение каждого предиката документа своими руками в собственной отсоединённой копии от
    головы ветки на origin; повторение опыта каждого блокирующего круга 1 и сверка исхода с
    записанным; воспроизведение сценариев сверки на `Compare` временной пробой; вывод
    конструируемости «Дано» из схемы И из цепочки применённых миграций, а не из свода; чтение
    четырёх APPROVED-соседей по спорным разделам; поиск открытых задач в двух трекерах по
    заголовкам и телам; чтение трёх записей ревью соседнего дома ради формы шапки.
  subject_digest_matches_current_document: true
  header_left_untouched: true
  document_untouched_by_reviewer: true
  predecessor_record_untouched: true

