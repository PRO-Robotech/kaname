reviewer_error_named_first:
  - >-
    ОШИБКА КРУГА 1 (той же роли), обнаруженная этим кругом и стоившая двух новых блокирующих.
    Круг 1 сверил §1.3 как счёт строк СВОДА (`0001_initial.sql`) и записал «СХОДИТСЯ по каждой
    координате и числу», не задав вопроса, что от этих строк оставляет ЦЕПОЧКА миграций.
    Ответ давали две применённые миграции того же каталога, обе процитированные документом:
    `20260909202745` (Up) снимает все десять членств и пять личностей — обе группы остаются
    ПУСТЫМИ; `20260913144108` (Up) переименовывает системный аккаунт `kacho-system` → `system`.
    Свод — не база; база — то, что остаётся после ВСЕХ миграций. Круг 2 мерил базу, не свод, и
    оба блокирующих (Б6, Б7) вышли из этого одного вопроса.
  - >-
    Первая половина исхода Б1 круга 1 («привести строку 8 к факту») ОТЗЫВАЕТСЯ этим кругом как
    противоречащая норме и практике дома — см. blockers_round1, Б1. Ошибка круга 1, не автора.
  - >-
    Техническое, вердикта не касается: первая версия временной пробы на `Compare` не собралась
    (`Result` не несёт `Census`) — переписана без переписи; итог опыта в numbers_remeasured.

