      среди них нет. `git log --all --oneline -- 'docs/specs/reviews/service-manifest*'` → 0
      коммитов. Комментариев у PR #150 — 0. Значит блокирующих, чей опыт надо повторить, не
      существовало, и пункт 2 задания беспредметен. Это ТРЕТЬЯ КАТЕГОРИЯ, а не «повторено и
