    outcome: ОПРОВЕРГНУТА
    how: >-
      Записи ревью для этого документа не существует и никогда не существовало. Каталога
      `docs/specs/reviews/service-manifest-seeds-its-own-groups/` нет; перечень ВСЕХ каталогов
