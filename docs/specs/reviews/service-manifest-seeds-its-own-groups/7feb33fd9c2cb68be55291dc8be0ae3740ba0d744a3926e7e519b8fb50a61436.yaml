verification:
  method: >-
    исполнение КАЖДОГО предиката документа своими руками в собственной копии; встречные
    выражения там, где предикат автора один (§2.5 — помодульно вместо потока, §1.1 — с сужением
    области); вывод конструируемости «Дано» из схемы, триггеров и внешних ключей дерева, а не из
    слов документа; чтение APPROVED-соседа целиком по спорному разделу; поиск открытой задачи в
    ДВУХ трекерах по заголовкам и телам.
  subject_digest_matches_current_document: true
  header_left_untouched: true
  document_untouched_by_reviewer: true
  predecessor_record_untouched: 'предшественника нет'

limits:
  - >-
    СТЕНД НЕ ПОДНИМАЛСЯ, база не поднималась. О поведении применителя, сверки паритета и миграций
    вердикта нет by construction: кода по документу нет до APPROVED (ban #1). Конструируемость
    «Дано» установлена выводом из схемы и дерева, а не посевом — сеять нечего.
  - >-
    ТРИ ОПЫТА §2.7 НЕ ВОСПРОИЗВЕДЕНЫ. Композиция модели с манифестом службы в перечне, опора
    паритета каталога и второй писатель каталога — их выходы (`composed=[]`, `added:[]`) требуют
    временного пакета и подъёма, которых этот круг не делал. Сверены только ВХОДЫ: канон 32
    типа, манифест `iam 7 19 False`, семь строк каталога у миграции. Это третья категория, а не
    подтверждение.
  - >-
    ОПЫТ §2.6 О ДИРЕКТИВЕ ВСТРАИВАНИЯ не повторялся временным пакетом. Проверены его посылки:
    пакета в корне нет (`ls *.go` — нет файлов), `grep -n 'manifest' Dockerfile` → пусто,
    встроенного читателя манифеста нет. Вывод «invalid pattern syntax» принят как свойство
    инструмента, а не перемерен.
  - >-
    ЧИСЛА ПЛАТФОРМЫ сняты на 45d1719fe8 — ревизии, объявленной документом и совпадающей с её
    origin/main на день круга. Гейты платформы этим кругом не гонялись: зелёное тамошнего гейта
    об этом дереве не говорит ничего, и обратное тоже.
  - >-
    ВОРКСПЕЙСНЫЕ НАБОРЫ (`scripts/docs-gate/run-all.sh`, `scripts/check-doc-commands.py`) этим
    кругом не прогонялись; утверждение PR о них не проверено.
  - >-
    ЧИСЛА ПЕРВОГО ПРОГОНА ГЕЙТА, снятые в ЧУЖОЙ рабочей копии, в эту запись не попали ни одним
    пунктом: они вердикт о другом дереве. Всё, что здесь названо числом, снято в w9-mrw1.

found_on_the_way:
  - >-
    Гейт `TestAcceptanceEditedAfterItsVerdictSaysSo` молча ИСКЛЮЧАЕТ документ, когда
    `git log -L` по нему не выполняется: `gitEpoch` возвращает `(0,false)`, документ уходит в
    `census.NoHistory` и в вердикте не участвует. В переписи это видно отдельным числом («без
    построчной истории»), то есть скрытым не остаётся, — но исключение по НЕИСПОЛНЕНИЮ команды
    и исключение по существу считаются одной величиной. Предмет не этого документа; задача не
    заводилась по условию задания.
  - >-
    Рабочая копия `kacho-workspace/tmp/w9-seedcensus` используется двумя сессиями
    одновременно (см. reviewer_error_named_first). Предмет оркестратора, не этого документа.

