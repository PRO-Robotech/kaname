cycle:
  blocking_by_round: {round_1: 5, round_2: 3, round_3: 0}
  closed_from_round_2: [Б6, Б7, Б8]
  open_from_round_2: []
  genus: >-
    Блокирующих нет. Восемь незаблокировавших делятся на два рода: (а) утверждение о механизме
    дерева, взятое из КОММЕНТАРИЯ, а не из composition root (В12 — дренаж; В13 — «называние модуля
    — S1» при живом `apply.go:198`), — тот же род, что «факт о базе взят из свода» кругов 1–2,
    и он ушёл на уровень ниже: от строк базы к компонентам; (б) точность подписи при верном
    существе (В14 число «0» шире своего предмета; В15 «закрытый набор» шире пяти; В16 комментарий
    пережил круг; В17 подпись класса; В18 номер строки; В19 счёт строк против счёта вызовов).
    Ни одно не меняет ни решения, ни дома, ни производителя; каждое имеет предикат снятия в
    одну команду.
  predicate_for_the_next_edit: >-
    Всякое утверждение вида «в дереве есть механизм X» прогонять по composition root
    (`cmd/kaname/serve.go`, `*_wiring.go`) и по `git grep` вызовов, а не по комментарию у
    эмиттера; всякое число «0» сопровождать предметом, который оно считает.

