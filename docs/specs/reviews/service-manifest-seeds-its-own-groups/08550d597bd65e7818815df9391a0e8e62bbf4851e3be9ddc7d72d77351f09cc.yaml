verification:
  method: >-
    исполнение каждого предиката документа своими руками в собственной отсоединённой копии от
    головы ветки на origin; повторение опыта каждого блокирующего круга 2 и сверка исхода с
    записанным; ИСПОЛНЕНИЕ интеграционных проб против Postgres (testcontainers) там, где документ
    ссылается на прогон; вывод конструируемости «Дано» из схемы, триггеров, внешних ключей и
    цепочки миграций; чтение composition root для утверждений о механизмах (откуда В12);
    чтение пяти APPROVED-соседей по спорным разделам; поиск открытых задач в двух трекерах.
  subject_digest_matches_current_document: true
  header_left_untouched: true
  document_untouched_by_reviewer: true
  predecessor_records_untouched: true

