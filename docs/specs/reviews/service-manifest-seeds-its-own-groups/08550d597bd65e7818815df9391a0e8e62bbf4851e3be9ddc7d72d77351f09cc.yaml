non_blocking:
  - id: В12
    title: >-
      Р6, MRW-16 и §5 описывают потребителя журнала прав как «дренаж» с партицией `(user,
      object)`, применяющий строки «в порядке идентификаторов», — а дренажа `fga_outbox` в
      дереве НЕТ: снят выносом службы, потребитель журнала — триггер, и его ветвь снятия
      упорядочивает по `created_at`, а не по идентификатору
    detail: >-
      Предикаты: `sed -n '1693,1700p' cmd/kaname/serve.go` — «ДРЕНАЖА ЖУРНАЛА НАМЕРЕНИЙ ЗДЕСЬ
      НЕТ — снят вместе с адресатом … прямой факт … складывается ИЗ ЭТОГО ЖУРНАЛА триггером»;
      `git log -S'ДРЕНАЖА ЖУРНАЛА НАМЕРЕНИЙ ЗДЕСЬ НЕТ' -- cmd/kaname/serve.go` → 709f053e
      (2026-09-08, вынос службы); `git grep -n 'DELETE FROM kaname.fga_outbox\|UPDATE
      kaname.fga_outbox' -- '*.go' ':!*_test.go'` → пусто; `CREATE TABLE kaname.fga_outbox` —
      четыре колонки (`id, event_type, payload, created_at`), ни `sent_at`, ни `attempt_count`;
      в composition root дренажи заведены только для `invite_mail`, `provider_compensation`,
      `audit_outbox`, `resource_reconcile_outbox`. Триггер `relation_fact_from_journal`
      (`0001_initial.sql:1340–1408`): на `fga.tuple.delete` — `DELETE FROM kaname.relation_fact
      WHERE … AND source_version <= NEW.created_at`, где `source_version` — `created_at` строки
      записи. То есть ЕДИНСТВЕННЫЙ потребитель порядка на этом дереве — триггер, и ключ порядка
      у него `created_at`. Документ (:1350, :1355–1356, :1359, :1654, :1664, :1750) опирается на
      комментарий `emitter.go:204–216` («the drainer's ordering partition»), который сам
      пережил снятый дренаж, — тот же класс, что Б6/Б7 круга 2, только про механизм: факт взят
      из комментария, а не из composition root. Прецедент, который документ цитирует, сам
      называет истинного потребителя: `20260914091500:55–70` — «разбудить триггер удалением
      нельзя — он висит на ВСТАВКЕ», потому там, где убирается строка записи, факт снимается
      прямо. ПОЧЕМУ НЕ БЛОКИРУЕТ: решение Р6 (строка снятия на КАЖДОЕ членство безусловно) на
      этом дереве верно и даже единственно: альтернатива прецедента «убрать строку записи»
      требовала бы прямого снятия факта, а безусловная строка снятия кормит триггер сама.
      Наблюдаемые части «Тогда» MRW-16 производимы и различимы: строки снятия (bigserial даёт
      поздний id by construction), «прямого факта в проекции не осталось» — триггером при
      `created_at` строки снятия ≥ `created_at` записи, что `DEFAULT now()` обеспечивает;
      миграция, не пишущая строк снятия, красна по первому, миграция со строкой снятия и
      более ранним `created_at` — по второму. Проба упасть способна. ИСХОД: в Р6 заменить
      «дренаж применяет их в порядке идентификаторов» на «триггер `relation_fact_from_journal`
      снимает факт на строке снятия, чей `created_at` не раньше `source_version` факта
      (`0001_initial.sql:1340–1408`); дренажа у журнала на этом дереве нет (`serve.go:1693–1700`)»;
      в MRW-16 «Тогда» и признаке готовности S2б «позже … по идентификатору очереди» → «с
      `created_at` не раньше строки записи»; слово «партиция» снять. Предикат снятия: `grep -c
      'дренаж' <документ>` → 0 либо только в форме «дренажа нет».
