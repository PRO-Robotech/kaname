closed_from_round_1:
  B1: >-
    Закрыт абзацем «Ступень кода повышения» в П2Ф: код ступени StepAt(avClock.Now())+1 попадает в окно Skew
    и новее ступени заведения, поэтому сверка его принимает. Каждый посев повышает кодом один раз
    (EC-28, EC-29, EC-31, EC-34 (б)). EC-35 на стенде ждёт следующей ступени.
  B2: >-
    Закрыт. Q получает «1», затем повышается паролем (уровень остаётся «1») и кодом — получается «2».
    Рецепт рецензента круга 1 («одним кодом») дал бы «1» по level.go rows. Отход автора верен,
    и с KN747-13/14 он согласован.

important:
  - >-
    §1.7 держит координату и условие до правки. Это допустимо только при посадке тем же вливанием,
    что дифф Р2 (шапка «Порядок посадки редакции 3»). Так и вливать; этого не сделать до вливания полосы.
  - >-
    TWIN, не блокирует. EC-34 (а) и (б) различаются двумя предъявлениями (пароль и код). Если в (а)
    повысить Q одним паролем (уровень остаётся «1»), близнецы будут отличаться ровно кодом. Тогда
    проба заодно докажет, что условие судит уровень, а не факт «пароль предъявлен в сессии».
    Рекомендация полосе проб, правка документа не нужна.
  - >-
    EC-35 на стенде ждёт до 30 с (Period). Срок шага кейса закладывать с этим запасом.
  - >-
    Даты в истории ревью идут не по возрастанию. Объяснение «порядок строк — порядок дописывания» принято.

