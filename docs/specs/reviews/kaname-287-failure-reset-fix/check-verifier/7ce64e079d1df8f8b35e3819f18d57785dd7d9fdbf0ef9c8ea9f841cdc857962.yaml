findings:
  - id: CV-287-1
    severity: blocking
    class: recognizer-knows-all-lawful-forms
    address:
      - internal/check/failure_reset_sole_writer.go:495
      - internal/check/failure_reset_sole_writer.go:435
      - internal/check/failure_reset_sole_writer_test.go:152
      - internal/check/failure_reset_sole_writer_injection_test.go:432
    experiment: >-
      в новый метод humanSessionWriter (internal/repo/kaname/pg/human_session_repo.go), по одной
      форме за прогон, внесено удаление строк login_failures по ключу мимо реализации порта:
      (1) WITH k AS (SELECT $1::text AS key) DELETE FROM login_failures f USING k WHERE f.key = k.key;
      (2) MERGE INTO login_failures f USING (SELECT $1::text AS key) s ON f.key = s.key WHEN MATCHED THEN DELETE;
      (3) /* forget the address */ DELETE FROM login_failures WHERE scope = 'address' AND key = $1;
      (4) EXPLAIN ANALYZE DELETE FROM login_failures WHERE scope = 'address' AND key = $1.
      Посылка и гейт — зелёные на всех четырёх, перепись «операторов 2» не изменилась.
    why_blocking: >-
      шапка посылки обещает, что разбор, не узнавший законную запись удаления, краснеет и не
      пропускает, а сообщение fbbf757a — что неклассифицированная форма находка, а не молчание;
      все четыре формы — строковые литералы в Go, то есть внутри обещанной области, и молчат, а не
      краснеют. Пока так, молчание посылки не доказывает «иными операторами — нигде».
    requirement: >-
      те же четыре инъекции в том же месте краснеют с координатой; формы входят в
      TestFailureRowRemovalPremiseRedsOnEveryOtherRemoval; законные близнецы (SELECT на том же месте,
      удаление из другой таблицы) по-прежнему молчат
    return_to: автор диффа (полоса ветки 287)
notes:
