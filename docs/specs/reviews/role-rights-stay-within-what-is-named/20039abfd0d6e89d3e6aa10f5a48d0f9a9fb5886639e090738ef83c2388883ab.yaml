blocking:
  - id: B1
    kind: CONSTRUCTIBILITY
    scenario: ESC-30
    claim: >-
      «Дано» ESC-30 не строит состояние прежней редакции. (1) Кортежи `admin` для usr-D
      посеяны через `gdSeedTuple`. Это строка `fga_outbox` без выдачи-владельца
      (grant_delegation_world_integration_test.go:278-285). При прежней редакции такой кортеж
      писала материализация выдачи, и у него есть строка в
      `kaname.access_binding_emitted_tuples` с `binding_id` выдачи usr-D. Реконсайл снимает
      кортежи только по этому реестру: ForgetEmittedTuples, reconcile_adapter.go:1451-1466,
      `WHERE et.binding_id = $1`. Тогда утверждение `Check(usr-D, admin, project:prj-A) = false`
      честный производитель не даст. Чтобы ESC-30 стал зелёным, реализации пришлось бы снимать
      непривязанные факты. Но той же формой мир Д кладёт структурные указатели
      `project#account` (grant_delegation_world_integration_test.go:203), и такой проход снял бы
      их тоже. (2) Строка sva-B в grp-e0 держится на том, что «триггер проверяет существование,
      а не аккаунт» (§5.2). Однако Р3 вводит инвариант внутри службы. По ban #10 его место — на
      уровне БД, а Д-4 («как сегодня несуществующий участник») указывает на тот же триггер
      0001_initial.sql:357. Расширенный триггер отвергнет такой посев.
    measured: >-
      Прочтено @ddd5681af: grant_delegation_world_integration_test.go:189-203, :276-285;
      reconcile_adapter.go:1444-1466; migrate_backfill_p8_integration_test.go:91-98 (реестр
      access_binding_emitted_tuples); 0001_initial.sql:350-361.
    fix: >-
      Сеять прежнее состояние так, как его оставила прежняя редакция: факт вместе со строкой
      реестра, привязанной к выдаче usr-D (или прежней функцией вывода через шов). Писателя
      назвать в §5.2. Для строки sva-B назвать способ посева, который не зависит от того, где
      живёт инвариант Р3 (посев до миграции либо явный обход триггера как посев наследия), и
      снять посылку «триггер не проверяет аккаунт».
  - id: B2
    kind: DoD
    scenario: §6 S1 п.7
    claim: >-
      Требование «ESC-01…ESC-30 сперва красные на ddd5681af» невыполнимо для ESC-05, ESC-11,
      ESC-12, ESC-21, ESC-24: на базе они зелёные по построению. ESC-05: Check с `action`
      берёт глагол типа из каталога (`moduleVerbRelation`, authorize_service.go:527) →
      `v_delete`, и usr-D его держит уже сейчас. ESC-11, ESC-12, ESC-21: проверки права выдавать
      сегодня нет, поэтому `done`. ESC-24: RemoveMember не меняется. Пункт DoD не может быть
      исполнен, как написан.
    measured: прочтено @ddd5681af authorize_service.go:520-530; role_service.proto:108-115; group_service.proto:109-133.
    fix: >-
      Разделить на два перечня: «сперва красные» (ESC-01–04, 10, 13, 14, 20, 22, 23, 25, 30 — по
      строкам с новым свойством) и «охрана: зелёные до и после» (ESC-05, 11, 12, 21, 24 и
      положительные строки пар).
  - id: B3
    kind: COVERAGE
    scenario: Р1 — следствия вне четырёх названных глаголов
    claim: >-
      Р1 меняет ответ публичного `AuthorizeService.ListSubjects` для действия удаления:
      `resolveActionToRelation` отображает `delete` в `admin` (authorize_service.go:1258,
      case "delete" :1349). После Р1 держатель одного удаления пропадёт из «кто может удалить X», хотя
      `Check(delete)` для него остаётся истиной (ESC-05). Два ответа на один вопрос
      разойдутся, и это вводит в заблуждение о правах. Нет ни сценария, ни пункта в §2. Кроме
      того, «Тип изменения» называет только `AccessBindingService.Create`. Сужённый ярус читают
      и другие места: requireGrantAuthority в update.go:167, removal_authority.go:72 (отзыв и удаление выдачи), get.go:125, list_by_scope.go:60,
      list_by_account.go:77, list_assignable_roles.go:81, expand_access.go:204, право
      делегирующего delegated_grant.go:258; право спрашивать о чужом субъекте
      authorize/caller_authority.go:55. Последнее касается и Р4: делегирование, у которого право
      делегирующего держалось лишь на ярусе из `delete`, перестанет выдавать. Это следствие
      документ не называет.
    measured: >-
      `git grep -n 'requireGrantAuthority(' -- internal ':!*_test.go'` @ddd5681af → 12 строк (из них 2 — определения helpers.go:155, :337);
      прочтено authorize_service.go:1251-1262, :1329-1356.
    fix: >-
      В §0 дать перепись читателей выведенного яруса (команда и число), назвать их в «Типе
      изменения». Добавить сценарий ListSubjects(action `registry.registries.delete`, X) с парой
      usr-D / usr-M либо вынести это в §2 с причиной и носителем. Одной фразой в Р4/§2 сказать,
      что происходит с делегированием, чей делегирующий держал право только через `delete`.
  - id: B4
    kind: TWIN
    scenario: ESC-13 a
    claim: >-
      Названный близнец ESC-10 b отличается двумя фактами, а не одним: субъект выдачи на prj-A
      (usr-R у rol-e1 против sva-A3 у rol-e2) и вторая выдача на acc-A.
    measured: прочтено в документе §4.1 «Выдачи ролей под правку» и ESC-10, ESC-13.
    fix: >-
      У rol-e2 выдачи: usr-R на prj-A и sva-A3 на acc-A. Либо дать близнеца строкой внутри
      ESC-13, отличной ровно второй выдачей.

important_nonblocking:
  - "ESC-10 a, ESC-20 a «побайтово равна ошибке ESC-01 a (детали)»: это разные методы. На слушателе DenyDetailUnary добавляет к PERMISSION_DENIED `action`/`fqn` метода (authzguard/deny_details.go:117-160), и равенство не выполнится. В мире без перехватчика оно вакуумно. Эталон Р2/Р3 — отказ без права НА ТОМ ЖЕ методе (так сделано в ESC-E3/E4); переформулировать."
  - "ESC-E1, ESC-E4: предъявитель H не назван. У AccessBindingService.Create и GroupService.AddMember в каталоге `required_acr_min: \"2\"`, и с `jwtHumanEsc` отказом будет отказ повышения уровня, а не Р1/Р3. Назвать `jwtHumanEscStepUp` (как в ESC-E3)."
  - "«Вопрос модели» в интеграционных пробах: вызывающий AuthorizeService.Check не назван. Право спрашивать о чужом субъекте — self ∨ cluster-admin ∨ admin на ресурсе (authorize_service.proto:76-79, caller_authority.go:55). Назвать запрос о себе либо прямой вопрос двери для `required_relation`."
  - "Д-3: не сказано, участник ли владелец аккаунта и администратор аккаунта без строки `memberships`. В мире Д членство посеяно только usr-M и usr-P (newGDWorld)."
  - "Раскрытие: §0.3 («права выдавать сегодня не спрашивают») и «Как сейчас» новых путей не собирают — задачи #1035–#1039 публичны и формулируют то же свойство (`gh issue view 1036`). Не расширять."
  - "DoD п.6: комментарий поля `action` (authorize_service.proto:229-233, «delete → admin») устарел уже на базе (Check берёт moduleVerbRelation, kaname#995). Правка верная."

