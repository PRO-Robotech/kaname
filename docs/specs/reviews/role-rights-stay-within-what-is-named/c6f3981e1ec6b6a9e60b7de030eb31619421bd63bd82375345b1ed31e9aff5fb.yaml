      зелёная, b/d/e красные; ESC-32 на базе вакуумно-зелёная (новой миграции нет).
  - id: B3
    kind: COVERAGE
    status: executed
    checked: >-
      Предикаты §0.7 перегнаны и дали числа документа: право выдавать — 12 строк (2 обёртки,
      helpers.go:178 и :338; 10 путей); вопросы об `admin` — 12 строк, из них 4 вопроса к модели;
      callerAuthorityRelations = {"admin"} (caller_authority.go:55, :122); resolveActionToRelation —
      authorize_service.go:1258. Двери каталога (jq): kaname 13 (account 9, project 3, cluster 1),
      модули 56 (project 40, cluster 8, листовые 8). ESC-06 а держит ListSubjects(delete) против
      Check(delete), ESC-06 б1/б2 держит право спрашивать о чужом. Судьба делегирования — в §0.7
      «Делегирование» и §2 п.5. «Тип изменения» обновлён.
  - id: B4
    kind: TWIN
    status: executed
    checked: >-
      §4.1: rol-e1 → usr-R на prj-A; rol-e2 → usr-R на prj-A и sva-A3 на acc-A. ESC-13 a и
      ESC-10 b: тот же вызывающий usr-RP, то же тело U-R. Отличие — ровно вторая выдача. Правила
