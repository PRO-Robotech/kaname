round1_execution:
  - id: B1
    kind: CONSTRUCTIBILITY
    status: executed
    checked: >-
      (1) ESC-30 теперь сеет строку реестра вместе с фактом. Писатель называется: одна
      транзакция формы rewindToPreFix (public_container_read_multi_subject_converge_integration_test.go:70);
      строка журнала — форма gdSeedTuple (grant_delegation_world_integration_test.go:278, «триггер
      складывает строку в факт тем же коммитом»). У gdWorld есть `rec`: он встраивает *pcrWorld
      (grant_delegation_world_integration_test.go:110, :147), а `p.rec` = reconcile.New
      (public_container_read_world_integration_test.go:306). ConvergeBinding (reconcile.go:688)
      снимает «строку реестра под координатой сводимого члена, на которую не претендует ни один
      желаемый член» (emitted_completion.go, шапка). Ярусный кортеж прежнего вывода пишется той
      же сборкой, что v_* (tuples.go:65-105, `add(tier)`). У члена-области координата `iam.<scope>`
      (tuples.go:121-143), поэтому посеянная строка admin лежит под координатой члена и
      снимаема. PK реестра — (выдача, координата, субъект, отношение, объект) (миграция
      20261021081500). Значит, `ON CONFLICT DO NOTHING` у выдачи usr-W честно не добавит строк.
      На базе посев usr-D тоже ничего не добавит: прежний вывод уже дал admin. Контроли зелёные,
      утверждения о usr-D после прохода красные. Конструируемо на обеих ревизиях.
      (2) Строка sva-B вынесена в ESC-32 и сеется до наката. serOpenAt делает goose.UpTo с
      проверкой версии (human_session_forced_exit_reason_integration_test.go:136-147).
      20261025180000 — последняя миграция (`ls internal/migrations/*.sql | tail -1`). Триггер
      group_members_member_exists проверяет только существование (0001_initial.sql:335-361), и
      позднее он не переопределялся (`git grep 'group_members_member' -- 'internal/migrations/*.sql'`
      находит только 0001). Посылка «триггер не проверяет аккаунт» из §5.2 снята.
  - id: B2
    kind: DoD
    status: partially_executed
    checked: >-
      §6 S1 п.7 разделён на два перечня. Каждую строку обоих перечней я сверил по модели и коду
      @ddd5681af. Ошибка одна, ESC-04 a у usr-D (см. blocking.R2-1). Остальные ячейки разнесены
      верно: ESC-06 а на базе зелёная (delete → admin, :1349; у usr-D есть admin на X), б1 на
