blocking:
  - id: R2-1
    kind: DoD
    scenario: §6 S1 п.7, перечень «сперва красные на ddd5681af» — «ESC-04 a–d у usr-D»
    claim: >-
      На базе ячейка ESC-04 a у usr-D (`action: registry.registries.update`, `registry_registry:X`,
      ожидание `false`) уже `false`, то есть зелёная. Красной сперва она быть не может, и пункт DoD,
      как написан, неисполним (тот же дефект, что B2). Цепочка такая. Check с действием берёт
      глагол у типа объекта (moduleVerbRelation, internal/service/module_verb_relation.go:67-93)
      → `v_update`. Это совпадает и со строкой каталога (permission_catalog.json:1017-1019,
      `RegistryService/Update` → `v_update`). Модель: `registry_registry.v_update: [user,
      service_account, group#member] or owner or super_admin` (fga_model.fga), а super_admin
      = super_admin from project = admin from account or any_admin from cluster. Ярусный кортеж
      usr-D (`admin` на X и на prj-A) в v_update не входит. Из `delete` прямой `v_update` не
      выводится: GrantedVerbsWithDeclared добавляет удаление к правке, а не правку к удалению
      (internal/authzmap/role_verbs.go:77-100). Ячейки b, c, d у usr-D на базе красные
      (editor/admin/viewer ← прямой admin на X), с ними всё верно.
    measured: >-
      Прочтено @ddd5681af: internal/service/module_verb_relation.go:67-93;
      internal/apps/kaname/seed/embedded/permission_catalog.json:1017-1019;
      internal/authzmodel/fga_model.fga (type registry_registry: v_update, super_admin; type
      project: super_admin); internal/authzmap/role_verbs.go:77-100;
      internal/apps/kaname/api/access_binding/reconcile/tuples.go:65-105.
    fix: >-
      В §6 S1 п.7 заменить «ESC-04 a–d у usr-D» на «ESC-04 b–d у usr-D». Ячейку ESC-04 a у
      usr-D перенести в «охрану: зелёные до и после» (её закрывает строка каталога `v_update`,
      Р1 её не меняет). Больше ничего не трогать.
    resolution_for_dispatcher: >-
      Третьего круга нет (fa-b8). Правка — одна ячейка, без нового механизма и без новых
      сценариев. Предлагаю диспетчеру принять редакцию 3 по проверке дельты: дифф к c6f3981e
      ограничен п.7 (одна ячейка перенесена) и строками истории. Для проверки хватит
      `diff c6f3981e… <ред.3>`. Другие правки дельты — повод для нового рассмотрения.

