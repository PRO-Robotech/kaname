blocking:
  - kind: DoD
    scenario: §6 S1 п.1 (строка 848), §11 строка таблицы «§6 S1 п.1»
    claim: >-
      Правка называет держателем гейт kacho, который миграцию kaname прочитать не может.
      Пункт «гейт `PRO-Robotech/kacho:TestNewMigrationCitesAnApprovedAcceptance` зелёный со
      ссылкой на эту приёмку» поэтому выполняется при любом содержимом миграции. Это пункт
      DoD без исхода «не пройдено». §11 подаёт правку как устранение дефекта: «дом назван».
      Координата резолвится, но держатель предмет не держит.
    measured: >-
      `git -C project/kacho show origin/main:internal/repohygiene/acceptanceledger_test.go`
      @41d7edad9b: на входе гейта `gitenv.Command(root, "diff", "--name-only",
      "--diff-filter=A", base+"...HEAD")` (строки 149-150), где root — дерево kacho.
      Фильтр — `/internal/migrations/` и `.sql` (строки 158-159). Новый файл
      `internal/migrations/*.sql` дерева kaname в этот дифф не попадает никогда, поэтому
      added=0 и находок 0. Своего гейта цитирования приёмки в kaname нет:
      `git grep -n -i acceptance -- '*_test.go' | grep -i migrat` в tmp/kn-983-acceptance
      находит только комментарии-ссылки. Цитирование в шапках миграций kaname — соглашение
      без держателя (`git grep -l docs/engineering/acceptance -- 'internal/migrations/*.sql'`
      → 3 файла).
    fix: >-
      Пункт переписать так, чтобы у него был исход «не пройдено». Шапка новой миграции
      цитирует путь этой приёмки и одобренный SHA-256; предикат, например,
      `git grep -c 'object-keeps-its-project-after-unregistration' -- internal/migrations/<новая>.sql`
      ≥ 1. Явно сказать, что гейт kacho дерево kaname не читает и что гейта-держателя в
      kaname нет. Если держатель нужен — заводится отдельной задачей (вариант (б) автора).
      Строку §11 привести к тому же. Утверждение не ослабляется: прежний текст обещал
      держателя, которого нет.

