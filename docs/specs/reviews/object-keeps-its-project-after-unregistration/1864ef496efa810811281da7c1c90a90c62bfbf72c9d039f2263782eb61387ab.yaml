blocking:
  - kind: COVERAGE
    scenario: Р4, Р9, §2 п.3, §3 «Критерии продукта» — «Безопасность», §7
    claim: >-
      Сверку Р4 и инвариант базы Р9 документ формулирует над одним полем запроса —
      `parentProjectId` (строка зеркала). При этом путь решения доступа берёт предков
      объекта, в том числе проект, из присланной цепи (`resource_parent_edge`):
      relverdict/grantarm.go, шапка «ТРЕТЬЯ ОСЬ» и запрос предков. Цепь и поле
      присылаются независимо, и сегодня их согласованность не проверяет никто: это
      признак, названный в #982. §2 п.3 выносит расхождение в #982, но §7 не делает
      #982 зависимостью посадки. Одновременно §3 «Безопасность» утверждает без
      оговорки, что обход неизменности проекта закрыт. Если #983 сядет раньше #982,
      область решения для привязанного объекта может сменить проект при совпавшем
      поле. Тогда ни один сценарий не красный, а текст о безопасности вводит в
      заблуждение (ban19-block-criterion).
    remedy: >-
      Один из двух вариантов. (а) Распространить Р4 и Р9 на ближайший элемент
      `project:` цепи: сценарий, где поле совпадает с привязкой, а цепь называет
      другой проект → Р4-отказ, ничего не записано; положительный близнец — цепь с
      проектом привязки → OK. Отличие ровно одно: проект в цепи. (б) Строкой §7
      объявить, что #983 вливается в main не раньше #982 и не отдельно от него, с
      предикатом, и сделать §3 «Безопасность» условным до этой посадки. Рекомендация —
      (а): та же сверка в той же транзакции, на одно поле больше, и посадка не зависит
      от #982.

important:
  - kind: COVERAGE
    scenario: Р2, §7
    claim: >-
      Р2 вводит новый отказ потребителю: `INVALID_ARGUMENT` при пустом
      `parentProjectId` у объявленного типа. В приёмке svc-registry
      (2717077568…22dc7, таблица регистраций, строки 282-283) поле не названо, есть
      только цепь. Добавить в §7 строку «регистратор svc-registry шлёт
      `parentProjectId` для `registries` и `repositories`» с признаком готовности.
      Без неё объявление ключа в манифесте svc-registry уронит его регистрации.
  - kind: FORMAT
    scenario: PB-20 c
    claim: >-
      «Then a), b), c) — SQLSTATE класса 23», а в скобках для c — «отказ привилегии или
      ограничения, названный замыслом». У c два исхода, и выбор отдан на потом. Проба
      идёт под владельцем схемы, поэтому отказ привилегии на ней не наблюдаем. Закрепить
      один исход, например отказ триггера `BEFORE TRUNCATE` с классом 23. Суть «привязка
      прежняя → Р4-отказ» уже конкретна, поэтому замечание не блокирует.
  - kind: FORMAT
    scenario: PB-21 b
    claim: >-
      «Когда» — оператор писателя `projectWriter.Delete`, а «Тогда» — `FAILED_PRECONDITION`.
      Писатель возвращает `iamerr.ErrReferenceInUse` с текстом
      «Project <id> is not empty (…)» (project_repo.go:328), gRPC-кода на этом
      уровне нет. Написать утверждение уровня писателя: `errors.Is(err,
      ErrReferenceInUse)`, текст дословно.
  - kind: CONVENTION
    scenario: §3 Р-В1 против Р8
    claim: >-
      Пересказ Р-В1 говорит: «привязка — следствие регистрации … в той же транзакции».
      Р8 же заводит привязки при применении каталога, то есть доставкой манифеста
      модуля, вне транзакции регистрации. Решение владельца это не нарушает: привязка —
      не кортеж и не токен. Но текст противоречит сам себе. Переформулировать: «привязку
      заводит регистрация либо доставленное модулем объявление; по своей инициативе
      kaname её не заводит».
  - kind: FORMAT
    scenario: PB-18, Р3
    claim: >-
      В PB-18 регистрация в T2 идёт через `resource_mirror.UpsertTx`, а не через use-case.
      Значит, привязку обязан заводить уровень записи зеркала (оператор или триггер), а
      не `emit`. Р3 и строка PB-01 §5.1 («сверка в writer-транзакции `emit`») этого не
      говорят. Назвать это одной строкой в Р9, чтобы замысел не выбрал место, на котором
      PB-18 красный по устройству.

