important:
  - kind: DoD
    scenario: §6 п.6
    claim: >-
      Перечень «после заведения ключа красными остаются» не называет PB-25 c — отказ формы
      поля при цепи без звена, это новое поведение (как PB-12) и красное до правки. Дописать
      «25 a–c». Корректность не задета: п.6 требует все 22 зелёными.
  - kind: COVERAGE
    scenario: PB-19, Р9
    claim: >-
      Р9 обещает инвариант на КАЖДОЙ записи и на всех путях записи зеркала и цепи, а прямые
      операторы PB-19 — только UPDATE. Вставка ребра `project` с чужим проектом для
      привязанного объекта путём мимо use-case (посевщик сетки) пробой не держится.
      Рекомендация: PB-19 e — прямой INSERT ребра `project:<prj-C>` на свободной глубине для Q
      → класс 23, цепь прежняя; близнец — тот же INSERT для `vpc_network`/`net…99` принят.
      Текст Р9 однозначен («триггеры базы … на каждой записи»), поэтому не блокирует.
  - kind: TWIN
    scenario: PB-25 c
    claim: >-
      Случай порядка проверок; собственного положительного близнеца нет, он есть транзитивно
      (PB-12 → PB-13 a). Допустимо; при правке документа — назвать близнеца явно.
  - kind: COVERAGE
    scenario: Р8, §3 «Безопасность»
    claim: >-
      Остаток Р8 (расхождение звена цепи и строки зеркала, лежавшее до объявления) назван в
      Р8 и Р9, но не в перечне остатков §3 «Безопасность». Это не обход снятием и повторной
      регистрацией, текст §3 не ложен; для полноты — дописать в перечень.

dispatcher_questions_review:
  Q1_beyond_letter_of_D-983-1: >-
    Рецензент согласен оставить PB-24 d (каждое звено) и PB-25 (звено обязательно). Довод
    перемерен: обход области читает все рёбра (query.go:279-291), а пустая цепь даёт ноль
    рёбер. Без этих двух вариант (а) обходится. Цена — 0 обращений к базе сверх прочитанной
    привязки. Это сужение входа только для объявленных типов; цепи потребителя (svc-registry
    §4.1, строки 282-283) звено `project` несут.
  Q2_residual_container_coherence: >-
    (i) приемлемо: остаток назван в §2 п.3 и в §3 «Безопасность» как незакрытый, держатель —
    #982, чей предмет публично его покрывает. Текст о безопасности точен, ban19 не нарушен.
    (ii) закрыло бы остаток здесь, но расширяет предмет сверх Д-983-1. Решение — диспетчера.
    При (i) приёмка #982 обязана нести сценарий согласованности проекта объекта с проектами
    звеньев его цепи с близнецом — иначе остаток повиснет без держателя.

