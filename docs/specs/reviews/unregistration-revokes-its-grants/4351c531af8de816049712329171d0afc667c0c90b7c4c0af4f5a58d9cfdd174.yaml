important:
  - kind: DISCLOSURE
    scenario: §2, строка 208 вместе с §0.7 (146-150)
    claim: >-
      §0.7 называет координату применителя посева и условие. Строка 208 §2 добавляет
      следствие словами «а не превращать их молча в …». Втроём это сборка, которую
      публичный документ не несёт (`security-disclosure.md` §«Публичные артефакты»).
      Не блокирует: дефект скрытый (в каноне 0 объявлений), а доставить манифест может
      только оператор установки. Рекомендация до коммита — в строке 208 оставить
      «загрузчик будет отвергать такие ссылки» без продолжения.
  - kind: DoD
    scenario: §6 п.4; URG-38 (752-763); §5, строка 38
    claim: >-
      До миграции URG-38 и URG-40 краснеют на «Дано»: роль не строится. Это не «красное по
      тексту утверждения», как требует п.4. После миграции URG-38 при `permissions = []` зелёный
      и без правки `tuples.go`: прежняя ветвь от пустого перечня кортежей уровня области не
      даёт. Значит правку `tuples.go` держит I7 через URG-20, а URG-38 охраняет свойство.
      Так и записать. Держатель строки 38 в §5 (`w.ask(usrB, "v_get", "project", prjA)`)
      привести к «Тогда» URG-38 (Y, Z, реестр выпущенных кортежей).
  - kind: CONVENTION
    scenario: Р6; §6 п.3
    claim: >-
      Пару `rules = []`, `permissions = []` отвергает не только ограничение, но и
      `domain.Role.Validate` (internal/domain/role.go:151-157, ветвь «должен нести ≥ 1»).
      Назвать его в §6 п.3 рядом с проверками — иначе исполнитель найдёт его прогоном.
  - kind: FORMAT
    scenario: шапка
    claim: >-
      Документ в ветке не закоммичен. Одобрение относится к отпечатку 4351c531…; редакция,
      которую закоммитят, обязана дать тот же отпечаток.

