cycle:
  blocking_by_round: {round_1: 6, round_2: 3}
  closed_from_round_1: [Б1, Б2, Б3, Б4, Б6]
  open_from_round_1: [Б5]
  reviewer_error_named_first: >-
    Все три блокирующих круга 2 выросли из исходов, которые предложил круг 1, — это ошибка
    роли, и она названа раньше находок. Исход по Б1 назвал ось формата и потолок, но не нижнюю
    границу, хотя абзац «Параметры стойкости» с нею стоял уже в редакции 1
    (`git show c4966bf0:<документ> | grep -n 'Параметры стойкости'` → строка 338), и круг 1 не
    отметил, что у этой нормы нет ни сценария, ни строки §8. Исход (а) по Б3 сформулирован
    «версия, в перечне которой нет формата» — только по формату, хотя тот же круг принял в
    объём 12.3, где «выше потолка» приравнено к «вне перечня». По Б5 круг 1 потребовал
    близнеца, но не сказал, как построить второй вход, не израсходовав значение формата A. Автор
    исполнил все три исхода дословно.
  genus: >-
    Все три — «Дано» либо область, не согласованные с другой нормой того же документа: Р5
    против «Дано» PWV-08, 12.3 против PWV-17, §3 против PWV-16. Каждое защитимо по отдельности,
    расходится пара. Производитель у каждого назван верно — перепись §4.3 этот род не видит by
    construction: она спрашивает, производит ли фаза «Тогда», а не согласовано ли «Дано» с Р5.
  predicate_for_the_next_round: >-
    Каждое новое «Дано» прогнать через Р5 (успешный вход расходует значение A) и через 12.3
    (что считается покрытым); каждую новую область значений — через §3.

