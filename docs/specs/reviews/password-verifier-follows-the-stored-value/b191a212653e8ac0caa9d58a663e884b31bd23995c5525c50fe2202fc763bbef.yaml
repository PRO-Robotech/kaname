# ─── БЛОКИРУЮЩИЕ КРУГА 2 ────────────────────────────────────────────────────
blocking:
  - id: Б5
    status: не закрыт с круга 1
    title: >-
      Новое «Дано» PWV-08 — успешный вход на другом устройстве — расходует значение формата A до
      «Когда»: 08.5 не может покраснеть на дефекте, ради которого написано, а 08.7 в этом мире
      неисполнимо
    sections: [§5 PWV-08, §4.3 Д-10, Р5, PWV-11, §5 вводная, §7 «Положительный контроль, расходующий предмет отрицательной полосы»]
    predicate: >-
      (1) «Дано» 2 PWV-08: «он уже вошёл на другом устройстве, и тот вход годен — исход Ф1-13»;
      производитель по Д-10 — полоса входа Ф3, то есть успешная проверка нашим проверяющим.
      (2) Р5 этого же документа: «Успешная проверка значения формата A переписывает его в
      объявленный формат». К «Когда» значение уже формата B. (3) 11.2: значение, отвечающее
      объявленному, при входе не переписывается — вход «Когда» переписывания не производит
      вовсе. (4) 08.7: «признак остаётся формата A» — после «Дано» 2 он уже B.
      Предикат по «Дано» всего §5: вход внутри Given — одно настоящее совпадение, PWV-08. В
      редакции 1 у PWV-08 «Дано» одно (`git show c4966bf0:<документ>`); второе заведено
      ответом на Б5.
    failure_scenario: >-
      Исполнитель Ф3 держит Ф1 Р4 на событии «материал изменён». Проба строит «Дано» по Д-10:
      вход на устройстве 1 переписывает A в B, прочих входов нет, гасить нечего; вход на
      устройстве 2 («Когда») видит B, переписывания нет (11.2), гасить нечего. 08.5 зелёный,
      08.2 зелёный (переписало «Дано»), 08.6 зелёный. Дефект, который назвал Б5, проходит — тот
      же исход, что в круге 1. Документ сам запрещает эту форму: вводная §5 («контроль в „Дано“
      … успешный вход переписывает значение формата A») и строка §7 с тем же признаком.
    why_blocking: >-
      08.5 — единственное, чем документ держит F11 F4d («перевод стенда для человека
      ненаблюдаем», §4.4), и оно не краснеет ни на одной названной фикстуре. Цена дефекта — у
      всей наследуемой популяции гаснут прочие входы ровно в момент, когда человек всё сделал
      правильно.
    outcomes: >-
      Построить второй вход так, чтобы значение формата A к «Когда» уцелело, и назвать порядок
      в «Дано» и в Д-10. Например: на уровне I проба кладёт значение A ПОСЛЕ входа на
      устройстве 1 (§10 разрешает уровню I класть значение самой), либо первый вход идёт путём
      PWV-09 (запись замещения отказывает — вход есть, значение A осталось). Добавить строку по
      образцу 03.6: к «Когда» признак значения — A, иначе прогон «не выполнилось». 08.7 вынести
      в мир, где значение A: своё «Дано» либо до верного входа.

  - id: Б8
    status: новое
    title: >-
      PWV-17 судит покрытие только по формату, а 12.3 того же документа приравнивает «выше
      потолка записи» к «вне перечня»: версия, опустившая потолок, проходит предусловие и
      отказывает людям во входе
    sections: [§5 PWV-17, Р8, Р2, §5 PWV-12 (12.3), PWV-14, §8 «проверяющий не уходит из установки»]
    predicate: >-
      `awk '/^\*\*PWV-17/,/^### Полоса «непокрытый/' <документ> | grep -ci 'потол\|параметр'` → 0;
      то же по Р8 → 0. Строка §8 называет только «строки формата, которого нет в перечне
      версии». 12.3: значение с параметрами выше потолка записи «считается непокрытым наравне с
      форматом вне перечня». Р2 говорит только о подъёме потолка; о понижении во всём
      документе — 0 строк (`grep -n 'понижен\|опуст\|сниж'`).
    failure_scenario: >-
      В версии N потолок записи формата A не ниже лежащих значений — иначе 12.3 не пустил бы
      перенос. Версия N+1 опускает потолок ниже части лежащих значений. Предусловие PWV-17
      видит формат A в перечне N+1 и пропускает, сверка PWV-13 согласована и молчит. После
      выката люди с такими значениями получают исход «параметры вне потолка» (PWV-14), а
      наружу — Ф1-02, то есть «неверный пароль» при верном. Ровно то, что Р8 объявляет
      несущим: «ни один человек не узнаёт о снятии проверяющего отказом входа».
    why_blocking: >-
      Сужение потолка — частичное снятие проверяющего, и документ сам считает его
      непокрытием (12.3). Держателя нет ни одного.
    outcomes: >-
      Перепись хранилища в предусловии судит покрытие тем же правилом, что 12.3: формат в
      перечне версии И параметры не выше потолка её записи. Отказ называет формат, потолок и
      число строк выше него; близнец — та же версия при строках не выше потолка встаёт. Р8 и
      строку §8 расширить тем же. Альтернатива — объявить, что потолок записи не понижается, —
      держателя в дереве не получает: гейт дерева прежней версии не видит.

  - id: Б7
    status: новое — остаток Б1 на оси параметров
    title: >-
      Область ручки «что писать» объявлена без нижней границы: §3 требует параметров не ниже
      объявленных, а PWV-16, Р2 и §8 пропускают любые не выше потолка
    sections: [§3 «Параметры стойкости», Р2, PWV-16, PWV-07, §8, §7 «Ручка без объявленной области значений», Д-08]
    predicate: >-
      §3: «Формат B заводится с параметрами не ниже объявленных сегодня (§1.2, строка «хеш
      нового пароля» Ф1 §4.1) и не ниже объявленных в F4d». Держателя нет: строк о нижней
      границе в PWV-16 — 0, в §8 — 0 (единственное совпадение «ниже» — вводная фраза раздела),
      в §7 — 0. 16.2 дословно: «та же ручка, называющая формат B с параметрами не выше потолка
      его записи, — процесс поднимается». Ф1 §4.1 обосновывает строку «хеш нового пароля» так:
      «переносится, чтобы не менять стойкость молча»; F4d:172 объявляет те же параметры.
    failure_scenario: >-
      Профиль называет формат B с памятью 1 МиБ и одной итерацией. Страж 16.x проверяет формат
      (записываемый) и потолок (не выше) — старт проходит, как и требует 16.2. Каждое вновь
      заводимое значение получает ослабленные параметры, лежащие PWV-11 не трогает — они «не
      ниже объявленных». Не краснеет ни один сценарий и ни одна строка §8. Это вторая половина
      довода Б1 круга 1 — «ручка, понижающая стойкость новых паролей»: на оси формата закрыта,
      на оси параметров жива.
    also: >-
      При поле, равном объявленным параметрам, «Когда» PWV-07 («память вдвое в пределах
      потолка», 07.3 «теперь низшими») требует зазора: потолок записываемой записи строго выше
      пола хотя бы по одному параметру. Документ этого не требует
      (`grep -n 'зазор\|запас\|выше объявленн'` → 0), правило «потолок выводится из ёмкости»
      числа не даёт, и Д-08 не называет, откуда зазор возьмётся.
    why_blocking: >-
      Норма §3 без сценария и без строки §8 — при том что §8 обещает: «где механизма нет — так
      и написано». Область ручки заводит этот документ, и она расширяет поверхность ровно тем,
      что §3 запрещает (ban #18, строка «безопасность»).
    outcomes: >-
      Включить нижнюю границу в область: запись записываемого формата несёт пол (§1.2, Ф1
      §4.1, F4d:172). PWV-16 получает строку «ручка на B с параметром ниже пола — отказ старта,
      называющий ручку и пол», 16.2 сужается до «между полом и потолком», в §8 добавляется
      строка, в §7 — признак. Для PWV-07 назвать источник зазора: потолок записываемой записи
      выше пола хотя бы по одному параметру либо проба компонента на синтетическом перечне — и
      сказать это в Д-08.

# ─── ВАЖНЫЕ, НЕ БЛОКИРУЮЩИЕ ─────────────────────────────────────────────────
# Нумерация продолжает круг 1 (В1…В10), чтобы номер оставался адресом.
non_blocking:
  - id: В11
    title: Носитель предусловия назван одним чартом, а служба ставится своим
    detail: >-
      Ф-е в §4.3 и последняя строка §4.2 называют носителем только
      `PRO-Robotech/kacho:deploy/helm/umbrella/charts/kaname/`. У службы есть свой чарт —
      `deploy/templates/deployment.yaml` её дома, init-контейнер `migrate` с
      `kaname-migrator up`, безусловный. INSTALL.md (строки 77, 124, 444) требует накатчика до
      службы при каждом обновлении. Для «чужого облака» основной носитель — именно он. Сказать
      заодно, что происходит, если `kaname serve` поднят без `up`: предусловие тогда не
      исполняется, а форма стража старта с чтением базы и fail-closed в доме есть
      (`cmd/kaname/schema_guard.go`, на другой оси).
  - id: В12
    title: Предел памяти и связь ёмкости с потолком ничем не держатся
    detail: >-
      §1.6 и Р7 опираются на 512Mi из чарта платформы. Собственный чарт службы ресурсов не
      объявляет вовсе: `resources` в шаблоне — 0, в `deploy/values*.yaml` — 0. Р2 говорит, что
      потолок «выводится из ёмкости», но ёмкость — ручка установки (15.6), а потолок — константа
      записи перечня (Р2), и произведение «ёмкость × стоимость проверки на потолке» против
      памяти процесса не сверяет ни одна строка. О7 держится для числа мест, а не для памяти.
  - id: В13
    title: Заголовок Р4 обещает неразличимость по времени и на оси годности
    detail: >-
      Р4: «наружу отказы неразличимы — по коду, телу и времени», продолжено «на годность». Тело
      Р4 сужает время до классов стоимости и «материала нет»; у PWV-04, 05, 14 строк о времени —
      0, а 14.3 требует отказа без вычисления. Сузить заголовок и назвать, почему годность
      освобождена: популяция негодных значений нулевая по построению (12.2, 12.3, 16.3). Либо
      добавить строку.
  - id: В14
    title: §10 цитирует строку Ф1 §4.1 наоборот
    detail: >-
      §10: «Ф1 §4.1 объявляет величину нашим контрактом, а не константой». Строка Ф1 §4.1 о хеше
      нового пароля (Ф1:581): «наружу не виден, контрактом не является; переносится, чтобы не
      менять стойкость молча». Решение оставить ручку опирается на Ф1 §1.2 («после Ф3 обязан
      объявлять наш контракт») и Ф1 §4.2 («владелец величин … политики пароля — наша
      настройка»); приведённый довод противоречит строке, на которую ссылается. Её же
      обоснование и есть основание пола из Б7.
  - id: В15
    title: Прочитанный ноль у двух переписей получает разный вердикт, и различие не названо
    detail: >-
      12.6: пустой источник — «не выполнилось». 17.6: ноль строк в хранилище — ответ, обновление
      проходит. При этом 03.6 связывает перепись хранилища с PWV-17, а §10.1 — перепись
      источника с PWV-12. Назвать, почему ноль различается (пустой источник переноса беспредметен,
      пустое хранилище — законная чистая установка), иначе общая реализация выберет одну
      семантику молча.
  - id: В16
    title: 08.5 ссылается на Ф1-01, чьё «Дано» несёт подтверждённый адрес
    detail: >-
      Ф1-01 (Ф1:414) — «адрес подтверждён»; §4.2 здесь выводит адрес из всех «Дано» §5; Ф1-06
      (Ф1:419) даёт тот же исход «вход состоится» при неподтверждённом. Назвать исход «успешный
      вход (Ф1-01 либо Ф1-06)».

