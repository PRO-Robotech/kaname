blocking:
  - id: B1
    kind: PRODUCER
    where: 'PWV-23 (Then, And-1), §4.3.1 строки 23.1 и 23.2, абзац уровня полосы, §17'
    summary: >-
      PWV-23 редакции 7 утверждает: личности ACTIVE с паролем и неподтверждённым адресом кода нет,
      письма нет — «как Ф5-31», производитель 23.1 — ветвь withoutWayIn ветки 608. На ревизии, где
      лежит документ (origin/296 @3066c7b6a), продукт и одобренный сосед утверждают обратное:
      unverifiedMayRecover выдаёт код любой ACTIVE (recovery_request.go 147, 232), а держатель,
      на который ссылается документ, — TestRecovery_F5_31_… — требует кода и письма (A458-01,
      приёмка unverified-address-passes-to-the-mailbox-owner.md, запись 79e0f15a… APPROVED).
      Названного производителя нет, а «Тогда» противоречит одобренной соседней приёмке — та же
      ситуация, ради которой написана сама редакция 7 (сменился мир соседа).
    failure_scenario: >-
      проба PWV-23 по тексту на origin/296: запрос восстановления для Д-27 → в очереди письмо с
      кодом (A458-01) → «письма с кодом в очереди нет» красное, и красное честно не исправить: код
      судит одобренный сосед; предъявление кода дальше идёт ветвью перехода записи владельцу ящика
      (recovery_complete.go 393–420), а не «отказом формы Ф5-04».
    fix: >-
      перепривязать PWV-23 к соседу (fa-b7: путь и отпечаток одобренной редакции
      unverified-address-passes-to-the-mailbox-owner.md): либо мир, где кода нет и после #458
      (например BLOCKED с паролем и неподтверждённым адресом — первая половина Ф5-31 на 296; либо
      PENDING без пароля — Ф5-32), либо снять PWV-23 надгробием, как PWV-12, назвав держателя
      мира у соседа (A458-01/02). Строки 23.1…23.3, итог §4.3.1, строку §6 и §17 — под выбранное.
  - id: B2
    kind: CONSTRUCTIBILITY
    where: '§4.3.1 Ось 2, Д-23 (PWV-20, 21, 22, 24, 25)'
    summary: >-
      Д-23 («ACTIVE, адрес подтверждён, строки способа «пароль» нет», плюс отметка открытого пути)
      строится, по документу, через seedAccountMember без вставки 231–233. Но seedAccountMember на
      ревизии измерения редакции 7 (3aac88fddc0c:60) и на origin/296 оборачивает вставку в
      withWayIn и тем же оператором кладёт строку пароля. Названная фикстура строит Д-24, а не
      Д-23; seedOpenPath потом ничего не ставит (его WHERE требует отсутствия строки пароля).
    failure_scenario: >-
      проба PWV-20 по тексту: посев → у личности строка 'fixture-password-row-…' → завершение идёт
      замещением, а не заведением → 20.1/20.2 зелёные до кода; отрицание PWV-21/22 и близнец
      «отличие одно — строка» сливаются (Д-23 ≡ Д-24), сценарии теряют предмет. Правка редакции 7
      о Д-23 была именно про посев под C1 — и названа неверной фикстурой.
    fix: >-
      назвать производителя Д-23 формой, которая его строит на настоящей базе: вставка строки
      личности без withWayIn и seedOpenPath (active_way_in_fixture_test.go:46–53, 73) той же
      транзакцией — либо снятие строки пароля фикстуры и отметка в одной транзакции (ключ
      отложенный); номера строк посева — перемерить на ревизии, где документ лежит.

