role_review:
  every_then_has_a_producer:
    result: ДА
    detail: >-
      Перепись §4.3 ось 1 даёт производителя каждого из 103 «Тогда» с родом требуемого
      (отказ · значение · запись · величина); «ни одной фазы 0». Воспроизведено двумя
      независимыми выражениями: `awk` по §5 → 103, разбивка совпала посценарийно с ведомостью
      §4.3 (только Ф2 50 · только Ф3 32 · обе 21 · ни одной 0). Производитель — либо форма в
      дереве (Ф-а…Ф-е), либо отсутствие (∅1/∅2/∅3) плюс открытая фаза (Ф2 #1268, Ф3 #1269 —
      обе OPEN). Формы сверены на текущих стволах: Ф-а `expired_credential_sweep_recorder.go`,
      Ф-б `access_binding_repo.go`+`TestAB_P6_DeleteGuarded_ConcurrentCAS`, Ф-в `internal/check/`,
      Ф-г `config/validate.go`+`TestUnsetDomainRefusesTheStart`, Ф-д `presentedcred/reader.go`,
      Ф-е `corelib@v1.8.0:migratorrun/runner.go` (dropguard.Gate строка 162 ДО goose.UpContext
      строка 177) + `dropguard/preflight.go` три пробы. Ни один «Тогда» не называет производителя
      рода, которого фаза не даёт (класс Б3 круга 1 не воспроизведён).
  then_17_2_producer_gap_is_disclosed_not_hidden:
    result: ДА
    detail: >-
      17.2 требует порядка «счёт до применения»; §4.3 форма Ф-е и §10 ЧЕСТНО говорят, что у
      `migratorrun` фундамента проб нет вовсе (git ls-tree v1.8.0 migratorrun/ → doc.go, runner.go;
      git grep -l migratorrun v1.8.0 -- '*_test.go' → 0), поэтому проба предусловия Ф2 обязана
      закрепить порядок сама через команду наката целиком. Это раскрытый пробел исполнения, а
      не фантомный производитель: механизм (порядок в runner.go) в дереве есть, ассертация
      назначена Ф2. Для приёмки до кода — законно.
  every_given_has_a_home_without_a_second_fact:
    result: ДА
    detail: >-
      §4.3 ось 2 даёт по каждому «Дано» дом-производитель и явно проверяет «не строже ли Тогда
      того, что производитель даёт» — по всем 22 «Дано» ответ «нет». Отрицательные «Дано» и их
      положительные близнецы отличаются одним фактом: PWV-08 близнец — паролем в «Когда»;
      PWV-19 близнец — длиной пароля либо нулевым байтом; 17.9 близнец — строками формата A;
      05.6 близнец — одним параметром на границе; 15.7 близнец — величиной предела. Каждое новое
      «Дано» прогнано через Р5 и 12.3 (предикат круга 2): вход в Given только у PWV-08 и идёт
      путём PWV-09 (значение A уцелевает); Д-17/Д-22 конструируемы — хранилище материал не
      разбирает (Р2), значения за границей и выше потолка кладёт проба уровня I, значения между
      старым и новым потолком законно производит перенос (12.3).
  both_sides_of_each_constrained_axis:
    result: ДА
    detail: >-
      Требование записи круга 2 исполнено на каждой оси. Ручка «что писать»: формат-неверный
      (16.1), параметр-выше (16.3), параметр-ниже пола (16.5), незадана (16.4), положительный на
      ОБЕИХ границах (16.2). Перечень: пол≤потолок с зазором (13.4)+близнец, пол≥эталон Ф1 §4.1
      (13.5)+близнец, потолок внутри допустимости — не ниже нижней, ниже верхней (13.6)+близнец.
      Предусловие обновления: формат-нет (17.1), потолок-сужен (17.7/17.8), тело-читатель-строже
      (17.7), недоступно (17.5), не заведено/ноль (17.6), заведено-не-найдено (17.6),
      переименование ожидает (17.9), повреждённая строка против записи прошедшей (17.10/17.11) —
      судится правилом Р2 целиком, положительные близнецы у каждой. Допустимость: нижняя граница
      каждого параметра и параллельность 256 → «тело не разбирается» без вычисления (05.6),
      близнец ровно на границе. Ёмкость: снизу ноль/не-положительна (15.6), сверху
      ёмкость×память+резерв>предел (15.7)+близнец, предел-не-наложен/резерв-не-задан (15.8).
