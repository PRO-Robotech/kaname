prior_blocking_check:
  - id: Б5
    was: >-
      Второе «Дано» PWV-08 («уже вошёл на другом устройстве», Д-10) строилось успешным входом,
      а Р5 переписывает значение формата A при успешном входе: к «Когда» значение уже B, 11.2
      запрещает второе переписывание, 08.7 («признак остаётся A») в этом мире ложно, и продукт,
      гасящий прочие входы на «материал изменён», проходил 08.5 — тот же исход, что в круге 1.
    resolution: ЗАКРЫТ по существу
    how_verified:
      - >-
        Опыт круга 2 повторён на редакции 4. «Дано» PWV-08 теперь строит первый вход путём
        PWV-09: запись замещения в тот момент отказывает, вход годен (Ф1-13), значение остаётся
        формата A; перед «Когда» признак значения у обоих сверяется как A, а годность входов —
        как Ф1-13, иначе прогон «не выполнилось». Предикат: `awk PWV-08-Given | grep -c 'путём'`
        → 3, `grep -c 'перед «Когда»'` → 1; на d0998da3 обе формы отсутствовали (0).
      - >-
        Другой исход на том же дефектном продукте: первый вход путём PWV-09 не гасит ничего —
        других входов нет, материал не менялся; «Когда» переписывает A в B, событие «материал
        изменён» гасит вход на другом устройстве, выданный ДО переписывания, и 08.5 ОБЯЗАНО
        покраснеть. Положительный близнец 08.7 построен тем же путём и отличается одним фактом —
        паролем в «Когда».
      - >-
        Вход внутри «Дано» встречается ровно у PWV-08 — сверено обходом всех Given §5
        (`awk Given | grep 'вошёл\|входит\|предъявл'`): содержательный вход в Given один. PWV-07
        Given «проверка давала совпал» — состояние компонента, не вход полосы, переписывания не
        производит (уровень I). Отвергнутый путь — проба кладёт A после первого входа — назван и
        отвергнут в Д-10 доводом «материал изменён на уровне хранилища сделал бы прогон „не
        выполнилось“ на самом дефекте».
  - id: Б8
    was: >-
      PWV-17 судил покрытие только по формату; 12.3 того же документа приравнивает «выше потолка»
      к «вне перечня». Версия, опустившая потолок ниже лежащих значений, проходила предусловие,
      и люди получали PWV-14 («неверный пароль» при верном).
    resolution: ЗАКРЫТ
    how_verified:
      - >-
        Опыт круга 2 повторён. Предусловие 17.7 судит покрытие правилом Р2 целиком — формат в
        перечне версии И тело разбирается её читателем И параметры не выше потолка её записи, — тем
        же, что перепись переноса 12.3. Предикат: `awk PWV-17-block | grep -ci 'потол|параметр'`
        → 5 (на d0998da3 → 0); `awk §3..§5 | grep -ci 'понижен|опуст|сниж'` → 26 (было 0). Р2
        называет понижение потолка «частичным снятием проверяющего».
      - >-
        Другой исход: версия N+1 с суженным потолком судит строки правилом Р2 → строки выше нового
        потолка непокрыты → отказ до применения классом «находка», называющий формат, потолок и
        число строк выше него; новая версия не обслуживает, исхода PWV-14 люди не встречают.
        Положительный близнец 17.8 — те же строки не выше потолка, ровно на нём тоже, — версия
        встаёт, число выше потолка печатается нулём.
  - id: Б7
    was: >-
      §3 требует параметров B не ниже объявленных, но PWV-16, §8 и §7 не несли строки о нижней
      границе, а 16.2 требовало старта при любых параметрах не выше потолка: ручка «что писать»
      молча ослабляла хеш новых паролей. Плюс «Когда» PWV-07 требует зазора между полом и
      потолком, а документ его не требовал.
    resolution: ЗАКРЫТ
    how_verified:
      - >-
        Опыт круга 2 повторён. Запись записываемого формата несёт ПОЛ (Р2): 16.5 — ручка ниже
        пола хотя бы по одному параметру даёт отказ старта, называющий ручку и пол; 16.2 сужено
        до промежутка между полом и потолком, обе границы включены. Предикат:
        `awk PWV-16-block | grep -ci 'ниже пола'` → 1 (на d0998da3 → 0).
      - >-
        Зазор для PWV-07 держит гейт дерева 13.4 — пол ни по одному параметру не выше потолка, а
        хотя бы по одному ниже; Д-08 называет источник зазора: настоящий перечень Ф2, а не
        синтетический. Предикат: `awk §3..§5 | grep -c 'зазор'` → 2 (было 0).
      - >-
        Другой исход: та же ручка на памяти 1 МиБ с одной итерацией → 16.5 отказывает в старте,
        называя пол; ручка на нынешних параметрах §1.2 → 16.2 старт ровно на поле. Пол сам держит
        13.5 против эталона строки Ф1 §4.1 (константа гейта, не чтение прозы), движение пола в
        обе стороны названо в Р2 «Правило движения пола».

