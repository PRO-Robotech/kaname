  library_facts_underpinning_new_material:
    result: ПОДТВЕРЖДЕНЫ независимым прогоном
    detail: >-
      golang.org/x/crypto v0.56.0, модуль вне дерева: bcrypt пароль 71 байт без нулевого байта —
      «совпал», тот же +нулевой байт+хвост — «совпал», +хвост без нулевого — «не совпал»; 72 байта
      +хвост — «совпал»; `abc`+NUL+`abc` — «совпал», `abcabc` и `abc`+NUL — «не совпал» — все
      дословно как §1.7 и как основание PWV-19. uint8(256)=0, uint8(300)=44 — как «параллельность
      256 стала бы нулём» (05.6). argon2 память параметра растёт линейно по выделению (64 МиБ →
      ~67 МБ) — как §1.6. RFC 9106 §3.1 границы (tag 4…2³²−1, память 8·p, итераций ≥1,
      параллельность 1…2²⁴−1) — как §3 «Область допустимости».

# ─── ВАЖНЫЕ, НЕ БЛОКИРУЮЩИЕ ─────────────────────────────────────────────────
# Нумерация продолжает круги 1–2 (В1…В16), чтобы номер оставался адресом.
non_blocking:
  - id: В17
    title: §1.1 названо на 5303cebd59 — ствол службы сдвинулся на три файла
    detail: >-
      Документ мерил §1.1 на 5303cebd59 и объявляет 843 не-тестовых файла Go у службы; текущий
      ствол 0444cb5443 даёт 846. Вхождений проверяющего — по-прежнему 0 · 0 · 0 на всех трёх
      стволах (kaname 846, kacho 1237, corelib 181), то есть несущий факт не изменился, а число
      несёт свою ревизию. Это штатный дрейф измерения (`measurement-discipline` — число с
      ревизией), не дефект; при следующей правке шапки число стоит перемерить.
  - id: В18
    title: Память записи (хешер, переписывание Р5) не входит в ёмкость проверки — и это верно, но не сказано
    detail: >-
      Р7 и 15.7 ограничивают память ПРОВЕРКИ; переписывание Р5 на успешном входе зовёт хешер
      (запись значения формата B, та же память argon2id), и его ёмкость не сверяется (предикат:
      `grep -c 'хешер.*ёмкост\|ёмкост.*хешер'` → 0; `переписыв` в блоке Р7 → 0). Это НЕ вектор
      отказа в обслуживании: переписывание идёт один раз на значение (11.2 — уже отвечающее
      объявленному не переписывается), поэтому объём переписей ограничен наследуемой популяцией,
      входящей легитимно, а не всплеском атакующего (у него нет верных паролей). Регистрационное
      хеширование — предмет Ф3 (§4.2 отдаёт ему величины ёмкости/резерва). Замечание — чтобы
      исполнитель не двойным счётом заложил память переписывания в ёмкость проверки; строкой в
      Р7 «ёмкость — про проверку; запись/переписывание идут по величинам записи (Ф3)» это
      снялось бы, но и без неё дефекта нет.
  - id: В19
    title: 15.8 требует наложенного средой предела памяти — служба в своём чарте без него не стартует
    detail: >-
      Собственный чарт службы ресурсов не объявляет (deployment.yaml resources → 0, values*.yaml
      → 0·0·0), поэтому среда предела памяти не налагает, и страж 15.8 отказывает в старте. Р7 и
      §1.6 это ЧЕСТНО называют — «с этим стражем служба в нём не стартует, пока предел не
      объявлен, — это часть той же фазы, что страж». Самосогласованная зависимость, не дефект;
      строка §9 п. 6 её несёт. Отмечено, чтобы фаза Ф3 не забыла объявить предел в обоих чартах
      вместе со стражем.

non_blocking_round1_and_2:
  checked: >-
    В11…В16 круга 2 закрыты редакцией 3 (§14.2) и перепроверены здесь: В11 — оба чарта названы,
    собственный несёт init-контейнер migrate (deployment.yaml, «name: migrate» → 1); В12 —
    предел памяти в собственном чарте отсутствует, названо с предикатом (см. В19); В14 — §10
    держит ручку на Ф1 §1.2/§4.2, строка «хеш нового пароля» Ф1 §4.1 — основание пола; В15 —
    ноль у двух переписей разведён решением (12.6 «не выполнилось», 17.6 «ответ»); В16 —
    «Ф1-01 либо Ф1-06». В1…В10 круга 1 приняты записью круга 2.

decisions_ruled:
  - item: Р5 (переписывание) остаётся здесь, исполняется Ф3
    ruling: ПРИНЯТО (ратифицировано кругом 1, подтверждено)
    why: >-
      Довод §10 п. (1)…(4) не изменился; PWV-08 по имени называет заголовок рецензента круга 3
      F4d, а не Решение 4 (В8 круга 1 держится). Вынос сделал бы ложным шов одобренной F4d.
  - item: Р6 — вторая половина предиката снятия отсутствует (ни срок, ни принудительная смена)
    ruling: ПРИНЯТО (ратифицировано кругом 1)
    why: >-
      Оба варианта F4d отвергнуты доводом Ф1 Р1 — массовый сброс. Наблюдаемая форма переехала из
      08.8 в свой мир PWV-18 (регрессия редакции 3, найденная оппонентом ОП-1, закрыта верно:
      давнее значение впервые встречает продукт в «Тогда», а не в «Дано»).
  - item: Р8 — суд СУЖЕНИЯ против записи прошедшей версии (исход «б»)
    ruling: ПРИНЯТО
    why: >-
      Исход «а» (абсолютный суд покрытия) отвергнут верно: предусловие исполняется при каждом
      создании пода (init-контейнер безусловен), и одна повреждённая строка отказывала бы в
      каждом старте любой версии, откат включительно, — а своя починка требует работающей службы.
      Суд против записи прошедшей версии (17.10, 17.11) сужает радиус до строк, ставших
      непокрытыми после последней переписи; перезапуск работающей версии снимает остановку.
  - item: Область допустимости задаёт спецификация формата, а не библиотека (05.6)
    ruling: ПРИНЯТО
    why: >-
      Спецификация RFC 9106 строже библиотеки на длине ключа (4 против 1) — сверено;
      значение за спецификацией не могло прийти от честного источника, совпадение на нём было бы
      совпадением с функцией, которой у человека не было.
  - item: Окно переписывания формата A — короче 72 байт и без нулевого байта (PWV-19)
    ruling: ПРИНЯТО
    why: >-
      Граница выведена замером библиотеки, а не рассуждением, и перепроверена независимым
      прогоном: 72 байта и длиннее совпадают со всяким тем же префиксом; нулевой байт делает
      пароль неоднозначным. Цена названа в Р5 (остаток A у таких людей не сходится; гарантия не
      дана значению с нулевым байтом).

f4d_obligation:
  source: >-
    F4d, заголовок рецензента круга 3 — замер доли строк формата A у личностей с сессией
    поставщика (§10.1).
  outcome: >-
    НЕ ВЫПОЛНИЛОСЬ по-прежнему: стенда с переносимой популяцией в досягаемости нет. Повод
    исполниться назван — тот же прогон, что перепись PWV-12, на той же базе источника (§10.1).
    Не блокирует, пока Р6 стоит: число отвечает «когда снимется проверяющий A», а не «снимать
    ли»; решение от него не зависит by construction. Решение по Р6 этим кругом не пересматривалось.

cycle:
  blocking_by_round: {round_1: 6, round_2: 3, round_3: 0}
  closed_from_round_1: [Б1, Б2, Б3, Б4, Б6]
  closed_from_round_2: [Б5, Б7, Б8]
  open: []
  convergence: >-
    6 → 3 → 0 по блокирующим. Цикл сошёлся. Каждый круг закрывал класс, а не экземпляр: круг 1
    нашёл «Тогда без производителя» и односторонние оси, круг 2 — «Дано, не согласованное с
    нормой» и односторонние оси параметров/потолка, круг 3 — новых классов не нашёл. Двенадцать
    находок оппонентов между кругами 2 и 3 (редакция 4) — доводка, а не блокирующие: все
    подтверждены по существу, две уточнены замером, и уточнение улучшило решение, а не
    развернуло его.
  reviewer_note: >-
    Запись круга 2 предупредила, что Б7 и Б8 выросли из односторонних исходов круга 1, и
    потребовала проверять обе стороны каждой оси. Этот круг исполнил требование как предмет
    ревью: по каждой ограниченной оси названы обе стороны и положительный близнец. Слепой зоны,
    аналогичной той, что дала Б7/Б8, не осталось — оси формата, параметров (пол и потолок),
    допустимости, ёмкости и покрытия закрыты симметрично.

