# ─── БЛОКИРУЮЩИЕ ────────────────────────────────────────────────────────────
blocking:
  - id: Б1
    title: >-
      PWV-07: «Когда» требует записать новые пароли форматом A — это либо неконструируемо,
      либо заводит понижение стойкости настройкой, которого документ не называет
    sections: [§5 PWV-07 (стр. 572…583), Р1, §3 «Параметры стойкости», PWV-11 And 3, §4.3 строка PWV-07]
    predicate: >-
      (1) Перечень по документу — форматы популяции: {`2a`, `argon2id`} (§0, §1.3, §3 Р2);
      «другой из перечня» при объявленном B — только A. (2) Одобренная Ф1 §4.1: «хеш
      нового пароля — argon2id, 64 МБ / 3 / 4 … переносится, чтобы не менять стойкость молча»;
      Ф1 Р1: новый пароль хешируется «нашей нынешней функцией». (3) Этот же документ, PWV-11
      And 3: значение, не отвечающее объявленному, переписывается при входе. Подставь
      объявленный = A: каждый успешный вход переписывает argon2id в bcrypt. (4) Области
      значений ручки «что писать» документ не объявляет нигде (`grep -n 'что писать\|формат новых
      паролей'` — §0.1, Р1, §4.3, PWV-07; ни одна из пяти строк не ограничивает значения).
    revision: kaname@c4966bf0 (документ) · Ф1 на kaname@3458fcce
    why_blocking: >-
      Сценарий, запрещённый нормой, APPROVED не лечит. Если ручка допускает только B —
      «Когда» PWV-07 неисполним, и вместе с ним исчезает единственный положительный контроль
      того, что ручка вообще действует. Если допускает A — продукт получает ручку, понижающую
      стойкость новых паролей и через PWV-11 переписывающую уже лежащие значения в
      наследуемый формат; расширение поверхности не названо ни в §3, ни в §7 (ban #18,
      строка «безопасность»).
    outcomes: >-
      Объявить область значений ручки «что писать»: только формат, помеченный в перечне
      как записываемый; наследуемый формат — только для чтения, и ручка, называющая его,
      даёт отказ старта с именем ручки (ещё один отрицательный «Тогда» с положительным
      близнецом). PWV-07 перевести на смену, которая существует: параметры объявленного
      формата (например, память 64 → 128 МиБ) — уже лежащие значения обоих форматов дают
      «совпал», вновь заводимое несёт новые параметры, и PWV-11 And 3 переписывает старые
      при следующем входе. Р1 от этого не меняется.

  - id: Б2
    title: >-
      PWV-03: положительный контроль в Given уничтожает формат A до «Когда» — сценарий
      меряет B против B и не может упасть на оракуле формата A
    sections: [§5 PWV-03 (стр. 497…513), Р5, PWV-08 Then 2, §6 строка PWV-03, §8 строка «отказ неразличим по времени»]
    predicate: >-
      Given 2: «оба входят верным паролем — положительный контроль». PWV-08 этого же
      документа: успешный вход значения формата A даёт «хранимое значение теперь несёт
