accepted_parts: >-
  Предмет редакции 6 один — kacho#2698 исход 1 (решение в теле задачи перечитано). Перемерено на
  голове: «Тогда» 118 (новые 20:6 21:3 22:3 23:3 24:3 25:3 = 21; прежние 18 сценариев — числа
  ведомости ред. 5), заголовков 25 (24 живых + надгробие PWV-12). Предикаты §4.3.1 на d2f6f182f
  перемерены все: фраза отказа 2 строки в recovery_complete.go (270, 272), в пробах 0; вызывающих
  ReplaceLoginVerifier 3; replaceLoginVerifierTx login_method_repo.go:315; ключ (user_id, kind)
  1; register.go:222; recovery_request.go:139; клетки observer.go 130/136; if !replaced → 264.
  Производитель назван у каждого из 21 новых «Тогда» (9 есть, 12 заказаны одной правкой Ф5 по
  kacho#2698). Близнец назван у каждого отрицания: внутри PWV-21 (третье предъявление), PWV-23 и
  PWV-24 (мир со строкой), PWV-22 (PWV-20, отличие — глагол), PWV-25 (IAM-RECOVERY-NEG-CODE-
  SECOND-TIME, kaname-recovery-lane.py:584). DoD измерим: grep фразы → 0, 22.3 держится, проба
  PWV-20…25. Открытых вопросов нет; новых глаголов, полей, путей края нет.
