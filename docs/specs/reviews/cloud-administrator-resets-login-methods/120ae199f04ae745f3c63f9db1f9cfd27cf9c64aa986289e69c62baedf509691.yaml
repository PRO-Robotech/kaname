change_from_predecessor: >-
  Правка по существу (git diff origin/638 -- документ: +405 −172). Глагол ResetLoginMethods
  переименован в ResetAccessKeys и сужен: снимаются все ключи доступа и гасятся сессии; строка
  пароля, её материал и отметка открытого пути восстановления не трогаются (Р3, новое Р8 с пятью
  отвергнутыми исходами). Причина, событие и токен отказа переименованы (access-keys-reset,
  iam.user.access_keys_reset, ACCESS_KEYS_NOT_ENROLLED). Р6 — путь возврата через Ф5 по двум
  ветвям с производителями в дереве. §0.5 — опровержение посылки полосы; §1.4 — перемер и строки
  переписи П-с…П-х; §3 Д5 переписан, Д7/Д8 новые; LMR-01/02/04/05/06/07/08 — «Тогда» под новый
  исход; LMR-09 новый; §6–§9 под новый исход.

