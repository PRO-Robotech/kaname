blocking:
  - id: Б1
    genus: CONSTRUCTIBILITY
    where: LMR-06 (а) Given; LMR-07 (б) близнец; LMR-01 последнее «И»; §8 п.3 DoD
    finding: >-
      Три утверждения требуют ЖИВОЙ сессии U (или W), выданной ПОСЛЕ сброса, а единственный
      названный документом путь к ней — LMR-05, то есть восстановление у личности без строки
      пароля, которое до посадки kacho#2698 отказывает (∅3, перемерено: 2 вхождения
      'has no password sign-in method'). (1) LMR-06 (а): «U из LMR-01 после LMR-05» — подъём уровня
      требует сессии «1»; (2) LMR-07 (б): положительный близнец — «регистрация из сессии, выданной
      после сброса (LMR-05)»; (3) LMR-01: «предъявление снятого ключа проверяющему Ф7» — испытание
      предъявления выдаётся и находится только из сессии вызывающего (begin_assertion.go,
      Ф7-55), а все сессии U сброс отсёк; чья сессия предъявляет — не названо. При этом DoD
      требует LMR-01, LMR-06, LMR-07 зелёными безусловно, допуская третью категорию только LMR-05.
      Противоречие: зелёный по DoD недостижим до kacho#2698 либо достигается непоименованным
      посевом.
    fix: >-
      Назвать посев сессии «после сброса» уровня I писателем продукта
      (humanSessionWriter.InsertSession, internal/repo/kaname/pg/human_session_repo.go:486; посевы
      этой формы уже есть, напр. internal_iam/force_logout_own_session_integration_test.go) — в
      «Посеве Дано уровня I» и в Given трёх сценариев; ссылку на LMR-05 оставить только уровню E.
      Либо условить эти три пункта в DoD так же, как LMR-05.

