    status: закрыт
    evidence: >-
      Редакция 2 завела П-п (посев «сессии-после» писателем InsertSession, «после» судится
      RevokedBefore) и П-р (подставной аутентификатор); Given LMR-06 (а), LMR-01 последнее «И» и
      близнец LMR-07 (б) ссылаются на посев, а не на LMR-05; ссылка на LMR-05 оставлена только
      уровню E (стр. 328); DoD §8 п.3 условит только LMR-05. Все 8 координат П-п перемерены
      (git grep … d2f6f182f → 8), П-р — 3 координаты на объявленных строках.

important:
  - id: В1
    genus: PRODUCER
    where: Р7, LMR-07 (б) и его близнец
    finding: >-
      Служба отсечку на своих путях не применяет (humansession/resolve.go:9 «Отсечку не
      применяет»), а FinishRegistrationInput несёт только UserID/Actor — момента аутентификации
      сессии в нём нет. Различие «сессия до / после отсечки» на уровне I возникает только тогда,
      когда реализация Р7 доведёт момент аутентификации вызывающей сессии до сверки под замком.
      Не блокирует: Р7 это и заказывает («сверка отсечки под тем же замком»), а близнец
      конструируем; реализации — не потерять это поле при протягивании.
  - id: В2
    genus: TWIN
    where: LMR-01 последнее «И»
    finding: >-
      Испытание предъявления хранится по UserID (finish_assertion.go:102 Store.Challenge(…,
      in.UserID, …)), а не по сессии; на уровне I «из сессии-после» значит «вызывающий — U».
      Одно-фактность пары это не ломает (различие — строка ключа), но пробе не утверждать
      большего, чем привязку к личности.

