blocking:
  - id: B1
    kind: DoD
    where: "§9 п. 16"
    finding: >-
      Предикат «git grep -n 'email address is not verified' -- . ':!docs' → 0 строк после правки»
      невыполним: новый текст начинается этой же строкой, поэтому каждая переутверждённая проба и
      сама константа совпадут с образцом. Пункт одновременно требует «git grep -c нового текста — не
      ноль в каждом файле» — два условия взаимоисключающи, исход п. 16 объективно всегда «не пройдено».
    measured: >-
      git grep -n 'email address is not verified' 543419ec -- . ':!docs' | wc -l → 11 (контроль: образец
      находит прежние написания в 7 файлах); новый литерал содержит образец префиксом — после правки
      число не станет 0.
    fix: >-
      Якорить образец на конце прежнего литерала, например
      git grep -nE 'email address is not verified[^:]' -- . ':!docs' → 0 (либо образец с закрывающей кавычкой), как сделала
      сторона края (F6b §6 п. 10, образец с закрывающей кавычкой; там на 680d1794 → 13, контроль
      показан). Контроль предложенного образца в обе стороны: на 543419ec → 11 (прежние написания найдены), на строке нового текста → 0.
  - id: B2
    kind: FORMAT
    where: "EV-14, первое «Тогда» (а)"
    finding: >-
      Тело задано как {"code":7,"message": + T + ,"details":[…]}: T в EV-14 не определено, а в соседних
      сценариях той же редакции T — момент постановки письма (EV-23, EV-33) и токен (EV-69).
      Центральное утверждение сценария — дословный текст — выражено незаполненной подстановкой и не
      является ни корректным JSON, ни ссылкой на значение.
    fix: >-
      Подставить литерал Р3 (в кавычках, как в таблице Р3) либо явно сказать «message — дословно текст
      Р3», как EV-11 (а).

important:
  - id: I1
    kind: FORMAT
    where: "§0.5, второй блок команд"
    finding: >-
      Команды по дереву платформы записаны псевдо-путём 'PRO-Robotech/kacho@680d1794:gateway/**'
      как pathspec — в таком виде они ничего не находят (git grep и git log выдают пусто). Утверждения
      верны: перемерено формой git grep -n 'addressRefusalText *=' 680d1794 -- gateway ':!*_test.go'
      → address_refusal.go:43, значение прежнее; git log -S'confirm it with the code from the letter'
      680d1794 -- gateway → 81f7bf3504e, 97e018f606d, c13dd559ba2. Записать исполнимой формой, как
      это уже сделано в F6b §Р3.
  - id: I2
    kind: COVERAGE
    where: "§7, абзац об уровне E"
    finding: >-
      «У четырёх последних условие одно — край ретранслирует два новых пути (kacho#2900)… до неё
      исход на уровне E — условие не создано». На 680d1794 край объявляет путь подтверждения
      доступным до подтверждения (gateway/internal/middleware/login_lane_paths.go:284), а EV-14 на
      уровне E тоже опирается на ретрансляцию пути подтверждения и в перечень не внесён. Уточнить:
      условие создано (тогда «не создано» снять) либо EV-14 входит в число условных.
  - id: I3
    kind: CONVENTION
    where: "EV-14 (а) и таблица Р3"
    finding: >-
      Таблица Р3 пишет домен заглушкой «<домен отказов службы>», EV-14 — литералом iam.kaname.cloud.
      Литерал верен (internal/refusaldomain: ServiceIAM + ProductSuffix), но одно значение в двух
      формах — повод выбрать одну.

