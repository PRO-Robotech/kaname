blocking:
  - id: B1
    kind: FORMAT
    where: "§0.5, второй блок команд (стр. 268 и 270); §0.7, последняя строка таблицы"
    finding: >-
      Обе команды по дереву платформы записаны с псевдо-путём 'PRO-Robotech/kacho@680d1794:gateway'
      как pathspec. В клоне платформы на 680d1794 они ничего не находят: git grep выдаёт пусто
      (код 1), git log — пусто; документ же печатает под ними «→ 1: address_refusal.go:43» и три
      коммита. Это ровно I1 круга 4 (FORMAT, та же форма), снятый кругом 5 («команды исполнимы»), —
      редакция 7 его возвращает. Обоснование в §0.7 перевёрнуто: команды объявлены с домом клона
      платформы, где путь gateway есть; пустоту судит как раз новая форма.
    evidence: >-
      В клоне платформы: git grep -n 'addressRefusalText *=' 680d1794 --
      'PRO-Robotech/kacho@680d1794:gateway' ':!*_test.go' → пусто, код 1; та же команда с путём gateway →
      680d1794:gateway/internal/middleware/address_refusal.go:43; поиск истории по образцу текста,
      путь gateway, ревизия платформы 680d1794 (голова ветки эпика 1266 чужого дома) → 81f7bf3504e,
      97e018f606d, c13dd559ba2, с псевдо-путём — пусто.
    fix: >-
      Команда обязана быть исполнимой дословно и при этом не давать гейту путевых координат мёртвый
      путь. Исполнимая форма, проверенная в клоне платформы: git grep -n 'addressRefusalText *='
      680d1794:gateway -- ':!*_test.go' → «680d1794:gateway:internal/middleware/address_refusal.go:43»
      (путь — в древовидном аргументе, а не в pathspec). Гейт путевых координат судит только git grep
      и git ls-files, поэтому строке поиска истории форма с путём gateway возвращается без помехи. Прохождение
      хука на новой форме подтвердить его прогоном; не проходит — запись в ведомость исключений гейта с
      задачей и предикатом снятия, а не неисполнимая команда. Строку §0.7 переписать по факту.

