# ─── НЕ БЛОКИРУЮЩИЕ ─────────────────────────────────────────────────────────
non_blocking:
  - id: N1
    kind: FORMAT
    where: '§1.14, второй абзац; Р5б п. 1'
    finding: >-
      На полосе оборота движок фундамента зовёт порт выпуска ДО единицы работы и до оборота
      (corelib v1.10.0-rc.2, internal/oauth2/handler/oauth2/flow_refresh.go,
      PopulateTokenEndpointResponse: GenerateAccessToken раньше MaybeBeginTx и RotateRefreshToken).
      Отказ в порту выпуска до оборота не доходит; отказ внутри единицы работы оборот откатывает.
      R1 необёрнут в обоих случаях, и EV-78 (а) верен, но §1.14 называет только второй механизм.
      Назвать, где встаёт вопрос П15, и что оператор отсечки хранилища остаётся — он часть
      неразделимой записи оборота, исход у него та же клетка token-grant-refused.
  - id: N2
    kind: DoD
    where: '§9 п. 15'
    finding: >-
      Знаменатель гейта назван видами выдачи, а число — полосами. Два машинных вида эндпоинта
      (client_credentials и jwt-bearer) идут одной полосой — один вызов правила в
      client_token/issue.go (weighCutoff). По видам осмотренных семь, по полосам шесть. Назвать
      единицу, которую гейт печатает.
  - id: N3
    kind: COVERAGE
    where: 'EV-85; Р13, новый пункт о семействах'
    finding: >-
      Сценарий перехода перечисляет каждое следствие Р13, кроме нового — семейства церемонии.
      Состояние держит EV-78 (семейство живо, отметки нет — правило судит текущую отметку), но
      EV-85 его не называет. Добавить семейство в Дано EV-85 либо назвать EV-78 держателем пункта.

