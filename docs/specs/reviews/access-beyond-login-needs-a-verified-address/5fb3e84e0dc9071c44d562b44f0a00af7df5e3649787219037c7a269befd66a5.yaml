# ─── БЛОКИРУЮЩИЕ ─────────────────────────────────────────────────────────────
blocking:
  - id: B1
    kind: COVERAGE
    where: 'Р5 (строка о полосе, заводимой позже), §0, §1.9, §8 инв. 5, §4.2 П7'
    finding: >-
      Полоса обмена кода и оборота токена обновления собственной церемонии не будущая: она есть
      на ревизии замера и смонтирована на /iam/v1/token (виды выдачи фундамента — authorization_code
      и refresh_token). Выпуск токена этой полосы не спрашивает ни правила выдачи, ни отметки. Р5
      называет её заводимой позже, в таблице Р5 её строки нет, поэтому вердикт unverified до неё не
      доходит, а §0 и инв. 5 утверждают обратное. Это и третья поверхность предъявления нашего
      удостоверения человека — токена обновления, — которой нет в Р5а.
    predicate: >-
      git grep -l 'internal/revocationpolicy"' -- '*.go' ':!*_test.go' | grep -cE
      'ceremonyport|oauth_ceremony|ceremonyhttp' → 0; контроль — та же команда без сужения даёт 6,
      среди них соседняя полоса того же эндпоинта. Виды выдачи полосы — словарь фундамента
      oauthceremony.GrantKinds, и полоса провязана тем же эндпоинтом, что клетки Р5.
    required: >-
      Строка Р5 на обе полосы церемонии с наблюдаемым отказом (единый тон полосы после названного
      кода или токена обновления — 400 и invalid_grant) и решением о семействе выдачи — сохраняется
      до подтверждения по Р13 или снимается; полоса спрашивает то же правило; пара сценариев:
      оборот при стоящей отметке — токен, при снятой — отказ, ни нового токена доступа, ни нового
      токена обновления; §1.9, §8 инв. 5, §10 и §9 п. 13 приведены к переписи полос.

# ─── НЕ БЛОКИРУЮЩИЕ ─────────────────────────────────────────────────────────
non_blocking:
  - id: N1
    kind: FORMAT
    finding: >-
      §3.2, первая строка: край спрашивает службу о каждом неосвобождённом методе — неточно. На
      499ad3085fd у края кеш решений, хранящий только разрешено, срок по умолчанию 5 с, сброс по
      потоку изменений субъекта; снятие отметки этот поток не питает (производителей 5, все —
      выдачи и членства). Сегодня отметку снимает только смена адреса, а производственного
      пути смены адреса нет (Upsert без производственных вызывающих), поэтому окно достижимо лишь
      в момент посадки. Назвать окно кеша решений спрашивающих, как Р5а называет окно сверки, и
      записать: будущий путь смены адреса питает поток изменений субъекта. Там же назвать
      положительный кеш собственной двери публичного слушателя — рубеж Р4б стоит раньше неё.
  - id: N2
    kind: TWIN
    finding: >-
      Близнецы EV-60 (б), EV-62 (б) и контроль вида принципала в EV-62 утверждают только отсутствие
      EMAIL_NOT_VERIFIED и зелены на любом другом отказе. Назвать хотя бы для якорного метода
      положительный исход, как сделано у EV-12.
  - id: N3
    kind: COVERAGE
    finding: >-
      Р4в объясняет методы вне круга четырьмя родами, а их 13: сверх названных там выпуск
      токена первого администратора по списку сертификатов, две двери базового секрета,
      GetRoleCompiled, PollSubjectChanges, RegisterResource, UnregisterResource,
      InternalUserService/Get. Довод, почему рубежа на них нет, верен и сильнее записанного:
      круг отправителей общий, модули передают человека на записи материализации, и рубеж там
      клинил бы очередь. Дать закрытую классификацию 13 методов той же формой, что таблица Р4в.
  - id: N4
    kind: SCOPE
    finding: >-
      Р11 п. 4: приглашённый, чьё приглашение сняли и не повторили, остаётся с адресом, занятым
      строкой PENDING, без пути ни к подтверждению, ни к новой регистрации. Назвать это состояние
      исходом решения либо отнести к kaname#458.

