blocking:
  - id: B1
    kind: COVERAGE
    where: 'Р2, Р4б, EV-60, §9 п. 5'
    finding: >-
      Р4б и перепись EV-60 охватывают только публичный слушатель. Методов внутреннего слушателя,
      которые край зовёт от лица человека, в дереве 19 (authzguard.GatewayFrontedInternalRPCs); ни
      Р2, ни Р4б их не классифицирует. Среди них есть самоадресное чтение, решаемое без вопроса к
      модели, — его не покрывает и Р4а. Правило «authN и authZ на каждом запросе, внутренний
      слушатель не освобождён» требует того же рубежа на обоих.
    predicate: >-
      awk '/^func GatewayFrontedInternalRPCs/,/^}/' internal/authzguard/caller_policy.go | grep -c
      '"/kaname' → 19; контроль: строк с InternalClusterService 5 = 4 записи + 1 комментарий
    required: >-
      Закрытый перечень для 19 методов (доступно в положении подтверждения / отказ Р3) по форме Р2,
      рубеж по действующему принципалу-человеку на обоих слушателях, пара сценариев и перепись с
      печатью числа.
  - id: B2
    kind: COVERAGE
    where: 'Р1, Р5, §1.9'
    finding: >-
      Вердикт Р5 ставится в правило ВЫДАЧИ (revocationpolicy, 6 импортёров). Суждение о нашем
      токене при ПРЕДЪЯВЛЕНИИ живёт отдельным правилом (tokenrevocation; читает его сверка
      /internal/tokens/introspect, которую край спрашивает на каждом предъявлении) и вердикта не
      получает. Токен, выданный до посадки или до снятия отметки, судится действующим до срока, а Р1
      обещает действие на следующем запросе. Класс «контроль на выдаче, но не на предъявлении»
      назван в security-hardening.md.
    predicate: >-
      git grep -l 'internal/tokenrevocation"' вне проб → 4 файла, среди них
      internal/handler/tokenintrospecthttp/handler.go; тот же файл среди импортёров
      revocationpolicy — 0
    required: >-
      Решение: предъявление судит отметку владельца-человека, либо названо, почему Р4а и Р4б
      достаточны и что остаётся досягаемым; сценарий-пара «выдан подтверждённому, отметка снята →
      суждение предъявления» с близнецом «отметка на месте».
  - id: B3
    kind: NEGATIVE
    where: 'Р11, EV-70…EV-74'
    finding: >-
      Р11 разрешает активацию подтверждением и после срока приглашения. Снятие приглашения
      распорядителем выражено тем же сроком строки: снятие членства PENDING ставит срок в now(). Посев
      G11: активация без суда о сроке активирует снятое приглашение (1 строка), членство не
      возвращается (0). Исхода для приглашения, снятого между регистрацией и подтверждением, в
      документе нет.
    predicate: 'посев G11; оператор ActivateInvite в internal/repo/kaname/pg/user_repo.go судит срок в WHERE'
    required: >-
      Развести срок и снятие решением; сценарий «снято после регистрации → подтверждение не
      активирует, Check — нет» с близнецом «не снято → активировано».
  - id: B4
    kind: NEGATIVE
    where: 'EV-35, конкурентная часть'
    finding: >-
      Утверждение «второе — 401 при любом порядке фиксации» решениями не производится. EV-39 и
      EV-40 задают порядок проверок: сессия, затем подтверждённость, затем код. Проигравший, чья
      сессия прочитана до фиксации победителя, а отметка после, получает 400 и 9 по Р15.
    required: >-
      Назвать допустимое множество исходов проигравшего либо решить суждение одним оператором;
      утверждать инварианты: ровно один 200, одна отметка, одна живая сессия.
  - id: B5
    kind: TWIN
    where: 'EV-35 (а) против (б)'
    finding: >-
      (а) и (б) различаются больше чем одним фактом: K применён И уже не последний (выдан K3), а при
      снятии отметки сменой адреса — ещё и привязан к прежнему значению. Реализация без
      однократности, но с «последний жив» даёт зелёное (а).
    predicate: 'посев G3: отметка снимается без смены адреса — близнец строится на одном факте'
    required: 'Близнец, отличающийся только тем, применён ли код; адрес не менять.'
  - id: B6
    kind: SCOPE
    where: '§3.2'
    finding: >-
      Три строки «вне объёма» называют носителя, которого нет: край (отказ Р3 на путях платформы и
      ретрансляция двух путей), фикстуры и ручки в чартах (тот же заказ), запись на чужой адрес.
      Край — половина механизма решения владельца. Отложенное без предмета нарушает ban #11.
    required: 'Завести задачи, вписать номера и предикат возврата.'
  - id: B7
    kind: FORMAT
    where: 'EV-61 (б)'
    finding: >-
      Близнец утверждает текст, которого производитель не даёт. Отказ формата страницы идёт из
      corelib validate.PageSize: сообщение invalid argument, в BadRequest поле page_size с описанием
      page_size must be in [0..1000] (0 means default). В записанном виде положительный контроль
