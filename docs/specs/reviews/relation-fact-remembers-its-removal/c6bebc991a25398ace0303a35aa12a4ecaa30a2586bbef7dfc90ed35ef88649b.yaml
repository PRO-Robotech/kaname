blocking:
  - kind: FORMAT
    scenario: §0.5, строка 103
    claim: >-
      Документ называет пробу голым именем `TestNewMigrationCitesAnApprovedAcceptance`,
      которой в дереве kaname нет. Гейт дерева `TestAcceptanceProbeCoordinateResolves`
      считает это мёртвой координатой, хук отправки красен, документ в ствол не ложится:
      приёмка, которой нет в ветке, санкцией R2-полосы быть не может. Держатель живёт в
      `PRO-Robotech/kacho` (`internal/repohygiene/acceptanceledger_test.go`), и соседние
      приёмки kaname называют его с домом.
    measured: >-
      tmp/kn636-runs/20261023T222802Z-3240466-f7ae4d99.log: «МЁРТВАЯ КООРДИНАТА
      docs/engineering/acceptance/relation-fact-remembers-its-removal.md:103 — приёмка
      называет пробу `TestNewMigrationCitesAnApprovedAcceptance`, а функции … в дереве НЕТ»,
      «КРАСНЫЙ: отказов 1», rc=1.
      `git -C project/kacho grep -l 'func TestNewMigrationCitesAnApprovedAcceptance' origin/main -- '*.go'`
      → internal/repohygiene/acceptanceledger_test.go (@41d7edad9b).
      `git grep -n 'PRO-Robotech/kacho:TestNewMigrationCitesAnApprovedAcceptance' -- docs/`
      в kaname → 10 строк в 4 приёмках (форма с домом).
    fix: >-
      Назвать пробу с домом: `PRO-Robotech/kacho:TestNewMigrationCitesAnApprovedAcceptance`
      (смысл фразы «в Go-дереве kaname её нет» сохраняется). Готово — хук отправки на голове
      с документом: отказов 0, и `git ls-remote origin refs/heads/636` = эта голова.
  - kind: DoD
    scenario: KN-RFR-07, KN-RFR-08 (§6 п.6–7)
    claim: >-
      Держатели 07 и 08 пишутся ПОСЛЕ кода: красного до правки у них не будет, а DoD не
      требует показать, что они способны упасть. Инъекции п.6 (I1–I4) не трогают ни
      `WHERE r.source_version < EXCLUDED.source_version` (`:268`), ни перевод `v_stored`
      (`:221-224`) — подтест, ничего не утверждающий, пройдёт п.7 как «заведён».
    measured: >-
      Чтение §6 п.6–7 редакции c6bebc99; миграция
      internal/migrations/20261023180000_relation_fact_remembers_its_removal.sql:221-224, :262-269
      @ fb4a810a7; DoD-proof #636 @fb4a810a7 перечисляет инъекции I1–I4 и только их.
    fix: >-
      В §6 добавить по однофактной инъекции с названным исходом: I5 — снять условие
      `WHERE r.source_version < EXCLUDED.source_version` в ветви снятия → краснеет 07, близнец
      05 зелен; I6 — ключ следа `v_user` вместо `v_stored` → краснеет 08, близнец (запись t3)
      зелен. В п.7 назвать фикстуру: `journalGrant` с субъектом параметром (08 пишет
      `system_class:anonymous`, снимает `user:*`).

