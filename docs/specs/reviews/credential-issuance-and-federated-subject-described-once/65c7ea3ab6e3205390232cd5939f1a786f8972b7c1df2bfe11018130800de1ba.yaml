      соседями» измерено: iam-account.py _AID_ADM (03,04,12,13,16,19,22,Shared), iam-user.py AidAdmShared,
      kaname-cluster-admins.py CapAdmin. Соседняя выдача ROLE_VIEW человеку церемонии
      (rbac-subject-channel-equivalence.py IAM-CH-USER-SA-ISOLATION-DENY) снимается в том же кейсе и исход CIF-02
      не меняет (порог раньше двери).
