constructibility:
  seeded: >-
    Черновые пробы вне запроса, на копии дерева 40902d877 (оно же дерево вершины волны). (а)
    Форма «Дано» 01…08 через загрузчик — аналогом, ручкой того же вида
    authn.client-token.token-ttl: полный профиль supplyProfile проходит стража на всех четырёх
    посадках (отказов 0); переменная, заданная после supplyProfile, с повторным
    config.Load("") доезжает до поля (все строки таблицы подаются окружением, файла нет);
    под own потолок плюс 1 нс — один отказ с ключом и потолком, потолок — ноль отказов, 0s —
    отказ с ключом; под external та же величина не судится; профиль own без двух строк — два
    отказа, по ключу на каждую. (б) Форма «Дано» 09…12 — мир церемонии на Д0 (константы) с
    относительным сдвигом ОДНОЙ записи: сдвиг одного кода — строк 1, ограничение цело; код,
    сдвинутый за срок, — 400 invalid_grant, байт в байт как у неизвестного кода; сдвинутый на
    40 с — 200. Сдвиг семейства — строка семейства (ровно 1) и все его токены (после оборота —
    2), ограничения целы; семейство за границей — invalid_grant байт в байт как у неизвестного
    токена обновления, моложе — 200; цепочка «сдвиг 1 ч → законный оборот 200 → сдвиг 1 ч 1 мин
    → преемник» на Д0 даёт 200. Красные §4 на Д1 подтверждены на Д0 числом: журнал старта
    несёт authorization_code_lifespan 1m0s и не несёт refresh_token_lifespan; expires_at −
    issued_at кода 60.000 с; expires_at − created_at первого токена обновления 11h54m59.85s.
  named_fixture_not_seeded: >-
    Поля и строки самих ручек, параметр мира, называющий оба срока, и провязка их в сборку и
    границу — заводит это изменение, до правки они не выразимы. Судимые числа 09…12 (30 с, 2 ч,
    45 с, 3 ч) поэтому посеяны формой на Д0, а не величиной.
  chart_seed: >-
    Форма 13/2 — аналогом, блоком authn.login профиля поставки, который Р6 берёт образцом:
    рендер values.yaml, values.prod.yaml и накладки own из пробы чарта — блок в карте есть,
    страж старта над картой не отказывает; тот же рендер с `--set authn.login=null` — блока
    нет, страж отказывает и называет ключи блока (authn.login.session-ttl,
    authn.login.recovery-code-ttl).
  counts: 'посеяно формой 13 из 13 сценариев; судимые величины новых ручек — названной фикстурой, до правки не выразимы; не выполнилось 0'

findings:
  blocking:
    - id: 1
      kind: COVERAGE
      where: 'KN-CTTL-01…08, §1.1 п.2, §2 «Нижняя граница сверх положительности», §5, §6 пп. 3, 4, 12'
      statement: >-
        Допустимый диапазон объявлен `0 < срок ≤ потолок` (§1.1 п.2), и §2 прямо говорит, что
        нижней границы сверх положительности нет. Ни один сценарий не подаёт стражу величину
        строго внутри диапазона. Положительные близнецы 03 и 06 стоят ровно на потолке; 08/2
        судится под external, где ручки не судятся; образцы таблицы (§6 п.3), профиль поставки и
        стенды (Р6) — тоже потолок; мир 09…12 собирает настройку вручную и `Validate` не
        проходит. DoD задачи #318 требует прямо противоположного: «отрицательный близнец
        (значение под потолком) проходит».
      failure_scenario: >-
        Страж, отвергающий всякий срок ниже потолка (первая ветвь сравнивает с константой
        вместо нуля) либо с поднятым нижним краем: KN-CTTL-01…13 зелены, все шесть инъекций §6
        п.12 дают названный исход, пробы таблицы и чарта зелены, стенды поднимаются. При этом
        установка, назвавшая 30 с, не стартует, и ради этого задача и заведена.
      experiment: >-
        На соседней ручке того же вида допуск нижнего края в этой службе не следует из «> 0»
        сам собой: authn.client-token.token-ttl = 1ns под own её собственный страж принимает, а
        старт отвергает другой страж — authn.presented-credential.revocation-cache-ttl, по
        соотношению с этим сроком. Значит, что положительный срок допущен, надо утверждать, а
        не выводить.
      required: >-
        Подслучаи 03/2 и 06/2 — нижний край `1ns`, ровно один факт против 01/2 и 04/2 (`0s`):
        `Validate` не отказывает, загруженная величина — `1ns`. Подслучаи 03/3 и 06/3 —
        величины мира 09/1 (`30s` и `2h`): `Validate` не отказывает, величина доехала; тогда
        загрузчик и мир судят одно число. Строки в §5; в §6 п.4 — зелены на Д1; в §6 п.12 —
        инъекция «первая ветвь стража сравнивает с потолком вместо нуля»: красны 03/2, 03/3,
        06/2, 06/3, а 03 и 06 зелены.
  non_blocking:
    - id: 2
      kind: DoD
      where: '§0.6, Р6, §6 п.7'
      statement: >-
        Не назван сосед, чьё утверждение меняется по построению:
        TestProdProfile_EveryKnobIsLoadBearing (deploy/prod_profile_test.go) и её ведомость
        restatedDeliberately. После Р6 профиль поставки на external несёт
        authn.ceremony.{codeTtl,refreshTtl}; новые строки переложения ставят их на поверхность
        посадки (postureValuePathsOf читает configBridge); снятие под external стража не
        роняет, и проба краснеет, пока в ведомость не лягут две записи с причиной и условием
        истечения. Образец уже есть: блок login профиля, комментарий у строк переложения
        полосы входа говорит, что каждая стоит в этой ведомости. Назвать пробу и записи в §0.6
        и §6 п.7, чтобы запись была названным переводом, а не решением реализующего о
        послаблении.
    - id: 3
      kind: FORMAT
      where: 'KN-CTTL-11, §5'
      statement: >-
        «Тогда» сравнивает тело отказа с телом на неизвестный токен обновления, но ни одно
        «Когда» такого токена не предъявляет, а проба LINE-A-1-24 держит это только для кода.
        Добавить шаг в «Когда» и производителя в §5: оба исхода FetchRefreshToken сводит к
        ErrGrantNotFound (oauth_ceremony_vaults.go:635-648 на 40902d877). Посевом на Д0
        утверждение верно: байт в байт.
    - id: 4
      kind: FORMAT
      where: '§0.7 «Профиль через загрузчик», KN-CTTL-07, 08/3'
      statement: >-
        supplyProfile сам зовёт config.Load и снимает ровно одну строку. «Подать величину
        поверх профиля» значит задать переменную после supplyProfile и повторить
        config.Load(""); «без обеих строк» значит ещё и снять вторую переменную. Форма
        посеяна и работает; её стоит назвать, чтобы проба не заводила второго построителя
        профиля.

twins_and_producers:
  producer_per_then: '13 из 13 — таблица §5 полна; у 11 не назван производитель сравнения тел (находка 3)'
  twin_per_negative: >-
    у 01, 02, 04, 05, 07, 08, 10, 11, 12 и 13/2 близнецы названы, дельта в один факт; близнец
    нулевого срока стоит на потолке, а не на нижнем крае, и нижний край не судит никто
    (находка 1).
  note: >-
    Остальной контракт проверен и признан верным: 01/02/03 различают отсутствие, ноль и
    потолок; 07 опирается на 01, чтобы «называет обе» не было свойством стража всегда; 08
    держат половины под own; 09 различает «читает ручку» и «совпало с числом» двумя мирами;
    12 — единственный сценарий, где срок от первой выдачи и срок от оборота расходятся, и
    инъекция «только Config.RefreshTokenLifespan» краснит ровно его. Арифметика 12 пересчитана:
    преемник после первого сдвига получает срок «рождение плюс 2 ч», после второго — истёк за
    минуту до предъявления; на такой инъекции — жив ещё 59 мин.

