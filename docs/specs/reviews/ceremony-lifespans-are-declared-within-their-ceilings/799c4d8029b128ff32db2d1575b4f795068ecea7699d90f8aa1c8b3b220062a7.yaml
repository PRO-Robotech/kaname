constructibility:
  seeded: >-
    Черновые пробы вне запроса, на выгрузке дерева 40902d877 (= дерево вершины волны). (а)
    Загрузчик, аналогом — ручкой того же вида authn.login.recovery-code-ttl (срок, судимый
    только на положительность и только под own): полный профиль own проходит стража; поверх
    него 1ns, 30s и 2h доезжают до поля как 1ns, 30s и 2h0m0s, отказа нет; 0s и -1s — отказ с
    ключом; профиль без строки — величина 0s, отказ называет только её; снята ещё и вторая
    переменная с повтором config.Load — отказ называет обе; под external 0s не судится. Этим
    посеяны формы 01, 03 (с подслучаями), 04, 06 (с подслучаями), 07, 08. Утверждение ред. 2
    об опыте круга 1 перемерено: под own authn.client-token.token-ttl = 1ns доезжает до поля,
    собственный страж ручки не отказывает, старт отвергнут, и отказ называет
    authn.presented-credential.revocation-cache-ttl. (б) Мир церемонии на Д0, Postgres в
    контейнере: две первые пары; неизвестный токен обновления (randomToken(32) тем же клиентом)
    — 400 и тело {"error":"invalid_grant"}; семейство A сдвинуто за границу (строка семейства
    1, токенов 1) — 400, код и тело совпали байт в байт с эталоном; семейство B сдвинуто на
    1 ч 59 мин — 200. Форма KN-CTTL-11 с новым шагом встаёт.
  named_fixture_not_seeded: >-
    Поля и строки самих ручек и параметр мира, называющий оба срока, заводит это изменение; до
    правки они не выразимы. Формы 02, 05, 09, 10, 12, 13 редакцией 2 не менялись и посеяны
    кругом 1 на том же дереве 40902d877.
  counts: 'посеяно этим кругом формой 7 из 13 сценариев (01, 03, 04, 06, 07, 08, 11), прочие 6 — кругом 1 на том же дереве; не выполнилось 0'

