  sanction:
    outcome: САНКЦИИ НЕТ — ждёт события
    decided_by: acceptance-reviewer
    decided_at: '2026-09-27'
    issued_by_event: null
    event_url: null
    basis: >-
      change-graph.md §3: вердикт действителен, когда его подтверждает внешнее событие —
      принадлежащее названной задаче, с допущенным к роли автором, с телом, связывающим точный
      отпечаток предмета, роль и вердикт. На момент записи события нет ни одного, поэтому
      issued, issued_at и ban1_lifted стоят формой «не выдано», а не пропущены.
    conditions_pending: >-
      (1) Отпечаток — git show 94ef7a123:<путь> | sha256sum равен имени этой записи и строке
      subject_sha256 события; ревизия на origin раньше события (gh api
      repos/PRO-Robotech/kaname/activity?ref=refs/heads/318). (2) Принадлежность — issue_url
      события указывает на PRO-Robotech/kaname#318. (3) Полномочие — автор события значится в
      review_authority.acceptance-reviewer политики docs/changes/policy.yaml воркспейса
      (сейчас строка 41, [pointpu]). (4) Тело — пять строк заголовка дословно, каждая ровно одна,
      контроль в другую сторону verdict CHANGES_REQUESTED → 0; created_at == updated_at.
    mechanism: >-
      После события запись приводится к факту НА МЕСТЕ — форма 585749b74 (#295) и 2e45268cb
      (#406): тронуты ровно три выводимых поля (issued, issued_at, ban1_lifted), outcome этого
      блока и его поля события, с перемером всех четырёх условий на своей ревизии. Вердикт,
      находки, числа, why и publication_pending не правятся: они — рассуждение на момент
      вердикта. Координата записи есть отпечаток, поэтому второй записи о той же редакции не
      бывает; запись круга 1 не тронута.
    divergence_predicate: |-
      python3 - <<'PY'   # из корня рабочей копии kaname; нужен PyYAML
      import glob, yaml
      rows = [(p, yaml.safe_load(open(p))) for p in sorted(glob.glob('docs/specs/reviews/*/*.yaml'))]
      bad = [p for p, d in rows
             if (d.get('event') or {}).get('status') == 'performed'
             and d.get('verdict') == 'APPROVED'
             and (d.get('effective_approval') or {}).get('issued') is not True]
      print('осмотрено', len(rows), '· расхождений', len(bad))
      for p in bad:
          print(' ', p)
      PY
    divergence_predicate_result: >-
      На 94ef7a123 до этой записи — «осмотрено 65 · расхождений 0». С этой записью — «осмотрено
      66 · расхождений 0»: события у неё нет, и предикат её по построению не судит.
    gate: >-
      Инвариант performed ⇒ issued true держится вниманием, держатель заказан kaname#302.
      Запись без исполненного события судит .github/scripts/review-event-silence.py: он ищет в
      kaname#318 комментарий с заголовком на этот отпечаток; до события расхождений по этой
      записи нет, после события без приведения записи к факту гейт краснеет.

