      замка 2 с (force_logout.go:528, lock_timeout в ForceLogoutWriter). Взаимной блокировки с
      выходом по чтению нет: выход берёт строку сессии → семейства → отсечку, распорядитель —
      строку личности (KEY SHARE → NO KEY UPDATE, с ключевым замком внешнего ключа совместим) →
      строки сессии → семейства → отсечку. Отказ возможен только при удержании строки сессии
      выходом дольше 2 с. 05/3 на новой базе не перепрогонялась. Реализации: печатать число
      отказов по раундам, чтобы «отказов нет» было счётом, а не молчанием.

