non_blocking_findings:
  - id: N6
    kind: wording
    where: §6 п.7, абзац после контроля
    text: >-
      «Ложен только вывод того же абзаца (строки 714-716)» верно лишь с 714 «обе строки несут»:
      первая половина 714 («от строки сессии к событию дороги нет») остаётся верной и после
      правки. И наоборот: строка 705 (перечень закрытого словаря из трёх значений) после правки
      ложна, но ловится только по соседям 704/706 того же абзаца. Реализации: снимать абзац
      704-708 целиком.
  - id: N7
    kind: premise
    where: KN-SER-05, 05/3 «отказов нет»
    text: >-
      На новой базе у принудительного выхода появился свой источник отказа — предел ожидания
      замка 2 с (force_logout.go:528, lock_timeout в ForceLogoutWriter). Взаимной блокировки с
      выходом по чтению нет: выход берёт строку сессии → семейства → отсечку, распорядитель —
      строку личности (KEY SHARE → NO KEY UPDATE, с ключевым замком внешнего ключа совместим) →
      строки сессии → семейства → отсечку. Отказ возможен только при удержании строки сессии
      выходом дольше 2 с. 05/3 на новой базе не перепрогонялась. Реализации: печатать число
      отказов по раундам, чтобы «отказов нет» было счётом, а не молчанием.

