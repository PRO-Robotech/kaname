blocking_findings:
  - id: B1
    kind: PRODUCER
    where: KN-SER-05, третья половина (одновременные собственный выход и ForceLogout); §5 строка KN-SER-05
    text: >-
      «Тогда» третьей половины не может покраснеть на снятии производителя, которого ему
      приписывает §5. Разбор по фактам:
      (а) «запись снята ровно один раз» не имеет наблюдения. Второе снятие поверх первого
      перезаписывает ту же пару (ended_at, ended_reason), и ни одно названное чтение строки его
      не отличит от одного снятия;
      (б) «причина — ровно одно из двух значений» истинно по построению при ЛЮБОЙ реализации. В
      раунде два писателя, ограничение базы других значений не пропускает;
      (в) не назван источник, из которого проба узнаёт победителя, чтобы напечатать счёт. Если
      победитель читается из той же строки, (а) и (б) — тождество: обе стороны сравнения
      происходят из одного источника;
      (г) порядок, который сторожит названный производитель human_session_repo.go:279,
      оставлен жребию двадцати раундов. Это порядок «резолв выхода увидел живую запись →
      ForceLogout завершён → запись выхода». Ветвь, которая в этом порядке делает проигравший
      выход молчащим, — logout.go:83-86 (`!ended` → `return false, nil`). В переписи §5 её нет:
      там названа ранняя ветвь logout.go:65-70, а её держит вторая половина.
      Предикат — дерево с `AND ended_at IS NULL`, снятым в human_session_repo.go:279. На нём
      оператор выхода меняет одну строку всегда, когда его резолв видел запись живой. Выход
      возвращает ended=true, пишет пару ('logout', свой момент) поверх снятой распорядителем и
      кладёт свою отсечку и событие. Оба глагола отвечают успехом, значение ∈ {logout,
      admin-force-logout} — все три «Тогда» третьей половины зелены. Первая половина этот
      оператор не исполняет (там :307), вторая тоже (там ранний выход :65-70). Значит у
      производителя :279 нет ни одного сценария, способного покраснеть на его снятии. А это
      ровно предмет документа: запись называет не того, кто снял сессию.
      Прочитано: human_session_repo.go:276-294, logout.go:53-86.
    required_change: >-
      (1) Назвать независимого производителя исхода «кто снял». Им служит `LogoutUseCase.Execute`:
      он возвращает `ended` «для журнала и проб» (logout.go:53-55), а при снятии кладёт отсечку
      с причиной `logout` и событие `iam.session.logged_out` с `session_id`. Потребовать
      соответствия в каждом раунде: `ended_reason = 'logout'` ⟺ Execute вернул true ⟺ ровно
      одно событие выхода для S″. `ended_reason = 'admin-force-logout'` ⟺ Execute вернул
      false, и выход не положил ни отсечки, ни события. Счёт выигрышей брать из Execute, а не
      из строки.
      (2) Завести детерминированную половину с принудительным порядком: резолв выхода видит
      живую запись → ForceLogout завершён → шаг записи выхода. Порядок задаёт обёртка
      хранилища поверх HumanSessionRepo; прецедент встраивания `humansession.Store` —
      internal/handler/loginlanehttp/recovery_session_integration_test.go:240.
      «Тогда» этой половины: выход отвечает успехом, Execute → false, записей выхода нет, у
      записи остаются `admin-force-logout` и момент принудительного выхода.
      Производители — logout.go:83-86 и human_session_repo.go:279. Различие со второй
      половиной одно: что увидел резолв выхода. До правки половина красная (распорядитель
      пишет `logout`) и потому отделяет верную реализацию и от «переписал проигравший», и от
      «прежнее слово».
      Третья половина остаётся спорным путём без порядка и держит «ни отказа, ни второго
      снятия» уже через (1).

non_blocking_findings:
  - id: N1
    kind: measurement
    where: §0.2, блок `git grep -n 'RevokeReasonSecondFactorReset'`
    text: >-
      Названный предикат даёт 4 строки, а не 3: сверх объявления (:235) и двух мест в
      reset_second_factor.go (:185, :197) совпадает комментарий domain/human_session.go:232.
      Вывод «вызова End* нет» от этого не меняется. Число исправить вместе с B1.
  - id: N2
    kind: DoD
    where: §6 п.7
    text: >-
      Предикат уже утверждения. Утверждение — «абзацы о записанном остатке и о четвёртом
      значении, которое нужно, сняты». Предикат ищет два оборота: `ЗАПИСАННЫЙ ОСТАТОК` (:377) и
      `ПРЕДИКАТ СНЯТИЯ ОСТАТКА` (:413). Он даст 0 и там, где остались абзац `ЧЕТВЁРТОЕ ЗНАЧЕНИЕ
      НУЖНО` (:383) и `РЕШЕНО: нужна миграция, добавляющая…` (:401). После изменения оба ложны.
      Добавить эти обороты в предикат. Оборот `НОМЕРА У ЗАДАЧИ ПОКА НЕТ` в предикат не ставить:
      на :434 он принадлежит остатку #340, и тот остаётся.
  - id: N3
    kind: form
    where: KN-SER-07, «Форма — TestHumanSessionMethodVocabularyAgreesWithTheRule»
    text: >-
      Обратная половина соседа (human_session_schema_integration_test.go:114-122) лишнего
      значения в ограничении не видит. Она считает только совпадения со словами правила, а слово
      вне правила не входит в счёт. Воспроизведено отдельной программой той же логики над
      определением с четырьмя словами словаря снятия: определение ровно из словаря — зелёное;
      определение с лишним `'sneeze'::text` — ТОЖЕ зелёное. Требование документа («проба обязана
      краснеть и назвать это значение») такую копию поймает. Но сосед назван формой, и прямо
      сказать, что его обратную половину копировать нельзя, дешевле, чем узнать это на инъекции.
      Сам сосед — предмет отдельной задачи, а не этого документа.
  - id: N4
    kind: holder
    where: KN-SER-10; §6 пп. 3, 4, 9
    text: >-
      У сценария нет пробы: держатель — разовые предикаты посадки. После вливания второй литерал
      не заметит ничего. Наблюдаемое следствие расхождения частично держит третий факт KN-SER-01,
      но только если проба сверяет его с объявлением домена. Либо перевести KN-SER-10 в DoD как
      проверку посадки, либо дать ему пробу по разбору Go (литерал вне объявления — находка,
      объявление — молчание).

