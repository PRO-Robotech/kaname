    05/2 зелёные;
    без :307 — 05/1 КРАСНАЯ: ended_at переписан моментом распорядителя; 05/2 и 05/4 зелёные;
    05/3 без :279 — зелёная в обоих стартах: естественный старт 20:0, сведённый 19:1,
