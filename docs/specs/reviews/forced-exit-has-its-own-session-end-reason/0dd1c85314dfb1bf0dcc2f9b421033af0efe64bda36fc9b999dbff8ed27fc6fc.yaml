    where: KN-SER-05, абзац «05/3 — спорный путь без порядка»; §5, таблица, колонка 05/3
    text: >-
      «Жребий» 05/3 измерен, и он решается стартом, а не жребием. При естественном старте
      выход выиграл 20 из 20: ForceLogout до снятия пишет операцию и отсечку. Когда выход
      отпускается на входе ForceLogout в EndAllSessions, распорядитель выиграл 20 из 20.
      Значит, утверждение «держит только она путь, где снятие выхода ждёт замка строки» при
      естественном старте не наблюдалось ни разу, и «красная по жребию» в колонке 05/3 на деле
      почти «зелёная». Не блокирует: у каждого производителя есть детерминированный держатель
      (:307 — 05/1, :279 и :83-86 — 05/4). Рекомендация на реализацию: сводить старт на входе
      OwnSessions.EndAllSessions обёрткой порта и печатать счёт. Либо снять утверждение о
      единственности.

