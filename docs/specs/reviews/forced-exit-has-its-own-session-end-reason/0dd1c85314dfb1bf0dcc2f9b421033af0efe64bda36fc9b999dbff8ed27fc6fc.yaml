    NewLogoutUseCase с часами пробы, ownPostureForceLogoutHandler, seedForceLogoutUser и
    seedOwnLoginSession. Проверяются только свидетели, не зависящие от нового значения.
    Результаты:
    дерево как есть — 05/1, 05/2 и 05/4 зелёные. В 05/4 задержка сработала, в 05/2 нет;
    ended_at = revoke_before в 05/2 и 05/4; причина `logout`, потому что правки ещё нет;
