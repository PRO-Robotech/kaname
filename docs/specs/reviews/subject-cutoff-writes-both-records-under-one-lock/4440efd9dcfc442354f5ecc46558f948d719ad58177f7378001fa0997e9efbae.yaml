  why: >-
    Блокирующих два (CONSTRUCTIBILITY, TWIN). Санкции на код по этой редакции нет.

blocking:
  - kind: CONSTRUCTIBILITY
    scenario: KN-SCL-12
    claim: >-
      Общее «Дано» сеет человека как `ceremonyScene` — владельцем своего аккаунта.
      Такого человека удалить из `kaname.users` нельзя: `accounts_owner_fk` ON DELETE RESTRICT
      (`0001_initial.sql:5402`). Шаг «строка человека W удалена» при названном посеве не
      исполним, сценарий краснел бы не тем.
    measured: >-
      Временная проба посева (снята, в дерево не вошла): ceremonyScene + первая запись +
      DELETE → `ERROR: ... violates foreign key constraint "accounts_owner_fk" (SQLSTATE 23503)`.
      Близнец посева: второй человек того же аккаунта (не владелец) удаляется, первая запись
      снята каскадом (count=0).
    fix: >-
      Назвать посев W явно: член чужого аккаунта, не владелец (вторая строка `users` в аккаунте,
      заведённом ceremonyScene), без привязок субъекта.
  - kind: TWIN
    scenario: KN-SCL-06
    claim: >-
      У 06 (блокировка с моментом раньше стоящего не меняет вторую запись) положительный
      близнец не назван. 05 — близнец 04 на триггере учётки; 09 отличается от 06 больше чем
      одним фактом (стоящей записи нет вовсе). Нужен близнец на триггере человека: стоящий
      момент `now() - 1 час` → блокировка берёт `owner is no longer active` /
      `kaname:owner-deactivated` и момент транзакции.
    measured: >-
      Та же временная проба: стоящий момент now()+1h → момент сохранён, причина и решивший
      переписаны на `owner is no longer active` / `kaname:owner-deactivated` (красное 06 до
      наката подтверждено); now()-1h → момент транзакции и те же значения (близнец зелен до
      наката). Пара отличается ровно стоящим моментом.

important_nonblocking:
  - "KN-SCL-11 — до наката исход недетерминирован; документ это называет и исключает из разводки §6 п.5. Принято."
  - "DoD п.12, инъекция «одна функция без замка» — после добавления близнеца 06 назвать, что он остаётся зелёным."

confirmed:
