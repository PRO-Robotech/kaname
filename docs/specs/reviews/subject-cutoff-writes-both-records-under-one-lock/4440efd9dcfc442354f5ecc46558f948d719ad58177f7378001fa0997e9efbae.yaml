  - "KN-SCL-08 до наката: первая запись с причиной 122 знака и NULL-решившим ложится одна, второй нет — красное подтверждено посевом."
  - "S3: `rule.go:165` `issued.Time.Before(cutoff)`; `newStand` now = 2026-09-06T12:00:00Z (целая секунда); `s.good`, `revoke`, `assertSingleRefusal`, `TestKAN_REV_01_…`, `mintToken(t, sub, iat, pub)`, `newHandler(…, now)` существуют."
  - "Производитель назван у каждого «Тогда» (§5, 18 из 18); близнец у отрицаний — 17 из 18 (без 06)."

