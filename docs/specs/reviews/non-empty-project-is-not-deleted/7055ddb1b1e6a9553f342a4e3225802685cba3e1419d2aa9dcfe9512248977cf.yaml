# ─── СХОДИМОСТЬ ─────────────────────────────────────────────────────────────
cycle:
  blocking_by_round: {round_1: 4, round_2: 3, round_3: 4, round_4: 2}
  genus_repeat: >-
    Да, пятый раз один род — производитель: здесь «Дано», которое схема не
    даёт построить, и «И», у которого нет мира, где оно упадёт. Ось 4 заведена
    ровно против этого и объявлена закрытой («открытых строк нет»), но
    пройдена ПРОЧТЕНИЕМ: клетка 1-19 «строки каталога напрямую» не посеяна,
    второе «И» 1-05 не сверено с домом.
  class_moves_into_the_task_form: >-
    Шаг задания следующему кругу, до правки сценариев: (1) по каждому
    нетривиальному «Дано» дома П и Р — посев на мигрированной схеме и вывод
    рядом со строкой оси 4, а не слово «напрямую»; (2) по каждому «И», которое
    утверждает отсутствие или состав перечня, — назвать мир сценария, где
    спецификация и очевидный мутант расходятся; нет такого мира — «И» вакуумно.
  radius: >-
    Узкий: два сценария (1-19 целиком «Дано», 1-05 одно «И») плюс одно «И» в
    1-17 или новая полоса, строки оси 4 и §2.3. Решения §2.2–§2.4 верны и
    посевом подтверждены; §3, §4, §7, §8, §9 правки по блокирующим не требуют.
  cycle_converges: >-
    Да: 4 → 2, радиус сужается, оба блокирующих исполнимы этим же документом
    без чужой работы. Признак «производителей напишет другая открытая задача»
    не выполняется — круг 5 оправдан.
  out_of_turn: false

