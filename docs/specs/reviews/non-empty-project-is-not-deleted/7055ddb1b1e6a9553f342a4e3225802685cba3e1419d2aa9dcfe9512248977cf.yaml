# ─── НОВЫЕ БЛОКИРУЮЩИЕ ──────────────────────────────────────────────────────
blocking:
  - id: К4-Б1
    title: >-
      «Дано» IAM-PNE-1-19 в трёх отрицательных состояниях запрещено схемой для
      названного вида vpc.network
    sections: [§5.1 IAM-PNE-1-19, §0.2в строка 1-19, §6 строка 1-19]
    genus: производитель «Дано» — тот же род, что Б4 круга 3 и ось 4 целиком
    sign: >-
      Сценарий называет положительный вид vpc.network и требует, чтобы каждое
      отрицательное состояние отличалось от него «ровно одним фактом —
      состоянием строк каталога вида … а не видом». Ось 4 объявляет «строки
      каталога в пяти состояниях напрямую», §0.2в — «открытых строк нет».
    experiment: |
      Посев на мигрированной схеме, в транзакции с откатом:
        снять у vpc.network только delete        → UPDATE 1, конструируемо
        снять ресурс с преемником (глаголы сперва) → ERROR 23503 role_rule_ref_verb_fk:
            Key (module, resource, verb, live)=(vpc, network, get, t) is still referenced
        убрать вид из каталога вовсе               → тот же ERROR 23503
      На vpc.network ссылаются 6 строк role_rule_ref трёх посеянных системных ролей
      (rol4d942f110ed3d7c47, rol8ed48ecc3878c2e73 — с глаголом NULL, rolfe683216e63311d3f);
      ключи DEFERRABLE INITIALLY IMMEDIATE, а дом П исполняет Execute своей
      транзакцией с коммитом — отложить проверку до отката пробы нельзя.
    subject: >-
      Три состояния из четырёх для vpc.network строятся только правкой правил
      системных ролей — вторым фактом, который сценарий прямо запрещает. Либо вид
      берётся другой — тоже второй факт («не видом»). То есть 1-19 как написан
      не строится названным домом, а ось 4 объявила его построенным прочтением.
      Условие охраны при этом верно (см. Б1 выше): неверен сценарий, а не решение.
      Сопутствует той же клетке: примечание требует, чтобы положительный
      контроль отличался «не проектом», а сценарий заводит «проект Q» и «в каждом
      проект заводится заново» — два предложения одного сценария исключают друг друга.
    predicate: >-
      Посев всех пяти состояний одного вида в доме П напрямую, без правки
      role_rule_ref. Годен вид без ссылок из правил ролей — на мигрированной
      схеме таких 10 из 20:
      `SELECT cr.dotted, (SELECT count(*) FROM kaname.role_rule_ref rr WHERE
      rr.module=cr.module AND rr.resource=cr.resource) FROM kaname.catalog_resource
      cr WHERE cr.live AND cr.module<>'iam'` → 0 у compute.guestAccessKey,
      compute.placementGroup, registry.registries, registry.repositories,
      storage.images, storage.snapshots, storage.volumes, vpc.addressPool,
      vpc.cidrGroup, vpc.networkInterface. На storage.volumes все пять состояний
      посеяны и дали ожидаемый исход (0 · 1 · 1 · 1 · 1). Надёжнее всего —
      синтетический модуль и ресурс, заводимые самой пробой: тогда посев не
      зависит от посеянных ролей, а проба утверждает свою предпосылку.
    outcomes: >-
      Назвать в «Дано» вид, у которого все пять состояний строятся одним фактом
      (синтетический либо без ссылок из правил, с утверждением этой предпосылки
      в пробе); примирить «не проектом» с «проект заводится заново» (например:
      на каждое состояние свой проект, и близнец — тот же проект до смены
      состояния каталога); привести строку оси 4 и сводку «21 из 22» к посеву.

  - id: К4-Б2
    title: >-
      Условия ГРУППИРОВКИ перечня не имеют держателя, способного упасть: их
      утверждения стоят в мирах, где спецификация и мутант дают одно и то же
    sections: [§5.1 IAM-PNE-1-05, IAM-PNE-1-17, IAM-PNE-1-19, §2.3, §10 S1]
    genus: утверждение без мира, в котором оно может упасть — тот же род, что Б2 круга 3 («обещание в предикате готовности без держателя»)
    parts:
      - part: а
        title: второе «И» IAM-PNE-1-05 не строится своим домом и противоречит своему «Дано»
        predicate: >-
          «перечень называет iam.role: 1, а не 2, даже если рядом лежит строка
          зеркала того же вида». Дом 1-05 — К (§0.2в, §6.1); строку зеркала К не
          заводит — регистрация только на :9091 (§6.1 самого документа). «Дано»
          1-05 — «ни одним объектом зеркала». §2.3 (таблица трёх входов, строка
          «iam.role при живой роли») называет держателем двойного счёта именно
          1-05. Ось 4 отметила строку 1-05 «сходится».
      - part: б
        title: исключение семейства в группировке не наблюдается ни одним сценарием
        predicate: |
          Мутант: группировка без `NOT LIKE 'iam.%'`, охрана как в §2.2. Посев мира
          положительного контроля 1-17 (iam.group + vpc.network на одном проекте):
            держит: да · спецификация: Project … is not empty (vpc.network: 1)
                         мутант:       Project … is not empty (iam.group: 1, vpc.network: 1)
          1-17 текст отказа положительного контроля не утверждает; строки iam.*
          без чужой строки отказа не дают вовсе — группировка не печатается;
          1-12 Б требует в обеих формах только условие глагола, а «имён там два»
          выполняется и при приставке в одной форме. Итого мутант зелен на всех 22.
      - part: в
        title: «имя вида без живого delete не печатается» в IAM-PNE-1-19 вакуумно
        predicate: |
          Мутант: группировка без условия живого delete. Миры 1-19 как написаны:
            положительный (одна строка живого вида) → спецификация = мутант
            отрицательные (одна строка неснимаемого) → отказа нет ни там, ни там
          Различие появляется только в мире «снимаемый и неснимаемый вид на одном
          проекте», которого 1-19 не строит:
            спецификация (vpc.network: 1) · мутант (storage.volumes: 1, vpc.network: 1)
          Текстовый держатель у этого условия есть (1-12 Б, третье «И»), но
          сам документ в 1-17 объявляет, что утверждается исход, а не текст.
    subject: >-
      §2.3 объявляет оба условия группировки несущими («разойдись они — отказ …
      назвал бы вид, которого удержание не касается»), §10 S1 требует исключение
      семейства «и в охране, и в группировке, чтобы вид не считался дважды». Из
      двух направлений расхождения охраны и группировки сценарии держат одно
      (пустая скобка); второе — перечень называет вид, который арендатор снять
      не может, или считает роль дважды — не краснеет нигде. По собственному
      доводу документа у 2-03: в предикате готовности без сценария это
      «обещание без держателя».
    outcomes: >-
      Один сценарий либо полоса в доме П со смешанным миром: проектная роль +
      строка зеркала iam.role + строка iam.group + строка вида без живого
      delete + строка vpc.network на одном проекте → текст дословно
      `Project P is not empty (iam.role: 1, vpc.network: 1)`. Это же «И» снять
      с 1-05 (дом К) либо оставить там только утверждаемое в мире 1-05; строку
      §2.3 перевести на нового держателя; строки оси 4 для 1-05 и 1-19 — к факту.

