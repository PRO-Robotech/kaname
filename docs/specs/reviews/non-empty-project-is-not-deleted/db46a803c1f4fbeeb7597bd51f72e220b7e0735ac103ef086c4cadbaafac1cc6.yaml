blocking_note: >-
  Ноль блокирующих — вывод, а не умолчание. Проверено по четырём осям, и по каждой
  назван предикат в `verification` ниже: у каждого «Тогда» назван производитель либо
  сказано, что он заводится этим изменением (§6: нет 10 · частично 4 · есть-но-текст-ложен 3
  · есть 6 = 23, RED 17 — пересчитано мной построчно); «Дано» каждой из 17 полос домов
  П и Р посеяно мной заново на мигрированной схеме и построилось без второго факта;
  у каждой ограниченной оси названы обе стороны; согласие с одобренными соседками
  сверено по свойству, а не по названию. Замечания ниже не блокируют: ни одно не
  оставляет свойство без держателя и ни одно не делает сценарий неисполнимым.

# ─── НЕ БЛОКИРУЮЩИЕ ────────────────────────────────────────────────────────
non_blocking:
  - id: Н1
    title: >-
      «И» в доме К, у которого в этом доме нет производителя, — тот же род, что
      второй проход снял у IAM-PNE-1-07 А (Н18), и он остался в двух местах
    where: §5.1 IAM-PNE-1-08 (строка 1862), §5.1 IAM-PNE-1-05 (строки 1706–1708)
    predicate: |
      1-08: «И операция **не создаётся**». Дом — К (§0.2в строка 270, §6.1). Кейс
      набора видит ответ края и конверт операции, а строк `kaname.operations` не
      видит — это установил сам документ, снимая ту же фразу с 1-07 А: §0.2в
      строка 267, «дом К строк операций не видит». Сверх того в доме К утверждение
      НЕ МОЖЕТ упасть отдельно от пары: синхронный `400`/`3` означает, что запрос
      не дошёл до службы, а операция создаётся строкой
      `internal/apps/kaname/api/project/delete.go`:59 (объект) и :69 (запись),
      то есть после проверки формы (:46). Мира, где пара зелена, а операция создана,
      не существует. Проверяемый признак: назови ШАГ кейса, который это утверждает,
      — у `IAM-PRJ-DL-NEG-NOTFOUND` (образец той же формы) шаг несёт ровно два
      утверждения, `tests/newman/cases/iam-project.py`:967 и :969.
      1-05: «И действующий кейс IAM-PRJ-DL-NEG-HAS-CHILDREN … краснеет». Это
      утверждение о ВЕРДИКТЕ НАБОРА, а не наблюдение этого кейса; шага, который бы
      его утверждал, у 1-05 нет. Предмет уже стоит предикатом готовности (§10 S1,
      «перепинен»), то есть у него есть дом.
    outcomes: >-
      У 1-08 — снять «И» (пара его уже держит) либо сделать ссылкой на полосу В
      1-07, где оно утверждается на базе; у 1-05 — перевести в примечание со
      ссылкой на §10. Строку оси §0.2в для 1-08 привести к тому же: сегодня она
      называет производителя только для пары.
    why_not_blocking: >-
      Свойство держится: у 1-08 его держит сама пара, у 1-05 — предикат готовности.
      Дыры нет, есть избыточное «И» не в своём доме.
  - id: Н2
    title: IAM-PNE-1-07 полоса В — отрицание без положительного близнеца в той же пробе
    where: §5.1 IAM-PNE-1-07 полоса В (строка 1841)
    predicate: >-
      «И строк `kaname.operations` после вызова столько же, сколько до него».
      Посев второго прохода дал «0 до и 0 после» (§0.2в строка 503) — то есть
      счётчик в этом мире не двигался НИ РАЗУ, и утверждение зеленеет на харнессе,
      где операции не пишутся вовсе. Это ровно тот довод, которым тот же проход
