  - id: Н3
    title: >-
      два места одного документа о снятии глагола каталога говорят разное, и одно
      обобщает прецедент шире, чем его обосновывает одобренная соседка
    where: §0.1 (строка 80) против §2.2 (строка 1180)
    predicate: |
