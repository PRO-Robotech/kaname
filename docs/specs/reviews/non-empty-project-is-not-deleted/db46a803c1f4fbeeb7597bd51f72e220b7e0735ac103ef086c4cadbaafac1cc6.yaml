  blocking_by_round: {round_1: 4, round_2: 3, round_3: 4, round_4: 2, round_5: 0}
  genus_repeat: >-
    Род прежний — производитель, — но впервые он не блокирует. Оба замечания круга 4
    закрыты ТЕМ ЖЕ опытом, которым найдены, и оба закрытия перепроверены мной на
