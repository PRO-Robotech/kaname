    К4-Б2) и пяти неблокирующих (Н1–Н5) записи-предшественницы. Каждое прежнее
    блокирующее проверено ТЕМ ЖЕ опытом, которым его нашли, и показан другой
    результат. Сверх того: производитель у каждого «Тогда», дом у каждого «Дано»,
    обе стороны каждой ограниченной оси, согласие с одобренными соседками по
    свойству, перемер чисел §0.1, §0.2в, §5, §6 собственными выражениями в трёх
    деревьях.
