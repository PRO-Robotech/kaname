    документе назван исход перемера в обе стороны.
  what_made_the_difference: >-
    Не объём правок, а смена ВХОДА работы: «Дано» каждой полосы домов П и Р посеяно
    на мигрированной схеме и у каждого «И» назван мир мутанта. Это ровно те два шага,
    которые запись круга 4 предложила перенести в форму задания
    (`class_moves_into_the_task_form`), и они исполнены.
  cycle_converges: >-
    Да: 4 → 3 → 4 → 2 → 0. Шестой круг не запускается — предмета у него нет.
  out_of_turn: false

