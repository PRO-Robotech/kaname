prior_blocking_check:
  - id: К4-Б1
    was: >-
      «Дано» IAM-PNE-1-19 в трёх отрицательных состояниях из четырёх запрещено
      схемой для названного вида vpc.network
    resolution: ЗАКРЫТ
    control_reproduced: |
      Сперва воспроизведён сам дефект — тем же посевом, что его нашёл:
        ссылок kaname.role_rule_ref на vpc.network                        6
        снять у vpc.network только delete                                 UPDATE 1
        снять ресурс с преемником (глаголы сперва)                        ERROR 23503 role_rule_ref_verb_fk
          DETAIL: Key (module, resource, verb, live)=(vpc, network, get, t) is still referenced
        убрать вид из каталога вовсе                                      тот же ERROR 23503
      То есть замечание круга 4 было верным дословно и остаётся верным на этом дереве.
    experiment: |
      Затем исполнено «Дано» НОВОЙ редакции — свой синтетический вид и свой проект на
      каждое из пяти состояний, вид заводит сама проба:
        ссылок kaname.role_rule_ref на синтетические модули               0
        состояние 2 — снят глагол delete парой live/retired_at            UPDATE 1
        состояние 3 — снят с преемником (глаголы, затем ресурс)           UPDATE 2 · UPDATE 1
        состояние 4 — снят без преемника                                  UPDATE 2 · UPDATE 1
        состояние 5 — строки удалены                                      DELETE 2 · DELETE 1
        одно `live = false` без пары                                      ERROR 23514 catalog_verb_live_matches_retired
      Каждое состояние строится ОДНИМ фактом и без правки правил ролей. Оператор §2.2
      в пяти состояниях (удалено · перечень):
        1: 0 · pns1.thing: 1    2: 0 · pns2.thing: 1    3: 0 · pns3.thing: 1
        4: 0 · pns4.thing: 1    5: 0 · pns5.thing: 1
      Мутант условия круга 4 (живой delete) удаляет проект в ЧЕТЫРЁХ несвоих состояниях
      и даёт там пустую скобку; мутант условия круга 3 (живой ресурс) — в ТРЁХ, где
      ресурс снят либо отсутствует. Положительный близнец (строка зеркала снята) —
      удаление проходит. Числа сошлись со строкой §0.2в посева дословно.
    twin_and_fifth_state: >-
      Близнец в первых четырёх состояниях и граница в пятом проверены чтением
      производителя, а не посевом Go: `resource_mirror.DeleteTx` первым оператором
      снимает строку без каталога, вторым зовёт `modelTypeName`, а тот на точечном
      имени без строки каталога возвращает `ErrUnknownResourceType`
      (`internal/repo/kaname/pg/resource_mirror/model_dictionary.go`, ветвь
      `pgx.ErrNoRows`) и ливность НЕ спрашивает — то есть в состояниях 2–4 строка
      резолвится и снимается, в состоянии 5 нет. Утверждение документа совпадает с
      кодом.
  - id: К4-Б2
    was: >-
      условия ГРУППИРОВКИ перечня не имеют держателя, способного упасть: их
      утверждения стояли в мирах, где спецификация и мутант дают одно и то же
    resolution: ЗАКРЫТ
    experiment: |
      Посеян смешанный мир IAM-PNE-1-20 дословно по «Дано»: две проектные роли,
      строки зеркала iam.role (одной из них), iam.group, iamx.thing, pnm.nodel
      (живой ресурс без живого delete), pnm.gone (снят парой), vpc.network.
      Ссылок role_rule_ref на iamx/pnm — 0. Тексты перечня:
        спецификация          iam.role: 2, iamx.thing: 1, pnm.gone: 1, pnm.nodel: 1, vpc.network: 1
        без исключения семьи  iam.group: 1, iam.role: 3, iamx.thing: 1, pnm.gone: 1, pnm.nodel: 1, vpc.network: 1
        приставка без точки   iam.role: 2, pnm.gone: 1, pnm.nodel: 1, vpc.network: 1
        условие круга 4       iam.role: 2, iamx.thing: 1, vpc.network: 1
        условие круга 3       iam.role: 2, iamx.thing: 1, pnm.nodel: 1, vpc.network: 1
        без слагаемого ролей  iamx.thing: 1, pnm.gone: 1, pnm.nodel: 1, vpc.network: 1
        роли через EXISTS     iam.role: 1, iamx.thing: 1, pnm.gone: 1, pnm.nodel: 1, vpc.network: 1
      Шесть разных мутантных текстов, ни один не совпадает со спецификацией;
      таблица §5.1 IAM-PNE-1-20 воспроизведена строка в строку. Исход у всех один
      (удалено 0) — значит различает их только перечень, как документ и говорит.
    part_a: >-
      Второе «И» IAM-PNE-1-05 («iam.role: 1, а не 2, даже если рядом лежит строка
      зеркала») с сценария СНЯТО и перенесено в IAM-PNE-1-20, дом П. Проверено
      чтением: в §5.1 1-05 его больше нет, врезка называет причину, а §2.3 (таблица
      трёх входов) называет держателем 1-20, а не 1-05.
    part_b: >-
      Исключение семейства теперь наблюдается ИСХОДОМ. Посев мира IAM-PNE-1-17:
      спецификация пропускает удаление у всех СЕМИ живых видов `iam.*`, положительный
      контроль `vpc.network` отвергает с `(vpc.network: 1)`, граница `iamx.thing` —
      с `(iamx.thing: 1)`. Мутант охраны без исключения семейства отвергает с ПУСТОЙ
      скобкой у всех семи (прежняя редакция называла шесть — пересчёт после снятия
      условия каталога верен). Разделитель: охрана без точки пропускает удаление,
      группировка без точки даёт пустую скобку, обе — пропускают.
    part_c: >-
      Третье «И» IAM-PNE-1-19 («имя вида без живого delete не печатается») снято
      вместе с условием, и сценарий перевёрнут: имя печатается во всех пяти
      состояниях. Мир, где утверждение падает, теперь есть у каждого подслучая —
      мутант условия каталога даёт там пустую скобку (посев выше).

