blocking:
  - id: K6-B1
    kind: TWIN
    where: "IAM-PNE-1-21 полоса А, положительный близнец — строка 2450; §11.7 строка 3401"
    claim: >-
      Близнец утверждает «решатель спрошен ровно один раз» для того же именованного
      субъекта без прав. Производитель этого «Тогда» на правильной форме задаёт ДВА
      вопроса: checkAdapter (internal/authzguard/own_door.go:469–489) после отказа по
      объекту спрашивает надзор SubjectIsClusterAdminPlainE (own_door.go:485 →
      cluster_admin_shortcircuit.go:99, `system_admin` на кластере). Подделка решателя
      считает оба (grantStore.asked, own_door_test.go:47). Близнец краснеет на
      правильной реализации: утверждение строже производителя.
    predicate: >-
      sed -n 469,489p internal/authzguard/own_door.go → ветвь `admin, adminErr :=
      SubjectIsClusterAdminPlainE(ctx, a.inner, subject)` после `allowed == false`.
      Действующая проба держит то же: own_door_every_gated_rpc_test.go проверяет
      `len(denyStore.asked) == 0` и берёт `asked[0]`, а не «ровно один».
    fix: >-
      Утверждать «первый вопрос решателю — о `<вид>:<значение>` с отношением записи
      каталога» (вопросов ≥ 1). Либо разрешить спрошенную тройку, как в действующей
      пробе, — тогда вопрос ровно один. Строку §11.7 привести к тому же.
  - id: K6-B2
    kind: CONSTRUCTIBILITY
    where: "IAM-PNE-1-21 полоса А, «Дано» — «именованный субъект без прав»; §11.5 строка перечня 58 глаголов"
    claim: >-
      Дом З гоняет цепочку публичного слушателя в составе композиционного корня.
      Политика вызывающего стоит раньше формы (§11.3; cmd/kaname/serve.go:1030) и
      применяет повышение ступени (internal/authzguard/public_caller_policy.go:384,
      :492, grpcsrv.EvaluateStepUp). У всех 58 глаголов класса required_acr_min ≥ 1
      (31 — «1», 27 — «2»). Освобождён только машинный субъект (corelib@v1.15.0
      grpcsrv/acr.go:181). Человек без уровня получит отказ повышения ступени до
      формы на каждом из 58 глаголов: ни отказа по форме, ни близнеца «решатель
      спрошен». Фикстура, названная §11.5 образцом (TestOwnDoor_EveryObjectScopedRPCRefusesAStranger),
      заводит именно человека: tenantCtx → Principal{Type:"user"}, own_door_test.go:59.
      Эта проба собирает одну дверь, без политики вызывающего, поэтому там это верно,
      а в доме З — нет.
    predicate: >-
      jq по internal/apps/kaname/seed/embedded/permission_catalog.json (отбор §11.2 без
      Internal) | .required_acr_min → 31×"1", 27×"2", 0×"0" @092bee4fb.
    fix: >-
      В «Дано» назвать вид субъекта: служебная учётка (машинный принципал, освобождён
      первой ветвью EvaluateStepUp) — как jwtAccountAdminA у 1-08. Либо человек с
      доверенным уровнем ≥ required_acr_min каждого глагола. В §11.5 назвать писателя
      этого субъекта в пробе.

non_blocking:
  - id: K6-N1
    kind: FORMAT
    where: "§11.2 строка 3276; §11.4 строки 3361, 3362"
    claim: >-
      «64 строки, имён 7» не воспроизводится командой самого документа @092bee4fb:
      `git grep -h 'shared.ValidateResourceID(' -- 'internal/apps/kaname/api/**.go'
      ':!*_test.go' | wc -l` → 62. Литеральных имён 8: account 19 · user 10 · group 7
      · service account 7 · project 6 · role 6 · access binding 5 · grant delegation 1.
      Таблица §11.3 на 7 видов двери верна. Число и «64 обработчиков» исправить.
  - id: K6-N2
    kind: CONVENTION
    where: "дом З, §0.2в; §11.7 «код»"
    claim: >-
      Цепочку публичного слушателя корень собирает по месту (serve.go:1018–1037).
      Проба «в том составе и порядке, в каком её собирает корень» без общего
      конструктора была бы второй проводкой — дверь сама предупреждает об этом
      (own_door.go, godoc OwnDoor). Это условие к коду, а не к приёмке (fa-b2), —
      передать замыслу или go-implementer: один конструктор цепочки на корень и пробу.
  - id: K6-N3
    kind: COVERAGE
    where: "IAM-PNE-1-21 полоса А"
    claim: >-
      AuthorizeService/BatchCheck входит в 58 и одновременно в CallerAuthorityGatedMethods
      (own_door.go:229). Безымянного вызывающего и пустое scope_id дверь отдаёт
      обработчику (own_door.go:375–381). Класс держится только при названном субъекте и
      непустом поле. Действующая проба BatchCheck исключает — построитель запроса
      придётся расширить. Полезно сказать это строкой в §11.5.
  - id: K6-N4
    kind: DoD
    where: "§11.7 «сквозной прогон»"
    claim: >-
      «при названных числах запросов и утверждений» — чисел в документе нет. Пусть
      отчёт посадки назовёт их, иначе «0 упавших» неотличимо от «0 исполненных».

