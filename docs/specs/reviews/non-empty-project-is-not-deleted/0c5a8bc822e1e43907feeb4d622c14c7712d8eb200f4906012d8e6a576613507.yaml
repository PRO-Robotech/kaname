blocking_of_previous_round:
  - id: K6-B1
    kind: TWIN
    status: resolved
    evidence: >-
      Близнец полосы А (строки 2462–2470) утверждает «первый вопрос — об объекте
      `<вид>:<значение>` с отношением записи каталога, ответ не INVALID_ARGUMENT»,
      число вопросов не утверждает. Производитель — checkAdapter.Check
      (internal/authzguard/own_door.go:469–489): объект спрашивается первым, надзор
      SubjectIsClusterAdminPlainE — только после отказа (:485). Подделка «не разрешает
      ничего» — первый вопрос всегда об объекте, поэтому утверждение выполнимо на
      верной реализации. Близнец на правильной форме зелен и сегодня (дверь есть),
      отрицательный кейс сегодня красный; отличие ровно одним фактом — формой. «ровно один раз» в документе осталось только в
      таблице §11.10 как цитата прежнего (`grep -n 'ровно один раз'` → 1 строка, 3473).
      Строка §6 и §11.7 приведены к тому же.
  - id: K6-B2
    kind: CONSTRUCTIBILITY
    status: resolved
    evidence: >-
      «Дано» называет служебную учётку, предъявленную удостоверением. Цепочка
      публичного слушателя (cmd/kaname/serve.go:1018–1037): publicIdentityUnary →
      publicCallerPolicy → addressGate → AntiAnonymousUnary → дверь. Политика на
      ветви предъявленного (public_caller_policy.go:343–398) зовёт EvaluateStepUp,
      который машинного субъекта освобождает первой ветвью (corelib@v1.15.0
      grpcsrv/acr.go:181). Ворота адреса — admission.ID (internal/admission/admission.go:86–99):
      `!person || verified` — при пустом ответе PersonMarks проход. Аноним-рубеж
      названного не останавливает. Писатель — chainMint
      (cmd/kaname/presented_credential_chain_test.go:86, extra переопределяет
      ClaimPrincipalType/ClaimPrincipalID), PersonMarks → пустая карта (:70).
      Образец прохода порога машинным принципалом в боевой цепочке есть:
      TestF11_50 (cmd/kaname/step_up_indication_test.go:194–196, newStepUpStand :69–76 —
      NewPublicCallerPolicy(true, …) над publicIdentityUnary).

