blocking:
  - id: Б1
    kind: CONSTRUCTIBILITY
    title: FP-11 не строится и красен при любом продукте
    evidence: >-
      Часы харнесса только вперёд (`avClock.Advance`, address_verification_harness_integration_test.go:97).
      FP-11 гонит на одной S сперва FP-03 (а) — часы t₀+W+1с, — затем FP-01, чьё «Дано» требует
      свежей S (t₀+1мин): FP-01 получит SESSION_NOT_FRESH. Кроме того, «And» FP-01 и FP-02 содержат
      вход неверным паролем (401), который по Р10/Ф3-28 увеличивает счёт, — «Тогда» FP-11
      («счёт равен снятому до») опровергается самим сценарием.
    fix: Назвать точные запросы FP-11 (только «Когда» глагола заведения), свежую сессию на каждый шаг либо порядок без перевода часов, без входов неверным паролем внутри прогона.
  - id: Б2
    kind: CONSTRUCTIBILITY
    title: FP-07 (в) помечен I, но харнесс I не имеет дублёра базы утечек
    evidence: >-
      avLane строит правило с Breach=nil (address_verification_harness_integration_test.go:190),
      а Judge при nil не проверяет утечки (password_rule.go:93) — отказ RuleBreached недостижим.
      Дублёр авторитета есть только в U-харнессе (usecase_test.go:111).
    fix: Назвать фикстуру — FP-07 (в) на уровне U (харнесс usecase_test.go) либо опцию avLane с дублёром.
  - id: Б3
    kind: DoD
    title: DoD не содержит прогона сквозного кейса
    evidence: >-
      §7 п.4 требует лишь validate-cases, строку индекса и пересборку коллекции FP-12; ни один пункт
      не требует исполнения FP-12 на стенде и не называет допустимый исход до посадки входа ключом
      (Ф13), хотя FP-12 «And» сам объявляет «условие не создано».
    fix: Пункт DoD — прогон FP-12 на стенде зелёный; до посадки входа ключом — исход «условие не создано» с предикатом снятия (путь входа ключом на полосе, §1.1 последняя команда → ≥1), и задача не закрывается на нём.

