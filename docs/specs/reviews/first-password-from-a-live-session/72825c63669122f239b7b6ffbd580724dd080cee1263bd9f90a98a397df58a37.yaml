non_blocking:
  - >-
    FP-12 «Дано»: личность БЕЗ пароля с ключом на стенде продуктом не строится (регистрации
    ключом не будет — kacho#2703; снятия строки «пароль» глаголом нет); Ф13 §5 преамбула строит
    её ЗАПИСЬЮ, а исполнимость на стенде несёт Ф13 DoD п.9 (Ф13-19 в наборе). Назвать это в
    «Дано» FP-12 ссылкой на преамбулу Ф13 §5 и Ф13 DoD п.9 и добавить в предикат снятия §7 п.5
    второе условие — посев стенда «личность без пароля с ключом» существует; иначе после
    посадки пути входа ключом исход «условие не создано» останется, а предикат скажет «снят».
  - >-
    Посев I: на базе (до реализации) `lane.csrf(... "password-enroll")` требует 200
    (handler_test.go:300) и падает на закрытом перечне видов — это красное продукта (новый вид
    Р1), но падает в «Дано». Для DoD п.1 («красный по каждому FP, не "не выполнилось"») лучше
    брать признак свёрткой `humansession.FormToken` (как avLane.token) и ставить ступень
    ВОЗМОЖНОСТИ после мира, по форме харнесса avLane.
  - >-
    FP-09: порядок внутри «Дано U» — сессия выдаётся ДО установки failOn = "audit"
    (IssueSession с событием упал бы на посеве). Сказать явно. Дублёр fakeWriter не несёт
    InsertLoginMethod — его заведение в харнессе разрешено §0.2, стоит назвать.
  - >-
    Р6/FP-01: «той же формы, что Ф3-01» при теле `{"session": {...}}` — у Ф3-01 тело несёт и
    `user` (Ф13-05 цитирует `{"user", "session"}`). Назвать ключи верхнего уровня дословно.
  - >-
    Р5 «момент последнего предъявления не меняется» — ни один сценарий его не утверждает;
    добавить в FP-01 «And» сверку last_presented_at S до/после.

