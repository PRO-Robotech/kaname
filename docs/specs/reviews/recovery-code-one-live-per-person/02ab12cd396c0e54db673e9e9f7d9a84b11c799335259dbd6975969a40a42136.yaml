closure_of_round_2:
  - kind: CONSTRUCTIBILITY
    item: RCL-03 — «requireHoldSceneBuilt возвращает 0» недостижимо
    status: closed
    evidence: >-
      Ссылка на счёт ждущих как производитель «0» снята из сценария и из таблицы производителей.
      Независимость утверждается производимым наблюдаемым: исход P2 (queuedRecoveryObserver)
      при пустом канале исхода P1 и чтение recovery_codes вне транзакций. Сцена исполнима:
      триггер задержки — FOR EACH STATEMENT (force_logout_concurrent_teardown_integration_test.go:303-304
      @c032a0274), то есть срабатывает и на DELETE нуля строк у P1 без кода; однократность —
      nextval(_seq) <> 1 → RETURN NULL (стр. 282-284), поэтому DELETE запроса P2 проходит
      без задержки; ключевой замок P1 строку P2 не трогает (recovery_request.go, write).
      Задержка с явным отпуском в линии отсутствует и честно названа заказом полосе kaname#776
      (armOneShotHold: require.Positive(want), стр. 314), DoD п. 1 её требует.
  - kind: FORMAT (важное)
    item: RCL-05 When — видимость зафиксированного состояния
    status: closed
  - kind: COVERAGE (важное)
    item: RCL-02 — детерминированное построение сцены
    status: closed
    evidence: >-
      Посев c0 (seedWithLiveCode, recovery_request_lock_order_integration_test.go:123) и want = N − 1.
      На origin/746 PersonWriter — ключевой замок, совместимый между запросами, поэтому N − 1
      прочих ждут строку c0 под DELETE первого (ожидание вида Lock) — сцена строится; после
      отпуска каждый вставляет свой код — красное до правки (DoD п. 1). После правки прочие ждут
      замка личности — сцена строится так же.
  - kind: DoD (важное)
    item: п. 4 — последняя миграция линии названа командой
    status: closed
    evidence: >-
      git ls-tree -r --name-only origin/746 -- internal/migrations | grep '\.sql$' | sort | tail -1
      → 20261015100100_second_factor_method_carries_its_last_use.sql (совпадает с документом).

non_blocking:
  - kind: TWIN
    item: >-
      RCL-03 объявлен близнецом RCL-02 с одним отличающим фактом (личности), но после дельты
      сцены различаются ещё посевом c0, N и видом задержки (счёт ждущих против явного отпуска).
      Различие вынуждено (want ≥ 1 при нуле ждущих невыполнимо), контроль «сериализация есть
      у одной личности» сохранён — не блокирует; формулировку «отличающий факт один» уточнить.
  - kind: FORMAT
    item: >-
      RCL-02 When: «requireHoldSceneBuilt вернул N − 1» — функция возвращает число ждущих замка
      по всей базе, не меньше want (стр. 289-291, 360); в таблице это сказано верно, в When
      писать «не меньше N − 1».
  - kind: DoD
    item: >-
      п. 4: «20261015120000 (ветка 829)» — на origin/829 этой миграции нет (со слов автора,
      git ls-tree -r --name-only origin/829 -- internal/migrations), она только в локальной
      829-impl. Порог не ложен (условие «позже обеих» безвредно), координату ветки уточнить.

