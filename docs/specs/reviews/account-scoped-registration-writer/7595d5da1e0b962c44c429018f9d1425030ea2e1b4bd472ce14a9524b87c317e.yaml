  required_983_compatibility: Сохранить PB mandatory parentProjectId/parentChain, постоянную привязку
    и OBJECT_BOUND_TO_OTHER_PROJECT precedence. Для известного повторного Unregister после удаления зеркала
    использовать постоянную привязку при разрешимом проекте; потерянная область даёт PD.
  required_read_reuse: Account authority питается результатом admitRegistration/deriveParent. Повторный
    обход ProjectAccountTx/ContainerScopeTx/PointerSubjectsTx ради проверки запрещён; registration_audit/backfill
    переиспользуют вывод; один registration pool и отдельный checker pool проверяются разрешённым внешним
    прогоном.
  intentional_public_proto_change: UnregisterResourceResponse сейчас обещает OK для отсутствующего tuple.
    Одобренное сужение разрешает повтор только с разрешимой сохранённой областью; unknown/lost scope =>
    PermissionDenied без tombstone. Обновить proto комментарии и generated docs, RPC поля не добавлять.
  publication_and_execution: APPROVED означает независимое статическое одобрение точного digest. event
    остаётся not_performed/published:false до реального события; runtime_executed=0 не менять без отдельного
