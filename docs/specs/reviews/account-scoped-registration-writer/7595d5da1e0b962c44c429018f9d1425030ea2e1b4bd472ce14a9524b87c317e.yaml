source_checks:
- 'Issue #1031 and three current comments: complete account-scoped writer, V3(a), no delegation axis;
  second subphase remains explicit.'
- 'derive_parent.go admitRegistration/deriveParent/hierarchyOf and #982 R4-R12: canonical account comes
  from existing hierarchy reads; policy order, claims validation, multiple matching pointers, PB precedence
  preserved.'
- '#983 R2-R5 and approved digest: mandatory project fields, permanent binding and project-deletion residue
  preserved; publication does not newly require client-supplied project.'
- internal_iam_service.proto:509-510 unconditional absent-tuple OK is intentionally narrowed in section
  2.2(5); section 5(6) orders proto/generated comment update; known permanent scope retry remains allowed.
- authzguard/fgaproxy.go identity roster and RelationChecker; authzguard/authzguard.go:86-87 confirms
  exact UNAVAILABLE/authz backend unavailable; no cluster fallback or admin derivation.
- 'register_resource.go Register/Unregister/publish/emitAttempt plus registration_audit.go: all paths
  and fast paths covered; audit refusal is separated from forbidden access-state effects; existing duplicate
  hierarchy reads are explicitly to be reused.'
- pg/access_binding_repo.go named-relation writer, guarded revoke/delete and deletion protection; access_binding/revoke.go
  persisted emitted set and same-transaction relation fact removal; system grant integration test read
  only; proto access_binding.proto:235 supports granted_relation reads.
- Bootstrap finite account/module assignments use existing roster/module SA, named-relation AccessBinding,
  persisted application identity, no wildcard/future-account enrollment; invalid batch, revocation, removed
  pair, restart and explicit reassignment covered.
- Upgrade/rollback requires explicit inventory/operator exclusion, mixed-version ingress closure, forward-only
  migration and no restored blanket grant; clean install and revoke restart part of criteria.
- DoD retains both cross-account and lawful production mTLS twins on exact same SHA, full touched access-domain/DP/PB
  sets, direct usecase, seed/revoke and model drift checks; no two-test substitute.
implementation_attention:
- Saved-scope resolver must actually use permanent binding when mirror/pointer facts are gone; registrationHierarchy
  currently only reads live pointer facts and is not sufficient unchanged.
- A successful bootstrap removal means guarded lifecycle and emitted-set removal, not deleting an AccessBinding
  row; privileged deletion-protection clear must remain limited to owned assignment.
- Preserve false/omitted/empty bootstrap distinctions and avoid letting first-upgrade census become a
  restart gate after an intentional revoke.
