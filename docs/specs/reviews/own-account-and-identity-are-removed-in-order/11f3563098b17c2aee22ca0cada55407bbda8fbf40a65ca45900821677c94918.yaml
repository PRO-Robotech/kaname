blocking:
  - kind: PRODUCER
    scenarios: [KN664-19]
    defect: >-
      Повтор DELETE /iam/v1/accounts/{A} от U после успеха ожидает 404 «Account A not found». Перед
      проверкой существования в use-case стоит дверь службы: Delete несёт required_relation
      v_delete на account, скрытия существования у Delete нет (HidesExistenceOnDeny — только Get+v_get
      либо явная запись), путь ErrNoPath собственная дверь не производит (checkAdapter). После
      дренажа выдачи владельца у U нет v_delete → 403 PERMISSION_DENIED «permission denied»; 404
      возможен лишь в окне положительного кэша вердикта. Производитель «Тогда» назван неверно.
    evidence: >-
      proto/kaname/cloud/iam/v1/account_service.proto:107-119; corelib@v1.11.0 authz/hide_existence.go:171-179,
      authz/interceptor.go:429-512; internal/authzguard/own_door.go:466-491
    fix: >-
      Повтор — от администратора облака (короткое замыкание → обработчик → 404, как KN664-42) либо
      утверждать 403 code 7 для U после дренажа; окно кэша назвать.
  - kind: PRODUCER
    scenarios: [KN664-20, KN664-40, KN664-41]
    defect: >-
      Набор исходов гонки не замкнут: «ровно один из двух» покраснеет на законном прогоне.
      KN664-20 — ProjectService.Create гейтится editor на account (project_service.proto:66-69);
      после дренажа снятия Create отвергается синхронно 403, третьим исходом. KN664-40 — после
      снятия U отсечка (Р5) даёт синхронный 401 на AccountService.Create, а «Тогда» говорит лишь
      «ошибкой». KN664-41 — форма приглашения не названа: приглашение с ролью заводит выдачу
      (invite.go: «optional AccessBinding»), и снятие отвергнется «has active access bindings» —
      исход, которого в списке нет.
    fix: >-
      Перечислить каждый допустимый исход с кодом (включая синхронные отказы двери и отсечки),
      утверждение инварианта оставить; в KN664-41 назвать приглашение без роли либо добавить исход.
  - kind: CONSTRUCTIBILITY
    scenarios: [KN664-34, KN664-36]
    defect: >-
      Given KN664-34 («выдача в B уже отозвана администратором B») и положительный близнец KN664-36
      («после отзыва выдачи … завершилась успешно») не строятся публичным глаголом отзыва:
      AccessBindingService.Revoke (:revoke) СОХРАНЯЕТ строку со status='REVOKED' (RevokeGuarded),
      истечение — тоже (RevokeExpiredBinding), а охрана userWriter.Delete считает любую строку
      access_bindings с subject_id=U без фильтра по статусу. Итог — снятие отвергнуто «has active
      access bindings», хотя выдача не активна; близнец красный, текст отказа лжёт.
    evidence: >-
      internal/repo/kaname/pg/user_repo.go:762-772 (NOT EXISTS без status);
      internal/repo/kaname/pg/access_binding_repo.go:836-860 (RevokeGuarded удерживает строку);
      proto/kaname/cloud/iam/v1/access_binding_service.proto:411-412
    fix: >-
      Решить и записать в §3: либо охрана снятия личности считает только не-REVOKED выдачи
      (согласно тексту «active»; оставшаяся REVOKED-строка — историческая мягкая ссылка, как
      атрибуция Р4) с производителем и пробой, либо назвать в Given/близнеце именно
      AccessBindingService.Delete и сценарий «отозвана Revoke → всё ещё отказ».
  - kind: FORMAT
    scenarios: [KN664-03, KN664-15, KN664-30, KN664-40, KN664-43]
    defect: >-
      «Тогда» без конкретного исхода: KN664-03 «ошибкой, называющей причину» — текст не назван;
      KN664-15 «завершилась с ошибкой» — нет error.code/message; KN664-30 «отказ аутентификации» /
      «отказ входа» — нет пары HTTP+code; KN664-40 «ошибкой»; KN664-43 «текст … действующий» — не
      назван (invalid <res> id '<X>').
    fix: Назвать код и текст (пару для синхронных) в каждом.

