    note: >-
      Р5 теперь обещает отказ «не позже окна отзыва после фиксации» и называет два исхода:
      принятый до снятия — после окна; впервые предъявленный после фиксации — сразу. Оба
      производятся читателем: presentedcred/reader.go revoked кеширует только «не отозван» по
      ключу самого токена (verdictKey(raw)) на RevocationCacheTTL, отрицательный не кеширует,
      промах идёт в tokenrevocation.Revoked, где отсечка включающая (rule.go: !issued.After(cutoff)).
      KN664-30 (два токена: принятый — после окна; не предъявлявшийся — сразу), KN664-35 и KN664-50
      предъявляют после окна; общие предусловия §4 определяют «после окна» и прямо не утверждают
      исход внутри окна. KN664-40 (б)/(в) названы по исходу предъявления, (в) явно включает «после
      фиксации внутри окна», набор замкнут, проба различает по исходу, а не по моменту. §5: строки
      KN664-40 (в) в окне и KN664-30/32/35/50 (токен) несут окно и координаты; DoD п.4 — управляемые
      часы плюс «не предъявлявшийся — сразу».
