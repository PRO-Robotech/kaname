important:
  - kind: PRODUCER
    scenarios: [KN664-44, KN664-45, KN664-49]
    note: >-
      §5 называет производителем отказа только край («до пересылки службе»), а держатели DoD 7
      (newman службы, baseUrl — фронт службы) и DoD 11 (интеграционная) исполняются на поверхности
      службы. Там отказ производят internal/authzguard/public_caller_policy.go (stepUpRequired →
      Unauthenticated + iamerr.TextStepUpRequired, порог из копии каталога службы) и
      internal/restfront/stepup.go (401 + вызов), а на полосе пересланной краем личности — второй
      замок acr_floor.go с 403/7 authz.step_up. Рекомендую назвать эти производители в §5 и сказать,
      что интеграционная проба идёт полосой предъявленного удостоверения, иначе она утвердит форму
      второго замка, которую документ отверг. Не блокирует: форма на фронте службы та же
      (401/16/вызов), а производитель её существует и краснеет до правки каталога.
  - kind: FORMAT
    scenarios: [KN664-18, KN664-44, KN664-45, KN664-49]
    note: >-
      «Текст — по Р11» производится сегодня только службой (TextStepUpRequired); край @bac26316c4
      отдаёт message "insufficient_user_authentication" (auth_stepup.go stepUpDenyMessage), текст
      края — сторона края kaname#511. Стоит сказать, на какой поверхности утверждается текст, либо что
      на крае до kaname#511 утверждаются пара и параметры вызова без текста.
  - kind: CONSTRUCTIBILITY
    scenarios: [KN664-44]
    note: >-
      Образец интеграционного посева назван неверно: Ф11-16 — сквозная проба стенда (уровень сессии
      читает край из хранилища службы), в интеграции службы края нет. Действующая фикстура
      интеграционного уровня — cmd/kaname/step_up_indication_test.go (s.mint(jwt.MapClaims{"acr":"1"}),
      TestF11_49 / TestF11_50, близнец acr "2"); сквозной образец — CAP-08 в
      tests/newman/cases/kaname-cluster-admins.py (держатель уровня 1 на стенде).
  - kind: CONVENTION
    note: >-
      fa-b7: соседняя приёмка assurance-level-is-declared-by-our-session.md цитируется (Р11, Ф11-01,
      Ф11-16) без отпечатка; её текущая шапка — DRAFT без вердикта, одобрена была редакция 9
      (tests/newman/cases/kaname-cluster-admins.py:28). Закрепить ссылку на одобренную редакцию и
      её отпечаток.

