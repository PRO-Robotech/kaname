constructibility:
  method: >-
    Postgres 16 в контейнере (снят после посева), схема накатана мигратором службы
    (go run ./cmd/migrator up → 20261007150000). Посев: аккаунт B; люди U, N, V, W (PENDING);
    группа G, сервисный аккаунт SA; выдачи: U — REVOKED; N — ACTIVE; V — второй субъект
    REVOKED-выдачи; W — второй субъект ACTIVE-выдачи; G и SA — по одной REVOKED. Затем оператор
    снятия в форме userWriter.Delete до и после условия Р10, CREATE OR REPLACE функции
    principal_not_referenced_as_subject с условием revoked_at IS NULL, реестр issued_user_ids
    (AFTER INSERT, без ON CONFLICT, по образцу issued_account_ids) и оператор в форме InsertPending.
  seeded: 9
  of: 9
  not_executed: 0
  observed:
    - до Р10 снятие U (только REVOKED) и V (второй субъект REVOKED) → deleted=0 (§0.9 подтверждён)
    - после Р10 U → deleted=1, V → deleted=1 (KN664-46, 47); N → 0, W → 0 (близнецы KN664-36, 47)
    - функция триггера после Р10 — простое снятие W отвергнуто текстом стража; V снимается
    - G и SA с одними REVOKED-выдачами снимаются; обе REVOKED-строки пережили субъект (KN664-48)
    - реестр — InsertPending с id живого человека по его почте → ветвь ON CONFLICT, inserted=f, без отказа (KN664-41 (а))
    - тот же оператор с id снятого U → 23505 issued_user_ids_pkey (KN664-41 (в))
    - снятый U, свежий id, почта U → inserted=t (KN664-41 (б))
  scope_note: >-
    Посев — уровень базы. Уровень двери, предъявления и края (KN664-19, 20, 30, 35, 40, 43, 50)
    судится чтением производителя.

blocking:
  - kind: PRODUCER
    scenarios: [KN664-30, KN664-35, KN664-40, KN664-50]
    decisions: [Р5]
    defect: >-
      Р5 утверждает: удостоверение, выпущенное личности до момента снятия, на предъявлении
      отвергается «независимо от того, успела ли доставка». Производитель отказа —
      presentedcred.Reader, а у него положительный вердикт об отзыве кешируется на
      RevocationCacheTTL, и этот срок объявлен окном отзыва (presentedcred/reader.go, поле Config;
      config/presented_credential.go:47-54, 111-116). Токен, предъявленный до снятия (его
      принимают Given KN664-30 и близнец KN664-31), в пределах окна после снятия принимается.
      Значит последнее «Тогда» KN664-30, «Тогда» KN664-35 и «удостоверения U отвергаются»
      KN664-50 одним исходом сразу после снятия не производятся; проба, написанная по тексту,
      зелена или красна в зависимости от момента предъявления. В KN664-40 набор остаётся
      замкнут, но метка исхода (б) «пришло после фиксации — 401» неверна: в окне кеша создание
      после фиксации проходит предъявление и даёт (в). Соседняя одобренная приёмка
      subject-cutoff-writes-both-records-under-one-lock.md эту оговорку несёт («срок кеша истёк, и
      токен предъявлен»), этот документ — нет.
    evidence: >-
      internal/presentedcred/reader.go (RevocationCacheTTL «он же объявленное окно отзыва»,
      ErrCacheTTLRequired); internal/apps/kaname/config/presented_credential.go:47-54;
      cmd/kaname/serve.go:911
    fix: >-
      В Р5 заменить «независимо…» на «не позже окна отзыва (RevocationCacheTTL) после фиксации,
      независимо от доставки модели прав». В KN664-30, 35, 50 предъявлять после окна (управляемые
      часы в интеграционной пробе либо ожидание окна в сквозной); в KN664-40 переименовать
      условия (б)/(в) на «предъявление отвергнуто / принято», тексты не трогать. Строку §5
      производителя дополнить окном.

