checks:
  fingerprint_match: true
  scope: >-
    Совпадает с kaname#385: решение о границе записано (§3), проба при любом порядке старта
    (05) с упорядоченными половинами (01–04) и контрольными руками, падающие до правки — §6
    п.5. Over-scope нет: третий выдающий глагол (завершение восстановления) и перепись #382
    вынесены в §2 с признаком и предикатом снятия. Under-scope нет.
  producers: >-
    Все 10 сценариев (15 половин) имеют строку в §5 с координатой; «заводится» — у каждого
    производителя, которого в дереве нет. Таблица инъекций выведена независимо, 196 клеток из
    196 совпали с документом. Отдельно проверены клетки, которые в ред. 4 поменялись или
    зависят от тонкостей замков. (а) «не сравнивается» × 06 — красная первой половиной.
    (б) «строгое» и «в памяти» × 05 — по жребию: m и T берутся часами процесса до сводного
    старта. (в) «запись фактора» × 10/2 — красная: код зафиксирован своей транзакцией до
    ошибки захвата, повтор отказан. Та же строка × 09/2, 09/3 — зелёные: в транзакции выдачи
    строк фактора нет. (г) «после вставки» × 05 — зелёная. Захват `FOR SHARE` после вставки
    либо встаёт раньше замка снятия (тогда снятие ждёт и видит запись), либо ждёт фиксации
    выхода и читает его отсечку. Цикла ожиданий нет: `FOR NO KEY UPDATE` с ключевым замком
    вставки совместим. (д) «ключевой замок» × 09/2 — зелёная: `FOR KEY SHARE` конфликтует с
    `FOR UPDATE` удаления, и это же показывает контроль 09/1 посева §0.11. (е) «строки нет
    как отсечки нет» × 09/3 — красная: выдача доходит до записи фактора на исчезнувшем наборе
    и растит клетку отказа второго фактора, а не `no-row`.
  twins: >-
    Без изменений против круга 3. Отрицаний 10, близнец назван у 10 из 10, каждая пара
    отличается одним фактом. Новое определение «тот же один отказ» (§4, строки 682–683) пары
    не меняет: побайтовое равенство утверждает только 06.
  constructibility: >-
    В этом круге посев не ставился. Ред. 4 не добавила ни одного «Дано»: она поменяла
    предсказания, назвала формы инъекций и определила «тот же один отказ». Формы инъекций —
    правки кода полосы, а не состояние, запрещённое схемой. Посевы, на которые опирается
    редакция (§0.10–0.12, §0.14), сняты на дереве f4c6537ac. Нынешнее дерево от него
    отличается только документами. Поэтому посев круга 2 остаётся в силе: 4 «Дано» из 15 и
    семь строк вывода места захвата в §0.14, по три раунда каждая. 11 «Дано» строятся
    названными фикстурами (newSessionLane, seedAccountMember, LoginMethodRepo.Create,
    enrolledSecondFactor, обёртка Store по форме KN-SER-05, UpsertCutoff), все они в дереве
    есть. Опровергнуто 0.
  dod: >-
    Пп. 0–11 измеримы. П.1, п.2, п.3, п.4 перепрогнаны на 94d090781 и дают названные
    «сейчас». П.5 согласован с §0.14 и с «До правки» каждого сценария. П.10 судит 13
    столбцов по каждой клетке каждой строки; противоречий между таблицей, ключом, абзацами под
    ней и 14 пунктами п.10 нет. Зелёные клетки предсказаны верно во всех строках.
  open_questions: none
  conventions: >-
    Без изменений против круга 3: ban #5, #6, #9, #10, #12 не тронуты; ответы 401 и 503 —
    таблица края; схема и проводной контракт не меняются (пп. 1, 2).
  disclosure: >-
    Предмет — правдивость записи и ответа входа и порядок замков, а не доступ: край
    отсечённую сессию не пускает (§1.2). Связки «координата + условие + следствие» дефекта
    защиты нет ни в документе, ни в этой записи.
  kind_repeat: >-
    Блокирующих по кругам: 3 → 1 → 1 → 0. Род DoD, блокировавший круги 2 и 3, закрыт так, как
    §14а велит закрывать класс: не клеткой, а формой. Под таблицей теперь стоят форма каждой
    строки и ключ вывода каждого столбца, и таблицу можно вывести заново, а не только
    вычитать.

