blocking_findings:
  - id: B1
    kind: CONSTRUCTIBILITY
    where: KN-OVL-09 (09/1, 09/2); §4 «Общее», п.1; §6 пп. 5, 10
    text: >-
      «Дано» KN-OVL-09 требует удалить личность P писателем полосы удаления. По общей
      посылке §4 P заведена регистрацией полосой пароля. Такая личность не удаляется.
      Зеркало регистрации (user/mirror_tx.go:90-117, вставки :222, :254) кладёт личный
      аккаунт с P владельцем и две привязки с P субъектом. Первая из них с
      DeletionProtection. `UsersW().Delete` (pg/user_repo.go:812-851) отвергает строку
      охраной NOT EXISTS по привязкам и отвечает FAILED_PRECONDITION, строки не беря.
      Значит «удаление стоит на замке» не наступает, а «удаление зафиксировано; личности P
      нет» не наступает вовсе. Сосед, взятый формой, пишет это прямо
      (force_logout_identity_deletion_race_integration_test.go:54-56: «Владелец аккаунта не
      удаляется вовсе») и удаляет не владельца. ПОСЕВ (стенд newSessionLane, testcontainers
      Postgres, дерево f4c6537ac, проба не закоммичена): у P, заведённой регистрацией,
      bindings-as-subject=2 и accounts-owned=1. `Delete(P)` → «failed precondition: User …
      has active access bindings and cannot be deleted». Контроль — не-владелец в том же
      аккаунте: `Delete` → nil.
    required_change: >-
      Для KN-OVL-09 назвать и посеять другую личность: не-владельца без привязок в чужом
      аккаунте, как seedAccountMember. У неё строка пароля заведена писателем продукта, а
      второй фактор — глаголами Ф12 после входа полосой. Сказать, что общая посылка §4 для
      09 не действует и S0 у этой личности нет. Посев показать выводом. Пересчитать §6 пп.
      5, 10 и строку 2 таблицы под §5 на этой фикстуре.
  - id: B2
    kind: COVERAGE
    where: Р1, Р4 (последняя позиция «Сравнение — в варианте использования входа»); §4 «Общее» («момент усечён до микросекунды»); KN-OVL-07
    text: >-
      Край судит пару в разрешении хранилища. Отсечка отдаётся неусечённой
      (session_cutoff.go:95-103), момент аутентификации — из строки (resolve.go:100). В
      строку момент входа ложится усечённым до микросекунды: pgx v5 при записи отбрасывает
      наносекунды, InsertSession (human_session_repo.go:383-389) момент не нормирует. Боевые
      часы входа — time.Now (cmd/kaname/loginlane.go:464), у них наносекунды. Р4 ставит
      сравнение на значение часов в памяти. Реализация «m.After(отсечки) — выдать» пройдёт
      все девять сценариев, потому что §4 подаёт часы уже усечёнными. Но когда m и T стоят
      в одной микросекунде, она выдаст сессию, которую край отвергнет: в строке m станет
      равен T. Это то самое несогласие записи с краем, которое запрещает Р2, на той самой
      включающей границе, которую документ держит. ПОСЕВ (тот же стенд): X = …00.000005Z,
      m = X + 500 нс. Записано и прочитано …00.000005Z. m.After(X) = true, записанное.After(X) =
      false. Прецедент понимания разрешения в дереве уже есть: восстановление выдаёт на единицу
      разрешения позже своей отсечки (recovery_complete.go:264-269), а выход датирует отсечку
      на единицу разрешения раньше первой аутентификации (logout.go:117-140).
    required_change: >-
      В Р1 и Р4 назвать разрешение сравнения: сравнивается значение, которое ляжет в
      authenticated_at. Либо момент входа усекается до разрешения хранилища до сравнения и до
      выдачи, либо сравнение идёт в этом разрешении. Завести сценарий KN-OVL-07/3: отсечка
      дверью записи = X (целая микросекунда), часы входа дают X + 500 нс. Тогда тот же
      один отказ, входом ничего не записано, клетка `before-cutoff` +1. Близнец — 07/2
      (отсечка ниже, вход 200), отличие одно — где момент входа внутри микросекунды. В
      таблицу под §5 добавить строку «сравнение по значению часов в памяти» → краснеет 07/3.
  - id: B3
    kind: NEGATIVE
    where: Р3, Р4 («Захват — отдельная операция писателя сессии»); §4; §5
    text: >-
      Изменение заводит операцию, которая берёт строку личности и отвечает стоящей
      отсечкой. У операции есть исход отказа: ошибка хранилища, отмена, обрыв. Документ этот
      исход не называет, и ни один сценарий его не утверждает. Реализация, которая считает
      отказ чтения за «отсечки нет» и выдаёт, зелена на всех девяти сценариях. Она выдаёт
      сессию, отсечку которой не прочла, то есть оставляет в записи тот же разлад, что
      предмет документа. Контракт должен закрываться при отказе на мутации, чек-лист
      требует исход UNAVAILABLE. У входа он уже есть: ErrStoreUnavailable → 503
      `UNAVAILABLE` (handler.go:885-886), клетка `store-failed`.
    required_change: >-
      В Р3 или Р4 записать исход отказа операции захвата и чтения: 503 `UNAVAILABLE`, клетка
      `store-failed`, транзакция выдачи откатывается целиком (нет записи сессии, нет события
      выдачи, нет следа попытки, код второго фактора не потреблён), `before-cutoff` не растёт.
      Завести сценарий: обёртка хранилища отвечает ошибкой на входе в захват (точка З3).
      Близнец — KN-OVL-01, отличие одно: ответила ли операция. Добавить строку таблицы под §5
      «отказ чтения отсечки принят за её отсутствие» → краснеет новый сценарий.

non_blocking_findings:
  - id: N1
    kind: FORMAT
    where: KN-OVL-01…09, «Когда» входа
    text: >-
      «Вход паролем» не показывает тела запроса. Назвать camelCase-тело `POST
      /iam/v1/auth/login` явно: `email`, `password` и для 08 и 09 — `secondFactor` с `method`
      = `lookup_secret` и `code`. Способ второго фактора — закрытый перечень totp|lookup_secret
      (sf_present.go:151).
  - id: N2
    kind: SCOPE
    where: §2, «Завершение восстановления… — свой предмет»; §0.6
    text: >-
      «Свой предмет» ни на что не указывает. Поиск трекера kaname по «восстановлени
      принудительным выходом» → [], задачи нет. Граница «завершение восстановления против
      принудительного выхода» — тот же класс на третьем выдающем глаголе. ban #11 требует
      завести её предметом с причиной и предикатом снятия и сослаться на номер из §2.
  - id: N3
    kind: DoD
    where: §0 шапка «Ревизия измерения»; §6 пп. 1, 2
    text: >-
      Предикаты пп. 1–2 судят `origin/358...HEAD`. origin/358 уже ушла на +13 коммитов
      (196bf9664), кода документа они не касаются. Перед заходом полосы кода перемерить
      предикаты на свежей вершине волны.

