    программно: заголовок и строки ред. 4 и ред. 5 сравнены по клеткам. Все 76 новых клеток
    (3 новых столбца × 14 прежних строк, 2 новые строки × 14 прежних столбцов, 2 × 3 на
    пересечении) выведены заново. Вывод шёл от формы строки и «Тогда» столбца по матрице
    конфликтов строчных замков; места, где вывод опирается на поведение движка, сняты
    посевом. Сверено с кодом: commitOwnForceLogout (порядок шагов, срок фиксации),
    ForceLogoutWriter (`lock_timeout` 2 с через `set_config` на транзакцию), IssueSession
    (вставка, затем память первой аутентификации, затем событие), issue() входа
    (`ResetFailures` — `DELETE FROM login_failures`), RememberFirstAuthentication
