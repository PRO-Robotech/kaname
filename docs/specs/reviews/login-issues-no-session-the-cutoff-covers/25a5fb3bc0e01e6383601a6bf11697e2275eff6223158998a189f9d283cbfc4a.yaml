blocking_findings:
  - id: B1
    kind: DoD
    where: >-
      §5, таблица «снят / испорчен производитель», строка «отсечка прочитана, но не
      сравнивается», столбец 06 (пустая клетка — зелёный, строка 982 документа, сама клетка
      — строка 989); §6 п.10, пункт «отсечка прочитана, но не сравнивается → 02, 07/1, 07/3 и
      08 красные» (строка 1106)
    text: >-
      Редакция 3 записала в п.10: «Предсказание строки — и её красные, и её зелёные клетки.
      Инъекция, давшая другой исход хоть в одной клетке, — возврат в приёмку». Первая половина
      KN-OVL-06 утверждает, что тело её ответа побайтово равно телу ответа KN-OVL-02.
      Документ сам выводит, что эта половина краснеет всякий раз, когда 02 отвечает 200:
      KN-OVL-06 «До правки» («первая половина красна, потому что KN-OVL-02 отвечает 200»,
      строки 806–807) и §6 п.5 («первая половина 06» среди красных, строки 1065–1066). При
      инъекции «отсечка прочитана, но не сравнивается» 02 отвечает 200 — это та же строка
      таблицы, клетка 02, и п.10 («вход выдал при накрывающей отсечке»). Значит, 06 красная
      первой половиной, а таблица предсказывает ей зелёный, и п.10 её не называет. Честный
      прогон этой инъекции разойдётся с предсказанием в клетке 06, и по букве п.10 полоса
      кода вернётся в приёмку. Покрытие это не ослабляет: дефект реализации не ускользает.
      Неверно предсказание контракта, как и в круге 2. Прочие 13 строк сверены по столбцу 06.
      В строках «ключевой замок», «строгое», «в памяти», «след», «нет клетки», «фактор»,
      двух строках места захвата и строках исходов захвата 02 остаётся тем же одним отказом.
      Первая половина 06 там зелёная, вторая не зависит от 02. В строке «своим телом» 06
      уже красная. Других пустых клеток, противоречащих документу, нет.
    required_change: >-
      В строке «отсечка прочитана, но не сравнивается» поставить в столбец 06 «красн.: первая
      половина — тело 02 не отказ» (вторая половина зелёная). В пункт п.10 той же инъекции
      добавить 06 с её фактом: первая половина красная, потому что 02 ответила 200, и
      сравнивать тело не с чем. Перед правкой пройти таблицу ещё раз по зависимостям между
      сценариями. В документе такая зависимость одна (06 ← 02), но в каждой строке, где 02
      не тот один отказ, столбец 06 обязан это отражать.

non_blocking_findings:
  - id: N1
    kind: SCOPE
    where: §2, «Граница завершения восстановления с принудительным выходом»
    text: >-
      Перенесено из N1 круга 2. Задачи в трекере нет: `gh search issues --repo
      PRO-Robotech/kaname 'восстановлени принудительн'` → []. Документ это честно записывает и
      ждёт номера. Заведение — за диспетчером (строка «нужен следующий»), номер вписать
      редакцией 4.
  - id: N2
    kind: FORMAT
    where: §5, строка «нет клетки `before-cutoff`»; §6 п.10, пункт той же инъекции
    text: >-
      Форма инъекции не названа. Если снять значение из перечня исходов, пробы, которые на
      него ссылаются, не соберутся, и исход будет «не выполнилось», а не красный. Тот же
      довод §6 п.5 приводит для дерева до правки. Назвать форму: значение остаётся
      объявленным, отказ его клетку не отмечает.
  - id: N3
    kind: FORMAT
    where: >-
      §6 п.10, «Клетка «по жребию» исходом не судится: 05 в разводку не входит (п.5)»; §5,
      абзац под таблицей о строке «в памяти»
    text: >-
      Неясно, выведен ли из суда п.10 весь столбец 05 или только клетки «по жребию». Пустые
      клетки 05 в строках «строгое» и «в памяти» зелёные с точностью до жребия: m и T в
      раундах на часах процесса законно могут попасть в одну микросекунду. Абзац под
      таблицей («раунды на часах процесса такого не строят») говорит о том, что такое не
      строится намеренно, а не о том, что так не бывает. Сказать прямо, что столбец 05 п.10
      не судит целиком.

