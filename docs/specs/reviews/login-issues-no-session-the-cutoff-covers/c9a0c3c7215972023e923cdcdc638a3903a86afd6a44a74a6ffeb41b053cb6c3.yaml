blocking_findings:
  - id: B1
    kind: DoD
    where: >-
      §5, таблица «снят / испорчен производитель», строка «захват после записи фактора, а не
      первым» и абзац под таблицей («Замок не первой операцией держит 02 и 03 и валит 09/2»);
      §6 п.6 («09/1 и 09/2 вместе — его место в транзакции»); §6 п.10, второй пункт; Р4, пункт
      «Первой операцией транзакции» («Держит это KN-OVL-09/2»); §1.1, последний абзац; §2,
      строка о #382 («её строку в переписи #382 держит проба 09/2»)
    text: >-
      09/2 останавливает вход в З4, на входе во вставку записи сессии. Поэтому она держит
      свойство «строка личности взята до вставки записи сессии», а не «захват — первая
      операция». Захват, поставленный после записи фактора, но до вставки, 09/2 проходит:
      удаление ждёт строку личности и до строк фактора не доходит. Это место краснит только
      09/3: там З3 стоит после записи фактора, и удаление ждёт строку фактора. Захват после
      вставки краснит 09/2 взаимной блокировкой, а 09/3 — не блокировкой: вход выдаёт сессию.
      Строка таблицы и второй пункт §6 п.10 требуют «09/2 и 09/3 красные: 40P01, счётчик
      блокировок вырос». Такого исхода нет ни при одном месте инъекции, так что пункт DoD
      невыполним на честном прогоне, и полоса кода вернётся в приёмку. Та же ошибка в
      атрибуции Р4, §1.1 и §2 уйдёт в перепись #382 с неверным держателем. Все
      неправильные места ловятся набором 09/2 + 09/3 вместе, так что дефект реализации не
      ускользает. Неверно предсказание контракта, а не покрытие. ПОСЕВ (стенд
      newSessionLane, testcontainers Postgres, дерево f4c6537ac, вход — LoginUseCase.Execute с
      запасным кодом, удаление — UsersW().Delete, обёртка Store, три раунда на сцену, свежая Q
      в каждом). Захват эмулирован оператором замка строки личности у писателя
      (holdPersonForSessionSet через SessionSetWriter либо EndOtherSessions, сила FOR NO KEY
      UPDATE вместо FOR SHARE). Против FOR UPDATE удаления обе силы конфликтуют одинаково. (A)
      захват между записью фактора и вставкой, стоп в З4, то есть 09/2: удаление на замке,
      deadlocks+0, login=nil, delete=nil, после users=0 — три из трёх, 09/2 ЗЕЛЁНАЯ. (A) стоп
      в З3, то есть 09/3: deadlocks+1, удаление откачено — три из трёх, 09/3 красная 40P01.
      (B) захват после вставки, стоп в З4, то есть 09/2: deadlocks+1 — три из трёх, красная
      40P01. (B) стоп в З3, то есть 09/3: удаление на замке, deadlocks+0, login=nil (200),
      delete=nil — три из трёх, красная фактом «вход выдал, no-row не вырос», а не 40P01.
      Контроли: захват первым, стоп в З4 — deadlocks+0 три из трёх (09/2 после правки
      зелёная). Захват первым, стоп в З3 — удаление зафиксировано до снятия задержки, три из
      трёх. Сегодняшнее дерево: З4 — deadlocks+1 три из трёх, З2 — deadlocks+0 три из трёх.
      Это совпадает с §0.11 и §6 п.5.
    required_change: >-
      Строку таблицы под §5 разделить по месту инъекции на две. «Захват после записи фактора,
      до вставки записи сессии»: 09/3 красная 40P01, 09/2 зелёная. «Захват после вставки
      записи сессии»: 09/2 красная 40P01; 09/3 красная фактом «вход ответил 200, клетка
      `no-row` не выросла», без блокировки. Абзац под таблицей переписать так же. §6 п.10:
      две инъекции, у каждой свой названный красный. §6 п.6: «09/2 и 09/3 вместе — место
      захвата в транзакции» (плюс 09/1 как контроль). В Р4 и §1.1 сказать, что «до записи
      фактора» держит 09/3, а «до вставки записи сессии» — 09/2. В строке §2 о #382 назвать
      держателями обе.

non_blocking_findings:
  - id: N1
    kind: SCOPE
    where: §2, «Граница завершения восстановления с принудительным выходом»
    text: >-
      Перенесено из N2 круга 1. Предмет описан признаком и предикатом снятия, но задачи в
      трекере нет: `gh search issues --repo PRO-Robotech/kaname 'восстановлени принудительн'` →
      []. Документ пишет, что заведение «заказано возвратом круга 2». Этот возврат его
      заказывает, строкой «нужен следующий». Номер вписать в §2 редакцией 3: правка всё равно
      меняет отпечаток.
  - id: N2
    kind: FORMAT
    where: KN-OVL-07, «X — целая микросекунда, выбранная пробой»
    text: >-
      07/2 утверждает «пара края годна», а Resolve судит срок сессии по часам процесса
      (authenticated_at + TTL 24 ч). Если X выбран вдали от часов процесса, 07/2 краснеет
      сроком, а не правилом. Назвать ограничение: X — часы процесса, усечённые до
      микросекунды (или не дальше TTL от них).
  - id: N3
    kind: FORMAT
    where: §4 «Входом ничего не записано» («KN-OVL-08 и KN-OVL-10/2 добавляют четвёртое»); KN-OVL-08 «Тогда»
    text: >-
      В «Тогда» у KN-OVL-08 нет утверждения «входом ничего не записано», а у 10/2 оно есть. Либо
      дописать его в 08 (три наблюдения плюс код фактора), либо убрать 08 из фразы §4. Таблица
      под §5 с 08 в строке «отказ кладёт след» согласна с тем, что 08 этого не утверждает.

