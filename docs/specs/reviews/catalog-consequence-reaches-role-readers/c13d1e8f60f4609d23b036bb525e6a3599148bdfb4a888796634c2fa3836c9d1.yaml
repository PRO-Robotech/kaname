    title: >-
      ярусный глагол проекцией выдач не держится НИКОГДА, и решение §2.3 снимет его с
      превью; этого следствия нет ни в §1.1, ни в сценариях
    sections: [§1 (б), §1.1, §2.3, IAM-CCR-20, §3.3 строка role.mdx:88]
    predicate: >-
      Временная проба рецензента, мир документа (probemod путём старта, роли
      use-case'ом). Строки действий probemod после применения полного манифеста:
      gadgets.create:false, spare.create:false, widgets.create:false — деривация
      строк манифеста ДОБАВЛЯЕТ ярусный create каждому ресурсу («снято 1/5»
      считает и его). Роль T {gadgets: [list, create]} — role_verb
      [gadgets:list], UnresolvedSegments называет (probemod.gadgets, create),
      правило UNRESOLVED, health DEGRADED, превью сегодня [list create]. Роль U
      {gadgets: [create]} — role_verb [], health EMPTY, превью [create]. То же на
      посевном каталоге: {compute.instance: [get, create]} → role_verb
      [compute.instance:get], DEGRADED, [get create]; {compute.instance: [create]}
      → EMPTY, [create]. Контроль {compute.instance: [get, list]} — HEALTHY,
      неудержанных 0. Ярусных строк в посеве:
      grep "per_object) VALUES" internal/migrations/0001_initial.sql | grep -c "false);" → 26.
      Механизм по коду: ярусная строка в набор типа не входит
      (internal/catalog/facts.go:197), глагол вне набора отношения не даёт
      (internal/authzmap/role_verbs.go:80), поэтому строки role_verb у него нет
      by construction; действие несёт ярус на родителе (comment
      kaname.catalog_verb.per_object, 0001_initial.sql:1849; create → editor,
      internal/domain/rule_verbs.go:55).
    revision: kaname@b091bf63 (код = 6e9b94ab)
    why_blocking: >-
      Решение судит «держится ли сегмент», а у ярусного глагола сегмент не
      держится при ЖИВОМ праве — по устройству, а не по деградации. Значит превью
      всякой арендаторской роли, назвавшей create явно, теряет create: у U —
      [create] → [], у T — [list create] → [list] (при чтении §1 (б)). §1.1
      объявляет полный радиус («Кроме последствий каталога, таких состояний два»)
      и третьего — самого массового — не называет; IAM-CCR-20 прямо говорит
      «решение §2.3 причины не читает». Направление лжи документ не установил:
      если ярус даёт create, превью станет УЖЕ выдачи — тот самый исход, которым
      §2.3 отвергает два соседних варианта, и строка role.mdx:88 («исполняется
      именно этот набор») станет ложной; если не даёт — сегодняшнее [create]
      завышено, и изменение есть исправление, но тогда оно обязано быть
      названо и удержано. Ни одна строка §5 этот вход не подаёт.
    outcomes: >-
      Исхода два. (а) Вывести ярусный глагол из суждения признаком (по строке
      каталога per_object либо иным производителем, названным в §2.3), и
      завести сценарий на мире М: роль {gadgets: [list, create]}, прочитанная
      без всякого снятия, — превью [list create]; близнец {gadgets: [list]} —
      [list], HEALTHY; различает их один факт — ярусный глагол в правиле.
      (б) Показать вердиктом, что create ролью не выдаётся, и тогда назвать это изменение в §1.1 как третье состояние,
      поправить role.mdx:88 и удержать сценарием с тем же близнецом. В обоих
