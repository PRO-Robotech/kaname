    outcomes: >-
      Записать формулу одним местом: глагол v правила r идёт в превью тогда и
      только тогда, когда у r есть ресурс t с удержанным сегментом (t, v);
      подстановка разворачивается наборами только тех типов, чей якорь
      удержан. Привести к ней §0.5 и §1 (б). Завести различающие случаи: в
      IAM-CCR-20 — правило с частично неудержанными сегментами (например
      {probe.thing: [get, delete]}, неудержан только (probe.thing, delete) →
      [get]); в IAM-CCR-22 — многотипная подстановка с разными наборами
      глаголов (мир выше — готовый вход).
