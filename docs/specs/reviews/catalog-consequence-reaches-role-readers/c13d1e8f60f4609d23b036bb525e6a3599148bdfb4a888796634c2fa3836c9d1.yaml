    predicate: >-
      Проба рецензента, мир документа с ролью A, полоса глагола
      (verbApplierOver, verbRequest), щедрые потолки. С опорой нулевого значения
      — ErrBeyondAnchor, как измерил автор. С опорой ДОСТАВКИ
      (req.Anchor = modulecatalog.AnchorOfDelivery([Ω-widgets])) — err = nil,
      «снято 1/5 · переселено правил 1 выдач 1 · … снято 1 элементов
      вырезано 1», widgets снят, проекции A переселены, событий 0. Поле
      Request.Anchor объявлено контрактом («опора едет ЗАПРОСОМ»,
      internal/apps/kaname/modulecatalog/confirm.go), помощник производственный
      (internal/apps/kaname/modulecatalog/anchor.go).
    revision: kaname@b091bf63
    why_blocking: >-
      Отказ полосы глагола был свойством ВЫБРАННОЙ опоры, а не синтетического
      модуля, и именно им документ оправдывает две вещи. Первая: IAM-CCR-07 и
      его близнец IAM-CCR-01 различаются ДВУМЯ фактами — полосой и потолком, —
      тогда как строка 791 объявляет «один факт» (change-graph.md §6: при двух
      фактах неизвестно, какой дал исход). Вторая: у оси «полоса» есть только
      сторона отказа, стороны фиксации на полосе глагола нет, и эмиссия,
      поставленная под условие полосы, прошла бы все сценарии (по разбору: все
      фиксации — на полосе старта, а IAM-CCR-07 даёт ноль при любой форме). Обе стороны оси
      строятся тем же миром.
    outcomes: >-
      Снять «by construction» из §0.10 и довод §2.6. Близнецом IAM-CCR-07 сделать
      ту же полосу глагола с опорой доставки и щедрыми потолками: применение
      фиксируется, у A ровно одно событие — различает их один факт, потолок.
      Строка §5 на этот исход — ЗАВОДИТСЯ.

# ─── ВАЖНЫЕ, НЕ БЛОКИРУЮЩИЕ ─────────────────────────────────────────────────
non_blocking:
  - id: Н1
    title: >-
      перепись §2а называет два места, меняющих состав роли без записи её строки;
      досев старта через ReplaceRoleVerbs — третье
    detail: >-
      seed.ReseedSystemRoleVerbs (internal/apps/kaname/seed/role_verb_reseed.go)
      зовёт ReplaceRoleVerbs (role_repo.go:956, :961) в своей транзакции без
      записи строки роли. #73 адъюдицировал его для УСТОЯВШЕГОСЯ подъёма; на
      неустоявшемся он состав меняет — замер: неудержанные сегменты у 42 из 48
      системных ролей до досева, 0 после, пар 654. После этого изменения он
      сдвигает уже и превью ([] → полное) — без события. Назвать в §2а и §6 с
      предикатом пересмотра.
  - id: Н2
    title: 'заголовок «Мир М — общий для IAM-CCR-01…19» накрывает IAM-CCR-10'
    detail: >-
      «Дано» IAM-CCR-10 — база харнесса применителя ролей (applierOnLiveBase,
      модуль vpc), не мир М. Строка 650.
  - id: Н3
    title: 'описание мира М не называет ярусный create у каждого ресурса probemod'
    detail: >-
      Строки 657–659 перечисляют get, list, update, delete; деривация добавляет
      create с per_object = false, и «снято 1/5», «снято 1/3» считают его.
      Существенно для Б1: вход ярусного глагола в мире М уже есть.
  - id: Н4
    title: 'гейт §3.2а судит вызов функции по ФАЙЛУ, а не по разделу goose'
    detail: >-
      Миграция, пишущая подтаблицы роли в Down и зовущая функцию только в Up
      (или наоборот), находки не даст. Судить Up и Down порознь.
  - id: Н5
    title: 'DoD п. 4 не требует инъекции для IAM-CCR-11'
    detail: >-
      IAM-CCR-11 — единственный держатель отказа от формы «множество из
      ведомостей» (§3.1); §2.4 её измерил (0), но в перечень инъекций п. 4 она
      не внесена.

