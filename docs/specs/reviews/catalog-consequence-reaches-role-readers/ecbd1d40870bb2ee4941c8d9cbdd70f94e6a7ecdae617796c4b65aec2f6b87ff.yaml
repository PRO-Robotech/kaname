# ─── ПОВТОР ОПЫТОВ КРУГА 1: по каждому блокирующему — тот же опыт, иной исход ──
blocking_check:
  - id: Б1
    title: ярусный глагол проекцией выдач не держится, и решение §2.3 снимало его с превью
    experiment_repeated: >-
      Тот же опыт: мир М посеян заново, роли T {gadgets:[list,create]},
      U {gadgets:[create]} и близнец E {gadgets:[list]} заведены use-case'ом
      создания; замерены выдачи, неудержанные сегменты, health и превью. Сверх
      опыта круга 1 прогнан производственный предикат направления лжи
      (roleexport.Produces) — то, чего круг 1 установить НЕ смог.
    got: >-
      Строк каталога probemod 13, ярусных 3 (перепись применения: «объявлено
      ресурсов 3 глаголов 13 · записано 3/13»). T — выдачи [probemod.gadgets:list],
      неудержан (probemod.gadgets, create), health DEGRADED, превью [list create];
      U — выдач НЕТ, health EMPTY, превью [create]; E — неудержанных ноль,
      HEALTHY, [list]. Produces(create, probemod_gadgets, "editor",
      probemod_gadgets) = true при Produces(create, …, "v_create", …) = false,
      контроль Produces(list, …, "v_list", …) = true.
    verdict: ЗАКРЫТО, и ЗАКРЫТО ШИРЕ, чем требовало замечание
    why: >-
      Выбран исход (а) — ярусный глагол выведен из суждения, — и направление лжи
      установлено ЗАМЕРОМ: право create роль ВЫДАЁТ ярусным кортежем, значит без
      оговорки превью стало бы у́же выдачи. Круг 4 сверх этого СУЗИЛ оговорку с
      КЛАССА до ПАРЫ, и сужение верно: перемерено по посеву — строк create 27,
      пообъектная ОДНА (registry.registries), ярусных 26; предикат
      GrantedVerbsWithDeclared("registry_registries", true, [create],
      [create get list update delete]) = [create] против
      GrantedVerbsWithDeclared("vpc_network", true, [create], [get list update delete]) = [];
      TierOnlyVerbClasses() = [create]. То есть у пообъектной пары сегмент
      ДЕРЖИТСЯ, и вывод по классу сохранил бы в превью отобранное право — ровно
      дефект #76. Держатели заведены: IAM-CCR-25 (интеграция, близнец E, один
      различающий факт) и три «И» IAM-CCR-20 (домен, три состояния набора пары),
      строки §5, ось инъекции в DoD п. 4. §1.1 и §2.3 переписаны на ОДНОСТОРОННЕЕ
      включение — прежнее «меняется ровно там, где health называет деградацию»
      было шире сделанного и снято.
    structural_check_by_the_reviewer: >-
      Пункт 3 читает второй факт у RolePreviewLookup, поэтому проверено
      ОТДЕЛЬНО, не может ли ЖИВАЯ ярусная пара попасть в третье состояние
      («не резолвится») и потерять свой глагол — это сделало бы превью у́же
      выдачи тем самым признаком, который §2.3 отвергает. Не может, и это
      измерено в обе стороны: деривация кладёт ярусную строку только ресурсу,
      объявившему хоть одно действие (rows.go:177–178), а набор типа строится из
      пообъектных строк (facts.go:197) — значит ярусная строка существует только
      там, где есть пообъектная. Перепись посева: ресурсов с ярусной строкой 26,
      из них БЕЗ пообъектных — 0.
  - id: Б2
    title: гранулярность §2.3 двусмысленна; одно прочтение возвращает окно отставшего снимка
    experiment_repeated: >-
      Тот же опыт: роль V {[widgets, spare]: [*]} — подстановка по ДВУМ ресурсам
      с РАЗНЫМИ наборами глаголов — в мире М; применён Ω-widgets полосой глагола;
      превью прочитано через снимок S0, снятый ДО применения (catalog.NewSnapshot
      поверх ReadCatalogHalves), и через живой. Отдельно — то же на чистой функции
      домена, обоими прочтениями.
    got: >-
      V после применения: выдачи [probemod.spare:get, probemod.spare:list],
      неудержан РОВНО якорь probemod.widgets (сегмент с пустым глаголом),
      объявлено 2, health DEGRADED. Превью через ОТСТАВШИЙ S0 —
      [get list update delete]; через ЖИВОЙ — [get list]. Домен на тех же формах
      даёт то же дословно.
    verdict: ЗАКРЫТО
    why: >-
      Формула записана ОДНИМ местом (§2.3, пункты 1–3), гранулярность названа
      СЕГМЕНТОМ прямым текстом, §0.5 и §1 (б) к ней приведены. Различающие случаи
      заведены и оба РЕАЛЬНЫ: IAM-CCR-22, строка о V (прочтение «по правилу»
      даёт [get list update delete] — обещание update и delete, которых роль не
      держит нигде; формула даёт [get list]), и IAM-CCR-20, «И» о гранулярности
      сегмента (роль с неудержанным ТОЛЬКО (probe.thing, delete) — [get list], а
      не [get list delete]). Минимальная реализация первой фразы круга 2, которая
      проходила все двадцать четыре сценария, на обеих строках краснеет.
      Положительный контроль у строки о V стоит рядом (выдачи, неудержанный
      якорь, health) — без него [get list] было бы выполнимо и путём, не дающим
      ничего.
  - id: Б3
    title: §0.10 объявлял фиксацию на полосе глагола невозможной «by construction»
    experiment_repeated: >-
      Тот же опыт: мир М, вход Ω-widgets, полоса глагола
      (modulecatalog.NewVerbApplier), опора ДОСТАВКИ
      (modulecatalog.AnchorOfDelivery([Ω-widgets])), подтверждение по текущему
      состоянию модуля; две строки, различающиеся ОДНИМ фактом — потолком
      переселённых выдач.
    got: >-
      потолок выдач 0 — «модуль probemod: modulecatalog: resettle ceiling
      exceeded: выдач глаголов переселено бы 5 при потолке 0
      (max_resettled_role_verbs); применение отвергнуто до коммита»; перепись
      «снято 1/5 · переселено правил 2 выдач 5 · элементов вырезано 2»;
      отпечаток состояния ПРЕЖНИЙ. Потолок щедрый — err = nil, та же перепись,
      отпечаток СМЕНИЛСЯ, выдачи A сузились до [probemod.gadgets:list].
      Числа переселения у рецензента больше авторских (правил 2 выдач 5 против
      1 и 1) — это СВОЙСТВО МИРА, а не расхождение: «Дано» IAM-CCR-07 называет
      мир М «с ролью A», а мир рецензента нёс пять ролей, из которых widgets
      называют две (A и V, у V подстановка по четырём глаголам). Механизм и обе
      стороны оси те же.
    verdict: ЗАКРЫТО
    why: >-
      «By construction» снято из §0.10, довод §2.6 отозван прямым текстом,
      заведён IAM-CCR-26 — сторона ФИКСАЦИИ, близнец IAM-CCR-07 переставлен на
      него, и различает их ОДИН факт (потолок), а не два, как было. Реализация
      «событие пишется только на полосе старта» теперь краснеет: ось несёт обе
      стороны, и это подтверждено замером, а не доводом. Отдельно проверено, что
      посылка автора о механизме верна: опора едет запросом (confirm.go:124,
      комментарий поля говорит «Нулевое значение = опора одного образа, то есть
      САМАЯ УЗКАЯ»), собирает её производственный помощник AnchorOfDelivery
      (anchor.go:41), которым пользуется путь плана (plan.go:90).

