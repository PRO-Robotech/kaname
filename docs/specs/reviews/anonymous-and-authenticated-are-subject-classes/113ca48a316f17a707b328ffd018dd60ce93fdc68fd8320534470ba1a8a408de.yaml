blocking:
  - id: B1
    kind: CONSTRUCTIBILITY
    scenarios: [П3, SC-30, SC-32, SC-33, SC-45, SC-31, SC-38]
    note: >-
      П3 строит только посредник ПРАВ (`buildAuthzMiddleware`), а запрос без удостоверения на
      боевом крае до него не доходит: его отвергает слой АУТЕНТИФИКАЦИИ раньше. kacho
      @2ec6e1e3d `gateway/internal/middleware/auth.go`: нативная полоса — `if bearer == ""`
      → в `production`/`production-strict` отказ, кроме `publicMethods`
      (`DefaultPublicAllowlist`, строки 463–470); полоса REST — `refuseUncredentialed`
      (строки 1072–1083), отказ, кроме `isPublicHTTPPath`. Маркер `system/anonymous`, которым
      существующие пробы подают анонима посреднику прав (`anonymousMarkerCtx` в
      `anonymity_not_an_identity_test.go`), по шапке `injectAnonymous` (строка 698) — «dev-mode
      only»: в боевой посадке такого состояния нет. Следствия: (1) «Дано» SC-30 в П3 не
      названо (каким контекстом «без удостоверения» входит в посредник прав) и, если это
      маркер, — состояние, которого боевая посадка не производит; SC-30 зеленеет на П3, когда
      край продолжает отвергать анонима на каждом методе, а newman этого не поймает — в
      стволе метода с «0» нет (DoD S3). (2) SC-33 в П3 не строится вовсе: подпись Bearer
      сверяет `AuthInterceptor`, посредник прав удостоверения не видит. (3) SC-32 (в) и SC-45
      утверждают «побайтово равно сегодняшнему отказу без удостоверения», а сегодняшний отказ
      производит `authnrefusal.Err()` слоя аутентификации — в П3 его нет, сравниваются два
      отказа посредника прав. Нужно: П3 — цепочка `NewAuthInterceptor(AuthModeProduction, …,
      &fakeLookup{}, …)` → `buildAuthzMiddleware` (фикстуры есть в том же пакете:
      `anonymity_not_an_identity_test.go`, `auth_jwks_test.go`), обе полосы — нативная и
      REST; «Когда» SC-30/31/32/33/45 — запрос без заголовка `Authorization` через эту цепочку.
      Близнец SC-45 и SC-31 остаются прежними.
  - id: B2
    kind: PRODUCER
    scenarios: [Р6, SC-30, SC-32, Инвариант 2]
    note: >-
      У «Тогда обработчик вызван» SC-30 производитель не заказан. Таблица «сценарий →
      производитель» называет `auth.go` только как уже производящий ОТКАЗ и заказывает
      изменения лишь в `permission_catalog.go` (признак строки) и субъекте вопроса. Но чтобы
      строка «0» пропустила анонима, слой аутентификации обеих полос (нативный `authorize`,
      REST `refuseUncredentialed`) должен спрашивать каталог о признаке строки — сегодня он
      знает только `publicMethods`/`isPublicHTTPPath`, а Инвариант 2 запрещает расширять этот
      список. Не названо и то, ЧТО слой аутентификации кладёт в контекст анониму на строке
      «0»: шапка `auth.go` (строки 455–462) фиксирует, что именованная личность
      `{system, anonymous}` уже была дефектом — «every anonymous request owns every other
      anonymous request's operations». Нужно: (1) в таблице — строка «слой аутентификации,
      обе полосы: проход без удостоверения только для строки с признаком Р6, без
      именованной личности» — **заказан (S3)**; (2) в SC-30 «И»: до обработчика не доходит
      метаданных принципала (`principalmeta.MetaPrincipalType`/`MetaPrincipalID` пусты), с
      близнецом — вызов `usr-B`, где они заданы. Это поверхность безопасности
      (ban18-q-security), не только формальность.

