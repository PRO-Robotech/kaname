blocking:
  - id: B1
    kind: NEGATIVE
    title: >-
      Р11 п. 4 «Другого пути к объекту типа модуля выдачей классу нет» опровергается деревом:
      выдача классу `authenticated` на области кластера с целью allInScope ролью модуля с
      именами или метками ворот S7 не проходит, и сценария на этот путь нет
    finding: >-
      Строка 619 (Р11 п. 4) и инвариант 9 (строка 1954) обещают: модуль с ключом принимает
      выдачу классу на объекты своих типов только на объявленном контейнере. Ворота Р11 п. 2
      судят ТОЛЬКО объекты цели. Путь с целью «вся область» опирается на «allInScope классу
      закрыт (SC-24, SC-19, SC-28)», но на a176c3768 это не так для одного сочетания.
      (1) `systemClassTargetGate` отвергает allInScope у `authenticated` лишь при
      `b.ResourceType != "cluster"` (system_class_gates.go:83-100, условие — :96). (2) Роли из раздела
      `roles` манифеста модуля заводятся с `IsSystem: true` (moduleroles/apply.go:453), а
      `IsRoleAssignable` назначает системную роль везде, включая кластер (domain/role_scope.go:97-101).
      (3) Схема манифеста допускает `resourceNames` и `matchLabels` на правиле верхнего уровня
      (schema/module-manifest.schema.json:346-357). (4) `validateGlobalAllSelector`
      отвергает на кластере только роль с правилом-якорем (helpers.go:357-380,
      `HasAnchorRule`); роль, все правила которой несут имена или метки, проходит.
      (5) Ворота покрытия при allInScope тип не сверяют (structural_gates.go, Gate 3), а
      ворота контейнера при пустом `Target.Resources` выходят сразу. Итог: кластерный
      администратор выдаёт классу `authenticated` на кластере allInScope системную роль
      модуля registry с правилом `[get]` над `registry.repositories` с `resourceNames` — и
      ни одни ворота, включая ворота S7 в редакции 16, выдачу не останавливают, хотя модуль
      объявил ключ. SC-28 держит отсутствие такой роли лишь посевом («системных ролей с
      именами или метками в посеве 0»), а не построением: манифест вправе её объявить.
      Утверждение п. 4 — утверждение о безопасности, и оно неверно как структурное.
    fix: >-
      Выбрать одно и записать сценарием с близнецом. (а) Рекомендация: ворота S7 судят и
      выдачу с целью «вся область» (allInScope либо пустая цель) — отказ тем же кодом, если
      хотя бы одно правило роли (верхнего уровня или вложенное) покрывает тип модуля,
      объявившего ключ, и этот тип не объявлен контейнером; текст — своей формой с именем
      модуля и типа. Сценарий: класс `authenticated`, область `iam.cluster`/`cluster_root`,
      цель `{"allInScope":{}}`, отправитель `usr-K`, системная роль модуля registry с
      `resourceNames` над `registry.repositories` (посев — роль в документе П7 либо
      `seedRole` с `IsSystem`; конструируемость доказать посевом); близнец — та же выдача на
      «П7 без ключа» принимается. (б) Если путь признаётся допустимым (его открывает только
      роль, которую модуль объявил сам), — переписать п. 4 и инвариант 9 честно: назвать
      путь, почему он вне ключа, и держать это сценарием с исходом «принято при ключе».
      Молчаливое «другого пути нет» не годится ни в (а), ни в (б).

important:
  - id: R1
    kind: CONSTRUCTIBILITY
    note: >-
      П7: «Посев требует, чтобы каталог знал оба типа, и проверяет это сам (проекция глаголов
      не пуста)». `require.NotEmptyf(pairs)` в seedRole (строка 165) проверяет «хотя бы одна пара», а не
      «оба типа». Если каталог не знает `registry.repositories`, близнец SC-78 покраснеет по
      фикстуре и будет прочтён как дефект ворот. Рекомендую в пробе S7 положительный контроль
      по каждому типу (пара для `registry.repositories` в проекции есть) либо поправить фразу.
  - id: R2
    kind: DoD
    note: >-
      Краевые кейсы SC-78/79 отнесены в коллекцию kacho «когда манифест registry понесёт
      ключ», без носителя-задачи (новых задач не заводить — решение владельца). Держится
      «Что НЕ входит» п. 8 с предикатом; при интеграции в kacho внести кейсы тем же
      изменением, что ключ в манифест registry. Не блокирует: на автономном стенде kaname
      цель типа registry не строится (git grep -ln 'module: registry' a176c3768 → 8 путей,
      все — пробы, фикстуры, документ).

