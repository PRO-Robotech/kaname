delta_check:
  - item: Р11 пп. 1–3, 5–7 — единица модуль, кого касается, исключение SC-65, отказ, порядок
    result: >-
      Подтверждено на a176c3768. Ворота класса зовутся только у выдачи с классом
      (system_class_gates.go: `domain.HasSystemClass`), после права выдавать (create.go:258
      `requireGrantAuthority` → структурные ворота → create.go:271 `validateSystemClassGates`).
      Предикат «тип объявлен» — `PublicReadContainer` (system_class_repo.go:112-127, живая
      строка каталога `public_read_to_children`), им судит `systemClassContainerGate`. Ключа
      нет нигде (`git grep -c classGrantsOnlyOnContainers a176c3768` → пусто). Схема манифеста:
      `additionalProperties: false`. Словарь типов цели `<модуль>.<ресурс>` —
      authzmap/tables_gen.go:66. Update правит только deletionProtection и labels
      (update.go:133, T3.3-IMM-01).
  - item: SC-78 — близнец «П7 без ключа» сегодня принимается и открывает v_get
    result: >-
      Подтверждено чтением. Тело «выдача Р» проходит все пять ворот класса: цель — объекты
      (не allInScope); роль только читает; вложенных правил нет; тип цели
      `registry.repositories` не объявлен, но `CoveredChild` не срабатывает — правило роли не
      покрывает ребёнка репозитория; свежесть 1 минута. Структурные ворота: системная роль
      аккаунта на проекте аккаунта, `CoversType(registry.repositories)` истинно. Канон
      `registry_repository.v_get` принимает `system_class` (fga_model.fga:1357), `v_list` — нет;
      близнец верно утверждает только `v_get`. Отличие от «Когда» — один факт (ключ).
  - item: SC-79 — исключение, исходы Check
    result: >-
      Согласовано с Р9 «Сужение по цели»: `public_reader` пишется только при вложенном
      правиле (reconcile/public_reader.go:23), правило верхнего уровня сравнивает точно. Исход
      «репозиторий X → false» — тот же, что у близнеца SC-65, хотя роль rol-reg-repo-read, в
      отличие от rol-proj-reg-read, тип репозитория покрывает: это новый, а не повторный
      факт, и он верен. Близнец SC-78 отличается одним фактом — типом цели.
  - item: SC-80 — форма ключа
    result: >-
      Отказ доставки с числом находок существует (manifest/delivery.go:108 «каталог доставки
      %s: манифестов прочитано %d, находок %d»). Побайтовая сверка рендера и перепись
      Reaffirmed — производитель SC-70 (б). Близнец (а)/(б) — одно значение ключа.
  - item: посев П7, «П7 без ключа», «выдача Р» — конструируемость
    result: >-
      Фикстуры названы и существуют на a176c3768: `pcrWorld.seedRole`
      (public_container_read_world_integration_test.go:148-170), `publicreadfixture.Read`,
      `NewEditionFile`, `Delta`, `WithoutKey` (publicreadfixture.go:40, 76, 100, 136). П6
      включает мир П1 (`rolRead`, `enp00000000000000001` — system_class_world_integration_test.go:62,
      84), поэтому «И (прочие модули)» на П7 строится; `pcrYPub` есть — «И (публикация модуля)»
