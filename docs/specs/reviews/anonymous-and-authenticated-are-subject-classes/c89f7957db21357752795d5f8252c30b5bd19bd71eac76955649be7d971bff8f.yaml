delta_check:
  - item: B1 [TWIN] — SC-76 (и), домен вызывающего
    result: >-
      Закрыто. Строка (з) переименована: «тип чужого домена, не публикуемый», проверяемый
      пункт — тип. Добавлена (и): учётка службы vpc, system_class:anonymous, v_get,
      registry_repository:r1. Против SC-74 меняется ровно один факт — вызывающий; близнец
      SC-74. Та же строка словом user:* дана с близнецом SC-12. Посев рецензента на копии
      corelib@7ffb6873c: vpc со словом класса, vpc с user:*, nlb со словом класса — отказ;
      registry с обоими словами — принято; (з) — отказ. После инъекции (policy.go, ветвь
      `if callerDomain != ""` заменена на `if callerDomain != "" && hierarchical`) красных 3
      из 3, все в строках (и), а (з) зелёная. Собственные пробы пакета под инъекцией остаются
      зелёными, поэтому заказанный держатель нужен. Документ называет его верно: строки в
      TestValidateTuple_PublicReadAcceptsTheAnonymousClass (corelib#116, оба слова) и в
      TestRegisterResource_PublicationAcceptsTheAnonymousClass (kaname#893). Обе функции есть
      (git grep @7ffb6873c, @e36fd21a6). Шаблоны -run DoD S6 их включают. Карта строк
      (а)…(з) по пробам сверена построчно: corelib — 16 строк функции, kaname — 9 строк.
  - item: B2 [PRODUCER] — носитель снятия user:*
    result: >-
      Закрыто как дефолт. kaname#836 носителем больше не названа (её заголовок: «iam: снять
      перевод user:* → system_class из сборщика модели»). Носитель описан: задача
      PRO-Robotech/corelib с названием, DoD (перечень из одного слова, отказ user:* с
      близнецом словом класса, подъём пина) и порядком (после трёх частей условия SC-77).
      В трекере её пока нет: gh issue list -R PRO-Robotech/corelib --state all --search
      'anonymous OR publicReadSubjects OR "user:*"' → 5 задач, задачи снятия среди них нет.
      Это шаг вне предмета S6: S6 утверждает только переходный приём. Вопрос дефолтабелен, и
      дефолт зафиксирован ниже (Q1). Завести задачу — дело диспетчера (R1).
  - item: B3 [CONSTRUCTIBILITY] — условие конца перехода
    result: >-
      Закрыто. Условие взято по предмету и состоит из трёх частей. Замер на kacho @a95248464:
      git grep -n 'SubjectID: *FGASubjectPublicWildcard' -- ':!*_test.go' → 1
      (fga_intent.go:436). Контроль формы 'SubjectID: *FGASubject' → та же 1 строка.
      FGARepoPublicGetTuple — 4 строки: комментарий :431, объявление :434, вызовы :450 и :461.
      Строка :309 (FGASubjectForPrincipalID) по имени та же, но предмет у неё другой, и
      оговорка автора о ней верна. Условие достижимо одной правкой kacho#3287, и чужие гейты
      оно не задевает. Ограничение формы — R3.
  - item: R1, R2 круга 1
    result: >-
      Стали пунктами DoD S6 (kaname#893). R1: строка словом класса в
      TestSystemClass_SC12_SC13_PublicationIsAGrantToAnonymous, шаблон -run '^TestSystemClass_SC12_SC13_'
      её покрывает. R2: проба через обработчик UnregisterResource — без имени функции (R2 ниже).
  - item: история, шапка, инвариант 8, раздел «Редакция 14»
    result: >-
      Исполнено. Строка круга 1 ссылается на существующую запись 80edd84b….yaml. Инвариант 8
      дополнен условием «когда домен известен», и оно согласовано с «И (домен вызывающего
      неизвестен)» SC-76.

