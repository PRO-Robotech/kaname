important:
  - id: R1
    kind: OPEN-QUESTION
    note: >-
      Задачу-носителя Q1 заводит диспетчер (или git-operator по его заданию) до вливания
      kaname#893. Вписать её номер в SC-77 — это правка документа, новый отпечаток и
      проверка исполнения одной строки: одобрение c89f7957… на неё не переносится. Дешевле
      связать задачу ссылками с kaname#893 и kacho#3287 и документ не править: SC-77 уже
      называет носителя заголовком.
  - id: R2
    kind: DoD
    note: >-
      Пункт DoD S6 «проба kaname, вызывающая RPC снятия с отказной тройкой» не называет ни
      функцию, ни команду. Шаблон -run kaname в DoD S6 закреплён на трёх именах
      (`^TestRegisterResource_(…)$`), и новая проба в него не попадёт. При сдаче #893
      назвать функцию и дописать её в команду DoD-proof.
  - id: R3
    kind: CONSTRUCTIBILITY
    note: >-
      Часть 2 условия SC-77 привязана к ИМЕНИ константы. Если kacho#3287 сменит значение
      FGASubjectPublicWildcard, а не заведёт отдельную константу субъекта публикации, то
      часть 2 останется 1. Кроме того, сменится субъект вопроса плоскости данных
      (fga_intent.go:309), а это предмет SC-39 и SC-15. Конъюнкция при этом цела: часть 3 по
      предмету держит субъект. Рекомендация для #3287 — отдельная константа.
  - id: R4
    kind: FORMAT
    note: >-
      Шапка соседа (3236ea00…) отсылает к «SC-77 … (редакция 13)», а в редакции 14 условие и
      носитель SC-77 другие. Номер сценария при этом тот же, и ссылка ведёт куда надо.
      Править соседа ради этого не нужно: правка сменила бы его одобренный отпечаток.
  - id: R5
    kind: FORMAT
    note: >-
      R3 круга 1 в трекере не исполнен: DoD kacho#3287 по-прежнему несёт предикат по всему
      дереву (`git grep -n 'user:\*' -- . ':!docs/archive'` → 0), а он недостижим (135 строк,
      54 файла @a95248464). Поправить задачу тремя частями условия SC-77 должен диспетчер,
      а не этот документ.

