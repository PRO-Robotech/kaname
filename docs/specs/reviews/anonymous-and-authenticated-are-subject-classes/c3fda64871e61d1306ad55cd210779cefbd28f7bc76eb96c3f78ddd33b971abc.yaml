    title: смена формы роли меняет исход SC-68 Б2, а дельта объявляет исходы неизменными
    finding: >-
      SC-68 Б2 (строки 1325-1331): `usr-D` с ролью rolb1325b011aa17211d и целью
      `{"allInScope":{}}` → `v_get` на `…02/app` → true, BatchCheck `[true, true, true,
      true]`. В редакции 11 роль держит `registry.repositories` только вложенным правилом, а
      сосед (nested-rule…, «Вне объёма» п. 2, строки 45-49) говорит: на `allInScope` вложенное
      правило не даёт ничего сверх правил верхнего уровня. Значит `…01/app` и `…02/app` в Б2
      → false, и Б2 больше не доказывает живость Y и `…02/app`. Раздел «Редакция 11» (строка
      1762) и история в шапке (строка 73) утверждают обратное.
    fix: >-
      Связано с B1 записи соседа 49242817…; выбор — диспетчер. Рекомендация: Б2 — ролью с
      правилом верхнего уровня над `registry.repositories` и отдельным базовым миром, либо
      исход `…0x/app → false` и живость Y и `…02/app` другим контролем; поправить строку
      «исходы не меняются».
  - id: B2
    kind: DoD
    title: держатель SC-68 — шаблон без единой пробы, а дельта сама это измерила
    finding: >-
      Дельта (строки 375-376) записала: держателя SC-68 Б1 в дереве нет, `git grep -c
      'func Test\(Ask\|Batch\)_SC68_' 422d1bc6f` → пусто (перемерено: код 1). DoD S5 (строка
      1578) и строка производителя SC-68 по-прежнему называют `-run '^Test(Ask|Batch)_SC68_'`
      и `DoD-proof` задачи #857 доказательством SC-68. Такой прогон даёт `ok` при нуле
      исполненных тестов. #857 закрыта; её пробы — `TestTarget_*` (DoD-proof @91b216f3c и
      ранее), Б1 они не утверждают. Сосед (nested-rule…, строки 202-204) говорит: «после
      редакции 11 SC-68 Б1 держит ND-02», но в редакции 11 этого нет.
    fix: >-
