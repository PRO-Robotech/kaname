blocking:
  - id: B1
    kind: FORMAT
    scenarios: [Р10, SC-62, SC-68, SC-70, DoD S5]
    note: >-
      Редакция не входит в дерево: хук отправки ветки 856 отказал (rc=1) на двух гейтах
      приёмок. TestAcceptanceProbeCoordinateResolves — 26 мёртвых координат в этом документе:
      строки 379 и 1293 (`TestModelCanonAgreesWithPlatformManifests` — проба kacho, названа
      без дома), 1414-1422, 1429-1430, 1435-1444 (пробы kaname, которых ещё нет),
      1447-1450 и 1557 (пробы kacho без дома). TestAcceptancePathCoordinateResolves —
      строка 1293: предикат `git grep … -- internal/repohygiene` по корню, которого в
      kaname нет. Нужно: координаты kacho — формой дома `PRO-Robotech/kacho:<имя>` (как
      строка 1279 называет `PRO-Robotech/kacho@2ec6e1e3d:<путь>`); ещё не написанные пробы
      kaname — не пролётом-координатой (форма предиката `-run '^TestX$'` внутри команды
      либо прозой), пока красные пробы не легли в дерево (так сделан DoD S1:
      ca1f24ff2 до b872c300b); предикат строки 1293 — с домом kacho. Приём проверки —
      тот же хук: `go test ./internal/check/ -run 'TestAcceptance(Probe|Path)CoordinateResolves' -count=1`
      → ok.
  - id: B2
    kind: CONSTRUCTIBILITY
    scenarios: [SC-65]
    note: >-
      «Когда» SC-65 до утверждаемого отказа не доходит. Тело — роль rolb1325b011aa17211d
      (правило над registry.registries и registry.repositories) с целью iam.project prj-A.
      Порядок Execute (create.go): validateStructuralGates раньше validateSystemClassGates;
      ворота 3 (structural_gates.go:128-135, RoleCoversType) отвергают цель, тип которой
      правило роли не покрывает, — FAILED_PRECONDITION
      «role rolb1325b011aa17211d does not grant verbs on iam.project; target type must be
      covered by role.rules». Ожидаемый текст «Type iam.project does not pass public read
      to its children; …» недостижим, а новые ворота (по строке производителя — рядом с
      systemClassTargetGate) не исполняются вовсе. В узком охвате (решение диспетчера)
      отказ имеет смысл только для роли, покрывающей И тип цели, И тип-ребёнок. Нужно:
      в П6 — роль чтения над iam.project и registry.registries; SC-65 — на ней; близнец —
      та же роль с целью X; контроль — SC-60.
  - id: B3
    kind: CONSTRUCTIBILITY
    scenarios: [SC-70]
    note: >-
      SC-70 (в) «ключ на repositories вместо registries» утверждает отказ пуска текстом
      расхождения Compose. Но на repositories не указывает ни один ресурс манифеста, и по
      SC-71 (б) такой манифест отвергает ЗАГРУЗКА (internal/manifest) — раньше Compose,
      которому манифесты приходят уже разобранными (compose.go:59, Compose(canon,
      []*manifest.Manifest)). Через путь доставки (в) до расхождения не доходит; проба,
      строящая manifest.Manifest в обход загрузки, позеленела бы на состоянии, которого
      живой старт не производит. Нужно: третья форма, проходящая загрузку и расходящаяся с
      каноном (например, ключ на registries при иной правой части v_list у repositories),
      либо исход (в) — текст SC-71 (б) с близнецом (б).
  - id: B4
    kind: COVERAGE
    scenarios: [Р10, SC-70, DoD S5, таблица соседей]
    note: >-
      Решение диспетчера по Р10 (вариант (а)) в документ не внесено: строки 392-396 —
      по-прежнему «Допущение автора (вопрос в возврате диспетчеру)». Нет: (1) номера
      задачи-преемника (строки 395, 1463 — «задача-преемник» без номера); (2) предиката
      снятия признания (командой, по образцу SC-15 и kaname#832); (3) сценария КОНЦА
      перехода: после преемника манифест (а) — отказ пуска, близнец — (б) стартует;
      (4) точного определения принимаемой «прежней редакции» (блоки, порождённые манифестом
      kacho @a95248464 — побайтово, а не «прежняя редакция»); (5) в таблице соседей —
      исключения из «канон неприкосновенен» (model-composes-at-boot-from-delivered-manifests.md
      §2 п. 2, IAM-MB-1-03): переход ослабляет побайтовое равенство до «одна из двух форм» и
      это расширение надо назвать с границей (две формы, третья — отказ). Без (1)-(3)
      переходное признание — отсрочка без предиката (ban11-three-outcomes).
  - id: B5
    kind: PRODUCER
    scenarios: [SC-68]
    note: >-
      Производитель SC-68 — P0-задача PRO-Robotech/kaname#857 («решение о доступе: цель
      привязки сужает get и list до названных объектов», OPEN), идущая первой. В документе
      она не названа ни разу (grep -c '857' <док> → 0); строка производителя SC-68 (1292)
      и DoD S5 (1427-1432) отдают пробу «заказанной S5». Нужно: в У4, в SC-68, в строке
      производителя и в DoD S5 — ссылка на kaname#857 как дом реализации и пробы, порядок
      «#857 до прочих полос S5», доказательство SC-68 — DoD-proof задачи #857.
  - id: B6
    kind: TWIN
    scenarios: [SC-68]
    note: >-
      Половина SC-68 от user:usr-D не отличает выдачу usr-D. В том же «Дано»
      материализована выдача ПЧ классу anonymous, а вошедший несёт класс anonymous (Р2).
      Поэтому положительные ответы для usr-D на X и …01/app истинны и без выдачи usr-D, и
      при её неработающей материализации. Отрицания (Y, …02/app → false) тогда неотличимы от
      «выдачи нет» (change-graph.md §6). Живость Y не показана ни одним положительным
      ответом. Держатель #857 требует законного близнеца allInScope. Нужно: половина usr-D —
      в мире без выдачи ПЧ (или на отдельном реестре); близнец 1 — та же выдача usr-D, X и
      …01/app → true; близнец 2 — та же роль usr-D с целью allInScope на prj-A, Y → true.
      Отличие каждого — один факт.

important_non_blocking:
  - id: M1
    kind: FORMAT
    note: >-
      Абзац «Сужение по цели» (324-328) и инвариант 7 говорят «на потомков X — только если тип X
      объявлен», не уточняя, для какого субъекта. У класса потомки достижимы через
      public_reader, у человека — только ветвью выдач при правиле роли над типом-ребёнком.
      Назвать оба пути явно — иначе #857 читается двояко.
  - id: M2
    kind: COVERAGE
    note: >-
      Инвариант 7 — «ни в одной форме решения», а SC-68 утверждает прямую форму и
      BatchCheck. Перечень relverdict (list.go, тот же fact_atom) не назван: либо сузить
      формулировку, либо добавить «И» перечня.
  - id: M3
    kind: COVERAGE
    note: >-
      SC-65 «Выдача человеку отказа не получает» — утверждение без сценария. Добавить «И»
      с субъектом usr-D на том же теле (после B2) → принято.
  - id: M4
    kind: FORMAT
    note: >-
      П6: «Владелец usr-A регистрирует их через InternalIAMService.RegisterResource». Этот
      вызов делает служба-владелец по внутреннему ребру; usr-A — поле владельца. Сказать так,
      как в register_resource_integration_test.go.

