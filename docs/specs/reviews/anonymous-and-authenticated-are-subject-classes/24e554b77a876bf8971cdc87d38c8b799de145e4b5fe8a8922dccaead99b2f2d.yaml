blocking:
  - id: N1
    kind: NEGATIVE
    scenarios: [Р9 «Сужение по цели», SC-65 близнец, SC-61]
    note: >-
      Дельта (строка 339) записала: системный класс достаёт до потомков объявленного
      контейнера через public_reader, «правило роли над типом-ребёнком для этого не
      требуется». Близнец SC-65 (строка 1188) это закрепляет: выдача анониму роли
      rol-proj-reg-read (правило над iam.project и registry.registries, без
      registry.repositories) на X принимается. По «Способу» такая выдача пишет public_reader
      на X. Следствие: выдача классу роли, которая репозитории не покрывает (в том числе
      rol-reg-get — только get над registry.registries), открывает анониму get и list на
      каждом репозитории реестра. Это противоречит решению владельца 1 (строка 298:
      «держатель registries:get репозитории сегодня не читает и читать не начинает») и
      расширяет поверхность сверх названного в абзаце «Расширение поверхности названо»
      (ban18-q-security). Отрицания на это нет ни в одном сценарии. Нужно (рекомендация):
      public_reader пишется, только если правило роли покрывает тип-ребёнок объявленного
      контейнера, — это симметрично узкому охвату SC-65. Добавить отрицание: выдача анониму
      rol-reg-get на X материализована → get и list на …01/app → false; близнец — SC-60
      (роль registry.public.read), отличие — одно: покрывает ли правило роли тип-ребёнок.
      Строку 339 и «Способ» привести к этому. Если диспетчер решит иначе (класс достаёт до
      потомков при любой роли чтения), это расширение нужно назвать в абзаце о поверхности
      и как исключение из решения владельца 1.

