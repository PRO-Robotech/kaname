important:
  - id: N1
    kind: FORMAT
    note: >-
      Р11 п. 2 (б): «модуль правила … равен модулю типа либо `*`». У заведённого правила модуль
      `*` невозможен — ruleModuleRe `^[a-z][a-z0-9-]*$` (rule.go:62); `*` живой лишь в
      скомпилированных правах роли без правил, которые судятся тем же сравнением. Не неверно
      (ворота строже), реализации учесть, что ветвь «модуль `*`» у правил недостижима.
  - id: N2
    kind: FORMAT
    note: >-
      SC-81 «И (право выдавать — раньше)»: «тем же текстом, что первая строка SC-28» — у первой
      строки SC-28 дословного текста нет («текст не называет роль»). Проба сверяет текст с
      захваченным ответом первой строки SC-28 (производитель один — requireGrantAuthority);
      форма та же, что одобренная у SC-78 «И».
  - id: N3
    kind: FORMAT
    note: >-
      Строка Д4 в разделе «Редакция 5: что исправлено» (строка 2429) по-прежнему говорит
      «недостижима через Create». Это запись истории о решении того круга; исправление названо
      строкой истории редакции 17. Не блокирует.
  - id: N4
    kind: CONSTRUCTIBILITY
    note: >-
      В посеве исход Check(usr-C, registry X) = true снят после трёх выдач (а, б, г) разом;
      к И2 он отнесён рассуждением (И покрывает только репозитории, г — другому человеку).
      Проба S7 строит «И (правило над контейнером)» своим случаем с одной выдачей — DoD это уже
      требует («каждая строка «И» — своим случаем»).

