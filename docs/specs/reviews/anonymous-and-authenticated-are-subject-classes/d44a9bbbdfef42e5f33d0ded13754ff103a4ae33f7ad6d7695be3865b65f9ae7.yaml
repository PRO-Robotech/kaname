delta_check:
  - item: B1 [NEGATIVE] — путь «кластер + вся область + роль модуля с именами»
    result: >-
      Исполнено вариантом (а). Р11 п. 2 (б) судит цель «вся область» по правилам роли —
      верхнего уровня и вложенным (модуль вложенного — у владельца; rule.go:45 «У вложенного
      правила Module пуст»), любым селектором; у роли без правил — по скомпилированным правам.
      Р11 п. 4 переписан перебором по виду цели и уровню области; каждая координата перебора
      подтверждена чтением @a176c3768: system_class_gates.go:83-100 (:96 — условие кластера),
      :145 (ворота контейнера выходят при пустом перечне), role_scope.go:97-101 (системная
      роль назначаема везде), moduleroles/apply.go:453 (IsSystem: true), helpers.go:357-380
      (HasAnchorRule), structural_gates.go:123 (Gate 3 — только по объектам цели),
      role/update.go:142-147 («System role is read-only»), manifest/roles.go:158
      (ErrRoleRuleForeignModule). Путь расширения роли модулем после выдачи назван явно, не
      молчанием: роль модуля меняет только тот же модуль, что объявил ключ.
  - item: SC-81 — главная строка, пять строк «И», близнец
    result: >-
      Порядок ворот, на который опирается строка «якорь и вложенное правило», есть в дереве:
      create.go:258 requireGrantAuthority → :265 структурные → :271 validateSystemClassGates →
      :284 validateGlobalAllSelector. Ворота вложенных правил (system_class_gates.go:69,
      systemClassNestedRuleGate) стоят раньше и роль registry.reader на П6 пропускают — посев
      дошёл до правила кластера. Каждая строка «И» отличается от «Когда» одним фактом (роль,
      субъект, класс, отправитель); близнец — ключ. Тексты отказа ветви (б) — свои, с
      ролью и типом; правило выбора называемого типа задано (Р11 п. 5).
  - item: решения диспетчера по вопросам автора
    result: >-
      Строгая форма для вложенного правила при «вся область» — в Р11 п. 2 (б) и строке SC-81
      «И (якорь и вложенное правило)». Выдача ролью с именами на кластере с целью-объектами
      отдельным предметом не открыта; при ключе её судит ветвь (а).
  - item: регрессии — исходы SC-01…80
    result: >-
      Не изменены. SC-28 строится на П1 ролью vpc.network.view (тип vpc, ключа у vpc нет) —
      ветвь (б) его не задевает, отказ правила кластера прежний. SC-19, SC-24 — ворота вида
      цели раньше S7. SC-60/65/73/78/79 — цель-объекты, ветвь (а) прежняя. SC-40 (Р8) — не
      глагол создания. Сценариев 71: grep -c '^#### SC-' @71cf3d8cf → 71 (SC-01…45, 50…53,
      60…81), совпало с разделом «Редакция 17».
  - item: R1 [CONSTRUCTIBILITY] прошлого круга
    result: >-
      Закрыто: фраза П7 приведена к require.NotEmptyf (строка 165), положительный контроль по
      каждому типу и по ролям И, И2 — пункт DoD S7.
  - item: Р5, SC-19, SC-28, строка производителя SC-20, 28 — к дереву
    result: >-
      Утверждения о недостижимости выдачи классу на кластере переписаны: SC-28 утверждает
      отсутствие положительного близнеца на посеве П1, а не в дереве; путь роли модуля назван
      и показан посевом. DoD S7 обязывает привести к факту шапку ворот
      (system_class_gates.go:18-22) и имя пробы
      TestSystemClass_SC28_ClusterGrantToAClassIsUnreachableByCreate (system_class_s2_integration_test.go:365) тем же изменением.
  - item: идентификаторы ролей
    result: >-
      printf %s <имя> | md5sum | cut -c1-17 → registry.repo_reader_named rol753025eda7953ac9c,
      registry.reg_reader_named rola8923748827353a58, registry.reader rolb812261cfaa239694 —
      совпало с документом и с выводом посева.
  - item: критерии ban #18 (производительность ветви (б))
    result: >-
      Пределы подтверждены: domain.MaxRules = 64 (rule.go:55), maxRuleElems = 16 ресурсов на
      правило (rule.go:51).

