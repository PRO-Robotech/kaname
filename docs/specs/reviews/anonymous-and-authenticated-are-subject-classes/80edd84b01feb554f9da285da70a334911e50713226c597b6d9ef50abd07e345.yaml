    снята для публикаций): пробы пакета зелёные, посев рецензента красный в 3 из 3
    отказных случаев. Integration kaname (Docker) не посеяна — «не выполнилось»; путь
    порт → Check рецензент прочитал, а не прогнал. Копия снята.

