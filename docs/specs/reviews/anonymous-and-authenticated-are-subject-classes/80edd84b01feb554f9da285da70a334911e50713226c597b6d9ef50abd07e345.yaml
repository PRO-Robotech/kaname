delta_check:
  - item: SC-74 — приём слова класса, тот же вызов порта, ответы Check
    result: >-
      Подтверждено. Corelib policy.go@7ffb6873c: publicReadSubjects = [user:*,
      system_class:anonymous]; IsPublicReadGrant — один предикат для приёма, применения и
      снятия (IsProxyWritable). Kaname handler.go@e36fd21a6: validateProxyTuple:176,
      вызовы :199 и :224. governance_ports.go:98 — ApplyTx(objectType, objectID, published,
      version), субъекта в сигнатуре нет. «И» по Check держится составом: unit
      AnonymousWordIsAPublication показывает тот же вызов порта, integration SC12_SC13
      показывает путь порт → Check словом user:*. Довод верен (см. R1).
  - item: SC-75 — снятие крест-накрест; кэш вердиктов
    result: >-
      Подтверждено. PublicationWordsShareOneStoredForm проверяет оба направления на одном
      объекте порта. Отсутствие кэша у решения службы перемерено: git grep -n -i cache
      @e36fd21a6 по relverdict, api/authorize и authorize_service.go без проб → 1 строка,
      grantarm.go:199, комментарий о плане запроса. Осмотрено 16 файлов (15 в двух каталогах
      плюс authorize_service.go). Кэш края — kacho gateway/internal/middleware/authz_cache.go:48
      newDecisionCache, хранит только allowed=true. Срок его жизни держит SC-34.
  - item: SC-76 — отказы с близнецами
    result: >-
      Строки (а)–(ж) и «домен неизвестен» держатся corelib@7ffb6873c и kaname. Строка (з)
      меняет против SC-74 два факта — B1.
  - item: SC-77 — переходный срок user:* и предикат его снятия
    result: >-
      Часть «сейчас» держит TestPublicReadSubjects_ClosedList. У конца перехода нет
      носителя (B2), а его предикат недостижим (B3).
  - item: «Что НЕ входит» п. 2, опора о соседе, SC-12, SC-67, SC-15, инвариант 8, DoD S6, история
    result: Исполнено. Строка истории об одобрении редакции 12 соответствует существующей записи bd6325e3….yaml.

blocking:
  - id: B1
    kind: TWIN
    title: >-
      SC-76 (з) «объект чужого домена» меняет два факта; отказ по домену вызывающего
      для пары публикации не держит ни одна проба
    finding: >-
      Строка 1517: вызывающий registry, объект vpc_network:net1. Против SC-74 изменились и
      домен, и тип: vpc_network не входит в publicReadObjectTypes. Отказ даёт уже
      publicReadAllowed (policy.go:444), до привязки к домену (:452). Инъекцией это
      проверено на копии corelib@7ffb6873c: в policy.go:452 условие заменено на `if
      callerDomain != "" && hierarchical`, то есть привязка к домену снята для публикаций.
      После этого весь пакет authz/proxytuple зелёный, кроме посева рецензента: красных 0
      среди собственных проб. Посев рецензента — ValidateTuple("vpc", "system_class:anonymous",
      "v_get", "registry_repository:r1"); до инъекции → refused, после → accepted. Без
      инъекции принимается только вызывающий registry, а vpc и nlb, со словом класса и с
      user:*, получают отказ. Значит, продукт верен, но пункт 3 задания («чужой домен →
      PermissionDenied») в этой приёмке не держит ни одна проба. В kaname таких троек тоже
      нет: git grep по *_test.go @e36fd21a6, где вызывающий vpc/compute/nlb/storage, а
      объект registry_repository, → 0.
    fix: >-
      В SC-76 добавить строку, которая меняет ровно один факт — домен вызывающего: учётка
      службы vpc (домен vpc), system_class:anonymous, v_get, registry_repository:r1 →
      PERMISSION_DENIED `permission denied`. Близнец — SC-74. Строку (з) переименовать в
      «тип чужого домена (не публикуемый)». В строке производителя SC-76 назвать держателя:
      строку пробы в corelib TestValidateTuple_PublicReadAcceptsTheAnonymousClass (и
      user:* — в TestValidateTuple_PublicReadIsWildcardOnly) либо в kaname
      TestRegisterResource_PublicationAcceptsTheAnonymousClass. Держателя заказать задачами
      #116/#893, это добавка только в пробы.
  - id: B2
    kind: PRODUCER
    title: шаг снятия user:* из перечня отнесён к kaname#836, а DoD #836 его не содержит
    finding: >-
      Строки 1538-1542 и 1594. «Снятие слова — заказано (kaname#836)». Предмет #836 —
      снять перевод user:* → system_class и прозу примечаний в сборщике модели
      (internal/modelcompose, internal/modelrender). Её DoD не упоминает ни
      proxytuple.publicReadSubjects, ни пин corelib, ни отказ RegisterResource(user:*).
      Документ сам называет отнесение допущением. В итоге у «после снятия → PERMISSION_DENIED»
      и у перечня из одного слова нет носителя, который этот шаг несёт. Переходный приём
      остаётся без ответственного (ban11-three-outcomes).
    fix: >-
      Выбор за диспетчером, вопрос автора. Рекомендация совпадает с авторской (б): завести
      задачу в PRO-Robotech/corelib — исключить user:* из publicReadSubjects, Blocked by
      kacho#3287. Связанная с ней задача kaname — поднять пин, проба отказа user:* с
      близнецом словом класса. Номер вписать в SC-77, в строку производителя SC-77 и в DoD
      S6 вместо #836. Вариант (а) годен только тогда, когда этот шаг дописан в DoD #836.
  - id: B3
    kind: CONSTRUCTIBILITY
    title: условие конца перехода в SC-77 недостижимо
    finding: >-
      Строка 1537: снятие ждёт, пока `git grep -n 'user:\*' -- . ':!docs/archive'` в kacho
      даст 0 «по написанию и по предмету». Замер на kacho a952484649: 135 строк в 54 файлах.
      Большинство относится не к слову публикации, а к подстановке cluster:<root>#viewer@user:*
      бутстрапа кластера и к гейтам, которые её читают: gateway/internal/middleware/authz.go:80,
      :960, :1138; internal/repohygiene/membershipreadrelation.go:69 mrrWildcard;
      services/storage/cmd/storage/permission_map_test.go:323-505; порождённые
      *_grpc.pb.go; proto/corelib/authz/v1/authz_options.proto:168. Слово публикации
      реестра — 7 строк FGASubjectPublicWildcard в services/registry. kacho#3287 эти строки
      не трогает, и ноль по написанию недостижим. Условие не наступит, и переход не
      закончится; либо его «закончат» удалением чужих гейтов. Предикат взят из DoD
      kacho#3287, но здесь он утверждается этим документом.
    fix: >-
      Условие снятия задать предикатом по предмету — слову публикации. Пример:
      `git grep -n 'FGASubjectPublicWildcard' -- services/registry` в kacho → 0 (сегодня 7)
      плюс кортеж публикации службы реестра несёт system_class:anonymous (проба #3287).
      Отдельно — kacho#3287 влита и выкачена. Предикат DoD kacho#3287 по всему дереву
      поправить в самой #3287, это не предмет приёмки (см. R3).

