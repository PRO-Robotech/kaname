  producer_named: 46 of 46
  twin_named_for_negatives: все, кроме SC-52 (неблокирующее)
  blocking: 5
  blocking_kinds: [NEGATIVE, CONSTRUCTIBILITY, COVERAGE, FORMAT, DoD]

blocking:
  - id: B1
    kind: NEGATIVE
    scenarios: [Р6, SC-30, SC-35, SC-36]
    note: >-
      Р6 даёт значению пола «0» новый смысл — «метод допускает вызывающего без личности». В
      фундаменте, который судит пол на обоих краях, «0», пустое значение и любое нераспознанное
      значение сегодня РАВНЫ: corelib v1.14.0 `acrlevel/acrlevel.go`, `Rank` — `case "0", "":
      return 0`, `default: return 0`; `Satisfies` трактует ранг 0 как «пола нет». В каталоге края
      kacho @2ec6e1e3d 29 из 359 строк несут пустой пол (разбор
      `gateway/internal/middleware/embed/permission_catalog.json`, поле `required_acr_min`), а
      шапка `PermissionRequirement` в `stepup_gate.go` прямо называет пустое значение «без
      требования». Документ не говорит, что допуск анонима различает буквальное «0» и пустое
      или неизвестное значение, и не несёт сценария, где строка с ПУСТЫМ полом при выдаче
      анониму отвергает его до решения. Реализация по рангу — естественная по фундаменту —
      открыла бы анониму решение на каждой строке без пола. Перепись SC-36 считает только
      написание `required_acr_min) = "0"` (→ 0) и слепа к предмету: по рангу таких строк 29
      (ban19-number-two-predicates). Нужно: (1) в Р6 — допуск анонима объявляется только
      буквальным значением, отличимым от пустого и неизвестного, и где это различение живёт;
      (2) новый отрицательный сценарий — строка с пустым полом, выдача анониму, запрос без
      `Authorization` → `401` до решения, вопрос к модели не задан; близнец — SC-30 (один факт:
      пустой пол против «0»); (3) в SC-35 — вид (г) нераспознанное значение пола; (4) перепись
      SC-36 двумя предикатами: по написанию и по рангу, с числом каждого.
  - id: B2
    kind: CONSTRUCTIBILITY
    scenarios: [П3, SC-30, SC-31, SC-32, SC-33, SC-34, SC-35, SC-38]
    note: >-
      П3 не строится в названной форме. `fixture.v1.ThingService` в kacho нет:
      `git grep -l 'fixture\.v1\|ThingService' 2ec6e1e3d -- gateway` → 0 файлов. «Ответчик
      модели — настоящий kaname на базе П1»: П1 строят фикстуры kaname из `internal/testsupport`
      (`iampgtest`, `rightsfixture`, `momentclock`), а пакеты `internal/` другого модуля Go не
      импортируются; ни одна проба края kacho живого kaname не поднимает:
      `git grep -l 'kaname/internal' 2ec6e1e3d -- 'gateway/**/*_test.go'` → 0. Нужно назвать
      строимую форму и её координату: например, образ kaname в testcontainers с посевом П1
      через публичные глаголы, либо разнести утверждения — семантика классов доказывается в
      kaname (S1), край — против ответчика, записывающего заданный ему субъект (тогда SC-30/34
      утверждают субъект вопроса и исход края, а не решение модели).
  - id: B3
    kind: COVERAGE
    scenarios: [Р5, П1, SC-01, SC-10, SC-11, SC-51]
    note: >-
      Граница класса `authenticated` между арендаторами не закреплена. В П1 не сказано, к
      какому аккаунту относится `usr-B`; нет сценария, где человек и сервисная учётка ДРУГОГО
      аккаунта (`acc-B`) читают по выдаче `authenticated` из `acc-A`. Р5 разрешает
      `authenticated` цель `allInScope` на проекте и аккаунте по праву владельца арендатора:
      тогда будущие объекты области сами становятся читаемыми для принципалов всех аккаунтов
      кластера — то самое следствие, которым документ обосновывает запрет `allInScope` для
      `anonymous` (SC-24). Расширение поверхности не названо (ban18-q-security), а
      предупреждение консоли SC-51 есть только у анонима. Нужно: сценарий с принципалом `acc-B`
      (положительный или отрицательный, по решению) и явное решение о `allInScope` у
      `authenticated` вне кластера — с отрицанием и близнецом, если оно сужается. Вопрос
      вынесен диспетчеру.
  - id: B4
    kind: FORMAT
    scenarios: [SC-09, SC-16, SC-26, SC-39]
    note: >-
      У этих сценариев «Тогда» не задаёт наблюдаемого исхода, на котором проба могла бы упасть.
      SC-09: не названы RPC, тело и текст или поле отказа `INVALID_ARGUMENT`. SC-16: «ответ
      совпадает с сегодняшним» — не названы ни поле, ни значение. SC-26: «отказ пола «2» в
      сегодняшней форме края» — для integration-пробы kaname нужны код и причина. SC-39:
      отказ записи в `r1` — без кода. Нужно: код и содержимое `details` либо дословный текст.
  - id: B5
    kind: DoD
    scenarios: [SC-53, SC-01…09, SC-17, SC-40, S2]
    note: >-
      SC-53 не входит в DoD ни одной стадии: S4 требует playwright только на SC-50…52. Сценарии
      края kaname в S1 (SC-01…09, SC-17, SC-40 — все через `/iam/v1/…`) не имеют newman-кейса,
      а S2 требует лишь «≥ 1 положительный и ≥ 1 отрицательный». Канон —
      `testing-newman.md#edge-is-newman` и ban12-second-echelon: каждому сценарию края —
      newman-кейс; невидимое краем — integration с названной причиной по каждому ID
      (`#edge-internal-consequence`). Нужно: DoD по каждому ID стадии.

