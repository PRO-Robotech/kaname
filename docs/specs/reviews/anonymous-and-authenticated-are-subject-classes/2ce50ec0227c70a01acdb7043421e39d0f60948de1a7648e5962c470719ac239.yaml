      (kacho `services/registry/internal/apps/kacho/config/config.go:422`) — назвать оба.
  - kind: PRODUCER
    note: >-
      SC-43 «факты модели»: системная выдача несёт строку в `access_binding_emitted_tuples`
      (`0001_initial.sql:3161`, `fga_user = 'user:*'`) — назвать таблицу в переписи переезда.
  - kind: SCOPE
    note: >-
      У kaname нет `docs/specs/04-roadmap…`; объём закреплён решением владельца 2026-10-15
      дословно и разделом «Что НЕ входит» — как у соседних приёмок kaname. Не блокирует.

