findings:
  blocking: []
  non_blocking:
    - id: 1
      kind: FORMAT
      where: 'IC-SECRET-13 (б), близнец; IC-SECRET-04, первое Then'
      statement: >-
        Близнец 13 (б) ждёт 409 с текстом этой полосы (04), но 04 текста не называет — только
        пару 409 / ALREADY_EXISTS. Существующий случай IAM-IC-CR-CONF-DUP-NAME судит сообщение
        по подстроке already exists (iam-interactive-client.py:306). Назвать текст в 04 или
        сослаться на этот случай, иначе проба близнеца выберет текст сама.
    - id: 2
      kind: CONSTRUCTIBILITY
      where: 'IC-SECRET-13 (б), Given'
      statement: >-
        Маркер M обязан не начинаться с Illegal argument: MapRepoErr переводит такой текст в
        INVALID_ARGUMENT раньше ветки по умолчанию (shared/errors.go:127). Иначе проба на
        верном продукте получит не 500. Назвать это условие в Given.
    - id: 3
      kind: CONSTRUCTIBILITY
      where: 'IC-SECRET-03, держатель G; DoD п.4'
      statement: >-
        На ветке отказа вставки глагол Create зовёт releaseProviderClient (usecases.go:282), а
        исполнитель own на снятии — ClearClientSecretVerifier (own_interactive_client_provider.go:167),
        то есть пишет колонку материала на пути заведения. Гейт, считающий любую запись колонки,
        покраснеет на верном дереве. Назвать предмет гейта точнее: установка непустого
        проверочного значения, а не его снятие.
    - id: 4
      kind: SCOPE
      where: '§3, строка об обмене без имени клиента; IC-SECRET-06, предпоследнее And'
      statement: >-
        Текст LINE-A-1-12 — обмен без клиентской аутентификации даёт 401, и RFC 6749 §5.2 относит
        отсутствие аутентификации клиента к invalid_client. Отнесение формы без имени клиента к
        отказу формы — чтение одобренного документа, а не его решение. Оно совпадает с держателем
        LINE-A-1 (TestLINEA1_12 шлёт client_id в форме) и с исходом продукта (400 измерено).
        Сказать, что это чтение держателя LINE-A-1, а вопрос, если он возникнет, — к LINE-A-1.

