    kind: TWIN
    closed: true
    evidence: >-
      Черновая проба в выгрузке origin/425 в каталоге сессии, над миром интеграционных проб
      cmd/kaname (Postgres в контейнере, миграции ветки, провязанная церемония, секрет клиента
      посеян тем же хешером). Форма 06 без client_id и с Basic верной пары — 200 и предъявитель.
      Ветка (а): заголовка нет, client_id клиента в форме, секрета нет — 401, тело
      {"error":"invalid_client"}, WWW-Authenticate Basic realm="token". Форма без заголовка и без
      client_id — 400 {"error":"invalid_request"}. Ветка (б): Basic с одним изменённым знаком —
      401 invalid_client. Basic никогда не заводившегося clientId — 401 invalid_client. Тела и
      заголовок WWW-Authenticate у (а), (б) и незаведённого клиента побайтово равны. Там же
      TestLINEA1_10 и TestLINEA1_12 ветки 425 — обе PASS.

