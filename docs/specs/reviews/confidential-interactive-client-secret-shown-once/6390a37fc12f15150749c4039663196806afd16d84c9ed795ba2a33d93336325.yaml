    перепрогнаны, выводы совпали: ownPublicClientAuthMethod — 3; адаптер поставщика — 1;
    SetClientSecretVerifier в не-тестовом Go — 3; secret в двух proto ресурса — 0;
    secret_bearing — 7; записей перечня подметальщика — 2 (secret_backstop.go:124, :125); audit —
    0; GetResponse().UnmarshalTo — 1 (name_canon_test.go:33) на 366 и 1 на 425; перепись шире
    (файлы Go вне сгенерированного, разбирающие Any и называющие InteractiveClient) — тот же один
    файл на обеих ревизиях; kaname#405 в tests и .github на 425 — 8, узкий предикат DoD п.8 —
    8 на 425 и 0 на 366; body_client_id=True — 1 на 425 (kaname-authorization-code.py:729) и 0
    на 366. Чтением сверены: GOOD_REDIRECT (iam-interactive-client.py:104) равен R; ветка отказа
    Create (usecases.go:254-258, :282-283) отвечает синхронно и помечает операцию ошибкой;
    MapRepoErr (shared/errors.go:125, :134) — фиксированный internal error; UpdateMask фундамента
    и builder InvalidArgument (текст invalid argument); InvalidArg службы (errdetails.go) и
    нормализация пути маски; LookupClient ветки 425 (выбор по колонке client_id, признак
    публичности по способу); разбор доказательства клиента в token.go ветки 425 (строки 96-121)
    и в движке фундамента (client_authentication.go, clientCredentialsFromRequest); сверка
    ClientSecrets и проверяющего на пустом предъявленном значении (исход mismatched); FK кодов и
    согласий на interactive_clients — ON DELETE CASCADE (снятие в 10 не упирается в код).
