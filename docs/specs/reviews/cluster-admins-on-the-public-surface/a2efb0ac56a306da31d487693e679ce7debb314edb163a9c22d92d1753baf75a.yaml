round1_blocking_resolution:
  - kind: CONSTRUCTIBILITY
    scenario: CAP-03
    status: resolved
    measured: >-
      `invite.go:334-335,530-568` — Invite принимает displayName, валидация длины 1..128
      (`domain/types.go:173`), строка PENDING несёт имя; регистрация полосой по адресу
      приглашения строку не активирует (`mirror_tx.go` RegisterMirrorTx), активация в исходе
      подтверждения зовёт `ActivateInviteTx(..., "", ...)` (`mirror_tx.go:511`), а оператор
      `COALESCE(NULLIF($2,''), display_name)` (`user_repo.go:678`) имя сохраняет.
      Регистрация с displayName отвергается (`loginlanehttp/register_test.go:104-106`),
      UpdateUserRequest — только labels (`user_service.proto:575`). «Непусто» утверждается
      отдельно до равенства; посев утверждает имя до выдачи ключа.
  - kind: CONSTRUCTIBILITY
    scenario: CAP-24
    status: resolved
    measured: >-
      Отрицание несёт один субъект `sva-nogrant`: ffbe930dbe `prodseed_matrix.py:671,873,945`
      (`subject(acctA, "ps-nogrant-…")` — служебная учётка, от порога освобождена);
      `principal_pairings.py:119`. Модель: `define system_admin: [user, service_account]`
      прямое, `system_viewer` его не выводит — 403 производится пообъектным вопросом края.
  - kind: FORMAT
    scenario: CAP-26, CAP-28
    status: resolved
    measured: >-
      CAP-26: 404 + application/json + {code:5,"Not Found"} от publicMux, второго производителя
      нет — ffbe930dbe `restmux/mux.go:1020-1046`, `external_isolation_test.go:181`,
      `external_refusal_shape_test.go:18`. CAP-28: Дано/Когда/Тогда, субъект — фикстура
      `registerAndSignIn` (`ui-future/e2e/specs/deny.spec.ts` и др.), один исход: блок
      `cluster-admins-forbidden` на 401|403 (`ClusterAdminsPage.tsx:68-71,195-200`), кнопки
      `cluster-admins-grant-button`/`cluster-admins-revoke-*` рендерятся только в ветке
      `cluster-admins-page` (:172,217,223). Выделенный сценарий получил CAP-30 — ID стабильны.
  - kind: FORMAT
    scenario: CAP-14
    status: resolved
    measured: >-
      Вторая выдача — `target`, назначенная первым шагом этого же кейса; близнец снимает
      `target`; засеянные выдачи и ADMIN_SLOTS не трогаются.

