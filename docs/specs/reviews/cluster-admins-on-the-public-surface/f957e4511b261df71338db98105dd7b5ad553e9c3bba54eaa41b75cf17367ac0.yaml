blocking:
  - kind: CONSTRUCTIBILITY
    scenario: CAP-03
    claim: >-
      Единственный чёрный ящик, держащий Н1, утверждает `subjectDisplayName` равным
      отображаемому имени `target`. Ни «Дано», ни §4 не требуют у `target` НЕПУСТОГО
      имени и не называют его производителя. Умолчание колонки — пустая строка, посев
      имени не задаёт: на засеянном `target` обе стороны равенства пусты, и утверждение
      зелено без правки Н1 — неотличимо от «поле не заполняется».
    measured: >-
      `internal/migrations/0001_initial.sql:3102` — `display_name text DEFAULT ''::text NOT NULL`;
      `git grep -c display -- tests/authz-fixtures/seed_ceremony.py` → 0 совпадений;
      транспорт `handler.go` `clusterAdminEntryToProto` поле не переносит (Н1 подтверждена).
    fix: >-
      В «Дано» CAP-03 и §4: `target` несёт непустое отображаемое имя с `{{runId}}`,
      названо, каким глаголом посева оно задаётся; утверждать `subjectDisplayName` ==
      это значение И непусто.
  - kind: CONSTRUCTIBILITY
    scenario: CAP-24
    claim: >-
      Отрицание «`h-plain/2` либо иной арендатор без права → 403». На крае платформы
      человека уровня «2» нет (документ сам, CAP-25, `prodseed_matrix.py`), а человек без
      `acr` получает от `StepUpGate` 401 раньше пообъектного вопроса (порог «1» у чтения,
      «2» у назначения) — заявленного 403 не производится. 403 достижим только для
      машинного субъекта без права (освобождён от порога). Дизъюнкция «либо» оставляет
      выбор, при одной ветви которого «Тогда» ложно.
    measured: >-
      corelib@v1.11.0 `grpcsrv/acr.go:171` EvaluateStepUp: освобождён только
      PrincipalTypeServiceAccount, иначе `acrlevel.Satisfies(presented, required)`;
      платформа ffbe930dbe `prodseed_matrix.py:352-357` — обменянный токен человека `acr`
      не несёт, край отвечает отказом порога.
    fix: >-
      Назвать один субъект отрицания — машинного арендатора без кортежей на `cluster`
      (слот платформы назвать), утверждать 403/PERMISSION_DENIED и отсутствие цели в
      перечне; различающий факт против `m-admin` — наличие кортежа `system_admin`.
  - kind: FORMAT
    scenario: CAP-26, CAP-28
    claim: >-
      CAP-26 «Тогда»: «отказ формы, которую проба изоляции края утверждает…, не 200» —
      ни кода, ни тела; «не 200» проходит на любом отказе, включая 403 владельца.
      CAP-28: «кнопок не видит ЛИБО получает отказ словами» — исход по неопределённости;
      у сценария нет Дано/Когда (только «Тогда»), субъект «пользователь без права» не назван.
    measured: >-
      ffbe930dbe `gateway/internal/restmux/external_isolation_test.go` — проба судит
      код 404 (строки 210, 238); конкретный статус в CAP-26 не назван.
    fix: >-
      CAP-26: конкретный HTTP-статус и тело промаха внешнего края. CAP-28: разбить на
      Дано/Когда/Тогда, назвать субъект, выбрать ОДИН исход (кнопок нет) либо два
      сценария с названными условиями.
  - kind: FORMAT
    scenario: CAP-14
    claim: >-
      Положительный близнец «`h-admin/2` снимает другого активного администратора —
      успех» не называет, кого. На стенде службы активны машинная выдача `m-admin`
      (миграция) и выдачи соседних слотов `ADMIN_SLOTS`; снятие любой из них ломает
      остальные кейсы набора и соседние наборы. Предпосылка «не менее двух активных
      выдач, одна — h-admin» тоже не называет вторую.
    measured: >-
      `0001_initial.sql:3418` — посеянная выдача служебной учётки; `seed_ceremony.py:175`
      ADMIN_SLOTS — восемь соседних людей с выдачей.
    fix: >-
      Назвать: вторая выдача — `target`, назначенная в «Дано» этим же кейсом; близнец
      снимает `target`.

