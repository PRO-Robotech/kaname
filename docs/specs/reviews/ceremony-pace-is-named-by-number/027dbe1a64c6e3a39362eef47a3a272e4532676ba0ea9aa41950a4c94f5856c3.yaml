constructibility:
  seeded: 6
  of: 7
  not_executed: 0
  detail: >-
    Посеяно в мире и зелено сегодня: близнецы 43 а (:168), 43 б (RQ, :153–154), 43 в (подтест
    «близнец: отсечка раньше аутентификации»), 44+ (:329), держатель 45 с сессией (LINE-A-1-04).
    Given отрицаний 43 а, 43 в и 44 строятся: тот же мир сегодня даёт 401 на тех же запросах
    (LINE-A-1-03, подтест отсечки после аутентификации, LINE-A-1-08). Значит, это честный
    красный до кода. Счётчик 43 на seedA строится (+1). Счётчик 44 на seedA НЕ строится:
    шов входа посева — silentAuthority (authorize_test.go:71), он всегда отвечает «сессии нет».
    Исход step-up на нём недостижим (посеяно: +0).

findings:
  blocking:
    - id: 1
      kind: CONSTRUCTIBILITY
      severity: medium
      where: 'KN-PACE-44, последнее «And»; таблица производителей, строка «43, 44 (перепись)»'
      statement: >-
        «На посеве обработчика тот же исход растит authorize-step-up-required ровно на 1».
        Производитель назван: проба на seedA (pace_test.go, outcome :192). Но шов входа seedA —
        silentAuthority (pace_test.go:119), и сессия уровня "1" на нём не существует. Исход
        step-up там недостижим при любой реализации Р11. Нужно назвать посев обработчика, шов
        входа которого отвечает сессией уровня "1" (как он строится — тоже назвать). Другой путь —
        перенести утверждение счётчика 44 в фикстуру, которая его строит. Тот же вопрос
        касается счётчика 43 в: на seedA сессии нет, и строка в становится строкой а.
  non_blocking:
    - id: 2
      kind: FORMAT
      severity: low
      where: 'журнал редакций, ред. 4'
      statement: >-
        «Его имя в сценариях — «ответ без сессии» вместо «ответ без сессии»». Прежнее имя —
        «ответ LINE-A-1».
    - id: 3
      kind: FORMAT
      severity: low
      where: 'посев Ц'
      statement: >-
        «`R2` и `RQ` = …/auth/cb?tenant=a» читается так, будто оба адреса — один. R2 =
        …/auth/other (world :159).
    - id: 4
      kind: FORMAT
      severity: low
      where: '§1.6, кейс newman'
      statement: >-
        `kaname-authorization-code.py:627`: id кейса стоит на :626.

