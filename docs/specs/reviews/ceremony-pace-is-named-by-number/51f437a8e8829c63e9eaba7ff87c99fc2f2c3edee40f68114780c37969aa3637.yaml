constructibility:
  seeded: >-
    Посев во временном рабочем дереве на 22e6cd5ce, снят после прогона. Состав: обработчик
    ветки с потолком 32; настоящий exchangepace (5 в секунду, управляемые часы) в дублёре
    проверяющего с бронью и возвратом, как paced в verifier.go; дублёр выдачи, удерживающий
    клиентов H*. Там, где Р3 ставит П3 (после вида выдачи, до П1), стоит МОДЕЛЬ П3 по Р3, Р5 и
    §3: решение при входе, рост по исходу, 50 за 15 мин, Retry-After до предела минус один.
    Сама ось в ветке заказана. KN-PACE-25, каждая строка отдельным стендом, 50 запросов с P в
    t0 … t0+49 с. Ответ каждого и счётчик +50: а 405, б 413, в 400 invalid_request, г 400
    unsupported_grant_type, д 400 invalid_request, е 429 Retry-After 1 и client-pace-exceeded
    50, ж in-flight-ceiling-reached 50. В е перед каждым запросом с P пять принятых X с R
    получили 200. В ж 32 удержания с R дошли до выдачи до первого запроса; ответ потолка — 429
    на HEAD (503 заказан, §1.3 п.1); после снятия удержаний 32 из 32 получили 200. When в
    t0+60 с → 200 на всех семи, модель П3 не отказала ни разу. Инъекция на каждой строке —
    классификатор, засчитывающий ровно вид этой строки: When → 429, Retry-After 840, отказ П3
    ровно один, на всех семи. Близнец KN-PACE-18: 50 отвергнутых, называющих X, → 401, When →
    429, Retry-After 840. Исполнено 15 подслучаев, зелёных 15.
  carried_from_round_2: >-
    Given неизменных сценариев байт-в-байт те же, что в ред. 2, поэтому посев круга 2 на
    ad22d9fd6 к ним относится: 24, 11, 18b посеяны, 38 — рендером. Given 01, 02, 03, 04, 07,
    08, 12–16 пересобраны этим кругом 13 зелёными пробами.
  named_fixture_not_seeded: >-
    35 (изменён: строки а–г) — настоящий слушатель выдачи и тестовый УЦ, как 32–34 и 36. Без
    изменений с ред. 2: 05, 06, 09, 09b, 10, 17, 19–23, 26–31, 30b, 32–34, 36, 37, 38b, 39,
    40 — фикстуры названы в записи круга 2.
  not_executed: >-
    41, 42, 42b — подъём стенда в боевой посадке; изоляция для посева стенда в задании не
    названа. Не зачитывается ни в зелёное, ни в красное.
  counts: >-
    сценариев 47 (44 заголовка и 3 близнеца внутри сценариев: 09b, 30b, 38b). Этим кругом
    посеяно 2 (25 а–ж, 18), пробами производителя пересобрано 11, изменённый 35 держится
    названной фикстурой. Из неизменных посевом круга 2 держатся 4, названной фикстурой 26. Не
    выполнилось 3.

findings:
  blocking: []
  non_blocking:
    - id: 1
      kind: FORMAT
      severity: low
      where: 'таблица производителей, строка 42; §1.4'
      statement: >-
        «В стволе продукта счётчика по глаголу нет» неверно. На kacho origin/main @ 1d42a6728
        ряд kacho_api_gateway_login_lane_relayed_total с меткой verb есть (session_lane.go), и
        ретранслятор формы считает по глаголу (login_lane_relay.go:157). Нет записи authorize
        и цели issuance (git grep -c RelayTargetIssuance -- gateway: на стволе 0 файлов, на 2e8867d21 — 12), а у недостижимости нет
        метки target. Верно: в стволе у счётчика по глаголу нет клетки authorize, у
        недостижимости — метки цели. Направление ошибки безопасное: без 2817 шаг 42 красен,
        а не вакуумен.
    - id: 2
      kind: DoD
      severity: low
      where: '§6 S1 п.1, род «положительный близнец и утверждение отсутствия»'
      statement: >-
        25 ж стоит среди проб, зелёных до кода по построению. Но Given ж требует ответа 503 у
        каждого из 50, а HEAD отвечает 429 (§1.3 п.1; посеяно — 50 × 429). Проба, утверждающая
        свой Given, до кода красна. Строке место в первом роду рядом с 07 и 11. Другой
        вариант — проба утверждает форму ответа Given только после правки на 503; это надо
        назвать.

round_two_closure:
  blocking_1_twin: >-
    ЗАКРЫТО. KN-PACE-25 — семь строк по 50 запросов, у каждой свой исход и свой близнец
    KN-PACE-18. Разница в один факт — вид отказа; трафик R в е и ж создаёт условие отказа и
    счёт P не трогает. Посеяно: верный счёт → 200 на каждой строке, засчитывание вида строки
    → 429 и 840 на каждой (constructibility.seeded).
  non_blocking_2_to_5: >-
    Учтены все четыре: DoD S1 п.1 делит пробы на три рода (2; остаток — находка 2 этого
    круга); непустота 42 — по счётчику края, разность relayed authorize и unreachable issuance
    названа нижней границей (3); Р6 называет порядок П4 → П5 (4); в KN-PACE-35 одиннадцатый
    запрос несёт другое негодное значение, и 429 сам доказывает ключ E (5).

