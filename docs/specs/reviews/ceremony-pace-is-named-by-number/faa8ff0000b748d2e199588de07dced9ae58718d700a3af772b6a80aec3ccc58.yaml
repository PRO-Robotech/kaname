constructibility:
  seeded: >-
    Посев KN-PACE-24 во временном рабочем дереве на 5878c4779 (снято после прогона): потолок
    32, 32 принятых обмена удерживаются на выдаче, затем 50 отвергаемых предъявлений с того же
    адреса. Вывод: «ответы 50 отвергаемых предъявлений: map[429:50]; проверяющий вызван для
    отвергаемых: 0». Ни одного 401 — счёт П3 при таком порядке не набирается. Обратный порядок
    запрещён самим документом: после 50 отказов с P запрос с P получает отказ П3 до потолка
    (Р3, KN-PACE-18). Given пересобраны исполненными пробами на HEAD: 01·03 и 02 и 04 для П1
    и П2, 07/08 (удержание, потолок 1), 11, 12, 13, 14, 15, 16, 38 (накладка рендерится, проба
    красна по заказу).
  named_fixture_not_seeded: >-
    05, 06 — config.Load и cmd/kaname/registry_token_tls_test.go; 09, 09b, 10, 17 — полосы
    церемонии 40902d877 и blockingIssuer; 18–23, 25 — стенд обработчика с дублёром
    проверяющего и внедряемыми часами exchangepace.New(perSec, now); повтор отказов 401
    показывает TestInFlightSlotIsReleasedOnRefusalToo; 26–31 — authorize.go 425 с дублёром
    справочника; 32–36 — loginlanehttp/handler_test.go:130 и :146 (тестовый УЦ, лист с SAN
    края) и слушатель выдачи; 37 — сборщики витрины; 39 — helm template с
    values.prod.yaml; 40 — пробы ретранслятора края в kacho.
  not_executed: >-
    41, 42 — подъём стенда в боевой посадке; изоляция для посева стенда в задании не
    названа. Не зачитывается ни в зелёное, ни в красное.
  counts: >-
    сценариев 42; посеяно 14, из них 1 не строится как написан (24); названной фикстурой 26
    (из них 31 — того же рода, что 24); не выполнилось 2

findings:
  blocking:
    - id: 1
      kind: CONSTRUCTIBILITY
      where: 'KN-PACE-24; того же рода KN-PACE-31'
      statement: >-
        Посев Т ставит адрес P каждому запросу, если не сказано иное, а KN-PACE-24 источника 32
        удержаний не называет. Значит, удержания идут с P, и Given не строится ни при одном
        порядке. Удержания раньше отказов: посеяно, все 50 отвергаемых получили отказ
        потолка, проверяющий не вызван, 401 — ноль. Удержания позже отказов: по Р3 и
        KN-PACE-18 запрос с P получает 429 П3 и места не занимает. Исправление: назвать
        источник удержаний — не P и не Q, начатых после t0+49 с. KN-PACE-31: посев А
        наследует только профиль, источник 32 удержаний не назван; с P их отвергнет
        исчерпанный П4 (Р6). Назвать адреса так, как это сделано в KN-PACE-30.
    - id: 2
      kind: TWIN
      where: 'KN-PACE-42 (стадия S2); Р7 п.4'
      statement: >-
        Сценарий утверждает отсутствие — нули во всех клетках
        kaname_issuing_source_fallbacks_total после наборов стенда, — и Р7 п.4 называет этот
        ноль измеренным свидетельством схождения края и службы. Положительного близнеца на
        том же стенде нет. Без него тот же ноль дают шаг, читающий не ту реплику или не ту
        витрину, и счётчик, не доехавший до сборки стенда. KN-PACE-33…36 доказывают
        способность счётчика двигаться в процессе, но не на стенде. Исправление: близнец
        42b на том же стенде. Один запрос без клиентского сертификата прямо к слушателю
        выдачи с X-Forwarded-For, и клетка forwarded-from-non-edge этой точки выросла ровно
        на 1. Ещё назвать, что шаг читает сумму по всем репликам службы.
  non_blocking:
    - id: 3
      kind: FORMAT
      where: '§1.1 (строка 84), §1.5 (строки 149, 153), шапка «Где сняты замеры», §6 S1'
      statement: >-
        Три команды на origin/425 больше не исполняются: ветка снята после вливания 425 в 366
        коммитом 93d0df81c, через 10 минут после коммита документа. Заголовок §1.1 «собрана
        только в сборке 425» для базы волны уже неверен: на origin/366 то же число 9. Взять
        неподвижную ревизию 40902d877 либо origin/366 @ 93d0df81c. S1 садится на базу волны
        после догона ветки 315.
    - id: 4
      kind: FORMAT
      where: '§1.5 п. о четырёх исходах, Р5, KN-PACE-23'
      statement: >-
        Из четырёх исходов «нашей стороны» два — revocation-check-failed и issuance-failed —
        объявлены в verifier.go, но производит их выдача после принятого доказательства
        (internal/apps/kaname/api/client_token/issue.go:219, :248, :277, :280), а не
        проверяющий. Р5 исключает их дважды: как «нашей стороны» и как «отказы выдачи». Для
        этих двух строк KN-PACE-23 дублёр — не хранилище: для issuance-failed это подписант
        или сборка утверждений, для revocation-check-failed — хранилище отсечек. Назвать
        дублёр по строке.
    - id: 5
      kind: FORMAT
      where: '§3, «Retry-After» у П3'
      statement: >-
        «Секунд до выхода старейшего отказа из окна» верно, только когда в окне ровно предел.
        П3 решается при входе запроса, а счёт растёт по исходу. Поэтому одновременные
        отвергаемые предъявления, допущенные при счёте ниже предела, выводят счёт за предел,
        и названный срок наступает раньше, чем повтор пройдёт. Сформулировать иначе: до
        момента, когда в окне останется предел минус один отказ.
    - id: 6
      kind: DoD
      where: '§6 S2 п.3'
      statement: >-
        Выкатка образа со стадией S1 связана с профилями п.2, но не с п.1 (край предъявляет
        свою пару). Без п.1 ретранслированные запросы приходят без сертификата края, и ключ
        падает на адрес пира — то самое слияние, от которого Р7 п.5 защищает страж старта.
        Страж здесь бессилен, на стенде это поймает только KN-PACE-42 с близнецом из
        находки 2. Добавить п.1 в условие п.3.
    - id: 7
      kind: FORMAT
      where: 'Р3; KN-PACE-25'
      statement: >-
        «Отказы формы решаются до всех осей» шире порядка из того же пункта: форма
        утверждения (два утверждения, чужой параметр вида выдачи) стоит после П3 и П1 и в
        handler.go (authenticate после шага 3а). Сузить фразу до метода, потолка тела, разбора
        формы и вида выдачи. В KN-PACE-25 назвать, что 400 invalid_request — отказ разбора
        формы.

