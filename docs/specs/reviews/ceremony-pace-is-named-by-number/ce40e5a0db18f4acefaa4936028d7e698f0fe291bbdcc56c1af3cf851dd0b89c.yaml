constructibility:
  seeded: >-
    Посев во временном рабочем дереве на ad22d9fd6, снято после прогона. Обработчик ветки с
    потолком 32, настоящий exchangepace (5 в секунду, управляемые часы), дублёр выдачи,
    удерживающий клиентов H*, и перед обработчиком МОДЕЛЬ П3 по тексту Р3 и §3 (решение при
    входе, рост по исходу, 50 за 15 мин) — сама ось в ветке заказана. KN-PACE-24: 50
    отвергнутых с P получили 401, проверяющий вызван 50 раз; в t0+50 с 32 удержания H1…H32 с R
    дошли до выдачи; в t0+60 с запрос с P → 429, Retry-After 840, проверяющий по запросам P и
    Q не вызван; запрос с Q → отказ потолка (форма 429 на HEAD, 503 заказан); после снятия
    удержаний 200 у 32 из 32. Given строится — находка 1 круга 1 закрыта. KN-PACE-11:
    отвергнутый при 31 удержании → 401, H32 дошёл до выдачи, Y → отказ потолка,
    in-flight-ceiling-reached 1, после снятия 32 × 200. KN-PACE-18b: два отвергнутых при счёте
    49 оба получили 401 при удержанном дублёре реестра, в окне 51, в t0+60 с → 429,
    Retry-After 841, в t0+901 с → 200: арифметика §3 подтверждена независимым счётом.
    KN-PACE-25: все семь строк дают ответы таблицы (405, 413, 400, 400, 400, 429, отказ
    потолка по 10), When → 200. Given 01, 02, 03, 04, 07, 08, 12, 13, 14, 15, 16 пересобраны
    13 зелёными пробами, 38 — рендером (проба красна по заказу).
  named_fixture_not_seeded: >-
    05, 06 — config.Load и слушатель выдачи в optional-mutual; 09, 09b, 10, 17 — полосы
    церемонии базы волны и blockingIssuer; 18, 19–23 — стенд обработчика с дублёром
    проверяющего или выдачи и exchangepace.New(perSec, now); 26–31 и 30b — authorize.go базы
    волны с дублёром справочника: у каждого из A1…A32 потрачена одна из 10 единиц П4 своего
    адреса, поэтому 31 теперь строится; 32–36 — тестовый УЦ и настоящий слушатель выдачи; 37
    — сборщики витрины; 38b, 39 — helm template; 40 — пробы ретранслятора края в kacho.
  not_executed: >-
    41, 42, 42b — подъём стенда в боевой посадке; изоляция для посева стенда в задании не
    названа. Не зачитывается ни в зелёное, ни в красное.
  counts: >-
    сценариев 47 (44 заголовка и 3 близнеца внутри сценариев: 09b, 30b, 38b); посеяно 16, все
    строятся; названной фикстурой 28; не выполнилось 3

findings:
  blocking:
    - id: 1
      kind: TWIN
      severity: high
      where: 'KN-PACE-25; Р5 «Не считаются», Р2'
      statement: >-
        Сценарий утверждает, что ни один из семи видов отказа не засчитан в П3. Но каждый вид
        представлен 10 запросами при пределе 50, а близнец KN-PACE-18 отличается двумя фактами:
        видом отказа и числом ниже предела. Поэтому Then зелен при засчитывании любых четырёх
        видов, то есть до 40 из 70. Вывод Then «иначе счёт P был бы 70» ложен. Посеяно тем же
        стендом: классификатор, засчитывающий всякий отказ после authenticate (строки д и е, 20
        из 70), даёт When → 200, как и верный. По 50 запросов на строку тот же дефект даёт
        When → 429, а верный → 200. Без исправления единственный держатель исключений 429, 503 и
        формы утверждения их не держит, и засчитанный отказ нашей ёмкости запер бы источник на
        15 мин. Исправление: строки по 50 запросов с исходом по строке, как в KN-PACE-22 и 23;
        близнец каждой строки — KN-PACE-18, разница один факт — вид отказа. Given по 50 на
        строку посеян и строится.
  non_blocking:
    - id: 2
      kind: DoD
      severity: medium
      where: '§6 S1 п.1'
      statement: >-
        «Каждая проба сценария S1 красная до кода» невыполнимо дословно. Сценарии с
        производителем «есть» (01 и 03 для П1 и П2, 04, 08, 12–16) держат 13 зелёных сегодня
        проб. Положительные близнецы и утверждения отсутствия (19, 20, 21, 22a, 23, 25, 27, 29,
        30b) зелены до кода по построению. Назвать: красной до кода обязана проба с
        производителем «заказан» либо отрицательный партнёр пары; «есть» — зелёная до и после с
        числом исполненного.
    - id: 3
      kind: COVERAGE
      where: 'KN-PACE-42, Р7 п.4'
      severity: medium
      statement: >-
        Условие непустоты — сумма исходов точки авторизации больше 0 — берёт все запросы
        точки, а не ретранслированные краем. Если наборы стенда дошли до слушателя выдачи мимо
        края, ноль клеток вакуумен, и свидетельство схождения из Р7 п.4 не получено. Назвать
        непустоту по ретранслированным: счётчик ретранслятора края для цели выдачи либо адрес
        точки авторизации в метаданных стенда, указывающий на край.
    - id: 4
      kind: FORMAT
      where: 'Р6; KN-PACE-31'
      severity: low
      statement: >-
        Р6 не называет порядок П4 и П5 («оба решаются сразу после проверки метода»), а
        KN-PACE-31 на нём стоит. Дописать П4 → П5 и «источник, исчерпавший П4, места под П5 не
        занимает», как у П3 и П1 в Р3.
    - id: 5
      kind: NEGATIVE
      where: 'KN-PACE-35, строки со вторым значением, списком и не-адресом'
      severity: low
      statement: >-
        Одиннадцать одинаковых запросов дают 429 и при ключе E, и при ключе, взятом из
        заголовка. Ключ E показывает только клетка счётчика. Пусть одиннадцатый запрос несёт
        другое негодное значение: например, другой список с другим первым адресом. Тогда 429
        сам докажет, что ключ — E.

round_one_closure:
  blocking_1_constructibility: >-
    Закрыто. KN-PACE-24 посеян и строится (см. constructibility.seeded); KN-PACE-31 строится
    названной фикстурой: удержания с A1…A32, ни один не P и не Q, каждый тратит одну из 10
    единиц своего адреса.
  blocking_2_twin: >-
    Закрыто текстом: KN-PACE-42b на том же стенде двигает клетку forwarded-from-non-edge ровно
    на 1, шаг складывает по всем репликам и печатает их число. Исполнение — стенд, не
    выполнилось.
  non_blocking_3_to_7: >-
    Учтены все пять: §1 на неподвижных ревизиях (3); производитель исходов нашей стороны и
    дублёр по строке KN-PACE-23 (4); Retry-After П3 до предела минус один и KN-PACE-18b (5); S2
    п.3 связан с п.1 (6); Р3 сужен, KN-PACE-25 строка в, KN-PACE-10 строка г (7).

