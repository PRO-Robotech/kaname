scope_of_review: >-
  дельта редакции 16 к c5e535f0 (git diff: абзац Р2 о неоткрываемом материале, «Тогда» Ф12-35,
  строка состава правки); прочее одобрено кругом 12 и не перерассматривалось
blocking:
  - id: B1
    kind: CONSTRUCTIBILITY
    summary: >-
      Новое «And» Ф12-35 требует «тот же текст побайтно — у предъявления totp и lookup_secret», но
      Given Ф12-35 (перечень K2 без K1) у lookup_secret 503 не производит: набор — медленный хеш
      без ключа обёртки, и сам документ это утверждает («недоступность материала (Ф12-35, 503)
      набора не касается: у набора нет ключа», строка 933; отвергнутая альтернатива (б), строка 938).
      Под этим Given предъявление запасного кода сходится (200), половина lookup_secret не
      строится. 503 у lookup_secret есть, но по другой причине: sf_present.go:143-144 (кандидат не
      готов, не ёмкость) и 181-182 (строка active без набора под замком) — это дефект хранения, а
      не смена перечня.
    fix: >-
      Дать половине lookup_secret свой Given (например: способ lookup_secret active, а набора нет —
      удалить строку набора в интеграционной пробе; производитель — sf_present.go:181-182) либо
      сформулировать «текст один» как свойство единственного отображения вердикта
      (refusalOf, sf_present.go:231-240 → одна константа) с unit-держателем на оба способа и
      глагол confirm (sf_enroll.go:217). Абзац Р2 «на все глаголы, на которых материал
      открывается … и на оба способа» согласовать со строкой 933: у набора «материал не
      открывается» — не ключ, а дефект хранения.
non_blocking:
  - id: N1
    summary: >-
      Отрицательный контроль текста Ф12-35 перечисляет temporarily, later, key, wrap, secret,
      material, но не «try again», который Р2 запрещает тем же предложением; и не «decrypt» /
      имя ручки (C3). Дословная сверка текста делает перечень избыточным, но он должен совпадать
      со свойствами Р2.
  - id: N2
    summary: >-
      Перепись производителей в строке состава называет страницу клиента auth-lane.mdx, но не
      docs/content/advanced/second-factor-wrapping-key.mdx:15 — она цитирует прежний литерал
      дословно и по Р2 «шаг оператора живёт на странице смены ключа». Реализация обязана её
      править тем же изменением (S2 переписи поверхности).
accepted_parts: >-
  Новый текст `second factor cannot be verified; ask the administrator of this installation`
  проверен против свойств Р2: шага человека — да; temporarily / try again / later — нет; key, wrap,
  mat(erial), secret, decrypt, имя ручки — нет; класс причины не назван. Отсутствие Retry-After
  внесено в «Тогда» Ф12-35. Производитель текста один: константа second_factor.go:207, ветвь края
  loginlanehttp/handler.go:1139-1140 (writeRefusal без заголовков), все глаголы (login.go:471,
  step_up.go:240, sf_remove.go:174, sf_backup_codes.go:165) идут через refusalOf, confirm —
  sf_enroll.go:217 той же константой. Число сценариев (46) и ID не тронуты. Раскрытия класса
  защиты в тексте нет.
constructibility: >-
  Посева не было: стенда в задании нет. Половина totp нового «And» строится тем же Given (в) Ф12-35;
  половина lookup_secret под этим Given не строится (B1) — установлено чтением производителя
  (sf_present.go:120-147, 175-183) и строки 933 документа.
