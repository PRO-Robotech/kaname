    revision: kaname@436d13b6 (документ)
    why_blocking: >-
      Цепочка: Ф12-02 принимает шаг `t_c` и пишет его в строку (Р5, Ф12-07). Ф12-11, 15,
      25 берут «код шага t» от той же личности; Ф12-21 — коды `t−2…t+2` при «шаге t,
