      нет либо она `active`) и у `backup-codes` без заведённого фактора (строки нет либо
      `pending`) «Тогда» отсутствует — при том что Р4 и §7 инв. 14 объявляют перечень
      глаголов, где «не заведён» возможен, ЗАКРЫТЫМ и четырёхчленным
    sections: [Р4 («на всех четырёх глаголах, где он возможен»), §7 инв. 14, Ф12-02…04, Ф12-25, Ф12-29, Ф12-30]
    predicate: >-
      `grep -nE 'confirm' <док> | grep -iE 'без .pending|при .active|нечего подтвержд'` → пусто;
      `grep -nE 'backup-codes|перечеканк' <док> | grep -iE 'не заведён|без фактора|NOT_ENROLLED'`
      → пусто. Контроль, что предикат находить умеет: те же образцы по `remove` дают
      Ф12-29 «г», по `step-up` — Ф12-17.
    revision: kaname@436d13b6 (документ)
    why_blocking: >-
      Оба состояния достижимы штатно: `confirm` после истёкшего и убранного `pending`
      (Ф12-04 говорит «строка снята либо будет снята уборкой») либо повторный `confirm`
      после успешного (Ф12-07 объясняет отказ второго «шаг уже принят», но последовательный
      второй `confirm` со СВЕЖИМ кодом при `active` не описан нигде); `backup-codes` —
      глагол, требующий кода в теле (Ф12-25), у личности без фактора. Исход
      не назван — не назван и код: 400 `SECOND_FACTOR_NOT_ENROLLED`, 409
      `SECOND_FACTOR_ALREADY_ENROLLED`, 400 `ENROLLMENT_EXPIRED` — каждый защитим, и
      реализация выберет сама. §7 инв. 14 требует «один факт — один код», но сам перечень
      мест факта неполон, и его предикат (`grep -c`) этого не видит by construction.
      Сюда же две ячейки поменьше: `remove` у личности со строкой только `pending`
      (Ф12-29 «г» говорит «без фактора», Ф12-13 «е» и Ф12-17 личность `C` называют, Ф12-29
      — нет; снимается ли при этом `pending`?) и `ResetSecondFactor` у человека с ОДНОЙ
      строкой `pending` (Р10 снимает `pending`, Ф12-30 при «фактора нет» даёт
      `NOT_ENROLLED` — какой исход у `pending`-only: 200 со снятием или 400?).
    consequence_for_decisions: >-
      Р4 и §7 инв. 14 остаются верными по существу (один факт — один код), меняется
      перечень мест: «четыре» → все глаголы, где состояние возможно.
    outcomes: >-
      Назвать «Тогда» для шести ячеек: confirm×{нет, active}, backup-codes×{нет, pending},
      remove×{pending}, ResetSecondFactor×{pending-only} — кодом, `reason` и текстом, с
      оговоркой о состоянии строки (снята / не тронута) и счёте попыток; поправить Р4 и
      §7 инв. 14 («на всех глаголах, где состояние возможно», перечень выводится матрицей,
      а не выписывается); при желании — таблица «глагол × состояние» в Р4 как единое место.
  - id: Б2
    title: >-
      «Дано» с кодом шага `t` после Ф12-02 не строится при неподвижных часах: подтверждение
