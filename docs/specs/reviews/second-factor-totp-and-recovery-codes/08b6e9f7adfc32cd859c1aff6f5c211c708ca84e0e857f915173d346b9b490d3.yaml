      пароле ради времени; Р6 — сравнение и запись под одним замком. Реализация, следующая
      этим словам, при неверном пароле выполняет тот же оператор — и пишет шаг / снимает
      код. Следствие для запасных кодов: держатель списка кодов БЕЗ пароля потребляет их
      все, предъявляя с любым паролем, — оставляя владельца без второго фактора при утере
      устройства (путь Р10 через распорядителя). Для шага — предъявитель с секретом без
      пароля закрывает владельцу текущую ступень. Обратная реализация (писать только при
      полном успехе) столь же защитима — и это две реализации одного «Тогда», из которых
      документ не выбрал. «Обе стороны оси» здесь не названы: успех пишет (Ф12-11, 12,
      23), неуспех — не сказано.
    consequence_for_decisions: >-
      Р5/Р6 уточняются одной нормой: сверка на неверном пароле — ХОЛОСТАЯ по исходу (ради
      времени), запись шага и потребление кода — только при совпадении ВСЕХ предъявленных
      факторов; «тем же оператором» — про успешный путь.
    outcomes: >-
      Р5 и Р6 — фраза «состояние строки меняет только полный успех»; Ф12-13 — «И» о
      строке после «б» (шаг не записан: Ф12-11 тем же шагом после «б» проходит) и новый
      подпункт «неверный пароль + годный запасной код → 401, код НЕ потреблён, остаток
      прежний»; отрицательный контроль в §8 (реализация, потребляющая на неверном пароле,
      краснеет).
  - id: Б4
    title: >-
      Ф12-39 сверяет параметры стоимости хеша набора с ручкой ПОТОЛКА ID-PW-1 Р2 («не ниже
      ручки потолка»; отрицательный контроль — «ниже потолка»), тогда как одобренная
      ID-PW-1 PWV-16 чеканит МЕЖДУ полом и потолком записи, а «что писать» задаёт своя
      настройка; порог назван не тем, и о настройке записи документ молчит
    sections: [Р6 («потолок параметров — та же ручка ID-PW-1 Р2»), §4.1 п.3, Ф12-39 (второе «И» и отрицательный контроль), §8 строка «запасные коды»]
    predicate: >-
      `grep -n 'не ниже ручки потолка\|ниже потолка\|потолок — ручка ID-PW-1' <док>` → 1417,
      1422, 829, 537; `grep -c 'PWV-16\|что писать' <док>` → 0. У соседа:
      ID-PW-1 PWV-16 «настройка «что писать» называет только записываемый формат, и только
      между полом и потолком его записи … обе границы включены: ровно на поле … и ровно на
      потолке»; PWV-14 — параметр ВЫШЕ потолка отвергается до вычисления.
    revision: kaname@436d13b6 (документ) · ID-PW-1 на 4f6ab4be (2554fb6f, APPROVED)
    why_blocking: >-
      «Не ниже потолка» при запрете «выше потолка» означает «ровно на потолке». Набор,
      чеканенный по настройке «что писать» с параметрами на полу записи (законно по PWV-16,
      и это «нынешние параметры §1.2» ID-PW-1), — находка Ф12-39; отрицательный контроль
      «ниже потолка» краснеет на законном близнеце. Это расхождение с одобренным соседом
      на величине, которую «Тогда» сверяет, — и одновременно незаданный производитель:
      какой формат и какие параметры чеканит набор, документ не говорит (у пароля это
      PWV-16), а «второй ручки не заводится» без называния первой оставляет выбор
      реализации.
    consequence_for_decisions: >-
      Р6 остаётся (медленный хеш дисциплины Ф-в под той же ёмкостью); уточняется
      производитель формата и параметров при чеканке — та же настройка «что писать»
      (PWV-16), потолок — та же ручка Р2 при чтении; порог Ф12-39 — «не ниже ПОЛА записи
      объявленного формата», отрицательный контроль — «ниже пола либо параметров нет».
    outcomes: >-
      Р6, §4.1 п.3, Ф12-39, §8 — заменить «потолок» на пару «формат и параметры — по
      настройке «что писать» ID-PW-1 PWV-16; потолок чтения — Р2»; добавить в §0.1/§3
      строку ID-PW-1 PWV-16 как принятую.

# ─── ВАЖНЫЕ, НЕ БЛОКИРУЮЩИЕ ─────────────────────────────────────────────────
non_blocking:
  - id: Н1
    where: Р4 (ретрансляция), Ф3 Р8 таблица «под требованием сменить пароль»
    what: >-
      Шесть новых путей в `isPublicHTTPPath` по Ф3 Р8 механически становятся путями,
      ПРОХОДЯЩИМИ под требованием сменить пароль (сессия восстановления Ф5 Р5). Документ
      называет число (14), но не следствие: `enroll`/`confirm`/`step-up`/`remove`/
      `backup-codes`/`GET` из сессии с `passwordChangeRequired: true` — проходят. Исход,
      по-видимому, верный (требование защищает глаголы платформы), но Ф3 Р8 ведёт таблицу
      «что каждый делает под требованием», и шесть строк в неё не внесены — второе место об
      одном предмете разойдётся молча. Назвать одной строкой в Р4 и в Д19.
  - id: Н2
    where: §1.2 Ф-г, Р2; §9; `internal/keywrap/keywrap.go` (шапка); `internal/authzmodel/fga_model.fga:771–774`
    what: >-
      Шапка `keywrap` объявляет пакет «обёрткой приватной половины подписного ключа» и
      «второй ручки об этом предмете не заводится»; Р2 берёт обёртку под второй предмет и
      вторую ручку с доводом «предмет другой» — довод принимаю, но шапка после Ф12 будет
      лгать о своём предмете, и §9 обязан назвать её правку тем же изменением
      (`architecture.md` §doc-truthfulness). То же у `identity_suspender`: комментарий модели
      называет читателей «запрет и его снятие», Р10 добавляет третьего — сброс фактора.
  - id: Н3
    where: §7 инв. 5
    what: >-
      «Транзакций в документе ЧЕТЫРЕ» — пятая: перечеканка (новый набор + событие
      `backup_codes_regenerated`, Ф12-25/42); её частичный исход Ф12-42 уже покрывает
      («при отказе записи очереди изменение не зафиксировано»), инвариант её не считает.
  - id: Н4
    where: §4.1 п.1, Ф12-40
    what: >-
      Три названных ограничения схемы (вид ∈ 3; состояние ∈ 2; `lookup_secret` → `active`)
      допускают строку `password` в состоянии `pending`. Назвать четвёртое («`pending` —
      только у `totp`») либо сказать, что состояние у `password` фиксировано умолчанием.
  - id: Н5
    where: Р2, Ф12-35 «а»
    what: >-
      Существующая ручка обёртки имеет форму из двух половин — значение либо имя переменной
      окружения (`authn.jwks-encryption-key-hex-env`, `authn.go:68`). Новая ручка обязана
      повторить обе, иначе профиль, подающий секрет окружением, не сможет её задать; «не
      задана» в Ф12-35 «а» тогда означает «ни одна из двух».
  - id: Н6
    where: Р8, Ф12-04, Ф12-09
    what: >-
      Порядок проверок у `confirm`, когда истекли ОБА окна — свежесть сессии и срок
      `pending`, — не назван (`SESSION_NOT_FRESH` или `ENROLLMENT_EXPIRED` первым). Ф12-04
      обходит это, освежая сессию паролем; проба на обоих истёкших получит один из двух и не
      будет знать, верен ли он.
  - id: Н7
    where: §1.1 комментарий «21 файл, 52 таблицы»
    what: >-
      52 — объявления `CREATE TABLE`, различных таблиц 51 (`kaname.limits` объявлена в двух
      миграциях); единица строки — «объявление», число ей верно; слово «таблицы» — нет.
  - id: Н8
    where: шапка, «Ревизия измерения — дерево платформы»
    what: >-
      kacho@898754db1c → origin/main a2981976c6 за время круга (один коммит #2686, трогает
      gateway/ и deploy/); три предиката §1.1 на новой ревизии дают то же. Перед кругом 2 —
      перемерить и назвать ревизию заново.

