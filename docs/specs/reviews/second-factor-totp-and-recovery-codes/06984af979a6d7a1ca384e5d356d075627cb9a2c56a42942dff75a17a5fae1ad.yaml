  why: >-
    Вердикт круга 3 — APPROVED: блокирующих ноль. Предмет редакции 6 один (снятие носителя `R`
    Ф12-38 и приведение трёх строк к Ф3 редакции 8 по kacho#2697), дельта совпадает с
    объявленным составом не шире и не уже, «Дано» с полем неконструируемо на голове и в линии, и
    ни одного живого утверждения о снятом состоянии в документе не осталось. Но САНКЦИЯ этим не
    выдана: эпоха post-cutover, политика называет единственного, кто выпускает effective
    approval приёмки, — `pointpu`; роль без внешнего события полномочия не даёт
    (`change-graph.md` §3). До события действующее одобрение остаётся одобрением РЕДАКЦИИ 5
    (b71c3ff7), и это надо сказать прямо: редакция 5 велит строить носитель `R` с полем, которого
    у сессии нет, — исполнитель, взявший одобренную редакцию, упрётся в неконструируемое «Дано».
    Событие на 06984af9… переносит санкцию на редакцию, которую построить можно.
  what_the_event_would_lift: >-
    То же, что событие круга 2, на новом отпечатке: кодирование объёма §4.1 в фазе Ф12 (#1281)
    — ровно то, что ведомость §6 называет поимённо (§0.2), от головы линии `release/iam-lines`,
    где код Ф3 и снятие поля (kaname#228) уже есть; в DoD — восемь сценариев Ф11 и три
    «последней из Ф5 и Ф12» (§6.1). Не шире: Ф7/Ф13, Ф8, политика обязательности по личности,
    `mfa_fresh`, сброс пароля распорядителем — §0.2 «не разрешает». Объём редакцией 6 не менялся.
