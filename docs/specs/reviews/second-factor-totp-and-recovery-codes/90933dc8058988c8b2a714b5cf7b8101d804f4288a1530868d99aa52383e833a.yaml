blocking:
  - id: B14-1
    kind: DoD
    summary: >-
      §14 DoD п.4 утверждает «прочие глаголы… держатели зелёные с прежним текстом», но сквозные
      держатели newman сравнивают тела прочих глаголов с телом входа С кодом и краснеют на посадке.
      tests/newman/cases/kaname-second-factor.py @8b0379e2a: эталон sfWrongPasswordRefusalBody
      снимается со входа с secondFactor (:769, :1240, keep=); с ним побайтово сравниваются отказы
      step-up (:626 _backup_step_up_refused, :1019 SU-REPLAY, :1041 SU-S2-WRONG) и входы с кодом
      (:770, :962, :1241); все _refused_login утверждают _AUTH_FAILED (:511). После правки вход с
      кодом — текст Р4, step-up — прежний: равенство ложно по замыслу Д30. Переписи и DoD это не
      называют; сквозного пункта DoD нет (чек-лист 3.7).
    fix: >-
      Строка переписи §14 «кейсы newman kaname-second-factor» с исходом: входы с кодом — текст Р4;
      эталон тела для step-up/confirm/remove — снять с отказа без поля либо своего глагола, а не со
      входа с кодом; пункт DoD — набор kaname-second-factor зелен на сведённом тексте, коллекция
      пересобрана.

