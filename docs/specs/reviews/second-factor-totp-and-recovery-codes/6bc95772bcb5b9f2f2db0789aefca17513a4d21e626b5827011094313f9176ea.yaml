# ─── РЕШЕНИЯ Р1…Р12 — ПОЗИЦИЯ РЕВЬЮЕРА ПО ТРОНУТОМУ ────────────────────────────
decisions:
  Р4:
    verdict: ПРИНИМАЮ
    basis: >-
      Вход — единственный глагол семейства, где состояние судится ДО аутентификации, и его
      ячейка обязана быть отказом входа, а не токеном: иначе Ф1 Р3 / Ф3-02 отменяются на
      популяции «без фактора», то есть на всякой свежезарегистрированной. Перечень глаголов с
      токеном «выводится матрицей» и после снятия входа — четыре (`step-up`, `remove`,
      `backup-codes`, `ResetSecondFactor`), сверено по строкам матрицы. Цена держателю пароля
      названа (один отказ без следующего шага, одна попытка) и мала: следующий шаг ему называет
      `GET second-factor` после входа без кода (Ф12-14), консоль кода у незаведённого не
      спрашивает. Абзац «Оракула здесь нет» верно разводит: под сессией состояние читает сам
      человек `GET`-ом; на входе исход наружу не выходит. Единственное, чего абзацу не хватает, —
      якорь «(Р11)» ведёт к разделу, который клетку не объявляет (Н19).
  Р5:
    verdict: ПРИНИМАЮ
    basis: >-
      Холостая сверка над холостым секретом — как в редакции 6; добавлено: та же
      неразличимость и ПОСЛЕ совпавшего пароля, телом и темпом, а по времени — огибающая Ф3 Р17.
      Ф3 Р17 существует и это производит. Замечание Н21 — о том, что это стоит измерить, а не
      только вывести.
  Р7:
    verdict: ПРИНИМАЮ
    basis: >-
      Исключение из «отказ по состоянию — не попытка» одно и названо: на входе. Довод верен и
      необходим — без него частота окна была бы вторым каналом того же оракула (при
      `countsAsAttempt=false` на `verdictNotEnrolled` `recordFailure` не зовётся, и `429` при
      совпавшем пароле не приближается — проверено по `login.go` :421–428, :408). Побочная
      польза, о которой редакция молчит: попытка выравнивает и ВРЕМЯ обеих полос до огибающей
      (обе кончаются одной записью). Н20 — о форме изложения довода, не о существе.
  Р9:
    verdict: ПРИНИМАЮ
    basis: после снятия фактора вход с кодом — `401` и попытка; согласуется с матрицей Р4 (строка входа, «строки нет»).
  Р11:
    verdict: КАК В КРУГЕ 2 — с оговоркой Н19
    basis: >-
      Не тронут редакцией 7; но редакция 7 первой опёрлась на клетки, которых Р11 не объявляет.
      Существо решения (счётчики с нулём до первого события, журнал, уборка) не меняется.
  Р1…Р3, Р6, Р8, Р10, Р12:
    verdict: КАК В КРУГЕ 2
    basis: редакцией 7 не тронуты — доказано диффом (delta_vs_declared), не перечитывались.

