    Ф3-02 — «один отказ на все причины, побайтово; различимость — только счётчиком службы по
    причине (Ф3-48) и её журналом» — расширение Д29 повторяет эту букву и берёт тот же
    механизм различимости (клетка по причине). Ф3-48 перечисляет клетки исходов входа
    (совпал · не совпал · нет строки · заблокирована · формат · тело · потолок · ёмкость):
    `second-factor-refused` и новая `second-factor-not-enrolled` там не названы — это
    отставание Ф3 от своей реализации (перечень в коде уже 10), не предмет Ф12; Ф12 вправе
    расширять закрытый перечень своей клеткой, потому что Ф3-02 сам называет счётчик по
    причине местом различимости. §8 инв. 3 «ни один отказ полосы не является оракулом — по
    телу и по времени» — редакция 7 приводит Ф12 в согласие с ним там, где редакции 4…6
    расходились. Р10 (окна частоты) — попытка (е) идёт в те же два окна. Р17 (огибающая) —
    производитель довода Р5.
  Ф1: >-
