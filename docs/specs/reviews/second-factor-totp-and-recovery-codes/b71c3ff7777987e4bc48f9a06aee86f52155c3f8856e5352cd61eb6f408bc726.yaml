  - id: Н14
    where: >-
      Ф12-05 (б)/(в), уровень I: «её секрет — секрет ПОЗДНЕГО ответа»
    what: >-
      Порядок прихода ответов и порядок фиксации транзакций совпадают не by construction; «поздний
      ответ» пробой не наблюдаем как порядок фиксации. Утверждение, которое проба различит и
      которое держит то же свойство: строка `pending` одна; её секрет равен секрету РОВНО ОДНОГО
      из двух ответов; `confirm` кодом от него проходит (Ф12-02), кодом от другого — 401
      (Ф12-03). Переписать «Тогда» в этой форме; отрицательный контроль сценария от этого не
      меняется.
  - id: Н15
    where: §5 преамбула («В живом времени (Ф12-08) то же даёт код ступени t₀+1»), Ф12-13 (г → б → контроль Ф12-11), Ф12-28 (`S3` — «2» после церемонии)
    what: >-
      В живом времени после принятого шага `t₀` в той же 30-секундной ступени принимается ровно
      ОДИН следующий код (`t₀+1`): `t₀+2` вне окна ±1 до перехода часов на `t₀+1`. Цепочка из двух
      предъявлений `totp` после подтверждения на E-уровне (Ф12-28: `S3` поднята кодом по времени,
      затем `remove` кодом по времени; Ф12-13: (г) после Ф12-11, затем (б) и его контроль) либо
      ждёт границы ступени (условие «текущая ступень > последней принятой», до 30 с — ожидание
      условия, не паузы), либо поднимает промежуточную сессию запасным кодом. Документ это не
      запрещает и I-уровень с часами Ф-ж это покрывает (§8), но преамбула называет живое время
      только для Ф12-08; автор набора, прочитавший ожидание как дефект, потратит прогон. Одна
      фраза в преамбуле: «в живом времени — не больше одного принятого кода по времени на
      ступень; цепочка длиннее ждёт границы ступени либо идёт запасным кодом».
  - id: Н16
    where: Ф12-13 (е)
    what: >-
      Для (а)…(д), (ж) сказано «без `Set-Cookie`»; для (е) — только код и токен. 400 сессии не
