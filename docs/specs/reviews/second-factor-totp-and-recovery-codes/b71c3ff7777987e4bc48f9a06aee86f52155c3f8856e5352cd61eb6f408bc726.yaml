      говорит, что кодирование идёт от линии (§12.1). Значит этот пункт DoD зелен до первой
      строки проверяющего — предикат, неспособный упасть там, где он применяется. §12.1 это
      называет («читать как HMAC над секретом второго фактора»), но строка §9 не изменена — два
      места об одном предикате. Заменить на предикат, дающий 0 на линии: по файлу проверяющего
      кода (третий разрешённый файл `AllowedFiles`) либо по имени вида — например
      `git grep -l 'LoginMethodTOTP\|MethodTOTP' -- 'internal/**/*.go' ':!*_test.go' ':!internal/assurance/**' | wc -l`
      с названным «сегодня 0». Остальные пять предикатов DoD на линии падать способны (4 → N,
      2 → 3, 27 → 28, `kind_check`, `signInMethods()`), поэтому DoD измерим — не блокирует.
