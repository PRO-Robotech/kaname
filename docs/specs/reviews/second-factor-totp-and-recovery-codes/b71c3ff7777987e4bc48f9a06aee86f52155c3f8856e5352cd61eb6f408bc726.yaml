    Инъекции гейтов, которые Ф12 расширяет (`TestLoginVerifierStaysInsideTheSchema`,
    `login_verifier_containment`), кругом не прогонялись — их предмет появится с миграцией Ф12.
  - >-
    Живая база (`totp = 0`, 80 личностей) не перемерялась — кластер чужой; документ это называет
    (§11).
  - >-
    Истинность решений Р1…Р12 ратифицирует владелец событием одобрения; здесь названа позиция
    ревьюера с доводом из дерева. Два дефолта (Н12, Н13) — тоже предмет события: автор вправе
    вписать их в документ следующей редакцией (тогда — новый отпечаток и соседняя запись).
