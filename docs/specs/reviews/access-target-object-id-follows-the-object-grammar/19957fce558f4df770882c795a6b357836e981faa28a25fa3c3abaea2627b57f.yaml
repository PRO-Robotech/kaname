prior_blocking_disposition:
  - id: B1
    kind: TWIN
    outcome: closed
    evidence: >-
      ATI-02b (стр. 122-132): то же «Дано», тот же usr-A, usr-D, роль и область; цель
      [{<base>/one}] → Operation, done=true без error, выдач две. Отличие от ATI-02 ровно одно —
      хвост идентификатора. Конструируемость исхода: UNIQUE access_bindings_active_grant_uniq =
      (subject_id, subject_type, role_id, resource_type, resource_id, target_digest) WHERE
      revoked_at IS NULL AND narrowed_at IS NULL
      (20261024050000_unregistration_revokes_its_grants.sql:59-62); Digest — sha256 отсортированных
      «type:id» (access_binding_target.go:140-151); {one} и {one, one/two} — разные digest; отказа
      по подмножеству в create.go нет (grep -c 'Contains\|Subset' create.go → 0). Близнец в
      таблице производителей (стр. 185) и в DoD п.1. Строка ATI-01 больше не объявляет себя
      близнецом отрицаний (стр. 87-89).
  - id: B2
    kind: FORMAT
    outcome: closed
    evidence: >-
      ATI-05 (стр. 167-177): синхронной ошибки нет, Operation; Operation.error code=6, текст
      дословно «these permissions are already granted to <usr-D> on project:<проект мира>»; выдач
      одна; вторая цель названа — {<base>/one} (= ATI-02b). Производитель сверен:
      create.go:331-333 (комментарий UNIQUE), pgmaperr.go:470-478 (Sprintf «… to %s on %s»);
      дословная форма с «project:%s» уже утверждается
      unregister_revokes_grants_world_integration_test.go:429-430 (TestURG10_DuplicateOfUnnarrowedGrantRefused).
      DoD п.1 требует код и текст и называет снимаемую форму `if err == nil` (она есть:
      target_set_identity_world_integration_test.go:50 @origin/1004). Порядок шагов
      ATI-02 → ATI-05 → ATI-02b согласован со счётами «одна»/«две».

