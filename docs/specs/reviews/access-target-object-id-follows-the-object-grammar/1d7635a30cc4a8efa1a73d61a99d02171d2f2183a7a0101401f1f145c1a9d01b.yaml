blocking:
  - id: B1
    kind: TWIN
    scenarios: [ATI-02]
    note: >-
      Заголовок ATI-02 говорит «отличается от ATI-01 ровно идентификатором», но ATI-01 выдаёт
      usr-B без «Дано», а ATI-02 — usr-D при действующей выдаче на {<base>/one, <base>/one/two}:
      различий три (субъект, предусловие, идентификатор). Текст о близнеце вводит в заблуждение, а
      утверждения ATI-02, зависящие от usr-D («число выдач не изменилось», «ALREADY_EXISTS не
      производится»), близнеца при том же субъекте и том же «Дано» не имеют. Положительная проба
      ветки 1004 этого близнеца тоже не несёт: там есть лишь контроль «повтор той же цели
      отвергнут» (target_set_identity_world_integration_test.go:49-53 @origin/1004).
      Исправление: близнец ATI-02 при том же «Дано» и том же usr-D — цель
      [{registry.repositories, <base>/one}] (законный идентификатор без склеенного хвоста) →
      Operation, done=true без error, выдач usr-D по роли и области становится две; одной строкой
      в ATI-02 и в DoD п.1.
  - id: B2
    kind: FORMAT
    scenarios: [ATI-05]
    note: >-
      «Тогда» ATI-05 — «отказ — повтор действующей выдачи (как до этой правки)» и «две цели с
      разным составом … сосуществуют»: нет ни кода, ни пути (синхронно или в Operation.error), ни
      текста, ни названных двух целей. Сегодня этот отказ — асинхронный: Create отвечает
      Operation, UNIQUE access_bindings_active_grant_uniq даёт в воркере Operation.error code=6
      ALREADY_EXISTS с текстом «these permissions are already granted to <usr-D> on
      project:<проект>» (create.go:331-333, pgmaperr.go:470-478; дословная форма уже утверждается
      в unregister_revokes_grants_world_integration_test.go:428-431 @ddd5681af). Названный
      держатель на уровне Create — `if err == nil { require.NotNil(t, done.Error, …) }`
      (target_set_identity_world_integration_test.go:49-53 @origin/1004) — принимает ЛЮБОЙ
      синхронный отказ и любой код в Operation.error, поэтому охрана «кодировку не менять» на
      уровне Create ничего не различает. Исправление: Then ATI-05 — Create без синхронной ошибки,
      Operation.error code=6, текст дословно; «сосуществуют» — назвать вторую цель (например
      [{<base>/one}] для usr-D — совпадает с близнецом B1); DoD п.1 — контроль утверждает код и
      текст, а не NotNil.

minor:
  - kind: FORMAT
    note: >-
      ATI-01, шесть границ `/`: в «Тогда» — «синхронного отказа нет», в DoD п.2 — «done=true без
      error». Уравнять в пользу DoD (исход операции, а не только отсутствие синхронного отказа).
  - kind: FORMAT
    note: >-
      Validate копит отказы через multierr: при двух негодных идентификаторах текст будет склейкой
      через «; ». Приёмка утверждает один отказ — это верно, но стоит одной фразой сказать, что
      текст дословен для одного негодного элемента.
  - kind: COVERAGE
    note: >-
      Порядок: проверка формы (create.go:254) идёт раньше права выдавать (create.go:278), как и
      нынешний отказ «(empty)». Отказ синтаксический и ничего не сообщает о чужих объектах —
      допустимо; можно назвать это в документе одной строкой, чтобы реализация не перенесла
      проверку ниже ворот права.

open_questions:
  - id: Д1
    disposition: default_accepted
    note: >-
      «Грамматика объекта» = правило регистрации (validateRelationString,
      register_resource.go:835-852: без пробела, табуляции, перевода строки, `#`, ровно одно `:` в
      `<тип>:<id>`, значит в id `:` нет). Возврат каретки и прочие пробельные Юникода — вне объёма.
      Дефолт принят.

