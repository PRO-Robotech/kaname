blocking_findings:
  - id: Б1
    kind: COVERAGE
    where: Ф3-53 «Когда» (м), «Тогда» (м)
    text: >-
      (м) обосновано так: «иначе каждая такая калибровка отнимала бы у полосы входа место до
      перезапуска» — и утверждает только место ёмкости и выход паники к вызывающему. Состояния
      КЛАССА после паники контракт не называет, а производитель его портит: запись калибровки,
      идущей сейчас, заведённая до прогона, при панике не снимается, и следующий допуск того же
      класса ждёт её исхода до срока вызывающего — тот же вред «до перезапуска», что (м) называет
      для места ёмкости, на соседнем ресурсе.
    predicate: >-
      Проба рецензента через `go test -overlay` (дерево не тронуто) на 4edbb2821: мера паникует
      на первом прогоне и отдаёт 1 мс на последующих; после паники Admit того же класса со сроком
      300 мс → «password_envelope: ожидание калибровки класса 2a cost=4: context deadline
      exceeded» — КРАСНАЯ; близнец (другой класс после той же паники) — зелёный.
    remedy: >-
      Дописать в «Тогда» (м): после паники меры класс не остаётся в калибровке — следующий
      допуск того же класса не ждёт прерванной калибровки (калибрует заново либо отказывает с
      именем класса), и допуск, ждавший её в момент паники, получает отказ, а не срок; законный
      близнец — мера, паникующая один раз, затем отдающая стоимость. Держатель — проба огибающей.
  - id: Б2
    kind: PRODUCER
    where: Ф3-53 строка «страж корня композиции»; Р17 абзац «Мера прогона»; §7 строка Ф3-53; §10
    text: >-
      Документ утверждает, что страж корня композиции «заказан полосе kaname#295 поимённо». На
      трекере заказа нет: тело kaname#295 и шесть его комментариев стража не называют, а
      предикат снятия задачи — устойчивость пробы 188 либо перевод на детерминированную
      координату — уже выполнен этой же правкой; полоса влита в 377 (4edbb2821), задача ждёт
      status:test. У строки «Тогда» без держателя носителя заказа, таким образом, нет: при
      вливании в main задача закроется по своему предикату, а строка стража останется без
      ответственного (ban #11, третий исход — предмет с причиной и предикатом снятия).
    predicate: >-
      `gh api --paginate 'repos/PRO-Robotech/kaname/issues/295/comments?per_page=100' -q
      '.[].body' | grep -ciE 'страж|WallClock|корн[ья] композиц|guard'` → 0; тело
      (`gh issue view 295`) — тот же поиск → 0.
    remedy: >-
      Любое из двух, перемеряется следующим кругом: (а) заказ на kaname#295 комментарием,
      называющим страж, его красное и предикат снятия (тогда текст документа становится верным
      без правки); (б) отдельная задача со стражем, названная в документе вместо «#295
      поимённо».

