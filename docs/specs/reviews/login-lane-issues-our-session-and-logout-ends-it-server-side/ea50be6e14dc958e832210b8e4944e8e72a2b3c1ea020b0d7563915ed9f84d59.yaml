questions:
  - q: новая редакция исполняет РОВНО решение — ни шире, ни уже
    answer: >-
      Решение 3 (`kaname#188`, «„Тогда“ под реализацию, держатель — проба Ф3-31 плюс проба
      калибратора») — ДА, ровно и под производителя: четыре факта круга 3 сошлись с faf4f67e
      (максимум из 5 с запасом ¼ и причины у констант; повод `read` с окном оракула в одно
      обращение и сценарием (б)/(б′); повод `write` — у П3, заказ #222; «Дано» Ф3-53 — настоящий
      проверяющий дешёвыми классами). Что редакция 8 угадала верно, названо §17 отдельно от
      переписанного — «под производителя» не читается как «целиком». Две строки «Тогда» Ф3-31 без
      держателя ОСТАВЛЕНЫ и заказаны полосе поимённо (#220) — это исполнение решения, а не его
      расширение: решение само называет держателем пробу Ф3-31, и снять свойство под «что полоса
      утверждает сегодня» значило бы записать решение уже. Решение 1 (`kacho#2697`) редакция 9 не
      трогает — верно, но одна живая копия отозванной посылки в Р6 осталась от редакций 1…7 и
      кругом 3 не была найдена (Б1 этого круга).
  - q: у каждого нового/изменённого «Тогда» есть производитель; у снятого назван предмет
    answer: >-
      ДА по всему, что имеет держателя: 15 проб полосы названы по имени, каждая существует на
      faf4f67e и ПРОШЛА (`go test … -run 'Envelope|_188_|F3_31|CostClass'` → 15 PASS, 1 SKIP —
      измерительная, по ручке `KACHO_LOGIN_TIMING=1`; её числа взяты с атрибуцией, как документ и
      говорит). Три строки без держателя названы словами и заказаны задачами с признаком ·
      предметом · предикатом (#220 — две строки Ф3-31; #222 — повод `write` у П3, Ф3-53 (е);
      #223 — инъекция Ф1-49); все три OPEN, P1/P1/P2, area:iam, release:identity-own. Ф3-53 (г)
      держателя в корневых пробах не имеет — держится уровнем огибающей, и это сказано в самом
      «Тогда». Отсутствия производителя, о котором документ молчал бы, не найдено.
  - q: отрицания с положительным близнецом
    answer: >-
      ДА: Ф3-31 — положительный контроль в обе стороны у строки «каждый исход ждёт потолка /
      форма и частота не ждут» (проба держит обе половины: строки 147, 185, 196
      login_envelope_test.go); Ф3-53 — (б)/(в) пара с одним различием (стоимость класса),
      (з) — занята/свободна в одной пробе (envelope_test.go строки 202–213); отрицательные
      контроли устройства названы поимённо и держатся пробами полосы.
  - q: прежние записи ревью не тронуты
    answer: ДА — `git diff ac9135bc..639bade4 -- docs/specs/reviews/` пуст.
  - q: соседи (ведомости соответствия) согласны
    answer: >-
      ДА по решению 3 — сосед здесь полоса кода, и на голове faf4f67e она согласна по всем
      четырём строкам таблицы #220; две строки «Тогда» остаются её долгом (предикат снятия #220
      выполнен наполовину — так и записано автором в #220 и §17). ДА по Ф1 §5/§8 и Ф5 §13.
      НЕТ внутри самого документа: Р6 (строка 726) и Р8 говорят о пути восстановления
      противоположное — Б1.

