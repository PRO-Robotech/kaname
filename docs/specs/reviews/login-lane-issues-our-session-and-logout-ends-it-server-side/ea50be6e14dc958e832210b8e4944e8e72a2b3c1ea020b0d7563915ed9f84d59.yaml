# ─── БЛОКИРУЮЩЕЕ ─────────────────────────────────────────────────────────────
blocking:
  - id: Б1
    class: отозванная посылка живёт в прозе решения того же документа — два места об одном предмете, верно одно (класс Ф1 Б1 круга 9; мой предикат круга 3 по Ф3 знал одну словоформу)
    where: "Р6, второй абзац («Момент отсечки на пути „восстановление как первая наша сессия“ …»), строка 726: «чьё первое действие в нашей посадке — восстановление с обязательной сменой пароля из его сессии»"
    what: >-
      Р8 этого же документа (редакция 8, `kacho#2697`) говорит: требования сменить пароль у
      сессии восстановления НЕТ, новый пароль записывает само завершение, смена из сессии
      восстановления глаголом Р4 — возможна (Ф3-19). Р6 в абзаце о второй половине замка Ф1-66
      строит «Дано» этого пути «с обязательной сменой пароля из его сессии» — формой, которую
      Р8 отозвал. Ф1 редакции 13 (тот же PR) переписала ту же фразу у себя (§8, замок Ф1-66:
      «с последующей сменой пароля … путь возможный, не обязательный, и проба выполняет его
      сама»), Ф3-21 в §6 строит эту половину без слова «обязательно» — расходится только проза
      Р6. Строка идёт с #173 (редакция 1, `git log -L726,726`), редакция 8 её не заметила, круг
      3 — тоже: предикат `требовани[ея] смен` формы «обязательной сменой» не знал.
    why_blocking: >-
      Тот же критерий, что применён к Ф1 кругом 9 (строка §8 там была той же фразой): два
      утверждения об одном предмете внутри одного документа, и читатель Р6 не может установить,
      какое действует; §17 и §16 объявляют по решению 1 «остатков ноль» / «исполнено ровно» —
      заявление шире сделанного, и половина этого заявления моя. Санкция ban #1 на документ с
      внутренним противоречием не выдаётся.
    tension_with_the_brief_named: >-
      Задание круга (решение 2) говорит «Ф3 Р6 не правится», и §16 строка 2697-3 объясняет, о
      чём это: механизм Р6 — подтверждение ТЕКУЩИМ паролем, четыре записи одним исходом,
      перевыпуск носителя — решением не затронут и не правится. Строка 726 — не механизм, а
      описание «Дано» пути восстановления в пояснительном абзаце; правка одного слова
      («обязательной» → «последующей … возможной, не обязательной (Р8; Ф3-19)») ни одного
      требования Р6 не меняет. Если оркестратор читает «Р6 не правится» побайтово — это его
      решение, и оно записывается в #2697/#1269 явно; документ с противоречием APPROVED не
      получает ни в одном прочтении.
    how_to_close: >-
      Одна правка словом в строке 726 по образцу Ф1 §8 редакции 13; §17 (или новая запись
      редакции 10) — перепись отозванной посылки по СЛОВОФОРМАМ с числом до/после, предикат
      снятия: `grep -n -iE 'обязательн[а-я]* (путь|смен)|смен[а-я]* пароля[^.|]{0,40}обязательн'
      "$D"` вне записей §13…§17 и шапки → 0; ни один факт «Тогда» не трогается. Класс уже
      отвергал работу этой волны дважды (Ф1 круг 9, Ф3 круг 4) — по
      `multi-agent-flow-orchestration.md` §«Класс, отвергший работу ДВАЖДЫ» он переезжает в
      форму задания: перепись отозванной посылки по корню слова идёт по КАЖДОМУ документу пачки,
      а не по тому, где посылку отзывали.

non_blocking:
  - id: В1
    where: §10, DoD фазы Ф3, пункт «каждый из 52 живых сценариев … исполнен по §9»
    what: >-
      Три строки «Тогда» держателя в дереве не имеют и заказаны (#220 ×2, #222, #223); DoD
      называет их только через §9 косвенно. Читатель DoD, увидев «исполнено 52 из 52» при
      открытых #220/#222/#223, не заметит, что Ф3-31 и Ф3-53 (е) исполнены не целиком. Назвать
      три задачи в DoD поимённо как условие «52 из 52» (либо считать эти строки третьей категорией
      до их закрытия — и сказать это словами). Не блокирует: заказ есть, предикаты у задач есть.
  - id: В2
    where: kaname#220 (лента) и §17, абзац «Решение оркестратора по kaname#220 — исход (а)»
    what: >-
      Выбор (а) стоит только в задании волны (и подтверждён заданием этого круга); в самой #220
      комментария оркестратора нет, §17 это честно называет. Задача закроется предикатом «две
      строки Ф3-31 сходятся» — там же стоит ждать явную строку «исход (а)» от оркестратора,
      иначе следующий читатель #220 увидит выбор автора, а не решение. Предмет ленты задачи, не
      документа.
  - id: В3
    where: §16, таблица посылок, абзац после неё («Ни одно „Тогда“ не оставлено без производителя … у остальных — названная полоса с названным держателем»)
    what: >-
      Оставлено как запись редакции 8 с курсивной пометкой «см. §17» — форма верная (история
      добавляется, не переписывается). Отмечено, чтобы читатель §16 не принял абзац за состояние
      редакции 9: три держателя в полосе отсутствуют, и это §17, а не §16.

decisions:
  - subject: исход (а) kaname#220 — «Тогда» под производителя faf4f67e
    verdict: принято — решение 3 задания круга формулирует (а) буквально; четыре факта круга 3 сходятся с полосой чтением и прогоном
  - subject: две строки Ф3-31 без держателя оставлены и заказаны #220, а не переписаны «под что есть»
    verdict: принято — решение называет держателем пробу Ф3-31; заказ с предикатом — третий исход ban #11, снятие свойства было бы записью решения уже
  - subject: Ф3-53 (е) — производитель П3 (kacho#1268), заказ #222; до него строка без держателя
    verdict: принято — так и просил круг 3 (how_to_close (а)); DoD пусть назовёт (В1)
  - subject: имена проб полосы прозой, координатой только проба #179
    verdict: принято — гейт `TestAcceptanceProbeCoordinateResolves` судит индекс ЭТОГО дерева; предикат перехода к координатам назван в Р17
  - subject: числа «21 из 21», «1,054 с» — с атрибуцией, не перемерены
    verdict: принято — измерительная проба по ручке стоит минут на общей машине; в моём прогоне она SKIP и так и записана

