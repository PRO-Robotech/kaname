blocking:
  - id: Б1
    class: запись устройства сделана до появления производителя и разошлась с ним
    where: Р17; Ф3-31 («Тогда» 3-я и 4-я строки); Ф3-53 («Дано», «Тогда» (а), (б)); §16 строка 188-3
    what: >-
      Решение `kaname#188` в задании волны велело: «„Тогда“ пишется под неё [реализацию в
      полосе], держатель — проба Ф3-31 плюс проба калибратора». Полоса на origin ЕСТЬ (PR #216,
      faf4f67e) и производит ДРУГОЕ устройство по четырём фактам, а двух «Тогда» не производит
      вовсе. Разошлись не текст и дерево, а две записи одного решения, написанные параллельно
      (§16 честно называет отсутствие ветки на момент замера); верной по отдельности выглядит
      каждая — видит обе только тот, кто держит обе.
    facts:
      - >-
        (1) величина: Р17 — «стоимость одной проверки … объявленное число прогонов, МЕДИАНА»,
        Ф3-53 (а) — «величину, РАВНУЮ стоимости одной проверки … по измерителю»; производитель —
        МАКСИМУМ из `calibrationSamples = 5` и `floor = cost + cost/headroomDivisor` (запас
        четверть). На производителе Ф3-53 (а) красен не по дефекту, а по контракту
      - >-
        (2) писатель другого процесса: Р17 — «виден калибровкой СЛЕДУЮЩЕГО СТАРТА, и это
        граница, названная словами»; производитель — повод `EnvelopeTriggerRead`: класс,
        неизвестный огибающей, допускается первым же входом (`login.go` `admitClass`), «окно
        оракула равно одному обращению». Граница Р17 ложна о производителе; поведения `read`
        в приёмке нет ни одним сценарием
      - >-
        (3) пересчёт при записи: Р17 — «тем же процессом — переносом либо хешером»; Ф3-53 (б) —
        «переносом записано значение класса B-потолок → огибающая пересчитана вверх … в том же
        процессе»; производитель — повод `write` не заведён намеренно, все четыре писателя
        пишут классом ручки, допущенным при старте; вызывающий `Admit` при записи — перенос П3
        (`kacho#1268`). Названный производитель (б) от (б) отказывается словами своей шапки
      - >-
        (4) конструируемость «Дано» Ф3-53: «часы управляемые, измеритель стоимости —
        подставной, отдающий объявленную стоимость на класс»; у производителя порта измерителя
        нет — `calibrate` гонит настоящий `verifier.compute` в ёмкости; посев по «Дано»
        Ф3-53 на этом устройстве невозможен (4.5 задания рецензента: конструируемость
        доказывается посевом, а не перечислением)
      - >-
        (5) два «Тогда» Ф3-31 без держателя в полосе: «ни одна медиана не ниже огибающей —
        красное с именем полосы» (`timing_probe_test.go` печатает потолок и калибровку, не
        утверждает; `TestLogin_F3_31_EveryOutcomeAfterTheRateGateHoldsUntilTheFloor` утверждает
        по исходам, не по полосам замера); пара «второе обращение в ОКНЕ ОЖИДАНИЯ первого при
        ёмкости 1 получает место / во время ВЫЧИСЛЕНИЯ — „ёмкость исчерпана“» с отрицательным
        контролем поимённо — в `login_envelope_test.go` только вторая половина
    evidence: >-
      git show origin/issue-188-timing-envelope:internal/passwordverify/envelope.go (шапка,
      `Admit`, `calibrate`); …:internal/apps/kaname/api/humansession/login.go (шапка, `Execute`,
      `holdUntil`, `admitClass`); …:internal/apps/kaname/api/humansession/timing_probe_test.go
      (строки 177–178); …:login_envelope_test.go (строки 150–164)
    what_the_lane_DOES_produce_as_written: >-
      Совпадают с Р17 и Ф3-31: потолок ФАКТИЧЕСКОЙ популяции ({хранимое} ∪ {ручка}) — да;
      калибровка при старте переписью хранилища и ручки, самоотчёт с классом и величиной —
      да (`loginlane.go` `calibrateLoginEnvelope`, `envelopeReport`); статический потолок —
      граница приёма, не задержка — да (шапка envelope.go); ёмкость отпущена до ожидания —
      да (`Execute`: `holdUntil` после `admitted`, ёмкость освобождается внутри `compute`);
      исход «ёмкость исчерпана» не раньше огибающей — да (проба, строка 164); все исходы после
      ворот частоты под огибающей, два вне — форма и частота — да; 21 пара критерия — да
      (комментарий полосы в #188: 21 из 21 в двух прогонах).
    how_to_close: >-
      Решение оркестратора, и оно не за автором приёмки: (а) приёмка приводится к
      производителю — Р17: максимум из N прогонов с запасом ¼ (число и запас с причиной),
      поводы `startup` и `read` со сценарием на `read`, повод `write` — у П3 (`kacho#1268`) с
      обязанностью звать `Admit`; Ф3-53 «Дано» — на настоящем измерителе дешёвыми классами
      либо через порт, который полоса заводит; две пробы Ф3-31 — заказаны полосе поимённо;
      либо (б) полоса приводится к приёмке (медиана без запаса либо запас в Р17; повод
      `write` здесь; порт измерителя; две пробы). «Оставить обе» исходом не является. Заведено
      задачей `PRO-Robotech/kaname#220` (признак · предмет · предикат снятия — та же таблица,
      заново, ноль строк «расходятся»).

