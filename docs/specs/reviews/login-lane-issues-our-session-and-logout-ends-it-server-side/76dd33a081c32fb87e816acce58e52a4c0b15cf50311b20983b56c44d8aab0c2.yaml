# ─── ПЯТЬ ВОПРОСОВ ЗАДАНИЯ ───────────────────────────────────────────────────
questions:
  - q: новая редакция исполняет РОВНО решение — ни шире, ни уже
    answer: >-
      Решение 1 (`kacho#2697`) — ДА, ровно: Р8 переписано целиком под одно обращение; Ф3-23
      снят вместе с предметом, не ослаблен; поле/причина/глагол названы снимаемыми с `reserved`
      задачей `kaname#201` (существует: OPEN, P1, area:iam, release:identity-own, предикат из
      тела решения); Р6 не правится и назван доводом против исхода 2; положительный близнец —
      Ф5-24 редакции 3. Обход по слову (`passwordChangeRequired|PASSWORD_CHANGE_REQUIRED|
      ClearPasswordChangeRequired|требовани[ея] смен`) вне абзацев «снято/редакция» — остатков
      ноль. Решение 2 (`kaname#188`) — ЗАПИСАНО в объёме решения (потолок ФАКТИЧЕСКОЙ
      популяции; калибровка при старте; пересчёт при записи более дорогого класса; статический
      потолок — граница приёма; Ф1-48 на всех парах; ёмкость на ожидании отпускается), но
      ПОД ДРУГОЕ УСТРОЙСТВО, чем производит названный производитель, — Б1. Место записи (Р17,
      а не §4.2) — принято: §4.2 Ф3 есть таблица «за границей», довод §16 верен.
  - q: у каждого нового/изменённого «Тогда» есть производитель; у снятого назван предмет
    answer: >-
      Р8/Ф3-01/04/09/14/19 — производитель на линии: `recovery_complete.go`,
      `loginlanehttp/handler.go` (`PathRecoveryComplete`, поле `newPassword`) — есть на 6acf8f19
      и ed547967; `PasswordChangeRequired: *true` в прод-коде → 0; читателей — 10 файлов /
      22 строки (`git grep -c`, сумма) — как документ и называет. Ф3-23 — предмет снятия назван
      (поле сессии и его читатели, `#201`). Ф3-31/Ф3-53 — производитель назван (полоса #216),
      но производит ДРУГОЕ на четырёх фактах и не производит двух «Тогда» — Б1.
  - q: отрицания с положительным близнецом
    answer: >-
      Ф3-53 несёт близнеца (в) внутри сценария; Ф3-31 — положительный сам, отрицание — Ф1-49;
      снятый Ф3-23 — близнец Ф5-24 в доме Ф5. Форма — ДА; способность близнецов быть
      построенными на производителе — часть Б1 (факт 4).
  - q: прежние записи ревью не тронуты
    answer: ДА — `git diff 6acf8f19..c6a3c12e -- docs/specs/reviews/` пуст.
  - q: соседи (ведомости соответствия) согласны
    answer: >-
      ДА по решению 1 (Ф5 §13 и Ф1 §10.18 называют те же строки Ф3, и они на месте). По
      решению 2 сосед — не приёмка, а полоса кода, и она НЕ согласна — Б1.

