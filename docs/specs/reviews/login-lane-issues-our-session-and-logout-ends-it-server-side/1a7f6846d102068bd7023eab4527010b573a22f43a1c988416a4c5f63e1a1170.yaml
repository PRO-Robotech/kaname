      правки схемы. Производителя `own:` в прод-коде службы сегодня 0 — он у F4d/Ф4 (Ф1 §5.1
      :480: «чеканит идентификатор тому, кого заводит наш вход»), перенесённые (Ф3-04) держат
      идентификатор поставщика — см. В7 о формулировке преамбулы §6
    verdict: ПОДТВЕРЖДЕНО (посевом)

