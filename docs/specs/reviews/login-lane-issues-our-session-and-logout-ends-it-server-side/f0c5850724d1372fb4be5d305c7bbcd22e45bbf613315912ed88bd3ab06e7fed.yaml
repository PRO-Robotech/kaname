decisions:
  Р1:
    verdict: ПРИНИМАЮ, С ОГОВОРКАМИ Б3 И В6
    basis: >-
      Состав — то, что потребовали соседи; носитель непрозрачен, самоописывающийся отвергнут
      верно (F4d-25 держалось бы сроком). Разрешение момента аутентификации на проводе не
      названо (Б3); вид выдающего глагола сеется, но в составе не назван (В6).
  Р2:
    verdict: ПРИНИМАЮ ФОРМУ, ТРЕБУЮ РЕШИТЬ ПОЛОСУ
    basis: >-
      Семейство `/iam/v1/auth/*` на origin консоли — единственное место без второй раздачи
      (configmap-nginx.yaml, location `^/iam/v1/`) — верно; ретрансляция, а не перевод — верно
      (`Set-Cookie` владельца). «Полосу сессии членство не снимает» — верно о сегодняшней полосе
      (auth.go:945); но что полоса делает на «сессии нет» — решение, а не наблюдение (Б1).
  Р3:
    verdict: ПРИНИМАЮ
    basis: >-
      Атрибуты дословно Ф1 §4.1; `Domain` словом «нет» против пропуска — верно; `Strict`
      отвергнут по Ф1 §4.1; перевыпуск с прежним сроком — Ф1-53.
  Р4:
    verdict: ПРИНИМАЮ
    basis: >-
      Три записи одним исходом; идемпотентность; 503 с целым носителем — Ф1-58 дословно. Момент
      «t₁ − 1 единица» — Ф1 §4.2; его единица на проводе — Б3.
  Р5:
    verdict: ПРИНИМАЮ
    basis: >-
      Запись на личность, минимум как коммутативный оператор (тот же довод, что GREATEST), один
      писатель, срок S2…S3 с носителем `#1276`; замок Ф1-64 «после смерти S1» — Ф3-16.
  Р6:
    verdict: ПРИНИМАЮ
    basis: >-
      Четыре записи одним исходом, перевыпуск (Ф11 Р5), два отказа по F4d-19, «прочие записями»
      по Ф1 §5.1 С10; отвергнутое названо.
  Р7:
    verdict: ПРИНИМАЮ «ДВА ВОПРОСА», НЕ ПРИНИМАЮ «ОДИН ОТКАЗ НА ЛЮБОМ ПУТИ» БЕЗ РЕШЕНИЯ
    basis: >-
      Два вопроса конструируют Ф1-56, F4d-28, F4d-29 — верно; без кэша — верно (Ф1-14/16). Но
      «„сессии нет“ → F4d-22» на глаголах формы ломает Ф1-18 и оракул Ф3-18 (Б1); «кто я» стоит
      за полосой и отвечает 401, а не анонимным телом (Б2); разрешение величин сравнения не
      названо (Б3).
  Р8:
    verdict: ПРИНИМАЮ ИНТЕРПРЕТАЦИЮ Д1, ТРЕБУЮ ЗАМКНУТЬ ПЕРЕЧЕНЬ
    basis: >-
      «Кто я» под требованием проходит — довод о петле входа верен для сегодняшней консоли. Три
      названных исключения не замыкают множество: признак формы и вход не решены (Б4).
  Р9:
    verdict: ПРИНИМАЮ
    basis: >-
      Ф1-17 дословно; причины у существующих писателей; новой записи нет (перемерено §1.2).
  Р10:
    verdict: ПРИНИМАЮ, С ОГОВОРКОЙ В2
    basis: >-
      Два окна, величины профилем, что считается и что нет — согласовано с ID-PW-1 PWV-15.3;
      «источник — от допущенного» верно, производитель адреса на крае не назван (В2).
  Р11:
    verdict: ПРИНИМАЮ
    basis: >-
      Проход громко с раздельным различением «недоступен» и «настроен не туда» —
      `security-hardening.md` §8 «а»/«б»; отвергнутое названо с ценой.
  Р12:
    verdict: ПРИНИМАЮ
    basis: >-
      Контекст, сменяемый выдачей сессии и не тронутый выходом, закрывает Ф1-18 и Ф1-41
      одновременно; привязка к субъекту отвергнута верно; один текст на чужой вид и чужой
      контекст.
  Р13:
    verdict: ПРИНИМАЮ
    basis: >-
      Ручки — ID-PW-1 §4.3 (PWV-15.6…8, 16, 07) и Ф11 §5.1 п.5; стражи — форма Ф-г,
      существующая.
  Р14:
    verdict: ПРИНИМАЮ
    basis: >-
      Три события в существующую очередь одной транзакцией (Ф-м, гейт PII); клетки при нуле
      (Ф-е); уборка существующей петлёй (Ф-ж) по предикату читателя.
  Р15:
    verdict: ПРИНИМАЮ
    basis: >-
      Строка требований посадки существует и отказывает на литерале (§1.4 → 1); край выбирает
      читателя признаком посадки, гейт Ф1 §8 «читателей носителя поставщика под own ноль».
  Р16:
    verdict: ПРИНИМАЮ ДОПУСК, НЕ ПРИНИМАЮ «ЧИТАТЕЛЬ ОСТАЁТСЯ ОДИН» КАК ВЫВОД
    basis: >-
      Взаимный TLS на слушателе формы с допуском по SAN против существующего круга — верно и
      измерено (§1.9: читателей круга на HTTP — 0; режим `mutual` есть и в посадке). «Читатель
      отсечки один — на крае» держится тем, что полоса края отвергает отсечённый носитель ДО
      ретрансляции (Ф3-51) — это верно и остаётся при любом исходе Б1; но «полоса без ветки по
      перечню» как ОБОСНОВАНИЕ не выживает Б1: ветка появится, и держаться свойство будет
      допуском слушателя + отказом полосы по отсечке, а не отсутствием ветки.

