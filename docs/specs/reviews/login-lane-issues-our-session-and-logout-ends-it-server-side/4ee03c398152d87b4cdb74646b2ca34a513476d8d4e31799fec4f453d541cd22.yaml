blocking: []

non_blocking:
  - id: В1
    where: Ф3-04 «Дано» («значение перенесено в формате прежнего поставщика»), §7 строка Ф3-04 («перенесённое значение строит библиотека»), Ф3-21 «Дано» (:2047 «перенесённая личность R, полосой входа не входившая»), §0 таблица Ф1 Р1/Ф1-04
    what: >-
      Слово «перенесено» описывает ПРОИСХОЖДЕНИЕ значения, а переноса больше не будет
      (kacho#1268: П3 снят, «данные не переносятся»). «Дано» при этом остаётся конструируемым —
      его строит посев (значение в формате прежнего поставщика строит библиотека; ID-PW-1
      держит формат `2a` читаемым, kacho#1268: «`2a` объявлен только читаемым»), и ни один факт
      «Тогда» от переноса не зависит. Но решение #1268 заказало Ф1 новую редакцию, где
      «сценарии переноса снимаются вместе с предметом»; Ф3-04 назван «наружной половиной Ф1-04»
      и §0 ссылается на «Ф1 Р1, Ф1-04: пароли переносятся дословно». Когда та редакция Ф1 сядет,
      ссылки Ф3-04/§0 надо перемерить: предикат — `grep -n 'Ф1-04' <Ф1 новой редакции>` и
      «Дано» Ф3-04 переписать словами посева («значение в формате `2a`, положенное посевом»),
      а не переноса. Не блокирует: сегодня Ф1 ред. 13 несёт Ф1-04, и ссылка верна.
  - id: В2
    where: §18, таблица переписи, столбец «кандидатов (обязательн · требовани · смен)»
    what: >-
      В столбце стоят числа ДО правки (2 · 43 · 77 у Ф3), и это не сказано; после правки они
      15 · 47 · 78 — выросли на цитаты §18 и шапки. Читатель, прогнавший предикат по редакции 10,
      получит другие числа и не найдёт, чем единицы различались. Одно слово в заголовке столбца
      («до») либо пара «до → после», как у П1…П3.
  - id: В3
    where: шапка, пункт «Редакция 9» (:43 «повод `write` — у П3, заказ kaname#222»)
    what: >-
      Историческая запись редакции 9 (не переписана — форма верная); §18 и пункт редакции 10
      объясняют снятие. Отмечено только затем, чтобы `grep 'заказ kaname#222'` по шапке не читали
      как действующее состояние: действующее — «#222 закрыта, повода не будет» (Р17).

