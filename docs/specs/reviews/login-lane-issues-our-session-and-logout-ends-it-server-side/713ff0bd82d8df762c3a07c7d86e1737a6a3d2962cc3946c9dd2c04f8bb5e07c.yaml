      import glob, yaml
      rows = [(p, yaml.safe_load(open(p))) for p in sorted(glob.glob('docs/specs/reviews/*/*.yaml'))]
      bad = [p for p, d in rows
             if (d.get('event') or {}).get('status') == 'performed'
             and d.get('verdict') == 'APPROVED'
             and (d.get('effective_approval') or {}).get('issued') is not True]
      print('осмотрено', len(rows), '· расхождений', len(bad))
      for p in bad:
          print(' ', p)
      PY
    divergence_predicate_result: >-
      До этого коммита — «осмотрено 53 · расхождений 2» (эта запись и парная ей). После —
      «осмотрено 53 · расхождений 0». Предикат проверен в обе стороны тем же прогоном: он
      краснел ровно на двух известных записях и молчал на 21 исправной.
    gate: >-
      ГЕЙТА на это свойство в дереве НЕТ, и это сказано прямо, а не обойдено. Замер: `grep -rn
      effective_approval` по скриптам и гейтам обоих деревьев — в `scripts/change-graph-gate/`
      воркспейса 0 вхождений, в `scripts/docs-gate/` 0, в `internal/check/*.go` службы (не-тестовый
      код) каталог `docs/specs/reviews/` не читается вовсе — 0 вхождений. Семейство `cg.review`
      судит пакет `docs/changes/<change-id>/`, у которого другой дом, и до этих записей не
      достаёт. Значит предикат выше держится ВНИМАНИЕМ; держателя у него нет, и это находка
      уровня класса: расхождение «событие есть — запись молчит» стоило за сессию четырёх ложных
      выводов — число со слов диспетчера, рецензентом не перемерялось. Задачу на гейт заводит не
      рецензент: она названа строкой «нужен следующий» в возврате этого круга.

