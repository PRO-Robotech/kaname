non_blocking_findings:
  - id: N1
    class: TWIN
    where: Ф3-53 «Тогда» (м′); §8 инв. 2, строка «время»
    text: >-
      Положительный близнец (м′) назван как (ж), а (ж) отличается от (м′) больше чем одним
      фактом: ёмкость (держатель (ж) строит 4, (м′) — 1), мера (настенные часы против меры пробы),
      форма ожидания (четыре одновременных допуска против одного ждущего за приостановленной
      калибровкой). Как страж «ждущие отказаны всегда» (ж) годен, поэтому не блокирует (та же
      форма, что (к) — (а), принята кругами 8 и 9). Близнец в один факт существует и посеян:
      та же приостановленная калибровка, мера отдаёт 1 мс вместо паники — ждавший получает
      стоимость 1 мс, Calibrated=false (зелёно и сегодня, и на наброске). Держателю
      TestEnvelope_APanickingMeterLeavesNoCalibrationInFlight уместно нести его.
  - id: N2
    class: FORMAT
    where: Ф3-53 «Тогда» (м′), «Когда» (м′)
    text: >-
      Текст отказа (м′) не закреплён дословно, а сегодняшний отказ тоже называет класс. Отличает их
      только «не дожидаясь своего срока», поэтому держатель обязан утверждать и
      `!errors.Is(err, context.DeadlineExceeded)`, и время отказа меньше срока — иначе проба
      зелена на сегодняшнем производителе. «В момент паники ждёт» строится детерминированно через
      `testing/synctest` (go 1.26 в go.mod); постановка сном — гонка по построению, и в полосе,
      чей предмет — флейк, это стоит учесть.

