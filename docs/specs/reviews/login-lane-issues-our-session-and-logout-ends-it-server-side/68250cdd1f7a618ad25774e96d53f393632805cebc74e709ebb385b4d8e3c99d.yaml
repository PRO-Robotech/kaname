# ─── ЭКСПЕРИМЕНТ: ПРОБА СУЩЕСТВУЕТ, ИСПОЛНЯЕТСЯ И СПОСОБНА УПАСТЬ ─────────
experiment:
  probe: TestF12_46_OnlyCodeSuccessOpensTheWindow
  file: internal/apps/kaname/api/humansession/second_factor_window_lock_test.go
  subtest: 'пара «вход»: между сериями вход ПАРОЛЁМ'
  exists_in_tree: >-
    Да: функция в строке 127 файла, ветвь — литерал таблицы в строке 177, имя дословно совпадает с
    документом (`grep -cF` по документу → 2, по файлу пробы → 1). Файл добавлен коммитом 0ffe0c7f
    и изменён 6ae42df6 (близнец на полосе входа) — оба на ветке 287 после базы волны.
  why_rerun: >-
    Двусторонний прогон Ф12 круга 9 снят на 0ffe0c7f, где у пробы было три ветви; с тех пор файл
    пробы изменён (6ae42df6, +175/−40). Довод из соседнего артефакта перемерен на своей ревизии.
  green_after_fix: >-
    go test -p 1 -run '^TestF12_46_OnlyCodeSuccessOpensTheWindow$' -count=1 -v
    ./internal/apps/kaname/api/humansession/ на ветке 287 @ fbbf757a → ok; исполнено ветвей 4,
    зелёных 4, красных 0.
  red_before_fix: >-
    Тот же прогон на экспорте базы волны (`git archive 20a5dcaa` в tmp/ воркспейса) с подложенным
    текущим файлом пробы; обвязка пробы на базе не менялась
    (`git diff --quiet 20a5dcaa HEAD -- usecase_test.go second_factor_usecase_test.go` → 0) → FAIL:
    исполнено ветвей 4, красных 2 (названная ветвь «вход ПАРОЛЁМ» и «церемония ПАРОЛЕМ»),
    зелёных 2 (близнецы «вход ПАРОЛЁМ И КОДОМ», «церемония КОДОМ»). Названная ветвь краснеет до
    фикса и зеленеет после; её близнец зелёный на обеих ревизиях. Экспорт удалён после прогона.

