# ─── ОДОБРЕНИЕ ВЫВОДИТСЯ ИЗ ЗАПИСИ И СОБЫТИЯ, А НЕ ИЗ СЛОВА В ШАПКЕ ──────────
effective_approval:
  issued: false
  ban1_lifted: false
  why: >-
    Вердикт круга 7 — APPROVED: блокирующих ноль. Дельта против одобренной редакции 11 —
    переадресация одной отсылки на пробу, существующую в дереве ветки, и строка редакции 12;
    «Дано», «Когда», факты «Тогда», ID и счёт сценариев, решения (Р10 включительно) и §0…§18 не
    тронуты. Названная проба исполнена рецензентом в обе стороны на текущей ревизии пробы (см.
    experiment). Санкция этим не выдана: роль без внешнего события полномочия не даёт
    (change-graph.md §3); политика (docs/changes/policy.yaml → review_authority.acceptance-reviewer)
    называет `pointpu`.
  what_the_event_would_lift: >-
    Перенос действующего одобрения с редакции 11 (713ff0bd…) на редакцию 12 (68250cdd…). Нового
    предмета для кода редакция 12 не вводит: санкция по дельте редакции 11 уже выдана событием
    5737618512 и остаётся; событие на 68250cdd… нужно, чтобы документ, входящий в ствол вместе с
    фиксом, нёс одобренный отпечаток.
  what_the_owner_sees_in_the_event: >-
    Приёмка Ф3, редакция 12: отсылка к пробе переадресована на замок полосы, живущий в дереве
    (исход 2 kaname#304), той же формой, что в Ф12 редакции 12; контракт Ф3 Р10 не изменён.
  publication_pending:
