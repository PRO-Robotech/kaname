    summary: >-
      Ф3-44 (строка 2754) стоит на той же снятой посылке, что сняла Ф3-46: Given «профиль
      authn.identityProvider=own», And «профиль external стартует без полосы входа». Ключ
      посадки служба отвергает при ЛЮБОМ значении, в том числе own.
    evidence: >-
      internal/apps/kaname/config/retired_posture_key_test.go:12 «отвергается вслух при любом
      значении, в том числе `own`», :43 retiredPostureValues = {"own","external",""};
      deploy/retired_posture_key_test.go Ч2 — отказ рендера. Значит (а) Ф3-44 упадёт отказом
      ключа, а не проверкой хранилища сессии, и ветка external неисполнима.
    why_blocking: >-
      Редакция 16 сама называет этот довод основанием снятия Ф3-46 и при этом пишет «Не трогает …
      Ф3-44 и Ф3-45. Их тексты о посадке — предмет их собственной редакции» — без задачи, держателя
      и предиката снятия: это отложенная работа, а не один из трёх исходов (ban #11). Ф3-12 (близнец
      «читатель под external») и Ф3-45 — сторона края платформы, где переключатель есть
      (PRO-Robotech/kacho origin/main bea4495e934: gateway/internal/config/config.go:890
      ResolvedIdentityProvider) — к ним замечание не относится.
    fix: >-
      Привести Ф3-44 к одной посадке: Given — профиль без ключа посадки; ветку external снять
      (свойство «ключ отвергается» держит #363); строки §7/§9 по Ф3-44 согласовать.
