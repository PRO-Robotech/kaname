# ─── РАТИФИКАЦИЯ РЕШЕНИЙ РЕДАКЦИИ 4 ─────────────────────────────────────────
decisions:
  Р1:
    verdict: ПРИНИМАЮ
    basis: >-
      Уровень — состояние записи сессии и только её; три довода против строки способа
      самостоятельны, и различитель со «записью сессии» назван — СРОК (у записи он есть, 24 ч
      абсолютный, у строки способа нет). Нижнюю границу оси держит ограничение базы, а не
      проверка в коде (ban #10), и §8 даёт ему пробу с положительным близнецом: NULL → 23502,
      «0» и `aal2` → 23514, «1» проходит. Четыре законные копии названы поимённо и стоят
      близнецами инъекций гейта — без этого гейт «правило одно» краснел бы на том, чего документ
      сам требует (ОП-6).
  Р2:
    verdict: ПРИНИМАЮ
    basis: >-
      Правило ТОТАЛЬНО и согласовано с каждым сценарием — проверено перебором подмножеств
      словаря: {пароль}→«1», {код восстановления}→«1», {пароль, totp}→«2», {код восстановления,
      totp}→«1» (Ф11-11), {код восстановления, пароль, totp}→«2» (Ф11-29), {ключ uv,
      без копии}→«3», {ключ без uv}→«2», {ключ uv, с копией}→«2», {totp} один — сессия не
      выдаётся (Н71). Монотонность держится: каждая строка — «множество СОДЕРЖИТ», а отрицание
      («не допускающим копирования») — свойство САМОГО утверждения, а не множества, поэтому
      добавление предъявления уровень не понижает by construction. «Предъявление — сверка, а не
      задание» определено на обоих входах одобренных потоков, и пара Ф11-11/29 его различает.
  Р3:
    verdict: ПРИНИМАЮ
    basis: >-
      Довод «самое узкое при объединении определений» самостоятелен, и обратимость названа
      верно: недодача «3» стоит одного повторного предъявления, передача не отзывается. Перечень
      источников теперь полон — обход, а не память; обе одобренные названы и заменены поимённо.
      Границы решения названы прямо: ключ, выпущенный до появления флагов, читается как
      привязанный к устройству; аттестация — предмет Ф7.
  Р4: {verdict: ПРИНИМАЮ, basis: особых случаев у правила нет; особый случай и есть второе правило.}
  Р5:
    verdict: ПРИНИМАЮ
    basis: >-
      Перевыпуск на ЛЮБОМ успешном предъявлении — без ветки, и цена ветки названа не как
      отложенная, а как наступающая сразу: она двигала бы момент последнего предъявления
      держателю копии прежнего носителя. Срок перевыпуск не продлевает — иначе довод Р1 о сроке
      перестал бы держать.
  Р6:
    verdict: ПРИНИМАЮ
    basis: >-
      Посылка редакции 3 («у момента предъявления нет читателя») названа ложной ПЕРВОЙ и
      исправлена: читатель одобрен раньше — Ф1 §4.1, «свежесть сессии для правки своих данных —
      15 мин» (перемерено: строка 579 её текста). Два момента с разными читателями, у каждого
      сказано, двигает ли его предъявление и почему. Момента уровня нет — читателей ноль.
  Р7:
    verdict: ПРИНИМАЮ
    basis: >-
      Проверка оси СЕССИИ своя, а не функция полосы базового удостоверения, и довод перемерен:
      `acrFromCredentialLevel` принимает «0» в ветке `case "0", "1", "2", "3"` и возвращает
      recognized=true — то есть переиспользование пропускало бы «0» молча, без счётчика.
      Редакция 3 писала «той же проверкой», редакция 4 это сняла (ОП-5) — исправление верное.
  Р8:
    verdict: ПРИНИМАЮ
    basis: >-
      У каждого из пяти имён назван читатель; происхождение словаря названо как ВЫБОР, RFC 8176
      отвергнут с доводом. Имя `recovery_code` вместо литерала `code` поставщика обосновано тем,
      что ни один из двух читателей имён в дереве `code` не читает.
  Р9: {verdict: ПРИНИМАЮ, basis: перечень выводится правилом из провязанных способов; следствие названо прямо и не смягчено — посадка own не стартует, пока каталог требует «2».}
  Р10:
    verdict: ПРИНИМАЮ — ЭТО И ЕСТЬ ЗАКРЫТИЕ Б5
    basis: >-
      Двенадцать пунктов, у каждого «что говорит», «исход» и «довод»; третий исход («оставить
      обоим») раздел прямо не допускает и сам себя на этом ловит — редакция 3 допустила его в
      п.9, редакция 4 исправила. Границу расхождения назвала верно: F4e строила вывод для полосы
      ПОСТАВЩИКА, и вывода этого в дереве нет — перемерено мною на 45d1719fe8: литералов видов в
      не-тестовом коде края 0 при контроле образца 24 с пробами; `authz.step_up` в прод-коде края
      0; строк формы 401/код 16 — 2. Ошибки автора названы первыми и в двух поколениях сразу
      (редакции 1–2 не вели обхода вовсе; редакция 3 вела его на одном языке и по решениям, а не
      по сценариям).

