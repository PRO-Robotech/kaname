non_blocking:
  - id: В1
    where: §9 п.3, первая строка предиката
    what: >-
      `git grep -c … | wc -l` — `-c` печатает счёт по файлу, `wc -l` считает файлы с
      совпадением; строка унаследована от редакций 1…4 и меряет «файлов с объявлением», а
      комментарий читает «1 → 0» как число объявлений. Совпадает, пока функция объявлена в
      одном файле. Не блокирует: единица названа неточно, число верно.
  - id: В2
    where: шапка, второй пункт («Ревизии измерения»)
    what: >-
      Пункт редакции 5 называет 275240efdc и 6acf8f19; ниже осталась строка редакций 1…4 с
      45d1719fe8 как «ревизией измерения» без пометки «было». Читатель, взявший вторую,
      получит «2» там, где документ утверждает «3». Не блокирует: §9 п.3 и §14 называют обе
      ревизии рядом с числами.

