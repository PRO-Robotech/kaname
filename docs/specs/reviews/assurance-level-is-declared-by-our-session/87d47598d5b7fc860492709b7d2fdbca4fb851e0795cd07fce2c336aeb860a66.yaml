questions:
  - q: новая редакция исполняет РОВНО решение — ни шире, ни уже
    answer: >-
      ДА. Решение п.1: §9 п.3 и §8 (строка гейта словаря) называют производителя снятия — S3
      (`kacho#1276`), «до S3 гейт не заводится» сказано словами — исполнено (строка §8:
      «гейт заводится изменением S3 … до S3 не заводится — сказано словами»; §9 п.3: «две
      строки, чья правая часть наступает с S3, в DoD Ф11 не входят»). Решение п.2: ориентир
      «→ 2» с доводом Р7, «сегодня 3» — исполнено (§1.2 новый абзац; §9 п.3 четвёртая строка).
      «Ф3-45 не правится» — исполнено. Сверх решения тронуты §1.3 Ч1, Р7 (последний абзац),
      §5.1 п.1/п.3, §7 инв. 8, §9 п.4 и добавлен §14 — все шесть суть следствия того же
      решения в местах, где документ называл «переключение Ф3» единственным моментом
      снятия; ни одно не заводит нового решения и не трогает Р1…Р6, Р8…Р10, сценарии §3.
      Шире решения — ноль; уже — ноль.
  - q: у каждого нового/изменённого «Тогда» есть производитель; у снятого назван предмет
    answer: >-
      Сценарии §3 не тронуты — ни одного нового «Тогда» (проверено: дифф не содержит строк
      `**Then**`/«Тогда» вне §14). Изменены предикаты и ведомость; каждый исполнен, см.
      predicates_run.
  - q: отрицания с положительным близнецом
    answer: >-
      Новых отрицаний нет. Близнец §7 инв. 8 (`own_session_assurance_test.go` как законный
      близнец наряду с `auth_basic_stepup_internal_test.go`) — файл в дереве платформы есть.
  - q: прежние записи ревью не тронуты
    answer: >-
      ДА — `git diff 6acf8f19..c6a3c12e -- docs/specs/reviews/` пуст; три записи на месте.
  - q: соседи (ведомости соответствия) согласны
    answer: >-
      ДА — Ф3-45 не правилась и совпадает с тем, что Ф11 §1.3 Ч1 / §5.1 теперь утверждает;
      Ф11 §14 цитирует Ф3-45 дословно (`grep -c 'прежнего поставщика и'` → 1, исполнено).

