blocking:
  - id: Б1
    kind: NEGATIVE
    where: §3.4 «объём исхода (а)», строка З1; §8 строка Ф11-34…42
    what: >-
      Контракт вводит новое правило: запись сессии по ссылке годна, только если она жива и её
      личность равна доверенной личности вопроса; иначе — как вопрос без нашей сессии. Ни один
      сценарий и ни одна инъекция §8 это правило не наблюдают: реализация, берущая запись по
      ссылке без обеих проверок, зеленеет на всех Ф11-34…42.
    predicate: >-
      grep -n -iE 'жива|личность равна' $F → единственное попадание — строка 990 (З1); в таблице
      сценариев §3.4 и в списке инъекций §8 (строка 1631) правила нет.
    fix: >-
      Два отрицания с близнецом Ф11-34, каждое меняет один факт: ссылка на запись, оконченную до
      вопроса, — false; ссылка на живую свежую запись «3» другой личности при доверенной личности
      U — false. Плюс инъекции «живость не проверена», «личность не сверена».
  - id: Б2
    kind: DoD
    where: §9 п.7; §8 строка Ф11-34…42; §3.4 перепись, производитель «пересылка краем»
    what: >-
      П.7 утверждает «край её пересылает (Ф11-38 зелен — без пересылки он красный)». Но §8 ставит
      Ф11-34…42 на границу службы, где ссылку и уровень доверенными ключами подаёт сама проба.
      На этом слое пересылка края не исполняется, и Ф11-38 от её отсутствия не краснеет. Третий
      производитель З1 (kacho, полоса нашей сессии) не наблюдается ни одним сценарием.
    predicate: >-
      sed -n 1631p $F — «вопрос о себе — так, как его задаёт край… доверенными ключами от
      проверенного отправителя»; sed -n 1688p $F — утверждение п.7.
    fix: >-
      Сценарий слоя края (как Ф11-18/19) либо сквозной: принятый носитель S → край пересылает
      ссылку, равную названной службой для S; близнец — клиентское значение того же ключа
      снимается и не пересылается. Либо переписать п.7 без ложной опоры на Ф11-38.
