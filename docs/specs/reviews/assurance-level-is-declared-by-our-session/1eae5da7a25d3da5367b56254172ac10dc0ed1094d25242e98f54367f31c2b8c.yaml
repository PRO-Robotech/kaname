blocking:
  - id: Б1
    kind: PRODUCER
    where: §3.4 «объём исхода (а)», строка З1; §15 «решения»
    what: >-
      Канал З1 назван «служба выводит доводы из своей записи сессии вопрошающего», и при этом
      «край нового значения не несёт, правки фундамента нет». Сам документ (§1.7) называет этот
      законный канал «по пересланной краем ссылке на сессию». Такой ссылки на границе службы нет:
      доверенными фундамент объявляет только principal-* и token-acr; полоса нашей сессии края
      пересылает личность и уровень. Контракт не называет, по чему служба находит запись сессии
      ЭТОГО вопроса, — производитель «Тогда» Ф11-34/-38/-40 не определён.
    predicate: >-
      corelib v1.10.0 principalwire/keys.go:172-182 (Fundament: true — только principal-*,
      token-acr); PRO-Robotech/kacho@f4c74ba1aa1 gateway/internal/middleware/auth_own_session.go:162-168;
      kaname@b0e6b4e5 internal/service/authorize_service.go buildCondContext — из доверенного только acr.
    fix: >-
      Назвать носитель ссылки на сессию вопроса (что пересылает край и чем фундамент считает это
      доверенным) либо иной законный канал — и привести §3.4/§15 в согласие с §1.7.
  - id: Б2
    kind: TWIN
    where: §3.4, общее «Дано»; §7 инв. 2
    what: >-
      Во всех Ф11-34…41 у личности U одна живая сессия. Ни один сценарий не различает «запись
      сессии этого вопроса» и «другую запись той же личности»: пробы зеленеют при любом выборе
      записи. Нужна пара, отличающаяся ровно одним фактом — у U две живые сессии с разными
      моментами уровня; исход определяется сессией, от имени которой задан вопрос.
  - id: Б3
    kind: CONSTRUCTIBILITY
    where: Ф11-38 «Дано»; перепись производителей, строка 37/38; §9 п.7
    what: >-
      «Внутри живой сессии предъявлено утверждение ключа с проверкой пользователя» — производителя
      нет и он не назван. Глагол повышения принимает password/totp/lookup_secret; одобренная Ф13
      выносит предъявление ключа в повышении из объёма (к Ф7 #1273 и Ф12 #1281). Строка 37/38
      переписи называет только момент уровня. Ф11-38 — положительный близнец Ф11-37, без него
      отрицание неотличимо от «момент не двигается ничем»; п.7 DoD без него недостижим.
    predicate: >-
      internal/apps/kaname/api/humansession/step_up.go:10-12;
      docs/engineering/acceptance/passwordless-login-with-access-key.md:996-999, :1397.
    fix: >-
      Назвать производителя (фаза/задача) в переписи и §5 либо взять близнецом предъявление,
      которое продукт уже производит и которое по Р2 даёт «3».
