      (A) единственный писатель факта — триггер relation_fact_from_journal — начинает переносить
      условие → PASS 3/3; (B) значение реконсилера получает поле условия → FAIL только
      TestConditionProducerPremise, TestNoStaleConditionExceptions → PASS; (C) служба восполняет
      довод способов из доверенного контекста (звено З1), сборка проходит → PASS 3/3; (D, контроль
      способности упасть) оговорка `with mfa_fresh` снята с отношения в
      proto/kaname/cloud/iam/v1/fga_model.fga → FAIL TestNoStaleConditionExceptions («excuses
      "compute_instance#console with mfa_fresh", which the canonical model no longer declares»).
    revision: kaname@99f53f9d
    why_blocking: >-
      §6 пишет: «запись ведомости unproducedConditionSites уходит, когда у условия появляется
      производитель; оставшуюся делает находкой TestNoStaleConditionExceptions, и отношение обязано
      получить поведенческую пробу — ею и возвращаются четыре сценария»; §11 — «возврат держит гейт
      службы». TestNoStaleConditionExceptions краснеет только на СНЯТИИ оговорки из модели (D), а
      при появлении производителя молчит в трёх формах из трёх (A, B, C). Производитель через
      триггер и через доверенный канал не роняет ничего; через значение реконсилера роняет другую
      пробу, и она не требует ни снять запись, ни завести поведенческую пробу — ведомость можно
      оставить как есть. Это закрытие Б1 исходом (б), а исход (б) требовал СУЩЕСТВУЮЩЕГО
      держателя. С неверным держателем вынесение становится обещанием, за которым никто не следит
      (ban #11), а текст — заявлением шире сделанного.
    outcomes: >-
      Переписать строку §6, строку Б1 §11 и Н34 по факту: истечение ведомости механизировано для
      двух форм — снятие оговорки (TestNoStaleConditionExceptions) и поле условия у значения
      реконсилера (TestConditionProducerPremise); производитель через триггер журнала (второй
      писатель факта запрещён гейтом единственного писателя, internal/check/relation_fact_sole_writer.go,
      так что триггер — единственный путь) и через доверенный канал доводов не роняет ничего, и
      возврат по ним держит решение владельца, которое строка уже называет. Альтернатива — назвать держателем то, что
      действительно краснеет на всех трёх формах, и показать это инъекцией. Предикат снятия:
      тексты §6/§11/Н34 не утверждают истечения, которое A и C опровергают.

# ─── ВАЖНЫЕ, НЕ БЛОКИРУЮЩИЕ ─────────────────────────────────────────────────
non_blocking:
  - id: В9
    title: первая фраза §3.0 противоречит Р7 и Ф11-19
    detail: >-
      Строка 536: «Уровень не выставлен полем ни в одном ответе о ресурсах и о сессии и не должен:
      у такого поля не было бы читателя». Строка 480 (Р7): «Край берёт из ответа нашей службы о
      сессии уровень»; строка 611 (Ф11-19): «ответ службы о живой сессии не несёт уровня» —
      отрицание, осмысленное лишь при поле в этом ответе. Читатель у поля есть — край. Уточнить до
      «в ответах клиенту»; решение по консоли — часть Б5.
  - id: В10
    title: Ф11-03 не фиксирует флаг резервного копирования, пара с Ф11-04 не одно-фактна
    detail: >-
      §7 инв. 2 называет отличием Ф11-03 от Ф11-04 проверку пользователя, но Ф11-03 флага
      резервного копирования не задаёт. Выбери исполнитель у Ф11-03 ключ, допускающий копирование,
      — реализация, выдающая «3» за «не допускает копирования» без оглядки на проверку
      пользователя, пройдёт все три сценария 03/04/05. Ловит её модульный набор §8 по всей
      таблице, поэтому не блокирует; в Ф11-03 дописать «резервного копирования не допускает».
  - id: В11
    title: два «Тогда» содержат ненаблюдаемую половину
    detail: >-
      Ф11-12 «уровень не изменён» — сессия отозвана, по §3.0 уровень наблюдается только исходом
      глаголов, а на отозванной сессии все отвергаются. Ф11-31 «множество предъявленного прежнее»
      — множество не выставлено, а в этом «Дано» ни один последующий исход его не различает. §7
      инв. 1. Снять либо дать наблюдение.
  - id: В12
    title: §3.0а называет производителем подменного состояния повышение, а оно перевыпускает носитель
    detail: >-
      Строка 572: «так его производит вход паролем с повышением кодом по времени». По Р5 повышение
      перевыпускает носитель; состояние Ф11-16/-20 — {password, totp} при «2» на ИСХОДНОМ
      носителе — производит вход сразу двумя факторами (Ф11-02), а не повышение. Состояние
      производимо, неверно лишь названный производитель.
  - id: В13
    title: смена пароля со сверкой прежнего — предъявление, значит перевыпуск носителя; Ф3 об этом не сказано
    detail: >-
      Р2 (строка 386) оставляет условным «если поток смены сверяет прежний пароль», но одобренная
      F4d Р4 (строка 451) уже решила: «смена пароля — требует подтверждения текущим способом». По
      Р2 это предъявление, по Р5 — перевыпуск носителя меняющей сессии. Требование ложится на
      поток смены Ф3 (Ф1-15) и ей не передано.

