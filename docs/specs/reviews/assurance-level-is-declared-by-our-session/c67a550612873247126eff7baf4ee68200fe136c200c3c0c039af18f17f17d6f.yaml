      о выборе снимет вопрос у следующего читателя.
  - id: В8
    title: предикат §1.1 обходит один файл миграций
    detail: >-
      Сегодня вывод верен и для всех 17 SQL-миграций. После Ф2/Ф3 таблица сессии
      появится НОВОЙ миграцией, и предикат, читающий 0001_initial.sql, продолжит давать
