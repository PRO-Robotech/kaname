decisions:
  Р1:
    verdict: ПРИНИМАЮ
    basis: >-
      «0» и «не задано» у выданной сессии невыразимы; отказ по неназванному уровню
      закреплён фундаментом (acr_extract_test.go:56) и краем
      (TestStepUpAlwaysOn_SessionLane_NoAssurance_FailsClosed). Поле — вместе с таблицей
      сессии, какая бы фаза её ни завела: верно, и конфликт производителя таблицы
      (Ф1 — Ф3, #1268 — Ф2) назван честно (§10 п.2).
  Р2:
    verdict: ПРИНИМАЮ ПРАВИЛО, ТРЕБУЮ ОПРЕДЕЛИТЬ ВХОД
    basis: >-
      Таблица, монотонность и закрытость верны; «код восстановления ко «2» не
      прибавляет» — довод сильный. Вход «задание пароля» не определён — Б2.
  Р3:
    verdict: ПРИНИМАЮ
    basis: >-
      «Самое узкое определение» — самостоятельный довод; различитель — флаги ЭТОГО
      утверждения; граница (ключи без флагов) названа. Довод о цене («передача делает
      mfa_fresh выполнимым ключом вне устройства») сегодня теоретический — условие не в
      силе (Б1); решение от этого не слабеет, но довод стоит переписать.
  Р4:
    verdict: ПРИНИМАЮ, С ОГОВОРКОЙ Б2
    basis: >-
      «Уровень — предъявленное, а не заведённое» верно; случай восстановления
      недоопределён в части обязательного задания пароля (Ф1-27).
  Р5:
    verdict: ПРИНИМАЮ
    basis: >-
      Перевыпуск на любом успешном предъявлении закрывает освежение момента держателем
      копии; единица отзыва — сессия, Ф1-14…17 не меняются. Производитель цены — В6.
  Р6:
    verdict: ПРИНИМАЮ ПО СУЩЕСТВУ, НЕ ПРИНИМАЮ «ДВА ЧИТАТЕЛЯ»
    basis: >-
      «Слабое предъявление момент не двигает» и «отзыв по моменту не взвешивается» —
      верно. Действующих читателей момента сегодня ноль (Б1, consequence_for_decisions).
  Р7:
    verdict: ПРИНИМАЮ
    basis: >-
      Снятие пространства x-kacho- до выбора полосы проверено в дереве края
      (IsClientForgeableKey, stripForgeableIdentityHeaders); форма отказа по полу —
      BuildStepUpChallenge и enforceStepUpHTTP (401, code 16, «presented ACR N»,
      пустое → «0»). Громкое состояние полосы — sessionAssurance со счётчиком.
  Р8:
    verdict: ПРИНИМАЮ
    basis: >-
      Закрытый словарь, одно имя webauthn в обеих ролях — довод от литерала модели
      верен. Происхождение имён — В7.
  Р9:
    verdict: ПРИНИМАЮ
    basis: >-
      Производители проверены: текст отказа — unreachableFloorsComplaint
      (lane_requirements.go: «%d catalog entr(ies) demand … — the lane offers %s»),
      самоотчёт — laneWiringCensus (`lane_presentable_acrs` = len). Ф11-27/28 имеют
