    detail: >-
      Решают по уровню общим правилом ТРИ точки, а не две (§4.1 «два замка, одна
      функция»): край, второй замок (acr_floor.go:167) и публичный слушатель службы на
      полосе предъявленного удостоверения (public_caller_policy.go:283-292: уровень из
      утверждения `acr` проверенного токена, presentedcred/reader.go:595 →
      callerorigin.WithAssurance). Предикат: `git grep -nE 'EvaluateStepUp\(|ACRSatisfies\(|CheckAssurance\('
      -- '*.go' ':!*_test.go'` в обоих домах. Второй пропущенный читатель —
      internal/handler/iamhooks/refresh_hook_handler.go:124,271 (уровень из
      утверждений сессии внешнего OAuth-сервера при обновлении — сосед Ч6, тот же
      исход: уходит с издателем). При приоритете «служба самостоятельна в чужом
      облаке» §6 строка 2 обязана назвать следствие прямо: у человека нет полосы,
      которой уровень доезжает до пола собственного слушателя службы без края.
  - id: В2
    title: §5.3 — источники выбраны перечнем, а не обходом
    detail: >-
      См. traversal.missing_sources. Строку «Обход: …» стоит сопроводить предикатом,
      которым список источников выводится, иначе знаменатель считает то, что автор
      вспомнил.
  - id: В3
    title: у Н9 есть поведенческий держатель, и его стоит завести
    detail: >-
      Ф11-19 с конкретной величиной вне оси — словарной «aal2» поставщика. Сегодня край
      переводит её в «2» и пропускает пол «2»; после Ф11 — «0» и отказ. Это RED→GREEN
      для «край ничего не сопоставляет» (Р7, Н9) исходом, а не только гейтом дерева.
  - id: В4
    title: законный близнец гейта словаря поставщика (§8) лежит вне обхода
    detail: >-
      Тесты из обхода исключены, значит литерал в пробе близнецом не является — гейт
      молчит на нём by construction. Близнец обязан лежать ВНУТРИ обхода: упоминание
      словаря в комментарии не-тестового файла края (документ сам называет этот случай
      — «иначе краснел бы на комментарии»).
  - id: В5
    title: три «Тогда» сформулированы шире одного исхода
    detail: >-
      Ф11-09: для конкретного «Когда» (повторно пароль) исход — «тот же уровень», а не
      «тот же либо повышенный». Ф11-11: строка «2» Р2 дизъюнктивна (ключ сам по себе
      тоже «2»), поэтому «чего не хватает» определять относительно способов, заведённых
      у личности; в «Дано» ключа нет — значит пароль, и это надо сказать. §3.0:
      «единственный ответ, который называет уровень, — ответ церемонии» — вызов отказа
      тоже называет его («presented ACR L»).
  - id: В6
    title: цена Р5 и порядок относительно Ф8 не имеют производителя
    detail: >-
      Повтор консолью запроса, отвергнутого по прежнему носителю, — ничьё изменение в
      ведомости не производит. Окно консоли повышения после переключения Ф3 ведёт поток
      поставщика с `aal: "aal2"` (StepUpModal.tsx:146) и поднимает ЕГО сессию, а не
      нашу; до Ф8 браузерное повышение в консоли не действует. На посадке own это
      сейчас не наблюдаемо (Р9 не даст ей стартовать до Ф12), но §5.1 объявлен
      «порядком, названным здесь», и строки о Ф8 в нём нет.
  - id: В7
    title: происхождение словаря Р8 не названо
    detail: >-
      Р8 берёт имена способов поставщика (password, totp, lookup_secret, webauthn) и
      одно своё (recovery_code), а не RFC 8176. Черновик 3.2, на который опирается Р3,
