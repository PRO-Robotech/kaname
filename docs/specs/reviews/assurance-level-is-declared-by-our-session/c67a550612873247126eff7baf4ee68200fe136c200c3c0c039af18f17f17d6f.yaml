      сохранённым хешем; задание пароля — при восстановлении и при смене — предъявлением
      не является» (либо обратное, с доводом, закрывающим угрозу выше). Ф11-07 и Ф11-11
      переписать через обязательный шаг Ф1-27; Ф11-11 тогда становится одно-фактным
      держателем решения: сессия восстановления → задан новый пароль → предъявлен
      второй фактор → уровень «1», недостаёт пароля.

  - id: Б3
    title: >-
      «Дано», собранные подменой, дают состояния, которых правило не производит; «Тогда»
      Ф11-10 противоречит Р2, Ф11-23 зеленеет по чужой причине
    sections: [Р1, Р2, §3.2 Ф11-10, §3.4 Ф11-21…23, §5 (строка Ф11-10), §8 (группа различителя)]
    predicate: >-
      Р2: «Уровень — наивысшая строка, чьё условие выполнено» над множеством
      предъявленного; Р1: уровень — поле сессии. «Дано» Ф11-10 строится «подменой, как
      в Ф11-16» — подменяется ТОЛЬКО уровень: поле «2», множество {password}.
      Таблица Р2 даёт f({password}) = «1». «Когда» Ф11-10 — повторно предъявлен пароль;
      множество остаётся {password}, пересчёт по Р2 даёт «1», а «Тогда» утверждает
      «остаётся «2»». Ф11-21/22: записаны уровень «3» и способы {webauthn} — без флагов
      предъявления, которых Р3 требует для «3»; по Р2 f({webauthn}) без флагов = «2».
    revision: kaname@b80cea9d
    why_blocking: >-
      Сценарий DoD Ф11 утверждает поведение на состоянии, недостижимом продуктом, и
      этим выбирает реализацию, которой документ не объявлял. На достижимых состояниях
      «поле := f(множество)» и «поле := max(поле, f(множество))» совпадают (правило
      монотонно); различаются они только на подменённом. Буквальная реализация Р2 на
      Ф11-10 КРАСНАЯ; зелёной его делает лишь реализация, где хранимый уровень —
      самостоятельный вход наравне с множеством, то есть второе основание уровня рядом
      с «одним правилом». Ф11-23 на буквальной реализации даёт отказ по acr («2» после
      пересчёта), а не по несвежему моменту — зелёный исход не держит Р6, ради
      которого сценарий заведён.
    outcomes: >-
      Строить подменой только СОГЛАСОВАННЫЕ состояния: записывается множество
      предъявленного вместе с флагами каждого предъявления, уровень равен правилу над
      ним, момент — по Р6. Для Ф11-10 это «множество {password, totp}, уровень «2»» (до
      Ф12 — прямой записью, после — настоящим предъявлением). Для Ф11-16 и Ф11-20
      (край и второй замок читают только уровень) допустима и прежняя форма — назвать
      это. Либо объявить хранимый уровень самостоятельным входом и показать, как при
      этом держатся «одно правило» и гейт «единственный писатель» §8.

  - id: Б4
    title: >-
      Ф11-14 стоит в DoD Ф11 с «исполнимо с Ф3», а его «Дано» — успех Ф11-08, который
      требует Ф12: DoD п.2 («шестнадцать») недостижим в Ф11 by construction
    sections: [§3.2 Ф11-14, §5, §5.2, §9 п.2]
    predicate: >-
      Ведомость §5: «Ф11-08 | … | Ф3, Ф12 | Ф12»; «Ф11-14 | … | Ф3 | **Ф11**».
      «Дано» Ф11-14 дословно: «предъявления Ф11-08 (успех) и Ф11-13 (отказ)»; «Дано»
      Ф11-08: «у личности заведён второй фактор» — Ф12. §5.2 считает Ф11-14 среди 16,
      §9 п.2 требует зелени всех 16.
    revision: kaname@b80cea9d
    why_blocking: >-
      Признак готовности фазы, недостижимый by construction, закрывает фазу словом, а не
      фактом — тот же класс, что Б1 круга 1 у Ф1. Цена починки — одна строка.
    outcomes: >-
      Строить успех Ф11-14 повторным предъявлением пароля (как Ф11-09 — уровень «до» и
      «после» равны, запись журнала от этого не перестаёт быть предметом), либо
      перенести Ф11-14 в DoD Ф12 и пересчитать 15 / 13. Тем же заходом у Ф11-13
      назвать, что DoD Ф11 исполняет ветвь пароля, а ветвь кода второго фактора — DoD
      Ф12 (сейчас «Дано» дизъюнктивно, а строка ведомости одна).

# ─── ОБХОД В ОБЕ СТОРОНЫ ────────────────────────────────────────────────────
traversal:
  denominator_present: >-
    Да. §5.3 печатает величину о СОБСТВЕННОМ обходе — «источников нормы 32 · имеющих
    сценарий 29 · держатель без сценария 3 · без держателя 0» — и обратную сверку «0 из
    28 сценариев без строки Н». Перемерено: сходится (см. predicates_run §5.3).
  forward_norms_to_scenarios: >-
    Обход своих источников повторён поимённо, ревьюер читал их сам (`gh issue view`):
    тело #1280 — признак (своё хранилище выдаёт уровень) → Н1/Н15; предмет (сессия
    несёт уровень · из фактически предъявленного · пароль → 1 · пароль и фактор либо
    ключ → 2 · ключ с проверкой → 3 · пересчёт при повышении) → Н1, Н12, Н2, Н3, Н4, Н5,
    Н6; предикат (отвергается с одним паролем · проходит после фактора · оба исхода ·
    сопоставление одно · подмена меняет исход) → Н7, Н8, Н11, Н9, Н10; оба комментария →
    Н15, Н11, Н16. Строки без источника либо источник без строки — не найдены. Тело #1266
    (предикат снятия, «что готово») — Н12, Н13; строки об уровне в #1281 и #1282 — Н23,
    Н24; Ф1 §0.2, §1.5, §4.2, §5, Ф1-01 — Н14…Н19. Решения Р1…Р9 → сценарии: Р1 —
    01/06/07; Р2 — 01/02/03/04/05/07/10/11; Р3 — 04/05 (через Б1); Р4 — 03/06/07; Р5 —
    09; Р6 — 12 (отзыв по моменту не взвешивается) и 10/22/23/24 (сдвиг момента — через
    Б1); Р7 — 15…19; Р8 — 14 (имена в журнале) и 21/24 (роль `webauthn` — через Б1); Р9 —
    27/28. Решений без сценария — 0. Решений, чья НЕСУЩАЯ часть наблюдаема только через
    неисполнимое условие, — 3: Р3 (различие «3» и «2»), Р6 (кто двигает момент), Р8
    (одно имя `webauthn` для первого и второго фактора).
  reverse_scenarios_to_norms: >-
    Все 28 сценариев стоят в строках Н (перемерено comm-сверкой — 0). Сверх того
    проверено, что каждая строка Н, названная для сценария, действительно его
    предмет: расхождений нет, кроме Н25 («3 — аппаратно привязанный ключ»), чьи
    сценарии 04/05 держатся условием из Б1.
  missing_sources: >-
    Знаменатель 32 верен для выбранных источников, но выбор источников сделан
    перечнем, а не обходом, и шесть источников, ограничивающих уровень, в нём
    отсутствуют — на уровень выше, чем «отсутствующая строка»: отсутствующий ИСТОЧНИК.
    (1) контракт вычисления условия в службе — buildCondContext / serverAuthoritativeCondKeys
    и держащая его проба — требование «доводы условия только из доверенного
    источника» (→ Б1); (2) гейт TestConditionedRelationHasAProducer с
    unproducedConditionSites — «условие не в силе нигде» (→ Б1); (3) Ф1-27 —
    обязательное задание пароля в сессии восстановления (→ Б2); (4) Ф1-15 — смена
    пароля изнутри сессии как возможный вход правила (→ Б2); (5) пол на
    публичном слушателе службы по полосе предъявленного удостоверения — третий
    читатель уровня, решающий общим правилом (→ В1); (6) хук обновления токена —
    читатель уровня внешнего издателя, сосед Ч6 (→ В1). Предикат, которым их находить,
    — обход по свойству, а не по перечню: вызовы EvaluateStepUp|CheckAssurance|ACRSatisfies
    в обоих деревьях плюс чтения `acr`/`amr_claims`/`mfa_at` в не-тестовом коде
