blocking:
  - id: B1
    kind: PRODUCER
    scenario: 981-24
    claim: >-
      «Тогда» 981-24 — «отказ тем же кодом, полем и текстом, что у загрузки того же документа
      судьёй kaname#979». Производителя нет (Н9), и его контракта отказа нет нигде: kaname#979 —
      задача исполнителя без приёмки, её тело не называет ни кода, ни поля, ни текста, ни границы
      «своего яруса». Утверждение без конкретного кода и поля (чек-лист 3.3) и без закреплённого
      соседа (fa-b7) не проверяемо. Сверх того — конструируемость вариантов в грамматике посева
      этого дерева: (а) роль чужого модуля в `roleId` отвергает существующий судья связности
      `ErrRoleNotDeclared`, как только документ объявляет раздел `roles` (а 981-23 требует, чтобы
      D(registry, 2) нёс роль), — то есть отказ придёт не от судьи kaname#979, и проба будет
      зелёной без него; (б) «область выше своего яруса» невыразима: выдача посева объявляется
      только на якоре кластерного singleton'а (`ErrBindingAnchor`), выше него области нет, а ниже
      — уже отказ существующего судьи. Наконец, DoD п.2 требует зелени 981-24 на одной голове
      этого PR, а порядок «kaname#979 влита раньше» нигде не объявлен.
    predicate: >-
      gh issue view 979 -R PRO-Robotech/kaname → OPEN, тело без кода/поля/текста отказа;
      git ls-tree --name-only origin/981 docs/engineering/acceptance | grep -c 979 → 0;
      git show origin/981:internal/manifest/linkage.go — строки 415–424 (`ErrRoleNotDeclared` при
      `roles.declared`); internal/manifest/manifest.go:510–519 (`roleIDsOf`);
      internal/manifest/grantanchor.go:83–113 (`validateGrantAnchor`, якорь — только кластер).
    answer_to_dispatcher_question: >-
      Названная зависимость на ещё не сделанного производителя допустима при трёх условиях разом:
      (1) контракт отказа зависимости (код, поле, текст, граница перечня) закреплён одобренным
      артефактом либо влитым коммитом — путём и отпечатком; (2) порядок посадки объявлен в DoD
      (стадия с 981-24 — после вливания зависимости) либо сценарий переносится в DoD зависимости;
      (3) вариант построен так, что отвергнуть его может ТОЛЬКО судья зависимости. Здесь не
      выполнено ни одно — в нынешнем виде недопустима.
    fix: >-
      Вариант А (рекомендован, порядка между задачами не создаёт): 981-24 утверждает, что
      `Publish` вызывает тот же полный судья посева, что и прочие пути приёма документа, и
      доказывает это существующим различающим отказом с конкретным кодом, полем и текстом
      (например, выдача посева с `scopeType` аккаунта → `INVALID_ARGUMENT`,
      `document.seed.accessBindings[0].scopeType`, текст `ErrBindingAnchor`) и законным
      близнецом (якорь кластера → принято); строка У15 называет, что судья перечня kaname#979
      встаёт в тот же вход, а его проба вызовом — в DoD kaname#979. Вариант Б: оставить сценарий,
      закрепить контракт kaname#979 по его влитому коммиту, вынести 981-24 в стадию после
      вливания kaname#979 и выбрать вариант, проходящий всех существующих судей связности.
  - id: B2
    kind: CONSTRUCTIBILITY
    scenario: 981-16
    claim: >-
      Given 981-16 — «встроенная часть объявляет выдачу `module_publisher` субъекту `user:*`, затем
      `system_class:authenticated`, затем `group#member`», «Тогда» — отказ старта, где ДОПУСК
      МОДЕЛИ называет отношение и вид субъекта. В грамматике посева первые два варианта отвергает
      судья вида субъекта (`ErrSubjectNotSeeded`: посев заводит только `group` и `serviceAccount`)
      — его текст не называет `module_publisher`; выдача отношения посевом объявляется только на
      якоре кластера, тогда как `module_publisher` живёт на объекте `module:<m>`; таблица Р4б
      несёт имя учётки, а не вид субъекта. Ни в одной из форм Given не доходит до допуска модели.
      Следствие для держателя: инъекция DoD п.3 «разрешить подстановку в `module_publisher`»
      (правка объявления отношения) 981-16 не краснит — выдача `user:*` по-прежнему отвергнута
      прежним судьёй. Держатель У4 не способен упасть на своей инъекции.
    predicate: >-
      git show origin/981:internal/manifest/linkage.go — строка 181
      (`seedableSubjectTypes = []string{"group", "serviceAccount"}`), строки 432–455 (отказ вида
      субъекта ДО канона); internal/manifest/grantanchor.go:83–113;
      internal/manifest/relationgrant.go:143–200 (отношение судится на типе якоря).
    fix: >-
      Держать Р4г там, где живёт свойство, — на объявлении отношения в собранной и допущенной
      модели: проба читает объявление `module_publisher` и требует ровно `{service_account}` прямым
      получателем (без подстановки, класса, членства); инъекция — правка объявления на
      `[service_account, user:*]` (затем класс, затем `group#member`) → красная, откат → зелёная.
      Если сохраняется вариант «выдача», назвать форму данных, которой он выражается, и
      производителя его отказа дословно.

non_blocking:
  - id: N1
    kind: TWIN
    scenario: 981-29
    note: >-
      Близнец назван 981-52 — другой глагол и другой вызывающий, не один факт. Близнец по одному
      факту: тот же `Publish` ревизии 5 с одним ресурсом → принято.
  - id: N2
    kind: FORMAT
    scenario: 981-82
    note: >-
      «Тогда» «класс EXTENSION или UNCHANGED» — исход через «или». По §2.5 `UNCHANGED` требует
      живой части с равной ревизией, а части `registry` в Given нет — назвать один класс. В §4
      строка «база после прежнего пути» называет писателя только строк каталога; для «выдач на
      них» и фактов владения на объектах `registry_*` (без них «прежние разрешения снова
      allowed = true» не проверяемо) назвать писателя — при новом коде без опубликованной части
      путь `RegisterResource` их, по §2.7, не запишет.
  - id: N3
    kind: FORMAT
    scenario: 981-02
    note: >-
      «по объекту `registry_repository` под привязкой» — без идентификатора объекта и области
      привязки; дать конкретные значения, как в 981-01 (`reg-01`).
  - id: N4
    kind: FORMAT
    scenario: 981-19
    note: >-
      «текст равен отказу загрузчика на том же документе»: чтение каталога при старте этим же
      изменением снимается (981-88), и сравнивать станет не с чем. Назвать сравниваемое прямо —
      вид `ErrJoinServiceAccountNotSeeded` и его текст (строка 646–652 `linkage.go`), а не путь.

