verdict_note: >-
  Два блокирующих (роды PRODUCER и CONSTRUCTIBILITY): сценарий 981-24 опирается на судью, у которого
  нет ни кода, ни контракта отказа, а его варианты в нынешней грамматике посева либо отвергаются
  уже существующим судьёй, либо невыразимы; сценарий 981-16 строит Given выдачей посева, которую
  отвергает судья вида субъекта раньше допуска модели, поэтому названная DoD п.3 инъекция его не
  краснит. Остальное — перепись §0, сценарии, близнецы, производители §7, DoD, решения Д1…Д8 —
  годно; замечания ниже не блокируют.
