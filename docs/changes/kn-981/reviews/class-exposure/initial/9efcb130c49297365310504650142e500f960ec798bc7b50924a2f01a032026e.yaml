items:
  # ── Р1. Части модулей в базе: ревизии неизменяемые, монотонные, sha256, CAS ──────
  - id: CE-01
    decision: Р1 — ревизия части модуля неизменяема и монотонна
    class: 'I; data-integrity ban #10'
    condition: >-
      Неизменяемость и монотонность держит БАЗА: таблица ревизий с ключом
      (модуль, ревизия), CHECK ревизия ≥ 1, в прод-коде нет ни одного UPDATE/DELETE
      по этой таблице; вставка младшей или равной — ноль строк, исход называет
      «младшая» и «конфликт содержимого» раздельно (форма JudgeRevision из kaname#865).
      Откат — только новой старшей ревизией с прежним содержимым.
    held_by: >-
      нужен гейт: integration (testcontainers) «UPDATE ревизии отвергнут базой» и
      перепись операторов записи по таблице = только INSERT; сегодня история ревизий
      отсутствует (хранится лишь указатель applied_revision/applied_digest)
    state: open
  - id: CE-02
    decision: Р1 — запись через CAS по базовой ревизии; модель собирается ЦЕЛИКОМ из частей всех модулей
    class: R
    condition: >-
      Публикация модуля A собирает модель из ТЕКУЩИХ частей всех модулей, прочитанных
      в ТОЙ ЖЕ транзакции под тем же консультативным замком каталога, что и CAS
      ревизии A (замок — первым оператором, как в advanceRevisionSQL). Сборка вне
      транзакции записи запрещена: параллельная публикация B иначе теряется из
      модели A (потерянное обновление модели при обеих зелёных ревизиях).
    held_by: >-
      нужен гейт: concurrent integration — A и B публикуют одновременно, итоговая
      модель несёт обе части; два издателя одного модуля с одной базой — ровно один
      успех, второй — объявленный отказ CAS
    state: open
  - id: CE-03
    decision: Р1 — «базовая ревизия» в запросе публикации
    class: U
    condition: >-
      «Первая публикация» выражается ОТСУТСТВИЕМ поля базы (optional, признак
      присутствия), а не нулём; ноль и отрицательное — INVALID_ARGUMENT с именем
      поля. CAS-семантика одна: либо «база = текущая» (If-Match), либо «новая >
      применённой» (как сегодня) — выбрать в приёмке и не держать обе.
    held_by: вниманием до приёмки; затем пара проб «база отсутствует / база устарела»
    state: open
  - id: CE-04
    decision: Р1 — отпечаток sha256 у ревизии
    class: K
    condition: >-
      Производитель отпечатка один — каноническая форма manifest (JCS над деревом
      узлов YAML, форма sha256:<64 hex> закреплена CHECK). Job импорта, Plan и
      Publish зовут его же; клиент отпечаток не присылает либо присланный только
      сверяется с вычисленным сервером, но не записывается вместо него.
    held_by: >-
      CHECK catalog_module_applied_digest_form (миграция 20261018230500) держит форму;
      единственность производителя — нужен гейт (перепись вызовов функции отпечатка
      в прод-коде = 1 производитель)
    state: open
  - id: CE-05
    decision: Р1 + зависимость kaname#906 — ревизия обязательна
    class: U
    condition: >-
      Publish отвергает документ без revision (INVALID_ARGUMENT с именем поля); Job
      импорта ревизию НЕ подставляет (подставленная ревизия — утверждение, которого
      автор манифеста не делал). Переходной ветки «ревизии нет» в Publish нет.
    held_by: >-
      пара проб «без revision → отказ / с revision → принят»; посылка задачи
      опровергнута замером N-02 — см. вопрос Q1
    state: open

  # ── Р2. Publish и Plan на внутреннем слушателе с mTLS ─────────────────────────────
  - id: CE-06
    decision: Р2 — Publish принимает ТЕЛО манифеста (инверсия решения kaname#865 «вход — имя модуля, никогда тело»)
    class: 'I; doc-truthfulness'
    condition: >-
      Оба довода прежнего решения сняты тем же изменением, а не обойдены: (1) «второй
      путь доставки» — чтение каталога снимается (Р9), путь остаётся один; (2)
      «кирпич следующего старта» — опора стража паритета (AnchorOfDelivery,
      seed.AssertCatalogParity) переносится на опубликованные ревизии базы. Шапка
      internal_module_service.proto, говорящая обратное, правится тем же коммитом.
    held_by: >-
      гейты провязки старта (module_catalog_apply_wiring_test.go,
      TestIAM1034_ServeAppliesManifestsBetweenDeliveryAndTheParityGuard) переписываются
      на новый источник; проба «опубликован новый ресурс → следующий старт поднимается»
    state: open
  - id: CE-07
    decision: Р2 — порядок проверок Publish (SAN → модуль → Check → разбор тела)
    class: P
    condition: >-
      До разбора тела: проверенный SAN (mTLS), личность учётки, Check(module_publisher)
      на module:<поле module ЗАПРОСА> (scope_extractor из поля запроса, не из тела),
      затем лимит размера, затем разбор; поле module документа обязано совпасть с
      полем запроса — иначе INVALID_ARGUMENT. Чужое тело не разбирается до решения
      о доступе.
    held_by: >-
      нужен гейт: проба порядка (тело, не разбираемое как YAML, от учётки без
      права → PERMISSION_DENIED, а не INVALID_ARGUMENT) + положительный близнец
    state: open
  - id: CE-08
    decision: Р2 — Publish мутирует → Operation (ban #9); «реплики перешли» не входит в done
    class: R
    condition: >-
      Operation терминальная (форма Apply kaname#865): done = ревизия и модель закоммичены,
      и только; ожидания перехода реплик внутри Publish нет (api-operation-done).
      Схождение реплик наблюдается отдельно — ревизией модели в решении и метрикой.
    held_by: >-
      TestSLP_OperationsLaneProducersAreCountedFromTheTree (kacho; в kaname имени не
      найдено — держатель формы Operation в kaname назвать в приёмке)
    state: open
  - id: CE-09
    decision: Р2 — Plan как пробный прогон Publish
    class: UN
    condition: >-
      Plan и Publish — ОДИН конвейер (разбор → классификация → сборка → допуск →
      перечень выдач без опоры), Plan откатывает транзакцию вместо коммита; второй
      реализации сравнения не заводится. Plan возвращает отпечаток состояния (базовая
      ревизия модуля + ревизия модели), Publish и сужение его подтверждают; сдвиг —
      FAILED_PRECONDITION с указанием перепланировать.
    held_by: >-
      нужен гейт: парная проба на одном входе — вердикт Plan равен исходу Publish
      (arch-lanes-compare-norm); проба гонки Plan → чужая публикация → Publish с
      устаревшим отпечатком отвергнут
    state: open
  - id: CE-10
    decision: Р2 — только внутренний слушатель (ban #6), прямой вызов модулем, не через край
    class: 'I; security sec-ban6'
    condition: >-
      Сервис с префиксом Internal; на внешнем слушателе не монтируется; в перечень
      GatewayFrontedInternalRPCs Publish НЕ входит (вызывает учётка деплоя модуля,
      не край), сужение — ВХОДИТ (Р5). Сторожевая политика вызывающего для Publish
      исполняется в КАЖДОМ режиме посадки (как SAN-перечень MintBootstrapToken), без
      ветки «вне боевого режима — пропуск».
    held_by: >-
      нужен гейт в kaname: перепись монтирования Internal*-сервисов против
      дескрипторов; проба «режим не боевой, SAN не издателя → отказ»
    state: open
  - id: CE-11
    decision: Р2/Р7 — лимит размера документа
    class: 'U; security sec-no-silent-default-for-guarded-knob'
    condition: >-
      Потолок размера — объявленная ручка KANAME_<…> с отказом старта при
      незаданной; проверяется до разбора (CE-07); транспортный предел приёма у
      слушателя задан явно не ниже потолка (сегодня MaxRecvMsgSize не задан нигде —
      действует умолчание транспорта). Число — от замера N-07 (наибольший манифест
      78 375 Б) с запасом, названным в приёмке.
    held_by: проба «потолок + 1 Б → INVALID_ARGUMENT с именем ручки»; boot-guard на ручку
    state: open

  # ── Р3. Допуск модели целиком, подмена на репликах, ревизия в решении ──────────────
  - id: CE-12
    decision: Р3 — снимается инвариант authzmodel «установка однажды, после первого чтения — отказ»
    class: R
    condition: >-
      Решение о доступе берёт снимок модели ОДИН раз в начале запроса (atomic-указатель)
      и все планы этого запроса строит по нему; второго вызова получения модели в
      одном решении нет. Кеш планов принадлежит снимку модели (новый снимок —
      новый кеш), ключ «тип.отношение» вне снимка не живёт. Ошибки
      ErrModelAlreadyRead/ErrModelAlreadyInstalled снимаются вместе с пробами,
      которые их держали, а не остаются мёртвыми ветками.
    held_by: >-
      нужен гейт (AST): в функции решения получение модели — не более одного раза;
      радиус — 4 прод-вызова authzmodel.Shared() и 9 тест-файлов (N-04)
    state: open
  - id: CE-13
    decision: Р3 — «атомарно на всех репликах» + «отстающая реплика отвечает закрытым отказом»
    class: CH
    condition: >-
      Отставание определено проверяемо: реплика держит (ревизия модели,
      подтверждена-в); если подтверждения новее окна W нет, решения — закрытый отказ
      ОДНОГО объявленного вида. Вид — UNAVAILABLE (повторяемый), а не allowed=false:
      «не знаю текущей модели» и «прав нет» различимы для вызывающего, иначе
      потребитель кеширует отрицательный вердикт. W — объявленная ручка без
      умолчания, boot-guard.
    held_by: >-
      нужен гейт: проба «реплика с остановленным источником ревизий через W отвечает
      UNAVAILABLE, не deny»; приёмка обязана назвать код (вернуть в приёмку RA3)
    state: open
  - id: CE-14
    decision: Р3 — доставка новой модели на реплики (без брокера, ban #7)
    class: 'R; architecture arch-lanes-compare-norm'
    condition: >-
      Модель, факты каталога (снимок, окно 15 с, KANAME_CATALOG_SNAPSHOT_REFRESH_INTERVAL_MS),
      правила ролей — одна несущая на одну ревизию, подменяемая одним указателем;
      решение не сочетает модель ревизии N+1 с фактами каталога ревизии N. Механизм
      сигнала (LISTEN/NOTIFY + опрос-страховка) общий для обеих полос.
    held_by: >-
      нужен гейт сравнения полос: «полос N · несут одну ревизию M» (arch-lanes-gate-census)
    state: open
  - id: CE-15
    decision: Р3 — сборка при публикации, реплики подменяют готовую модель
    class: UN
    condition: >-
      Собранный и допущенный текст модели хранится в базе ревизией модели с
      отпечатком; реплика не пересобирает, а загружает по ревизии, сверяет отпечаток
      и разбирает; несовпадение или ошибка разбора — реплика остаётся на прежней и
      по истечении W отвечает как отстающая (CE-13), а не ставит частичную модель.
    held_by: проба «повреждённый текст ревизии → реплика не переходит, счётчик отказа загрузки растёт»
    state: open
  - id: CE-16
    decision: Р3 — допуск против ЖИВЫХ выдач
    class: UN
    condition: >-
      Стоимость допуска — на публикацию, не на решение; растёт с числом выдач и
      названа числом p50/p95 (заказ замера) до выбора формы; чтение выдач — в той же
      транзакции, что CAS (CE-02), иначе допуск судит не то состояние, которое
      коммитится.
    held_by: замер на внешнем кластере (заказ O-2); затем бюджет в приёмке
    state: open
  - id: CE-17
    decision: Р3 — «ревизия модели видна в решении»
    class: 'K; api-outcome-remove'
    condition: >-
      Новое поле — НОВЫЙ номер и НОВОЕ имя: номер 3 и имя authorization_model_id в
      AuthorizeCheckResponse (и номер 4 во втором сообщении) зарезервированы и не
      переиспользуются. Поле заполняется на каждом решении (allow и deny) из ТОГО
      ЖЕ снимка, по которому принято решение (CE-12).
    held_by: buf breaking/резерв в proto; проба «ревизия в ответе = ревизия снимка решения»
    state: open
  - id: CE-18
    decision: Р3/Р9 — старт без каталога, модель из базы; часть модуля ещё не опубликована
    class: U
    condition: >-
      Три состояния части модуля первоклассны и различимы данными: «не
      опубликована» · «живая ревизия N» · «надгробие». Отсутствие строки ≠ снятие
      (урок kacho#1027). Решение по типу неопубликованного модуля — объявленный
      отказ со своей причиной, отличной от «тип снят».
    held_by: пары проб по трём состояниям; приёмка называет коды (RA10)
    state: open

  # ── Р4. Тип module:<имя>, отношение module_publisher, учётка деплоя ───────────────
  - id: CE-19
    decision: Р4 — модуль учётки определяется выдачей, не именем
    class: 'K; data-integrity no-region-from-zone-name (тот же род)'
    condition: >-
      Модуль, за который вправе публиковать учётка, определяет ТОЛЬКО
      Check(module_publisher) на module:<имя>; разбор суффикса SAN (сегодня
      фиксированный сегмент kacho-<svc>) модуль не выводит. Словарей три и они
      расходятся (N-08: модуль loadbalancer, типы nlb_*, SAN kacho-nlb) — никакого
      вывода одного из другого.
    held_by: 'нужен гейт: проба «SAN с именем, совпадающим с модулем, без выдачи → отказ»'
    state: open
  - id: CE-20
    decision: Р4 — публикует учётка деплоя, не рабочая учётка пода
    class: 'security hard-machine-gets-grant'
    condition: >-
      Рабочая учётка модуля (тот же лист, которым модуль ходит в kaname; для
      registry-operator это kacho-registry, polyrepo poly-external-operators)
      module_publisher НЕ держит; учётка деплоя держит его ровно на свой module:<имя>.
    held_by: >-
      нужен гейт: отрицательный близнец «рабочий лист публикует свой модуль →
      PERMISSION_DENIED» рядом с положительным «лист деплоя → принят»
    state: open
  - id: CE-21
    decision: Р4 — выдачи module_publisher объявляет встроенный манифест kaname
    class: 'security hard-wildcard-relation-not-authz'
    condition: >-
      Отношение module_publisher допускает только [service_account], без класса
      system_class и без подстановки; встроенный манифест kaname — канон, а допуск
      канон по подстановке НЕ судит (TestAdmitCanonWildcardIsNotJudged), значит
      нужна своя проба на это отношение.
    held_by: 'нужен гейт: проба «module_publisher не выполним подстановкой/классом»'
    state: open
  - id: CE-22
    decision: Р4 — модуль пишет только в своё пространство имён и точки расширения
    class: K
    condition: >-
      Пространство имён модуля — закрытый перечень, объявленный ДАННЫМИ встроенного
      манифеста kaname (модуль → допустимые типы/префиксы, точки расширения), а не
      выведенный из имени модуля; запись вне перечня — отказ с именем типа. Сегодня
      понятия нет вовсе (N-09).
    held_by: вернуть в приёмку (RA2); затем пара проб «свой тип / чужой тип»
    state: open
  - id: CE-23
    decision: Р4 — проверка права у движка отношений
    class: CH
    condition: >-
      Исходов три и они различны: разрешено · запрещено → PERMISSION_DENIED ·
      движок/база не ответили → UNAVAILABLE (fail-closed); корзины «прочее» нет.
    held_by: тройка проб на Publish
    state: open
  - id: CE-24
    decision: Р4 — модель против канона (НОРМА 2 «канон неприкосновенен»)
    class: K
    condition: >-
      Свой тип модуль может менять только если тип не принадлежит канону образа.
      Сегодня 20 из 33 типов канона — типы модулей kacho (N-03), и опубликованный
      блок такого типа обязан быть побайтно равен канону. Либо канон сужается до
      типов kaname (и таблица типов образа ReferentShippedTable вместе с ним), либо
      «расширение» значит «только новые типы». Без решения Р5 неисполним.
    held_by: вернуть в приёмку (RA1), вопрос Q2
    state: open

  # ── Р5. Расширение — модуль, сужение с выдачами без опоры — человек ───────────────
  - id: CE-25
    decision: Р5 — классификация дельты ревизии
    class: CH
    condition: >-
      Классификатор дельты отдаёт ЗАКРЫТЫЙ набор: расширение · сужение без
      осиротевших выдач · сужение с осиротевшими выдачами; неклассифицированное
      (переименование, смена родителя, смена условия) судится как худший исход —
      сужение с осиротевшими.
    held_by: 'нужен гейт: таблица проб по видам дельты, в т.ч. переименование'
    state: open
  - id: CE-26
    decision: Р5 — «выдачи без опоры» считаются в момент коммита, не плана
    class: R
    condition: >-
      Перечень осиротевших выдач пересчитывается в транзакции коммита сужения;
      выдача, созданная между Plan и коммитом, либо видна пересчёту, либо не может
      сослаться на снимаемый глагол/тип по ограничению базы (ключ живости строки
      каталога), — а не теряется молча.
    held_by: 'нужен гейт: проба гонки «Plan → новая выдача → сужение» видит выдачу'
    state: open
  - id: CE-27
    decision: Р5 — сужение проводит человек с system_admin через усиленный вход
    class: 'P; arch-lanes-compare-norm'
    condition: >-
      Сужение — отдельный глагол в перечне GatewayFrontedInternalRPCs с
      required_acr_min «2» (пол ACR действует только на членов перечня); Publish
      модулем на сужении с осиротевшими отвечает FAILED_PRECONDITION с указанием
      пути. Обе полосы идут одним конвейером (CE-09), различаются только допуском.
    held_by: >-
      authzguard.NewACRFloor на перечне; нужна проба «тот же документ: модуль → отказ,
      человек без ACR 2 → отказ, человек с ACR 2 → принят»
    state: open
  - id: CE-28
    decision: Р5/Р7 — аудит
    class: 'U; security hard-audit-writes-both'
    condition: >-
      Актор — из проверенной личности (PrincipalFromContextOK; без неё — отказ до
      транзакции, как ErrNoVerifiedActor); запись аудита — в той же транзакции, что
      ревизия; несёт и актора, и вид полосы (учётка деплоя / Job импорта / человек).
      Отказы публикации (чужой модуль, потолок) — счётчик по причине; «ноль отказов
      за жизнь» наблюдаем.
    held_by: >-
      modulecatalog/audit.go даёт форму для Apply; для Publish — нужна проба «отказ
      транзакции → записи аудита нет, счётчик отказа +1»
    state: open

  # ── Р6. Надгробия без каскада, id не переиспользуются ──────────────────────────────
  - id: CE-29
    decision: Р6 — снятие типа и модуля надгробием; повторного использования имени нет
    class: 'I; data-integrity db-unique'
    condition: >-
      Уникальность имени типа и модуля — БЕЗ частичного условия «живая» (надгробие
      держит имя навсегда); повторная публикация снятого типа — FAILED_PRECONDITION.
      Выдачи на снятый тип остаются строками (каскада нет), решение по ним — отказ
      со своей причиной.
    held_by: 'нужен гейт: integration «надгробие → повторное объявление отвергнуто базой»'
    state: open
  - id: CE-30
    decision: Р6 — снятие модуля
    class: U
    condition: >-
      Пустой документ и документ без ресурсов снятием модуля не являются
      (INVALID_ARGUMENT); снятие модуля — явный глагол, проводимый по правилу сужения (CE-27).
    held_by: пара проб; приёмка называет глагол (RA9)
    state: open

  # ── Р7. Лимиты частоты ──────────────────────────────────────────────────────────
  - id: CE-31
    decision: Р7 — лимит частоты публикаций
    class: 'UN; data-integrity ban #10'
    condition: >-
      Предел глобален, а не на реплику: держится оператором базы в транзакции
      публикации (образец — окно темпа identity_admission_windows с триггером),
      а не токен-корзиной процесса, которая при N репликах даёт N-кратный предел.
      Окно и предел — объявленные ручки без умолчания.
    held_by: 'нужен гейт: проба на двух процессах против одной базы — предел общий'
    state: open

  # ── Р8. Чарты: Job импорта и шаблон Job публикации ──────────────────────────────
  - id: CE-32
    decision: Р8 — Job импорта из ConfigMap в чарте kaname (переходный клиент)
    class: 'security hard-machine-gets-grant; ban #11'
    condition: >-
      Учётка Job импорта держит module_publisher ровно на модули, чьи документы она
      доставляет (закрытый перечень), а не на все; переходность выражена предметом с
      предикатом снятия (исход ban11-three-outcomes), а не словом «переходный».
    held_by: перепись выдач учётки Job; предикат снятия в приёмке
    state: open
  - id: CE-33
    decision: Р8 — повтор Job (hook, рестарт)
    class: CH
    condition: >-
      Равная ревизия с равным отпечатком — успешный повтор без записи; равная с
      иным — конфликт; младшая — отказ «младшая». Job отличает «kaname ещё не готов»
      (UNAVAILABLE — повтор с бюджетом) от отказов содержимого (не повторять).
    held_by: тройка проб; бюджет повторов Job — объявленный в шаблоне
    state: open
  - id: CE-34
    decision: Р8 — шаблон Job публикации для чартов модулей
    class: 'security hard-control-carries-address-and-credential'
    condition: >-
      Шаблон объявляет ПАРУ: адрес внутреннего слушателя kaname и удостоверение
      учётки деплоя (сертификат её листа); половина пары — отказ рендера. Порядок
      относительно выкатки модуля объявлен (публикация до подъёма кода модуля, которому
      нужны новые глаголы).
    held_by: >-
      декларативная проба values шаблона; где живёт шаблон без правки kacho —
      вопрос Q3
    state: open

  # ── Р9. Снятие чтения каталога на старте ────────────────────────────────────────
  - id: CE-35
    decision: Р9 — второго способа читать манифесты не остаётся
    class: 'I; ban #20 atomic (все импортёры одним изменением)'
    condition: >-
      Одним изменением снимаются оба прод-вызова читателя доставки (старт и адаптер
      глаголов, N-05) и переезжают на базу все шесть потребителей доставленного в
      serve.go (опора, композиция, применение каталога, модель против каталога, роли,
      посев). Ручка manifests.dir/required снимается как ломающее изменение: заданная
      — отказ старта с текстом о замене, не молчаливое игнорирование.
    held_by: >-
      перепись «вызовов LoadDelivered/CheckDelivery в прод-коде = 0»; проба «ручка
      задана → отказ старта»; TestNoDeferredWorkInTheTree
      (internal/check/deferred_work_test.go) против маркеров отсрочки
    state: open
  - id: CE-36
    decision: Р9 (неявное) — судьба Plan/Apply из kaname#865
    class: 'K; api-outcome-remove'
    condition: >-
      Plan/Apply перечитывают каталог доставки — без него теряют вход. Исход
      объявляется: переосновать на ревизии базы либо снять с reserved номеров и имён.
      Их маршруты держит край kacho (7 файлов, N-06) — снятие ломает kacho при
      перепине; это называется в коммите и в приёмке, kacho сейчас не правится.
    held_by: вернуть в приёмку (RA4)
    state: open

