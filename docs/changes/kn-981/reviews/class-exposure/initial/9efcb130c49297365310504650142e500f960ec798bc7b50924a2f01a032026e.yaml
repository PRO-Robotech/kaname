questions:
  - id: Q1
    text: >-
      kaname#981 Blocked by kaname#906, а kaname#906 требует kacho#3303 (П2, правка kacho) — владелец
      отложил kacho. Варианты: (а) ждать П2 — kaname не добивается до kacho, против
      решения 2026-10-23; (б) требование ревизии вносится в Publish в kaname (S2 kaname#906
      переезжает в проверку Publish, чтение каталога снимается всё равно), манифесты
      kacho получают revision при перепине; цена — сценарии Job импорта на
      манифестах kacho зеленеют только после перепина; (в) Publish принимает
      документ без ревизии — подстановка (CE-05), отвергается. Рекомендация — (б).
