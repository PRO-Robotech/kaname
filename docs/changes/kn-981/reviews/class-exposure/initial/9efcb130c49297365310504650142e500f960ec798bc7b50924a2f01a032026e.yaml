# Первичный разбор классов дефектов — роль class-exposure-analyst — изменение kn-981
# (kaname#981 «Модули публикуют манифесты сами: ревизии в базе, Publish, живая модель»,
# эпик kaname#980).
#
# ПРЕДМЕТ — ТЕЛО ЗАДАЧИ, А НЕ ПРИЁМКА. Приёмки «публикация части модуля» ещё нет: порядок
# задачи (п.3 «Зависимости и порядок») ставит разбор ДО приёмки, и задание диспетчера
# называет режим «первичный разбор (до приёмки)». Имя файла — sha256 тела задачи
# (предикат в subject). Когда приёмка будет одобрена, первичный разбор на её отпечаток
# обязателен по change-graph §4; эта запись станет его входом, и тот разбор судит дельту
# (flow-acceleration fa-b1). Запись не правится — она свидетельствует о своей редакции тела.
#
# Пакета контура (change.yaml, holders.yaml) у kn-981 нет; запись их не заводит — это не
# предмет роли.
#
# Классы называются разделом скилла code-authoring по ИМЕНИ:
#   U  — «Умолчание, которое становится утверждением»
#   R  — «Решение и его следствие разнесены»
#   CH — «Чужой ответ: классификация и бюджет»
#   P  — «Порядок операций внутри кода»
#   K  — «Контракт, который нельзя выразить»
#   UN — «Унификация и стоимость»
#   I  — «Инвариант и оснастка — это тоже прод-код»
#
# Публичное дерево: предмет, решение и следствие для контракта — да; сборки
# «координата + условие + следствие» — нет (security-disclosure.md §«Публичные артефакты»).
schema_version: 1
