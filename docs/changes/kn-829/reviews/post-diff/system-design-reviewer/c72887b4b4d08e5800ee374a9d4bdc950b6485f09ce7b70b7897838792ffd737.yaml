critical:
  - id: SD-829-1
    where: internal/migrations/20261015120000_anonymous_and_authenticated_are_subject_classes.sql:255-297 (не переобъявлена kaname.relation_fact_fold_row из 20261005040457_relation_fact_fold_takes_locks_in_one_order.sql)
    class: окно катящейся выкатки — тихая порча, лишнее право
    finding: >-
      Мигратор — init-контейнер нового пода (deploy/templates/deployment.yaml,
      RollingUpdate по умолчанию), значит прежний под служит на новой схеме.
      Прежний под снимает публикацию (RegisterResource снятие объекта либо
      published=false: register_resource.go ApplyTx(...false...) →
      public_read.ApplyTx → EmitPublicationTx с proxytuple.PublicReadSubject =
      user:*) строкой журнала fga.tuple.delete user:* #v_get. Свёртка делает
      DELETE ... WHERE subject = 'user:*' — ноль строк, без ошибки. Факт
      system_class:anonymous #v_get остаётся, а надгробие public_read_publication
      уже записано этой же версией, и повтор доставки «не новее» — не лечит
      никто. По шапке самого register_resource.go id репозитория — его имя:
      уцелевшая публикация отдаёт анонимное чтение следующему репозиторию с тем
      же именем. CHECK relation_fact_subject_not_wildcard ловит только ЗАПИСЬ
      подстановки; удаление проходит мимо. Пробы на путь снятия нет
      (system_class_wildcard_check_integration_test.go судит только fga.tuple.write).
    requirement: >-
      Переобъявить в этой миграции kaname.relation_fact_fold_row так, чтобы
      входное слово соседа в журнале сворачивалось в хранимого субъекта
      (user:* + v_get → system_class:anonymous; прочее user:* →
      system_class:authenticated) И на записи, И на снятии — тот же перевод, что
      у переписи п.3; либо, минимум, снятие с субъектом-подстановкой отвергать
      RAISE (транзакция прежнего пода откатывается целиком вместе с надгробием,
      владелец повторяет доставку, её принимает новый под). Down — вернуть
      прежнее тело.
    predicate: >-
      Проба на P2 после goose.Up: факт system_class:anonymous #v_get
      registry_repository:r-x с source_version V0; INSERT в kaname.fga_outbox
      ('fga.tuple.delete', {user:'user:*', relation:'v_get',
      object:'registry_repository:r-x', source_version:V1>V0}). Сейчас: вставка
      принята И SELECT count(*) FROM kaname.relation_fact WHERE object_id='r-x'
      AND subject='system_class:anonymous' = 1 — красное. Зелёное: count = 0
      (перевод) либо вставка отвергнута ошибкой базы (отказ). Близнец — то же
      снятие с subject system_class:anonymous → count 0.

important:
