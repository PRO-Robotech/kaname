    where: internal/migrations/20261015120000_anonymous_and_authenticated_are_subject_classes.sql:79-87; docs/engineering/acceptance/anonymous-and-authenticated-are-subject-classes.md (нет раздела)
    finding: >-
      Порядок выкатки не описан нигде в диффе (поиск «выкатк|прежн* выпуск»
      по диффу: только окно L4–L6 и шапка миграции о писателе прежней версии).
      Поведение окна по факту: прежний вердикт ищет 'user:*' литералом
      (origin/746 relverdict/query.go:361,889, list.go:168) — после наката
      прежние поды ОТКАЗЫВАЮТ в анонимном чтении публичных репозиториев и в
      чтении справочника вошедшим, до замены последнего пода (закрыто, не
      порча). Запись публикации прежним подом — 23514 от проекции, откат
      транзакции целиком (отказ — верно). Правка роли прежним подом не несёт
      GuardSystemClassReads — роль, выданная классу, может получить пишущий
      глагол; вред держат фильтр classVerbFilterSQL и classReadSelectors (SC-23).
    requirement: >-
      Описать в шапке миграции или в операторском документе: накат —
      init-контейнером первого нового пода; что ломается у прежних подов в
      окне (три пункта выше) и что окно закрывается заменой последнего пода;
      либо выкатка с maxSurge/maxUnavailable, сводящей окно к нулю, названная
      ручкой чарта. После SD-829-1 пункт о снятии публикации уходит.
  - id: SD-829-3
    where: internal/migrations/20261015120000_anonymous_and_authenticated_are_subject_classes.sql:266-297
    finding: >-
      Между DO-переписью и ADD CONSTRAINT прежний под может закоммитить новый
      факт user:* (запись ещё без ограничения) — тогда проверка ограничения
      отвергнет миграцию целиком, init-контейнер повторит. Громко и сходится, но
      миграция может не сходиться под постоянной публикацией прежних подов.
    requirement: 'не блокирует; LOCK TABLE kaname.relation_fact, kaname.access_binding_emitted_tuples IN SHARE ROW EXCLUSIVE MODE до п.3 убирает гонку.'

checked_ok:
  sc22_lock: >-
    Сторона выдачи: BEFORE-триггер access_bindings_role_is_live (0001_initial.sql:259)
    берёт строку роли FOR SHARE до вставки субъекта; страж класса перечитывает
    её FOR SHARE новым оператором (plpgsql VOLATILE — свежий снимок). Сторона
    правки: GuardSystemClassReads — FOR NO KEY UPDATE до вопроса о выдачах,
    вопрос — новым оператором. Замки несовместимы, обе очерёдности дают ровно
    одну проходящую; FOR NO KEY UPDATE не конфликтует с FOR KEY SHARE внешнего
    ключа — взаимного ожидания нет; замок не меняет xmin, CAS UpdateCAS цел.
    Правка субъекта существующей выдачи (без смены роли) — замок берёт сам
    страж класса, вывод тот же. Проба — 4 кейса в обе стороны с ожиданием по
    pg_stat_activity (system_class_role_edit_race_integration_test.go:331-379).
  relverdict_lateral: >-
    CROSS JOIN LATERAL (... OFFSET 0) по (subject_type, subject_id,
    resource_type, resource_id) — семантика внутреннего соединения сохранена,
    ограда держит порядок; пустой слот класса ($10/$11 = '') не совпадает ни с
    одной строкой. classVerbFilterSQL стоит на всех четырёх соединениях с
    role_verb (query, list, expand, subjects), алиас bs в каждом есть.
  publication_translation_write: >-
    Новый под пишет system_class:anonymous одним производителем
    (domain.PublicationSubject); разбор остаточных фактов узнаёт хранимую
    пару (IsStoredPublication) — прежний путь «не наш» по совпадению закрыт.
  atomicity: 'надгробие публикации и строка журнала — одна транзакция; проекция — триггер оператора той же фиксации; двойной записи нет.'
  edges: 'новых межсервисных рёбер нет; внешних вызовов дифф не добавляет.'

