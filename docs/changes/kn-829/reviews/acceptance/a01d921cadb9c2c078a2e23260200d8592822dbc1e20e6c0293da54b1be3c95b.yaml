minor:
  - >-
    Ветвь стража «форма порождённого идентификатора» в перечне (в) держит единственное значение,
    проходящее основную форму, — `ak-0123456789abcdefg`; ближайшего положительного близнеца у
    неё нет. Посев рецензента: `ak-0123456789abcdef` (16 знаков) принят. Добавить его в пробу
    DeclaredFormIsAccepted — тогда ветвь отличается от принятого ровно длиной хвоста.
  - >-
    Следствие формы, а не дефект: имя вида `<2–4 буквы>-<17 знаков crockford>` (например
    `pull-` + 17 знаков) отвергается, хотя двухсловно. Стоит назвать это в документации ручки.
