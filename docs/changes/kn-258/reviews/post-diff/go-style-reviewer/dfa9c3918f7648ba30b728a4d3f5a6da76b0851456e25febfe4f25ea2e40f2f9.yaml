      закомментировано, правило клетку не читает, а проба зелёная. Утверждение С1
      («правило несёт отбор клетки») при этом ложно.
    requirement: >-
      Перед поиском селекторов срезать комментарии PromQL (от `#` вне строкового
      литерала до конца строки). В инъекцию добавить близнеца: тот же lawful-текст,
      в котором слагаемое закомментировано, — это должно давать находку.
    return_to: автор диффа kaname#258 (полоса N-OBS)

