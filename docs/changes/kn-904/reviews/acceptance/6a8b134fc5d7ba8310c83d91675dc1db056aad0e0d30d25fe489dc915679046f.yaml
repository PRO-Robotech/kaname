    kind: DoD
    claim: >-
      Стадия S2 «край (`PRO-Robotech/kacho`, newman)», DoD S2 п.1–3, таблица держателей (строка
      ATC-E1, -E2) и П4 называют `tests/newman/cases/` в kacho и кейс
      `IAM-ACB-RD-CR-TARGET-UNKNOWN-TYPE-NEG` там же. В kacho на fd9f1793e7 такого каталога нет,
      кейс живёт в kaname.
    predicate: >-
      git -C project/kacho ls-tree --name-only fd9f1793e7 tests/newman/cases/ → пусто;
      git -C project/kacho grep -n 'target.resources\[\]' fd9f1793e7 → 0 попаданий;
      kacho tools/mixedoutcomeaudit/mixed_outcome_audit.py:1596 @fd9f1793e7 — кейс «ушёл вместе
      с [iam] в самостоятельный продукт»;
      kaname tests/newman/cases/iam-access-binding-redesign.py:243 @b800272d5341 — id кейса,
      утверждение `to.include('Illegal argument target.resources[].type')` (вхождение — верно);
      kaname tests/newman/scripts/run.sh:36-41 и .github/workflows/e2e-newman.yml (job `stand`) —
      набор kaname гонится к краю платформы на собственном стенде kaname.
    consequence: >-
      DoD S2 неисполним в названном месте (п.3 требует зелени кейса, которого в kacho нет), а
      заказ «задача kacho на S2» уводит держателя края в чужой репозиторий за пересборкой с
      пином, хотя набор kaname уже гонит голову kaname через край.
    fix: >-
      Перенести ATC-E1, ATC-E2 в kaname `tests/newman/cases/iam-access-binding-redesign.py`
      (тот же файл, что соседний NEG-кейс); DoD S2 переписать на kaname и e2e-newman его CI;
      снять условие «после влития S1 и пересборки края с пином», если оно не нужно (контракт
      меняется лишь комментарием, Р6); поправить координату в П4.

