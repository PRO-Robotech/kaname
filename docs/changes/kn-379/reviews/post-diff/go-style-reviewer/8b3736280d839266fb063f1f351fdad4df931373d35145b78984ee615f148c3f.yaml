critical:
  - id: HOOK-LANE-CUTOFF-READ-UNBOUNDED
    coord: internal/handler/iamhooks/token_hook_handler.go:558
    related:
      - internal/revocationpolicy/revocationpolicy.go:121
      - internal/handler/iamhooks/refresh_hook_handler.go:323
      - cmd/kaname/hooks_mux.go:80
      - internal/clienttokenwire/build.go:140
    property: >-
      Чтение отсечки отзыва-всех на полосах хука идёт с контекстом запроса без
      собственного предела времени на вызов; у полосы эндпоинта тот же читатель
      обёрнут объявленным пределом. Вызов на полосе хука переписан этим диффом
      (переход на revocationpolicy.AtIssuance). Одно чтение одного механизма
      несёт разный предел в зависимости от полосы (architecture.md
      arch-per-call-deadline; arch-lanes-compare-norm).
    requirement: >-
      Дать чтению отсечки на полосах хука тот же объявленный предел на вызов, что
      у эндпоинта: обернуть общий читатель один раз в композиционном корне хуков
      (тот же вид обёртки, что WithDeadlineCutoffs), чтобы оба хука и эндпоинт
      читали строку под одним пределом. Предел закрепить пробой, которая идёт
      через сборку, а не через обёртку напрямую (см. important
      DEADLINE-PROBE-BYPASSES-COMPOSITION).
    predicate: >-
      @1f73660b: `grep -l "context.WithTimeout\|context.WithDeadline"
      $(ls internal/handler/iamhooks/*.go | grep -v _test) cmd/kaname/hooks_mux.go
      internal/revocationpolicy/revocationpolicy.go | wc -l` → 0 (осмотрено 13 файлов);
      контроль `grep -c context.WithTimeout internal/clienttokenwire/build.go` → 4.
      Путь: token_hook_handler.go:253 `ctx := r.Context()` → :367 → :558 →
      revocationpolicy.go:121 → UserTokenRevocationRepo.RevokedBefore (QueryRow(ctx)).
    return_to: автор диффа (полоса #379)

