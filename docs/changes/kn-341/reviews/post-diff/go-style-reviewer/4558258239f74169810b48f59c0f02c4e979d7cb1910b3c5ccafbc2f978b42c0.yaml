# ── что проверено и на чём основано ────────────────────────────────────────
approved:
  error_assertions: >-
    полоса отказа судится через `errors.Is(err, iamerr.ErrInternal)`, а не
    сравнением текста; текст отказа и имя типа утверждаются ДОПОЛНИТЕЛЬНО, как
    наблюдаемое (hard-regression-asserts-message), и сравниваются с одним
    выписанным литералом `cutoffDoorRefusalText`, общим для отрицания близнеца
    пула и утверждения третьего вида
  lawful_twins_one_fact: >-
    третий вид и близнец «транзакция» получают один регистратор и один вход и
    различаются только видом исполнителя; близнец «пул» доказывает взятие
    своей ветви счётчиком набора адреса (`dials == 0` → Fatal), а не
    отсутствием слов в тексте отказа
  fake_cannot_be_green: >-
    `declaredTxCutoffExecutor` встраивает пустой `pgx.Tx`: любой вызов двери
    помимо Exec (например, вложенное начало) упадёт на пустом значении громко;
    регистратор отвечает настоящим CommandTag, контракт Exec не ослаблен
  no_database_needed: >-
    ветвь `default` стоит после проверки входа и до первого оператора
    (user_token_revocations_repo.go:114-154); пакетный TestMain
    (testmain_test.go:50) поднимает Postgres лишь по первому обращению к
    pgtest, а новые пробы к нему не обращаются. Внешний адрес пула не
    набирается: DialFunc подменён и сразу отказывает
  cleanup: 'пул закрывается `t.Cleanup(pool.Close)` сразу после создания'
  no_panic_in_prod_path: 'прод-код не тронут; panic/Must*/log.Fatal в диффе нет'
  context: >-
    тестам передаётся `context.Background()` — это соглашение пакета:
    `t.Context()` не использует ни один тест internal/repo/kaname/pg
    (перемерено `git grep -c 't\.Context()'` → 0 файлов)
  imports_convention: >-
    алиас `stderrors "errors"` — соглашение пакета (встречается в прод-файле
    access_key_repo.go:28 и в 45 тестовых файлах пакета pg на 458e4fe3); все импорты
    используются
  layering: >-
    проба лежит в пакете адаптера repo и импортирует pgx — законно для этого
    слоя; это не проба use-case, Postgres она не поднимает
  internal_package_placement: >-
    внутрипакетная проба (package pg) — законная форма в этом каталоге: таких
    файлов 32 рядом с 270 файлами package pg_test; нужна она, потому что дверь
    неэкспортируема, а каждый экспортируемый вызывающий отдаёт ей статически
    типизированный пул либо pgx.Tx
  naming_ascii: >-
    все идентификаторы латиницей (запрет #17): сканер go/scanner по файлу на
    458e4fe3 прочёл 282 идентификатора, не-ASCII — 0; положительный контроль
