# ── что проверено и на чём основано ────────────────────────────────────────
approved:
  error_assertions: >-
    полоса отказа судится через `errors.Is(err, iamerr.ErrInternal)`, а не
    сравнением текста. Текст отказа и имя типа проверяются дополнительно, как
    наблюдаемое (hard-regression-asserts-message). Сверка идёт с одним литералом
    `cutoffDoorRefusalText`, общим для отрицания у близнеца «пул» и для
    утверждения о третьем виде
  lawful_twins_one_fact: >-
    третий вид и близнец «транзакция» получают один регистратор и один вход,
    разница между ними — только вид исполнителя. Близнец «пул» доказывает, что
    взята его ветвь, счётчиком набора адреса (`dials == 0` → Fatal), а не
    отсутствием слов в тексте отказа
  fake_cannot_be_green: >-
    `declaredTxCutoffExecutor` встраивает пустой `pgx.Tx`, поэтому любой вызов
    двери, кроме Exec, громко упадёт на пустом значении. Регистратор отвечает
    настоящим CommandTag, контракт Exec не ослаблен
  no_database_needed: >-
    ветвь `default` стоит после проверки входа и до первого оператора
    (user_token_revocations_repo.go:114-154). Внешний адрес пула не набирается:
    DialFunc подменён и сразу отказывает
  cleanup: 'пул закрывается `t.Cleanup(pool.Close)` сразу после создания (:183)'
  no_panic_in_prod_path: 'прод-код не тронут; panic/Must*/log.Fatal в диффе нет'
  context: >-
    тестам передаётся `context.Background()`, так принято в пакете:
    `t.Context()` не использует ни один тест internal/repo/kaname/pg
  imports_convention: >-
    алиас `stderrors "errors"` принят в пакете pg; все импорты используются
  layering: >-
    проба лежит в пакете адаптера repo и импортирует pgx, для этого слоя это
    законно. Это не проба use-case, и Postgres она не поднимает
  internal_package_placement: >-
    внутрипакетная проба (package pg) — законная форма в этом каталоге. Нужна
    она потому, что дверь неэкспортируема, а каждый экспортируемый вызывающий
    передаёт ей статически типизированный пул либо pgx.Tx
  naming_ascii: >-
    все идентификаторы латиницей (запрет #17); кириллица только в комментариях
    и текстах отказа, это законно
  domain_types: 'id входа — domain.UserID из нетипизированных констант, голых string-полей не заведено'

