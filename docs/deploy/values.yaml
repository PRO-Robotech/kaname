name: kaname-docs
replicas: 1
image: kaname-docs:dev
imagePullPolicy: IfNotPresent
port: 8080

ingress:
  enabled: true
  host: kaname-docs.kacho.local

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

# Explicit installation authority for registration (kaname#1031). Required in
# production. Omitted has no default; to intentionally disable all registrars use:
# registrationAccountWriters: { assignments: [], disabled: [] }
# Each assignment: {assignment_id: <new-stable-id>, account_id: <existing-id>, module: registry}
# disabled is an explicit first-upgrade census exception: {account_id, module, reason}.
